      19. Click the Directions button at the upper right of place details.
      20. Click `Go` to generate Current location -> Mountain View Transit Center, Drive, Leave now.
      21. Click the origin field in the route panel and select all its text.
      22. Press Backspace to clear the origin field.
      23. Type `Central Station`.
      24. Click suggestion `Mountain View Transit Center` to set it as origin.
      25. Click the destination field and select all its text.
      26. Press Backspace to clear the destination field.
