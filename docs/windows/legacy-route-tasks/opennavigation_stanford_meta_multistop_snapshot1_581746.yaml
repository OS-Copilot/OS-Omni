  Drive routes must be generated for the path from Meta Headquarters to Googleplex. Subsequently, a three-point
  route sequence from Meta Headquarters to Googleplex via Stanford University must have Transit, Bike,
  Walk, and Drive routes generated. This sequence must then be modified to originate from Current location,
  requiring Walk, Bike, Transit, and Drive routes for the path from Current location to Googleplex via
  Stanford University. The destination of this three-point route must then be changed to Meta Headquarters,
  necessitating Walk, Bike, Transit, and Drive routes for the path from Current location to Meta Headquarters
  via Stanford University. The intermediate stop must be swapped to Googleplex, resulting in a route from
  Current location to Meta Headquarters via Googleplex, for which Transit, Bike, Walk, and Drive routes
  must be generated. The origin of this sequence must then be changed to Stanford University, requiring
  Walk, Bike, Transit, and Drive routes for the path from Stanford University to Meta Headquarters via
  Googleplex. The origin must be reverted to Current location, generating Drive, Transit, Walk, and Bike
  routes for the path from Current location to Meta Headquarters via Googleplex. The intermediate stop
  must be restored to Stanford University, creating the final configuration of Current location to Meta
  Headquarters via Stanford University, for which Walk, Bike, and Transit routes must be generated. The
  final visible state of the application must be the Drive route for Current location to Meta Headquarters
  via Stanford University.
