    source_instruction: |
      1. 点击左侧栏顶部的“Import Photo”。
      2. 在 Windows“打开”对话框左侧点击“Pictures”。
      3. 根据缩略图找到“绿色树林中一位棕色长发女士正对镜头、穿卡其色外套”的图片；该图片文件名为“pe3_forest_longhair_portrait.png”，点击它。
      4. 点击右下角“Open”，将林间长发人物主图载入画布。
      5. 点击右侧固定标签区的“Portrait”。
      6. 将“Smooth”滑块拖到 7，轻度整理人物肤质。
      7. 将“Whiten”滑块拖到 3，保留林间自然光下的肤色。
      8. 将“Rosy”滑块拖到 4，恢复面部健康色泽。
      9. 将“Bright Eyes”滑块拖到 6，增强人物眼神清晰度。
      10. 将“Background Blur”滑块拖到 9，柔化身后的树干和林地。
      11. 点击右侧固定标签区的“HSL”。
      12. 将“Green”滑块拖到 -10，降低林地背景对人物的竞争。
      13. 将“Yellow”滑块拖到 -5，收敛叶片中的暖黄高光。
      14. 点击右侧固定标签区的“Edit”。
      15. 将“Exposure”滑块拖到 4，提亮林下人物面部。
      16. 将“Contrast”滑块拖到 6，保留头发和卡其外套层次。
      17. 将“Sharpen”滑块拖到 7，强化发丝与眼部细节。
      18. 点击右侧固定标签区的“Filters”。
      19. 点击“Portrait”预设，建立户外人物专题的统一起点。
      20. 将“Strength”滑块拖到 22，保留真实林间质感。
      21. 点击顶部“Download”，下载“pe3_forest_longhair_portrait-edited.png”林地人物主图。
      22. 点击左侧栏顶部的“Import Photo”。
      23. 在 Windows“打开”对话框左侧点击“Pictures”。
      24. 根据缩略图找到“一位黑色短卷发女士站在灰色水泥墙前、穿白色无袖上衣并望向侧面”的图片；该图片文件名为“pe3_concrete_shortcurl_portrait.png”，点击它。
      25. 点击右下角“Open”，将水泥墙短卷发人物图载入画布。
      26. 点击右侧固定标签区的“Edit”。
      27. 将“Exposure”滑块拖到 2，保持水泥墙的中性灰度。
      28. 将“Brightness”滑块拖到 5，打开人物眼下和卷发阴影。
      29. 将“Temperature”滑块拖到 -4，收敛原图偏暖的肤色。
      30. 将“Sharpen”滑块拖到 9，强化短卷发和雀斑细节。
      31. 点击右侧固定标签区的“Portrait”。
      32. 将“Smooth”滑块拖到 5，保留雀斑与真实皮肤纹理。
      33. 将“Slim Face”滑块拖到 3，只做轻微轮廓整理。
      34. 将“Bright Eyes”滑块拖到 5，提升侧向目光的清晰度。
      35. 点击右侧固定标签区的“Filters”。
      36. 点击“Cream”预设，为人物图加入克制的柔和层次。
      37. 将“Strength”滑块拖到 18，避免灰墙明显偏暖。
      38. 点击右侧固定标签区的“HSL”。
      39. 将“Orange”滑块拖到 -5，进一步校正面部暖色。
      40. 将“Red”滑块拖到 3，保留嘴唇和面颊的自然血色。
      41. 点击顶部“Download”，下载“pe3_concrete_shortcurl_portrait-edited.png”城市户外人物图。
      42. 点击左侧栏顶部的“Import Photo”。
      43. 在 Windows“打开”对话框左侧点击“Pictures”。
      44. 根据缩略图找到“茂密绿色森林中多层白色瀑布流过深色岩石与苔藓”的图片；该图片文件名为“pe3_forest_waterfall.png”，点击它。
      45. 点击右下角“Open”，将林间瀑布产品背景载入画布。
      46. 点击右侧固定标签区的“Scene”。
      47. 将“Structure”滑块拖到 16，增强岩石、苔藓和水流纹理。
      48. 将“Foliage”滑块拖到 9，整理森林绿色层次。
      49. 将“Cool Tone”滑块拖到 7，突出清凉水景氛围。
      50. 将“HDR”滑块拖到 12，打开岩石暗部和白色水流细节。
      51. 点击右侧固定标签区的“HSL”。
      52. 将“Green”滑块拖到 -8，压低过强的苔藓饱和感。
      53. 将“Cyan”滑块拖到 6，增强水流中的清凉反射。
      54. 将“Blue”滑块拖到 4，维持水景背景的冷色连续性。
      55. 点击右侧固定标签区的“Edit”。
      56. 将“Brightness”滑块拖到 6，提亮林下瀑布层级。
      57. 将“Contrast”滑块拖到 8，区分白色水流和深色岩石。
      58. 将“Sharpen”滑块拖到 10，强化水流与苔藓细节。
      59. 点击右侧固定标签区的“Filters”。
      60. 点击“Clean”预设，形成清晰的产品背景效果。
      61. 将“Strength”滑块拖到 30，控制边缘锐度。
      62. 点击顶部“Download”，下载“pe3_forest_waterfall-edited.png”水景产品背景。
      63. 点击左侧栏顶部的“Import Photo”。
      64. 在 Windows“打开”对话框左侧点击“Pictures”。
      65. 根据缩略图找到“金色日落下的双峰雪山、深绿森林和湖面完整倒影”的图片；该图片文件名为“pe3_snow_lake_mountain.png”，点击它。
      66. 点击右下角“Open”，将雪峰森林湖泊封面载入画布。
      67. 点击右侧固定标签区的“Scene”。
      68. 将“Sky”滑块拖到 13，增强日落云层的层次。
      69. 将“Structure”滑块拖到 12，强化雪峰棱线和森林边缘。
      70. 将“Foliage”滑块拖到 5，保持前景森林深绿而不过饱和。
      71. 将“Warm Sun”滑块拖到 10，保留山峰上的金色夕照。
      72. 将“HDR”滑块拖到 11，平衡雪面高光与森林暗部。
      73. 点击右侧固定标签区的“HSL”。
      74. 将“Yellow”滑块拖到 -8，压低云层中过强的金色。
      75. 将“Green”滑块拖到 -9，避免森林抢过雪峰主体。
      76. 将“Blue”滑块拖到 5，增强天空和湖面冷色呼应。
      77. 点击右侧固定标签区的“Edit”。
      78. 将“Saturation”滑块拖到 -7，统一山湖封面的综合色彩。
      79. 将“Contrast”滑块拖到 -4，保留雪峰和倒影的高光细节。
      80. 点击顶部“Download”，下载“pe3_snow_lake_mountain-edited.png”山湖品牌封面，并停留在该编辑页面。
