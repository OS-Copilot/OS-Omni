    source_instruction: |
      1. 点击左侧栏顶部的“Import Photo”。
      2. 在 Windows“打开”对话框左侧点击“Pictures”。
      3. 根据缩略图找到“黑衣乐手双手演奏蓝绿色木纹电吉他、琴弦和拾音器清晰可见”的图片；该图片文件名为“pe4_bluegreen_guitar.png”，点击它。
      4. 点击右下角“Open”，将蓝绿色电吉他识别图载入画布。
      5. 点击右侧固定标签区的“Scene”。
      6. 将“Structure”滑块拖到 17，强化琴弦、拾音器和木纹。
      7. 将“HDR”滑块拖到 9，打开黑色服装旁的琴体暗部。
      8. 将“Cool Tone”滑块拖到 6，保持蓝绿色琴面的冷色属性。
      9. 点击右侧固定标签区的“HSL”。
      10. 将“Cyan”滑块拖到 -9，收敛琴面过强的青色反射。
      11. 将“Blue”滑块拖到 -6，保留蓝绿层次而不产生荧光感。
      12. 点击右侧固定标签区的“Edit”。
      13. 将“Brightness”滑块拖到 7，提亮琴桥和旋钮周围暗部。
      14. 将“Contrast”滑块拖到 9，增强琴体与黑衣之间的边界。
      15. 将“Sharpen”滑块拖到 13，突出琴弦和金属部件。
      16. 点击右侧固定标签区的“Filters”。
      17. 点击“Clean”预设，建立乐器识别图的清晰基调。
      18. 将“Strength”滑块拖到 31，避免滤镜覆盖琴体木纹。
      19. 点击右侧固定标签区的“Edit”。
      20. 将“Exposure”滑块拖到 2，轻抬蓝绿色琴体和金属部件的整体亮度。
      21. 将“Temperature”滑块拖到 -2，保持琴面蓝绿色调的冷感。
      22. 将“Vignette”滑块拖到 3，轻微收束乐器识别图外围暗部。
      23. 点击顶部“Download”，下载“pe4_bluegreen_guitar-edited.png”乐器识别图。
      24. 点击左侧栏顶部的“Import Photo”。
      25. 在 Windows“打开”对话框左侧点击“Pictures”。
      26. 根据缩略图找到“灰色影棚背景前一位棕色长发女士正对镜头、全身穿白色服装”的图片；该图片文件名为“pe4_studio_white_outfit.png”，点击它。
      27. 点击右下角“Open”，将灰色影棚白衣女士肖像载入画布。
      28. 点击右侧固定标签区的“Portrait”。
      29. 将“Smooth”滑块拖到 7，轻度柔化并保留真实肤质。
      30. 将“Whiten”滑块拖到 5，使白色服装保持洁净中性。
      31. 将“Rosy”滑块拖到 4，恢复影棚面部的自然血色。
      32. 将“Bright Eyes”滑块拖到 6，增强眼部清晰度。
      33. 将“Background Blur”滑块拖到 5，轻微分离灰色影棚背景。
      34. 点击右侧固定标签区的“Edit”。
      35. 将“Temperature”滑块拖到 -3，校正白衣和灰墙中的暖色。
      36. 将“Exposure”滑块拖到 3，保持人物面部均匀明亮。
      37. 将“Sharpen”滑块拖到 6，强化发丝和眼部边缘。
      38. 点击右侧固定标签区的“Filters”。
      39. 点击“Portrait”预设，统一正式媒体肖像质感。
      40. 将“Strength”滑块拖到 20，防止白色服装失去纹理。
      41. 点击顶部“Download”，下载“pe4_studio_white_outfit-edited.png”正式影棚肖像。
      42. 点击左侧栏顶部的“Import Photo”。
      43. 在 Windows“打开”对话框左侧点击“Pictures”。
      44. 根据缩略图找到“暗色窗边一位穿黑衣的浓胡须男士望向窗外，怀中横放一把深色木吉他”的图片；该图片文件名为“pe4_darkwindow_bearded_man.png”，点击它。
      45. 点击右下角“Open”，将暗窗黑衣胡须男士采访图载入画布。
      46. 点击右侧固定标签区的“Filters”。
      47. 点击“Film”预设，建立暗调采访的纪实基调。
      48. 将“Strength”滑块拖到 40，保留窗光下的面部细节。
      49. 点击右侧固定标签区的“Edit”。
      50. 将“Exposure”滑块拖到 9，打开黑衣和胡须中的暗部。
      51. 将“Brightness”滑块拖到 4，提亮窗边面部受光区。
      52. 将“Contrast”滑块拖到 -6，保留面部向黑衣过渡的层次。
      53. 将“Fade”滑块拖到 7，形成克制的采访画面灰度。
      54. 将“Grain”滑块拖到 9，补充暗调纪实颗粒。
      55. 将“Vignette”滑块拖到 13，收束远离窗户的背景。
      56. 点击右侧固定标签区的“HSL”。
      57. 将“Orange”滑块拖到 5，恢复窗光下的自然肤色。
      58. 将“Yellow”滑块拖到 -6，降低窗边暖色反射。
      59. 点击右侧固定标签区的“Portrait”。
      60. 将“Background Blur”滑块拖到 5，轻微柔化远离窗户的暗色背景。
      61. 将“Bright Eyes”滑块拖到 4，提升窗光下人物眼神的清晰度。
      62. 将“Smooth”滑块拖到 3，保留胡须男士的真实皮肤与面部纹理。
      63. 点击顶部“Download”，下载“pe4_darkwindow_bearded_man-edited.png”暗调采访肖像。
      64. 点击左侧栏顶部的“Import Photo”。
      65. 在 Windows“打开”对话框左侧点击“Pictures”。
      66. 根据缩略图找到“明亮白色窗边一位短发男士穿灰色针织衫、怀抱浅木色吉他并看向镜头”的图片；该图片文件名为“pe4_brightwindow_gray_sweater.png”，点击它。
      67. 点击右下角“Open”，将亮窗灰衣短发男士媒体图载入画布。
      68. 点击右侧固定标签区的“Edit”。
      69. 将“Saturation”滑块拖到 5，补回亮窗画面的综合色彩。
      70. 将“Temperature”滑块拖到 -4，校正窗光下略暖的肤色和针织衫。
      71. 将“Contrast”滑块拖到 4，保留亮窗与灰衣之间的柔和过渡。
      72. 将“Sharpen”滑块拖到 10，强化发丝、眼部和针织纹理。
      73. 点击右侧固定标签区的“Portrait”。
      74. 将“Smooth”滑块拖到 4，保持男性肖像的真实皮肤纹理。
      75. 将“Bright Eyes”滑块拖到 5，增强明亮媒体肖像的眼神。
      76. 将“Background Blur”滑块拖到 4，轻微柔化窗外亮部。
      77. 点击右侧固定标签区的“Filters”。
      78. 点击“Clean”预设，形成清爽明亮的媒体发布风格。
      79. 将“Strength”滑块拖到 23，保留灰色针织衫的纤维细节。
      80. 点击顶部“Download”，下载“pe4_brightwindow_gray_sweater-edited.png”明亮媒体肖像，并停留在该编辑页面。
