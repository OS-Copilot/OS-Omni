  ticket from the Safety tab with the message "Follow up on my ride.", ensuring the final logged-in view
  is the Account tab for "Scan Rider" before logging out to return the application to the initial OpenDriver
  login or create account page where Rider workspace tabs and ride controls are no longer visible.
