    source_instruction: |-
      在 Windows VM 中打开 OpenDriver，并只使用图形界面完成以下 Rider 账号、叫车、优惠码、工单和退出流程。

      重要初始状态规则：VM 必须已经处于快照“快照 1”。该快照应当已经安装 OpenDriver，并显示可进入 Rider 账号页签的登录/创建账号页面。不要在 initializer 或评测脚本中恢复快照；完整自动运行由 Windows runtime 配置负责恢复快照。
      重要最终状态规则：完成最后一个 Account 页签动作后，点击窗口右上角的退出图标，退出当前 Rider 会话，并停留在登出后的 OpenDriver 登录/创建账号页面。

      1. 点击登录页顶部的 Rider 账号页签。
      2. 点击 Name 输入框。
      3. 键入 Scan Rider。
      4. 点击 Email 输入框。
      5. 键入 scan.rider@example.com。
      6. 点击 Password 输入框。
      7. 键入 Pass123!。
      8. 点击 Create account，进入显示 Ride、Active、History、Safety、Account 页签的 Rider 页面。
      9. 点击 Destination 区域下方的 Downtown Palo Alto, CA 结果行。
      10. 点击页面上的 Choose a ride 按钮，使下方 RideX 选项区域进入视野。
      11. 向下滚动 Rider 页面，直到看到 RideX、RideXL 和 Priority pickup 选项。
      12. 点击 RideX 选项行。
      13. 点击 Promo code 输入框。
      14. 键入 RIDECHECK。
      15. 点击 RideX 选项行。
      16. 点击 Promo code 输入框。
      17. 点击 Choose RideX 按钮，停留在可见 RideX 估价页面。
      18. 向上滚动 Rider 页面，回到能看到目的地和地图路线的位置。
      19. 点击顶部 Active 页签，切换到显示 No active ride. 的页面。
      20. 点击 Request a ride 按钮，返回 Rider 的叫车页面。
      21. 点击 Downtown Palo Alto, CA 结果行，再次加载该目的地路线。
      22. 点击 Choose a ride 按钮。
      23. 向下滚动到 ride options 区域。
      24. 点击 Promo code 输入框。
      25. 按 Ctrl+A 选中优惠码。
      26. 键入 RIDERONE。
      27. 点击 RideX 选项行，保持 RideX 选项。
      28. 点击顶部 History 页签，切换到 Ride history 页面。
      29. 点击顶部 Ride 页签，返回 Rider 叫车页面。
      30. 点击 Downtown Palo Alto, CA 结果行，恢复 Downtown 路线。
      31. 点击顶部 Safety 页签，打开 Safety and support 页面。
      32. 点击 Message 文本框。
      33. 按 Ctrl+A 选中默认消息。
      34. 键入 I need help with my ride.。
      35. 点击 Create support ticket 按钮，页面下方出现新建的 safety concern - Open 工单。
      36. 点击顶部 History 页签，离开工单列表页面。
      37. 点击顶部 History 页签，回到 Ride history 页面。
      38. 点击顶部 Safety 页签，返回工单仍可见的 Safety and support 页面。
      39. 点击顶部 Account 页签，打开 Scan Rider 账户页面。
      40. 点击顶部 Safety 页签，返回工单仍可见的页面。
      41. 点击顶部 History 页签。
      42. 点击顶部 Account 页签。
      43. 点击顶部 Ride 页签。
      44. 点击顶部 Ride 页签，返回叫车页面。
      45. 点击 Downtown Palo Alto, CA 结果行。
      46. 点击 Choose a ride 按钮。
      47. 向下滚动到 Choose RideX 按钮所在区域。
      48. 点击 Promo code 输入框。
      49. 按 Ctrl+A 选中优惠码。
      50. 键入 RIDECHECK2。
      51. 点击 Choose RideX 按钮，停留在 RideX 选择区域。
      52. 向上滚动回到地图和目的地区域。
      53. 点击顶部 Active 页签。
      54. 点击 Request a ride 按钮，返回叫车页。
      55. 点击顶部 Safety 页签。
      56. 点击 Message 文本框。
      57. 按 Ctrl+A 选中消息。
      58. 键入 Follow up on my ride.。
      59. 点击 Create support ticket 按钮，新建另一条 Rider support ticket。
      60. 点击顶部 History 页签。
      61. 点击顶部 Account 页签。
      62. 点击顶部 Safety 页签。
      63. 点击顶部 Ride 页签。
      64. 点击顶部 Account 页签，使最终页面停留在 Scan Rider 账户页。
      65. 点击窗口右上角的退出图标，退出当前 Rider 会话。
      66. 停止操作，保持在登出后的 OpenDriver 登录/创建账号页面。
