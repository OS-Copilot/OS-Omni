# Linux guest runtime IP or host.
vm_ip: "127.0.0.1"

# Guest runtime server port.
runtime_port: 5001

# Guest runtime bearer token.
runtime_token: "linuxbench-runtime-token"

# Optional: start a real Linux VM before each task-model run.
# Leave vm_provider empty to connect to an already-running runtime instead.
# Supported providers today: vmware
vm_provider: "vmware"

# Path to the VM file, for example:
#   /abs/path/to/Ubuntu0/Ubuntu0.vmx
# Leave empty to let OS-Omni resolve a VM from vm_storage_dir or download
# the official archive from vm_image_url.
vm_path: "C:\\Users\\killt\\VM\\Ubuntu-x86\\Ubuntu.vmx"

# Snapshot name for the clean baseline used before every task run.
# With vm_reset_between_tasks: true, this must be set; a reboot alone does not
# restore application state or modified files.
vm_snapshot_name: "helloworld-clean"

# Whether to start the VM without a window when the provider supports it.
vm_headless: true

# Whether OS-Omni should stop the VM after the run it started finishes.
vm_stop_on_exit: true

# When true, use the provider-reported guest IP instead of vm_ip above.
vm_use_provider_ip: true

# Directory where OS-Omni looks for existing VMware Linux images and stores
# downloaded official archives.
vm_storage_dir: "platforms/linux/vmware_vm_data"

# Optional official Linux VM archive URL. When vm_path is empty and no .vmx is
# found under vm_storage_dir, OS-Omni will download and extract this archive.
vm_image_url:

# Optional archive filename override for the official VM download.
vm_image_archive_name:

# Optional preferred VM name (folder or .vmx stem) when vm_storage_dir contains
# multiple .vmx files.
vm_image_name:

# When true, OS-Omni will try to bootstrap the guest runtime automatically
# if /health is not ready after VM boot.
vm_bootstrap_runtime: true

# When true, each task run reverts vm_snapshot_name before execution and stops
# the VM after execution. This is the only supported full reset path.
vm_reset_between_tasks: true

# VMware guest login used only for automatic runtime bootstrap fallback.
# For official OS-Omni images, prefer preinstalling and auto-starting the
# guest runtime so users do not need to fill these fields.
vm_guest_username: "user"
vm_guest_password: "password"

# Guest python binary used to launch runtime_server.py.
vm_guest_python_bin: "python3"

# Guest directory used to copy runtime_server.py and write logs/pid files.
vm_guest_runtime_dir: "/tmp/helloworld_linux_runtime"

# Whether OS-Omni should install missing guest pip dependencies automatically.
vm_guest_install_deps: true
