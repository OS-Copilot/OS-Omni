task_id: android.oracle.cross_vm.prepare_site_visit_transfer_easy
platform: android
instruction: >
  Oracle sanity task for android.cross_vm.prepare_site_visit_transfer_easy. The
  initializer already prepares the expected transfer file. Wait briefly and finish.
init:
  initializer_id: initializers.android.cross_vm:AndroidTransferSourceInitializer
  params:
    source_path: /sdcard/Documents/markor/site_visit_source.txt
    transfer_path: /sdcard/Documents/markor/site_visit_transfer.txt
    prepare_transfer: true
    source_text: |
      Northwind Site Visit
      Confirm loading dock access at 08:30
      Bring revised safety checklist
      Share the updated visitor badge count: 14
evaluation:
  evaluator_id: evaluators.android.text_file:AndroidTextFileEvaluator
  params:
    path: /sdcard/Documents/markor/site_visit_transfer.txt
    expected_text: |
      Northwind Site Visit
      Confirm loading dock access at 08:30
      Bring revised safety checklist
      Share the updated visitor badge count: 14
limits:
  max_steps: 2
  step_timeout_seconds: 90
metadata:
  tags: [android, cross_vm, oracle, easy]
  difficulty: easy
  oracle_for: android.cross_vm.prepare_site_visit_transfer_easy
