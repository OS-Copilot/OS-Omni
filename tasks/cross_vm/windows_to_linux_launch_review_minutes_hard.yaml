task_id: cross_vm.windows_to_linux.launch_review_minutes_hard
platform: cross_vm
instruction: >
  First work in the Windows VM: a launch review note is open there, and you
  need to save the required transfer file. Then move to the Linux VM and use
  the transferred note to complete the LibreOffice Writer document.
windows_task: tasks/windows/cross_vm_prepare_launch_review_transfer_hard.yaml
linux_task: tasks/linux/cross_vm_writer_launch_review_minutes_hard.yaml
transfer:
  windows_guest_path: C:\Users\User\Desktop\launch_review_transfer.txt
  linux_guest_path: /home/user/Desktop/launch_review_transfer.txt
  host_filename: launch_review_transfer.txt
metadata:
  tags: [cross_vm, windows_to_linux, notepad, libreoffice, writer, hard]
  difficulty: hard
  description: Save a launch review note on Windows, transfer it, and turn it into structured Writer minutes on Linux.
  oracle_task: tasks/cross_vm/oracle/windows_to_linux_launch_review_minutes_hard_oracle.yaml
  oracle_model: cross_vm_oracle_wait
