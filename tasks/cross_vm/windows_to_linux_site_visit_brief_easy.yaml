task_id: cross_vm.windows_to_linux.site_visit_brief_easy
platform: cross_vm
instruction: >
  First work in the Windows VM: a source note is open there, and you need to
  save the required transfer file. Then move to the Linux VM and use the
  transferred note to complete the LibreOffice Writer document.
windows_task: tasks/windows/cross_vm_prepare_site_visit_transfer_easy.yaml
linux_task: tasks/linux/cross_vm_writer_site_visit_brief_easy.yaml
transfer:
  windows_guest_path: C:\Users\User\Desktop\site_visit_transfer.txt
  linux_guest_path: /home/user/Desktop/site_visit_transfer.txt
  host_filename: site_visit_transfer.txt
metadata:
  tags: [cross_vm, windows_to_linux, notepad, libreoffice, writer, easy]
  difficulty: easy
  description: Save a source note on Windows, transfer it, and turn it into a short Writer brief on Linux.
  oracle_task: tasks/cross_vm/oracle/windows_to_linux_site_visit_brief_easy_oracle.yaml
  oracle_model: cross_vm_oracle_wait
