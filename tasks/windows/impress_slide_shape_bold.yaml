  tags:
  - libreoffice
  - impress
  - pptx
  - kiosk
  - images
  - alt-text
  - hard
  - single_app
  - evaluator_backed
  - hard-plus
  - multi_artifact_handoff
  - linux_plus
  difficulty: hard
  app_name: libreoffice-impress
  human_steps: 158
  description: 'Linux-aligned Impress task: create a six-slide kiosk deck with one fitted image per blank slide, alt text,
    and manifest bundle.'
  hardness: hard-evaluable
  evaluation_standard: six slides, exactly one picture per slide, no text shapes, exact alt text, equal placement/size, and
    all manifest files are checked
  linux_peer: linux.impress.create_six_image_slides
  linux_peer_file: tasks/linux/impress_create_six_image_slides_hard.yaml
  alignment_status: direct
  hard_plus_alignment: linux_peer_plus_extra_evaluator_checked_artifacts
  hard_plus_note: The Linux-aligned core task remains required; extra handoff/audit artifacts are also evaluator checked.
  oracle_model: windows_oracle
