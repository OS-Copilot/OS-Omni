task_id: windows.impress.slide_shape_bold
platform: windows
instruction: 'In LibreOffice Impress, the presentation impress_kiosk_actual.pptx is already open. Create a kiosk deck with
  six blank slides. Insert exactly one image on each slide using the Desktop images pic1.png through pic6.png in order. Each
  slide must contain no text boxes or decorative shapes, only the one picture. Use the same placement and fitted size for
  every picture. Set the picture alternative-text description on each slide to the exact source filename for that slide: pic1.png
  through pic6.png. Also create the required kiosk manifest files under C:\Users\User\Documents\helloworld_office: impress_image_manifest.txt,
  impress_kiosk_manifest.txt, impress_slide_checks.txt, impress_timing_manifest.txt, impress_playback_manifest.txt, impress_qc_manifest.txt,
  impress_accessibility_manifest.txt, impress_export_manifest.txt, impress_asset_manifest.txt, impress_operator_manifest.txt,
  impress_quality_gate_manifest.txt, impress_handoff_audit.txt, impress_asset_receipt.csv, impress_operator_queue.txt, impress_export_receipt.txt,
  impress_asset_timing_crosswalk.tsv, and impress_bundle_dependency_index.txt. Save when finished. Also create these hard-plus
  verification files so the final state is a multi-artifact handoff bundle: C:\Users\User\Documents\helloworld_hard_plus\windows_impress_slide_shape_bold\hard_plus_handoff.tsv
  with exactly this content: ''task_id\tlinux_peer\tstatus\nwindows.impress.slide_shape_bold\tlinux.impress.create_six_image_slides\thard-plus-ready\napp\tlibreoffice-impress\tevaluator-checked'';
  C:\Users\User\Documents\helloworld_hard_plus\windows_impress_slide_shape_bold\hard_plus_dependency_index.txt with exactly
  this content: ''primary_task=windows.impress.slide_shape_bold\nlinux_peer=linux.impress.create_six_image_slides\ndifficulty=hard-plus\nrequires_multi_artifact_handoff=true\noracle_receipt=hard_plus_oracle_receipt.txt'';
  C:\Users\User\Documents\helloworld_hard_plus\windows_impress_slide_shape_bold\hard_plus_review_matrix.csv with exactly this
  content: ''check,owner,status\nlinux_alignment,benchmark-ops,ready\nextra_artifacts,benchmark-ops,ready\noracle_recheck,benchmark-ops,required''.
  Use LibreOffice Impress for the presentation work; create any required .txt, .tsv, or .csv verification files directly at
  the specified paths using the available automation/runtime file-writing method, not Notepad or another text editor.'
init:
  initializer_id: initializers.windows.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_powershell
      script: "$ErrorActionPreference = \"Stop\"\nAdd-Type -AssemblyName System.Drawing\n$desktop = [Environment]::GetFolderPath(\"\
        Desktop\")\n$downloads = Join-Path $env:USERPROFILE \"Downloads\"\n$workspace = \"C:\\Users\\User\\Documents\\helloworld_office\"\
        \nNew-Item -ItemType Directory -Force -Path $downloads, $workspace | Out-Null\n$colors = @(\n  [System.Drawing.Color]::FromArgb(220,70,70),\n\
        \  [System.Drawing.Color]::FromArgb(70,130,220),\n  [System.Drawing.Color]::FromArgb(80,180,120),\n  [System.Drawing.Color]::FromArgb(210,170,60),\n\
        \  [System.Drawing.Color]::FromArgb(150,90,210),\n  [System.Drawing.Color]::FromArgb(60,180,190)\n)\nfor ($i = 1;\
        \ $i -le 6; $i++) {\n  $bmp = New-Object System.Drawing.Bitmap 640, 360\n  $g = [System.Drawing.Graphics]::FromImage($bmp)\n\
        \  $g.Clear($colors[$i - 1])\n  $font = New-Object System.Drawing.Font \"Arial\", 56, ([System.Drawing.FontStyle]::Bold)\n\
        \  $brush = [System.Drawing.Brushes]::White\n  $g.DrawString(\"PIC $i\", $font, $brush, 215, 140)\n  $out = Join-Path\
        \ $desktop (\"pic{0}.png\" -f $i)\n  $bmp.Save($out, [System.Drawing.Imaging.ImageFormat]::Png)\n  $g.Dispose()\n\
        \  $bmp.Dispose()\n}\n$py = @'\nimport os, subprocess, sys\ntry:\n    from pptx import Presentation\nexcept ImportError:\n\
        \    subprocess.check_call([sys.executable, \"-m\", \"pip\", \"install\", \"python-pptx\", \"-q\"])\n    from pptx\
        \ import Presentation\nprs = Presentation()\nprs.slides.add_slide(prs.slide_layouts[6])\nprs.save(r\"C:\\Users\\User\\\
        Downloads\\impress_kiosk_actual.pptx\")\nprint(\"INIT_OK C:\\\\Users\\\\User\\\\Downloads\\\\impress_kiosk_actual.pptx\"\
        )\n'@\n$py | py -3 -W ignore -\n"
      timeout: 120
    - type: run_powershell
      script: "$pptPath = \"C:\\Users\\User\\Downloads\\impress_kiosk_actual.pptx\"\n$candidates = @(\n  \"C:\\Program Files\\\
        LibreOffice\\program\\simpress.exe\",\n  \"C:\\Program Files\\LibreOffice\\program\\soffice.exe\",\n  \"C:\\Program\
        \ Files (x86)\\LibreOffice\\program\\simpress.exe\",\n  \"C:\\Program Files (x86)\\LibreOffice\\program\\soffice.exe\"\
        \n)\n$exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1\nif (-not $exe) { throw \"LibreOffice\
        \ Impress not found\" }\nif ($exe -like \"*\\soffice.exe\") {\n  Start-Process -FilePath $exe -ArgumentList @(\"--impress\"\
        , $pptPath)\n} else {\n  Start-Process -FilePath $exe -ArgumentList @($pptPath)\n}\n"
      timeout: 120
    - type: wait
      ms: 5000
evaluation:
  evaluator_id: evaluators.windows.libreoffice_impress:LibreOfficeImpressEvaluator
  params:
    check_id: impress_slide_shape_bold
    stdout_contains: EVAL_RESULT:PASS
    timeout: 120
    supplemental_checks:
      files:
      - path: C:\Users\User\Documents\helloworld_hard_plus\windows_impress_slide_shape_bold\hard_plus_handoff.tsv
        exact_text: "task_id\tlinux_peer\tstatus\nwindows.impress.slide_shape_bold\tlinux.impress.create_six_image_slides\t\
          hard-plus-ready\napp\tlibreoffice-impress\tevaluator-checked"
      - path: C:\Users\User\Documents\helloworld_hard_plus\windows_impress_slide_shape_bold\hard_plus_dependency_index.txt
        exact_text: 'primary_task=windows.impress.slide_shape_bold

          linux_peer=linux.impress.create_six_image_slides

          difficulty=hard-plus

          requires_multi_artifact_handoff=true

          oracle_receipt=hard_plus_oracle_receipt.txt'
      - path: C:\Users\User\Documents\helloworld_hard_plus\windows_impress_slide_shape_bold\hard_plus_review_matrix.csv
        exact_text: 'check,owner,status

          linux_alignment,benchmark-ops,ready

          extra_artifacts,benchmark-ops,ready

          oracle_recheck,benchmark-ops,required'
      powershell:
      - label: no_notepad_process
        script: '$p = Get-Process -Name notepad -ErrorAction SilentlyContinue

          if ($p) { Write-Output ''NOTEPAD_RUNNING''; exit 1 }

          Write-Output ''NO_NOTEPAD_PROCESS'''
        stdout_contains: NO_NOTEPAD_PROCESS
        expected_exit_code: 0
        timeout: 10
limits:
  max_steps: 100
  step_timeout_seconds: 120
