instruction: 'Sign in to OpenShop with the keyboard layout indicator in the taskbar displaying “ENG” and
  the password spring2026, then place an order containing six specific items with adjusted quantities
  and submit a review for each item in the order detail view. The cart must contain the “Noise canceling”
  item with the “Rose Gold” specification, the “Coffee packs” item with the “40 sachets” specification,
  the “Cotton bedding” item, the “Business backpack” item with the “16-inch” specification, the “BloomCare
  Sensitive Skin Eau de Parfum” from the “Beauty” category with the “Value Set” specification, and the
  “Acoustic Row Beginner Kalimba Thumb Piano” from the “Music” category with the “Gift Set” specification,
  added in that exact sequence. The final order must reflect a quantity of 2 for the “Verdant Pro Noise-Canceling
  Headphones,” “Mountain Isle Pour-Over Coffee 20 Pack,” and “Polar Day Slim Business Backpack,” while
  the other items retain their default quantities. The checkout process must use the “Home” delivery address
  and “Cash on Delivery” payment method, with the Order Note field containing the text CoreBundleA. Upon
  completion, the order detail view must display submitted reviews for all six items with the following
  specific ratings and text: the “Verdant Pro Noise-Canceling Headphones” rated 4 / 5 with the text CallsStayClear,
  the “Mountain Isle Pour-Over Coffee 20 Pack” rated 3 / 5 with the text CoffeeTastesRich, the “Garden
  White Cotton Bedding Set 1.8m” rated 4 / 5 with the text BeddingFeelsSoft, the “Polar Day Slim Business
  Backpack” rated 3 / 5 with the text PackFitsLaptop, the “BloomCare Sensitive Skin Eau de Parfum” rated
  4 / 5 with the text ScentTravelsWell, and the “Acoustic Row Beginner Kalimba Thumb Piano” rated 4 /
  5 with the text KalimbaSoundsWarm.'
