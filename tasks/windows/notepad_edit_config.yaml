task_id: windows.notepad.edit_config
platform: windows
instruction: 'A configuration file named app.ini is open in Notepad. Rewrite it into this exact final 15-line configuration,
  deleting the original Version and Author lines and preserving the section order: "[Settings]", "Environment=QA", "HardMode=True",
  "AuditLevel=Strict", "Theme=Light", "Timeout=60", "Mode=Staging", "Logging=On", "Retries=5", "Cache=True", "[Database]",
  "Host=db.internal", "ReplicaHost=replica.internal", "Port=5433", and "# End of config". Save the file when done. Also create
  these hard-plus verification files so the final state is a multi-artifact handoff bundle: C:\Users\User\Documents\helloworld_hard_plus\windows_notepad_edit_config\hard_plus_handoff.tsv
  with exactly this content: ''task_id\tlinux_peer\tstatus\nwindows.notepad.edit_config\tlinux.notepadqq.prepare_release_packet\thard-plus-ready\napp\tnotepad\tevaluator-checked'';
  C:\Users\User\Documents\helloworld_hard_plus\windows_notepad_edit_config\hard_plus_dependency_index.txt with exactly this
  content: ''primary_task=windows.notepad.edit_config\nlinux_peer=linux.notepadqq.prepare_release_packet\ndifficulty=hard-plus\nrequires_multi_artifact_handoff=true\noracle_receipt=hard_plus_oracle_receipt.txt'';
  C:\Users\User\Documents\helloworld_hard_plus\windows_notepad_edit_config\hard_plus_review_matrix.csv with exactly this content:
  ''check,owner,status\nlinux_alignment,benchmark-ops,ready\nextra_artifacts,benchmark-ops,ready\noracle_recheck,benchmark-ops,required''.'
init:
  initializer_id: initializers.windows.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_powershell
      script: "$lines = @(\n    \"[Settings]\",\n    \"Version=1.0.0\",\n    \"Author=Admin\",\n    \"Theme=Dark\",\n    \"\
        Timeout=30\",\n    \"Mode=Production\",\n    \"Logging=Off\",\n    \"Retries=3\",\n    \"Cache=False\",\n    \"[Database]\"\
        ,\n    \"Host=localhost\",\n    \"Port=5432\"\n)\n$content = $lines -join \"`r`n\"\n$filePath = Join-Path $env:USERPROFILE\
        \ \"Downloads\\app.ini\"\nSet-Content -Path $filePath -Value $content -Encoding UTF8\nWrite-Output 'INIT_OK_APPINI'\n"
      timeout: 10
    - type: run_powershell
      script: '$filePath = Join-Path $env:USERPROFILE "Downloads\app.ini"

        Start-Process notepad.exe $filePath

        '
      timeout: 15
    - type: wait
      ms: 2000
evaluation:
  evaluator_id: evaluators.windows.notepad:NotepadEvaluator
  params:
    check_id: notepad_edit_config
    stdout_contains: EVAL_RESULT:PASS
    timeout: 30
    supplemental_checks:
      files:
      - path: C:\Users\User\Documents\helloworld_hard_plus\windows_notepad_edit_config\hard_plus_handoff.tsv
        exact_text: "task_id\tlinux_peer\tstatus\nwindows.notepad.edit_config\tlinux.notepadqq.prepare_release_packet\thard-plus-ready\n\
          app\tnotepad\tevaluator-checked"
      - path: C:\Users\User\Documents\helloworld_hard_plus\windows_notepad_edit_config\hard_plus_dependency_index.txt
        exact_text: 'primary_task=windows.notepad.edit_config

          linux_peer=linux.notepadqq.prepare_release_packet

          difficulty=hard-plus

          requires_multi_artifact_handoff=true

          oracle_receipt=hard_plus_oracle_receipt.txt'
      - path: C:\Users\User\Documents\helloworld_hard_plus\windows_notepad_edit_config\hard_plus_review_matrix.csv
        exact_text: 'check,owner,status

          linux_alignment,benchmark-ops,ready

          extra_artifacts,benchmark-ops,ready

          oracle_recheck,benchmark-ops,required'
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - notepad
  - edit
  - delete
  - hard
  - single_app
  - evaluator_backed
  - hard-plus
  - multi_artifact_handoff
  - linux_plus
  difficulty: hard
  app_name: notepad
  human_steps: 92
  description: 'Linux-aligned hard Notepad task: rewrite a multi-section INI file with exact ordering, strict audit fields,
    database replica settings, and footer.'
  hardness: hard-evaluable
  evaluation_standard: all retained hard requirements are covered by the main evaluator or supplemental checks
  linux_peer: linux.notepadqq.prepare_release_packet
  linux_peer_file: tasks/linux/notepadqq_prepare_release_packet_hard.yaml
  alignment_status: functional_equivalent
  hard_plus_alignment: linux_peer_plus_extra_evaluator_checked_artifacts
  hard_plus_note: The Linux-aligned core task remains required; extra handoff/audit artifacts are also evaluator checked.
  oracle_model: windows_oracle