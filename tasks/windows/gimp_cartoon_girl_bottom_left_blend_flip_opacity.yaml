    supplemental_checks:
      powershell:
      - label: primary_hard_mode
        script: "$path = \"C:\\Users\\User\\Downloads\\cartoon_girl_blend_submission.xcf\"\nif ((Test-Path -LiteralPath $path)\
          \ -and ((Get-Item -LiteralPath $path).Length -ge 1024)) {\n  Write-Output \"EVAL_RESULT:PASS primary artifact exists:\
          \ $path\"\n} else {\n  Write-Output \"EVAL_RESULT:FAIL primary artifact missing or too small: $path\"\n  exit 1\n\
          }"
        stdout_contains: EVAL_RESULT:PASS
        timeout: 90
      - label: no_notepad_process
