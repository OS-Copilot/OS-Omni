          hard-plus-ready\napp\tGIMP\tevaluator-checked"
      - path: C:\Users\User\Documents\helloworld_hard_plus\windows_gimp_cartoon_girl_bottom_left_blend_flip_opacity\hard_plus_dependency_index.txt
        exact_text: 'primary_task=windows.gimp.cartoon_girl_bottom_left_blend_flip_opacity

