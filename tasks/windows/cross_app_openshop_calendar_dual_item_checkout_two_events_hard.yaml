task_id: windows.cross_app.openshop_calendar_dual_item_checkout_two_events_hard
platform: windows
instruction: 'In OpenShop, you are already signed in. Add Verdant Pro Noise-Canceling Headphones with the Bluetooth 5.4 option
  and Mountain Isle Pour-Over Coffee 20 Pack with the 20 sachets option to the cart. Complete checkout using the Office address,
  WeChat Pay, and the exact note "Bring both items together.". Submit the order. After that, switch to the already-open Thunderbird
  Calendar window and create these twenty 30-minute events, saving every event: Bench Combined Order Check for tomorrow at
  5:00 PM; Bench Coffee Restock Review for three days from now at 10:00 AM; Bench Dual Order Audit for four days from now
  at 2:45 PM; Bench Headphones Pairing Check for five days from now at 9:15 AM; Bench Coffee Sample Count for six days from
  now at 10:45 AM; Bench Invoice Bundle Review for seven days from now at 1:30 PM; Bench Fulfillment Desk Sync for eight days
  from now at 3:00 PM; Bench Cart Evidence Archive for nine days from now at 4:15 PM; Bench Payment Receipt Review for ten
  days from now at 11:30 AM; Bench Office Delivery Scan for eleven days from now at 2:00 PM; Bench Product Warranty Note for
  twelve days from now at 9:45 AM; Bench Coffee Pantry Sync for thirteen days from now at 3:45 PM; Bench Combined Return Window
  Check for fourteen days from now at 4:30 PM; Bench Team Gear Handoff for fifteen days from now at 10:15 AM; Bench Order
  Metadata Audit for sixteen days from now at 1:00 PM; Bench Receipt Closeout Review for seventeen days from now at 2:30 PM;
  Bench Shipment Exception Sweep for eighteen days from now at 11:00 AM; Bench Purchase Approval Archive for nineteen days
  from now at 3:15 PM; Bench Dual Order Closeout for twenty days from now at 4:00 PM; and Bench Finance Reconciliation Note
  for twenty-one days from now at 9:30 AM. Also create these hard-plus verification files so the final state is a multi-artifact
  handoff bundle: C:\Users\User\Documents\helloworld_hard_plus\windows_cross_app_openshop_calendar_dual_item_checkout_two_events_hard\hard_plus_handoff.tsv
  with exactly this content: ''task_id\tlinux_peer\tstatus\nwindows.cross_app.openshop_calendar_dual_item_checkout_two_events_hard\tlinux.cross_app.thunderbird_calendar_dual_item_checkout_two_events_hard\thard-plus-ready\napp\tthunderbird_calendar
  + openshop\tevaluator-checked''; C:\Users\User\Documents\helloworld_hard_plus\windows_cross_app_openshop_calendar_dual_item_checkout_two_events_hard\hard_plus_dependency_index.txt
  with exactly this content: ''primary_task=windows.cross_app.openshop_calendar_dual_item_checkout_two_events_hard\nlinux_peer=linux.cross_app.thunderbird_calendar_dual_item_checkout_two_events_hard\ndifficulty=hard-plus\nrequires_multi_artifact_handoff=true\noracle_receipt=hard_plus_oracle_receipt.txt'';
  C:\Users\User\Documents\helloworld_hard_plus\windows_cross_app_openshop_calendar_dual_item_checkout_two_events_hard\hard_plus_review_matrix.csv
  with exactly this content: ''check,owner,status\nlinux_alignment,benchmark-ops,ready\nextra_artifacts,benchmark-ops,ready\noracle_recheck,benchmark-ops,required''.
  Use OpenShop and Thunderbird Calendar for the app workflow; create required hard-plus verification files directly at the
  specified paths using the available automation/runtime file-writing method, not Notepad or another text editor.'
init:
  initializer_id: initializers.windows.cross_app:ShoppingCalendarInitializer
  params:
    openshop:
      login:
        phone: '13800138000'
        password: spring2026
      final_wait_ms: 1200
    calendar:
      wait_ms: 5000
evaluation:
  evaluator_id: evaluators.windows.cross_app:CrossAppEvaluator
  params:
    check_id: cross_app_openshop_calendar_dual_item_checkout_two_events_hard
    stdout_contains: EVAL_RESULT:PASS
    timeout: 60
    supplemental_checks:
      files:
      - path: C:\Users\User\Documents\helloworld_hard_plus\windows_cross_app_openshop_calendar_dual_item_checkout_two_events_hard\hard_plus_handoff.tsv
        exact_text: "task_id\tlinux_peer\tstatus\nwindows.cross_app.openshop_calendar_dual_item_checkout_two_events_hard\t\
          linux.cross_app.thunderbird_calendar_dual_item_checkout_two_events_hard\thard-plus-ready\napp\tthunderbird_calendar\
          \ + openshop\tevaluator-checked"
      - path: C:\Users\User\Documents\helloworld_hard_plus\windows_cross_app_openshop_calendar_dual_item_checkout_two_events_hard\hard_plus_dependency_index.txt
        exact_text: 'primary_task=windows.cross_app.openshop_calendar_dual_item_checkout_two_events_hard

          linux_peer=linux.cross_app.thunderbird_calendar_dual_item_checkout_two_events_hard

          difficulty=hard-plus

          requires_multi_artifact_handoff=true

          oracle_receipt=hard_plus_oracle_receipt.txt'
      - path: C:\Users\User\Documents\helloworld_hard_plus\windows_cross_app_openshop_calendar_dual_item_checkout_two_events_hard\hard_plus_review_matrix.csv
        exact_text: 'check,owner,status

          linux_alignment,benchmark-ops,ready

          extra_artifacts,benchmark-ops,ready

          oracle_recheck,benchmark-ops,required'
      powershell:
      - label: no_notepad_process
        script: '$p = Get-Process -Name notepad -ErrorAction SilentlyContinue

          if ($p) { Write-Output ''NOTEPAD_RUNNING''; exit 1 }

          Write-Output ''NO_NOTEPAD_PROCESS'''
        stdout_contains: NO_NOTEPAD_PROCESS
        expected_exit_code: 0
        timeout: 10
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
