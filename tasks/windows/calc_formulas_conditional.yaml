  tags:
  - libreoffice
  - calc
  - formula
  - conditional
  - sorting
  - filter
  - summary_sheet
  - hard
  - single_app
  - evaluator_backed
  difficulty: hard
  app_name: libreoffice-calc
  human_steps: 132
  description: 'Hard Calc task requiring weighted formulas from a rules sheet, nested status logic, ranking, priority codes,
    conditional formatting, filtering, freezing, sorting, and a formula-driven cohort summary sheet.

    '
  oracle_task: tasks/windows/oracle/calc_formulas_conditional_oracle.yaml
  oracle_model: cross_vm_oracle_wait
  hardness: hard-evaluable
  evaluation_standard: formulas, values, sheet structure, summary formulas, sort order, freeze/filter state, conditional formatting,
