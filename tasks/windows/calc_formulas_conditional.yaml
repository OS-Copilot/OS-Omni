task_id: windows.calc.formulas_conditional
platform: windows
instruction: 'A student performance workbook is open in LibreOffice Calc. The Scores sheet has raw scores and blank derived
  columns, the Rules sheet gives the grade weights and review thresholds, and the Cohort Summary sheet is blank except for
  cohort names. Complete the workbook as follows. On Scores, fill Total in column H with the sum of Math, Science, English,
  and Project. Fill Weighted Average in column I by using the weights from Rules B2:B5: Math 30%, Science 30%, English 25%,
  and Project 15%. Fill Status in column J with a formula that returns "Honors" for weighted averages at or above the Honors
  threshold, "On Track" for weighted averages at or above the On Track threshold, "Review" for weighted averages at or above
  the Review threshold, and "Recovery" otherwise. The threshold values must be read from the Rules sheet. Fill Rank in column
  K with each student''s rank by Weighted Average, where 1 is the highest score. Fill Advisor Flag in column L with "Contact"
  when Attendance is below 90 or Status is Review or Recovery, and "Clear" otherwise. Fill Priority Code in column M with
  a formula that joins the cohort, status, and rank in this exact pattern: Cohort-Status-Rank. Format Weighted Average to
  one decimal place. Add conditional formatting to Weighted Average: red background for values below 60 and green background
  for values at or above 85. Add an auto-filter covering A1:M13, freeze the header row, and sort the Scores sheet by Cohort
  ascending and then Weighted Average descending.

  Then complete the Cohort Summary sheet. Keep rows Blue, Green, and Red in that order. Fill Student Count, Average Weighted,
  Contact Count, Honors Count, Recovery Count, and Top Student using formulas that refer back to the completed Scores sheet.
  Average Weighted must be formatted to one decimal place. Top Student must be the highest weighted-average student within
  that cohort. Add conditional formatting to Cohort Summary Average Weighted so values at or above 80 are highlighted. Add
  an auto-filter covering A1:G4. Add a comment to Scores cell J1 with the exact text "Status thresholds come from Rules" and
  a comment to Cohort Summary cell A1 with the exact text "Cohort metrics are formula-driven". Save when done.

  '
init:
  initializer_id: initializers.windows.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_powershell
      script: "$ErrorActionPreference = \"Stop\"\n$py = @'\nimport os, subprocess, sys\ntry:\n    from openpyxl import Workbook\n\
        except ImportError:\n    subprocess.check_call([sys.executable, \"-m\", \"pip\", \"install\", \"openpyxl\", \"-q\"\
        ])\n    from openpyxl import Workbook\n\nwb = Workbook()\nws = wb.active\nws.title = \"Scores\"\nws.append([\"Student\"\
        , \"Cohort\", \"Math\", \"Science\", \"English\", \"Project\", \"Attendance\", \"Total\", \"Weighted Average\", \"\
        Status\", \"Rank\", \"Advisor Flag\", \"Priority Code\"])\nrows = [\n    (\"Mina\", \"Blue\", 92, 88, 91, 95, 96),\n\
        \    (\"Owen\", \"Red\", 61, 58, 63, 70, 89),\n    (\"Priya\", \"Blue\", 84, 90, 79, 88, 93),\n    (\"Leo\", \"Green\"\
        , 55, 49, 60, 57, 91),\n    (\"Nora\", \"Red\", 73, 78, 69, 74, 87),\n    (\"Sam\", \"Green\", 88, 82, 85, 80, 94),\n\
        \    (\"Tara\", \"Blue\", 68, 72, 75, 70, 92),\n    (\"Quinn\", \"Red\", 95, 94, 90, 96, 98),\n    (\"Iris\", \"Green\"\
        , 77, 81, 76, 79, 88),\n    (\"Hugo\", \"Blue\", 43, 52, 47, 50, 85),\n    (\"Yara\", \"Green\", 89, 91, 93, 86, 97),\n\
        \    (\"Ben\", \"Red\", 66, 62, 59, 64, 90),\n]\nfor row in rows:\n    ws.append(row)\n\nrules = wb.create_sheet(\"\
        Rules\")\nrules.append([\"Metric\", \"Value\"])\nfor row in [\n    (\"Math weight\", 0.30),\n    (\"Science weight\"\
        , 0.30),\n    (\"English weight\", 0.25),\n    (\"Project weight\", 0.15),\n    (\"Honors threshold\", 85),\n    (\"\
        On Track threshold\", 75),\n    (\"Review threshold\", 60),\n]:\n    rules.append(row)\n\nsummary = wb.create_sheet(\"\
        Cohort Summary\")\nsummary.append([\"Cohort\", \"Student Count\", \"Average Weighted\", \"Contact Count\", \"Honors\
        \ Count\", \"Recovery Count\", \"Top Student\"])\nfor cohort in [\"Blue\", \"Green\", \"Red\"]:\n    summary.append([cohort])\n\
        \npath = os.path.join(os.environ[\"USERPROFILE\"], \"Downloads\", \"scores.xlsx\")\nos.makedirs(os.path.dirname(path),\
        \ exist_ok=True)\nwb.save(path)\nprint(\"INIT_OK\", path)\n'@\n$tmp = Join-Path $env:TEMP \"hw_calc_formulas_conditional_init.py\"\
        \nSet-Content -LiteralPath $tmp -Value $py -Encoding UTF8\npy -3 -W ignore $tmp\n"
      timeout: 120
    - type: run_powershell
      script: '$filePath = Join-Path $env:USERPROFILE "Downloads\scores.xlsx"

        Start-Process $filePath

        '
      timeout: 15
    - type: wait
      ms: 5000
evaluation:
  evaluator_id: evaluators.windows.libreoffice_calc:LibreOfficeCalcEvaluator
  params:
    check_id: calc_formulas_conditional
    stdout_contains: EVAL_RESULT:PASS
    timeout: 120
limits:
  max_steps: 100
  step_timeout_seconds: 120
