task_id: windows.writer.toc_image_footnote
platform: windows
instruction: 'In LibreOffice Writer, the document "hk_train_record.docx" is already open. Each record line has the format
  time_HH:MM:SS, train_id, station_id, platform_no. Remove duplicated train IDs so the document keeps only the first line
  for each train_id, preserving the original order of the kept lines. Do not change the title line. Save the document when
  finished. Also create these hard-plus verification files so the final state is a multi-artifact handoff bundle: C:\Users\User\Documents\helloworld_hard_plus\windows_writer_toc_image_footnote\hard_plus_handoff.tsv
  with exactly this content: ''task_id\tlinux_peer\tstatus\nwindows.writer.toc_image_footnote\tlinux.writer.deduplicate_train_records\thard-plus-ready\napp\tlibreoffice-writer\tevaluator-checked'';
  C:\Users\User\Documents\helloworld_hard_plus\windows_writer_toc_image_footnote\hard_plus_dependency_index.txt with exactly
  this content: ''primary_task=windows.writer.toc_image_footnote\nlinux_peer=linux.writer.deduplicate_train_records\ndifficulty=hard-plus\nrequires_multi_artifact_handoff=true\noracle_receipt=hard_plus_oracle_receipt.txt'';
  C:\Users\User\Documents\helloworld_hard_plus\windows_writer_toc_image_footnote\hard_plus_review_matrix.csv with exactly
  this content: ''check,owner,status\nlinux_alignment,benchmark-ops,ready\nextra_artifacts,benchmark-ops,ready\noracle_recheck,benchmark-ops,required''.
  Use LibreOffice Writer for document artifacts; create any required .txt, .tsv, or .csv verification files directly at the
  specified paths using the available automation/runtime file-writing method, not Notepad or another text editor.'
init:
  initializer_id: initializers.windows.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_powershell
      script: "$py = @'\nimport os, subprocess, sys\ntry:\n    from docx import Document\nexcept ImportError:\n    subprocess.check_call([sys.executable,\
        \ \"-m\", \"pip\", \"install\", \"python-docx\", \"-q\"])\n    from docx import Document\n\ndoc = Document()\ndoc.add_paragraph(\"\
        HK Train Records\")\nfor line in ['time_06:02:00, A101, ST-01, 1', 'time_06:05:00, B202, ST-03, 2', 'time_06:08:00,\
        \ A101, ST-02, 1', 'time_06:12:00, C303, ST-04, 3', 'time_06:18:00, D404, ST-05, 1', 'time_06:22:00, B202, ST-06,\
        \ 2', 'time_06:30:00, E505, ST-02, 4', 'time_06:36:00, C303, ST-07, 3', 'time_06:44:00, F606, ST-08, 1', 'time_06:51:00,\
        \ G707, ST-09, 2', 'time_06:58:00, E505, ST-10, 4', 'time_07:04:00, H808, ST-11, 1']:\n    doc.add_paragraph(line)\n\
        path = os.path.join(os.environ[\"USERPROFILE\"], \"Downloads\", \"hk_train_record.docx\")\ndoc.save(path)\nprint(\"\
        INIT_OK\", path)\n'@\n$py | py -3 -W ignore -\n"
      timeout: 120
    - type: run_powershell
      script: "$docPath = Join-Path $env:USERPROFILE \"Downloads\\hk_train_record.docx\"\nif (-not (Test-Path $docPath)) {\
        \ throw \"Document not found: $docPath\" }\n$proc = Start-Process -FilePath $docPath -PassThru\nStart-Sleep -Seconds\
        \ 2\ntry {\n  $wshell = New-Object -ComObject WScript.Shell\n  $null = $wshell.AppActivate($proc.Id)\n} catch {}\n"
      timeout: 120
    - type: wait
      ms: 8000
evaluation:
  evaluator_id: evaluators.windows.libreoffice_writer:LibreOfficeWriterEvaluator
  params:
    check_id: writer_toc_image_footnote
    stdout_contains: EVAL_RESULT:PASS
    timeout: 90
    supplemental_checks:
      files:
      - path: C:\Users\User\Documents\helloworld_hard_plus\windows_writer_toc_image_footnote\hard_plus_handoff.tsv
        exact_text: "task_id\tlinux_peer\tstatus\nwindows.writer.toc_image_footnote\tlinux.writer.deduplicate_train_records\t\
          hard-plus-ready\napp\tlibreoffice-writer\tevaluator-checked"
      - path: C:\Users\User\Documents\helloworld_hard_plus\windows_writer_toc_image_footnote\hard_plus_dependency_index.txt
        exact_text: 'primary_task=windows.writer.toc_image_footnote

          linux_peer=linux.writer.deduplicate_train_records

          difficulty=hard-plus

          requires_multi_artifact_handoff=true

          oracle_receipt=hard_plus_oracle_receipt.txt'
      - path: C:\Users\User\Documents\helloworld_hard_plus\windows_writer_toc_image_footnote\hard_plus_review_matrix.csv
        exact_text: 'check,owner,status

          linux_alignment,benchmark-ops,ready

          extra_artifacts,benchmark-ops,ready

          oracle_recheck,benchmark-ops,required'
      powershell:
      - label: no_notepad_process
        script: '$p = Get-Process -Name notepad -ErrorAction SilentlyContinue

          if ($p) { Write-Output ''NOTEPAD_RUNNING''; exit 1 }

          Write-Output ''NO_NOTEPAD_PROCESS'''
        stdout_contains: NO_NOTEPAD_PROCESS
        expected_exit_code: 0
        timeout: 10
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - libreoffice
  - writer
  - docx
  - deduplication
  - data-cleanup
  - hard
  - single_app
  - evaluator_backed
  - hard-plus
  - multi_artifact_handoff
  - linux_plus
  difficulty: hard
  app_name: libreoffice-writer
  human_steps: 94
  description: 'Linux-aligned Writer task: remove duplicate train-record lines so one record remains per train ID.'
  hardness: hard-evaluable
  evaluation_standard: exact kept records, original order, title preservation, and absence of duplicate train IDs are checked
  linux_peer: linux.writer.deduplicate_train_records
  linux_peer_file: tasks/linux/writer_deduplicate_train_records_hard.yaml
  alignment_status: direct
  hard_plus_alignment: linux_peer_plus_extra_evaluator_checked_artifacts
  hard_plus_note: The Linux-aligned core task remains required; extra handoff/audit artifacts are also evaluator checked.
  oracle_model: windows_oracle
