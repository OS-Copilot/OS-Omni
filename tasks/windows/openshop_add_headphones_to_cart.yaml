task_id: windows.openshop.add_headphones_to_cart
platform: windows
instruction: 'In OpenShop, sign in with phone number 13800138000 and password spring2026. Build a six-item cart in this exact
  order. Before adding each item, go back to the catalog and use the required search/category/sort combination: 1. Verdant
  Pro Noise-Canceling Headphones, search "Verdant Pro Noise-Canceling Headphones", Electronics, Price High to Low, option
  Bluetooth 5.4; 2. Mountain Isle Pour-Over Coffee 20 Pack, search "Mountain Isle Pour-Over Coffee", Grocery, Price Low to
  High, option 20 sachets; 3. Lumen Magnetic Phone Stand, search "Lumen Magnetic Phone Stand", Electronics, Price Low to High,
  option Magnetic mount; 4. Polar Day Slim Business Backpack, search "Polar Day Slim Business Backpack", Bags, Price High
  to Low, option 15.6-inch fit; 5. Mukawa Folding Camping Table and Chair Set, search "Mukawa Folding Camping Table and Chair
  Set", Home, Price High to Low, option Storage bag; 6. Garden White Cotton Bedding Set 1.8m, search "Garden White Cotton
  Bedding Set", Home, Price Low to High, option 200x230cm. After all six products are visible together in the cart, perform
  these quantity changes in order and return each item to quantity 1 before moving to the next item: headphones 2, 1, 4, 1,
  2, 1; coffee 3, 1, 5, 1, 2, 1; phone stand 2, 1, 4, 1, 3, 1; backpack 3, 1, 5, 1, 2, 1; camping set 2, 1, 4, 1, 3, 1; bedding
  set 3, 1, 5, 1, 2, 1. Stop only when all six products are still listed together with quantity 1. Also create these hard-plus
  verification files so the final state is a multi-artifact handoff bundle: C:\Users\User\Documents\helloworld_hard_plus\windows_openshop_add_headphones_to_cart\hard_plus_handoff.tsv
  with exactly this content: ''task_id\tlinux_peer\tstatus\nwindows.openshop.add_headphones_to_cart\tlinux.openshop.add_headphones_to_cart\thard-plus-ready\napp\tOpenShop\tevaluator-checked'';
  C:\Users\User\Documents\helloworld_hard_plus\windows_openshop_add_headphones_to_cart\hard_plus_dependency_index.txt with
  exactly this content: ''primary_task=windows.openshop.add_headphones_to_cart\nlinux_peer=linux.openshop.add_headphones_to_cart\ndifficulty=hard-plus\nrequires_multi_artifact_handoff=true\noracle_receipt=hard_plus_oracle_receipt.txt'';
  C:\Users\User\Documents\helloworld_hard_plus\windows_openshop_add_headphones_to_cart\hard_plus_review_matrix.csv with exactly
  this content: ''check,owner,status\nlinux_alignment,benchmark-ops,ready\nextra_artifacts,benchmark-ops,ready\noracle_recheck,benchmark-ops,required''.
  Use the target application for the app workflow; create required hard-plus verification files directly at the specified
  paths using the available automation/runtime file-writing method, not Notepad or another text editor.'
