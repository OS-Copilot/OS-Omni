task_id: windows.cross_vm.calc_budget_review_hard
platform: windows
instruction: A blank LibreOffice Calc workbook named "budget_review.xlsx" is open, and the transferred CSV "budget_transfer.csv"
  is on the Desktop. Use only LibreOffice Calc on Windows. Build a six-sheet workbook from the transferred CSV. Sheet 1 must
  be named RawBudget and contain all sixteen rows with columns Category, Planned, Actual, Owner, Region, DueDate. Sheet 2
  must be named VarianceReview and use formulas to reference RawBudget, compute Variance, Variance Abs, Status, Severity,
  Review Flag, Disposition, Recheck Owner, Review Slot, Audit ID, Cross-VM Trace, Evidence Link, and Packet Type for every
  row. Sheet 3 must be named EscalationQueue and list only rows whose Variance Abs is at least 100, using formulas that reference
  VarianceReview. Sheet 4 must be OwnerSummary with SUMIF/COUNTIFS formulas by owner. Sheet 5 must be RegionalSummary with
  SUMIF/COUNTIFS formulas by region. Sheet 6 must be ControlPanel with imported row count, total planned, total actual, net
  variance, absolute variance, escalation count, critical count, and Android Transfer Status. Save the workbook.
init:
  initializer_id: initializers.windows.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_powershell
      script: "$ErrorActionPreference = 'Stop'\nGet-Process soffice,soffice.bin,scalc -ErrorAction SilentlyContinue |\n  Stop-Process\
        \ -Force -ErrorAction SilentlyContinue\n$workbookPath = Join-Path $env:USERPROFILE 'Documents\\budget_review.xlsx'\n\
        $transferPath = Join-Path $env:USERPROFILE 'Desktop\\budget_transfer.csv'\nNew-Item -ItemType Directory -Path (Split-Path\
        \ $workbookPath) -Force | Out-Null\nNew-Item -ItemType Directory -Path (Split-Path $transferPath) -Force | Out-Null\n\
        @'\nCategory,Planned,Actual,Owner,Region,DueDate\nTravel,1200,980,Jordan Lee,West,2026-07-01\nLodging,2100,2240,Maya\
        \ Chen,West,2026-07-03\nMeals,450,390,Priya Nair,Central,2026-07-04\nSupplies,300,340,Theo Martin,East,2026-07-05\n\
        Contingency,600,720,Maya Chen,Central,2026-07-08\nPermits,250,410,Jordan Lee,East,2026-07-09\nTraining,500,455,Priya\
        \ Nair,West,2026-07-10\nEquipment,850,1025,Theo Martin,Central,2026-07-11\nInsurance,430,610,Maya Chen,East,2026-07-12\n\
        Catering,780,695,Priya Nair,Central,2026-07-13\nVenue,3200,3560,Jordan Lee,West,2026-07-14\nSecurity,950,910,Theo\
        \ Martin,East,2026-07-15\nInterpretation,640,820,Maya Chen,Central,2026-07-16\nSignage,380,260,Jordan Lee,East,2026-07-17\n\
        Transport,1450,1695,Theo Martin,West,2026-07-18\nAccessibility,520,750,Priya Nair,Central,2026-07-19\n'@.Trim() |\
        \ Set-Content -LiteralPath $transferPath -Encoding UTF8\n$code = @'\nimport os\nimport subprocess\nimport sys\n\n\
        try:\n    from openpyxl import Workbook\nexcept ImportError:\n    subprocess.check_call([sys.executable, \"-m\", \"\
        pip\", \"install\", \"openpyxl\", \"-q\"])\n    from openpyxl import Workbook\n\npath = os.path.join(os.environ[\"\
        USERPROFILE\"], \"Documents\", \"budget_review.xlsx\")\nos.makedirs(os.path.dirname(path), exist_ok=True)\nwb = Workbook()\n\
        wb.active.title = \"Budget\"\nwb.save(path)\nprint(\"INIT_OK\", path)\n'@\n$code | py -3 -W ignore -\nif ($LASTEXITCODE\
        \ -ne 0) { throw \"Failed to create budget_review.xlsx\" }\nif (-not (Test-Path -LiteralPath $workbookPath)) { throw\
        \ \"Missing initialized workbook: $workbookPath\" }\nif (-not (Test-Path -LiteralPath $transferPath)) { throw \"Missing\
        \ transferred CSV: $transferPath\" }\n"
      timeout: 60
    - type: run_powershell
      script: "$ErrorActionPreference = 'Stop'\n$filePath = Join-Path $env:USERPROFILE 'Documents\\budget_review.xlsx'\nif\
        \ (-not (Test-Path -LiteralPath $filePath)) { throw \"Missing workbook before launch: $filePath\" }\n$candidates =\
        \ @(\n  'C:\\Program Files\\LibreOffice\\program\\scalc.exe',\n  'C:\\Program Files (x86)\\LibreOffice\\program\\\
        scalc.exe',\n  'C:\\Program Files\\LibreOffice\\program\\soffice.exe',\n  'C:\\Program Files (x86)\\LibreOffice\\\
        program\\soffice.exe',\n  'C:\\Program Files\\LibreOffice 26\\program\\scalc.exe',\n  'C:\\Program Files\\LibreOffice\
        \ 26\\program\\soffice.exe'\n)\n$officeExe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1\n\
        if (-not $officeExe) {\n  $cmd = Get-Command scalc.exe -ErrorAction SilentlyContinue\n  if ($cmd) { $officeExe = $cmd.Source\
        \ }\n}\nif (-not $officeExe) { throw 'LibreOffice Calc executable not found' }\nStart-Process -FilePath $officeExe\
        \ -ArgumentList \"`\"$filePath`\"\"\n"
      timeout: 30
    - type: wait
      ms: 5000
