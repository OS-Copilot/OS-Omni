task_id: windows.wireshark.statistics_report
platform: windows
instruction: 'In Wireshark, use the already-open sample.pcapng capture to create a Linux-aligned link and SYN export bundle.
  Export displayed packets as pcapng files in Downloads with these exact names and filters: arp_only.pcapng using arp, icmp_only.pcapng
  using icmp, syn_only.pcapng using tcp.flags.syn == 1 && tcp.flags.ack == 0, dns_all_for_link.pcapng using dns, http_request_only.pcapng
  using http.request, http_response_only.pcapng using http.response, udp_only.pcapng using udp, and tcp80_only.pcapng using
  tcp.port == 80. Also create C:\Users\User\Downloads\link_syn_manifest.txt with exactly these lines: arp/syn split complete;
  ICMP echo pair exported; all DNS copy exported; HTTP request-response plus UDP exported; TCP80 slice exported. Also create
  these hard-plus verification files so the final state is a multi-artifact handoff bundle: C:\Users\User\Documents\helloworld_hard_plus\windows_wireshark_statistics_report\hard_plus_handoff.tsv
  with exactly this content: ''task_id\tlinux_peer\tstatus\nwindows.wireshark.statistics_report\tlinux.wireshark.export_link_and_syn_bundle\thard-plus-ready\napp\twireshark\tevaluator-checked'';
  C:\Users\User\Documents\helloworld_hard_plus\windows_wireshark_statistics_report\hard_plus_dependency_index.txt with exactly
  this content: ''primary_task=windows.wireshark.statistics_report\nlinux_peer=linux.wireshark.export_link_and_syn_bundle\ndifficulty=hard-plus\nrequires_multi_artifact_handoff=true\noracle_receipt=hard_plus_oracle_receipt.txt'';
  C:\Users\User\Documents\helloworld_hard_plus\windows_wireshark_statistics_report\hard_plus_review_matrix.csv with exactly
  this content: ''check,owner,status\nlinux_alignment,benchmark-ops,ready\nextra_artifacts,benchmark-ops,ready\noracle_recheck,benchmark-ops,required''.
  Use Wireshark for capture filtering/export work and create required manifest or verification files directly at the specified
  paths using the available automation/runtime file-writing method; do not open Notepad or another text editor.'
init:
  initializer_id: initializers.windows.setup:DesktopSetupInitializer
  params:
    steps:
    - type: upload_file
      local_path: platforms/windows/vm/setup/sample.pcapng
      path: C:\Users\User\Downloads\sample.pcapng
    - type: run_powershell
      script: "$dlDir = \"C:\\Users\\User\\Downloads\"\nif (-not (Test-Path $dlDir)) { New-Item -ItemType Directory -Path\
        \ $dlDir -Force | Out-Null }\n$pcap = Join-Path $dlDir \"sample.pcapng\"\n\nif (-not (Test-Path $pcap)) {\n  $url\
        \ = \"https://wiki.wireshark.org/uploads/__moin_import__/attachments/SampleCaptures/http.cap\"\n  try {\n    Invoke-WebRequest\
        \ -Uri $url -OutFile $pcap -UseBasicParsing\n  } catch {\n    [IO.File]::WriteAllBytes($pcap, [byte[]](0))\n  }\n\
        }\n\n# Clean previous outputs\nforeach ($f in @(\"protocol_hierarchy.txt\", \"ipv4_conversations.txt\")) {\n  $p =\
        \ Join-Path $dlDir $f\n  if (Test-Path $p) { Remove-Item $p -Force }\n}\n\n$wiresharkExe = \"C:\\Program Files\\Wireshark\\\
        Wireshark.exe\"\nif (Test-Path $wiresharkExe) {\n  Start-Process -FilePath $wiresharkExe -ArgumentList $pcap\n  Write-Output\
        \ \"INIT_OK\"\n} else {\n  Write-Error \"Wireshark not installed\"\n}\n"
      timeout: 60
    - type: wait
      ms: 6000
evaluation:
  evaluator_id: evaluators.windows.wireshark:WiresharkEvaluator
  params:
    check_id: wireshark_statistics_report
    stdout_contains: EVAL_RESULT:PASS
    timeout: 15
    supplemental_checks:
      files:
      - path: C:\Users\User\Documents\helloworld_hard_plus\windows_wireshark_statistics_report\hard_plus_handoff.tsv
        exact_text: "task_id\tlinux_peer\tstatus\nwindows.wireshark.statistics_report\tlinux.wireshark.export_link_and_syn_bundle\t\
          hard-plus-ready\napp\twireshark\tevaluator-checked"
      - path: C:\Users\User\Documents\helloworld_hard_plus\windows_wireshark_statistics_report\hard_plus_dependency_index.txt
        exact_text: 'primary_task=windows.wireshark.statistics_report

          linux_peer=linux.wireshark.export_link_and_syn_bundle

          difficulty=hard-plus

          requires_multi_artifact_handoff=true

          oracle_receipt=hard_plus_oracle_receipt.txt'
      - path: C:\Users\User\Documents\helloworld_hard_plus\windows_wireshark_statistics_report\hard_plus_review_matrix.csv
        exact_text: 'check,owner,status

          linux_alignment,benchmark-ops,ready

          extra_artifacts,benchmark-ops,ready

          oracle_recheck,benchmark-ops,required'
      powershell:
      - label: no_notepad_process
        script: '$p = Get-Process -Name notepad -ErrorAction SilentlyContinue

          if ($p) { Write-Output ''NOTEPAD_RUNNING''; exit 1 }

          Write-Output ''NO_NOTEPAD_PROCESS'''
        stdout_contains: NO_NOTEPAD_PROCESS
        expected_exit_code: 0
        timeout: 10
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - wireshark
  - statistics
  - export
  - pcap
  - hard
  - single_app
  - evaluator_backed
  - hard-plus
  - multi_artifact_handoff
  - linux_plus
  difficulty: hard
  app_name: wireshark
  human_steps: 114
  description: 'Linux-aligned Wireshark hard task: create eight filtered network exports plus an exact link/SYN manifest file.'
  hardness: hard-evaluable
  evaluation_standard: all exported pcapng artifacts are readable and match their declared filters when non-empty; exact manifest
    content is checked
  linux_peer: linux.wireshark.export_link_and_syn_bundle
  linux_peer_file: tasks/linux/wireshark_export_link_and_syn_bundle_hard.yaml
  alignment_status: direct
  hard_plus_alignment: linux_peer_plus_extra_evaluator_checked_artifacts
  hard_plus_note: The Linux-aligned core task remains required; extra handoff/audit artifacts are also evaluator checked.
  oracle_model: windows_oracle
