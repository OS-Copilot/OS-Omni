# Generated by tools/import_cua_tasks_review.py; do not edit by hand.
task_id: windows.openfood.place_order_from_existing_restaurants
platform: windows
instruction: 'Place an order in the OpenFood application while signed in as Lucas Lin, resulting in a
  final state of an order confirmation page, the Orders page, or the current Cart panel after attempting
  to place the order. The order must contain exactly one item from each of five specific restaurants,
  added in the following sequence: one salad item from Station Riverwalk Deli No. 33 Aurora IL using default
  specifications, the first available item from Fox Valley Grill Union Aurora IL with default options,
  the first available item from Dumpling Room No. 20 San Jose CA with default options, the first available
  Vietnamese or sandwich item from Santana Row Banh Mi Market No. 12 San Jose CA with default options,
  and the first available item from Harbor Space City Viet-Cajun Houston TX with default options. Before
  submission, the quantity of the first item in the cart must be increased to 2 and then decreased back
  to 1, and the same increase-to-2 and decrease-to-1 adjustment must be performed on the current item.
  The Coupon dropdown must be set to "No coupon" prior to submission.'
init:
  initializer_id: initializers.windows.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_powershell
      script: |
        $marker = Join-Path $env:TEMP "os_omni_openfood_order_marker.txt"
        (Get-Date).ToUniversalTime().ToString("o") | Set-Content -LiteralPath $marker -Encoding UTF8
        Write-Output "INIT_OK: assuming VM snapshot Snapshot_2 already contains OpenFood installed and signed in as Lucas Lin. Initializer wrote only an evaluation start timestamp marker and did not restore snapshots, create orders, alter the database, click OpenFood, or complete any evaluated task action."
      timeout: 10
    - type: run_powershell
      script: |
        $ErrorActionPreference = "Stop"
        $candidates = @(
          "$env:USERPROFILE\Desktop\OpenFood.lnk",
          "$env:USERPROFILE\OneDrive\Desktop\OpenFood.lnk",
          "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\OpenFood.lnk",
          "$env:LOCALAPPDATA\Programs\OpenFood\OpenFood.exe",
          "C:\Program Files\OpenFood\OpenFood.exe"
        )
        $target = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
        if ($target) {
          Start-Process -FilePath $target -WindowStyle Normal
          Write-Output "INIT_OK: launched OpenFood from $target"
        } else {
          Start-Process -FilePath "OpenFood"
          Write-Output "INIT_OK: launched OpenFood from PATH"
        }
      timeout: 30
    - type: wait
      ms: 2500
evaluation:
  evaluator_id: evaluators.windows.powershell_check:PowerShellCheckEvaluator
  params:
    timeout: 45
    stdout_contains: EVAL_RESULT:PASS
    command: |+
      $ErrorActionPreference = "Stop"
      $marker = Join-Path $env:TEMP "os_omni_openfood_order_marker.txt"
      $markerIso = if (Test-Path -LiteralPath $marker) { (Get-Content -LiteralPath $marker -Raw).Trim() } else { "" }
      $storageRoot = Join-Path $env:APPDATA "openfood\Local Storage\leveldb"
      $copyRoot = Join-Path $env:TEMP "os_omni_openfood_leveldb_eval"
      if (Test-Path -LiteralPath $copyRoot) { Remove-Item -LiteralPath $copyRoot -Recurse -Force }
      New-Item -ItemType Directory -Path $copyRoot -Force | Out-Null
      if (Test-Path -LiteralPath $storageRoot) {
        Get-ChildItem -LiteralPath $storageRoot -File -Include *.log,*.ldb -ErrorAction SilentlyContinue | ForEach-Object {
          Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $copyRoot $_.Name) -Force -ErrorAction SilentlyContinue
        }
      }
      $code = @'
      import json
      import os
      import re

      marker_iso = os.environ.get("OPENFOOD_MARKER_ISO", "").strip()
      copy_root = os.environ.get("OPENFOOD_LEVELDB_COPY", "").strip()
      failures = []
      checks = []
      observed = {}

      checks.append({
          "name": "marker_timestamp_optional",
          "expected": "present during full execution; optional during manual_eval",
          "actual": bool(marker_iso),
          "marker": marker_iso,
      })

      def iter_storage_files(root):
          if not root or not os.path.isdir(root):
              return []
          items = []
          for name in os.listdir(root):
              if name.endswith((".log", ".ldb")):
                  path = os.path.join(root, name)
                  try:
                      items.append((os.path.getmtime(path), path))
                  except OSError:
                      pass
          return [path for _, path in sorted(items)]

      def extract_states(text):
          states = []
          decoder = json.JSONDecoder()
          for match in re.finditer(r'\{"view":', text):
              try:
                  state, end = decoder.raw_decode(text[match.start():])
              except Exception:
                  continue
              if isinstance(state, dict) and "createdOrders" in state and "userId" in state:
                  states.append(state)
          return states

      storage_files = iter_storage_files(copy_root)
      checks.append({
          "name": "openfood_leveldb_copy_found",
          "expected": "copied .log or .ldb files from %APPDATA%\\openfood\\Local Storage\\leveldb",
          "actual": len(storage_files),
          "files": [os.path.basename(path) for path in storage_files],
      })
      if not storage_files:
          failures.append("Could not copy OpenFood Electron localStorage LevelDB files")

      states = []
      for path in storage_files:
          try:
              raw = open(path, "rb").read()
          except OSError:
              continue
          text = raw.decode("utf-8", "ignore")
          states.extend(extract_states(text))

      observed["state_count"] = len(states)
      checks.append({"name": "openfood_static_state_found", "expected": True, "actual": bool(states)})
      if not states:
          failures.append("Could not find openfood-static-state-v1 JSON state in localStorage")

      state = states[-1] if states else {}
      observed["latest_state"] = {
          "view": state.get("view"),
          "userId": state.get("userId"),
          "selectedRestaurantId": state.get("selectedRestaurantId"),
          "activeCoupon": state.get("activeCoupon"),
          "cart": state.get("cart"),
          "createdOrders": state.get("createdOrders"),
      }

      restaurant_ids = {
          "r7": "Station Riverwalk Deli No. 33 Aurora IL",
          "r8": "Fox Valley Grill Union Aurora IL",
          "r1": "Dumpling Room No. 20 San Jose CA",
          "r2": "Santana Row Banh Mi Market No. 12 San Jose CA",
          "r18": "Harbor Space City Viet-Cajun Houston TX",
      }

      required_restaurant_sequence = ["r7", "r8", "r1", "r2", "r18"]
      selected_sequence = [
          item.get("selectedRestaurantId")
          for item in states
          if item.get("selectedRestaurantId") in restaurant_ids
      ]
      compacted_sequence = []
      for restaurant_id in selected_sequence:
          if not compacted_sequence or compacted_sequence[-1] != restaurant_id:
              compacted_sequence.append(restaurant_id)

      cursor = 0
      for restaurant_id in compacted_sequence:
          if cursor < len(required_restaurant_sequence) and restaurant_id == required_restaurant_sequence[cursor]:
              cursor += 1
      visited_required_in_order = cursor == len(required_restaurant_sequence)
      observed["selected_restaurant_sequence"] = compacted_sequence
      checks.append({
          "name": "visited_required_restaurants_in_order",
          "expected": [
              "{} / {}".format(rid, restaurant_ids[rid])
              for rid in required_restaurant_sequence
          ],
          "actual": compacted_sequence,
          "pass": visited_required_in_order,
      })
      if states and not visited_required_in_order:
          failures.append(
              "Required restaurant visit sequence was not observed in localStorage state history: {}".format(
                  " -> ".join(required_restaurant_sequence)
              )
          )

      cart_activity_by_restaurant = {}
      for item in states:
          restaurant_id = item.get("selectedRestaurantId")
          if restaurant_id not in restaurant_ids:
              continue
          cart = item.get("cart") or []
          created_orders = item.get("createdOrders") or []
          has_order = any(order.get("restaurantId") == restaurant_id for order in created_orders if isinstance(order, dict))
          if cart or has_order:
              cart_activity_by_restaurant.setdefault(restaurant_id, {
                  "restaurantName": restaurant_ids[restaurant_id],
                  "cartStates": 0,
                  "orderStates": 0,
              })
              if cart:
                  cart_activity_by_restaurant[restaurant_id]["cartStates"] += 1
              if has_order:
                  cart_activity_by_restaurant[restaurant_id]["orderStates"] += 1

      missing_cart_activity = [
          rid for rid in required_restaurant_sequence
          if rid not in cart_activity_by_restaurant
      ]
      observed["cart_activity_by_restaurant"] = cart_activity_by_restaurant
      checks.append({
          "name": "cart_or_order_activity_for_each_required_restaurant",
          "expected": [
              "{} / {}".format(rid, restaurant_ids[rid])
              for rid in required_restaurant_sequence
          ],
          "actual": cart_activity_by_restaurant,
          "pass": not missing_cart_activity,
      })
      if states and missing_cart_activity:
          failures.append(
              "Missing add-to-cart/order evidence for required restaurants: {}".format(
                  ", ".join("{} ({})".format(rid, restaurant_ids[rid]) for rid in missing_cart_activity)
              )
          )

      user_ok = state.get("userId") == "lucas"
      checks.append({"name": "signed_in_lucas", "expected": "lucas", "actual": state.get("userId"), "pass": user_ok})
      if states and not user_ok:
          failures.append("OpenFood is not signed in as Lucas Lin (userId lucas)")

      orders = state.get("createdOrders") or []
      candidate = orders[-1] if orders else None
      checks.append({"name": "created_order_exists", "expected": "at least one locally created order", "actual": len(orders), "pass": bool(candidate)})
      if states and not candidate:
          failures.append("No created order was found in OpenFood localStorage")

      if candidate:
          observed["candidate_order"] = candidate
          restaurant_id = candidate.get("restaurantId")
          expected_restaurant = restaurant_ids.get(restaurant_id)
          restaurant_ok = restaurant_id == "r18"
          checks.append({
              "name": "latest_order_from_final_instructed_restaurant",
              "expected": "r18 / Harbor Space City Viet-Cajun Houston TX",
              "actual": {"restaurantId": restaurant_id, "restaurantName": expected_restaurant},
              "pass": restaurant_ok,
          })
          if not restaurant_ok:
              failures.append("Latest created order is from restaurantId {!r}, expected r18 Harbor Space City Viet-Cajun Houston TX".format(restaurant_id))

          status = str(candidate.get("status") or "")
          status_ok = status.lower() in {"preparing", "pending", "accepted", "placed"}
          checks.append({"name": "order_status_active", "expected": ["Preparing", "Pending", "Accepted", "Placed"], "actual": status, "pass": status_ok})
          if not status_ok:
              failures.append("Latest created order status is {!r}".format(status))

          items = candidate.get("items") or []
          item_count_ok = len(items) >= 1
          checks.append({"name": "order_has_items", "expected_min": 1, "actual": len(items), "pass": item_count_ok})
          if not item_count_ok:
              failures.append("Latest created order has no items")

          quantities = []
          for item in items:
              qty = item[1] if isinstance(item, list) and len(item) > 1 else None
              quantities.append(qty)
          quantities_ok = bool(quantities) and all(int(qty) == 1 for qty in quantities if qty is not None)
          checks.append({"name": "final_item_quantities_one", "expected": "all ordered item quantities equal 1", "actual": quantities, "pass": quantities_ok})
          if not quantities_ok:
              failures.append("One or more final order item quantities are not 1")

          total = candidate.get("total")
          try:
              total_ok = float(total) > 0
          except Exception:
              total_ok = False
          checks.append({"name": "positive_total", "expected": "> 0", "actual": total, "pass": total_ok})
          if not total_ok:
              failures.append("Latest created order total is not positive")

      no_coupon = state.get("activeCoupon") in {None, ""}
      checks.append({"name": "no_coupon_selected", "expected": "empty activeCoupon", "actual": state.get("activeCoupon"), "pass": no_coupon})
      if states and not no_coupon:
          failures.append("OpenFood activeCoupon is {!r}, expected No coupon/empty".format(state.get("activeCoupon")))

      cart_empty = state.get("cart") == []
      checks.append({"name": "cart_cleared_after_place_order", "expected": [], "actual": state.get("cart"), "pass": cart_empty})
      if states and not cart_empty:
          failures.append("Cart was not cleared after placing the order")

      view_ok = state.get("view") in {"orders", "home", "restaurant"}
      checks.append({"name": "final_view_allowed", "expected": ["orders", "home", "restaurant"], "actual": state.get("view"), "pass": view_ok})
      if states and not view_ok:
          failures.append("Final OpenFood view {!r} is not an allowed final page".format(state.get("view")))

      payload = {
          "target": "OpenFood localStorage order placed by Lucas Lin in Snapshot_2",
          "storage_copy_dir": copy_root,
          "checks": checks,
          "observed": observed,
          "failures": failures,
      }
      print(json.dumps(payload, ensure_ascii=False, indent=2))
      print("EVAL_RESULT:PASS" if not failures else "EVAL_RESULT:FAIL")
      '@
      $env:OPENFOOD_MARKER_ISO = $markerIso
      $env:OPENFOOD_LEVELDB_COPY = $copyRoot
      $tmp = Join-Path $env:TEMP "os_omni_openfood_order_eval.py"
      Set-Content -LiteralPath $tmp -Value $code -Encoding UTF8
      py -3 $tmp

