task_id: windows.blender.warehouse_blockout_scene
platform: windows
instruction: 'In Blender, product_stage.blend is already open. Build the Linux-style restage product delivery, but make the
  Windows version harder by producing an eleven-file multi-blend dependency network. First update and save the primary scene
  as C:\Users\User\Documents\blender_tasks\blender_restage_product\product_stage.blend: set product_stage.blend render resolution
  to 1536 by 1080 at 90 percent scale, set FPS to 24, set the frame range to start at 15 and end at 180, set the output path
  to //renders/restage_layout.png. Apply the primary scene object changes one by one using explicit X, Y, and Z values: Set
  or create FeatureCube, move FeatureCube to X 2, Y -1, Z 1.5, rotate FeatureCube to X 0, Y 12, Z -16 degrees, scale FeatureCube
  to X 1.4, Y 0.8, Z 1.9, set FeatureCube diffuse material RGB to 0.78, 0.22, 0.14. Set or create AccentCylinder, move AccentCylinder
  to X -2.3, Y 1.2, Z 0.9, rotate AccentCylinder to X 4, Y 0, Z 14 degrees, scale AccentCylinder to X 0.6, Y 0.6, Z 2.2, set
  AccentCylinder diffuse material RGB to 0.12, 0.52, 0.7. Set or create HeroSphere, move HeroSphere to X 2.9, Y 2.1, Z 1.35,
  rotate HeroSphere to X 18, Y 0, Z -24 degrees, scale HeroSphere to X 1.15, Y 1.15, Z 1.15, set HeroSphere diffuse material
  RGB to 0.96, 0.78, 0.22. Set or create BackdropPlane, move BackdropPlane to X -0.15, Y 0.25, Z -0.05, rotate BackdropPlane
  to X 1, Y -1.5, Z 7 degrees, scale BackdropPlane to X 6.0, Y 4.5, Z 1.0, set BackdropPlane diffuse material RGB to 0.04,
  0.05, 0.06. Set or create ScaleMarker, move ScaleMarker to X 0.4, Y -2.2, Z 0.65, rotate ScaleMarker to X 0, Y 0, Z 32 degrees,
  scale ScaleMarker to X 0.35, Y 0.35, Z 1.1, set ScaleMarker diffuse material RGB to 0.22, 0.86, 0.38. Set or create BalancePuck,
  move BalancePuck to X -2.8, Y -1.4, Z 0.45, rotate BalancePuck to X 9, Y 0, Z -22 degrees, scale BalancePuck to X 0.55,
  Y 0.55, Z 0.25, set BalancePuck diffuse material RGB to 0.82, 0.82, 0.18. Set or create DepthRail, move DepthRail to X 1.2,
  Y 2.7, Z 0.25, rotate DepthRail to X 0, Y 0, Z -8 degrees, scale DepthRail to X 2.4, Y 0.18, Z 0.28, set DepthRail diffuse
  material RGB to 0.18, 0.62, 0.88. Set or create FocusDot, move FocusDot to X -1.3, Y 2.4, Z 0.42, rotate FocusDot to X 0,
  Y 0, Z 14 degrees, scale FocusDot to X 0.22, Y 0.22, Z 0.22, set FocusDot diffuse material RGB to 0.95, 0.32, 0.74. Set
  or create BacklineStrip, move BacklineStrip to X -0.55, Y 3.1, Z 0.03, rotate BacklineStrip to X 0, Y 0, Z 18 degrees, scale
  BacklineStrip to X 3.1, Y 0.16, Z 1.0, set BacklineStrip diffuse material RGB to 0.14, 0.28, 0.92. Set or create OrbitMarker,
  move OrbitMarker to X 3.25, Y 0.55, Z 0.72, rotate OrbitMarker to X 0, Y 0, Z -38 degrees, scale OrbitMarker to X 0.24,
  Y 0.24, Z 0.78, set OrbitMarker diffuse material RGB to 0.9, 0.48, 0.12. Set or create AnchorCube, move AnchorCube to X
  -3.25, Y 0.85, Z 0.3, rotate AnchorCube to X 0, Y 0, Z 26 degrees, scale AnchorCube to X 0.42, Y 0.42, Z 0.36, set AnchorCube
  diffuse material RGB to 0.62, 0.18, 0.96. Set or create TensionSphere, move TensionSphere to X 0.1, Y 2.1, Z 0.52, rotate
  TensionSphere to X 7, Y 0, Z -11 degrees, scale TensionSphere to X 0.28, Y 0.28, Z 0.28, set TensionSphere diffuse material
  RGB to 0.12, 0.92, 0.92. Set or create ShelfPlane, move ShelfPlane to X -2.2, Y 2.9, Z 0.05, rotate ShelfPlane to X 0, Y
  0, Z -14 degrees, scale ShelfPlane to X 1.6, Y 0.2, Z 1.0, set ShelfPlane diffuse material RGB to 0.74, 0.74, 0.2. Set or
  create ReviewPost, move ReviewPost to X 2.75, Y -2.2, Z 0.9, rotate ReviewPost to X 0, Y 0, Z 41 degrees, scale ReviewPost
  to X 0.2, Y 0.2, Z 1.25, set ReviewPost diffuse material RGB to 0.95, 0.18, 0.18. Set or create LabelCube, move LabelCube
  to X -0.35, Y -3.05, Z 0.24, rotate LabelCube to X 0, Y 0, Z 5 degrees, scale LabelCube to X 0.55, Y 0.18, Z 0.28, set LabelCube
  diffuse material RGB to 0.2, 0.95, 0.52. Set or create ReviewFlag, move ReviewFlag to X 1.85, Y -3.25, Z 0.06, rotate ReviewFlag
  to X 0, Y 0, Z 12 degrees, scale ReviewFlag to X 1.2, Y 0.16, Z 1.0, set ReviewFlag diffuse material RGB to 0.88, 0.88,
  0.32. Set or create VariancePin, move VariancePin to X -3.35, Y -0.85, Z 0.46, rotate VariancePin to X 0, Y 0, Z -17 degrees,
  scale VariancePin to X 0.18, Y 0.18, Z 0.18, set VariancePin diffuse material RGB to 0.32, 0.88, 0.95. Set or create BaselineRail,
  move BaselineRail to X 0.75, Y 3.35, Z 0.2, rotate BaselineRail to X 0, Y 0, Z 3 degrees, scale BaselineRail to X 2.2, Y
  0.1, Z 0.24, set BaselineRail diffuse material RGB to 0.95, 0.42, 0.2. Set or create Camera, move Camera to X 7.8, Y -7.0,
  Z 6.2, rotate Camera to X 60, Y 0, Z 48 degrees. Set or create FillLight, move FillLight to X 1.4, Y -3.6, Z 7.0, rotate
  FillLight to X 50, Y 0, Z 35 degrees, scale FillLight to X 1.25, Y 1.25, Z 1.25. After saving the primary scene, create
  ten separate Blender delivery files from that scene. Each file must be saved as its own .blend file, and each one has its
  own render setup and object adjustments: Delivery file 1: save C:\Users\User\Documents\blender_tasks\blender_restage_product\restage_review_closeup.blend;
  set closeup render resolution to 1280 by 960 at 100 percent scale, set the frame range to start at 30 and end at 120, set
  the output path to //renders/restage_review_closeup.png. In closeup, adjust Camera, move Camera to X 5.2, Y -5.1, Z 4.4,
  rotate Camera to X 61, Y 0, Z 44 degrees. In closeup, adjust FeatureCube, move FeatureCube to X 1.75, Y -0.65, Z 1.7, scale
  FeatureCube to X 1.55, Y 0.9, Z 2.05. In closeup, adjust VariancePin, move VariancePin to X -2.95, Y -0.55, Z 0.55. Delivery
  file 2: save C:\Users\User\Documents\blender_tasks\blender_restage_product\restage_archive_wide.blend; set archive render
  resolution to 2048 by 1152 at 90 percent scale, set the frame range to start at 1 and end at 180, set the output path to
  //renders/restage_archive_wide.png. In archive, adjust Camera, move Camera to X 8.8, Y -8.0, Z 6.8, rotate Camera to X 57,
  Y 0, Z 52 degrees. In archive, adjust BackdropPlane, scale BackdropPlane to X 6.8, Y 5.0, Z 1.0. In archive, adjust BaselineRail,
  move BaselineRail to X 0.95, Y 3.55, Z 0.22. Delivery file 3: save C:\Users\User\Documents\blender_tasks\blender_restage_product\restage_qa_isolation.blend;
  set qa render resolution to 1440 by 1440 at 100 percent scale, set the frame range to start at 60 and end at 150, set the
  output path to //renders/restage_qa_isolation.png. In qa, adjust Camera, move Camera to X 4.6, Y -6.2, Z 5.1, rotate Camera
  to X 62, Y 0, Z 39 degrees. In qa, adjust ReviewPost, move ReviewPost to X 2.35, Y -2.55, Z 1.05, scale ReviewPost to X
  0.18, Y 0.18, Z 1.45. In qa, adjust FocusDot, move FocusDot to X -1.05, Y 2.65, Z 0.52. Delivery file 4: save C:\Users\User\Documents\blender_tasks\blender_restage_product\restage_dependency_audit.blend;
  set dependency render resolution to 1920 by 1080 at 100 percent scale, set the frame range to start at 45 and end at 135,
  set the output path to //renders/restage_dependency_audit.png. In dependency, adjust Camera, move Camera to X 6.4, Y -6.6,
  Z 5.6, rotate Camera to X 60, Y 0, Z 45 degrees. In dependency, adjust TensionSphere, move TensionSphere to X 0.35, Y 2.35,
  Z 0.62. In dependency, adjust BaselineRail, scale BaselineRail to X 2.45, Y 0.12, Z 0.28. Delivery file 5: save C:\Users\User\Documents\blender_tasks\blender_restage_product\restage_colorway_variant.blend;
  set colorway_variant render resolution to 1500 by 1000 at 100 percent scale, set FPS to 24, set the frame range to start
  at 20 and end at 110, set the output path to //renders/restage_colorway_variant.png. In colorway_variant, adjust Camera,
  move Camera to X 6.2, Y -5.9, Z 4.9, rotate Camera to X 60, Y 0, Z 43 degrees. In colorway_variant, adjust FeatureCube,
  set FeatureCube diffuse material RGB to 0.18, 0.56, 0.96. In colorway_variant, adjust HeroSphere, set HeroSphere diffuse
  material RGB to 0.98, 0.38, 0.18. Delivery file 6: save C:\Users\User\Documents\blender_tasks\blender_restage_product\restage_shadow_pass.blend;
  set shadow_pass render resolution to 1680 by 1050 at 100 percent scale, set FPS to 24, set the frame range to start at 35
  and end at 150, set the output path to //renders/restage_shadow_pass.png. In shadow_pass, adjust Camera, move Camera to
  X 8.2, Y -7.2, Z 6.0, rotate Camera to X 58, Y 0, Z 50 degrees. In shadow_pass, adjust BackdropPlane, scale BackdropPlane
  to X 7.1, Y 5.25, Z 1.0. In shadow_pass, adjust ShelfPlane, move ShelfPlane to X -2.45, Y 3.1, Z 0.08, scale ShelfPlane
  to X 1.95, Y 0.24, Z 1.0. Delivery file 7: save C:\Users\User\Documents\blender_tasks\blender_restage_product\restage_label_closeup.blend;
  set label_closeup render resolution to 1100 by 1100 at 100 percent scale, set FPS to 24, set the frame range to start at
  70 and end at 132, set the output path to //renders/restage_label_closeup.png. In label_closeup, adjust Camera, move Camera
  to X 4.0, Y -4.3, Z 3.8, rotate Camera to X 60, Y 0, Z 37 degrees. In label_closeup, adjust LabelCube, move LabelCube to
  X -0.15, Y -3.2, Z 0.32, scale LabelCube to X 0.7, Y 0.22, Z 0.36. In label_closeup, adjust ReviewFlag, move ReviewFlag
  to X 2.1, Y -3.45, Z 0.1, scale ReviewFlag to X 1.45, Y 0.2, Z 1.0. Delivery file 8: save C:\Users\User\Documents\blender_tasks\blender_restage_product\restage_depth_review.blend;
  set depth_review render resolution to 1800 by 1200 at 100 percent scale, set FPS to 24, set the frame range to start at
