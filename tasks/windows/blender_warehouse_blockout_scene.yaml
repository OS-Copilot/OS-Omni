  to X 3.4, Y 0.75, Z 0.9, scale OrbitMarker to X 0.3, Y 0.3, Z 0.95. In depth_review, adjust AnchorCube, move AnchorCube
  to X -3.45, Y 1.0, Z 0.42, scale AnchorCube to X 0.52, Y 0.52, Z 0.46. Delivery file 9: save C:\Users\User\Documents\blender_tasks\blender_restage_product\restage_composite_board.blend;
  set composite_board render resolution to 2400 by 1350 at 100 percent scale, set FPS to 24, set the frame range to start
