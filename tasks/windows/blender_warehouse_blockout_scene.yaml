  to X 1.65, Y -0.8, Z 1.82, scale FeatureCube to X 1.62, Y 0.95, Z 2.1. In composite_board, adjust BaselineRail, move BaselineRail
  to X 1.1, Y 3.72, Z 0.26, scale BaselineRail to X 2.65, Y 0.14, Z 0.32. In composite_board, adjust TensionSphere, move TensionSphere
  to X 0.52, Y 2.52, Z 0.72, scale TensionSphere to X 0.34, Y 0.34, Z 0.34. Delivery file 10: save C:\Users\User\Documents\blender_tasks\blender_restage_product\restage_final_audit_stack.blend;
  set final_audit_stack render resolution to 2560 by 1440 at 100 percent scale, set FPS to 24, set the frame range to start
  at 120 and end at 180, set the output path to //renders/restage_final_audit_stack.png. In final_audit_stack, adjust Camera,
  move Camera to X 7.0, Y -6.9, Z 5.9, rotate Camera to X 60, Y 0, Z 46 degrees. In final_audit_stack, adjust FillLight, move
  FillLight to X 1.9, Y -4.0, Z 7.4, scale FillLight to X 1.48, Y 1.48, Z 1.48. In final_audit_stack, adjust ReviewPost, move
  ReviewPost to X 2.55, Y -2.85, Z 1.22, scale ReviewPost to X 0.22, Y 0.22, Z 1.62. In final_audit_stack, adjust FocusDot,
  move FocusDot to X -0.78, Y 2.85, Z 0.66, scale FocusDot to X 0.28, Y 0.28, Z 0.28. The final two blend files are composite/audit
