  C:\Users\User\Documents\blender_tasks\blender_restage_product\restage_render_bundle_index.txt with exactly this content:
  ''primary=product_stage.blend\nderivatives=restage_review_closeup.blend|restage_archive_wide.blend|restage_qa_isolation.blend|restage_dependency_audit.blend|restage_colorway_variant.blend|restage_shadow_pass.blend|restage_label_closeup.blend|restage_depth_review.blend|restage_composite_board.blend|restage_final_audit_stack.blend\nshared_workspace=blender_restage_product\nblend_file_count=11\nmulti_blend_dependency=restage_composite_board.blend->restage_final_audit_stack.blend\nhandoff_status=extreme-ready''.
  C:\Users\User\Documents\blender_tasks\blender_restage_product\restage_blend_dependency_graph.tsv with exactly this content:
