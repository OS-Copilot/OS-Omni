task_id: windows.notepad.find_replace
platform: windows
instruction: 'A server list named hosts.txt is open in Notepad. Use the Replace feature to change all occurrences of the word "production" to "staging". Then navigate to the end of the file and manually append 8 new server entries on separate lines, from "10.0.0.21 node21" up to "10.0.0.28 node28". After those entries, add these 2 final footer lines in this exact order: "# migration complete" and "# verified-by: ops". Save when done.'
init:
  initializer_id: initializers.windows.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_powershell
      script: '$lines = 1..10 | ForEach-Object { "10.0.0.$_ production" }

        $content = $lines -join "`r`n"

        $filePath = Join-Path $env:USERPROFILE "Downloads\hosts.txt"

        Set-Content -Path $filePath -Value $content -Encoding UTF8

        Write-Output ''INIT_OK_HOSTS''

        '
      timeout: 10
    - type: run_powershell
      script: '$filePath = Join-Path $env:USERPROFILE "Downloads\hosts.txt"

        Start-Process notepad.exe $filePath

        '
      timeout: 15
    - type: wait
      ms: 2000
evaluation:
  evaluator_id: evaluators.windows.notepad:NotepadEvaluator
  params:
    check_id: notepad_find_replace
    stdout_contains: EVAL_RESULT:PASS
    timeout: 30
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - notepad
  - replace
  - append
  - easy
  difficulty: easy
  app_name: notepad
  human_steps: 30
  description: 'Hard Notepad task: replace all production hosts, manually append 8 server lines, then add 2 exact footer lines in the required order.

    '
