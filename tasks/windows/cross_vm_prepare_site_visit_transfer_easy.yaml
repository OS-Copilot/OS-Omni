task_id: windows.cross_vm.prepare_site_visit_transfer_easy
platform: windows
instruction: A source note is already open in Notepad. Save a copy of that note to the Desktop as "site_visit_transfer.txt" and leave the saved file available for transfer.
init:
  initializer_id: initializers.windows.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_powershell
      script: 'Get-Process notepad -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

        $sourcePath = Join-Path $env:USERPROFILE "Documents\site_visit_source.txt"

        @''

        Northwind Site Visit

        Confirm loading dock access at 08:30

        Bring revised safety checklist

        Share the updated visitor badge count: 14

        ''@ | Set-Content -Path $sourcePath -Encoding UTF8

        Start-Process notepad.exe $sourcePath

        '
      timeout: 30
    - type: wait
      ms: 4000
evaluation:
  evaluator_id: evaluators.windows.powershell_check:PowerShellCheckEvaluator
  params:
    timeout: 30
    stdout_contains: EVAL_RESULT:PASS
    command: "$expected = @'\nNorthwind Site Visit\nConfirm loading dock access at 08:30\nBring revised safety checklist\nShare the updated visitor badge count: 14\n'@.Trim()\n$targetPath = Join-Path $env:USERPROFILE \"Desktop\\site_visit_transfer.txt\"\nif (-not (Test-Path $targetPath)) {\n  Write-Output \"MISSING_FILE\"\n  exit 1\n}\n$actual = (Get-Content -Path $targetPath -Raw).Trim()\nif ($actual -ne $expected) {\n  Write-Output \"CONTENT_MISMATCH\"\n  exit 1\n}\nWrite-Output \"EVAL_RESULT:PASS\"\n"
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - windows
  - cross_vm
  - notepad
  - easy
  app_name: notepad
  difficulty: easy
  description: Save the prepared site visit note to a fixed Desktop transfer file.
  cross_vm_role: windows_source_phase
  composite_task: cross_vm.windows_to_linux.site_visit_brief_easy
  source_platform: windows
  target_platform: linux
  owner_scope: linux
  counts_as_windows_cross_vm_task: false
