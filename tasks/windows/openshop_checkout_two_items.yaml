task_id: windows.openshop.checkout_two_items
platform: windows
instruction: 'In OpenShop, sign in with phone number 13800138000 and password spring2026. Build a six-item checkout cart
  in this exact order. Before adding each product, return to the catalog and use the listed search/category/sort combination:
  Verdant Pro Noise-Canceling Headphones with search "Verdant Pro Noise-Canceling Headphones", Electronics, Price High to
  Low, option Bluetooth 5.4; Mountain Isle Pour-Over Coffee 20 Pack with search "Mountain Isle Pour-Over Coffee", Grocery,
  Price Low to High, option 20 sachets; Lumen Magnetic Phone Stand with search "Lumen Magnetic Phone Stand", Electronics,
  Price Low to High, option Magnetic mount; Polar Day Slim Business Backpack with search "Polar Day Slim Business Backpack",
  Bags, Price High to Low, option 15.6-inch fit; Mukawa Folding Camping Table and Chair Set with search "Mukawa Folding Camping
  Table and Chair Set", Home, Price High to Low, option Storage bag; Garden White Cotton Bedding Set 1.8m with search "Garden
  White Cotton Bedding Set", Home, Price Low to High, option 200x230cm. In the cart, make these quantity changes in order,
  returning each product to 1 before moving on: headphones 2, 1, 3, 1, 4, 1; coffee 2, 1, 4, 1, 3, 1; phone stand 3, 1, 2,
  1; backpack 2, 1, 5, 1, 3, 1; camping set 4, 1, 2, 1; bedding set 2, 1, 4, 1. Proceed to checkout, switch shipping address
  Home, Office, Home, Office, then switch payment Alipay, Cash on Delivery, WeChat Pay, Alipay, WeChat Pay. Enter the exact
  note Office delivery only; keep all six selected products in one shipment after final review. Submit the order only when
  the final checkout still uses Office and WeChat Pay. Also create these hard-plus verification files so the final state is
  a multi-artifact handoff bundle: C:\Users\User\Documents\helloworld_hard_plus\windows_openshop_checkout_two_items\hard_plus_handoff.tsv
  with exactly this content: ''task_id\tlinux_peer\tstatus\nwindows.openshop.checkout_two_items\tlinux.openshop.checkout_coffee\thard-plus-ready\napp\tOpenShop\tevaluator-checked'';
  C:\Users\User\Documents\helloworld_hard_plus\windows_openshop_checkout_two_items\hard_plus_dependency_index.txt with exactly
  this content: ''primary_task=windows.openshop.checkout_two_items\nlinux_peer=linux.openshop.checkout_coffee\ndifficulty=hard-plus\nrequires_multi_artifact_handoff=true\noracle_receipt=hard_plus_oracle_receipt.txt'';
  C:\Users\User\Documents\helloworld_hard_plus\windows_openshop_checkout_two_items\hard_plus_review_matrix.csv with exactly
  this content: ''check,owner,status\nlinux_alignment,benchmark-ops,ready\nextra_artifacts,benchmark-ops,ready\noracle_recheck,benchmark-ops,required''.
  Use the target application for the app workflow; create required hard-plus verification files directly at the specified
  paths using the available automation/runtime file-writing method, not Notepad or another text editor.'
