task_id: windows.vscode.release_cleanup_workspace
platform: windows
instruction: 'In Visual Studio Code, open the folder C:\Users\User\Documents\release_cleanup_workspace and make the following
  updates: 1. In README.md, replace "Project Aurora" with "Project Atlas" and change the status line to "Status: Ready for
  release". 2. In src/api.js, change the API base URL to "https://api.acmeops.internal" and change the timeout to 5000. 3.
  In src/ui.js, change "Send Update" to "Publish Update" and change "Weekly Draft" to "Weekly Release". 4. In src/auth.js,
  change the support email to "release-team@acmeops.internal" and change the role from "editor" to "publisher". 5. In config/app.json,
  set "environment" to "staging" and "featureFlag" to true. 6. Create docs/release-checklist.md with exactly these 5 lines:
  # Release Checklist - Verify staging API connectivity - Confirm publisher permissions - Review weekly release copy - Publish
  after final sign-off Save your changes and leave VS Code open.

  Additional primary hard-mode requirement: Also add a new JSON field "releaseOwner" with value "ops-release" to config/app.json
  and create docs/hard-mode-validation.md with exactly "Release cleanup hard mode complete". Also create these hard-plus verification
  files so the final state is a multi-artifact handoff bundle: C:\Users\User\Documents\helloworld_hard_plus\windows_vscode_release_cleanup_workspace\hard_plus_handoff.tsv
  with exactly this content: ''task_id\tlinux_peer\tstatus\nwindows.vscode.release_cleanup_workspace\tlinux.vscode.apply_theme_ticket\thard-plus-ready\napp\tcode\tevaluator-checked'';
  C:\Users\User\Documents\helloworld_hard_plus\windows_vscode_release_cleanup_workspace\hard_plus_dependency_index.txt with
  exactly this content: ''primary_task=windows.vscode.release_cleanup_workspace\nlinux_peer=linux.vscode.apply_theme_ticket\ndifficulty=hard-plus\nrequires_multi_artifact_handoff=true\noracle_receipt=hard_plus_oracle_receipt.txt'';
  C:\Users\User\Documents\helloworld_hard_plus\windows_vscode_release_cleanup_workspace\hard_plus_review_matrix.csv with exactly
  this content: ''check,owner,status\nlinux_alignment,benchmark-ops,ready\nextra_artifacts,benchmark-ops,ready\noracle_recheck,benchmark-ops,required''.
  Use VS Code for workspace text artifacts; create any required verification files in the workspace or at the specified paths
  from VS Code or the available automation/runtime file-writing method, not Notepad or another text editor.'
init:
  initializer_id: initializers.windows.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_powershell
      script: "$workspace = \"C:\\Users\\User\\Documents\\release_cleanup_workspace\"\n$codeExe = \"C:\\Users\\$env:USERNAME\\\
        AppData\\Local\\Programs\\Microsoft VS Code\\Code.exe\"\n\nNew-Item -ItemType Directory -Force -Path $workspace, \"\
        $workspace\\src\", \"$workspace\\config\", \"$workspace\\docs\" | Out-Null\n\n@'\n# Project Aurora\nStatus: Draft\
        \ pending review\n\nThis workspace holds the release prep notes for the weekly update.\n'@ | Set-Content -Path \"\
        $workspace\\README.md\" -Encoding utf8\n\n@'\nconst API_BASE = \"http://localhost:3000\";\nconst REQUEST_TIMEOUT =\
        \ 3000;\n\nexport { API_BASE, REQUEST_TIMEOUT };\n'@ | Set-Content -Path \"$workspace\\src\\api.js\" -Encoding utf8\n\
        \n@'\nexport const pageTitle = \"Weekly Draft\";\nexport const primaryButtonLabel = \"Send Update\";\n'@ | Set-Content\
        \ -Path \"$workspace\\src\\ui.js\" -Encoding utf8\n\n@'\nexport const supportEmail = \"support@aurora.local\";\nexport\
        \ const defaultRole = \"editor\";\n'@ | Set-Content -Path \"$workspace\\src\\auth.js\" -Encoding utf8\n\n@'\n{\n \
        \ \"environment\": \"dev\",\n  \"featureFlag\": false,\n  \"appName\": \"aurora-release\"\n}\n'@ | Set-Content -Path\
        \ \"$workspace\\config\\app.json\" -Encoding utf8\n\nif (Test-Path $codeExe) {\n  Start-Process -FilePath $codeExe\
        \ -ArgumentList $workspace\n} else {\n  Start-Process -FilePath \"code\" -ArgumentList $workspace\n}\n"
      timeout: 30
    - type: wait
      ms: 4000
evaluation:
  evaluator_id: evaluators.windows.vscode:VSCodeEvaluator
  params:
    check_id: vscode_release_cleanup_workspace
    stdout_contains: EVAL_RESULT:PASS
    timeout: 15
    supplemental_checks:
      powershell:
      - label: primary_hard_mode
        script: '$path = "C:\Users\User\Documents\release_cleanup_workspace\docs\hard-mode-validation.md"

          if (-not (Test-Path -LiteralPath $path)) { Write-Output "EVAL_RESULT:FAIL file missing: $path"; exit 1 }

          $text = Get-Content -LiteralPath $path -Raw

          if ($text -like "*Release cleanup hard mode complete*") { Write-Output "EVAL_RESULT:PASS primary text contains hard-mode
          requirement" } else { Write-Output "EVAL_RESULT:FAIL primary text missing hard-mode requirement"; exit 1 }'
        stdout_contains: EVAL_RESULT:PASS
        timeout: 90
      - label: no_notepad_process
        script: '$p = Get-Process -Name notepad -ErrorAction SilentlyContinue

          if ($p) { Write-Output ''NOTEPAD_RUNNING''; exit 1 }

          Write-Output ''NO_NOTEPAD_PROCESS'''
        stdout_contains: NO_NOTEPAD_PROCESS
        expected_exit_code: 0
        timeout: 10
      files:
      - path: C:\Users\User\Documents\helloworld_hard_plus\windows_vscode_release_cleanup_workspace\hard_plus_handoff.tsv
        exact_text: "task_id\tlinux_peer\tstatus\nwindows.vscode.release_cleanup_workspace\tlinux.vscode.apply_theme_ticket\t\
          hard-plus-ready\napp\tcode\tevaluator-checked"
      - path: C:\Users\User\Documents\helloworld_hard_plus\windows_vscode_release_cleanup_workspace\hard_plus_dependency_index.txt
        exact_text: 'primary_task=windows.vscode.release_cleanup_workspace

          linux_peer=linux.vscode.apply_theme_ticket

          difficulty=hard-plus

          requires_multi_artifact_handoff=true

          oracle_receipt=hard_plus_oracle_receipt.txt'
      - path: C:\Users\User\Documents\helloworld_hard_plus\windows_vscode_release_cleanup_workspace\hard_plus_review_matrix.csv
        exact_text: 'check,owner,status

          linux_alignment,benchmark-ops,ready

          extra_artifacts,benchmark-ops,ready

          oracle_recheck,benchmark-ops,required'
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - vscode
  - workspace
  - multi_file
  - markdown
  - json
  - hard
  - single_app
  - evaluator_backed
  - hard-plus
  - multi_artifact_handoff
  - linux_plus
  difficulty: hard
  app_name: code
  estimated_min_steps: 48
  description: 'Multi-file VS Code workspace task with five seeded files plus one new markdown file. Human shortest path should
    stay above 20 steps.

    '
  human_steps: 88
  hardness: hard-evaluable
  evaluation_standard: all retained hard requirements are covered by the main evaluator or supplemental checks
  linux_peer: linux.vscode.apply_theme_ticket
  linux_peer_file: tasks/linux/vscode_apply_theme_ticket_hard.yaml
  alignment_status: functional_equivalent_plus_extra
  hard_plus_alignment: linux_peer_plus_extra_evaluator_checked_artifacts
  hard_plus_note: The Linux-aligned core task remains required; extra handoff/audit artifacts are also evaluator checked.
  oracle_model: windows_oracle
