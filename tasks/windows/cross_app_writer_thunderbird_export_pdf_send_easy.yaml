task_id: windows.cross_app.writer_thunderbird_export_pdf_send_easy
platform: windows
instruction: In LibreOffice Writer, the document Bench Status Update is already open. Export it to PDF while keeping the same base file name, so the exported file is named Bench_Status_Update.pdf. Then switch to the already-open Thunderbird compose window with subject Bench PDF Review, attach the exported PDF, and send the email.
init:
  initializer_id: initializers.windows.cross_app:OfficeThunderbirdInitializer
  params:
    doc_name: Bench_Status_Update.docx
    title: Bench Status Update
    subject: Bench PDF Review
    to: bench-review@example.com
    body:
    - Current launch status is green.
    - Please review the exported PDF summary.
evaluation:
  evaluator_id: evaluators.windows.cross_app:CrossAppEvaluator
  params:
    check_id: cross_app_writer_thunderbird_export_pdf_send_easy
    stdout_contains: EVAL_RESULT:PASS
    timeout: 60
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - windows
  - cross_app
  - email
  - office
  - thunderbird
  - libreoffice
  - writer
  - easy
  app_name: thunderbird + libreoffice_writer
  difficulty: easy
  description: Export an already-open Writer document to PDF, then send it as a Thunderbird attachment.
  linux_peer: linux.cross_app.writer_export_pdf_attach_draft_easy
  linux_peer_file: tasks/linux/cross_app_writer_thunderbird_export_pdf_attach_draft_easy.yaml
  alignment_status: difficulty_equivalent
