task_id: windows.calendar.create_event
platform: windows
instruction: Please open Thunderbird and switch to the Calendar tab. Create a new event called "Team Meeting" scheduled for tomorrow at 2:00 PM, lasting 1 hour. Save the event.
init:
  initializer_id: initializers.windows.thunderbird_calendar:ThunderbirdCalendarInitializer
evaluation:
  evaluator_id: evaluators.windows.calendar:CalendarEvaluator
  params:
    check_id: calendar_create_event
    stdout_contains: EVAL_RESULT:PASS
    timeout: 30
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - thunderbird
  - calendar
  - event
  - create
  - easy
  difficulty: easy
  app_name: thunderbird
  description: 'Simple calendar task: create a single event called "Team Meeting" for tomorrow at 2 PM in Thunderbird Calendar.

    '
