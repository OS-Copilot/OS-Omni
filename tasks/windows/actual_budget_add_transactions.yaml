task_id: windows.actual_budget.add_transactions
platform: windows
instruction: 'Actual Budget is already open. If no budget file is open yet, create a new local budget called "Bench Ops Budget"
  in the default documents location. Then build this operations budget:

  1. Create twelve bank accounts: Ops Checking with $3,200, Emergency Buffer with $8,000, Travel Envelope with $1,200, Tax
  Reserve with $2,400, Audit Escrow with $900, Vendor Holdback with $700, Compliance Reserve with $1,100, Equipment Lease
  with $1,600, Payroll Buffer with $4,200, Legal Reserve with $1,300, Training Fund with $950, and Cloud Escrow with $2,250.

  2. Create fifteen budget categories with monthly amounts: Utility Buffer $250, Conference Travel $600, Client Meals $180,
  SaaS Tools $75, Hardware Refresh $350, Launch Collateral $220, Renewal Fees $140, Security Review $260, Compliance Audit
  $320, Lease Payments $540, Team Offsite $375, Payroll Fees $425, Legal Filing $360, Staff Training $285, and Cloud Hosting
  $490.

  3. Add these transactions with exact payees and categories: in Ops Checking, $210 to City Utilities in Utility Buffer, $480
  to Skyline Air in Conference Travel, $64.50 to Harbor Bistro in Client Meals, $75 to StackTools in SaaS Tools, $315 to North
  Desk in Hardware Refresh, and $129 to Print Depot in Launch Collateral; in Tax Reserve, $118 to License Bureau in Renewal
  Fees; in Vendor Holdback, $244 to Shield Audit in Security Review; in Compliance Reserve, $290 to Audit Circle in Compliance
  Audit; in Equipment Lease, $515 to LeaseWorks in Lease Payments; in Travel Envelope, $332 to Summit Venue in Team Offsite;
  in Payroll Buffer, $390 to Payroll Bureau in Payroll Fees; in Legal Reserve, $345 to Legal Desk in Legal Filing; in Training
  Fund, $210 to Skill Forge in Staff Training; and in Cloud Escrow, $470 to Cloud Grid in Cloud Hosting.

  4. Record these fourteen transfers: $300 from Ops Checking to Travel Envelope; $450 from Ops Checking to Audit Escrow; $200
  from Tax Reserve to Vendor Holdback; $275 from Ops Checking to Compliance Reserve; $180 from Vendor Holdback to Equipment
  Lease; $125 from Emergency Buffer to Travel Envelope; $550 from Ops Checking to Payroll Buffer; $260 from Tax Reserve to
  Legal Reserve; $175 from Emergency Buffer to Training Fund; $325 from Ops Checking to Cloud Escrow; $90 from Compliance
  Reserve to Legal Reserve; $210 from Payroll Buffer to Tax Reserve; $145 from Cloud Escrow to Audit Escrow; and $115 from
  Legal Reserve to Compliance Reserve. Finish only after all accounts, categories, budgets, transactions, and transfers are
  saved.'
init:
  initializer_id: initializers.windows.actual_budget:ActualBudgetInitializer
evaluation:
  evaluator_id: evaluators.windows.actual_budget:ActualBudgetEvaluator
  params:
    check_id: budget_add_transactions
    stdout_contains: EVAL_RESULT:PASS
    timeout: 60
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - actual_budget
  - transactions
  - categories
  - hard
  - single_app
  - evaluator_backed
  difficulty: hard
  app_name: actual-budget
  human_steps: 184
  description: Build a twelve-account operations budget with fifteen categories, fifteen transactions, and fourteen transfers
    in Actual Budget.
  oracle_task: tasks/windows/oracle/actual_budget_add_transactions_oracle.yaml
  oracle_model: cross_vm_oracle_wait
  hardness: hard-evaluable
  evaluation_standard: main evaluator checks accounts, categories, budgets, payees, transactions, and transfer pairs
  linux_peer: linux.actual_budget.operations_multi_account_hard
  linux_peer_file: tasks/linux/actual_budget_operations_multi_account_hard.yaml
  alignment_status: direct