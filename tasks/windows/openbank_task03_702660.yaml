instruction: |-
  Initiate four transaction disputes, schedule three payments, and create a new transfer recipient with a corresponding transfer in the OpenBank application.

  The four disputes must be submitted for the first search result of each of the following merchants: "Elm Street", "REI trail", "Parking meter", and "CloudBox". Each dispute must have the checkbox "I contacted the merchant" selected. The dispute for "Elm Street" must use the reason "Duplicate charge" and the Details text "Unknown;contacted.". The dispute for "REI trail" must use the reason "Canceled or returned item" and the Details text "Returned;contacted.". The dispute for "Parking meter" must use the reason "Amount is incorrect" and the Details text "Wrong total; called.". The dispute for "CloudBox" must use the reason "Goods or services not received" and the Details text "NO service;called.".

  The three scheduled payments must be configured as follows: a payment to the biller "Northstar Internet - $72.00" from the account "Rainy Day Savings ...9140" for an amount of "65.00" on the date "2026/06/05" with the memo "T3 utility"; a payment to the biller "OpenBank Rewards Card - $682.45" from the account "Everyday Checking ...2381" for an amount of "350.00" on the date "2026/06/11" with the memo "T3 internet"; and a payment to the biller "Northstar Internet - $7.00" from the account "Rainy Day Savings ...9140" for an amount of "7.00" on the date "2026-06-07" with the memo "T3 card".

  A new recipient must be saved with the name "Caleb Wong", the nickname "Research", the bank "Metro Bank", the routing number "021000021", and the account number "8642073159". A new transfer must be submitted from the account "Rainy Day Savings ...9140" to "Caleb Wong" for an amount of "149.75" on the date "2026-06-06" with the memo "T3 research".
