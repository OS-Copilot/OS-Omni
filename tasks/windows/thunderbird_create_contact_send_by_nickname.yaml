task_id: windows.thunderbird.create_contact_send_by_nickname
platform: windows
instruction: In Thunderbird, create a new contact with the full name "Anonymous Helloworld", nickname "hello2026", email address "anonym-x2026@outlook.com", and address "70 Washington Square S, New York, NY 10012, USA". Then compose and send an email to hello2026. When addressing the email, use only the nickname "hello2026" and do not type the email address. Use the subject "Morning" and the exact body "Good Morning".
init:
  initializer_id: initializers.windows.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_powershell
      script: "$ErrorActionPreference = \"Stop\"\n\nfunction Get-DefaultThunderbirdProfileDir {\n  param([string]$ThunderbirdRoot)\n\n  $profilesIniPath = Join-Path $ThunderbirdRoot \"profiles.ini\"\n  if (-not (Test-Path $profilesIniPath)) {\n    throw \"profiles.ini not found after restore: $profilesIniPath\"\n  }\n\n  $ini = @{}\n  $section = \"\"\n  Get-Content -LiteralPath $profilesIniPath | ForEach-Object {\n    $line = $_.Trim()\n    if (-not $line) { return }\n    if ($line.StartsWith(\";\")) { return }\n    if ($line -match \"^\\[(.+)\\]$\") {\n      $section = $matches[1]\n      if (-not $ini.ContainsKey($section)) {\n        $ini[$section] = @{}\n      }\n      return\n    }\n    if ($section -and $line -match \"^(.*?)=(.*)$\") {\n      $key = $matches[1].Trim()\n      $val = $matches[2].Trim()\n      $ini[$section][$key] = $val\n    }\n  }\n\n  $profileSection = $null\n  foreach ($secName in ($ini.Keys | Sort-Object)) {\n    if ($secName -like \"Profile*\") {\n      $sec = $ini[$secName]\n\
        \      if ($sec.ContainsKey(\"Default\") -and $sec[\"Default\"] -eq \"1\") {\n        $profileSection = $secName\n        break\n      }\n    }\n  }\n  if (-not $profileSection) {\n    foreach ($secName in ($ini.Keys | Sort-Object)) {\n      if ($secName -like \"Profile*\") {\n        $profileSection = $secName\n        break\n      }\n    }\n  }\n  if (-not $profileSection) {\n    throw \"No [Profile*] section found in profiles.ini\"\n  }\n\n  $profileEntry = $ini[$profileSection]\n  $profilePath = if ($profileEntry.ContainsKey(\"Path\")) { $profileEntry[\"Path\"] } else { \"\" }\n  if (-not $profilePath) {\n    throw \"profile Path is empty in profiles.ini\"\n  }\n\n  $isRelative = $true\n  if ($profileEntry.ContainsKey(\"IsRelative\")) {\n    $isRelative = ($profileEntry[\"IsRelative\"] -eq \"1\")\n  }\n\n  if ($isRelative) {\n    return (Join-Path $ThunderbirdRoot $profilePath)\n  }\n  return $profilePath\n}\n\nfunction Resolve-ThunderbirdInstallDir {\n  $candidates = @(\n  \
        \  \"C:\\Program Files\\Mozilla Thunderbird\",\n    \"C:\\Program Files (x86)\\Mozilla Thunderbird\"\n  )\n  foreach ($candidate in $candidates) {\n    if (Test-Path (Join-Path $candidate \"thunderbird.exe\")) {\n      return $candidate\n    }\n  }\n\n  $command = Get-Command thunderbird.exe -ErrorAction SilentlyContinue\n  if ($command) {\n    return Split-Path -Parent $command.Source\n  }\n\n  throw \"Thunderbird installation directory not found\"\n}\n\nfunction Reset-MailboxFile {\n  param([string]$MailboxPath)\n\n  $parentDir = Split-Path -Parent $MailboxPath\n  if (-not (Test-Path $parentDir)) {\n    New-Item -ItemType Directory -Path $parentDir -Force | Out-Null\n  }\n\n  [System.IO.File]::WriteAllText($MailboxPath, \"\", [System.Text.Encoding]::UTF8)\n\n  $msfPath = \"$MailboxPath.msf\"\n  if (Test-Path $msfPath) {\n    Remove-Item -LiteralPath $msfPath -Force -ErrorAction SilentlyContinue\n  }\n}\n\n$smtpScriptPath = \"C:\\Users\\User\\fake_smtp_contact_server.py\"\n$smtpLogDir\
        \ = \"C:\\Users\\User\\fake_smtp_contact_messages\"\n$smtpPidPath = \"C:\\Users\\User\\fake_smtp_contact_server.pid\"\n$tbInstallDir = Resolve-ThunderbirdInstallDir\n$applicationIniPath = Join-Path $tbInstallDir \"application.ini\"\n$tbVersion = \"140.9.1\"\nif (Test-Path $applicationIniPath) {\n  $versionLine = Get-Content -LiteralPath $applicationIniPath | Where-Object { $_ -match '^Version=' } | Select-Object -First 1\n  if ($versionLine) {\n    $tbVersion = ($versionLine -replace '^Version=', '').Trim()\n  }\n}\n\nif (Test-Path $smtpPidPath) {\n  $oldPid = (Get-Content -LiteralPath $smtpPidPath -ErrorAction SilentlyContinue | Select-Object -First 1).Trim()\n  if ($oldPid -match '^\\d+$') {\n    Stop-Process -Id ([int]$oldPid) -Force -ErrorAction SilentlyContinue\n    Start-Sleep -Milliseconds 300\n  }\n  Remove-Item -LiteralPath $smtpPidPath -Force -ErrorAction SilentlyContinue\n}\n\nif (Test-Path $smtpLogDir) {\n  Remove-Item -LiteralPath $smtpLogDir -Recurse -Force\n}\nNew-Item\
        \ -ItemType Directory -Path $smtpLogDir -Force | Out-Null\n\n$smtpScript = @'\nimport asyncore\nimport pathlib\nimport smtpd\nimport time\n\nOUTPUT_DIR = pathlib.Path(r\"C:\\Users\\User\\fake_smtp_contact_messages\")\nOUTPUT_DIR.mkdir(parents=True, exist_ok=True)\n\nclass RecordingServer(smtpd.SMTPServer):\n    def process_message(self, peer, mailfrom, rcpttos, data, **kwargs):\n        timestamp = int(time.time() * 1000)\n        eml_path = OUTPUT_DIR / f\"message_{timestamp}.eml\"\n        if isinstance(data, bytes):\n            eml_path.write_bytes(data)\n        else:\n            eml_path.write_text(data, encoding=\"utf-8\", errors=\"ignore\")\n\n        log_path = OUTPUT_DIR / \"events.log\"\n        with log_path.open(\"a\", encoding=\"utf-8\") as fh:\n            fh.write(f\"{timestamp}\\t{mailfrom}\\t{','.join(rcpttos)}\\n\")\n        return None\n\nserver = RecordingServer((\"127.0.0.1\", 1025), None, decode_data=False)\nasyncore.loop()\n'@\nSet-Content -LiteralPath $smtpScriptPath\
        \ -Value $smtpScript -Encoding ASCII\n\nGet-Process msedge -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue\nStart-Sleep -Milliseconds 300\n\n$edgeUserData = Join-Path $env:LOCALAPPDATA \"Microsoft\\Edge\\User Data\\Default\"\nforeach ($edgeSessionDir in @(\"Sessions\", \"Session Storage\")) {\n  $edgePath = Join-Path $edgeUserData $edgeSessionDir\n  if (Test-Path $edgePath) {\n    Remove-Item -LiteralPath $edgePath -Recurse -Force -ErrorAction SilentlyContinue\n  }\n}\n\nGet-Process thunderbird -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue\nStart-Sleep -Milliseconds 300\n\n$tbRoot = Join-Path $env:APPDATA \"Thunderbird\"\nif (Test-Path $tbRoot) {\n  Remove-Item -LiteralPath $tbRoot -Recurse -Force\n}\nNew-Item -ItemType Directory -Path $tbRoot -Force | Out-Null\n$profileLeaf = \"t5q2a5hp.default-release\"\n$profileDir = Join-Path $tbRoot $profileLeaf\nNew-Item -ItemType Directory -Path $profileDir -Force | Out-Null\n\
        \n@\"\n[Profile0]\nName=default-release\nIsRelative=1\nPath=$profileLeaf\nDefault=1\n\n[General]\nStartWithLastProfile=1\nVersion=2\n\"@ | Set-Content -LiteralPath (Join-Path $tbRoot \"profiles.ini\") -Encoding ASCII\n\nSet-Content -LiteralPath (Join-Path $tbRoot \"installs.ini\") -Value \"\" -Encoding ASCII\n\n$prefsPath = Join-Path $profileDir \"prefs.js\"\n@(\n  'user_pref(\"app.update.auto\", false);',\n  'user_pref(\"app.update.enabled\", false);',\n  'user_pref(\"browser.shell.checkDefaultBrowser\", false);',\n  'user_pref(\"mail.account.account1.identities\", \"id1\");',\n  'user_pref(\"mail.account.account1.server\", \"server1\");',\n  'user_pref(\"mail.account.account2.server\", \"server2\");',\n  'user_pref(\"mail.account.lastKey\", 2);',\n  'user_pref(\"mail.accountmanager.accounts\", \"account1,account2\");',\n  'user_pref(\"mail.accountmanager.defaultaccount\", \"account1\");',\n  'user_pref(\"mail.accountmanager.localfoldersserver\", \"server2\");',\n  'user_pref(\"\
        mail.identity.id1.fcc\", true);',\n  'user_pref(\"mail.identity.id1.fcc_folder\", \"imap://Helloworld%40outlook.com@outlook.office365.com/Sent\");',\n  'user_pref(\"mail.identity.id1.fcc_folder_picker_mode\", \"0\");',\n  'user_pref(\"mail.identity.id1.draft_folder\", \"imap://Helloworld%40outlook.com@outlook.office365.com/Drafts\");',\n  'user_pref(\"mail.identity.id1.drafts_folder_picker_mode\", \"0\");',\n  'user_pref(\"mail.identity.id1.fullName\", \"Helloworld\");',\n  'user_pref(\"mail.identity.id1.reply_on_top\", 1);',\n  'user_pref(\"mail.identity.id1.smtpServer\", \"smtp1\");',\n  'user_pref(\"mail.identity.id1.useremail\", \"Helloworld@outlook.com\");',\n  'user_pref(\"mail.identity.id1.valid\", true);',\n  'user_pref(\"mail.root.imap-rel\", \"[ProfD]ImapMail\");',\n  'user_pref(\"mail.root.none-rel\", \"[ProfD]Mail\");',\n  'user_pref(\"mail.server.server1.check_new_mail\", false);',\n  'user_pref(\"mail.server.server1.directory-rel\", \"[ProfD]ImapMail/outlook.office365.com\"\
        );',\n  'user_pref(\"mail.server.server1.hostname\", \"outlook.office365.com\");',\n  'user_pref(\"mail.server.server1.login_at_startup\", false);',\n  'user_pref(\"mail.server.server1.name\", \"Helloworld@outlook.com\");',\n  'user_pref(\"mail.server.server1.port\", 994);',\n  'user_pref(\"mail.server.server1.socketType\", 3);',\n  'user_pref(\"mail.server.server1.storeContractID\", \"@mozilla.org/msgstore/berkeleystore;1\");',\n  'user_pref(\"mail.server.server1.type\", \"imap\");',\n  'user_pref(\"mail.server.server1.userName\", \"Helloworld@outlook.com\");',\n  'user_pref(\"mail.server.server2.check_new_mail\", false);',\n  'user_pref(\"mail.server.server2.directory-rel\", \"[ProfD]Mail/Local Folders\");',\n  'user_pref(\"mail.server.server2.hostname\", \"Local Folders\");',\n  'user_pref(\"mail.server.server2.login_at_startup\", false);',\n  'user_pref(\"mail.server.server2.name\", \"Local Folders\");',\n  'user_pref(\"mail.server.server2.storeContractID\", \"@mozilla.org/msgstore/berkeleystore;1\"\
        );',\n  'user_pref(\"mail.server.server2.type\", \"none\");',\n  'user_pref(\"mail.server.server2.userName\", \"nobody\");',\n  'user_pref(\"mail.smtp.defaultserver\", \"smtp1\");',\n  'user_pref(\"mail.smtpserver.smtp1.authMethod\", 0);',\n  'user_pref(\"mail.smtpserver.smtp1.description\", \"Microsoft\");',\n  'user_pref(\"mail.smtpserver.smtp1.hostname\", \"127.0.0.1\");',\n  'user_pref(\"mail.smtpserver.smtp1.port\", 1025);',\n  'user_pref(\"mail.smtpserver.smtp1.try_ssl\", 0);',\n  'user_pref(\"mail.smtpserver.smtp1.username\", \"\");',\n  'user_pref(\"mail.smtpservers\", \"smtp1\");',\n  'user_pref(\"mail.winsearch.enable\", false);',\n  'user_pref(\"mailnews.database.global.indexer.enabled\", false);'\n) | Set-Content -LiteralPath $prefsPath -Encoding ASCII\n\n$profileDir = Get-DefaultThunderbirdProfileDir -ThunderbirdRoot $tbRoot\nif (-not (Test-Path $profileDir)) {\n  throw \"Resolved Thunderbird profile directory does not exist: $profileDir\"\n}\n\nforeach ($addressBookName\
        \ in @(\n  \"abook.sqlite\", \"abook.sqlite-wal\", \"abook.sqlite-shm\",\n  \"history.sqlite\", \"history.sqlite-wal\", \"history.sqlite-shm\"\n)) {\n  $addressBookPath = Join-Path $profileDir $addressBookName\n  if (Test-Path $addressBookPath) {\n    Remove-Item -LiteralPath $addressBookPath -Force -ErrorAction SilentlyContinue\n  }\n}\n\n$localFoldersDir = Join-Path $profileDir \"Mail\\Local Folders\"\nif (-not (Test-Path $localFoldersDir)) {\n  New-Item -ItemType Directory -Path $localFoldersDir -Force | Out-Null\n}\n\n$imapRoot = Join-Path $profileDir \"ImapMail\\outlook.office365.com\"\nif (-not (Test-Path $imapRoot)) {\n  New-Item -ItemType Directory -Path $imapRoot -Force | Out-Null\n}\n\n$localSentPath = Join-Path $localFoldersDir \"Sent\"\n$localDraftsPath = Join-Path $localFoldersDir \"Drafts\"\n$localUnsentPath = Join-Path $localFoldersDir \"Unsent Messages\"\nReset-MailboxFile -MailboxPath $localSentPath\nReset-MailboxFile -MailboxPath $localDraftsPath\nReset-MailboxFile\
        \ -MailboxPath $localUnsentPath\n\nforeach ($mailboxName in @(\"Drafts\", \"Outbox\", \"Sent\")) {\n  Reset-MailboxFile -MailboxPath (Join-Path $imapRoot $mailboxName)\n}\n\n$userJsPath = Join-Path $profileDir \"user.js\"\n@(\n  'user_pref(\"mailnews.start_page.enabled\", false);',\n  'user_pref(\"mailnews.start_page.url\", \"about:blank\");',\n  'user_pref(\"mailnews.start_page.override_url\", \"about:blank\");',\n  ('user_pref(\"mailnews.start_page_override.mstone\", \"' + $tbVersion + '\");'),\n  'user_pref(\"mail.provider.enabled\", false);',\n  'user_pref(\"mail.provider.suppress_dialog_on_startup\", true);',\n  'user_pref(\"mail.inappnotifications.enabled\", false);',\n  'user_pref(\"mail.inappnotifications.donation_enabled\", false);',\n  'user_pref(\"mail.inappnotifications.blog_enabled\", false);',\n  'user_pref(\"mail.inappnotifications.message_enabled\", false);',\n  'user_pref(\"mail.identity.id1.fcc\", true);',\n  'user_pref(\"mail.identity.id1.fcc_folder\", \"mailbox://nobody@Local%20Folders/Sent\"\
        );',\n  'user_pref(\"mail.identity.id1.fcc_folder_picker_mode\", \"0\");',\n  'user_pref(\"mail.identity.id1.draft_folder\", \"mailbox://nobody@Local%20Folders/Drafts\");',\n  'user_pref(\"mail.identity.id1.drafts_folder_picker_mode\", \"0\");',\n  'user_pref(\"mail.compose.autosave\", false);',\n  'user_pref(\"mail.smtp.defaultserver\", \"smtp1\");',\n  'user_pref(\"mail.smtpserver.smtp1.hostname\", \"127.0.0.1\");',\n  'user_pref(\"mail.smtpserver.smtp1.port\", 1025);',\n  'user_pref(\"mail.smtpserver.smtp1.try_ssl\", 0);',\n  'user_pref(\"mail.smtpserver.smtp1.authMethod\", 0);',\n  'user_pref(\"mail.smtpserver.smtp1.username\", \"\");'\n) | Set-Content -LiteralPath $userJsPath -Encoding ASCII\n\n$smtpProcess = Start-Process -FilePath \"py\" -ArgumentList @(\"-3\", $smtpScriptPath) -WindowStyle Hidden -PassThru\nSet-Content -LiteralPath $smtpPidPath -Value $smtpProcess.Id -Encoding ASCII\n\n$smtpReady = $false\nfor ($i = 0; $i -lt 20; $i++) {\n  try {\n    $client = New-Object\
        \ System.Net.Sockets.TcpClient\n    $client.Connect(\"127.0.0.1\", 1025)\n    $client.Close()\n    $smtpReady = $true\n    break\n  } catch {\n    Start-Sleep -Seconds 1\n  }\n}\n\nif (-not $smtpReady) {\n  throw \"Local fake SMTP server did not start on 127.0.0.1:1025\"\n}\n\n$thunderbirdExePath = Join-Path $tbInstallDir \"thunderbird.exe\"\nStart-Process -FilePath $thunderbirdExePath -ArgumentList @(\"-profile\", $profileDir, \"-mail\") | Out-Null\n\n$tbStarted = $false\nfor ($i = 0; $i -lt 30; $i++) {\n  if (Get-Process thunderbird -ErrorAction SilentlyContinue) {\n    $tbStarted = $true\n    break\n  }\n  Start-Sleep -Seconds 1\n}\n\nGet-Process msedge -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue\nStart-Sleep -Seconds 3\n\nif (-not $tbStarted -and -not (Get-Process thunderbird -ErrorAction SilentlyContinue)) {\n  throw \"Thunderbird failed to start with generated profile\"\n}\n\nWrite-Output \"INIT_OK:PROFILE=$profileDir\"\n"
      timeout: 180
    - type: wait
      ms: 6000
evaluation:
  evaluator_id: evaluators.windows.thunderbird:ThunderbirdEvaluator
  params:
    check_id: thunderbird_create_contact_send_by_nickname
    timeout: 180
    stdout_contains: EVAL_RESULT:PASS
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - thunderbird
  - contacts
  - address-book
  - email
  - nickname
  - send
  - easy
  difficulty: easy
  app: Mozilla Thunderbird
  description: 'Create a clean Thunderbird profile with a local fake SMTP server, ask the agent to create a contact with a nickname and postal address, send one email to that nickname, and verify deterministically that the contact fields exist and the exact message appears once in fake SMTP output with no draft or outbox leftovers. A matching local Sent copy is accepted when Thunderbird finishes copying it, but fake SMTP is the authoritative send receipt.

    '
