task_id: windows.calendar.manage_multiple_events
platform: windows
instruction: 'Please open Thunderbird and switch to the Calendar tab. Create these nine events for next week and save all
  of them: "Design Review" on Monday at 10:00 AM for 1 hour, "Backlog Triage" on Tuesday at 9:15 AM for 45 minutes with a
  reminder 15 minutes before the event, "Sprint Planning" on Wednesday at 1:30 PM for 1 hour, "Launch Debrief" on Thursday
  at 4:15 PM for 30 minutes with a reminder 10 minutes before the event, "Retrospective" on Friday at 2:30 PM for 1 hour with
  a reminder 30 minutes before the event, "Risk Review" on Friday at 4:00 PM for 45 minutes with a reminder 20 minutes before
  the event, "Ops Review Sync" on Thursday at 9:00 AM for 30 minutes as a weekly recurring event, "Vendor Dry Run" on Wednesday
  at 4:45 PM for 30 minutes with a reminder 5 minutes before the event, and "Metrics Review" on Tuesday at 3:00 PM for 30
  minutes as a weekly recurring event with a reminder 10 minutes before the event.

  '
init:
  initializer_id: initializers.windows.thunderbird_calendar:ThunderbirdCalendarInitializer
evaluation:
  evaluator_id: evaluators.windows.calendar:CalendarEvaluator
  params:
    check_id: calendar_manage_multiple_events
    stdout_contains: EVAL_RESULT:PASS
    timeout: 30
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - thunderbird
  - calendar
  - event
  - create
  - modify
  - delete
  - hard
  - single_app
  - evaluator_backed
  difficulty: hard
  app_name: thunderbird_calendar
  human_steps: 108
  description: Build a nine-event review schedule for next week in Thunderbird Calendar with mixed durations, reminders, and
    two weekly recurring events.
  hardness: hard-evaluable
  evaluation_standard: all retained hard requirements are covered by the main evaluator
  linux_peer: linux.thunderbird_calendar.plan_next_week_reviews_hard
  linux_peer_file: tasks/linux/thunderbird_calendar_plan_next_week_reviews_hard.yaml
  alignment_status: direct