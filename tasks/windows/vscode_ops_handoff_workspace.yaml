task_id: windows.vscode.ops_handoff_workspace
platform: windows
instruction: "In Visual Studio Code, open the folder C:\\Users\\User\\Documents\\ops_handoff_workspace and make the following\
  \ updates: 1. In scripts/prepare_report.py, change REPORT_NAME to \"Weekly Ops Digest\", change MAX_ITEMS to 5, and change\
  \ FOOTER_TEXT to \"Prepared for Friday handoff\". 2. In scripts/cleanup_data.py, change ARCHIVE_FOLDER to \"processed\"\
  , change RETENTION_DAYS to 30, and change DRY_RUN to False. 3. In requirements.txt, change requests to version 2.32.3 and\
  \ add a new line for python-dateutil==2.9.0. 4. In notes/summary_template.md, change the title to \"# Ops Handoff Summary\"\
  \ and change the owner line to \"Owner: Friday Operations\". 5. Create .vscode/settings.json with exactly this JSON content:\
  \ {\n  \"editor.formatOnSave\": true,\n  \"files.autoSave\": \"afterDelay\",\n  \"python.analysis.typeCheckingMode\": \"\
  basic\"\n} 6. Create docs/ops-handoff.md with exactly these 6 lines: # Ops Handoff - Report: Weekly Ops Digest - Max items:\
  \ 5 - Archive folder: processed - Retention days: 30 - Auto Save: afterDelay Save your changes and leave VS Code open.\n\
  Additional primary hard-mode requirement: Also create docs/hard-mode-validation.md with exactly the line \"Ops handoff hard\
  \ mode complete\". Also create these hard-plus verification files so the final state is a multi-artifact handoff bundle:\
  \ C:\\Users\\User\\Documents\\helloworld_hard_plus\\windows_vscode_ops_handoff_workspace\\hard_plus_handoff.tsv with exactly\
  \ this content: 'task_id\\tlinux_peer\\tstatus\\nwindows.vscode.ops_handoff_workspace\\tlinux.vscode.prepare_release_packet\\\
  thard-plus-ready\\napp\\tcode\\tevaluator-checked'; C:\\Users\\User\\Documents\\helloworld_hard_plus\\windows_vscode_ops_handoff_workspace\\\
  hard_plus_dependency_index.txt with exactly this content: 'primary_task=windows.vscode.ops_handoff_workspace\\nlinux_peer=linux.vscode.prepare_release_packet\\\
  ndifficulty=hard-plus\\nrequires_multi_artifact_handoff=true\\noracle_receipt=hard_plus_oracle_receipt.txt'; C:\\Users\\\
  User\\Documents\\helloworld_hard_plus\\windows_vscode_ops_handoff_workspace\\hard_plus_review_matrix.csv with exactly this\
  \ content: 'check,owner,status\\nlinux_alignment,benchmark-ops,ready\\nextra_artifacts,benchmark-ops,ready\\noracle_recheck,benchmark-ops,required'.\
  \ Use VS Code for workspace text artifacts; create any required verification files in the workspace or at the specified\
  \ paths from VS Code or the available automation/runtime file-writing method, not Notepad or another text editor."
init:
  initializer_id: initializers.windows.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_powershell
      script: "$workspace = \"C:\\Users\\User\\Documents\\ops_handoff_workspace\"\n$codeExe = \"C:\\Users\\$env:USERNAME\\\
        AppData\\Local\\Programs\\Microsoft VS Code\\Code.exe\"\n\nNew-Item -ItemType Directory -Force -Path $workspace, \"\
        $workspace\\scripts\", \"$workspace\\notes\", \"$workspace\\docs\", \"$workspace\\.vscode\" | Out-Null\n\n@'\nREPORT_NAME\
        \ = \"Daily Ops Digest\"\nMAX_ITEMS = 3\nFOOTER_TEXT = \"Prepared for daily review\"\n'@ | Set-Content -Path \"$workspace\\\
        scripts\\prepare_report.py\" -Encoding utf8\n\n@'\nARCHIVE_FOLDER = \"archive\"\nRETENTION_DAYS = 14\nDRY_RUN = True\n\
        '@ | Set-Content -Path \"$workspace\\scripts\\cleanup_data.py\" -Encoding utf8\n\n@'\nrequests==2.31.0\npyyaml==6.0.2\n\
        '@ | Set-Content -Path \"$workspace\\requirements.txt\" -Encoding utf8\n\n@'\n# Daily Summary\nOwner: Morning Operations\n\
        '@ | Set-Content -Path \"$workspace\\notes\\summary_template.md\" -Encoding utf8\n\nif (Test-Path $codeExe) {\n  Start-Process\
        \ -FilePath $codeExe -ArgumentList $workspace\n} else {\n  Start-Process -FilePath \"code\" -ArgumentList $workspace\n\
        }\n"
      timeout: 30
    - type: wait
      ms: 4000
evaluation:
  evaluator_id: evaluators.windows.vscode:VSCodeEvaluator
  params:
    check_id: vscode_ops_handoff_workspace
    stdout_contains: EVAL_RESULT:PASS
    artifact_paths:
    - C:\Users\User\Documents\ops_handoff_workspace\scripts\prepare_report.py
    - C:\Users\User\Documents\ops_handoff_workspace\scripts\cleanup_data.py
    - C:\Users\User\Documents\ops_handoff_workspace\requirements.txt
    - C:\Users\User\Documents\ops_handoff_workspace\notes\summary_template.md
    - C:\Users\User\Documents\ops_handoff_workspace\.vscode\settings.json
    - C:\Users\User\Documents\ops_handoff_workspace\docs\ops-handoff.md
    timeout: 15
    supplemental_checks:
      powershell:
      - label: primary_hard_mode
        script: '$path = "C:\Users\User\Documents\ops_handoff_workspace\docs\hard-mode-validation.md"

          if (-not (Test-Path -LiteralPath $path)) { Write-Output "EVAL_RESULT:FAIL file missing: $path"; exit 1 }

          $text = Get-Content -LiteralPath $path -Raw

          if ($text -like "*Ops handoff hard mode complete*") { Write-Output "EVAL_RESULT:PASS primary text contains hard-mode
          requirement" } else { Write-Output "EVAL_RESULT:FAIL primary text missing hard-mode requirement"; exit 1 }'
        stdout_contains: EVAL_RESULT:PASS
        timeout: 90
      - label: no_notepad_process
        script: '$p = Get-Process -Name notepad -ErrorAction SilentlyContinue

          if ($p) { Write-Output ''NOTEPAD_RUNNING''; exit 1 }

          Write-Output ''NO_NOTEPAD_PROCESS'''
        stdout_contains: NO_NOTEPAD_PROCESS
        expected_exit_code: 0
        timeout: 10
      files:
      - path: C:\Users\User\Documents\helloworld_hard_plus\windows_vscode_ops_handoff_workspace\hard_plus_handoff.tsv
        exact_text: "task_id\tlinux_peer\tstatus\nwindows.vscode.ops_handoff_workspace\tlinux.vscode.prepare_release_packet\t\
          hard-plus-ready\napp\tcode\tevaluator-checked"
      - path: C:\Users\User\Documents\helloworld_hard_plus\windows_vscode_ops_handoff_workspace\hard_plus_dependency_index.txt
        exact_text: 'primary_task=windows.vscode.ops_handoff_workspace

          linux_peer=linux.vscode.prepare_release_packet

          difficulty=hard-plus

          requires_multi_artifact_handoff=true

          oracle_receipt=hard_plus_oracle_receipt.txt'
      - path: C:\Users\User\Documents\helloworld_hard_plus\windows_vscode_ops_handoff_workspace\hard_plus_review_matrix.csv
        exact_text: 'check,owner,status

          linux_alignment,benchmark-ops,ready

          extra_artifacts,benchmark-ops,ready

          oracle_recheck,benchmark-ops,required'
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - vscode
  - workspace
  - python
  - markdown
  - settings
  - hard
  - single_app
  - evaluator_backed
  - hard-plus
  - multi_artifact_handoff
  - linux_plus
  difficulty: hard
  app_name: code
  estimated_min_steps: 49
  description: 'Multi-file VS Code workspace task spanning Python, requirements, markdown, workspace settings, and a new handoff
    document.

    '
  human_steps: 88
  hardness: hard-evaluable
  evaluation_standard: all retained hard requirements are covered by the main evaluator or supplemental checks
  linux_peer: linux.vscode.prepare_release_packet
  linux_peer_file: tasks/linux/vscode_prepare_release_packet_hard.yaml
  alignment_status: functional_equivalent_plus_extra
  hard_plus_alignment: linux_peer_plus_extra_evaluator_checked_artifacts
  hard_plus_note: The Linux-aligned core task remains required; extra handoff/audit artifacts are also evaluator checked.
  oracle_model: windows_oracle
