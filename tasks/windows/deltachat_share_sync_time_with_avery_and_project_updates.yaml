task_id: windows.deltachat.share_sync_time_with_avery_and_project_updates
platform: windows
instruction: 'Read the latest update in "Project Updates" to confirm the weekly sync time, then send Avery a message using
  the wording "Weekly sync moved to <time>. Source: Project Updates.", replacing <time> with the time from that update. After
  that, post a confirmation back to "Project Updates" using the wording "I already notified Avery sync time is <time>. Source:
  Project Updates." Then send Morgan Ops the exact wording "Audit note: Avery sync update used <time>. Source: Project Updates."
  Finally send Jordan Travel the exact wording "Calendar note: weekly sync is <time>. Source: Project Updates." Use the same
  time in all four messages. Also create these hard-plus verification files so the final state is a multi-artifact handoff
  bundle: C:\Users\User\Documents\helloworld_hard_plus\windows_deltachat_share_sync_time_with_avery_and_project_updates\hard_plus_handoff.tsv
  with exactly this content: ''task_id\tlinux_peer\tstatus\nwindows.deltachat.share_sync_time_with_avery_and_project_updates\tlinux.deltachat.coordination_roundup\thard-plus-ready\napp\tDelta
  Chat\tevaluator-checked''; C:\Users\User\Documents\helloworld_hard_plus\windows_deltachat_share_sync_time_with_avery_and_project_updates\hard_plus_dependency_index.txt
  with exactly this content: ''primary_task=windows.deltachat.share_sync_time_with_avery_and_project_updates\nlinux_peer=linux.deltachat.coordination_roundup\ndifficulty=hard-plus\nrequires_multi_artifact_handoff=true\noracle_receipt=hard_plus_oracle_receipt.txt'';
  C:\Users\User\Documents\helloworld_hard_plus\windows_deltachat_share_sync_time_with_avery_and_project_updates\hard_plus_review_matrix.csv
  with exactly this content: ''check,owner,status\nlinux_alignment,benchmark-ops,ready\nextra_artifacts,benchmark-ops,ready\noracle_recheck,benchmark-ops,required''.
  Use Delta Chat for the messaging workflow; create required hard-plus verification files directly at the specified paths
  using the available automation/runtime file-writing method, not Notepad or another text editor.'
init:
  initializer_id: initializers.windows.deltachat:DeltaChatSendMessageInitializer
  params:
    api_base_url: http://127.0.0.1:8081
    profile_archive_path: files/deltachat/profile.zip
    purge_greenmail: true
    allow_missing_greenmail: false
    seed_sender_email: benchrecv@example.test
    seed_sender_password: benchpass
    seed_recipient_email: benchsender@example.test
    seed_subject: Project Updates
    seed_body: 'Latest schedule update: the weekly sync moved to Friday 3 PM.'
    seed_smtp_host: 127.0.0.1
    seed_smtp_port: 3025
    wait_ms: 2500
evaluation:
  evaluator_id: evaluators.windows.deltachat_share_sync_screenshot:DeltaChatShareSyncScreenshotEvaluator
  params:
    api_base_url: http://127.0.0.1:8081
    allow_missing_greenmail: false
    expected_messages:
    - recipient_email: avery.design@example.test
      body: 'Weekly sync moved to Friday 3 PM. Source: Project Updates.'
    - recipient_email: benchrecv@example.test
      body: 'I already notified Avery sync time is Friday 3 PM. Source: Project Updates.'
    - recipient_email: morgan.ops@example.test
      body: 'Audit note: Avery sync update used Friday 3 PM. Source: Project Updates.'
    - recipient_email: jordan.travel@example.test
      body: 'Calendar note: weekly sync is Friday 3 PM. Source: Project Updates.'
    mailbox: INBOX
    timeout_seconds: 40
    poll_interval_seconds: 1
    supplemental_checks:
      files:
      - path: C:\Users\User\Documents\helloworld_hard_plus\windows_deltachat_share_sync_time_with_avery_and_project_updates\hard_plus_handoff.tsv
        exact_text: "task_id\tlinux_peer\tstatus\nwindows.deltachat.share_sync_time_with_avery_and_project_updates\tlinux.deltachat.coordination_roundup\t\
          hard-plus-ready\napp\tDelta Chat\tevaluator-checked"
      - path: C:\Users\User\Documents\helloworld_hard_plus\windows_deltachat_share_sync_time_with_avery_and_project_updates\hard_plus_dependency_index.txt
        exact_text: 'primary_task=windows.deltachat.share_sync_time_with_avery_and_project_updates

          linux_peer=linux.deltachat.coordination_roundup

          difficulty=hard-plus

          requires_multi_artifact_handoff=true

          oracle_receipt=hard_plus_oracle_receipt.txt'
      - path: C:\Users\User\Documents\helloworld_hard_plus\windows_deltachat_share_sync_time_with_avery_and_project_updates\hard_plus_review_matrix.csv
        exact_text: 'check,owner,status

          linux_alignment,benchmark-ops,ready

          extra_artifacts,benchmark-ops,ready

          oracle_recheck,benchmark-ops,required'
      powershell:
      - label: no_notepad_process
        script: '$p = Get-Process -Name notepad -ErrorAction SilentlyContinue

          if ($p) { Write-Output ''NOTEPAD_RUNNING''; exit 1 }

          Write-Output ''NO_NOTEPAD_PROCESS'''
        stdout_contains: NO_NOTEPAD_PROCESS
        expected_exit_code: 0
        timeout: 10
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - chat
  - deltachat
  - windows
  - benchmark
  - hard
  - single_app
  - evaluator_backed
  - hard-plus
  - multi_artifact_handoff
  - linux_plus
  difficulty: hard
  app: Delta Chat
  human_steps: 92
  description: Read a seeded Delta Chat update, propagate the extracted sync time to three contacts, and post an exact sourced
    confirmation back to the project thread.
  hardness: hard-evaluable
  evaluation_standard: all retained hard requirements are covered by the main evaluator or supplemental checks
  linux_peer: linux.deltachat.coordination_roundup
  linux_peer_file: tasks/linux/deltachat_reply_alice_hard.yaml
  alignment_status: difficulty_equivalent
  hard_plus_alignment: linux_peer_plus_extra_evaluator_checked_artifacts
  hard_plus_note: The Linux-aligned core task remains required; extra handoff/audit artifacts are also evaluator checked.
  oracle_model: windows_oracle
