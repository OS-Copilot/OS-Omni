instruction: Produce four edited image exports in the photo editing application by applying specific adjustments
  to four source files from the Pictures folder. The first export, saved as "pe4_bluegreen_guitar-edited.png",
  is derived from "pe4_bluegreen_guitar.png" and requires the Structure slider set to 17, the HDR slider
  set to 9, and the Cool Tone slider set to 6 in the Scene panel; the Cyan slider set to -9 and the Blue
  slider set to -6 in the HSL panel; the Brightness slider set to 7, the Contrast slider set to 9, and
  the Sharpen slider set to 13 in the Edit panel; and the "Clean" preset selected with the Strength slider
  set to 31 in the Filters panel, followed by the Exposure slider set to 2, the Temperature slider set
  to -2, and the Vignette slider set to 3 in the Edit panel. The second export, saved as "pe4_studio_white_outfit-edited.png",
  is derived from "pe4_studio_white_outfit.png" and requires the Smooth slider set to 7, the Whiten slider
  set to 5, the Rosy slider set to 4, the Bright Eyes slider set to 6, and the Background Blur slider
  set to 5 in the Portrait panel; the Temperature slider set to -3, the Exposure slider set to 3, and
  the Sharpen slider set to 6 in the Edit panel; and the "Portrait" preset selected with the Strength
  slider set to 20 in the Filters panel. The third export, saved as "pe4_darkwindow_bearded_man-edited.png",
  is derived from "pe4_darkwindow_bearded_man.png" and requires the "Film" preset selected with the Strength
  slider set to 40 in the Filters panel; the Exposure slider set to 9, the Brightness slider set to 4,
  the Contrast slider set to -6, the Fade slider set to 7, the Grain slider set to 9, and the Vignette
  slider set to 13 in the Edit panel; the Orange slider set to 5 and the Yellow slider set to -6 in the
  HSL panel; and the Background Blur slider set to 5, the Bright Eyes slider set to 4, and the Smooth
  slider set to 3 in the Portrait panel. The fourth export, saved as "pe4_brightwindow_gray_sweater-edited.png",
  is derived from "pe4_brightwindow_gray_sweater.png" and requires the Saturation slider set to 5, the
  Temperature slider set to -4, the Contrast slider set to 4, and the Sharpen slider set to 10 in the
  Edit panel; the Smooth slider set to 4, the Bright Eyes slider set to 5, and the Background Blur slider
  set to 4 in the Portrait panel; and the "Clean" preset selected with the Strength slider set to 23 in
  the Filters panel. The application must remain on the editing page for the "pe4_brightwindow_gray_sweater.png"
  image upon completion.
