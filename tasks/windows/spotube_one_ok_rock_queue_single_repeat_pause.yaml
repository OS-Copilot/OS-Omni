task_id: windows.spotube.one_ok_rock_queue_single_repeat_pause
platform: windows
instruction: 'In Spotube, go through the getting-started flow without changing the Marketplace Region. Turn Endless Playback
  off during getting started and continue until you reach the Plugins page. Then open Settings and make these changes: 1.
  Set Theme to Dark. 2. Turn Normalize audio on. After that, search for ONE OK ROCK, switch to the Artists section, and open
  the artist ONE OK ROCK. On that artist page, find the track You''ve Broken My Heart and start playing it. Then, on the same
  artist page, find Rose Blood, Keep It Real, and And I Know, and add all three tracks to the current queue. Next, open the
  current playback view, go to the Lyrics page, pause You''ve Broken My Heart at about 0:30, and change the playback mode
  to repeat the current track. Leave Spotube open and make sure the final state is: the current track is You''ve Broken My
  Heart, playback is paused at about 0:30, repeat mode is set to repeat the current track, and Rose Blood, Keep It Real, and
  And I Know are all present in the current queue.

  Additional primary hard-mode requirement: Also add The Beginning to the current queue before leaving playback paused on
  single-repeat mode. Also create these hard-plus verification files so the final state is a multi-artifact handoff bundle:
  C:\Users\User\Documents\helloworld_hard_plus\windows_spotube_one_ok_rock_queue_single_repeat_pause\hard_plus_handoff.tsv
  with exactly this content: ''task_id\tlinux_peer\tstatus\nwindows.spotube.one_ok_rock_queue_single_repeat_pause\tlinux.spotube.import_focus_capsule\thard-plus-ready\napp\tspotube\tevaluator-checked'';
  C:\Users\User\Documents\helloworld_hard_plus\windows_spotube_one_ok_rock_queue_single_repeat_pause\hard_plus_dependency_index.txt
  with exactly this content: ''primary_task=windows.spotube.one_ok_rock_queue_single_repeat_pause\nlinux_peer=linux.spotube.import_focus_capsule\ndifficulty=hard-plus\nrequires_multi_artifact_handoff=true\noracle_receipt=hard_plus_oracle_receipt.txt'';
  C:\Users\User\Documents\helloworld_hard_plus\windows_spotube_one_ok_rock_queue_single_repeat_pause\hard_plus_review_matrix.csv
  with exactly this content: ''check,owner,status\nlinux_alignment,benchmark-ops,ready\nextra_artifacts,benchmark-ops,ready\noracle_recheck,benchmark-ops,required''.
  Use the target application for the app workflow; create required hard-plus verification files directly at the specified
  paths using the available automation/runtime file-writing method, not Notepad or another text editor.'
init:
  initializer_id: initializers.windows.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_powershell
      script: "Stop-Process -Name spotube -Force -ErrorAction SilentlyContinue\n\n@'\nimport json\nimport pathlib\nimport\
        \ sqlite3\n\napp_dir = pathlib.Path(r\"C:\\Users\\User\\AppData\\Roaming\\oss.krtirtho\\spotube\")\napp_dir.mkdir(parents=True,\
        \ exist_ok=True)\n\nprefs_path = app_dir / \"shared_preferences.json\"\nprefs_path.write_text(\n    json.dumps(\n\
        \        {\n            \"doneGettingStarted\": False,\n            \"flutter.windowSize\": \"{\\\"height\\\":802.0,\\\
        \"width\\\":1202.0,\\\"maximized\\\":false}\",\n        }\n    ),\n    encoding=\"utf-8\",\n)\n\ndb_path = app_dir\
        \ / \"db.sqlite\"\nconn = sqlite3.connect(db_path)\nconn.execute(\n    '''\n    CREATE TABLE IF NOT EXISTS preferences_table\
        \ (\n      id INTEGER NOT NULL PRIMARY KEY AUTOINCREMENT,\n      album_color_sync INTEGER NOT NULL DEFAULT 1,\n  \
        \    amoled_dark_theme INTEGER NOT NULL DEFAULT 0,\n      check_update INTEGER NOT NULL DEFAULT 1,\n      normalize_audio\
        \ INTEGER NOT NULL DEFAULT 0,\n      show_system_tray_icon INTEGER NOT NULL DEFAULT 0,\n      system_title_bar INTEGER\
        \ NOT NULL DEFAULT 0,\n      skip_non_music INTEGER NOT NULL DEFAULT 0,\n      close_behavior TEXT NOT NULL DEFAULT\
        \ 'close',\n      accent_color_scheme TEXT NOT NULL DEFAULT 'Slate:0xff64748b',\n      layout_mode TEXT NOT NULL DEFAULT\
        \ 'adaptive',\n      locale TEXT NOT NULL DEFAULT '{\"languageCode\":\"system\",\"countryCode\":\"system\"}',\n  \
        \    market TEXT NOT NULL DEFAULT 'US',\n      search_mode TEXT NOT NULL DEFAULT 'youtube',\n      download_location\
        \ TEXT NOT NULL DEFAULT 'C:\\\\Users\\\\User\\\\Downloads\\\\Spotube',\n      local_library_location TEXT NOT NULL\
        \ DEFAULT '',\n      theme_mode TEXT NOT NULL DEFAULT 'system',\n      audio_source_id TEXT NULL,\n      youtube_client_engine\
        \ TEXT NOT NULL DEFAULT 'newPipe',\n      discord_presence INTEGER NOT NULL DEFAULT 1,\n      endless_playback INTEGER\
        \ NOT NULL DEFAULT 1,\n      enable_connect INTEGER NOT NULL DEFAULT 0,\n      connect_port INTEGER NOT NULL DEFAULT\
        \ -1,\n      cache_music INTEGER NOT NULL DEFAULT 1\n    )\n    '''\n)\nconn.execute(\"DELETE FROM preferences_table\"\
        )\nconn.execute(\n    \"\"\"\n    INSERT INTO preferences_table (\n      id, album_color_sync, amoled_dark_theme,\
        \ check_update,\n      normalize_audio, show_system_tray_icon, system_title_bar,\n      skip_non_music, close_behavior,\
        \ accent_color_scheme,\n      layout_mode, locale, market, search_mode, download_location,\n      local_library_location,\
        \ theme_mode, audio_source_id,\n      youtube_client_engine, discord_presence, endless_playback,\n      enable_connect,\
        \ connect_port, cache_music\n    ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)\n\
        \    \"\"\",\n    (\n        0, 1, 0, 1, 0, 0, 0, 0, \"close\", \"Slate:0xff64748b\",\n        \"adaptive\", '{\"\
        languageCode\":\"system\",\"countryCode\":\"system\"}',\n        \"US\", \"youtube\", r\"C:\\Users\\User\\Downloads\\\
        Spotube\", \"\",\n        \"system\", None, \"newPipe\", 1, 1, 0, -1, 1,\n    ),\n)\nconn.commit()\nconn.close()\n\
        '@ | py -3 -\n\nStart-Process -FilePath \"C:\\Program Files\\Spotube\\spotube.exe\"\n"
      timeout: 60
    - type: wait
      ms: 5000
evaluation:
  evaluator_id: evaluators.windows.spotube:SpotubeEvaluator
  params:
    check_id: spotube_one_ok_rock_queue_single_repeat_pause
    stdout_contains: EVAL_RESULT:PASS
    stdout_not_contains: EVAL_RESULT:FAIL
    artifact_paths:
    - C:\Users\User\AppData\Roaming\oss.krtirtho\spotube\shared_preferences.json
    - C:\Users\User\AppData\Roaming\oss.krtirtho\spotube\db.sqlite
    timeout: 20
    supplemental_checks:
      powershell:
      - label: primary_hard_mode
        script: "$py = @'\nimport json, pathlib, sqlite3\napp = pathlib.Path(r\"C:\\Users\\User\\AppData\\Roaming\\oss.krtirtho\\\
          spotube\")\nshared = json.loads((app / \"shared_preferences.json\").read_text(encoding=\"utf-8\"))\n\nconn = sqlite3.connect(app\
          \ / \"db.sqlite\")\nrow = conn.execute(\"select tracks from audio_player_state_table order by id limit 1\").fetchone()\n\
          conn.close()\ntracks = json.loads(row[0]) if row and row[0] else []\nnames = [t.get(\"name\") for t in tracks]\n\
          \nif 'The Beginning' not in names:\n    print(\"EVAL_RESULT:FAIL hard-mode queue track missing\")\n    raise SystemExit(1)\n\
          \nprint(\"EVAL_RESULT:PASS Spotube hard-mode state found\")\n'@\n$py | py -3 -W ignore -"
        stdout_contains: EVAL_RESULT:PASS
        timeout: 90
      - label: no_notepad_process
        script: '$p = Get-Process -Name notepad -ErrorAction SilentlyContinue

          if ($p) { Write-Output ''NOTEPAD_RUNNING''; exit 1 }

          Write-Output ''NO_NOTEPAD_PROCESS'''
        stdout_contains: NO_NOTEPAD_PROCESS
        expected_exit_code: 0
        timeout: 10
      files:
      - path: C:\Users\User\Documents\helloworld_hard_plus\windows_spotube_one_ok_rock_queue_single_repeat_pause\hard_plus_handoff.tsv
        exact_text: "task_id\tlinux_peer\tstatus\nwindows.spotube.one_ok_rock_queue_single_repeat_pause\tlinux.spotube.import_focus_capsule\t\
          hard-plus-ready\napp\tspotube\tevaluator-checked"
      - path: C:\Users\User\Documents\helloworld_hard_plus\windows_spotube_one_ok_rock_queue_single_repeat_pause\hard_plus_dependency_index.txt
        exact_text: 'primary_task=windows.spotube.one_ok_rock_queue_single_repeat_pause

          linux_peer=linux.spotube.import_focus_capsule

          difficulty=hard-plus

          requires_multi_artifact_handoff=true

          oracle_receipt=hard_plus_oracle_receipt.txt'
      - path: C:\Users\User\Documents\helloworld_hard_plus\windows_spotube_one_ok_rock_queue_single_repeat_pause\hard_plus_review_matrix.csv
        exact_text: 'check,owner,status

          linux_alignment,benchmark-ops,ready

          extra_artifacts,benchmark-ops,ready

          oracle_recheck,benchmark-ops,required'
