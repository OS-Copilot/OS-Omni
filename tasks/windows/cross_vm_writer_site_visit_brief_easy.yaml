task_id: windows.cross_vm.writer_site_visit_brief_easy
platform: windows
instruction: 'A blank LibreOffice Writer document named "site_visit_brief.docx" is open, and the transferred note "site_visit_transfer.txt"
  is on the Desktop. Use the transferred note to create a short brief in the document. The finished document must contain
  exactly these non-empty lines: "Northwind Site Visit", "Confirm loading dock access at 08:30", "Bring revised safety checklist",
  and "Share the updated visitor badge count: 14". Save the document when done. Use LibreOffice Writer to read the transferred
  note and complete the document; do not open Notepad or any other text editor for the transferred file or for any required
  verification artifact.'
init:
  initializer_id: initializers.windows.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_powershell
      script: |
        $ErrorActionPreference = 'Stop'
        Get-Process soffice,soffice.bin,swriter -ErrorAction SilentlyContinue |
          Stop-Process -Force -ErrorAction SilentlyContinue
        $docPath = Join-Path $env:USERPROFILE 'Documents\site_visit_brief.docx'
        $notePath = Join-Path $env:USERPROFILE 'Desktop\site_visit_transfer.txt'
        New-Item -ItemType Directory -Path (Split-Path $docPath) -Force | Out-Null
        New-Item -ItemType Directory -Path (Split-Path $notePath) -Force | Out-Null
        @(
          'Northwind Site Visit'
          'Confirm loading dock access at 08:30'
          'Bring revised safety checklist'
          'Share the updated visitor badge count: 14'
        ) | Set-Content -LiteralPath $notePath -Encoding UTF8
        $code = @'
        import os
        import subprocess
        import sys

        try:
            from docx import Document
        except ImportError:
            subprocess.check_call([sys.executable, "-m", "pip", "install", "python-docx", "-q"])
            from docx import Document

        path = os.path.join(os.environ["USERPROFILE"], "Documents", "site_visit_brief.docx")
        os.makedirs(os.path.dirname(path), exist_ok=True)
        Document().save(path)
        print("INIT_OK", path)
        '@
        $code | py -3 -W ignore -
        if ($LASTEXITCODE -ne 0) { throw "Failed to create site_visit_brief.docx" }
        if (-not (Test-Path -LiteralPath $docPath)) { throw "Missing initialized document: $docPath" }
        if (-not (Test-Path -LiteralPath $notePath)) { throw "Missing transferred note: $notePath" }
      timeout: 60
    - type: run_powershell
      script: |
        $ErrorActionPreference = 'Stop'
        $filePath = Join-Path $env:USERPROFILE 'Documents\site_visit_brief.docx'
        if (-not (Test-Path -LiteralPath $filePath)) { throw "Missing document before launch: $filePath" }
        $candidates = @(
          'C:\Program Files\LibreOffice\program\swriter.exe',
          'C:\Program Files (x86)\LibreOffice\program\swriter.exe',
          'C:\Program Files\LibreOffice\program\soffice.exe',
          'C:\Program Files (x86)\LibreOffice\program\soffice.exe',
          'C:\Program Files\LibreOffice 26\program\swriter.exe',
          'C:\Program Files\LibreOffice 26\program\soffice.exe'
        )
        $officeExe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
        if (-not $officeExe) {
          $cmd = Get-Command swriter.exe -ErrorAction SilentlyContinue
          if ($cmd) { $officeExe = $cmd.Source }
        }
        if (-not $officeExe) { throw 'LibreOffice Writer executable not found' }
        Start-Process -FilePath $officeExe -ArgumentList "`"$filePath`""
      timeout: 30
    - type: wait
      ms: 5000
evaluation:
  evaluator_id: evaluators.windows.powershell_check:PowerShellCheckEvaluator
  params:
    timeout: 60
    stdout_contains: EVAL_RESULT:PASS
    command: "@'\nimport os, subprocess, sys\ntry:\n    from docx import Document\nexcept ImportError:\n    subprocess.check_call([sys.executable,\
      \ '-m', 'pip', 'install', 'python-docx', '-q'])\n    from docx import Document\npath = os.path.join(os.environ['USERPROFILE'],\
      \ 'Documents', 'site_visit_brief.docx')\ndoc = Document(path)\nlines = [p.text.strip() for p in doc.paragraphs if p.text.strip()]\n\
      expected = [\n    'Northwind Site Visit',\n    'Confirm loading dock access at 08:30',\n    'Bring revised safety checklist',\n\
      \    'Share the updated visitor badge count: 14',\n]\nif lines != expected:\n    print('LINES_MISMATCH:' + repr(lines))\n\
      \    raise SystemExit(1)\nprint('EVAL_RESULT:PASS')\n'@ | py -3 -W ignore -\n"
    supplemental_checks:
      powershell:
      - label: no_notepad_process
        script: '$p = Get-Process -Name notepad -ErrorAction SilentlyContinue

          if ($p) { Write-Output ''NOTEPAD_RUNNING''; exit 1 }

          Write-Output ''NO_NOTEPAD_PROCESS'''
        stdout_contains: NO_NOTEPAD_PROCESS
        expected_exit_code: 0
        timeout: 10
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - windows
  - cross_vm
  - libreoffice
  - writer
  - easy
  app_name: libreoffice-writer
  difficulty: easy
  description: Use a transferred Android note to complete a short Writer brief on Windows.
  cross_vm_role: windows_target_phase
  composite_task: cross_vm.android_to_windows.site_visit_brief_easy
  source_platform: android
  target_platform: windows
  counts_as_windows_cross_vm_task: false
  linux_peer: linux.cross_vm.writer_site_visit_brief_easy
  linux_peer_file: tasks/linux/cross_vm_writer_site_visit_brief_easy.yaml
  alignment_status: difficulty_equivalent
