task_id: windows.drawio.square_center_helloworld
platform: windows
instruction: In the draw.io desktop app, use the blank diagram that is already opened from C:\Users\User\Documents\drawio_square_center_helloworld.drawio. Add exactly one square. Insert the text "Helloworld" and make sure the text is centered in the square. Save the currently opened diagram and leave the finished file open.
init:
  initializer_id: initializers.windows.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_powershell
      script: "$ErrorActionPreference = \"Stop\"\n\nGet-Process \"draw.io\" -ErrorAction SilentlyContinue |\n  Stop-Process -Force -ErrorAction SilentlyContinue\nStart-Sleep -Milliseconds 800\n\n$drawioPath = @(\n  \"C:\\Program Files\\draw.io\\draw.io.exe\",\n  \"$env:LOCALAPPDATA\\Programs\\draw.io\\draw.io.exe\"\n) | Where-Object { Test-Path $_ } | Select-Object -First 1\n\nif (-not $drawioPath) {\n  throw \"draw.io executable not found\"\n}\n\n$documentPath = \"C:\\Users\\User\\Documents\\drawio_square_center_helloworld.drawio\"\n$documentDir = Split-Path -Parent $documentPath\nNew-Item -ItemType Directory -Path $documentDir -Force | Out-Null\n\nforeach ($path in @(\n  $documentPath,\n  \"$documentPath.bak\",\n  \"$documentPath.tmp\"\n)) {\n  if (Test-Path $path) {\n    Remove-Item -LiteralPath $path -Force -ErrorAction SilentlyContinue\n  }\n}\n\n# Clear persisted Electron/browser state so draw.io does not reopen\n# the previous unsaved canvas from Local Storage / IndexedDB.\n$drawioAppData\
        \ = Join-Path $env:APPDATA \"draw.io\"\nif (Test-Path $drawioAppData) {\n  foreach ($name in @(\n    \"Local Storage\",\n    \"IndexedDB\",\n    \"Session Storage\",\n    \"blob_storage\",\n    \"Cache\",\n    \"Code Cache\",\n    \"GPUCache\",\n    \"DawnCache\",\n    \"Service Worker\"\n  )) {\n    $target = Join-Path $drawioAppData $name\n    if (Test-Path $target) {\n      Remove-Item -LiteralPath $target -Recurse -Force -ErrorAction SilentlyContinue\n    }\n  }\n}\n\n# Also remove hidden draft temp files that draw.io may leave next to\n# prior files in Documents.\nGet-ChildItem -Path $documentDir -Force -ErrorAction SilentlyContinue |\n  Where-Object {\n    $_.Name -like '.$*.dtmp' -or $_.Name -like '~$*.dtmp'\n  } |\n  Remove-Item -Force -ErrorAction SilentlyContinue\n\n$blankDiagram = [string]::Join([Environment]::NewLine, @(\n  '<mxfile host=\"Electron\" type=\"device\">',\n  '  <diagram id=\"blank\" name=\"Page-1\">',\n  '    <mxGraphModel dx=\"1000\" dy=\"1000\" grid=\"\
        1\" gridSize=\"10\" guides=\"1\" tooltips=\"1\" connect=\"1\" arrows=\"1\" fold=\"1\" page=\"1\" pageScale=\"1\" pageWidth=\"850\" pageHeight=\"1100\" math=\"0\" shadow=\"0\">',\n  '      <root>',\n  '        <mxCell id=\"0\"/>',\n  '        <mxCell id=\"1\" parent=\"0\"/>',\n  '      </root>',\n  '    </mxGraphModel>',\n  '  </diagram>',\n  '</mxfile>'\n)) + [Environment]::NewLine\nSet-Content -LiteralPath $documentPath -Value $blankDiagram -Encoding UTF8\n\n"
      timeout: 20
    - type: run_powershell
      script: "$ErrorActionPreference = \"Stop\"\n\n$drawioPath = @(\n  \"C:\\Program Files\\draw.io\\draw.io.exe\",\n  \"$env:LOCALAPPDATA\\Programs\\draw.io\\draw.io.exe\"\n) | Where-Object { Test-Path $_ } | Select-Object -First 1\n\nif (-not $drawioPath) {\n  throw \"draw.io executable not found\"\n}\n\n$documentPath = \"C:\\Users\\User\\Documents\\drawio_square_center_helloworld.drawio\"\nStart-Process -FilePath $drawioPath -ArgumentList @($documentPath) -WindowStyle Maximized | Out-Null\n"
      timeout: 20
    - type: wait
      ms: 12000
    - type: run_powershell
      script: "$ErrorActionPreference = \"Stop\"\n\nAdd-Type -AssemblyName Microsoft.VisualBasic\nAdd-Type -AssemblyName System.Windows.Forms\nAdd-Type @\"\nusing System;\nusing System.Runtime.InteropServices;\npublic static class User32 {\n  [DllImport(\"user32.dll\")]\n  public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow);\n  [DllImport(\"user32.dll\")]\n  public static extern bool SetForegroundWindow(IntPtr hWnd);\n  [DllImport(\"user32.dll\")]\n  public static extern bool MoveWindow(IntPtr hWnd, int X, int Y, int nWidth, int nHeight, bool bRepaint);\n}\n\"@\n\n$drawioProc = $null\nfor ($i = 0; $i -lt 30; $i++) {\n  $drawioProc = Get-Process \"draw.io\" -ErrorAction SilentlyContinue |\n    Where-Object { $_.MainWindowHandle -ne 0 } |\n    Select-Object -First 1\n  if ($null -ne $drawioProc) {\n    break\n  }\n  Start-Sleep -Milliseconds 500\n}\n\nif ($null -eq $drawioProc) {\n  throw \"Could not find a visible draw.io main window\"\n}\n\nGet-Process -ErrorAction SilentlyContinue\
        \ |\n  Where-Object {\n    $_.MainWindowHandle -ne 0 -and\n    $_.Id -ne $drawioProc.Id -and\n    ($_.ProcessName -in @(\"WindowsTerminal\", \"powershell\", \"pwsh\", \"cmd\", \"notepad\"))\n  } |\n  ForEach-Object {\n    [void][User32]::ShowWindow($_.MainWindowHandle, 6)\n  }\n\n$workingArea = [System.Windows.Forms.Screen]::PrimaryScreen.WorkingArea\n[void][User32]::MoveWindow(\n  $drawioProc.MainWindowHandle,\n  $workingArea.X,\n  $workingArea.Y,\n  $workingArea.Width,\n  $workingArea.Height,\n  $true\n)\nStart-Sleep -Milliseconds 200\n[void][User32]::ShowWindow($drawioProc.MainWindowHandle, 9)\nStart-Sleep -Milliseconds 200\n[void][Microsoft.VisualBasic.Interaction]::AppActivate($drawioProc.Id)\nStart-Sleep -Milliseconds 300\n[void][User32]::SetForegroundWindow($drawioProc.MainWindowHandle)\nStart-Sleep -Milliseconds 300\n[System.Windows.Forms.SendKeys]::SendWait(\"% \")\nStart-Sleep -Milliseconds 200\n[System.Windows.Forms.SendKeys]::SendWait(\"x\")\n"
      timeout: 20
    - type: wait
      ms: 2000
evaluation:
  evaluator_id: evaluators.windows.drawio:DrawIOEvaluator
  params:
    check_id: drawio_square_center_helloworld
    timeout: 90
    stdout_contains: EVAL_RESULT:PASS
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - drawio
  - diagram
  - square
  - text
  - shengyang
  - easy
  difficulty: easy
  app: draw.io
  app_name: draw.io
  description: 'Open the desktop draw.io app, create one square, place Helloworld in the exact center, and save the result to a fixed .drawio path for deterministic XML-based evaluation.

    '
