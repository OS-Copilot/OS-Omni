platform: windows
instruction: Ensure the system input language is set to English so that the taskbar displays "ENG" in
  the bottom-right corner, and log in to the OpenShop account using the password spring2026. Place two
  separate orders from the Travel category, each containing three items with the "Trail Kit" specification
  selected. The first order must include the Summit Lane Waterproof Camp Chair, Wayfarer Co Compact Hiking
  Backpack, and Trailhouse Quick-Dry Trekking Pole Pair, with the quantities for the Summit Lane Waterproof
  Camp Chair and the Trailhouse Quick-Dry Trekking Pole Pair both set to 2. This order must be checked
  out using the "Home" delivery address and "Cash on Delivery" payment method, with the text TrailLoadOne
  entered in the Order Note field. The second order must include the Campwell Packable Portable Stove,
  Summit Lane Foldable Enamel Mug, and Wayfarer Co Waterproof Picnic Blanket, checked out using the "Home"
  delivery address and "Alipay" payment method, with the text TrailLoadTwo entered in the Order Note field.
  Upon completion, the order details for the first order must contain a review for the Summit Lane Waterproof
  Camp Chair with a rating of 4 / 5 and the comment ChairPacksQuick, and a review for the Wayfarer Co
  Compact Hiking Backpack with a rating of 3 / 5 and the comment PackFitsGear. The order details for the
  second order must contain a review for the Campwell Packable Portable Stove with a rating of 4 / 5 and
  the comment StoveSetsFast, and a review for the Summit Lane Foldable Enamel Mug with a rating of 3 /
  5 and the comment MugTravelsLight.
