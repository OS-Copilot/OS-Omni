task_id: windows.impress.animation_transition
platform: windows
instruction: 'A 5-slide conference presentation is open in LibreOffice Impress. Move slide 4 ("Speakers") so it becomes the
  last slide, add a "Fly In" entrance animation to the title on slide 1, and set the bullet points on slide 3 to appear one
  at a time with an entrance animation. Insert the image at Downloads\logo.png onto slide 2 and place it in the top-right
  area of the slide without removing the body text. Apply a "Fade" slide transition to all slides and save when done.

  Additional primary hard-mode requirement: Also add a small footer text box on slide 5 with the exact text "Hard mode: transition
  audit complete" without covering existing content. Also create these hard-plus verification files so the final state is
  a multi-artifact handoff bundle: C:\Users\User\Documents\helloworld_hard_plus\windows_impress_animation_transition\hard_plus_handoff.tsv
  with exactly this content: ''task_id\tlinux_peer\tstatus\nwindows.impress.animation_transition\tlinux.impress.add_dissolve_transition\thard-plus-ready\napp\tlibreoffice-impress\tevaluator-checked'';
  C:\Users\User\Documents\helloworld_hard_plus\windows_impress_animation_transition\hard_plus_dependency_index.txt with exactly
  this content: ''primary_task=windows.impress.animation_transition\nlinux_peer=linux.impress.add_dissolve_transition\ndifficulty=hard-plus\nrequires_multi_artifact_handoff=true\noracle_receipt=hard_plus_oracle_receipt.txt'';
  C:\Users\User\Documents\helloworld_hard_plus\windows_impress_animation_transition\hard_plus_review_matrix.csv with exactly
  this content: ''check,owner,status\nlinux_alignment,benchmark-ops,ready\nextra_artifacts,benchmark-ops,ready\noracle_recheck,benchmark-ops,required''.
  Use LibreOffice Impress for the presentation work; create any required .txt, .tsv, or .csv verification files directly at
  the specified paths using the available automation/runtime file-writing method, not Notepad or another text editor.'
init:
  initializer_id: initializers.windows.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_powershell
      script: "$code = @'\nimport os, struct, zlib\ndef mkpng(p, w=200, h=200, c=(30,80,160)):\n    def ch(t, d):\n\
        \        x = t + d\n        return struct.pack('>I', len(d)) + x + struct.pack('>I', zlib.crc32(x) & 0xffffffff)\n\
        \    raw = b''\n    for _ in range(h):\n        raw += b'\\x00' + bytes(c) * w\n    with open(p, 'wb') as f:\n   \
        \     f.write(b'\\x89PNG\\r\\n\\x1a\\n' + ch(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)) + ch(b'IDAT',\
        \ zlib.compress(raw)) + ch(b'IEND', b''))\noutput_path = os.path.join(os.environ['USERPROFILE'], 'Downloads', 'logo.png')\n\
        mkpng(output_path)\nprint('IMAGE_OK')\n'@\n$code | py -3 -W ignore -\nif ($LASTEXITCODE) { exit $LASTEXITCODE }\n"
      timeout: 15
    - type: run_powershell
      script: "$code = @'\nimport os, subprocess, sys\ntry:\n    from pptx import Presentation\nexcept ImportError:\n\
        \    subprocess.check_call([sys.executable, '-m', 'pip', 'install', 'python-pptx', '-q'])\n    from pptx import Presentation\n\
        \nprs = Presentation()\n\ns1 = prs.slides.add_slide(prs.slide_layouts[0])\ns1.shapes.title.text = 'Tech Conference\
        \ 2025'\ns1.placeholders[1].text = 'Innovation Meets Execution'\n\ns2 = prs.slides.add_slide(prs.slide_layouts[1])\n\
        s2.shapes.title.text = 'About Us'\ns2.placeholders[1].text = 'We are a leading technology company focused on AI and\
        \ cloud solutions.'\n\ns3 = prs.slides.add_slide(prs.slide_layouts[1])\ns3.shapes.title.text = 'Key Topics'\ns3.placeholders[1].text\
        \ = 'Machine Learning\\nCloud Infrastructure\\nCybersecurity\\nDevOps Best Practices'\n\ns4 = prs.slides.add_slide(prs.slide_layouts[1])\n\
        s4.shapes.title.text = 'Speakers'\ns4.placeholders[1].text = 'Dr. Smith - AI Research\\nMs. Chen - Cloud Arch\\nMr.\
        \ Kumar - Security'\n\ns5 = prs.slides.add_slide(prs.slide_layouts[1])\ns5.shapes.title.text = 'Closing'\ns5.placeholders[1].text\
        \ = 'Thank you for attending. See you next year!'\n\noutput_path = os.path.join(os.environ['USERPROFILE'], 'Downloads',\
        \ 'conference.pptx')\nprs.save(output_path)\nprint('INIT_OK: 5 slides')\n'@\n$code | py -3 -W ignore -\nif ($LASTEXITCODE) { exit $LASTEXITCODE }\n"
      timeout: 120
    - type: run_powershell
      script: "$pptPath = Join-Path $env:USERPROFILE \"Downloads\\conference.pptx\"\n$candidates = @(\n  \"C:\\Program Files\\\
        LibreOffice\\program\\simpress.exe\",\n  \"C:\\Program Files\\LibreOffice\\program\\soffice.exe\",\n  \"C:\\Program\
        \ Files (x86)\\LibreOffice\\program\\simpress.exe\",\n  \"C:\\Program Files (x86)\\LibreOffice\\program\\soffice.exe\"\
        \n)\n$exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1\nif (-not $exe) { throw \"LibreOffice\
        \ Impress not found\" }\nif ($exe -like \"*\\soffice.exe\") {\n  Start-Process -FilePath $exe -ArgumentList @(\"--impress\"\
        , $pptPath)\n} else {\n  Start-Process -FilePath $exe -ArgumentList @($pptPath)\n}\n"
      timeout: 120
    - type: wait
      ms: 5000
evaluation:
  evaluator_id: evaluators.windows.libreoffice_impress:LibreOfficeImpressEvaluator
  params:
    check_id: impress_animation_transition
    stdout_contains: EVAL_RESULT:PASS
    timeout: 90
    supplemental_checks:
      powershell:
      - label: primary_hard_mode
        script: "$ErrorActionPreference = \"Stop\"\n$py = @'\nimport zipfile\npath = r\"C:\\Users\\User\\Downloads\\conference.pptx\"\
          \nneedle = 'Hard mode: transition audit complete'\ntry:\n    with zipfile.ZipFile(path) as z:\n        blob = \"\
          \\n\".join(z.read(n).decode(\"utf-8\", \"ignore\") for n in z.namelist() if n.endswith(\".xml\") or n.endswith(\"\
          .rels\"))\nexcept Exception as exc:\n    print(f\"EVAL_RESULT:FAIL could not read zip artifact: {exc}\")\n    raise\
          \ SystemExit(1)\nif needle in blob:\n    print(\"EVAL_RESULT:PASS primary artifact contains hard-mode text\")\n\
          else:\n    print(\"EVAL_RESULT:FAIL primary artifact missing hard-mode text\")\n    raise SystemExit(1)\n'@\n$py\
          \ | py -3 -W ignore -"
        stdout_contains: EVAL_RESULT:PASS
        timeout: 90
      - label: no_notepad_process
        script: '$p = Get-Process -Name notepad -ErrorAction SilentlyContinue

          if ($p) { Write-Output ''NOTEPAD_RUNNING''; exit 1 }

          Write-Output ''NO_NOTEPAD_PROCESS'''
        stdout_contains: NO_NOTEPAD_PROCESS
        expected_exit_code: 0
        timeout: 10
      files:
      - path: C:\Users\User\Documents\helloworld_hard_plus\windows_impress_animation_transition\hard_plus_handoff.tsv
        exact_text: "task_id\tlinux_peer\tstatus\nwindows.impress.animation_transition\tlinux.impress.add_dissolve_transition\t\
          hard-plus-ready\napp\tlibreoffice-impress\tevaluator-checked"
      - path: C:\Users\User\Documents\helloworld_hard_plus\windows_impress_animation_transition\hard_plus_dependency_index.txt
        exact_text: 'primary_task=windows.impress.animation_transition

          linux_peer=linux.impress.add_dissolve_transition

          difficulty=hard-plus

          requires_multi_artifact_handoff=true

          oracle_receipt=hard_plus_oracle_receipt.txt'
      - path: C:\Users\User\Documents\helloworld_hard_plus\windows_impress_animation_transition\hard_plus_review_matrix.csv
        exact_text: 'check,owner,status

          linux_alignment,benchmark-ops,ready

          extra_artifacts,benchmark-ops,ready

          oracle_recheck,benchmark-ops,required'
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - libreoffice
  - impress
  - animation
  - transition
  - image
  - reorder
  - hard
  - single_app
  - evaluator_backed
  - hard-plus
  - multi_artifact_handoff
  - linux_plus
  difficulty: hard
  app_name: libreoffice-impress
  human_steps: 82
  description: 'Hard Impress task: reorder slides, fly-in animation on title, per-item animation on bullets, insert a positioned
    image, and apply fade transition on all slides.

    '
  hardness: hard-evaluable
  evaluation_standard: all retained hard requirements are covered by the main evaluator or supplemental checks
  linux_peer: linux.impress.add_dissolve_transition
  linux_peer_file: tasks/linux/impress_add_dissolve_transition_hard.yaml
  alignment_status: direct_plus_extra
  hard_plus_alignment: linux_peer_plus_extra_evaluator_checked_artifacts
  hard_plus_note: The Linux-aligned core task remains required; extra handoff/audit artifacts are also evaluator checked.
  oracle_model: windows_oracle
