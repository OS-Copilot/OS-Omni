task_id: windows.deltachat.send_message_project_updates
platform: windows
instruction: >-
  Open the Delta Chat conversation "Project Updates" and send the message:
  "Project Updates Now Me: Weekly sync moved to Friday 3 PM".
init:
  initializer_id: initializers.windows.deltachat:DeltaChatSendMessageInitializer
  params:
    api_base_url: "http://127.0.0.1:8081"
    profile_archive_path: "files/deltachat/profile.zip"
    purge_greenmail: true
    allow_missing_greenmail: false
    seed_sender_email: "benchrecv@example.test"
    seed_sender_password: "benchpass"
    seed_recipient_email: "benchsender@example.test"
    seed_subject: "Seed existing chat"
    seed_body: "seed_existing_chat_message"
    seed_smtp_host: "127.0.0.1"
    seed_smtp_port: 3025
    wait_ms: 2000
evaluation:
  evaluator_id: evaluators.windows.deltachat_send_message:DeltaChatSendMessageEvaluator
  params:
    api_base_url: "http://127.0.0.1:8081"
    allow_missing_greenmail: false
    recipient_email: "benchrecv@example.test"
    body: "Project Updates Now Me: Weekly sync moved to Friday 3 PM"
    mailbox: "INBOX"
    timeout_seconds: 30
    poll_interval_seconds: 1
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [chat, deltachat, windows, benchmark, easy]
  difficulty: easy
  app: "Delta Chat"
  description: "Send a fixed message in the Project Updates chat and validate delivery via GreenMail."
