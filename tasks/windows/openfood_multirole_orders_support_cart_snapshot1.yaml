  Fun and explicitly selecting No coupon. Under Admin Desk's admin account, that latest order with no
  special notes should likewise progress from Preparing through Out for delivery to Delivered. Lucas Lin's
  support tickets should include a new Open ticket with the subject `Recent order check` and message `Check
  latest total`. His final cart should come from Santana Row Banh Mi Market No. 12 San Jose CA, found
  with the `banh mi` search, Vietnamese cuisine filter, and Lowest delivery fee sort; it should contain
  2 Golden San Jose Pho Tai Rice and 2 Golden San Jose Pho Tai Soup with No coupon, and remain visible
  without placing another order.
