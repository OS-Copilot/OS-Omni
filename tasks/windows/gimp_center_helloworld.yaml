task_id: windows.gimp.center_helloworld
platform: windows
instruction: In GIMP, create a new default image. Add the text "Helloworld" and center it on the canvas. Export the finished image to C:\Users\User\Downloads\gimp_center_helloworld.png, and leave the finished image open.
init:
  initializer_id: initializers.windows.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_powershell
      script: "$ErrorActionPreference = \"Stop\"\n\nGet-Process \"gimp-2.10\" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue\nStart-Sleep -Milliseconds 500\n\n$gimpConfigPaths = @(\n  (Join-Path $env:APPDATA \"GIMP\"),\n  (Join-Path $env:LOCALAPPDATA \"GIMP\"),\n  (Join-Path $env:USERPROFILE \".gimp-2.10\")\n)\nforeach ($path in $gimpConfigPaths) {\n  if ($path -and (Test-Path $path)) {\n    Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue\n  }\n}\n\n$exportPath = \"C:\\Users\\User\\Downloads\\gimp_center_helloworld.png\"\n$exportPathAlt = \"$exportPath.png\"\nforeach ($path in @($exportPath, $exportPathAlt)) {\n  if (Test-Path $path) {\n    Remove-Item -LiteralPath $path -Force -ErrorAction SilentlyContinue\n  }\n}\n\n$gimpExe = \"C:\\Program Files\\GIMP 2\\bin\\gimp-2.10.exe\"\nif (-not (Test-Path $gimpExe)) {\n  throw \"GIMP executable not found: $gimpExe\"\n}\n\nStart-Process -FilePath $gimpExe -WindowStyle Maximized | Out-Null\n"
      timeout: 20
    - type: wait
      ms: 10000
    - type: run_powershell
      script: "$ErrorActionPreference = \"Stop\"\n\nAdd-Type -AssemblyName Microsoft.VisualBasic\nAdd-Type @\"\nusing System;\nusing System.Runtime.InteropServices;\npublic static class User32 {\n  [DllImport(\"user32.dll\")]\n  public static extern bool ShowWindowAsync(IntPtr hWnd, int nCmdShow);\n  [DllImport(\"user32.dll\")]\n  public static extern bool SetForegroundWindow(IntPtr hWnd);\n}\n\"@\n\n$proc = $null\nfor ($i = 0; $i -lt 30; $i++) {\n  $proc = Get-Process \"gimp-2.10\" -ErrorAction SilentlyContinue |\n    Where-Object { $_.MainWindowHandle -ne 0 } |\n    Select-Object -First 1\n  if ($null -ne $proc) {\n    break\n  }\n  Start-Sleep -Milliseconds 500\n}\n\nif ($null -eq $proc) {\n  throw \"Could not find a visible GIMP main window\"\n}\n\n[void][User32]::ShowWindowAsync($proc.MainWindowHandle, 3)\nStart-Sleep -Milliseconds 300\n[void][Microsoft.VisualBasic.Interaction]::AppActivate($proc.Id)\nStart-Sleep -Milliseconds 300\n[void][User32]::SetForegroundWindow($proc.MainWindowHandle)\n"
      timeout: 20
      optional: true
    - type: run_powershell
      script: 'py -3 -W ignore -c "import pyautogui,time; time.sleep(0.5); pyautogui.press(''esc''); time.sleep(0.2); pyautogui.press(''esc'')"

        '
      timeout: 15
      optional: true
    - type: run_powershell
      script: "$ErrorActionPreference = \"Stop\"\n\nAdd-Type -AssemblyName Microsoft.VisualBasic\nAdd-Type -AssemblyName System.Windows.Forms\nAdd-Type @\"\nusing System;\nusing System.Runtime.InteropServices;\npublic static class User32 {\n  [DllImport(\"user32.dll\")]\n  public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow);\n  [DllImport(\"user32.dll\")]\n  public static extern bool SetForegroundWindow(IntPtr hWnd);\n  [DllImport(\"user32.dll\")]\n  public static extern bool MoveWindow(IntPtr hWnd, int X, int Y, int nWidth, int nHeight, bool bRepaint);\n}\n\"@\n\n$gimpProc = $null\nfor ($i = 0; $i -lt 20; $i++) {\n  $gimpProc = Get-Process \"gimp-2.10\" -ErrorAction SilentlyContinue |\n    Where-Object { $_.MainWindowHandle -ne 0 } |\n    Select-Object -First 1\n  if ($null -ne $gimpProc) {\n    break\n  }\n  Start-Sleep -Milliseconds 500\n}\n\nif ($null -eq $gimpProc) {\n  throw \"Could not refocus the GIMP window\"\n}\n\nGet-Process -ErrorAction SilentlyContinue |\n  Where-Object\
        \ {\n    $_.MainWindowHandle -ne 0 -and\n    $_.Id -ne $gimpProc.Id -and\n    ($_.ProcessName -in @(\"WindowsTerminal\", \"powershell\", \"pwsh\", \"cmd\", \"notepad\"))\n  } |\n  ForEach-Object {\n    [void][User32]::ShowWindow($_.MainWindowHandle, 6)\n  }\n\n$workingArea = [System.Windows.Forms.Screen]::PrimaryScreen.WorkingArea\n[void][User32]::MoveWindow(\n  $gimpProc.MainWindowHandle,\n  $workingArea.X,\n  $workingArea.Y,\n  $workingArea.Width,\n  $workingArea.Height,\n  $true\n)\nStart-Sleep -Milliseconds 200\n[void][User32]::ShowWindow($gimpProc.MainWindowHandle, 9)\nStart-Sleep -Milliseconds 200\n[void][Microsoft.VisualBasic.Interaction]::AppActivate($gimpProc.Id)\nStart-Sleep -Milliseconds 300\n[void][User32]::SetForegroundWindow($gimpProc.MainWindowHandle)\nStart-Sleep -Milliseconds 300\n[System.Windows.Forms.SendKeys]::SendWait(\"% \")\nStart-Sleep -Milliseconds 200\n[System.Windows.Forms.SendKeys]::SendWait(\"x\")\nStart-Sleep -Milliseconds 300\n[void][User32]::ShowWindow($gimpProc.MainWindowHandle,\
        \ 3)\n"
      timeout: 20
      optional: true
    - type: wait
      ms: 2000
evaluation:
  evaluator_id: evaluators.windows.gimp:GimpEvaluator
  params:
    check_id: gimp_center_helloworld
    timeout: 120
    stdout_contains: EVAL_RESULT:PASS
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - gimp
  - image
  - text
  - center
  - easy
  difficulty: easy
  app: GIMP
  description: 'Launch GIMP, create a new image, add the text Helloworld, center it on the canvas, then export the image to PNG for OCR-based evaluation.

    '
