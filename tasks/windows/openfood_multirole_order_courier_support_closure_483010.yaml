instruction: |-
  Execute a multi-role business workflow in OpenFood that concludes with the Noah Park - Merchant account active on the Merchant view.

  The customer account must hold the claimed voucher code LUNCH5 in the Wallet Coupons area. The first order, placed from the Santana Row Banh Mi Market No. 12 San Jose CA menu after searching for banh mi, filtering by Vietnamese cuisine, and sorting by Fastest, must contain two Golden San Jose Pho Tai Rice, two Golden San Jose Pho Tai Soup, and one Golden San Jose Pho Tai Snack, with the LUNCH5 - $5 off orders over $15 coupon applied. The second order, created via the Reorder function from the latest Santana Row Banh Mi Market No. 12 San Jose CA order in the Orders view, must contain one Golden San Jose Pho Tai Rice, one Golden San Jose Pho Tai Soup, and two Golden San Jose Pho Tai Snack, with No coupon selected.

  The Noah Park - Merchant account must reflect the Golden San Jose Pho Tai Snack as unavailable at Santana Row Banh Mi Market No. 12 San Jose CA. The first Santana Row Banh Mi Market No. 12 San Jose CA order must have its status advanced from Preparing to Out for delivery. The second, no-coupon reorder must also have its status advanced from Preparing to Out for delivery. The following menu items must be marked as unavailable: Pork Dumplings, Beef Chow Fun, and Mapo Tofu at Dumpling Room No. 20 San Jose CA, and Golden San Jose Pho Tai Rice and Golden San Jose Pho Tai Soup at Santana Row Banh Mi Market No. 12 San Jose CA. The restaurants Dumpling Room No. 20 San Jose CA, Santana Row Banh Mi Market No. 12 San Jose CA, and Golden Curry Garden No. 35 San Jose CA must be marked as closed.

  The Ava Chen - Courier account must show the route for delivery D-333 - Station Queens Dumpling No. 33 New York City NY as accepted with its status advanced once. The Lucas Lin - Customer account must contain a new support ticket with the subject Delivery follow-up and the message Confirm delivery.
