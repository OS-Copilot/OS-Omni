task_id: windows.calendar.create_recurring_event
platform: windows
instruction: 'Please open Thunderbird and switch to the Calendar tab. Create a recurring event called "Weekly Release Triage"
  every Tuesday starting next Tuesday at 9:15 AM for 45 minutes with a reminder 15 minutes before the event. Also create "QA
  Sign-off" for next Thursday at 11:00 AM for 30 minutes and "Launch Readiness Review" for next Friday at 4:00 PM for 1 hour.
  Save everything when finished.

  '
