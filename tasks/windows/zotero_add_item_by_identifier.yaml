task_id: windows.zotero.add_item_by_identifier
platform: windows
instruction: In Zotero, use the "Add Item by Identifier" feature (the magic wand icon in the toolbar) to add a new item by entering the DOI "10.1038/nature14539". Confirm the lookup and verify the new entry appears in My Library.
init:
  initializer_id: initializers.windows.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_powershell
      script: "$zoteroExe = \"C:\\Program Files\\Zotero\\zotero.exe\"\nif (-not (Test-Path $zoteroExe)) {\n  $zoteroExe = \"$env:LOCALAPPDATA\\Zotero\\zotero.exe\"\n}\nif (Test-Path $zoteroExe) {\n  Start-Process -FilePath $zoteroExe\n  Write-Output \"INIT_OK\"\n} else {\n  Write-Error \"Zotero not installed\"\n}\n"
      timeout: 30
    - type: wait
      ms: 8000
evaluation:
  evaluator_id: evaluators.windows.zotero:ZoteroEvaluator
  params:
    check_id: zotero_add_item_by_identifier
    stdout_contains: EVAL_RESULT:PASS
    timeout: 30
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - zotero
  - add_item
  - doi
  - easy
  difficulty: easy
  app_name: zotero
  human_steps: 3
  description: 'Easy Zotero task: add a single bibliographic item via DOI identifier. Evaluation queries the Zotero SQLite database for the DOI string.

    '
