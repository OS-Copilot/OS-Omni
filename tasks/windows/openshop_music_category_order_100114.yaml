instruction: |-
  Sign in to the OpenShop account using the password spring2026 with the keyboard layout set to ENG, and complete three separate orders in the Music category, each followed by a product review.

  The first order must contain the Acoustic Row Portable Mini Mixer and the ChordLab USB Ukulele Starter Kit, both with the Gift Set specification selected. The quantity of the Acoustic Row Portable Mini Mixer must be 2. The Order Note field on the checkout page must contain StudioWaveOne. After this order is placed, a review for the Acoustic Row Portable Mini Mixer must be submitted with a 4 out of 5 star rating and the review text MixerRunsClean.

  The second order must contain the PulseTone Practice MIDI Keyboard Controller and the StudioNote Compact Metronome, both with the Gift Set specification selected. The quantity of the PulseTone Practice MIDI Keyboard Controller must be 2. The Order Note field on the checkout page must contain StudioWaveTwo. After this order is placed, a review for the PulseTone Practice MIDI Keyboard Controller must be submitted with a 3 out of 5 star rating and the review text KeysFeelSmooth.

  The third order must contain the Acoustic Row Beginner Sheet Music Stand and the ChordLab Studio Practice Headphones, both with the Gift Set specification selected. The quantity of both the Acoustic Row Beginner Sheet Music Stand and the ChordLab Studio Practice Headphones must be 2. The checkout must use the Home delivery address and Cash on Delivery as the payment method. The Order Note field must contain StudioWaveThree. After this order is placed, a review for the Acoustic Row Beginner Sheet Music Stand must be submitted with a 4 out of 5 star rating and the review text StandHoldsPages.

  At completion, all three orders must be placed, all three reviews must be submitted, and the account must remain signed in.
