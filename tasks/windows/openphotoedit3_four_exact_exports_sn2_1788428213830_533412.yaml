instruction: Import four specific images from the Pictures folder into the photo editor, apply the designated
  adjustment sequences to each, and export the results as four distinct files. The first image, identified
  by the filename pe3_forest_longhair_portrait.png and depicting a woman with long brown hair facing the
  camera in a khaki jacket within a green forest, must be edited with Smooth set to 7, Whiten to 3, Rosy
  to 4, Bright Eyes to 6, and Background Blur to 9 in the Portrait tab; Green set to -10 and Yellow to
  -5 in the HSL tab; Exposure set to 4, Contrast to 6, and Sharpen to 7 in the Edit tab; and the Portrait
  preset selected with a Strength of 22 in the Filters tab, then downloaded as pe3_forest_longhair_portrait-edited.png.
  The second image, identified by the filename pe3_concrete_shortcurl_portrait.png and depicting a woman
  with short black curly hair standing in front of a gray concrete wall, wearing a white sleeveless top
  and looking to the side, must be edited with Exposure set to 2, Brightness to 5, Temperature to -4,
  and Sharpen to 9 in the Edit tab; Smooth set to 5, Slim Face to 3, and Bright Eyes to 5 in the Portrait
  tab; the Cream preset selected with a Strength of 18 in the Filters tab; and Orange set to -5 and Red
  to 3 in the HSL tab, then downloaded as pe3_concrete_shortcurl_portrait-edited.png. The third image,
  identified by the filename pe3_forest_waterfall.png and depicting a multi-tiered white waterfall flowing
  over dark rocks and moss in a dense green forest, must be edited with Structure set to 16, Foliage to
  9, Cool Tone to 7, and HDR to 12 in the Scene tab; Green set to -8, Cyan to 6, and Blue to 4 in the
  HSL tab; Brightness set to 6, Contrast to 8, and Sharpen to 10 in the Edit tab; and the Clean preset
  selected with a Strength of 30 in the Filters tab, then downloaded as pe3_forest_waterfall-edited.png.
  The fourth image, identified by the filename pe3_snow_lake_mountain.png and depicting a twin-peaked
  snow mountain under a golden sunset, with a deep green forest and a complete reflection in a lake, must
  be edited with Sky set to 13, Structure to 12, Foliage to 5, Warm Sun to 10, and HDR to 11 in the Scene
  tab; Yellow set to -8, Green to -9, and Blue to 5 in the HSL tab; and Saturation set to -7 and Contrast
  to -4 in the Edit tab, then downloaded as pe3_snow_lake_mountain-edited.png. The application state must
  remain on the editing page for the final image, pe3_snow_lake_mountain.png, upon completion.
