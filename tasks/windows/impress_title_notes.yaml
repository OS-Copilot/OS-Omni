task_id: windows.impress.title_notes
platform: windows
instruction: A presentation is open in LibreOffice Impress. Change the title on slide 1 from "Kickoff" to "Project Kickoff Meeting". Add a speaker note on slide 2 with the text "Remember to demo the live system" Save when done.
init:
  initializer_id: initializers.windows.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_powershell
      script: "py -3 -W ignore -c \"\nimport os, subprocess, sys\ntry:\n    from pptx import Presentation\nexcept ImportError:\n    subprocess.check_call([sys.executable, '-m', 'pip', 'install', 'python-pptx', '-q'])\n    from pptx import Presentation\n\nout_path = os.path.join(os.environ['USERPROFILE'], 'Downloads', 'kickoff.pptx')\nprs = Presentation()\ns1 = prs.slides.add_slide(prs.slide_layouts[0])\ns1.shapes.title.text = 'Kickoff'\ns1.placeholders[1].text = 'Q2 2025 Planning Session'\n\ns2 = prs.slides.add_slide(prs.slide_layouts[1])\ns2.shapes.title.text = 'Agenda'\ns2.placeholders[1].text = '1. Introductions\\n2. Goals\\n3. Timeline\\n4. Q&A'\n\nprs.save(out_path)\nprint('INIT_OK')\n\"\n"
      timeout: 120
    - type: run_powershell
      script: "$pptPath = Join-Path $env:USERPROFILE \"Downloads\\kickoff.pptx\"\n$candidates = @(\n  \"C:\\Program Files\\LibreOffice\\program\\simpress.exe\",\n  \"C:\\Program Files\\LibreOffice\\program\\soffice.exe\",\n  \"C:\\Program Files (x86)\\LibreOffice\\program\\simpress.exe\",\n  \"C:\\Program Files (x86)\\LibreOffice\\program\\soffice.exe\"\n)\n$exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1\nif (-not $exe) { throw \"LibreOffice Impress not found\" }\nif ($exe -like \"*\\soffice.exe\") {\n  Start-Process -FilePath $exe -ArgumentList @(\"--impress\", $pptPath)\n} else {\n  Start-Process -FilePath $exe -ArgumentList @($pptPath)\n}\n"
      timeout: 120
    - type: wait
      ms: 5000
evaluation:
  evaluator_id: evaluators.windows.libreoffice_impress:LibreOfficeImpressEvaluator
  params:
    check_id: impress_title_notes
    stdout_contains: EVAL_RESULT:PASS
    timeout: 120
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - libreoffice
  - impress
  - title
  - notes
  - easy
  difficulty: easy
  app_name: libreoffice-impress
  human_steps: 9
  description: 'Easy Impress task: change slide 1 title, add speaker notes on slide 2. 5 eval checks.

    '
