platform: windows
instruction: Create a new Rider account in the OpenDriver application and complete a sequence of ride
  selections, support ticket creations, and account inspections before logging out. The new account must
  be established by selecting the Rider account tab on the login screen and entering the name Scan Rider,
  the email address scan.rider@example.com, and the password Pass123!. The ride workflow requires selecting
  the destination Downtown Palo Alto, CA from the Ride tab, choosing a ride, and selecting the RideX option
  while ensuring the Promo code field is completely empty; this specific configuration must be confirmed
  to display the quote, with any order completion prompt dismissed by selecting Done. This ride selection
  process must be repeated multiple times, including after navigating to the Active tab to select Request
  a ride, after visiting the History tab to open the Ride history page and interact with the central list
  area, and after inspecting various account subpages. The Safety and support section must contain two
  distinct support tickets created by entering the exact text I need help with my ride. in the Message
  text box and selecting Create support ticket, followed by entering the exact text Follow up on my ride.
  in the Message text box and selecting Create support ticket again, with the open ticket list area remaining
  visible on the Safety page. The Account tab must be used to interact with the Scan Rider account information
  area, select the Edit profile entry, and subsequently view the Wallet, Coupons, Notifications, and Saved
  places entries, returning to the main Account tab after each inspection. The final state of the application
  must be the logged-out OpenDriver login/create-account page with no active Rider session controls visible,
  achieved by selecting the exit icon in the top-left corner of the window after ensuring the final business
  page is the Scan Rider account page.
