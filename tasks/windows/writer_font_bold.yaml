task_id: windows.writer.font_bold
platform: windows
instruction: A company announcement is open in LibreOffice Writer. Make the title "Company Announcement" size 24 and bold, then save when done.
init:
  initializer_id: initializers.windows.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_powershell
      script: "py -3 -W ignore -c \"\nimport os, subprocess, sys\ntry:\n    from docx import Document\nexcept ImportError:\n    subprocess.check_call([sys.executable, '-m', 'pip', 'install', 'python-docx', '-q'])\n    from docx import Document\n\nout_path = os.path.join(os.environ['USERPROFILE'], 'Downloads', 'announcement.docx')\ndoc = Document()\ndoc.add_paragraph('Company Announcement')\ndoc.add_paragraph('We are pleased to announce that our company has been recognized as one of the top employers in the region for the third consecutive year.')\ndoc.add_paragraph('This achievement reflects our ongoing commitment to creating a supportive and innovative workplace for all employees.')\ndoc.save(out_path)\nprint('INIT_OK')\n\"\n"
      timeout: 120
    - type: run_powershell
      script: "$docPath = Join-Path $env:USERPROFILE \"Downloads\\announcement.docx\"\nif (-not (Test-Path $docPath)) { throw \"Document not found: $docPath\" }\n$proc = Start-Process -FilePath $docPath -PassThru\nStart-Sleep -Seconds 2\ntry {\n  $wshell = New-Object -ComObject WScript.Shell\n  $null = $wshell.AppActivate($proc.Id)\n} catch {}\n"
      timeout: 120
    - type: wait
      ms: 8000
evaluation:
  evaluator_id: evaluators.windows.libreoffice_writer:LibreOfficeWriterEvaluator
  params:
    check_id: writer_font_bold
    stdout_contains: EVAL_RESULT:PASS
    timeout: 120
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - libreoffice
  - writer
  - font
  - alignment
  - easy
  difficulty: easy
  app_name: libreoffice-writer
  human_steps: 7
  description: 'Easy Writer task: make the title bold and 24 pt without damaging the body text.

    '
