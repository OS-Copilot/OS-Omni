instruction: Configure the OpenBank application so that the Security section displays the Low balance
  alert with an Amount of “250” and the Text checkbox unchecked without saving changes to that specific
  alert, marks the “New sign-in from macOS” and “Upcoming bill” alerts as read, locks both the “Everyday
  Checking debit card” and the “OpenBank Rewards Card”, saves the Large purchase alert with an Amount
  of “185.00” and the Push checkbox selected, saves the Payment due alert with both the Text and Push
  checkboxes selected, and saves the Direct deposit posted alert with both the On and Text checkboxes
  selected. Set the Statements section delivery method for the Everyday Checking account to “Use paper”,
  for the Rainy Day Savings account to “Go paperless”, and for the OpenBank Rewards Card to “Use paper”,
  and download the statement for the account “Rainy Day Savings ...9140” for the month “2026-04”, the
  statement for the account “OpenBank Rewards Card ...7712” for the month “2026-03”, and the statement
  for the account “Everyday Checking ...2381” for the month “2026-05”. Create four new recipients in the
  Transfers section with the details Name “Mateo Ruiz”, Nickname “Landscape”, Bank “Summit Union”, Routing
  number “322281507”, and Account number “6139028475”; Name “Grace Liu”, Nickname “Photo studio”, Bank
  “Evergreen Bank”, Routing number “091000019”, and Account number “4827613905”; Name “Owen Price”, Nickname
  “Print vendor”, Bank “Puget Bank”, Routing number “125000024”, and Account number “7301482694”; and
  Name “Sofia Marin”, Nickname “Workshop”, Bank “Blue Ridge”, Routing number “256074974”, and Account
  number “5193076428”, saving each recipient after entry. Submit a new transfer from “Rainy Day Savings
  ...9140” to “Mateo Ruiz” for an Amount of “58.90” on the date “2026-06-05” with the Memo “T2 landscape”.
  Schedule a payment in the Pay & transfer section with the Biller “OpenBank Rewards Card - $682.45”,
  the From account “Rainy Day Savings ...9140”, an Amount of “340.25”, a Date of “2026-06-12”, and a Memo
  of “T2 card”.
