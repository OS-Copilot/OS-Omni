  62, Y 0, Z 46 degrees. Set or create FillLight, move FillLight to X 1.8, Y -3.2, Z 6.5, rotate FillLight to X 48, Y 0, Z
  28 degrees, scale FillLight to X 1.2, Y 1.2, Z 1.2. After saving the primary scene, create ten separate Blender delivery
