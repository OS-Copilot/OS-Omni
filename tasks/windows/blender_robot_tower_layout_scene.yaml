task_id: windows.blender.robot_tower_layout_scene
platform: windows
instruction: 'In Blender, product_stage.blend is already open. Build the Linux-style social render delivery, but make the
  Windows version harder by producing an eleven-file multi-blend dependency network. First update and save the primary scene
  as C:\Users\User\Documents\blender_tasks\blender_social_render\product_stage.blend: set product_stage.blend render resolution
  to 1800 by 1000 at 100 percent scale, set FPS to 30, set the frame range to start at 24 and end at 240, set the output path
  to //renders/social_preview_final.png. Apply the primary scene object changes one by one using explicit X, Y, and Z values:
  Set or create FeatureCube, move FeatureCube to X 0.8, Y -0.6, Z 1.25, rotate FeatureCube to X 8, Y 0, Z 22 degrees, scale
  FeatureCube to X 1.15, Y 0.9, Z 1.35, set FeatureCube diffuse material RGB to 0.92, 0.34, 0.18. Set or create AccentCylinder,
  move AccentCylinder to X -1.6, Y 1.2, Z 1.35, rotate AccentCylinder to X 6, Y 0, Z -18 degrees, scale AccentCylinder to
  X 0.7, Y 0.7, Z 1.45, set AccentCylinder diffuse material RGB to 0.1, 0.42, 0.82. Set or create HeroSphere, move HeroSphere
  to X 2.6, Y 1.9, Z 1.15, rotate HeroSphere to X 12, Y 0, Z 35 degrees, scale HeroSphere to X 1.05, Y 0.95, Z 1.1, set HeroSphere
  diffuse material RGB to 0.15, 0.78, 0.62. Set or create BackdropPlane, move BackdropPlane to X 0.2, Y 0.1, Z -0.05, rotate
  BackdropPlane to X 2, Y -1, Z 6 degrees, scale BackdropPlane to X 6.2, Y 4.8, Z 1.0, set BackdropPlane diffuse material
  RGB to 0.08, 0.08, 0.1. Set or create TrackingMarker, move TrackingMarker to X -2.4, Y -1.8, Z 0.35, rotate TrackingMarker
  to X 0, Y 0, Z 15 degrees, scale TrackingMarker to X 0.28, Y 0.28, Z 0.7, set TrackingMarker diffuse material RGB to 1,
  1, 1. Set or create FrameGuide, move FrameGuide to X -0.9, Y 2.6, Z 0.02, rotate FrameGuide to X 0, Y 0, Z -12 degrees,
  scale FrameGuide to X 1.8, Y 0.35, Z 1.0, set FrameGuide diffuse material RGB to 0.35, 0.35, 0.9. Set or create CaptionBar,
  move CaptionBar to X 1.4, Y -2.4, Z 0.04, rotate CaptionBar to X 0, Y 0, Z 9 degrees, scale CaptionBar to X 2.2, Y 0.22,
  Z 1.0, set CaptionBar diffuse material RGB to 0.96, 0.96, 0.18. Set or create HeroPin, move HeroPin to X 2.15, Y 0.15, Z
  0.62, rotate HeroPin to X 4, Y 0, Z -18 degrees, scale HeroPin to X 0.18, Y 0.18, Z 0.18, set HeroPin diffuse material RGB
  to 1, 0.2, 0.45. Set or create SignalTower, move SignalTower to X -3.1, Y 0.9, Z 0.85, rotate SignalTower to X 0, Y 0, Z
  31 degrees, scale SignalTower to X 0.16, Y 0.16, Z 1.55, set SignalTower diffuse material RGB to 0.25, 0.95, 0.78. Set or
  create ProductShadow, move ProductShadow to X 0.95, Y -0.55, Z 0.01, rotate ProductShadow to X 0, Y 0, Z 22 degrees, scale
  ProductShadow to X 1.45, Y 0.72, Z 1.0, set ProductShadow diffuse material RGB to 0.02, 0.02, 0.03. Set or create CornerAnchor,
  move CornerAnchor to X -3.05, Y 2.35, Z 0.22, rotate CornerAnchor to X 0, Y 0, Z -28 degrees, scale CornerAnchor to X 0.34,
  Y 0.34, Z 0.44, set CornerAnchor diffuse material RGB to 0.88, 0.18, 0.88. Set or create BadgeSphere, move BadgeSphere to
  X 3.05, Y -1.35, Z 0.55, rotate BadgeSphere to X 6, Y 0, Z 24 degrees, scale BadgeSphere to X 0.24, Y 0.24, Z 0.24, set
  BadgeSphere diffuse material RGB to 0.18, 0.42, 1.0. Set or create EdgeFrame, move EdgeFrame to X -3.4, Y -2.25, Z 0.18,
  rotate EdgeFrame to X 0, Y 0, Z 6 degrees, scale EdgeFrame to X 1.8, Y 0.12, Z 0.36, set EdgeFrame diffuse material RGB
  to 0.98, 0.58, 0.12. Set or create CTAChip, move CTAChip to X 2.85, Y 2.25, Z 0.28, rotate CTAChip to X 0, Y 0, Z -30 degrees,
  scale CTAChip to X 0.32, Y 0.32, Z 0.14, set CTAChip diffuse material RGB to 0.05, 0.85, 0.32. Set or create TopRule, move
  TopRule to X 0.25, Y 3.35, Z 0.06, rotate TopRule to X 0, Y 0, Z 4 degrees, scale TopRule to X 2.8, Y 0.1, Z 1.0, set TopRule
  diffuse material RGB to 0.88, 0.88, 0.88. Set or create ReviewTab, move ReviewTab to X -1.85, Y -3.05, Z 0.24, rotate ReviewTab
  to X 0, Y 0, Z -9 degrees, scale ReviewTab to X 0.72, Y 0.16, Z 0.3, set ReviewTab diffuse material RGB to 0.12, 0.7, 0.95.
  Set or create ProofDot, move ProofDot to X 3.45, Y 0.95, Z 0.48, rotate ProofDot to X 0, Y 0, Z 11 degrees, scale ProofDot
