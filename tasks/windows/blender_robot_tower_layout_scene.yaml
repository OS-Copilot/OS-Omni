init:
  initializer_id: initializers.windows.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_powershell
      script: "$ErrorActionPreference = \"Stop\"\nGet-Process blender -ErrorAction SilentlyContinue | Stop-Process -Force\
        \ -ErrorAction SilentlyContinue\nStart-Sleep -Seconds 1\n$workspace = \"C:\\Users\\User\\Documents\\blender_tasks\\\
        blender_social_render\"\nNew-Item -ItemType Directory -Force -Path $workspace | Out-Null\nGet-ChildItem -LiteralPath\
        \ $workspace -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue\n$blenderExeCandidates\
        \ = @(\n  \"C:\\Tools\\Blender279b\\blender-2.79b-windows64\\blender.exe\",\n  \"C:\\Program Files\\Blender Foundation\\\
        Blender 2.79\\blender.exe\",\n  \"C:\\Program Files\\Blender Foundation\\Blender\\blender.exe\",\n  \"$env:LOCALAPPDATA\\\
        Programs\\Blender Foundation\\Blender\\blender.exe\"\n)\n$blenderExe = $blenderExeCandidates | Where-Object { Test-Path\
        \ $_ } | Select-Object -First 1\nif (-not $blenderExe) {\n  $cmd = Get-Command blender.exe -ErrorAction SilentlyContinue\n\
        \  if ($cmd) { $blenderExe = $cmd.Source }\n}\nif (-not $blenderExe -or -not (Test-Path $blenderExe)) { throw \"Blender\
        \ executable not found\" }\n$prepareScript = Join-Path $env:TEMP \"hw_prepare_blender_robot_tower_layout_scene.py\"\
        \n$prepare = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(\"\"\
        ))\nSet-Content -LiteralPath $prepareScript -Encoding UTF8 -Value $prepare\n$env:HW_BLENDER_WORKSPACE = $workspace\n\
        & $blenderExe --background --factory-startup --python $prepareScript | Out-String | Write-Output\nif ($LASTEXITCODE\
        \ -ne 0) { throw \"Failed to create baseline Blender scene\" }\nStart-Process -FilePath $blenderExe -ArgumentList\
        \ @((Join-Path $workspace \"product_stage.blend\"))\n"
      timeout: 60
    - type: wait
      ms: 12000
evaluation:
  evaluator_id: evaluators.windows.blender:BlenderEvaluator
  params:
    check_id: blender_robot_tower_layout_scene
    stdout_contains: EVAL_RESULT:PASS
    timeout: 90
    supplemental_checks:
      files:
      - path: C:\Users\User\Documents\helloworld_hard_plus\windows_blender_robot_tower_layout_scene\hard_plus_handoff.tsv
        exact_text: "task_id\tlinux_peer\tstatus\nwindows.blender.robot_tower_layout_scene\tlinux.blender.prepare_social_render\t\
          hard-plus-ready\napp\tblender\tevaluator-checked"
      - path: C:\Users\User\Documents\helloworld_hard_plus\windows_blender_robot_tower_layout_scene\hard_plus_dependency_index.txt
        exact_text: 'primary_task=windows.blender.robot_tower_layout_scene

          linux_peer=linux.blender.prepare_social_render

          difficulty=hard-plus

          requires_multi_artifact_handoff=true

          oracle_receipt=hard_plus_oracle_receipt.txt'
      - path: C:\Users\User\Documents\helloworld_hard_plus\windows_blender_robot_tower_layout_scene\hard_plus_review_matrix.csv
        exact_text: 'check,owner,status

          linux_alignment,benchmark-ops,ready

          extra_artifacts,benchmark-ops,ready

          oracle_recheck,benchmark-ops,required'
      powershell:
      - label: no_notepad_process
        script: '$p = Get-Process -Name notepad -ErrorAction SilentlyContinue

          if ($p) { Write-Output ''NOTEPAD_RUNNING''; exit 1 }

          Write-Output ''NO_NOTEPAD_PROCESS'''
        stdout_contains: NO_NOTEPAD_PROCESS
        expected_exit_code: 0
        timeout: 10
