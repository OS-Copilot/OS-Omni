  In archive, adjust Camera, move Camera to X 9.2, Y -8.6, Z 6.4, rotate Camera to X 58, Y 0, Z 50 degrees. In archive, adjust
  BackdropPlane, scale BackdropPlane to X 7.2, Y 5.4, Z 1.0. In archive, adjust TopRule, move TopRule to X 0.1, Y 3.55, Z
  0.06. Delivery file 3: save C:\Users\User\Documents\blender_tasks\blender_social_render\social_story_crop.blend; set story
  render resolution to 1080 by 1920 at 100 percent scale, set the frame range to start at 72 and end at 168, set the output
