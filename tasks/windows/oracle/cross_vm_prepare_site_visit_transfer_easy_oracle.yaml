task_id: windows.oracle.cross_vm.prepare_site_visit_transfer_easy
platform: windows
instruction: >
  Oracle sanity task for windows.cross_vm.prepare_site_visit_transfer_easy. The
  initializer already prepares the expected transfer file. Wait briefly and finish.
init:
  initializer_id: initializers.windows.setup:DesktopSetupInitializer
  params:
    steps:
      - type: run_powershell
        script: |
          Get-Process notepad -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $targetPath = Join-Path $env:USERPROFILE "Desktop\site_visit_transfer.txt"
          @'
          Northwind Site Visit
          Confirm loading dock access at 08:30
          Bring revised safety checklist
          Share the updated visitor badge count: 14
          '@ | Set-Content -Path $targetPath -Encoding UTF8
        timeout: 30
evaluation:
  evaluator_id: evaluators.windows.powershell_check:PowerShellCheckEvaluator
  params:
    timeout: 30
    stdout_contains: EVAL_RESULT:PASS
    command: |
      $expected = @'
      Northwind Site Visit
      Confirm loading dock access at 08:30
      Bring revised safety checklist
      Share the updated visitor badge count: 14
      '@.Trim()
      $targetPath = Join-Path $env:USERPROFILE "Desktop\site_visit_transfer.txt"
      if (-not (Test-Path $targetPath)) {
        Write-Output "MISSING_FILE"
        exit 1
      }
      $actual = (Get-Content -Path $targetPath -Raw).Trim()
      if ($actual -ne $expected) {
        Write-Output "CONTENT_MISMATCH"
        exit 1
      }
      Write-Output "EVAL_RESULT:PASS"
limits:
  max_steps: 100
  step_timeout_seconds: 90
metadata:
  tags: [windows, cross_vm, oracle, easy]
  difficulty: easy
  oracle_for: windows.cross_vm.prepare_site_visit_transfer_easy
