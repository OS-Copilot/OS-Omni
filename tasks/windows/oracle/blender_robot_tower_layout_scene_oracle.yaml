task_id: windows.oracle.blender.robot_tower_layout_scene
platform: windows
instruction: >
  Oracle sanity check for windows.blender.robot_tower_layout_scene.

init:
  initializer_id: initializers.windows.setup:DesktopSetupInitializer
  params:
    steps:
      - type: run_powershell
        script: |
          $ErrorActionPreference = "Stop"
          Get-Process blender -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $blenderExeCandidates = @(
            "C:\Tools\Blender279b\blender-2.79b-windows64\blender.exe",
            "C:\Program Files\Blender Foundation\Blender 2.79\blender.exe",
            "C:\Program Files\Blender Foundation\Blender\blender.exe",
            "$env:LOCALAPPDATA\Programs\Blender Foundation\Blender\blender.exe"
          )
          $blenderExe = $blenderExeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $blenderExe) {
            $cmd = Get-Command blender.exe -ErrorAction SilentlyContinue
            if ($cmd) { $blenderExe = $cmd.Source }
          }
          if (-not $blenderExe) { throw "Blender executable not found" }
          $py = @'
          import bpy, math, os

          def material(name, color):
              mat = bpy.data.materials.new(name)
              mat.diffuse_color = color
              return mat

          mats = {
              "graphite": material("graphite", (0.08, 0.09, 0.10)),
              "deck_green": material("deck_green", (0.12, 0.44, 0.22)),
              "steel": material("steel", (0.55, 0.58, 0.62)),
              "hazard_orange": material("hazard_orange", (0.95, 0.45, 0.12)),
              "sensor_blue": material("sensor_blue", (0.12, 0.32, 0.95)),
              "signal_red": material("signal_red", (1.00, 0.08, 0.05)),
          }
          zones = {
              "FoundationDeck": "GROUND",
              "CoreBlock": "CORE",
              "LeftFoot": "CORE",
              "RightFoot": "CORE",
              "LowerMast": "CORE",
              "UpperMast": "CORE",
              "TopBeacon": "SIGNAL",
              "EastArm": "ARM",
              "WestArm": "ARM",
              "NorthBrace": "BRACE",
              "SouthBrace": "BRACE",
              "EastSensor": "SENSOR",
              "WestSensor": "SENSOR",
              "NorthLens": "SENSOR",
              "SouthLens": "SENSOR",
          }
          sources = {
              "FoundationDeck": "robot_base_module.blend",
              "CoreBlock": "robot_base_module.blend",
              "LeftFoot": "robot_base_module.blend",
              "RightFoot": "robot_base_module.blend",
              "LowerMast": "robot_mast_module.blend",
              "UpperMast": "robot_mast_module.blend",
              "TopBeacon": "robot_mast_module.blend",
              "EastArm": "robot_mast_module.blend",
              "WestArm": "robot_mast_module.blend",
              "NorthBrace": "robot_mast_module.blend",
              "SouthBrace": "robot_mast_module.blend",
              "EastSensor": "robot_sensor_module.blend",
              "WestSensor": "robot_sensor_module.blend",
              "NorthLens": "robot_sensor_module.blend",
              "SouthLens": "robot_sensor_module.blend",
          }

          def add_obj(name, primitive, loc, scale, mat_key, rz=0):
              if primitive == "cube":
                  bpy.ops.mesh.primitive_cube_add(location=loc)
              elif primitive == "plane":
                  bpy.ops.mesh.primitive_plane_add(location=loc)
              elif primitive == "cylinder":
                  bpy.ops.mesh.primitive_cylinder_add(vertices=32, location=loc)
              elif primitive == "uv_sphere":
                  bpy.ops.mesh.primitive_uv_sphere_add(segments=32, ring_count=16, location=loc)
              elif primitive == "cone":
                  bpy.ops.mesh.primitive_cone_add(vertices=32, location=loc)
              else:
                  raise ValueError(primitive)
              obj = bpy.context.object
              obj.name = name
              obj.scale = scale
              obj.rotation_euler[2] = math.radians(rz)
              obj.data.materials.append(mats[mat_key])
              obj["zone_code"] = zones[name]
              obj["source_blend"] = sources[name]
              return obj

          bpy.ops.object.select_all(action="SELECT")
          bpy.ops.object.delete()
          add_obj("FoundationDeck", "plane", (0, 0, -0.05), (5.0, 5.0, 1.0), "deck_green")
          add_obj("CoreBlock", "cube", (0, 0, 0.35), (1.2, 1.2, 0.35), "graphite")
          add_obj("LeftFoot", "cube", (-2.2, 0, 0.15), (0.5, 1.1, 0.15), "graphite")
          add_obj("RightFoot", "cube", (2.2, 0, 0.15), (0.5, 1.1, 0.15), "graphite")
          add_obj("LowerMast", "cylinder", (0, 0, 1.15), (0.32, 0.32, 1.1), "steel")
          add_obj("UpperMast", "cylinder", (0, 0, 2.55), (0.24, 0.24, 0.9), "steel")
          add_obj("TopBeacon", "cone", (0, 0, 3.6), (0.35, 0.35, 0.45), "signal_red")
          add_obj("EastArm", "cube", (1.35, 0, 2.8), (1.2, 0.15, 0.15), "hazard_orange")
          add_obj("WestArm", "cube", (-1.35, 0, 2.8), (1.2, 0.15, 0.15), "hazard_orange")
          add_obj("NorthBrace", "cube", (0, 1.05, 1.9), (0.12, 1.0, 0.12), "sensor_blue")
          add_obj("SouthBrace", "cube", (0, -1.05, 1.9), (0.12, 1.0, 0.12), "sensor_blue")
          add_obj("EastSensor", "uv_sphere", (2.75, 0, 2.8), (0.22, 0.22, 0.22), "sensor_blue")
          add_obj("WestSensor", "uv_sphere", (-2.75, 0, 2.8), (0.22, 0.22, 0.22), "sensor_blue")
          add_obj("NorthLens", "uv_sphere", (0, 2.15, 1.9), (0.18, 0.18, 0.18), "signal_red")
          add_obj("SouthLens", "uv_sphere", (0, -2.15, 1.9), (0.18, 0.18, 0.18), "signal_red")
          bpy.ops.object.camera_add(location=(0, -8, 4), rotation=(1.1, 0, 0))
          os.makedirs(r"C:\Users\User\Documents\blender_tasks", exist_ok=True)
          bpy.ops.wm.save_as_mainfile(filepath=r"C:\Users\User\Documents\blender_tasks\robot_tower_layout_scene.blend")
          '@
          $tmp = Join-Path $env:TEMP "blender_robot_tower_layout_scene_oracle.py"
          Set-Content -LiteralPath $tmp -Value $py -Encoding UTF8
          & $blenderExe --background --factory-startup --python $tmp
        timeout: 60

evaluation:
  evaluator_id: evaluators.windows.blender:BlenderEvaluator
  params:
    check_id: blender_robot_tower_layout_scene
    stdout_contains: EVAL_RESULT:PASS
    timeout: 45

limits:
  max_steps: 100
  step_timeout_seconds: 180

metadata:
  tags: [oracle, windows, blender]
  oracle_for: windows.blender.robot_tower_layout_scene
