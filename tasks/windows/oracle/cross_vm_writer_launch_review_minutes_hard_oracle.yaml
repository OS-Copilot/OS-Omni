task_id: windows.oracle.cross_vm.writer_launch_review_minutes_hard
platform: windows
instruction: Oracle sanity task for windows.cross_vm.writer_launch_review_minutes_hard. The initializer already prepares the
  expected Writer document with seven embedded tables. Wait briefly and finish.
init:
  initializer_id: initializers.windows.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_powershell
      script: "@'\nimport os, subprocess, sys\nfrom pathlib import Path\ntry:\n    from docx import Document\nexcept ImportError:\n\
        \    subprocess.check_call([sys.executable, '-m', 'pip', 'install', 'python-docx', '-q'])\n    from docx import Document\n\
        path = Path(os.environ['USERPROFILE']) / 'Documents' / 'launch_review_minutes.docx'\npath.parent.mkdir(parents=True,\
        \ exist_ok=True)\ndoc = Document()\nfor line in ['Launch Readiness Review', 'Attendees:', 'Maya Chen', 'Jordan Lee',\
        \ 'Priya Nair', 'Theo Martin', 'Action Items:', 'Confirm vendor staging access by Tuesday.', 'Send revised demo script\
        \ to the field team.', 'Lock the final travel roster at 18 people.', 'Owners:', 'Vendor staging: Jordan Lee', 'Demo\
        \ script: Priya Nair', 'Travel roster: Theo Martin', 'Decisions:', 'Keep the launch window on July 18.', 'Publish\
        \ the final checklist after the dry run.', 'Risks:', 'Vendor staging account owners are not final.', 'Demo recording\
        \ depends on the dry-run room audio.', 'Travel roster changes after Friday need director approval.', 'Next Checkpoint:',\
        \ 'Friday 09:30 readiness sync with launch leads.', 'Escalation Rules:', 'Escalate vendor access blockers to Maya\
        \ by 16:00.', 'Escalate travel roster conflicts to Theo before final approval.', 'Signoff:', 'Maya owns agenda confirmation.',\
        \ 'Jordan owns vendor staging proof.', 'Priya owns demo script delivery.', 'Audit Trail:', 'Transfer source: launch_review_transfer.txt',\
        \ 'Document owner: Maya Chen', 'Review status: Ready for director signoff.', 'Follow-up Schedule:', 'Monday 11:00\
        \ vendor access checkpoint.', 'Wednesday 15:30 demo-room audio validation.', 'Verification Notes:', 'QA packet reviewed\
        \ by Maya.', 'Director signoff packet due Friday 16:30.', 'Distribution List:', 'maya.chen@example.test', 'jordan.lee@example.test',\
        \ 'priya.nair@example.test', 'Readiness Metrics:', 'Open blockers: 2', 'Dry-run pass rate: 92%', 'Travel roster variance:\
        \ 1', 'Dependency Ledger:', 'Vendor access depends on security approval.', 'Demo script depends on field-team comments.',\
        \ 'Signoff packet depends on QA evidence.', 'Closeout Owners:', 'Security approval: Maya Chen', 'Field comments: Jordan\
        \ Lee', 'QA evidence: Priya Nair', 'Packet Checklist:', 'Include agenda confirmation.', 'Include vendor staging screenshot.',\
        \ 'Include dry-run audio proof.', 'Include travel roster export.', 'Director Questions:', 'Are vendor credentials\
        \ active for every reviewer?', 'Is the demo script frozen after field comments?', 'Is the travel variance approved\
        \ before lock?', 'Post-Launch Watch:', 'Monitor room audio for the first two sessions.', 'Monitor vendor login failures\
        \ for 24 hours.', 'Monitor travel exception requests through Monday.', 'Archive Routing:', 'Store packet under Launch/Readiness/Final.',\
        \ 'Send archive notice to Maya and Priya.', 'Keep source transfer beside the final DOCX.', 'Escalation Packet Owners:',\
        \ 'Vendor access packet: Jordan Lee', 'Demo audio packet: Priya Nair', 'Travel exception packet: Theo Martin', 'Evidence\
        \ Hashes:', 'vendor-staging=hash-pending', 'demo-audio=hash-pending', 'travel-roster=hash-pending', 'Final Review\
        \ Questions:', 'Has Maya approved the launch window summary?', 'Has Jordan verified every vendor staging credential?',\
        \ 'Has Priya confirmed the dry-run audio capture?', 'Has Theo frozen the travel exception list?', 'Approval Gates:',\
        \ 'Gate 1: vendor access screenshot attached.', 'Gate 2: demo script checksum recorded.', 'Gate 3: QA evidence packet\
        \ reviewed.', 'Gate 4: director signoff queued.', 'Rollback Contacts:', 'Vendor access rollback: Jordan Lee', 'Demo\
        \ room rollback: Priya Nair', 'Travel roster rollback: Theo Martin', 'Packet Receipt:', 'Receipt owner: Maya Chen',\
        \ 'Receipt channel: launch-readiness archive', 'Receipt status: pending director review', 'Director Packet Routing:',\
        \ 'Route vendor packet to Jordan before Maya review.', 'Route demo audio packet to Priya before archive receipt.',\
        \ 'Route travel exception packet to Theo before director signoff.', 'Evidence Reconciliation:', 'Match vendor-staging\
        \ hash to Gate 1 evidence.', 'Match demo-audio hash to Gate 2 checksum.', 'Match travel-roster hash to Gate 3 QA packet.',\
        \ 'Cross-VM Delivery Chain:', 'Android source note feeds Windows minutes.', 'Windows minutes feed owner matrix and\
        \ archive manifest.', 'Archive manifest feeds director question packet.', 'Final Escalation Summary:', 'Jordan remains\
        \ blocked until vendor credentials are active.', 'Priya remains ready after dry-run audio validation.', 'Theo remains\
        \ locked after travel exception review.', 'Reviewer Rotation:', 'Maya reviews agenda and packet receipts.', 'Jordan\
        \ reviews vendor access and route locks.', 'Priya reviews demo audio and field comments.', 'Theo reviews travel roster\
        \ and exception locks.', 'Acceptance Criteria:', 'Every gate has a named owner.', 'Every packet has a predecessor\
        \ and status.', 'Every evidence item maps to a gate.', 'Every blocked item has an escalation owner.', 'Cross-VM Consistency\
        \ Checks:', 'The Android note must be the single source of truth.', 'The Windows minutes must preserve the Android\
        \ ordering.', 'The embedded tables must summarize the transferred note only.', 'Director Handoff:', 'Handoff owner:\
        \ Maya Chen', 'Handoff route: launch-readiness archive', 'Handoff status: queued after packet receipt.']:\n    doc.add_paragraph(line)\n\
        for table_data in [[['Route', 'Owner', 'Predecessor', 'Status'], ['vendor-packet', 'Jordan Lee', 'Maya review', 'blocked'],\
        \ ['demo-audio', 'Priya Nair', 'archive receipt', 'ready'], ['travel-exception', 'Theo Martin', 'director signoff',\
        \ 'locked']], [['Evidence', 'Gate', 'Status'], ['vendor-staging', 'Gate 1', 'pending'], ['demo-audio', 'Gate 2', 'ready'],\
        \ ['travel-roster', 'Gate 3', 'ready']], [['Artifact', 'Feeds'], ['Android source note', 'Windows minutes'], ['Windows\
        \ minutes', 'Owner matrix and archive manifest'], ['Archive manifest', 'Director question packet']], [['Owner', 'Final\
        \ state'], ['Jordan', 'blocked until vendor credentials are active'], ['Priya', 'ready after dry-run audio validation'],\
        \ ['Theo', 'locked after travel exception review']], [['Reviewer', 'Area', 'Required check'], ['Maya Chen', 'agenda',\
        \ 'packet receipts'], ['Jordan Lee', 'vendor access', 'route locks'], ['Priya Nair', 'demo audio', 'field comments'],\
        \ ['Theo Martin', 'travel roster', 'exception locks']], [['Criterion', 'Expected state'], ['gate ownership', 'named\
        \ owner on every gate'], ['packet lineage', 'predecessor and status on every packet'], ['evidence mapping', 'every\
        \ evidence item maps to a gate'], ['blocked escalation', 'blocked item has escalation owner']], [['Consistency check',\
        \ 'Result'], ['Android source', 'single source of truth'], ['Windows ordering', 'preserves Android ordering'], ['Embedded\
        \ tables', 'summarize transferred note only']]]:\n    table = doc.add_table(rows=len(table_data), cols=len(table_data[0]))\n\
        \    for r, row in enumerate(table_data):\n        for c, value in enumerate(row):\n            table.rows[r].cells[c].text\
        \ = value\n    doc.add_paragraph('')\ndoc.save(path)\nprint('INIT_OK')\n'@ | py -3 -W ignore -\n"
      timeout: 90
evaluation:
  evaluator_id: evaluators.windows.powershell_check:PowerShellCheckEvaluator
  params:
    timeout: 120
    stdout_contains: EVAL_RESULT:PASS
    command: "@'\nimport os, subprocess, sys\nfrom pathlib import Path\ntry:\n    from docx import Document\nexcept ImportError:\n\
      \    subprocess.check_call([sys.executable, '-m', 'pip', 'install', 'python-docx', '-q'])\n    from docx import Document\n\
      doc = Document(str(Path(os.environ['USERPROFILE']) / 'Documents' / 'launch_review_minutes.docx'))\nparagraphs = [p.text.strip()\
      \ for p in doc.paragraphs if p.text.strip()]\nexpected = ['Launch Readiness Review', 'Attendees:', 'Maya Chen', 'Jordan\
