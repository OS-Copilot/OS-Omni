task_id: windows.oracle.cross_vm.prepare_budget_transfer_hard
platform: windows
instruction: >
  Oracle sanity task for windows.cross_vm.prepare_budget_transfer_hard. The
  initializer already prepares the expected transfer file. Wait briefly and finish.
init:
  initializer_id: initializers.windows.setup:DesktopSetupInitializer
  params:
    steps:
      - type: run_powershell
        script: |
          Get-Process notepad -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $targetPath = Join-Path $env:USERPROFILE "Desktop\budget_transfer.csv"
          @'
          Category,Planned,Actual
          Travel,1200,980
          Lodging,2100,2240
          Meals,450,390
          Supplies,300,340
          '@ | Set-Content -Path $targetPath -Encoding UTF8
        timeout: 30
evaluation:
  evaluator_id: evaluators.windows.powershell_check:PowerShellCheckEvaluator
  params:
    timeout: 30
    stdout_contains: EVAL_RESULT:PASS
    command: |
      $expected = @'
      Category,Planned,Actual
      Travel,1200,980
      Lodging,2100,2240
      Meals,450,390
      Supplies,300,340
      '@.Trim()
      $targetPath = Join-Path $env:USERPROFILE "Desktop\budget_transfer.csv"
      if (-not (Test-Path $targetPath)) {
        Write-Output "MISSING_FILE"
        exit 1
      }
      $actual = (Get-Content -Path $targetPath -Raw).Trim()
      if ($actual -ne $expected) {
        Write-Output "CONTENT_MISMATCH"
        exit 1
      }
      Write-Output "EVAL_RESULT:PASS"
limits:
  max_steps: 100
  step_timeout_seconds: 90
metadata:
  tags: [windows, cross_vm, oracle, hard]
  difficulty: hard
  oracle_for: windows.cross_vm.prepare_budget_transfer_hard
