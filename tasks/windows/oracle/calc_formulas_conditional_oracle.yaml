task_id: windows.oracle.calc.formulas_conditional
platform: windows
instruction: >
  Oracle sanity check for windows.calc.formulas_conditional.

init:
  initializer_id: initializers.windows.setup:DesktopSetupInitializer
  params:
    steps:
      - type: run_powershell
        script: |
          $ErrorActionPreference = "Stop"
          $py = @'
          import os, subprocess, sys
          try:
              from openpyxl import Workbook
              from openpyxl.comments import Comment
              from openpyxl.formatting.rule import CellIsRule
              from openpyxl.styles import PatternFill
          except ImportError:
              subprocess.check_call([sys.executable, "-m", "pip", "install", "openpyxl", "-q"])
              from openpyxl import Workbook
              from openpyxl.comments import Comment
              from openpyxl.formatting.rule import CellIsRule
              from openpyxl.styles import PatternFill

          raw = {
              "Mina": ("Blue", 92, 88, 91, 95, 96),
              "Owen": ("Red", 61, 58, 63, 70, 89),
              "Priya": ("Blue", 84, 90, 79, 88, 93),
              "Leo": ("Green", 55, 49, 60, 57, 91),
              "Nora": ("Red", 73, 78, 69, 74, 87),
              "Sam": ("Green", 88, 82, 85, 80, 94),
              "Tara": ("Blue", 68, 72, 75, 70, 92),
              "Quinn": ("Red", 95, 94, 90, 96, 98),
              "Iris": ("Green", 77, 81, 76, 79, 88),
              "Hugo": ("Blue", 43, 52, 47, 50, 85),
              "Yara": ("Green", 89, 91, 93, 86, 97),
              "Ben": ("Red", 66, 62, 59, 64, 90),
          }
          weights = (0.30, 0.30, 0.25, 0.15)
          def weighted(values):
              return values[1] * weights[0] + values[2] * weights[1] + values[3] * weights[2] + values[4] * weights[3]
          order = sorted(raw.keys(), key=lambda n: (raw[n][0], -weighted(raw[n]), n))

          wb = Workbook()
          ws = wb.active
          ws.title = "Scores"
          ws.append(["Student", "Cohort", "Math", "Science", "English", "Project", "Attendance", "Total", "Weighted Average", "Status", "Rank", "Advisor Flag", "Priority Code"])
          for name in order:
              ws.append([name] + list(raw[name]))
          for row in range(2, 14):
              ws.cell(row, 8).value = f"=SUM(C{row}:F{row})"
              ws.cell(row, 9).value = f"=C{row}*Rules!B2+D{row}*Rules!B3+E{row}*Rules!B4+F{row}*Rules!B5"
              ws.cell(row, 9).number_format = "0.0"
              ws.cell(row, 10).value = f'=IF(I{row}>=Rules!B6,"Honors",IF(I{row}>=Rules!B7,"On Track",IF(I{row}>=Rules!B8,"Review","Recovery")))'
              ws.cell(row, 11).value = f"=RANK.EQ(I{row},$I$2:$I$13,0)"
              ws.cell(row, 12).value = f'=IF(OR(G{row}<90,J{row}="Review",J{row}="Recovery"),"Contact","Clear")'
              ws.cell(row, 13).value = f'=B{row}&"-"&J{row}&"-"&K{row}'
          ws["J1"].comment = Comment("Status thresholds come from Rules", "HelloWorld")
          ws.freeze_panes = "A2"
          ws.auto_filter.ref = "A1:M13"
          red = PatternFill(start_color="FFFF0000", end_color="FFFF0000", fill_type="solid")
          green = PatternFill(start_color="FF00B050", end_color="FF00B050", fill_type="solid")
          ws.conditional_formatting.add("I2:I13", CellIsRule(operator="lessThan", formula=["60"], fill=red))
          ws.conditional_formatting.add("I2:I13", CellIsRule(operator="greaterThanOrEqual", formula=["85"], fill=green))

          rules = wb.create_sheet("Rules")
          rules.append(["Metric", "Value"])
          for item in [
              ("Math weight", 0.30),
              ("Science weight", 0.30),
              ("English weight", 0.25),
              ("Project weight", 0.15),
              ("Honors threshold", 85),
              ("On Track threshold", 75),
              ("Review threshold", 60),
          ]:
              rules.append(item)

          summary = wb.create_sheet("Cohort Summary")
          summary.append(["Cohort", "Student Count", "Average Weighted", "Contact Count", "Honors Count", "Recovery Count", "Top Student"])
          for row_idx, cohort in enumerate(["Blue", "Green", "Red"], start=2):
              summary.cell(row_idx, 1).value = cohort
              summary.cell(row_idx, 2).value = f'=COUNTIF(Scores!$B$2:$B$13,A{row_idx})'
              summary.cell(row_idx, 3).value = f'=AVERAGEIF(Scores!$B$2:$B$13,A{row_idx},Scores!$I$2:$I$13)'
              summary.cell(row_idx, 3).number_format = "0.0"
              summary.cell(row_idx, 4).value = f'=COUNTIFS(Scores!$B$2:$B$13,A{row_idx},Scores!$L$2:$L$13,"Contact")'
              summary.cell(row_idx, 5).value = f'=COUNTIFS(Scores!$B$2:$B$13,A{row_idx},Scores!$J$2:$J$13,"Honors")'
              summary.cell(row_idx, 6).value = f'=COUNTIFS(Scores!$B$2:$B$13,A{row_idx},Scores!$J$2:$J$13,"Recovery")'
              summary.cell(row_idx, 7).value = f'=INDEX(Scores!$A$2:$A$13,MATCH(MAXIFS(Scores!$I$2:$I$13,Scores!$B$2:$B$13,A{row_idx}),Scores!$I$2:$I$13,0))'
          summary.auto_filter.ref = "A1:G4"
          summary["A1"].comment = Comment("Cohort metrics are formula-driven", "HelloWorld")
          blue = PatternFill(start_color="FF9DC3E6", end_color="FF9DC3E6", fill_type="solid")
          summary.conditional_formatting.add("C2:C4", CellIsRule(operator="greaterThanOrEqual", formula=["80"], fill=blue))

          path = os.path.join(os.environ["USERPROFILE"], "Downloads", "scores.xlsx")
          os.makedirs(os.path.dirname(path), exist_ok=True)
          wb.save(path)
          print("ORACLE_CALC_READY", path)
          '@
          $tmp = Join-Path $env:TEMP "calc_formulas_conditional_oracle.py"
          Set-Content -LiteralPath $tmp -Value $py -Encoding UTF8
          py -3 -W ignore $tmp
        timeout: 60

evaluation:
  evaluator_id: evaluators.windows.libreoffice_calc:LibreOfficeCalcEvaluator
  params:
    check_id: calc_formulas_conditional
    stdout_contains: EVAL_RESULT:PASS
    timeout: 120

limits:
  max_steps: 100
  step_timeout_seconds: 180

metadata:
  tags: [oracle, windows, libreoffice, calc]
  oracle_for: windows.calc.formulas_conditional
