task_id: windows.oracle.blender.warehouse_blockout_scene
platform: windows
instruction: >
  Oracle sanity check for windows.blender.warehouse_blockout_scene.

init:
  initializer_id: initializers.windows.setup:DesktopSetupInitializer
  params:
    steps:
      - type: run_powershell
        script: |
          $ErrorActionPreference = "Stop"
          Get-Process blender -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $blenderExeCandidates = @(
            "C:\Tools\Blender279b\blender-2.79b-windows64\blender.exe",
            "C:\Program Files\Blender Foundation\Blender 2.79\blender.exe",
            "C:\Program Files\Blender Foundation\Blender\blender.exe",
            "$env:LOCALAPPDATA\Programs\Blender Foundation\Blender\blender.exe"
          )
          $blenderExe = $blenderExeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $blenderExe) {
            $cmd = Get-Command blender.exe -ErrorAction SilentlyContinue
            if ($cmd) { $blenderExe = $cmd.Source }
          }
          if (-not $blenderExe) { throw "Blender executable not found" }
          $py = @'
          import bpy, math, os

          def material(name, color):
              mat = bpy.data.materials.new(name)
              mat.diffuse_color = color
              return mat

          mats = {
              "concrete": material("concrete", (0.48, 0.48, 0.46)),
              "wall_blue": material("wall_blue", (0.18, 0.34, 0.70)),
              "steel": material("steel", (0.55, 0.58, 0.62)),
              "crate_orange": material("crate_orange", (0.90, 0.55, 0.18)),
              "dock_blue": material("dock_blue", (0.10, 0.22, 0.80)),
              "safety_yellow": material("safety_yellow", (1.00, 0.82, 0.05)),
              "signal_red": material("signal_red", (1.00, 0.08, 0.05)),
              "marker_green": material("marker_green", (0.10, 0.70, 0.25)),
          }
          zones = {
              "FloorSlab": "FLOOR",
              "NorthWall": "STRUCT",
              "SouthWall": "STRUCT",
              "EastColumn": "STRUCT",
              "WestColumn": "STRUCT",
              "MainCrate": "STORAGE",
              "CrateAisleLeft": "STORAGE",
              "CrateAisleRight": "STORAGE",
              "LoadingDock": "DOCK",
              "DockRamp": "DOCK",
              "BeaconTower": "SAFETY",
              "SignalBeacon": "SAFETY",
              "EastSafetyRail": "SAFETY",
              "WestSafetyRail": "SAFETY",
              "EntryMarker": "MARKER",
              "ExitMarker": "MARKER",
          }
          sources = {
              "FloorSlab": "warehouse_shell.blend",
              "NorthWall": "warehouse_shell.blend",
              "SouthWall": "warehouse_shell.blend",
              "EastColumn": "warehouse_shell.blend",
              "WestColumn": "warehouse_shell.blend",
              "MainCrate": "warehouse_storage.blend",
              "CrateAisleLeft": "warehouse_storage.blend",
              "CrateAisleRight": "warehouse_storage.blend",
              "LoadingDock": "warehouse_storage.blend",
              "DockRamp": "warehouse_storage.blend",
              "BeaconTower": "warehouse_safety.blend",
              "SignalBeacon": "warehouse_safety.blend",
              "EastSafetyRail": "warehouse_safety.blend",
              "WestSafetyRail": "warehouse_safety.blend",
              "EntryMarker": "warehouse_safety.blend",
              "ExitMarker": "warehouse_safety.blend",
          }

          def add_obj(name, primitive, loc, scale, mat_key, rz=0):
              if primitive == "cube":
                  bpy.ops.mesh.primitive_cube_add(location=loc)
              elif primitive == "plane":
                  bpy.ops.mesh.primitive_plane_add(location=loc)
              elif primitive == "cylinder":
                  bpy.ops.mesh.primitive_cylinder_add(vertices=32, location=loc)
              elif primitive == "uv_sphere":
                  bpy.ops.mesh.primitive_uv_sphere_add(segments=32, ring_count=16, location=loc)
              elif primitive == "cone":
                  bpy.ops.mesh.primitive_cone_add(vertices=32, location=loc)
              else:
                  raise ValueError(primitive)
              obj = bpy.context.object
              obj.name = name
              obj.scale = scale
              obj.rotation_euler[2] = math.radians(rz)
              obj.data.materials.append(mats[mat_key])
              obj["zone_code"] = zones[name]
              obj["source_blend"] = sources[name]
              return obj

          bpy.ops.object.select_all(action="SELECT")
          bpy.ops.object.delete()
          add_obj("FloorSlab", "plane", (0, 0, -0.02), (6.0, 6.0, 1.0), "concrete")
          add_obj("NorthWall", "cube", (0, 3.1, 0.85), (6.0, 0.12, 0.85), "wall_blue")
          add_obj("SouthWall", "cube", (0, -3.1, 0.85), (6.0, 0.12, 0.85), "wall_blue")
          add_obj("EastColumn", "cylinder", (3.0, 2.4, 1.05), (0.35, 0.35, 1.05), "steel")
          add_obj("WestColumn", "cylinder", (-3.0, 2.4, 1.05), (0.35, 0.35, 1.05), "steel")
          add_obj("MainCrate", "cube", (0, 0, 0.45), (1.2, 0.8, 0.45), "crate_orange")
          add_obj("CrateAisleLeft", "cube", (-1.8, 0, 0.35), (0.55, 0.9, 0.35), "crate_orange")
          add_obj("CrateAisleRight", "cube", (1.8, 0, 0.35), (0.55, 0.9, 0.35), "crate_orange")
          add_obj("LoadingDock", "cube", (-2.8, 2.75, 0.25), (1.0, 0.35, 0.25), "dock_blue")
          add_obj("DockRamp", "cube", (-2.8, 2.15, 0.12), (0.9, 0.45, 0.12), "dock_blue")
          add_obj("BeaconTower", "cylinder", (-2.2, -1.8, 0.8), (0.22, 0.22, 0.8), "steel")
          add_obj("SignalBeacon", "uv_sphere", (-2.2, -1.8, 1.75), (0.32, 0.32, 0.32), "signal_red")
          add_obj("EastSafetyRail", "cube", (1.6, -2.65, 0.45), (1.1, 0.08, 0.22), "safety_yellow")
          add_obj("WestSafetyRail", "cube", (-1.6, -2.65, 0.45), (1.1, 0.08, 0.22), "safety_yellow")
          add_obj("EntryMarker", "cone", (3.25, 0, 0.45), (0.28, 0.28, 0.45), "marker_green")
          add_obj("ExitMarker", "cone", (-3.25, 0, 0.45), (0.28, 0.28, 0.45), "signal_red")
          bpy.ops.object.camera_add(location=(0, -8, 4), rotation=(1.1, 0, 0))
          os.makedirs(r"C:\Users\User\Documents\blender_tasks", exist_ok=True)
          bpy.ops.wm.save_as_mainfile(filepath=r"C:\Users\User\Documents\blender_tasks\warehouse_blockout_scene.blend")
          '@
          $tmp = Join-Path $env:TEMP "blender_warehouse_blockout_scene_oracle.py"
          Set-Content -LiteralPath $tmp -Value $py -Encoding UTF8
          & $blenderExe --background --factory-startup --python $tmp
        timeout: 60

evaluation:
  evaluator_id: evaluators.windows.blender:BlenderEvaluator
  params:
    check_id: blender_warehouse_blockout_scene
    stdout_contains: EVAL_RESULT:PASS
    timeout: 45

limits:
  max_steps: 100
  step_timeout_seconds: 180

metadata:
  tags: [oracle, windows, blender]
  oracle_for: windows.blender.warehouse_blockout_scene
