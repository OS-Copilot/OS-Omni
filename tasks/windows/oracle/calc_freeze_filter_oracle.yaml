task_id: windows.oracle.calc.freeze_filter
platform: windows
instruction: >
  Oracle sanity check for windows.calc.freeze_filter.

init:
  initializer_id: initializers.windows.setup:DesktopSetupInitializer
  params:
    steps:
      - type: run_powershell
        script: |
          $ErrorActionPreference = "Stop"
          py -3 -W ignore -c "
          import os, subprocess, sys
          try:
              from openpyxl import Workbook
          except ImportError:
              subprocess.check_call([sys.executable, '-m', 'pip', 'install', 'openpyxl', '-q'])
              from openpyxl import Workbook
          wb = Workbook()
          ws = wb.active
          ws.title = 'Sales'
          ws.append(['Product', 'Region', 'Q1 Sales', 'Q2 Sales', 'Q3 Sales'])
          for row in [
              ('Widget A', 'North', 15000, 18000, 21000),
              ('Widget B', 'South', 12000, 14000, 16000),
              ('Widget C', 'East', 22000, 19000, 25000),
              ('Widget D', 'North', 8000, 9500, 11000),
              ('Widget E', 'West', 17000, 20000, 23000),
              ('Widget F', 'South', 13000, 15500, 18000),
          ]:
              ws.append(row)
          ws.freeze_panes = 'A2'
          ws.auto_filter.ref = 'A1:E7'
          path = os.path.join(os.environ['USERPROFILE'], 'Downloads', 'sales.xlsx')
          os.makedirs(os.path.dirname(path), exist_ok=True)
          wb.save(path)
          print('ORACLE_CALC_READY', path)
          "
        timeout: 45

evaluation:
  evaluator_id: evaluators.windows.libreoffice_calc:LibreOfficeCalcEvaluator
  params:
    check_id: calc_freeze_filter
    stdout_contains: EVAL_RESULT:PASS
    timeout: 90

limits:
  max_steps: 100
  step_timeout_seconds: 180

metadata:
  tags: [oracle, windows, libreoffice, calc]
  oracle_for: windows.calc.freeze_filter
