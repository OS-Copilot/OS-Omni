task_id: linux.openblender.client_camera_review
platform: linux
instruction: Update the loft project file loft_room_lighting_v03_final.blend in OpenBlender to configure
  the client camera review scene and save the final state. The existing camera named Camera_Final_Crop
  must have its Location set to X 4.60, Y -5.80, Z 3.20 and its Rotation set to X 62, Y 0, Z 38. A duplicate
  of this camera must exist in the scene, renamed ClientCamA, with its Location set to X 3.90, Y -5.10,
  Z 3.45 and its Rotation set to X 60, Y 0, Z 32. The render output settings must be configured with the
  Path set to //client_camera_review, the File Format set to PNG, the Color set to RGBA, and the Compression
  set to 18. The existing object Sunpatch_Gobo_Card must have its Location set to X 0.90, Y -0.42, Z 0.025,
  its Rotation Z set to 18, its Scale set to X 1.20 and Y 0.85, and its Assigned Material set to Matte
  Rubber. A new cube object named ReviewBlock must be added to the Scene Collection with its Location
  set to X -1.10, Y 0.75, Z 0.35, its Rotation Z set to 18, and its Scale set to X 1.25, Y 0.45, Z 0.30.
  ReviewBlock must have a Bevel modifier applied with Amount 0.08 and Segments 3, and its Assigned Material
  must be Matte Rubber. A new light object named ReviewLightA must be added to the scene with its Location
  set to X -2.40, Y -3.40, Z 4.20. The project must be saved with ReviewBlock selected in the Scene Collection
  and the Modifier properties tab open so the Bevel modifier title area is visible.
