instruction: Configure the OpenFinance application so the Overview page displays the Last 90 days reporting
  period with a Cash flow chart, the Budget Health card is accessible, a new transaction for QA Coffee
  dated 2026-06-30 exists with an amount of 12.34, type Expense, account Everyday Checking, category Dining,
  Cleared status, and note receipt audit, and that same transaction is subsequently edited to an amount
  of 14.56 with the note updated memo. The Accounts page must show the Account Register set to High Yield
  Savings with the Hide reconciled control active, and the QA Coffee transaction row within that register
  must be toggled to cleared and then reconciled. The Budgets page must reflect the original month with
  the Housing budget amount set to 2250, the Fill control applied to the Dining row, and a new goal named
  QA Reserve with a target amount of 900. In the Schedules section, the Peak Fitness schedule must remain
  unposted while the Northwind Payroll schedule is posted immediately. The Bills page must show the Fiberlane
  Internet bill amount as 84 and the Travel Rewards Card bill marked as paid. The Payees section must
  have the Brightline Energy entry marked as a favorite. The Rules page must have rules applied to existing
  transactions and the market rule executed. The Portfolio section must include a new holding with the
  ticker symbol QAETF, 2 shares, and a current price of 101. The application must remain on the Reports
  page as the final state.
