evaluation:
  evaluator_id: evaluators.cua_review.evaluators.linux.command_check:CommandCheckEvaluator
  params:
    timeout: 60
    expected_exit_code: 0
    command: |-
      python3 - <<'PY'
      from __future__ import annotations

      import json
      import re
      from pathlib import Path
      from typing import Any

      storage_key = "opencode.workspace.v1"
      expected_commit_message = "Tune hook debug"
      useforecast_path = "src/hooks/useForecast.js"
      api_path = "src/services/api.js"
      checks: list[dict[str, Any]] = []

      def add_check(name: str, passed: bool, **extra: Any) -> None:
          item: dict[str, Any] = {"name": name, "passed": bool(passed)}
          item.update(extra)
          checks.append(item)

      def extract_json_objects(text: str, marker: str) -> list[Any]:
          parsed: list[Any] = []
          start = 0
          while True:
              marker_pos = text.find(marker, start)
              if marker_pos < 0:
                  break
              left = text.find("{", marker_pos)
              if left < 0:
                  break
              depth = 0
              in_string = False
              escape = False
              for right in range(left, min(len(text), left + 2_000_000)):
                  ch = text[right]
                  if in_string:
                      if escape:
                          escape = False
                      elif ch == "\\":
                          escape = True
                      elif ch == '"':
                          in_string = False
                      continue
                  if ch == '"':
                      in_string = True
                  elif ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          raw = text[left : right + 1]
                          try:
                              value = json.loads(raw)
                          except Exception:
                              start = marker_pos + len(marker)
                              break
                          if isinstance(value, dict):
                              parsed.append(value)
                          start = right + 1
                          break
              else:
                  start = marker_pos + len(marker)
          return parsed

      def load_opencode_states() -> list[dict[str, Any]]:
          leveldb_dirs = [
              Path("/home/user/.config/google-chrome/Default/Local Storage/leveldb"),
              Path("/home/user/.config/chromium/Default/Local Storage/leveldb"),
              Path("/home/user/snap/chromium/common/chromium/Default/Local Storage/leveldb"),
          ]
          states: list[dict[str, Any]] = []
          for leveldb_dir in leveldb_dirs:
              if not leveldb_dir.exists():
                  continue
              for path in leveldb_dir.iterdir():
                  try:
                      if not path.is_file():
                          continue
                      if path.stat().st_size <= 0 or path.stat().st_size > 20_000_000:
                          continue
                      if path.suffix.lower() not in {"", ".log", ".ldb"}:
                          continue
                      data = path.read_bytes()
                      if storage_key.encode("utf-8") not in data:
                          continue
                      text = data.decode("utf-8", errors="ignore").replace("\x00", "")
                      for value in extract_json_objects(text, storage_key):
                          if isinstance(value.get("files"), dict):
                              states.append({"path": str(path), "mtime": path.stat().st_mtime, "state": value})
                  except Exception:
                      continue
          return states

      def file_content(files: Any, rel_path: str) -> str:
          if not isinstance(files, dict):
              return ""
          entry = files.get(rel_path)
          if isinstance(entry, dict):
              return str(entry.get("content") or "")
          if isinstance(entry, str):
              return entry
          return ""

      state_candidates = load_opencode_states()

      def score_candidate(item: dict[str, Any]) -> tuple[int, float]:
          state = item.get("state") or {}
          files = state.get("files") if isinstance(state.get("files"), dict) else {}
          useforecast = file_content(files, useforecast_path)
          api = file_content(files, api_path)
          git = state.get("git") if isinstance(state.get("git"), dict) else {}
          timeline = git.get("timeline") if isinstance(git.get("timeline"), list) else []
          changes = git.get("changes") if isinstance(git.get("changes"), list) else []
          terminal = state.get("terminal") if isinstance(state.get("terminal"), list) else []
          score = 0
          score += 10 if useforecast else 0
          score += 10 if api else 0
          score += 25 if "// retry later" in useforecast else 0
          score += 25 if re.search(r"\bAPI_DELAY\b\s*=\s*300\b", api) else 0
          score += 25 if any(str(item) == "Now " + expected_commit_message for item in timeline) else 0
          score += 10 if not any(isinstance(change, dict) and change.get("path") in {useforecast_path, api_path} for change in changes) else 0
          score += 5 if any("npm run lint" in str(line) for line in terminal) else 0
          return score, float(item.get("mtime") or 0)

      selected = max(state_candidates, key=score_candidate, default=None)
      state = selected.get("state") if selected else {}
      files = state.get("files") if isinstance(state.get("files"), dict) else {}
      useforecast = file_content(files, useforecast_path)
      api = file_content(files, api_path)
      git = state.get("git") if isinstance(state.get("git"), dict) else {}
      timeline = git.get("timeline") if isinstance(git.get("timeline"), list) else []
      changes = git.get("changes") if isinstance(git.get("changes"), list) else []
      terminal = state.get("terminal") if isinstance(state.get("terminal"), list) else []
      view = str(state.get("view") or "")
      serialized_state = json.dumps(state, ensure_ascii=False)

      add_check("opencode_local_storage_state_found", selected is not None, candidate_count=len(state_candidates), selected_path=selected.get("path") if selected else None)
      add_check("useforecast_state_file_present", bool(useforecast), path=useforecast_path)
      add_check("api_state_file_present", bool(api), path=api_path)

      useforecast_lines = useforecast.splitlines()
      retry_after_setstate = False
      setstate_observations = []
      for index, line in enumerate(useforecast_lines):
          if "setState" not in line:
              continue
          following = useforecast_lines[index + 1].strip() if index + 1 < len(useforecast_lines) else ""
          setstate_observations.append({"line": index + 1, "text": line.strip(), "following": following})
          if following == "// retry later":
              retry_after_setstate = True
      add_check("retry_comment_after_setstate", retry_after_setstate, observed=setstate_observations[:5], required="// retry later immediately after a setState line")
      add_check("single_retry_comment_present", useforecast.count("// retry later") == 1, observed_count=useforecast.count("// retry later"))

      api_delay_300 = bool(re.search(r"\bAPI_DELAY\b\s*=\s*300\b", api))
      api_delay_340 = bool(re.search(r"\bAPI_DELAY\b\s*=\s*340\b", api))
      add_check("api_delay_changed_to_300", api_delay_300, required="API_DELAY = 300")
      add_check("api_delay_no_longer_340", not api_delay_340, required="API_DELAY must not remain 340")
      add_check("fetchforecast_still_present", "fetchForecast" in api, required="fetchForecast")

      pending_target_changes = [
          change for change in changes
          if isinstance(change, dict) and change.get("path") in {useforecast_path, api_path}
      ]
      add_check("commit_message_recorded", any(str(item) == "Now " + expected_commit_message for item in timeline), observed=timeline[:10], required="Now " + expected_commit_message)
      add_check("target_files_no_pending_change_after_commit", not pending_target_changes, observed=changes, required=[useforecast_path, api_path])
      add_check("lint_command_recorded", any("npm run lint" in str(line) for line in terminal), observed=terminal[-15:], required="npm run lint")

      auxiliary_evidence = {
          "view": view,
          "debug_config_mentions": {
              "node_run_tests": "Node: Run tests" in serialized_state,
              "launch_chrome_against_local_app": "Launch Chrome against local app" in serialized_state,
          },
          "copilot_chat_test_hook_mentioned": "test hook" in serialized_state,
          "search_fetchforecast_mentioned": "fetchForecast" in serialized_state,
          "debug_ui_terms_mentioned": {
              "debug_console": "Debug Console" in serialized_state,
              "variables": "Variables" in serialized_state,
              "call_stack": "Call Stack" in serialized_state,
              "ports": "Ports" in serialized_state,
          },
          "note": "Run/Debug, Copilot, Search, Output, Problems, Ports, and final active-sidebar state are flow actions. They are recorded as auxiliary localStorage evidence when present, but durable pass/fail evidence is the saved OpenCode workspace files, git state, and terminal history.",
      }

      failures = [check["name"] for check in checks if not check["passed"]]
      payload = {
          "checks": checks,
          "failures": failures,
          "observed": {
              "storage_key": storage_key,
              "candidate_count": len(state_candidates),
              "selected_storage_path": selected.get("path") if selected else None,
              "useforecast_path": useforecast_path,
              "useforecast_content_snippet": useforecast[:1400],
              "api_path": api_path,
              "api_content_snippet": api[:1400],
              "git_timeline": timeline[:10],
              "git_changes": changes,
              "terminal_tail": terminal[-15:],
              "auxiliary_flow_evidence": auxiliary_evidence,
          },
          "verifier_rules": [
              "Durable final evidence is the OpenCode web app state saved in Chrome/Chromium Local Storage key opencode.workspace.v1.",
              "Verify src/hooks/useForecast.js contains exactly one // retry later comment immediately after a line containing setState.",
              "Verify src/services/api.js changes API_DELAY to 300 and no longer leaves API_DELAY at 340, while keeping fetchForecast present.",
              "Verify OpenCode git.timeline contains Now Tune hook debug.",
              "Verify src/hooks/useForecast.js and src/services/api.js are absent from OpenCode git.changes after committing.",
              "Verify terminal history includes npm run lint.",
              "Run/Debug, Copilot Chat, Search, Problems, Output, Ports, Go Live, Sync, and final Run and Debug view are flow actions; evaluator records any persisted localStorage evidence but does not click UI, type, run npm, sync, reset, restore snapshots, or mutate VM/app state.",
          ],
      }
      print(json.dumps(payload, ensure_ascii=False))
      raise SystemExit(0 if not failures else 1)
      PY
