instruction: |-
  In the OpenCode application, produce a committed and synced codebase with a completed debug session, a lint execution, and a Copilot explanation, leaving the interface in the Run and Debug view.

  The debug session must be initiated using the Node: Run tests launch configuration, during which the Continue, Step, Restart, and Stop commands are executed in that specific order, and the Debug Console must be the active view upon completion of these actions. The file src/hooks/useForecast.js must be modified by inserting exactly one line containing the text // retry later immediately after the line that contains setState, and the file must be saved. In the Copilot Chat panel, the Explain feature must be used to send the exact message test hook. The file src/services/api.js must be located via the Search functionality for fetchForecast, and the value of API_DELAY must be changed from 340 to 300 while ensuring fetchForecast remains present in the file, followed by saving the changes. The command npm run lint must be executed in the OpenCode terminal. A second debug session must be started using the Launch Chrome against local app launch configuration, during which the Variables and Call Stack sections are interacted with, the Ports tab is opened, the Go Live feature is activated, and the Output panel is viewed. In the Source Control view, the changes for both useForecast.js and api.js must be inspected, committed with the exact message Tune hook debug, and a Sync must be performed. The final state must have OpenCode open and remaining in the Run and Debug view, with both files committed and the npm run lint command visible in the terminal history.
