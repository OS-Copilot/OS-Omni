instruction: 'Create a new document in the OpenDoc application based on the Project plan template, titled
  Client Plan, and export it in HTML format. The document body must begin with a heading containing the
  text Client Plan, formatted with the Aptos font at a size of 14, bold styling, and black text color.
  Below this heading, include a section titled Scope formatted as a Heading 1, followed by a list containing
  the items Audit portal, Draft workflow, and Ship handoff, all of which must have a light yellow highlight
  applied. Following the list, add a new section titled Milestones formatted as a Heading 1, immediately
  followed by a table with 3 rows and 4 columns. The first row of the table must contain the headers Phase,
  Owner, and Due in the first three columns, while the second row must contain Audit in the first column,
  Maya in the second column, and Jul 03 in the third column. The document must also include a comment
  with the text Check dates. Upon completion, the application must remain open on the current Client Plan
  document page with the login session active. OpenDoc is a web app: open it from the OpenDoc icon in
  the webpage folder on the desktop, which opens it in Chrome.'
