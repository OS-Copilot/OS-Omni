    source_instruction: |
      1. 点击 OpenDriver 登录页顶部的 `Rider` 角色选项。
      2. 点击 `Name` 文本栏，选择现有内容并输入 `Riley Rider`。
      3. 点击 `Email` 文本栏，选择现有内容并输入 `rider@example.com`。
      4. 点击 `Password` 文本栏，选择现有内容并输入 `Password123!`。
      5. 选择蓝色 `Login` 按钮提交登录，跳过 `Create account`。
      6. 点击顶部导航里的 `Account` 标签页。
      7. 点击 `Wallet` 折叠区标题展开钱包信息。
      8. 选择查看已展开的钱包区域，确认默认付款方式显示为 `Visa ending 4242`。
      9. 选择查看已展开的钱包区域，确认余额或付款摘要信息已经可见。
      10. 再次点击 `Wallet` 折叠区标题，将钱包信息收起。
      11. 点击 `Coupons` 折叠区标题展开优惠券列表。
      12. 选择查看已展开的优惠券列表，确认 `COMMUTE15` 优惠券可用。
      13. 再次点击 `Coupons` 折叠区标题，将优惠券列表收起。
      14. 点击 `Notifications` 折叠区标题展开通知设置。
      15. 选择查看已展开的通知列表，确认第一条可见通知或通知设置已经显示。
      16. 再次点击 `Notifications` 折叠区标题，将通知设置收起。
      17. 点击 `Saved places` 折叠区标题展开常用地点。
      18. 选择查看已展开的常用地点列表，确认 `Home` 或第一条可见保存地点已经显示。
      19. 选择查看已展开的常用地点列表，确认 `Work` 或第二条可见保存地点已经显示。
      20. 再次点击 `Saved places` 折叠区标题，将常用地点收起。
      21. 点击顶部导航里的 `Safety` 标签页。
      22. 选择阅读 `Safety` 页面的安全信息说明，并确认 support ticket 入口处于未提交状态。
      23. 点击顶部导航里的 `Ride` 标签页。
      24. 点击顶部导航里的 `History` 标签页。
      25. 点击历史列表中第一张可见的行程卡片。
      26. 点击收据或历史详情页底部的 `Done` 按钮返回。
      27. 点击顶部导航里的 `Ride` 标签页。
      28. 点击 `Destination` 文本栏，选择现有内容并输入 `Downtown Palo Alto`。
      29. 点击目的地匹配列表中的 `Downtown Palo Alto, CA`。
      30. 点击 `See prices` 或可见的查看价格按钮，进入车型列表。
      31. 滑动左侧行程面板，露出车型、付款方式和优惠码区域。
      32. 点击 `RideXL` 车型行，查看底部按钮变为 `Choose RideXL`。
      33. 点击 `Priority pickup` 车型行，查看底部按钮变为 `Choose Priority pickup`。
      34. 点击 `Green` 车型行，查看底部按钮变为 `Choose Green`。
      35. 滑动左侧行程面板到付款和优惠码区域，保持车型为 `Green`。
      36. 点击 `Promo code` 文本栏，选择现有内容并输入 `COMMUTE15`。
      37. 点击 `Promo code` 文本栏右侧的对勾按钮应用优惠码。
      38. 选择查看优惠码或折扣区域，确认 `COMMUTE15` 已应用。
      39. 选择查看付款方式区域，确认付款方式仍为默认 `Visa ending 4242`。
      40. 滑动左侧行程面板到底部蓝色按钮附近。
      41. 点击蓝色 `Choose Green` 按钮发起 Green 行程。
      42. 选择查看活动行程卡片的目的地区域，确认目的地为 `Downtown Palo Alto, CA`。
      43. 选择查看活动行程卡片的车型或价格区域，确认当前行程对应 `Green`。
      44. 选择查看活动行程状态区域，直到状态从 `searching` 推进到司机已接单或 `driver arriving`。
      45. 选择查看司机信息卡片，确认司机姓名和车辆信息已经显示。
      46. 选择查看车辆牌照或车辆描述区域，确认车辆详情已经显示。
      47. 选择查看地图或路线进度区域，直到页面出现 `Confirm pickup` 按钮。
      48. 点击 `Confirm pickup` 按钮。
      49. 选择查看行程进度卡片，确认状态进入 `in progress`。
      50. 选择查看目的地或路线摘要区域，确认行程仍前往 `Downtown Palo Alto, CA`。
      51. 如果出现 `Edit stops` 或添加停靠点弹窗，点击 `Cancel` 关闭它。
      52. 选择查看行程进度区域，直到左侧面板切换到 `Receipt` 收据页。
      53. 选择查看收据页中的车型信息区域，确认车型显示 `Green`。
      54. 选择查看收据页中的优惠码或折扣信息区域，确认 `COMMUTE15` 已应用。
      55. 选择查看收据页中的付款信息区域，确认付款方式为 Visa 且付款状态为 paid。
      56. 选择查看收据页中的费用总计区域，确认最终费用明细已经显示。
      57. 点击收据页底部的 `Done` 按钮。
      58. 点击顶部导航里的 `History` 标签页。
      59. 点击历史列表顶部包含 `Downtown Palo Alto, CA` 的最新行程卡片。
      60. 选择查看该历史详情页的标题或目的地区域，确认目的地为 `Downtown Palo Alto, CA`。
      61. 选择查看该历史详情页的车型区域，确认车型为 `Green`。
      62. 选择查看该历史详情页的优惠码或折扣区域，确认 `COMMUTE15` 已应用。
      63. 选择查看该历史详情页的付款信息区域，确认付款状态为 paid。
      64. 选择查看该历史详情页的费用总计区域，确认最终费用明细已经显示。
      65. 选择查看该最新行程详情页的标题区域，并将最终状态停留在该详情页内。
