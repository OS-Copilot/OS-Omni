instruction: In the OpenFinance application, complete a series of account, transaction, bill, payee, rule,
  schedule, and budget updates. The Account Register area on the Accounts page must display the account
  type as Travel Rewards Card instead of High Yield Savings, with reconciled transactions hidden and the
  new transaction row in the account ledger showing a cleared C status and a reconciled R status. The
  Transactions page must contain a new saved transaction dated 2026-06-30 with payee QA Market, type Expense,
  amount 33.45, account Travel Rewards Card, category Groceries, cleared status checked, and note market
  audit; the transaction identified by the note market audit must have its category set to Groceries and
  its note changed to receipt fixed. The Bills page must show the Brightline Energy bill amount as 150
  and marked as paid, the Evergreen Rent bill marked as paid, the Travel Rewards Card bill marked as paid,
  and the Fiberlane Internet bill amount as 86 and marked as paid. The Payees page must show the Whole
  Basket Market entry marked as a favorite and the Brightline Energy entry renamed to Brightline Power.
  The Rules page must include a new saved rule that matches transactions containing the text qamarket,
  assigns the payee QA Market, and assigns the category Groceries, with the rules applied to existing
  transactions and both the market rule and the energy rule run. The Schedules page must show the Peak
  Fitness scheduled transaction skipped and the Northwind Payroll scheduled transaction posted now. The
  Budgets page must display the original month with the Subscriptions budget line filled, the Groceries
  budget amount set to 540, the Transportation budget amount set to 310, and a new saved goal named QA
  Reserve with a target amount of 900 updating the goal list.
