    source_instruction: |
      1. 点击左侧 `Accounts` 导航项，进入账户页。
      2. 点击账户页 `Account Register` 区域中的 `High Yield Savings` 下拉框。
      3. 在账户下拉菜单中选择 `Travel Rewards Card`。
      4. 点击 `Hide reconciled` 按钮。
      5. 点击账户流水表中新交易行的 `C` 状态按钮，切换 cleared 状态。
      6. 点击同一流水行的 `R` 状态按钮，切换 reconciled 状态。
      7. 点击左侧 `Transactions` 导航项，进入交易列表页。
      8. 点击左上绿色 `New transaction` 按钮，打开新交易抽屉。
      9. 点击 `Date` 输入框。
      10. 在 `Date` 输入框中输入 `2026-06-30`。
      11. 点击 `Payee` 输入框。
      12. 在 `Payee` 输入框中输入 `QA Market`。
      13. 点击 `Type` 下拉框。
      14. 在 `Type` 下拉框中选择 `Expense`。
      15. 点击 `Amount` 输入框并改为 `33.45`。
      16. 点击 `Account` 下拉框。
      17. 在账户菜单中选择 `Travel Rewards Card`。
      18. 点击 `Category` 输入框。
      19. 在 `Category` 输入框中输入 `Groceries`。
      20. 勾选 `Cleared` 复选框。
      21. 点击 `Note` 文本框。
      22. 在 `Note` 文本框中输入 `market audit`。
      23. 点击抽屉底部 `Save` 按钮，直到交易列表重新显示。
      24. 点击顶部 `Search transactions` 搜索框。
      25. 在搜索框中输入 `market audit`。
      26. 点击新出现的 `QA Market` 交易行。
      27. 点击该交易行右侧的 `Edit` 按钮，打开交易抽屉。
      28. 点击 `Category` 输入框并改为 `Groceries`。
      29. 点击 `Note` 文本框并改为 `receipt fixed`。
      30. 点击抽屉底部 `Save` 按钮，直到交易列表重新显示。
      31. 点击顶部 `Search transactions` 搜索框并改为空文本。
      32. 点击左侧 `Bills` 导航项，进入账单页。
      33. 点击 `Brightline Energy` 账单卡片上的 `Edit` 按钮，打开账单金额弹窗。
      34. 点击 `Bill amount` 弹窗输入框并改为 `150`。
      35. 点击账单金额弹窗底部的保存按钮，保存账单金额。
      36. 点击 `Evergreen Rent` 账单卡片上的 `Mark paid` 按钮，直到账单卡片更新。
      37. 点击 `Travel Rewards Card` 账单卡片上的 `Mark paid` 按钮，直到账单卡片更新。
      38. 点击 `Fiberlane Internet` 账单卡片上的 `Edit` 按钮，打开账单金额弹窗。
      39. 点击 `Bill amount` 弹窗输入框并改为 `86`。
      40. 点击账单金额弹窗底部的保存按钮，保存账单金额。
      41. 点击 `Fiberlane Internet` 账单卡片上的 `Mark paid` 按钮，直到账单卡片更新。
      42. 点击左侧 `Payees` 导航项，进入收款方页。
      43. 点击收款方列表中的 `Whole Basket Market` 条目。
      44. 点击右侧详情区的 `Favorite` 按钮。
      45. 点击收款方列表中的 `Brightline Energy` 条目。
      46. 点击右侧详情区的 `Rename` 按钮，打开重命名弹窗。
      47. 点击 `Rename payee` 弹窗输入框并改为 `Brightline Power`。
      48. 点击重命名弹窗底部的保存按钮，直到详情区更新。
      49. 点击左侧 `Rules` 导航项，进入规则页。
      50. 点击规则页顶部 `Add rule` 按钮，打开匹配文本弹窗。
      51. 在 `Contains text` 弹窗输入框中输入 `qamarket`。
      52. 点击匹配文本弹窗底部的确认按钮，进入收款方弹窗。
      53. 在 `Payee` 弹窗输入框中输入 `QA Market`。
      54. 点击收款方弹窗底部的继续按钮，进入类别弹窗。
      55. 在 `Category` 弹窗输入框中输入 `Groceries`。
      56. 点击类别弹窗底部的保存按钮，直到规则列表更新。
      57. 点击规则页顶部 `Apply to existing` 按钮。
      58. 点击规则列表中 `market` 规则的 `Run` 按钮。
      59. 点击规则列表中 `energy` 规则的 `Run` 按钮。
      60. 点击左侧 `Schedules` 导航项，进入计划交易页。
      61. 点击 `Peak Fitness` 行右侧的 `Skip` 按钮。
      62. 点击 `Northwind Payroll` 行右侧的 `Post now` 按钮。
      63. 点击左侧 `Budgets` 导航项，进入预算页。
      64. 点击预算页顶部 `Next` 按钮，切到下一个预算月份。
      65. 点击预算页顶部 `Prev` 按钮，切回原预算月份。
      66. 点击 `Subscriptions` 行右侧的 `Fill` 按钮。
      67. 点击 `Groceries` 行的预算金额输入框并改为 `540`。
      68. 点击 `Transportation` 行的预算金额输入框并改为 `310`。
      69. 点击预算页右侧 `Add goal` 按钮，打开目标名称弹窗。
      70. 在 `Goal name` 弹窗输入框中输入 `QA Reserve`。
      71. 点击 `Goal name` 弹窗的确认按钮，进入目标金额弹窗。
      72. 点击 `Target amount` 弹窗输入框并改为 `900`。
      73. 点击目标金额弹窗底部的提交按钮，直到目标列表更新。
