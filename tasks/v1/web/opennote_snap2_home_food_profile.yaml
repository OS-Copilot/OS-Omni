instruction: 'If OpenNote asks you to sign in, use the username lina and the password note2026. In the
  OpenNote application, complete a workflow that results in specific notes being liked, saved, and commented
  upon, a user being followed, a new post being created, and profile details being updated. The note titled
  "Desk cable cleanup after I found three mystery screws" in the Explore section under the Home category
  must be liked, saved, and have the comment "Cable idea" added, with the #plant corner tag selected from
  that note. The note titled "Tiny adjustments that made open shelf edit work" must be liked, saved, and
  have the comment "Shelf saved" added. The author profile for June Ellis must be opened and followed,
  and from her profile, the note titled "Balcony watering after I underestimated how dusty the shelf was"
  must be saved, liked, and have the comment "Water check" added. The first visible note cover in the
  Following feed must be saved, and all notifications in the Alerts section must be marked as read. A
  new post in the Home category must be created with the title "Desk bay," the body "Cable tray note,"
  the location "Desk side," the tags "desk" and "plant," and the first available cover option, and this
  newly created "Desk bay" note must be liked, saved, and have the comment "Desk saved" added. The profile
  fields in My Profile must be updated so that the Role is "Desk curator" and the Bio is "Keep desk notes,"
  and the profile must be saved. The note titled "Weekday ramen, tested with a hair tie" in the Food category
  of Explore must be liked, saved, and have the #picnic tag selected, and the note titled "A real-life
  test of cold brew walk" must be liked, saved, and have the comment "Is it tasty" added, leaving the
  application in this final state.'
