task_id: linux.opendriver.rider_single_1_1
platform: linux
instruction: |-
  Complete the OpenDriver rider account and ride workflow as Riley Rider using `rider@example.com` and `Password123!`, leaving the Ride page active. Review the Account Wallet with Visa ending in 4242 selected, the Coupons panel, and the Saved places panel with Home selected, closing those panels after each review. The initial Green ride should go to Downtown Palo Alto, CA with Visa ending in 4242 as payment and `COMMUTE15` applied; add Stanford Shopping Center as a stop after the ride becomes active and save its invoice PDF from the active trip's receipt area.

  Use the initial ride's `Book another ride` option to request a RideX trip to Stanford Shopping Center with Visa ending in 4242 and the Now departure choice. When the cancellation dialog appears for this second ride, keep the ride rather than confirming cancellation. In History, review the most recent Downtown Palo Alto trip and save its invoice PDF again from the historical receipt. Leave the Ride page active after a final review of the Account Coupons panel, with the rider session still signed in.
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      timeout: 30
      script: |
        set -e
        pkill -f '/home/user/Applications/opendriver' 2>/dev/null || true
        pkill -f 'opendriver' 2>/dev/null || true
        cd /home/user/Applications/opendriver/shared/backend
        npm run seed
    - type: launch
      app_name: /home/user/Applications/opendriver/start-opendriver.sh
    - type: wait
      ms: 2500
evaluation:
  evaluator_id: evaluators.cua_review.evaluators.linux.command_check:CommandCheckEvaluator
  params:
    timeout: 30
    expected_exit_code: 0
    stdout_contains: OPENDRIVER_RIDER_SINGLE_1_1_PASS
    command: |
      set -e
      cd /home/user/Applications/opendriver
      node - <<'NODE'
      const fs = require('fs');
      const db = JSON.parse(fs.readFileSync('shared/backend/data/opendriver-db.json', 'utf8'));
      const rides = db.rides || [];
      const target = rides
        .filter(r => r.riderId === 'usr_rider_primary' && r.destinationAddress === 'Downtown Palo Alto, CA')
        .sort((a,b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')))[0];
      const failures = [];
      if (!target) failures.push('missing downtown ride');
      if (target) {
        if (target.rideTier !== 'green') failures.push(`rideTier=${target.rideTier}`);
        if (target.promoCode !== 'COMMUTE15') failures.push(`promoCode=${target.promoCode}`);
        if (target.cancelledAt) failures.push(`cancelledAt=${target.cancelledAt}`);
        if (!['requested','searching','accepted','driver_arriving','arrived','in_progress','completed'].includes(target.status)) failures.push(`status=${target.status}`);
      }
      if (failures.length) {
        console.log(JSON.stringify({ok:false, failures, target}, null, 2));
        process.exit(1);
      }
      console.log('OPENDRIVER_RIDER_SINGLE_1_1_PASS');
      console.log(JSON.stringify({rideId: target.id, status: target.status, tier: target.rideTier, promo: target.promoCode}, null, 2));
      NODE
