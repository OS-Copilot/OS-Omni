instruction: |-
  If OpenBank asks you to sign in, use the username jordan and the password vault2026. Create two new transfer recipients in the Transfer money section, initiate two specific transfers, file a dispute on a posted transaction, and configure security alerts and card controls. The first recipient record must be named "Lena Wu" with account number "0000007766", routing number "021000089", bank "OpenBank", and nickname "Design split". The second recipient record must be named "Marco Li" with account number "0000007767", routing number "021000089", bank "OpenBank", and nickname "Studio rent". Both recipients must be saved.

  Two transfer records must be submitted from the "Everyday Checking ••••2381" account. The first transfer is to "Lena Wu" with a memo of "Design split", an amount of "4.20", and a date of "2026-06-01". The second transfer is to "Marco Li" with a memo of "Studio rent" and an amount of "1.25".

  A dispute must be filed against the "Transfer to Marco Li" transaction, which is identified in the Activity section by the description "Studio rent", the "Transfer" category, "Posted" status, and a timeframe of "Last 30 days". The dispute details field for this transaction must contain the text "Unknown rent debit".

  The Security section must reflect the following configuration: the "Large purchase" alert must have "Push" notification enabled and saved; the "Low balance" alert must have "Text" notification enabled and saved; the "Payment due" alert must have "Text" notification enabled and saved; the "Upcoming bill" alert must be marked as read; and the "OpenBank Rewards Card" must be locked, changing its state from "Unlocked".
