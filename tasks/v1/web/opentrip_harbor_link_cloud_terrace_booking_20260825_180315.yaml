    source_instruction: |-
      This is a Linux Ubuntu0 GUI task for OpenTrip. The VM snapshot is snap_1. Use the app UI only; do not Sign Out / 不要退出登录. Follow the numbered instruction exactly.

      1. 在 Ubuntu0 桌面双击 OpenTrip 图标打开软件；如果 OpenTrip 已经打开，则点击现有 OpenTrip 窗口。
      2. 点击页面右上角的 Sign In。
      3. 点击 Phone 输入框。
      4. 按 Ctrl+A 清空 Phone 输入框。
      5. 输入 13900002026。
      6. 点击 Password 输入框。
      7. 按 Ctrl+A 清空 Password 输入框。
      8. 输入 travel2026。
      9. 点击 Sign In 按钮登录。
      10. 点击顶部导航栏的 Search 返回搜索首页。
      11. 点击搜索卡片顶部的 Flights 标签。
      12. 点击 From 下拉框。
      13. 选择 Shanghai (SHA)。
      14. 点击 To 下拉框。
      15. 选择 Sanya (SYX)。
      16. 点击 Date 输入框。
      17. 按 Ctrl+A 选中 Date 输入框中的现有日期。
      18. 输入 2026-06-12。
      19. 点击 Cabin 下拉框。
      20. 选择 Business。
      21. 点击 Sort 下拉框。
      22. 选择 Recommended。
      23. 点击 Search Flights。
      24. 在 Flight Results 结果列表中找到可见的 Harbor Link HL2195 航班卡片；如果不在当前屏幕，仅小幅向下滚动到该卡片。
      25. 点击结果区中可见的 Harbor Link HL2195 航班卡片里的 Details。
      26. 在航班详情页点击 Book。
      27. 点击 Traveler 下拉框。
      28. 选择 Maya Chen · Passport。
      29. 点击 Cabin 下拉框。
      30. 选择 Business。
      31. 点击 Contact phone 输入框。
      32. 按 Ctrl+A 选中 Contact phone 中的现有内容。
      33. 输入 13900002026。
      34. 点击 Payment 下拉框。
      35. 选择 Bank Card。
      36. 点击 Note 输入框。
      37. 输入 Sanya board review。
      38. 点击 Confirm Booking。
      39. 点击顶部导航栏的 Search 返回搜索首页。
      40. 点击搜索卡片顶部的 Hotels 标签。
      41. 点击 City 下拉框。
      42. 选择 Sanya。
      43. 点击 Check-in 输入框。
      44. 按 Ctrl+A 选中 Check-in 中的现有日期。
      45. 输入 2026-06-12。
      46. 点击 Check-out 输入框。
      47. 按 Ctrl+A 选中 Check-out 中的现有日期。
      48. 输入 2026-06-13。
      49. 点击 Guests 输入框。
      50. 按 Ctrl+A 选中 Guests 中的现有人数。
      51. 输入 3。
      52. 点击 Sort 下拉框。
      53. 选择 Recommended。
      54. 点击 Search Hotels。
      55. 在 Hotel Results 结果列表中滚动到 Sanya Cloud Terrace Boutique Stay 酒店卡片。
      56. 点击 Sanya Cloud Terrace Boutique Stay 酒店卡片中的 Details。
      57. 在酒店详情页点击 Book。
      58. 点击 Room 下拉框。
      59. 选择 Family Suite。
      60. 点击 Guests 输入框。
      61. 按 Ctrl+A 选中 Guests 中的现有人数。
      62. 输入 3。
      63. 点击 Contact phone 输入框。
      64. 按 Ctrl+A 选中 Contact phone 中的现有内容。
      65. 输入 13900002027。
      66. 点击 Payment 下拉框。
      67. 选择 WeChat Pay。
      68. 点击 Note 输入框。
      69. 输入 Late arrival 21:00。
      70. 点击 Confirm Booking。
      71. 点击顶部导航栏的 Bookings。
      72. 在 Bookings 列表中滚动到 Harbor Link HL2195 航班订单和 Sanya Cloud Terrace Boutique Stay 酒店订单。
      73. 点击 Sanya Cloud Terrace Boutique Stay 酒店订单卡片，使最终页面停留在包含两条新订单的 Bookings 页面。

      Finish with OpenTrip left open on the final page reached by the instruction.
