instruction: 'If OpenBank asks you to sign in, use the username jordan and the password vault2026. File
  a dispute for the “Ace Hardware” transaction in the Activity section by selecting “Canceled or returned
  item” as the reason, enabling the “I contacted the merchant” toggle, entering “Return for rebate” in
  the Details field, and submitting the form. Create two new recipients in the Transfers section: the
  first with the name “Mira song”, account number “0000007755”, routing number “021000089”, nickname “Card
  rebate”, and bank “OpenBank”; the second with the name “Dana Cole”, account number “0000007756”, routing
  number “021000089”, nickname “Audit fee”, and bank “OpenBank”. Initiate a transfer of “2.75” from “Everyday
  Checking ••••2381” to “Mira Song” with the memo “Card rebate” and the date “July 29, 2026”, and submit
  it. Change the delivery preference for the “Rainy Day Savings ••••9140” account in the Statements section
  from “Paper” to “Go paperless”. Initiate a second transfer of “1.35” from “Everyday Checking ••••2381”
  to “Dana Cole” with the memo “Audit fee” and the date “July 30, 2026”, and submit it. In the Security
  section, enable the “Text” notification toggle for the “Payment due” alert and save the changes, mark
  the “Upcoming bill” alert as read, enable the “Text” notification toggle for the “Low balance” alert,
  and save the changes.'
