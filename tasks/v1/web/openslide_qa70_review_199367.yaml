instruction: 'Create a new presentation using the Business review template and set the presentation title
  to qa70-review. The first slide must display the title text QA70 Review. The second slide must display
  the title text Metrics and contain a chart positioned in front of other elements, with the chart''s
  Alt text set to qa70 chart and its Animation set to Fade in the format panel. The third slide must use
  the Marine theme and the Comparison layout, containing a shape with a fill color of #FFD7C8 and a duplicate
  of that shape moved to the right-side comparison area. The fourth slide must have the Fade transition
  applied to all slides, display the notes area with the text qa70 speaker note entered in the notes field,
  and include a comment with the text qa70 comment. A rehearsal must be initiated from the beginning,
  advanced through the first two slides, and then closed. The fourth slide must also contain a table positioned
  in front of other elements and resized so the decision matrix fills the slide''s content area, along
  with a comment containing the text quarterly decision matrix owner review and the notes field populated
  with Decision owners locked for Friday review.'
