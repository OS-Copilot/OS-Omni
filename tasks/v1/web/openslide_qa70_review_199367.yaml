    source_instruction: |2

      1. 点击左侧 New presentation 按钮。
      2. 点击顶部 Templates 按钮。
      3. 在模板弹窗中点击 Business review。
      4. 点击顶部演示文稿标题输入框。
      5. 按住 `Ctrl` 并点击键盘 `A` 全选标题。
      6. 用键盘输入 qa70-review。
      7. 点击左侧第 1 张幻灯片缩略图。
      8. 连续点击两次画布中的标题文字。
      9. 按住 `Ctrl` 并点击键盘 `A` 全选标题文字。
      10. 用键盘输入 QA70 Review。
      11. 点击第 2 张幻灯片缩略图。
      12. 连续点击两次画布中的标题文字。
      13. 按住 `Ctrl` 并点击键盘 `A` 全选标题文字。
      14. 用键盘输入 Metrics。
      15. 点击顶部 Insert 选项卡。
      16. 点击 Chart 按钮，在当前幻灯片插入图表。
      17. 点击刚插入的图表对象。
      18. 点击顶部 Home 选项卡。
      19. 点击 Front 按钮，把图表置于前方。
      20. 点击顶部 View 选项卡。
      21. 点击 Format 按钮打开格式面板。
      22. 点击格式面板中的 Alt text 输入框。
      23. 按住 `Ctrl` 并点击键盘 `A` 全选内容。
      24. 用键盘输入 qa70 chart。
      25. 点击格式面板中的 Animation 下拉框。
      26. 选择 Fade。
      27. 点击格式面板中的 Apply 按钮。
      28. 点击第 3 张幻灯片缩略图。
      29. 点击顶部 Design 选项卡。
      30. 点击 Marine 主题。
      31. 点击顶部 Home 选项卡。
      32. 点击 Layout 下拉框。
      33. 选择 Comparison。
      34. 点击顶部 Insert 选项卡。
      35. 点击 Shape 按钮插入形状。
      36. 点击插入的形状对象。
      37. 点击顶部 Home 选项卡。
      38. 点击填充颜色色块。
      39. 在颜色输入中选择或输入 #FFD7C8。
      40. 点击 Copy 按钮复制当前形状。
      41. 点击 Paste 按钮粘贴形状副本。
      42. 拖拽粘贴出的形状到右侧对比区域。
      43. 点击第 4 张幻灯片缩略图。
      44. 点击顶部 Transitions 选项卡。
      45. 点击 Fade。
      46. 点击 Apply All，把该过渡应用到所有幻灯片。
      47. 点击顶部 Review 选项卡。
      48. 点击 Notes 按钮显示备注区域。
      49. 点击底部备注输入框。
      50. 用键盘输入 qa70 speaker note。
      51. 点击右侧格式面板中的评论输入框。
      52. 用键盘输入 qa70 comment。
      53. 点击 Comment 按钮添加评论。
      54. 点击顶部 Slide Show 选项卡。
      55. 点击 Rehearse 按钮。
      56. 点击 From Start 按钮进入放映模式。
      57. 点击放映栏中的 Next 按钮。
      58. 再次点击 Next 按钮。
      59. 点击放映栏中的 Close 按钮退出放映。
      60. 点击左侧缩略图栏中编号 4 的第四张幻灯片。
      61. 点击顶部 Insert 选项卡。
      62. 点击 Table 按钮插入决策表格。
      63. 点击刚插入的表格对象。
      64. 点击顶部 Home 选项卡。
      65. 点击 Front 按钮，把表格置于前方。
      66. 拖拽表格右下角的控制点，使决策矩阵铺满当前幻灯片的内容区域。
      67. 点击顶部 Review 选项卡。
      68. 点击右侧格式面板中的评论输入框。
      69. 用键盘输入 quarterly decision matrix owner review。
      70. 点击右侧格式面板中的 Comment 按钮添加评论。
      71. 点击底部备注输入框。
      72. 用键盘输入 Decision owners locked for Friday review。
