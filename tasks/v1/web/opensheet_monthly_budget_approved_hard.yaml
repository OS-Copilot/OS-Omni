    source_instruction: |
      1. Click the top Templates button.
      2. In the template window, click the Monthly budget template.
      3. Click the top workbook name input.
      4. Press Ctrl+A to select the current name.
      5. Type qa-budget-review.
      6. Click cell A1.
      7. Press Ctrl+A to select the cell contents.
      8. Type Budget Area.
      9. Press Enter to confirm.
      10. Click cell B1.
      11. Press Ctrl+A to select the cell contents.
      12. Type Plan.
      13. Press Enter to confirm.
      14. Click cell C1.
      15. Press Ctrl+A to select the cell contents.
      16. Type Actual.
      17. Press Enter to confirm.
      18. Click cell D1.
      19. Press Ctrl+A to select the cell contents.
      20. Type Diff.
      21. Press Enter to confirm.
      22. Click cell E1.
      23. Type Owner.
      24. Press Enter to confirm.
      25. Click cell E2.
      26. Type finance.
      27. Press Enter to confirm.
      28. Click cell E3.
      29. Type home.
      30. Press Enter to confirm.
      31. Click cell E4.
      32. Type ops.
      33. Press Enter to confirm.
      34. Select the header range A1:E1.
      35. Click the top Home tab.
      36. Click the B bold button.
      37. Click the Center alignment button.
      38. Click the font size dropdown.
      39. Choose 16.
      40. Click cell D7.
      41. Click the top Formulas tab.
      42. Click the SUM button.
      43. Click the formula bar.
      44. Press Ctrl+A to select the formula bar contents.
      45. Type =SUM(D3:D6).
      46. Press Enter to confirm the formula.
      47. Click cell D7.
      48. Click the top Insert tab.
      49. Click the Note button.
      50. In the note input box, type budget ok.
      51. Click OK in the dialog.
      52. Click the top Formulas tab.
      53. Click the Define name button.
      54. In the name input box, type BudgetDiff.
      55. Click OK in the dialog.
      56. Click the Review tab that contains the Audit formulas button.
      57. Click the Audit formulas button.
      58. Click the top View tab.
      59. Click Heading.
      60. Click the zoom dropdown.
      61. Choose 125%.
      62. Click cell E5.
      63. Type approved.
      64. Click cell D7.
      65. Click the formula bar.
      66. Type =SUM(D3:D6).
      67. Press Enter.
      68. Click cell E5.
      69. Click the top Home tab.
      70. Click fill color and choose a light green color.
      71. Click the top workbook name input.
      72. Press Ctrl+A to select the name.
      73. Type monthly-budget-approved.
      74. Click the top Review tab.
      75. Click Protect sheet after all data entry is complete.
      Finish with the monthly-budget-approved workbook open in OpenSheet. Do not close OpenSheet.
