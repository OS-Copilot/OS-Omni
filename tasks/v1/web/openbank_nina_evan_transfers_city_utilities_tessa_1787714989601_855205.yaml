instruction: |-
  If OpenBank asks you to sign in, use the username jordan and the password vault2026. Create three new transfer recipients and schedule two transfers and one bill payment in the banking application. The first recipient record must be named "Nina park" with the nickname "June rent", bank "OpenBank", routing number "021000089", and account number "0000007788". The second recipient record must be named "Evan Holt" with the nickname "House fund", bank "OpenBank", routing number "021000089", and account number "0000007791". The third recipient record must be named "Tessa Quinn" with the nickname "Lighting fund", bank "OpenBank", routing number "021000089", and account number "0000007863".

  A submitted transfer must originate from the "Everyday Checking ••••2381" account, be directed to "Nina park", have an amount of "2.15", a transfer date of "2026-06-01", and a memo of "June rent". A second submitted transfer must originate from the "Everyday Checking ••••2381" account, be directed to "Evan Holt", have an amount of "1.40", and a memo of "House fund". A scheduled bill payment must be made to the biller "City Utilities", funded from the "Everyday Checking ••••2381" account, with an amount of "63.47", a payment date of "2026-06-03", and a memo of "63.47".

  The "Upcoming bill" notification in the Security section must be marked as read. All three recipients must exist in the transfer section, both transfers must be submitted, the bill payment must be scheduled, and the notification must be in a read state at completion.
