    source_instruction: |2

      1. 连续点击两次桌面上的 `webpage` 文件夹。
      2. 连续点击两次文件夹中的 `OpenPhoto Edit` 图标，打开 Chrome 中的 `OpenPhotoEdit` 页面。
      3. 点击左侧 `Import Photo` 按钮。
      4. 在文件选择弹窗中打开 `/home/user/Desktop/attachment` 文件夹。
      5. 连续点击两次 `portrait_window_before.jpg`，导入带有左上角 RGB 校验色块的窗边人像照片。
      6. 点击右侧工具网格中的 `Portrait` 标签，并确认左上角 RGB 校验色块完整可见。
      7. 拖动 `Smooth` 滑块，将数值设置为 `26`，轻微柔化皮肤。
      8. 拖动 `Whiten` 滑块，将数值设置为 `16`，避免过度美白。
      9. 拖动 `Rosy` 滑块，将数值设置为 `14`，增加自然气色。
      10. 拖动 `Lip Color` 滑块，将数值设置为 `12`。
      11. 拖动 `Slim Face` 滑块，将数值设置为 `8`，保持自然比例。
      12. 拖动 `Big Eyes` 滑块，将数值设置为 `6`。
      13. 拖动 `Bright Eyes` 滑块，将数值设置为 `22`，增强眼神光。
      14. 拖动 `Background Blur` 滑块，将数值设置为 `32`，弱化杂乱室内背景。
      15. 点击右侧工具网格中的 `Edit` 标签。
      16. 拖动 `Exposure` 滑块，将数值设置为 `+16`，提亮人物面部。
      17. 拖动 `Brightness` 滑块，将数值设置为 `+10`。
      18. 拖动 `Contrast` 滑块，将数值设置为 `-10`，让面部过渡更柔和。
      19. 拖动 `Saturation` 滑块，将数值设置为 `+12`。
      20. 拖动 `Temperature` 滑块，将数值设置为 `+6`，补充窗边暖光。
      21. 拖动 `Sharpen` 滑块，将数值设置为 `+8`，保留眼睛和发丝细节。
