      24. 拖动 `Orange` 滑块，将数值设置为 `+10`，优化肤色。
      25. 拖动 `Yellow` 滑块，将数值设置为 `-7`，减少室内黄光偏色。
      26. 点击 `Dodge` 笔刷。
      27. 拖动 Brush 的 `Size` 滑块，将数值设置为 `18`。
