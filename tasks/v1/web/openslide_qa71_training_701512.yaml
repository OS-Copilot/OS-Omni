instruction: Create a new presentation using the Training deck template and save the file as qa71-training.
  The first slide must display the large title text QA71 Training. The second slide must use the Sunrise
  design theme and the Section Header layout, containing a text box with bold, 32-point, center-aligned
  text and a table whose format panel has the Alt text set to qa71 agenda table and the Appear animation
  applied. The third slide must contain two lines, with the second line positioned in the lower half of
  the slide, and its notes area must contain the text qa71 trainer note. All slides in the presentation
  must have the Push transition applied, and the presentation must include a comment with the text qa71
  training comment. After the slide show is started from the current slide, advanced twice, returned to
  the previous slide, and closed, the third slide must additionally contain a text box with the text Knowledge
  Check formatted as bold, 32-point, and center-aligned. The presentation file must ultimately be renamed
  to qa71-training-checkpoint.
