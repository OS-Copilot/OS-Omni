    source_instruction: |2

      1. 点击左侧 New presentation 按钮。
      2. 点击顶部 Templates 按钮。
      3. 在模板弹窗中点击 Training deck。
      4. 点击顶部小红色图标右侧的演示文稿名称。
      5. 按住 `Ctrl` 并点击键盘 `A` 全选标题。
      6. 用键盘输入 qa71-training。
      7. 点击面板右上角的 X 关闭它。
      8. 点击左侧缩略图栏中编号 1 的第一张幻灯片。
      9. 拖拽选中画布中的大标题文字。
      10. 点击对应控件，清除原本文字。
      11. 用键盘输入 QA71 Training。
      12. 点击左侧缩略图栏中编号 2 的第二张幻灯片。
      13. 点击顶部 Design 选项卡。
      14. 点击 Sunrise 主题。
      15. 点击顶部 Home 选项卡。
      16. 点击 New Slide 右侧的版式下拉框。
      17. 选择 Section Header。
      18. 点击顶部 Insert 选项卡。
      19. 点击 Text Box 按钮插入文本框。
      20. 点击刚插入的文本框。
      21. 点击顶部 Home 选项卡。
      22. 点击 B 按钮设置加粗。
      23. 点击字体大小下拉框。
      24. 选择 32。
      25. 点击 Center 按钮设置居中。
      26. 点击顶部 Insert 选项卡。
      27. 点击 Table 按钮插入表格。
      28. 点击刚插入的表格对象。
      29. 点击顶部 View 选项卡。
      30. 点击 Format 按钮打开格式面板。
      31. 点击格式面板中的 Alt text 输入框。
      32. 按住 `Ctrl` 并点击键盘 `A` 全选内容。
      33. 用键盘输入 qa71 agenda table。
      34. 点击格式面板中的 Animation 下拉框。
      35. 选择 Appear。
      36. 点击 Apply 按钮。
      37. 点击左侧缩略图栏中编号 3 的第三张幻灯片。
      38. 点击顶部 Insert 选项卡。
      39. 点击 Line 按钮插入线条。
      40. 点击刚插入的线条对象。
      41. 点击顶部 Home 选项卡。
      42. 点击 Front 按钮。
      43. 点击 Copy 按钮复制线条。
      44. 点击 Paste 按钮粘贴线条副本。
      45. 拖拽粘贴出的线条到当前幻灯片下半部分。
      46. 点击顶部 Transitions 选项卡。
      47. 点击 Push。
      48. 点击 Apply All。
      49. 点击顶部 Review 选项卡。
      50. 点击底部备注输入框。
      51. 用键盘输入 qa71 trainer note。
      52. 点击右侧格式面板中的评论输入框。
      53. 用键盘输入 qa71 training comment。
      54. 点击 Comment 按钮添加评论。
      55. 点击顶部 Slide Show 选项卡。
      56. 点击 Current 按钮从当前幻灯片开始放映。
      57. 点击放映栏中的 Next 按钮。
      58. 再次点击放映栏中的 Next 按钮。
      59. 点击放映栏中的 Previous 按钮。
      60. 点击放映栏中的 Close 按钮退出放映。
      61. 点击顶部 File 选项卡。
      62. 点击左侧缩略图栏中编号 3 的第三张幻灯片。
      63. 点击顶部 Insert 选项卡。
      64. 点击 Text Box 按钮插入文本框。
      65. 连续点击两次刚插入的文本框进入文字编辑。
      66. 用键盘输入 Knowledge Check。
      67. 点击顶部 Home 选项卡。
      68. 点击 B 按钮设置加粗。
      69. 点击字体大小下拉框。
      70. 选择 32。
      71. 点击 Center 按钮设置居中。
      72. 点击顶部小红色图标右侧的演示文稿名称。
      73. 按住 `Ctrl` 并点击键盘 `A` 全选标题。
      74. 用键盘输入 qa71-training-checkpoint。
