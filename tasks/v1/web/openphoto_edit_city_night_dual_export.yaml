task_id: linux.openphoto_edit.city_night_dual_export
platform: linux
instruction: 'Produce two edited JPEG exports in the OpenPhoto Edit web application by processing the
  source images city_night_street.jpg and city_night_storefront.jpg from the /home/user/Desktop/attachment
  folder. The first output, saved as city_night_street_edited.jpg, must reflect specific global and local
  adjustments to the night street scene while preserving the RGB calibration color block in the top-right
  corner. Its Edit panel settings are Exposure +6, Brightness +4, Contrast +24, Saturation +18, Temperature
  -16, Sharpen +18, and Vignette +18. The HSL panel values are Red +10, Orange -8, Yellow -12, Cyan +16,
  Blue +22, and Purple +14. The Filters panel uses the Night preset with a Strength of 66. The Scene panel
  settings are Structure +20, Cool Tone +26, and HDR +14. Local brush work includes Dodge marks with a
  Brush Size of 20 and Brush Strength of 46 applied to dark areas under streetlights or the central dark
  portion of the street, Burn marks with a Brush Size of 18 and Brush Strength of 40 applied to overexposed
  neon signs or car headlight highlights while avoiding the top-right RGB calibration block, and Mosaic
  marks with a Brush Size of 14 and Brush Strength of 60 applied to license plates, pedestrian faces,
  or recognizable door plates.


  The second output, saved as city_night_storefront_edited.jpg, must reflect adjustments to the close-up
  storefront image. Its Edit panel settings are Exposure +4, Contrast +20, Saturation +22, Temperature
  -8, and Sharpen +20. The HSL panel values are Red +12, Orange +8, Blue +18, and Purple +16. The Scene
  panel settings are Cool Tone 20 and Structure 18. Local brush work includes Dodge marks with a Brush
  Size of 16 and Brush Strength of 38 applied to dark areas of window display items or the shadowed entrance,
  Burn marks applied to the brightest light tubes or window reflection areas, Mosaic marks with a Brush
  Size of 12 and Brush Strength of 64 applied to storefront phone numbers, QR codes, license plates, or
  passerby faces while ensuring the RGB calibration block is not covered, and Heal marks with a Brush
  Size of 10 and Brush Strength of 36 applied to small bright spots on the road surface or glass smudges.
  Additional local adjustments include a second Dodge mark on the slightly dark areas of the window display
  item outlines and a second Burn mark on the overexposed light strip on the right side, keeping it away
  from the RGB calibration block. Both final files must reside in the Downloads folder with their exact
  specified names and must not be deleted or moved after completion. OpenPhotoEdit is a web app: open
  it from the OpenPhoto Edit icon in the webpage folder on the desktop, which opens it in Chrome.'
