    source_instruction: |
      1. 点击左侧 `Overview` 导航项，进入总览页。
      2. 点击顶部周期下拉框 `Last 30 days`。
      3. 在下拉菜单中选择 `Last 90 days`。
      4. 点击总览图表右上角的 `Spending` 分段按钮。
      5. 点击总览图表右上角的 `Cash flow` 分段按钮。
      6. 点击右侧 `Budget Health` 卡片上的 `Open` 按钮，进入 Budgets 页。
      7. 点击左侧 `Transactions` 导航项，进入交易列表页。
      8. 点击左上绿色 `New transaction` 按钮，打开新交易抽屉。
      9. 点击 `Date` 输入框。
      10. 在 `Date` 输入框中输入 `2026-06-30`。
      11. 点击 `Payee` 输入框。
      12. 在 `Payee` 输入框中输入 `QA Coffee`。
      13. 点击 `Type` 下拉框。
      14. 在 `Type` 下拉框中选择 `Expense`。
      15. 点击 `Amount` 输入框。
      16. 在 `Amount` 输入框中输入 `12.34`。
      17. 点击 `Account` 下拉框。
      18. 在 `Account` 下拉框中选择 `Everyday Checking`。
      19. 点击 `Category` 输入框。
      20. 在 `Category` 输入框中输入 `Dining`。
      21. 勾选 `Cleared` 复选框。
      22. 点击 `Note` 文本框。
      23. 在 `Note` 文本框中输入 `receipt audit`。
      24. 点击抽屉底部 `Save` 按钮，直到交易列表重新显示。
      25. 点击顶部 `Search transactions` 搜索框。
      26. 在搜索框中输入 `QA Coffee`。
      27. 点击新出现的 `QA Coffee` 交易行。
      28. 点击该交易行右侧的 `Edit` 按钮，重新打开交易抽屉。
      29. 点击 `Amount` 输入框并改为 `14.56`。
      30. 点击 `Note` 文本框并改为 `updated memo`。
      31. 点击抽屉底部 `Save` 按钮，直到交易列表重新显示。
      32. 点击顶部 `Search transactions` 搜索框并改为空文本。
      33. 点击左侧 `Accounts` 导航项，进入账户页。
      34. 点击账户页 `Account Register` 区域中的 `High Yield Savings` 下拉框。
      35. 在账户下拉菜单中选择 `High Yield Savings`。
      36. 点击 `Hide reconciled` 按钮。
      37. 点击账户流水表中新交易行的 `C` 状态按钮，切换 cleared 状态。
      38. 点击同一流水行的 `R` 状态按钮，切换 reconciled 状态。
      39. 点击左侧 `Budgets` 导航项，进入预算页。
      40. 点击预算页顶部 `Next` 按钮，切到下一个预算月份。
      41. 点击预算页顶部 `Prev` 按钮，切回原预算月份。
      42. 点击 `Housing` 行的预算金额输入框并改为 `2250`。
      43. 点击 `Dining` 行右侧的 `Fill` 按钮。
      44. 点击预算页右侧 `Add goal` 按钮，打开目标名称弹窗。
      45. 在 `Goal name` 弹窗输入框中输入 `QA Reserve`。
      46. 点击 `Goal name` 弹窗的确认按钮，进入目标金额弹窗。
      47. 点击 `Target amount` 弹窗输入框并改为 `900`。
      48. 点击目标金额弹窗底部的确认按钮，直到目标列表更新。
      49. 点击左侧 `Schedules` 导航项，进入计划交易页。
      50. 点击 `Peak Fitness` 行右侧的 `Skip` 按钮。
      51. 点击 `Northwind Payroll` 行右侧的 `Post now` 按钮。
      52. 点击左侧 `Bills` 导航项，进入账单页。
      53. 点击 `Fiberlane Internet` 账单卡片上的 `Edit` 按钮，打开账单金额弹窗。
      54. 点击 `Bill amount` 弹窗输入框并改为 `84`。
      55. 点击账单金额弹窗底部的保存按钮，保存账单金额。
      56. 点击 `Travel Rewards Card` 账单卡片上的 `Mark paid` 按钮，直到账单卡片更新。
      57. 点击左侧 `Payees` 导航项，进入收款方页。
      58. 点击收款方列表中的 `Brightline Energy` 条目。
      59. 点击右侧详情区的 `Favorite` 按钮。
      60. 点击左侧 `Rules` 导航项，进入规则页。
      61. 点击规则页顶部 `Apply to existing` 按钮。
      62. 点击规则列表中 `market` 规则的 `Run` 按钮。
      63. 点击左侧 `Portfolio` 导航项，进入投资组合页。
      64. 点击投资组合页顶部 `Add holding` 按钮，打开股票代码弹窗。
      65. 在 `Ticker symbol` 弹窗输入框中输入 `QAETF`。
      66. 点击 `Ticker symbol` 弹窗的确认按钮，进入份额弹窗。
      67. 点击 `Shares` 弹窗输入框并改为 `2`。
      68. 点击份额弹窗底部的继续按钮，进入价格弹窗。
      69. 点击 `Current price` 弹窗输入框并改为 `101`。
      70. 点击价格弹窗底部的提交按钮，直到投资组合列表更新。
      71. 点击左侧 `Reports` 导航项，进入报表页并结束任务。
