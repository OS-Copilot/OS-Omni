instruction: Configure the OpenFinance application to conclude with the Reports page visible, incorporating
  a new transaction, updated budget and goal settings, modified account and bill states, and a new portfolio
  holding. The Overview page must display the Last 90 days reporting period with the chart segmented to
  Cash flow. A new transaction must exist in the Transactions list with the date 2026-06-30, payee QA
  Coffee, type Expense, amount 14.56, account Everyday Checking, category Dining, the Cleared checkbox
  selected, and the note updated memo, having been initially created with an amount of 12.34 and the note
  receipt audit. The Budgets page must reflect the original month with the Housing budget amount set to
  2250 and the Dining row filled, alongside a new goal named QA Reserve with a target amount of 900. The
  Accounts page must show the High Yield Savings account register with the Hide reconciled control active,
  where the new transaction row has its C status button toggled to change its cleared state and its R
  status button toggled to change its reconciled state. The Schedules page must show the Peak Fitness
  row skipped and the Northwind Payroll row posted now. The Bills page must display the Fiberlane Internet
  bill amount as 84 and the Travel Rewards Card bill card in a paid state. The Payees page must show the
  Brightline Energy entry with the Favorite button activated in the details area. The Rules page must
  have Apply to existing pressed at the top and the market rule run. The Portfolio page must include a
  new holding with the ticker symbol QAETF, 2 shares, and a current price of 101.
