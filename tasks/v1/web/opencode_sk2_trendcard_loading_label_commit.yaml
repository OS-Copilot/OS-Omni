      from __future__ import annotations

      import json
      import re
      from pathlib import Path
      from typing import Any

      storage_key = "opencode.workspace.v1"
      expected_commit_message = "Fix loading label"
      checks: list[dict[str, Any]] = []

      def add_check(name: str, passed: bool, **extra: Any) -> None:
          item: dict[str, Any] = {"name": name, "passed": bool(passed)}
          item.update(extra)
          checks.append(item)

      def extract_json_objects(text: str, marker: str) -> list[Any]:
          parsed: list[Any] = []
          start = 0
          while True:
              marker_pos = text.find(marker, start)
              if marker_pos < 0:
                  break
              left = text.find("{", marker_pos)
              if left < 0:
                  break
              depth = 0
              in_string = False
              escape = False
              for right in range(left, min(len(text), left + 2_000_000)):
                  ch = text[right]
                  if in_string:
                      if escape:
                          escape = False
                      elif ch == "\\":
                          escape = True
                      elif ch == '"':
                          in_string = False
                      continue
                  if ch == '"':
                      in_string = True
                  elif ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          raw = text[left : right + 1]
                          try:
                              value = json.loads(raw)
                          except Exception:
                              start = marker_pos + len(marker)
                              break
                          if isinstance(value, dict):
                              parsed.append(value)
                          start = right + 1
                          break
              else:
                  start = marker_pos + len(marker)
          return parsed

      def load_opencode_states() -> list[dict[str, Any]]:
          leveldb_dirs = [
              Path("/home/user/.config/google-chrome/Default/Local Storage/leveldb"),
              Path("/home/user/.config/chromium/Default/Local Storage/leveldb"),
              Path("/home/user/snap/chromium/common/chromium/Default/Local Storage/leveldb"),
          ]
          states: list[dict[str, Any]] = []
          for leveldb_dir in leveldb_dirs:
              if not leveldb_dir.exists():
                  continue
              for path in leveldb_dir.iterdir():
                  try:
                      if not path.is_file():
                          continue
                      if path.stat().st_size <= 0 or path.stat().st_size > 20_000_000:
                          continue
                      if path.suffix.lower() not in {"", ".log", ".ldb"}:
                          continue
                      data = path.read_bytes()
                      if storage_key.encode("utf-8") not in data:
                          continue
                      text = data.decode("utf-8", errors="ignore").replace("\x00", "")
                      for value in extract_json_objects(text, storage_key):
                          if isinstance(value.get("files"), dict):
                              states.append({"path": str(path), "mtime": path.stat().st_mtime, "state": value})
                  except Exception:
                      continue
          return states

      state_candidates = load_opencode_states()

      def score_candidate(item: dict[str, Any]) -> tuple[int, float]:
          state = item.get("state") or {}
          files = state.get("files") if isinstance(state.get("files"), dict) else {}
          trend = files.get("src/components/TrendCard.jsx") if isinstance(files.get("src/components/TrendCard.jsx"), dict) else {}
          content = str(trend.get("content") or "")
          git = state.get("git") if isinstance(state.get("git"), dict) else {}
          timeline = git.get("timeline") if isinstance(git.get("timeline"), list) else []
          changes = git.get("changes") if isinstance(git.get("changes"), list) else []
          terminal = state.get("terminal") if isinstance(state.get("terminal"), list) else []
          score = 0
          score += 10 if content else 0
          score += 20 if 'aria-label="Loading"' in content and 'aria-label="Loading "' not in content else 0
          score += 20 if re.search(r"<[^>]*className=[\"']skeleton[\"'][^>]*role=[\"']status[\"']", content, flags=re.DOTALL) else 0
          score += 20 if any(str(item) == "Now " + expected_commit_message for item in timeline) else 0
          score += 10 if not any(isinstance(change, dict) and change.get("path") == "src/components/TrendCard.jsx" for change in changes) else 0
          score += 5 if any("npm run lint" in str(line) for line in terminal) else 0
          return score, float(item.get("mtime") or 0)

      selected = max(state_candidates, key=score_candidate, default=None)
      state = selected.get("state") if selected else {}
      files = state.get("files") if isinstance(state.get("files"), dict) else {}
      trendcard = files.get("src/components/TrendCard.jsx") if isinstance(files.get("src/components/TrendCard.jsx"), dict) else {}
      content = str(trendcard.get("content") or "")
      git = state.get("git") if isinstance(state.get("git"), dict) else {}
      timeline = git.get("timeline") if isinstance(git.get("timeline"), list) else []
      changes = git.get("changes") if isinstance(git.get("changes"), list) else []
      terminal = state.get("terminal") if isinstance(state.get("terminal"), list) else []
      view = str(state.get("view") or "")
      tabs = state.get("tabs") if isinstance(state.get("tabs"), list) else []
      active_file = str(state.get("activeFile") or "")
      assistant = state.get("assistant") if isinstance(state.get("assistant"), list) else []

      add_check("opencode_local_storage_state_found", selected is not None, candidate_count=len(state_candidates), selected_path=selected.get("path") if selected else None)
      add_check("trendcard_state_file_present", bool(content), path="src/components/TrendCard.jsx")
      add_check("loading_label_trimmed", 'aria-label="Loading"' in content or "aria-label='Loading'" in content)
      add_check("loading_label_no_trailing_space", 'aria-label="Loading "' not in content and "aria-label='Loading '" not in content)

      skeleton_blocks = re.findall(r"<[^>]*className=[\"']skeleton[\"'][^>]*>", content, flags=re.DOTALL)
      if not skeleton_blocks:
          skeleton_blocks = re.findall(r"<[^>]*role=[\"']status[\"'][^>]*>", content, flags=re.DOTALL)
      role_on_skeleton = any(
          re.search(r"className=[\"']skeleton[\"']", block) and re.search(r"role=[\"']status[\"']", block)
          for block in skeleton_blocks
      )
      aria_on_skeleton = any(
          re.search(r"className=[\"']skeleton[\"']", block) and re.search(r"aria-label=[\"']Loading[\"']", block)
          for block in skeleton_blocks
      )
      add_check("skeleton_has_role_status", role_on_skeleton, observed_blocks=skeleton_blocks[:3])
      add_check("skeleton_has_trimmed_loading_label", aria_on_skeleton, observed_blocks=skeleton_blocks[:3])
      required_tabs = {
          "src/components/TrendCard.jsx",
          "src/views/RevenueDashboard.jsx",
          "src/hooks/useForecast.js",
          "package.json",
      }
      add_check(
          "required_tabs_opened",
          required_tabs.issubset({str(item) for item in tabs}),
          observed=tabs,
          required=sorted(required_tabs),
      )
      add_check("active_file_is_trendcard", active_file == "src/components/TrendCard.jsx", observed=active_file)
      lint_runs = sum(1 for line in terminal if "npm run lint" in str(line))
      add_check("two_lint_runs_recorded", lint_runs >= 2, observed=terminal, required="at least two npm run lint commands")
      assistant_text = "\n".join(str(item.get("role", "")) + ": " + str(item.get("text", "")) for item in assistant if isinstance(item, dict))
      add_check(
          "copilot_chat_tests_for_loading_recorded",
          "tests for loading" in assistant_text,
          observed=assistant[-8:],
          required="assistant chat history includes the user prompt tests for loading",
      )
      add_check("commit_message_recorded", any(str(item) == "Now " + expected_commit_message for item in timeline), observed=timeline[:8], required="Now " + expected_commit_message)
      add_check(
          "trendcard_no_pending_change_after_commit",
          not any(isinstance(change, dict) and change.get("path") == "src/components/TrendCard.jsx" for change in changes),
          observed=changes,
      )
      add_check("lint_command_recorded", any("npm run lint" in str(line) for line in terminal), observed=terminal[-12:])
      view_evidence = {
          "local_storage_view": view,
          "note": "OpenCode localStorage view can lag behind the visible active sidebar after rapid final navigation; record it as non-blocking metadata rather than durable pass/fail evidence.",
      }

      failures = [check["name"] for check in checks if not check["passed"]]
      payload = {
          "checks": checks,
          "failures": failures,
          "observed": {
              "storage_key": storage_key,
              "candidate_count": len(state_candidates),
              "selected_storage_path": selected.get("path") if selected else None,
              "trendcard_path": "src/components/TrendCard.jsx",
              "trendcard_content_snippet": content[:1200],
              "git_timeline": timeline[:8],
              "git_changes": changes,
              "terminal_tail": terminal[-12:],
              "tabs": tabs,
              "active_file": active_file,
              "assistant_tail": assistant[-8:],
              "view": view_evidence,
          },
          "verifier_rules": [
              "Durable final evidence is the OpenCode web app state saved in Chrome/Chromium Local Storage key opencode.workspace.v1.",
              "The evaluator requires aria-label Loading without a trailing space and rejects aria-label Loading with a trailing space.",
              "The evaluator requires role=\"status\" on the JSX element whose className is skeleton.",
              "The evaluator requires the expected working tabs to have been opened: TrendCard.jsx, RevenueDashboard.jsx, useForecast.js, and package.json.",
              "The evaluator requires TrendCard.jsx to be the active file at the end.",
              "The evaluator requires terminal history to show at least two npm run lint commands.",
