platform: linux
instruction: Create and export a daily shift OpenSheet workbook containing a sales performance table,
  an inventory table, specific formatting, and view settings, saving the final file as a JSON document
  in /home/user/Downloads. The workbook title must be exactly daily shift. The first sheet must contain
  a table with the header row in row 1 containing Product in A1, Target in B1, Sold in C1, Diff in D1,
  and Status in E1. Row 2 must contain Espresso in A2, 80 in B2, 74 in C2, the formula =C2-B2 in D2, and
  watch in E2. Row 3 must contain Sandwich in A3, 45 in B3, 51 in C3, the formula =C3-B3 in D3, and good
  in E3. Row 4 must contain Juice in A4, 55 in B4, 60 in C4, the formula =C4-B4 in D4, and good in E4.
  Row 5 must contain Total in A5, the formula =SUM(B2:B4) in B5, the formula =SUM(C2:C4) in C5, and the
  formula =C5-B5 in D5. Cell A1 must be formatted with bold and center alignment, and cell B2 must be
  formatted as a Number with one decimal place. A chart preview must be generated from the data. A filter
  applied to the Status column for the value watch must be subsequently cleared so that no active filter
  remains in the final state. The grid density must be set to Compact, the panes must be frozen, and the
  zoom level must be set to 125%. A second sheet must exist containing an inventory table with the header
  row in row 1 containing SKU in A1, Item in B1, Stock in C1, and Need in D1, followed by the row in row
  2 containing B-101 in A2, Beans in B2, 18 in C2, and 24 in D2. The Audit formulas action must be triggered.
  The workbook must be exported using the OpenSheet JSON format so that a parseable JSON file named daily-shift*.json
  is saved in /home/user/Downloads containing the workbook title daily shift and the expected cell contents
  from both sheets.
