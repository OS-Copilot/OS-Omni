task_id: linux.openblender.kiosk_arc_animation
platform: linux
instruction: 'Open the OpenBlender application in Chrome from the snap_2 desktop environment and load
  the project file kiosk_scene_v03_lighting.blend from the Recent Files list, then modify the scene objects
  and render settings within the Animation workspace. The object Animated_Cup_Arc must have its Location
  X set to 0.42, Location Y to -0.42, and Location Z to 1.42, with its Rotation Z set to -6, and a keyframe
  for Location and Rotation must be inserted on this object with the timeline positioned at frame 90.
  The object Neon_Menu_Sign must have its Rotation Z set to 5, and a duplicate of this object must exist
  in the scene named MenuGlowA with Location X set to 0.52, Location Y set to 0.22, Location Z set to
  1.60, Scale X set to 1.06, Scale Y set to 1.06, and the material Warm Plastic assigned. A new cube object
  named ArcMarker must be added to the scene with Location X set to -0.75, Location Y set to 0.40, Location
  Z set to 0.35, Rotation Z set to 12, Scale X set to 0.28, Scale Y set to 0.28, and Scale Z set to 0.22,
  with a Bevel modifier applied featuring an Amount of 0.05 and Segments set to 3, and the material Matte
  Rubber assigned. The object Steam_Path_Preview must have its Rotation Z set to 8, Scale X set to 1.10,
  and Scale Y set to 1.10. The render output settings must be configured with the Path set to //kiosk_arc,
  the File Format set to PNG, the Color set to RGBA, and the Compression set to 20, while the render engine
  must be set to Eevee Next. The project must be saved with ArcMarker selected in the Scene Collection,
  the Modifier properties tab open with the Bevel modifier title area visible, and the timeline at frame
  90, ensuring that the objects Animated_Cup_Arc, MenuGlowA, and ArcMarker retain the specified transforms
  and properties. OpenBlender is a web app: open it from the OpenBlender icon in the webpage folder on
  the desktop, which opens it in Chrome.'
