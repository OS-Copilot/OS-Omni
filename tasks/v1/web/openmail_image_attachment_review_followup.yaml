instruction: 'Configure the OpenMail account profile with the display name Anonym Tester, the email address
  anonym-x2024@outlook.com, the option to add a signature to new messages enabled, and the signature text
  exactly Best, Anonym Tester.


  The email with the subject Desk setup image for expense notes, which contains an image attachment, must
  be marked as starred and assigned the Images label. A Reply all to this message must be sent with the
  body text The desk setup image is filed under Images.


  A new email addressed to receipts@railne.example.test with the subject Image attachment review must
  be composed with the priority set to Low and the Images label assigned. The message body must include
  the sentence Please review the saved image evidence before the expense note is closed. and, after being
  saved as a draft and reopened, must have the sentence The signature settings were checked first. appended
  to the end of the existing body text before being sent.


  The sent Image attachment review email must be marked as unread, archived, and then moved back to the
  Inbox, where the Follow up label is applied to it. The task is complete when the detail page for the
  Image attachment review email is visible, displaying the Follow up label and the full message body containing
  both required sentences. OpenMail is a web app: open it from the OpenMail icon in the webpage folder
  on the desktop, which opens it in Chrome.'
