      72. 点击键盘 `Enter`。
      73. 点击 `G6` 单元格。
      74. 点击顶部 `Home`。
      75. 点击 `B` 加粗。
      76. 点击填充颜色并选择浅黄色。
      77. 点击顶部工作簿名称输入框。
      78. 按住 `Ctrl` 并点击键盘 `A` 选中名称。
