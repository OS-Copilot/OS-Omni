      10. 点击表格中的 F1 单元格。
      11. 按住 `Ctrl` 并点击键盘 `A` 选中单元格内容。
      12. 用键盘输入 FY Total。
      13. 点击键盘 `Enter` 确认输入。
      14. 点击表格中的 G1 单元格。
      15. 用键盘输入 Review。
      16. 点击键盘 `Enter` 确认输入。
      17. 点击表格中的 G2 单元格。
      18. 用键盘输入 priority。
      19. 点击键盘 `Enter` 确认输入。
      20. 点击表格中的 G3 单元格。
      21. 用键盘输入 watch。
      22. 点击键盘 `Enter` 确认输入。
      23. 点击表格中的 G4 单元格。
      24. 用键盘输入 growth。
      25. 点击键盘 `Enter` 确认输入。
      26. 点击表格中的 G5 单元格。
      27. 用键盘输入 stable。
      28. 点击键盘 `Enter` 确认输入。
      29. 选择表头区域 `A1:G1`.
      30. 点击顶部 Home 选项卡。
      31. 点击 B 加粗按钮。
      32. 点击 Center 居中按钮。
      33. 点击字体大小下拉框。
      34. 选择 14。
      35. 点击填充颜色方块。
      36. 在颜色选择器中选择一个浅色填充色。
      37. 点击表格中的 F2 单元格。
      38. 点击顶部 Formulas 选项卡。
      39. 点击 SUM 按钮。
      40. 点击公式栏。
      41. 按住 `Ctrl` 并点击键盘 `A` 全选公式栏内容。
      42. 用键盘输入 =SUM(B2:E2)。
      43. 点击键盘 `Enter` 确认公式。
      44. 点击表格中的 F3 单元格。
      45. 点击公式栏。
      46. 按住 `Ctrl` 并点击键盘 `A` 全选公式栏内容。
      47. 用键盘输入 =SUM(B3:E3)。
      48. 点击键盘 `Enter` 确认公式。
      49. 点击表格中的 G2 单元格。
      50. 点击Insert按钮，点击 Note 按钮。
      51. 在弹出的备注输入框中输入 qa note。
      52. 点击弹窗中的 OK。
      53. 点击顶部 Data 选项卡。
      54. 点击表格中的 A1 单元格。
      55. 点击 Filter 按钮。
      56. 在筛选弹窗中输入 Aster。
      57. 点击弹窗中的 OK。
      58. 点击顶部 Page Layout 选项卡。
      59. 点击 Freeze panes 按钮。
      60. 点击 Print area 按钮。
      61. 点击顶部导出格式下拉框，选择 HTML table。
      62.点击`Export`，打开下载成功的文件夹.
      63. 将文件重命名为 `quarterly-sales-aster-review.html` 作为导出文件名。.
      64. 点击Save即可完成 HTML 表格的导出操作。
      65.点击Data
      66.点击筛选弹窗中OK
      67. 点击工作表中的 `G6` 单元格。
      68. 输入 `reviewed`。
      69. 点击 `F6` 单元格。
