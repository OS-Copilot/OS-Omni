instruction: 'Produce a completed receipt review workflow in the OpenMail application consisting of a
  sent reply, a sent forward, a sent labeled and starred email, a discarded draft, and a final open message
  view.


  The reply to the email titled "Receipt PDF for order 4268" from the contact Northline Market must contain
  the body text "Northline receipt is ready for review." The forward of the email "Platform reference
  image for RN-2041" from the contact Railway Northeast must be addressed to "receipts@northline.example.test"
  and contain the body text "Rail platform reference for the receipt review." The email to the contact
  RideShare must have the subject "RideShare receipt question", the priority set to Low, the Travel label
  applied, and the body text "Can you confirm the ride receipt for the travel folder? Please reply with
  the receipt number." This email must exist in the Sent folder, retain the Travel label, and be starred.
  A draft addressed to the contact Northline Market with the subject "Northline contact note" and the
  body "Contact card compose route verified for receipts." must be discarded so that it no longer exists
  in the Drafts folder. The interface must conclude on the detail page of the "Platform reference image
  for RN-2041" message from the contact Railway Northeast, with the search query "RN-2041" remaining in
  the search box. OpenMail is a web app: open it from the OpenMail icon in the webpage folder on the desktop,
  which opens it in Chrome.'
