      6. 点击包列表顶部的第一行数据包，直到下方详情区域切换到 DNS 相关内容。
      7. 点击 `Domain Name System` 分组行展开 DNS 查询详情。
      8. 点击 `Queries` 条目行查看域名查询内容。
      9. 点击 `Internet Protocol` 分组行查看源地址和目的地址。
      10. 点击 `User Datagram Protocol` 分组行查看 DNS 端口信息。
      11. 选择包字节区域的 `ASCII` 标签。
      12. 选择包字节区域的 `Hex` 标签。
      13. 点击统计面板里的 `Endpoints` 按钮。
      14. 点击统计面板里的 `Conversations` 按钮。
      15. 点击右侧 `Expert Information` 按钮。
      16. 关闭 `Expert Information` 对话框。
      17. 点击专家面板里的 `Clear` 按钮，直到 `EXPERT` 列表清空。
      18. 选择左侧保存过滤器 `Checkout HTTP` 卡片。
      19. 打开包列表里的 `GET /checkout HTTP/1.1` 行。
      20. 点击详情区域中显示 `GET /checkout HTTP/1.1` 的 `Hypertext Transfer Protocol` 分组行。
      21. 点击 `Host` 条目行查看请求主机。
      22. 点击 `User-Agent` 条目行查看客户端标识。
      23. 点击详情区域中显示 `Src Port` 和 `Dst Port` 的 `Transmission Control Protocol` 分组行。
      24. 选择包字节区域的 `ASCII` 标签。
      25. 选择包字节区域的 `Bits` 标签。
      26. 点击统计面板里的 `Protocol Hierarchy` 按钮。
      27. 点击统计面板里的 `IO Graph` 按钮。
      28. 打开右侧分析操作里的 `Decode As` 按钮。
      29. 关闭 `Decode As` 对话框。
      30. 打开包列表里的 `HTTP/1.1 200 OK` 行。
      31. 点击详情区域中显示 `HTTP/1.1 200 OK` 的 `Hypertext Transfer Protocol` 分组行。
      32. 点击 `Content-Type` 条目行查看响应类型。
      33. 点击 `Content-Length` 条目行查看响应长度。
      34. 选择包字节区域的 `ASCII` 标签。
      35. 打开右侧分析操作里的 `Coloring Rules` 按钮。
      36. 关闭 `Coloring Rules` 对话框。
      37. 选择左侧保存过滤器 `Initial SYN` 卡片。
      38. 点击包列表里的第一条 TCP SYN 数据包行。
      39. 点击详情区域中显示 SYN 信息的 `Transmission Control Protocol` 分组行。
      40. 点击 `Flags` 条目行查看 SYN 标志。
      41. 点击 `Window size value` 条目行查看窗口大小。
      42. 点击 `Internet Protocol` 分组行查看握手源和目的地址。
      43. 选择包字节区域的 `Hex` 标签。
      44. 选择包字节区域的 `ASCII` 标签。
      45. 点击统计面板里的 `Conversations` 按钮。
      46. 点击统计面板里的 `Endpoints` 按钮。
      47. 点击右侧 `Expert Information` 按钮。
      48. 关闭 `Expert Information` 对话框。
      49. 在 `Display Filter` 输入框中输入 `tcp.port == 80`。
      50. 点击 `Apply` 按钮，直到包列表显示 HTTP 与 TCP 记录。
      51. 打开包列表里的 `POST /api/cart/confirm` 行。
