    source_instruction: |-
      1. 点击“Account”标签，打开乘客账户页面。
      2. 点击“Wallet”按钮，展开钱包与支付方式区域。
      3. 点击“Saved places”按钮，展开常用地点列表。
      4. 点击“Ride”标签，返回行程规划页面。
      5. 点击 Work 行左半侧带旗帜图标的“Work”按钮，使 Destination 位置显示 Meta MPK 23。
      6. 点击路线卡片右上角的圆形向下箭头，展开已计算路线的行程面板。
      7. 点击“Add stop”按钮，为本次路线增加一个途经点。
      8. 点击“Stanford University, Stanford, CA”匹配项，将其设为途经点。
      9. 向上滑动行程面板，直到页面显示“Choose a ride”标题和车型报价列表。
      10. 点击“Choose a ride”区域中写有“Green”和“Hybrid or electric”的整行车型卡片。
      11. 点击“Payment”按钮，打开支付方式弹窗。
      12. 点击“PayPal rider@example.com”选项，切换本次行程支付方式。
      13. 点击报价区域底部的“Choose Green”蓝色按钮，提交第一笔叫车请求并进入活动行程。
      14. 点击“Safety”标签，打开本次行程的安全与支持页面。
      15. 点击“Share trip”按钮，打开行程分享界面。
      16. 点击“Close”按钮，关闭行程分享界面并返回安全页面。
      17. 点击“Active”标签，返回活动行程页面。
      18. 点击“Cancel ride”按钮，直接取消第一笔活动行程并进入“Ride canceled”结果页。
      19. 点击“Done”按钮，关闭第一笔取消结果页。
      20. 点击“Account”标签，打开乘客账户页面。
      21. 点击“Ride”标签，开始规划第二笔行程。
      22. 点击 Home 行左半侧带旗帜图标的“Home”按钮，使 Destination 位置显示 Downtown Palo Alto。
      23. 点击路线卡片右上角的圆形向下箭头，展开第二笔行程面板。
      24. 点击写有“Green”和“Hybrid or electric”的整行车型卡片，选择绿色车型。
      25. 点击“Payment”按钮，打开第二笔行程的支付方式弹窗。
      26. 点击“Visa ending 4242”选项，选择银行卡支付。
      27. 点击“RideXL”车型卡片，比较多人车型的报价。
      28. 点击“Priority pickup”车型卡片，比较优先接驾报价。
      29. 点击“Green”车型卡片，最终选择绿色车型。
      30. 点击“Choose Green”按钮，提交第二笔叫车请求。
      31. 点击“Active”标签，打开第二笔活动行程详情。
      32. 点击“Safety”标签，打开第二笔行程的安全页面。
      33. 点击“Share trip”按钮，打开行程分享界面。
      34. 点击“Close”按钮，关闭行程分享界面。
      35. 点击“Ride PIN”按钮，打开行程验证码信息。
      36. 点击“Close”按钮，关闭验证码信息。
      37. 点击“Active”标签，返回第二笔活动行程。
      38. 向上滑动活动行程页面，完整显示“Cancel ride”按钮。
      39. 点击“Cancel ride”按钮，直接取消第二笔活动行程并进入“Ride canceled”结果页。
      40. 点击“Done”按钮，关闭第二笔取消结果页。
      41. 点击“Account”标签，打开乘客账户页面。
      42. 点击“History”标签，打开行程历史列表。
      43. 点击 Downtown Palo Alto 到 Meta MPK 23 的已完成订单卡片。
      44. 向上滑动订单详情，显示退款操作区域。
      45. 点击同一订单中的“Request refund”按钮，打开退款表单。
      46. 点击“Reason”输入框。
      47. 输入`Fare review`作为退款原因。
      48. 点击“Submit request”按钮，提交费用复核申请。
      49. 点击“History”标签，重新打开行程历史列表。
      50. 点击 Stanford University 到 Stanford Shopping Center 的订单卡片。
      51. 点击该订单中的“Request refund”按钮，打开另一笔订单的退款表单。
      52. 点击“Reason”输入框。
      53. 输入`Fare review`作为复核原因。
      54. 点击“Submit request”按钮，提交第二笔费用复核申请。
      55. 点击“Safety”标签，打开安全与支持页面。
      56. 点击“Message”输入框。
      57. 输入`Blue umbrella`作为工单内容。
      58. 点击“Create support ticket”按钮，创建遗失物品工单。
      59. 点击新工单中的“Reply to ticket”按钮，打开回复编辑区。
      60. 点击回复输入框。
      61. 输入`Rear seat`补充遗失位置。
      62. 点击“Send reply”按钮，提交工单回复。
      63. 点击“History”标签，返回行程历史列表。
      64. 点击 Downtown Palo Alto 到 Meta MPK 23 的订单卡片。
      65. 向上滑动订单详情，最终停留在含退款状态的操作区域。
