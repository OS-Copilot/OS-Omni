    source_instruction: |-
      1. 点击“Account”标签，进入乘客账户页面。
      2. 点击“Saved places”按钮，展开常用地点列表。
      3. 点击“Wallet”按钮，展开钱包与支付方式区域。
      4. 点击“Add card”按钮，打开新增银行卡弹窗。
      5. 点击弹窗底部的同名提交按钮，保存页面当前显示的 Visa ending 1111。
      6. 点击新出现的“Set default payment”按钮，将 Visa ending 1111 设为默认支付方式。
      7. 点击“Ride”标签，返回行程规划页面。
      8. 点击“History”标签，打开历史订单页面。
      9. 点击“Account”标签，重新打开账户页面。
      10. 点击“Wallet”按钮，展开钱包区域。
      11. 向上滑动钱包页面，显示 Visa ending 1111 的默认支付标记。
      12. 点击“History”标签，打开历史订单列表。
      13. 点击 Meta MPK 23 到 Downtown Palo Alto 的已完成订单卡片。
      14. 向上滑动订单详情，显示退款操作区域。
      15. 点击订单中的“Request refund”按钮，打开退款表单。
      16. 点击退款表单内的 Reason 输入框。
      17. 输入`Fare review`作为复核原因。
      18. 点击“Submit request”按钮，提交费用复核申请。
      19. 点击“Ride”标签，返回行程规划页面。
      20. 点击 School 行左半侧带旗帜图标的“School”按钮，使 Destination 位置显示 Stanford University。
      21. 点击路线卡片右上角的圆形向下箭头，展开行程规划面板。
      22. 点击“Add stop”按钮，新增路线途经点。
      23. 点击“Downtown Palo Alto, CA”匹配项，将其设为途经点。
      24. 向上滑动行程面板，直到页面显示“Choose a ride”标题和车型报价列表。
      25. 点击“Choose a ride”区域中写有“Green”和“Hybrid or electric”的整行车型卡片。
      26. 点击报价卡片旁的 Payment 按钮，打开支付方式弹窗。
      27. 点击“PayPal rider@example.com”选项，切换为 PayPal。
      28. 点击“Payment”按钮，再次打开支付方式弹窗。
      29. 点击“Visa ending 1111”选项，切回新建的默认卡。
      30. 向上滑动报价面板，完整显示叫车提交按钮。
      31. 点击报价区域底部的“Choose Green”蓝色按钮，提交第一笔叫车请求。
      32. 点击“Active”标签，进入第一笔活动行程页面。
      33. 点击顶部的 Safety 标签，打开第一笔行程的安全页面。
      34. 点击安全页面中的 Share trip 按钮，打开行程分享界面。
      35. 点击分享界面的 Close 按钮，关闭行程分享界面。
      36. 点击底部的 Active 标签，返回第一笔活动行程页面。
      37. 点击“Cancel ride”按钮，直接取消第一笔活动行程并进入取消结果页。
      38. 点击“Done”按钮，关闭取消结果页。
      39. 点击“Account”标签，打开乘客账户页面。
      40. 点击“Safety”标签，进入安全与客服页面。
      41. 点击“Ride PIN”按钮，打开行程验证码信息。
      42. 点击“Close”按钮，关闭验证码信息并返回安全页面。
      43. 点击“Message”输入框。
      44. 输入`Card charged`作为客服内容。
      45. 点击“Create support ticket”按钮，创建支付问题工单。
      46. 点击“Ride PIN”按钮，打开行程验证码信息。
      47. 点击“Close”按钮，关闭验证码信息。
      48. 点击“Account”标签，打开乘客账户页面。
      49. 点击“Saved places”按钮，展开常用地点列表。
      50. 点击“Wallet”按钮，展开钱包与支付方式区域。
      51. 将 PayPal rider@example.com 设为默认支付方式。
      52. 点击“Ride”标签，返回行程规划页面。
      53. 点击“History”标签，打开历史订单页面。
      54. 点击“Safety”标签，打开安全与客服页面。
      55. 点击“Message”输入框。
      56. 输入`Fare follow-up`作为第二条客服内容。
      57. 点击“Create support ticket”按钮，创建费用跟进工单。
      58. 点击“History”标签，打开历史订单列表。
      59. 点击 Stanford Shopping Center 到 Downtown Palo Alto 的订单卡片。
      60. 点击该订单中的“Request refund”按钮，打开退款表单。
      61. 点击退款表单内的 Reason 输入框。
      62. 输入`Fare review`作为复核原因。
      63. 点击“Submit request”按钮，提交第二笔费用复核申请。
      64. 点击“Account”标签，打开乘客账户页面。
