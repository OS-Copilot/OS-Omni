instruction: |-
  Manage the OpenDriver passenger account's payment methods, ride and refund records, and support requests, leaving the Account page active. The Wallet should include a newly saved Visa card ending in 1111; set it as the default for the ride work, and make PayPal rider@example.com the default again afterward. The history should contain refund requests for the completed Meta MPK 23 to Downtown Palo Alto and Stanford Shopping Center to Downtown Palo Alto orders, each with the reason `Fare review`.

  Request a Green ride, described as Hybrid or electric, to Stanford University using the School saved place and Downtown Palo Alto, CA as a stop. The payment choice should be checked against PayPal rider@example.com before the ride is submitted with Visa ending 1111. The resulting active ride should have its Share trip view reviewed and then be cancelled, leaving no active ride from that request. The Safety area should have its Ride PIN information reviewed twice and contain two support tickets with the exact messages `Card charged` and `Fare follow-up`. Leave the passenger account page visible with PayPal rider@example.com as the default payment method.
