  to “benchchat@example.test” that includes the photo thumbnail showing a group selfie at an airport entrance
  as an attachment. The fourth message must be a new email addressed to “ops4@mail.test” with the subject
  “Field water note” and the body “Wells are marked.” The fifth message must be a reply to the email with
  the subject “FieldReply0708” with the body text “Depths check out.” and must include the photo thumbnail
  showing two people holding orange boxes as an attachment. The sixth message must be a new email addressed
  to “ops4@mail.test” with the subject “Field soil note” and the body “Soil set is filed.” The seventh
  message must be a new email addressed to “ops4@mail.test” with the subject “Field safety brief” and
  the body “Rules were issued.” The eighth message must be a reply to the email with the subject “FieldShare0708”
  with the body text “Share was granted.” and must include the photo thumbnail showing multiple people
  cooking around a table as an attachment. The ninth and final message must be a forward of the email
  with the subject “FieldTrash0708” to “benchchat@example.test” with the body text “Keep this record.”
  and the subject line must be modified to append the text “ · retain” to the end of the original subject.
