      21. 向上拖动航班结账页，使“Traveler”可见。
      22. 轻点“Traveler”。
      23. 选择“Maya Chen”。
      24. 轻点“Cabin”。
      25. 选择“Economy”。
      26. 向上拖动航班结账表单，使“Extra baggage”可见。
      27. 轻点“Extra baggage”。
      28. 选择“Add 32kg checked bag/$96”。
      29. 轻点“Contact phone”。
      30. 输入“13900008326”。
      31. 轻点“Payment”。
      32. 选择“Bank Card”。
      33. 轻点“Note”输入框。
      34. 输入“Crew connection”。
      35. 轻点“Confirm Booking”，创建仅由 Maya Chen 乘坐 NR2269 / HL8058 的联程航班订单。
      36. 轻点确认页顶部导航中的“Search”返回首页。
      37. 轻点首页搜索卡片中的“Hotels”。
      38. 轻点“Check-in”输入框。
      39. 输入“2026-06-13”。
      40. 轻点“Sort”。
      41. 选择“Top rated”。
      42. 轻点 Hotels 表单的“Country”。
      43. 选择“China”。
      44. 轻点“Guests”输入框。
      45. 点按数字键盘上的“1”，将 Guests 人数设为一人。
      46. 轻点“City”。
      47. 选择“Sanya”。
      48. 轻点“Check-out”输入框。
      49. 输入“2026-06-14”。
      50. 轻点“Search Hotels”，查找供 Lucas Lin 于 2026-06-13 至 2026-06-14 入住的酒店。
      51. 向上拖动酒店结果列表，使 Sanya Seabreeze Residence 卡片完整可见。
