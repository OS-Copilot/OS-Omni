      55. 向上拖动酒店结账页，使“Room”可见。
      56. 轻点“Room”。
      57. 选择“Deluxe Twin Room · $150 · 2 guests”。
      58. 轻点“Guests”输入框。
      59. 点按数字键盘上的“1”，将 Guests 人数设为一人。
      60. 轻点“Contact phone”。
      61. 输入“13900002026”。
      62. 向上拖动使“Payment”可见。
