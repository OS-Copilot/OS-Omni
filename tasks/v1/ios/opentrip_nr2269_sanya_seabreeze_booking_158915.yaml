instruction: Create a flight booking and a hotel booking in OpenTrip for the specified travelers and dates.
  The flight booking must be for the North River Air + Harbor Link NR2269 / HL8058 connecting itinerary
  from Shanghai (SHA) to Sanya (SYX) on 2026-06-12 in Economy cabin, sorted by Lowest price, with Maya
  Chen as the sole traveler. On the flight checkout, keep the cabin as Economy, add the “Add 32kg checked
  bag/$96” extra baggage option, enter the contact phone number 13900008326, select Bank Card as the payment
  method, and enter the note “Crew connection” before confirming the booking. The hotel booking must be
  for the Sanya Seabreeze Residence Deluxe Twin Room for one guest, Lucas Lin, with a check-in date of
  2026-06-13 and a check-out date of 2026-06-14. Search hotels in Sanya, China, sorted by Top rated, and
  select the Deluxe Twin Room · $150 · 2 guests option while setting the guest count to 1. On the hotel
  checkout, enter the contact phone number 13900002026, select WeChat Pay as the payment method, and enter
  the note “Sew view please” before confirming the booking.
