    source_instruction: |
      1. 点击首页的“Import Photo”。
      2. 点击照片选择器区域内两位女士各提橙色水桶的合影照片。

      3. 点击“Brightness”调整项。
      4. 将“Brightness”滑块向右拖到可见数值 6，适度提亮深色服装区域而不冲淡人物面部。
      5. 点击“Contrast”调整项。
      6. 将“Contrast”滑块向左拖到可见数值 -5，缓和黑色衣物里的成片暗部。
      7. 向左滑动编辑器类别栏，露出“Crop”。
      8. 点击“Crop”类别。
      9. 点击“Width”裁剪项。
      10. 将“Width”滑块拖到可见数值 66，为双人和橙色水桶保留横向空间。
      11. 点击“Height”裁剪项。
      12. 将“Height”滑块拖到可见数值 88，裁去上下空白并形成主封面。
      13. 点击顶部“Save”，提交社区活动主封面成片。
      14. 点击顶部“Back”，返回首页以导入协作现场卡素材。
      15. 点击首页的“Import Photo”。
      16. 点击照片选择器区域内多人围着蓝色大碗的活动现场照片。

      17. 点击“Brightness”调整项。
      18. 将“Brightness”滑块向右拖到可见数值 10，提亮棚内人物和蓝色大碗。
      19. 向左滑动编辑器类别栏，露出“HSL”。
      20. 点击“HSL”类别。
      21. 向左滑动 HSL 通道行，露出“Green”。
      22. 点击“Green”通道。
      23. 将“Green”滑块向左拖到可见数值 -18，压低绿色棚顶对人物肤色造成的偏色。
      24. 向左滑动编辑器类别栏，露出“Filters”。
      25. 点击“Filters”类别。
      26. 点击“Clean”滤镜，让协作过程和器具边缘保持清晰。
      27. 向左滑动编辑器类别栏，露出“Crop”。
      28. 点击“Crop”类别。
      29. 点击“Width”裁剪项。
      30. 将“Width”滑块拖到可见数值 88，保留围绕蓝色大碗的主要参与者。
      31. 点击“Height”裁剪项。
      32. 将“Height”滑块拖到可见数值 88，压缩棚顶与地面空白并形成方形现场卡。
      33. 点击顶部“Save”，提交社区活动协作现场卡成片。
      34. 点击顶部“Back”，返回首页以导入交流现场卡素材。
      35. 点击首页的“Import Photo”。
      36. 点击照片选择器区域内多人围着白色碗交流的现场照片。
      37. 向左滑动编辑器类别栏，露出“HSL”。
      38. 点击“HSL”类别。
      39. 向左滑动 HSL 通道行，露出“Green”。
      40. 点击“Green”通道。
      41. 将“Green”滑块向左拖到可见数值 -20，降低棚顶和衣物带来的明显绿色偏色。
      42. 点击“Cyan”通道。
      43. 将“Cyan”滑块向左拖到可见数值 -8，收敛青色反光并突出白色碗。
      44. 向左滑动编辑器类别栏，露出“Filters”。
      45. 点击“Filters”类别。
      46. 点击“Cream”滤镜，用轻微暖调统一同一场地的纪实画面。
      47. 向左滑动编辑器类别栏，露出“Crop”。
      48. 点击“Crop”类别。
      49. 点击“Width”裁剪项。
      50. 将“Width”滑块拖到可见数值 68，完整保留围绕白色碗的五位参与者。
      51. 点击“Height”裁剪项。
      52. 将“Height”滑块拖到可见数值 88，去除多余棚顶并形成方形交流卡。
      53. 点击顶部“Save”，提交社区活动交流现场卡成片。
      54. 点击顶部“Back”，返回首页以导入志愿者人物卡素材。
      55. 点击首页的“Import Photo”。
      56. 点击照片选择器区域内头巾女士与同伴自拍的照片。
      57. 点击“Portrait”类别。
      58. 点击“Smooth”调整项。
      59. 将“Smooth”滑块向右拖到可见数值 10，只做轻度面部柔化并保留纪实质感。
      60. 向右滑动编辑器类别栏，使“Edit”重新进入可点区域。
      61. 点击“Edit”类别。
      62. 向左滑动“Edit”调整项行，露出“Saturation”。
      63. 点击“Saturation”调整项。
      64. 将“Saturation”滑块向右拖到可见数值 6，补足自拍原图偏低的整体色彩。
      65. 向左滑动编辑器类别栏，露出“Filters”。
      66. 点击“Filters”类别。
      67. 点击“Portrait”滤镜，保持志愿者人物卡的自然人像风格。
      68. 向左滑动编辑器类别栏，露出“Crop”。
      69. 点击“Crop”类别。
      70. 点击“Width”裁剪项。
      71. 将“Width”滑块拖到可见数值 84，保留前景人物及后方两位同伴。
      72. 点击“Height”裁剪项。
      73. 将“Height”滑块拖到可见数值 88，裁去上方空白并形成方形人物构图。
      74. 点击顶部“Save”，提交社区活动志愿者人物卡成片。
