    source_instruction: |
      1. 在首页“Retouch Studio”区域点击“Import Photo”。
      2. 点击照片选择器区域内侧倾白红彩绘小丑照片。
      3. 在画布下方的类别栏中点击“Edit”。
      4. 点击“Brightness”调整项。
      5. 将“Brightness”滑块向右拖到可见数值 12，提亮被黑色服装包围的侧倾面部。
      6. 向左滑动编辑器类别栏，露出“HSL”。
      7. 点击“HSL”类别。
      8. 向左滑动 HSL 通道行，露出“Green”。
      9. 点击“Green”通道。
      10. 将“Green”滑块向左拖到可见数值 -12，减弱绿色头发对红蓝面部彩绘的干扰。
      11. 向左滑动编辑器类别栏，露出“Filters”。
      12. 点击“Filters”类别。
      13. 点击“Film”滤镜，为实验戏剧主视觉保留颗粒感和舞台气质。
      14. 向左滑动编辑器类别栏，露出“Crop”。
      15. 点击“Crop”类别。
      16. 点击“Width”裁剪项。
      17. 将“Width”滑块拖到可见数值 65，保留侧倾头部与领口轮廓。
      18. 点击“Height”裁剪项。
      19. 将“Height”滑块拖到可见数值 90，形成适合主视觉发布的构图。
      20. 点击顶部“Save”，提交实验戏剧方形主视觉成片。
      21. 点击顶部“Back”，返回首页以导入第二角色海报素材。
      22. 在首页“Retouch Studio”区域点击“Import Photo”。
      23. 点击照片选择器区域内蓝红彩绘小丑照片。
      24. 点击“Brightness”调整项。
      25. 将“Brightness”滑块向右拖到可见数值 14，提升原图较暗的面部与西装层次。
      26. 向左滑动编辑器类别栏，露出“HSL”。
      27. 点击“HSL”类别。
      28. 向左滑动 HSL 通道行，露出“Cyan”。
      29. 点击“Cyan”通道。
      30. 将“Cyan”滑块向左拖到可见数值 -10，降低背景青色偏色并保留红蓝妆面。
      31. 向左滑动编辑器类别栏，露出“Filters”。
      32. 点击“Filters”类别。
      33. 点击“Clean”滤镜，让扑克牌、手套和面部彩绘边缘保持清晰。
      34. 向左滑动编辑器类别栏，露出“Crop”。
      35. 点击“Crop”类别。
      36. 点击“Width”裁剪项。
      37. 将“Width”滑块拖到可见数值 63，保留举牌手势和上半身。
      38. 点击“Height”裁剪项。
      39. 将“Height”滑块拖到可见数值 91。
      40. 点击顶部“Save”，提交实验戏剧第二角色海报成片。
      41. 点击顶部“Back”，返回首页以导入实验轮廓节目卡素材。
      42. 在首页“Retouch Studio”区域点击“Import Photo”。
      43. 点击照片选择器区域内右侧白色轮廓实验图。
      44. 点击“Brightness”调整项。
      45. 将“Brightness”滑块向左拖到可见数值 -18，压回大面积高光并显出更多轮廓边界。
      46. 点击“Contrast”调整项。
      47. 将“Contrast”滑块向左拖到可见数值 -10，避免黑白区域继续堵死成纯色块。
      48. 向左滑动编辑器类别栏，露出“Filters”。
      49. 点击“Filters”类别。
      50. 点击“Night”滤镜，为黑白轮廓建立实验节目卡的冷暗基调。
      51. 向左滑动编辑器类别栏，露出“Crop”。
      52. 点击“Crop”类别。
      53. 点击“Width”裁剪项。
      54. 将“Width”滑块拖到可见数值 57，集中保留人物头部。
      55. 点击“Height”裁剪项。
      56. 将“Height”滑块拖到可见数值 100。
      57. 点击顶部“Save”，提交实验轮廓节目卡成片。
      58. 点击顶部“Back”，返回首页以导入对谈单元宣传卡素材。
      59. 在首页“Retouch Studio”区域点击“Import Photo”。
      60. 点击照片选择器区域内黄粉分割背景两位西装男士交谈拼接照片。
      61. 点击“Contrast”调整项。
      62. 将“Contrast”滑块向右拖到可见数值 8，增强人物与低反差分割背景之间的层次。
      63. 向左滑动“Edit”调整项行，露出“Saturation”。
      64. 点击“Saturation”调整项。
      65. 将“Saturation”滑块向左拖到可见数值 -8，避免黄粉背景盖过对谈人物。
      66. 向左滑动编辑器类别栏，露出“Crop”。
      67. 点击“Crop”类别。
      68. 点击“Width”裁剪项。
      69. 将“Width”滑块拖到可见数值 68，保留两侧对谈人物和中间分割线。
      70. 点击“Height”裁剪项。
      71. 将“Height”滑块拖到可见数值 88。
      72. 点击顶部“Save”，提交对谈单元宣传卡成片。
