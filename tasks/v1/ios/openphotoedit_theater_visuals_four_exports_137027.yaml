task_id: ios.openphotoedit.theater_visuals_four_exports_137027
platform: ios
instruction: Import and edit four distinct photos in the OpenPhotoEdit app, saving each as a separate
  export. The first export is the photo of the tilted clown with white and red face paint, which must
  have a Brightness value of 12 in the Edit category, a Green channel value of -12 in the HSL category,
  the Film filter applied in the Filters category, and a Width of 65 and Height of 90 in the Crop category.
  The second export is the photo of the clown with blue and red face paint, which must have a Brightness
  value of 14 in the Edit category, a Cyan channel value of -10 in the HSL category, the Clean filter
  applied in the Filters category, and a Width of 63 and Height of 91 in the Crop category. The third
  export is the experimental image featuring a white outline on the right side, which must have a Brightness
  value of -18 and a Contrast value of -10 in the Edit category, the Night filter applied in the Filters
  category, and a Width of 57 and Height of 100 in the Crop category. The fourth export is the split photo
  of two men in suits talking against a yellow and pink background, which must have a Contrast value of
  8 and a Saturation value of -8 in the Edit category, and a Width of 68 and Height of 88 in the Crop
  category. All four images must be saved as separate exports upon completion.
