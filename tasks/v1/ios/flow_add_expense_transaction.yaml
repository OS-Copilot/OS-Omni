task_id: ios.flow.add_expense_transaction
platform: ios
instruction: "In Flow, create a new expense transaction on the Bench Checking account. Set the title to Bench Coffee Beans, the amount to 18.40, the category to Bench Coffee, and the note to For tomorrow's tasting session."
init:
  initializer_id: initializers.ios.flow_seed_open_app:FlowSeedOpenAppInitializer
  params:
    bundle_id: mn.flow.flow
    seed_spec:
      accounts:
        - name: "Bench Checking"
          currency: "USD"
          icon: "card"
        - name: "Bench Cash"
          currency: "USD"
          icon: "cash"
        - name: "Bench Savings"
          currency: "USD"
          icon: "savings"
          exclude_from_total_balance: true
      categories:
        - name: "Bench Coffee"
        - name: "Bench Transport"
          icon: "transport"
        - name: "Bench Groceries"
          icon: "groceries"
        - name: "Bench Income"
          icon: "income"
      opening_balances:
        - account: "Bench Checking"
          amount: 500.00
          title: "Bench Checking Opening Balance"
          day_offset: -2
        - account: "Bench Cash"
          amount: 80.00
          title: "Bench Cash Opening Balance"
          day_offset: -2
        - account: "Bench Savings"
          amount: 300.00
          title: "Bench Savings Opening Balance"
          day_offset: -2
    wait_ms: 1200
evaluation:
  evaluator_id: evaluators.ios.flow_state:FlowStateEvaluator
  params:
    assert_spec:
      present_transactions:
        - type: "expense"
          title: "Bench Coffee Beans"
          description: "For tomorrow's tasting session."
          amount: -18.40
          account: "Bench Checking"
          category: "Bench Coffee"
      transaction_count: 4
    timeout_seconds: 10
    poll_interval_seconds: 0.5
limits:
  max_steps: 300
  step_timeout_seconds: 180
metadata:
  tags: [finance, flow, ios, expense, transaction, simple, benchmark]
  app: Flow
  app_bundle_id: mn.flow.flow
  description: "Create one expense transaction in Flow with the required title, amount, category, and note."
  prerequisites:
    - "Flow is installed on the simulator."
