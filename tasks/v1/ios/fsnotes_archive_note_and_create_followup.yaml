task_id: ios.fsnotes.archive_note_and_create_followup
platform: ios
instruction: >
  In FSNotes, create a folder named Bench Archive. Move the note Launch Retrospective Draft into
  that folder, rename it to Launch Retrospective Final, and append this exact section at the end
  of the note:
  ## Decisions
  - Send recap by noon
  - Confirm postmortem room
  Then create a new note in the root named Bench Follow-up Log with these two lines exactly:
  Owner: Ops
  Status: Waiting on room reply
  Leave the other notes unchanged.
init:
  initializer_id: initializers.ios.fsnotes_seed_open_app:FSNotesSeedOpenAppInitializer
  params:
    bundle_id: co.fluder.mobile.FSNotes-iOS
    seed_spec:
      purge_all_notes: true
      notes:
        - path: "Launch Retrospective Draft.md"
          content: |
            Launch retrospective notes.

            - Review shipping delays
            - Collect support themes
        - path: "Team Contacts.md"
          content: |
            PM: Alex
            QA: Sam
        - path: "Snack Ideas.md"
          content: |
            Fruit cups
            Sparkling water
    wait_ms: 1200
evaluation:
  evaluator_id: evaluators.ios.fsnotes_state:FSNotesStateEvaluator
  params:
    assert_spec:
      note_count: 4
      folder_count: 1
      present_folders:
        - "Bench Archive"
      present_notes:
        - path: "Bench Archive/Launch Retrospective Final.md"
          content_ends_with: |
            ## Decisions
            - Send recap by noon
            - Confirm postmortem room
          content_contains:
            - "Launch retrospective notes."
            - "- Review shipping delays"
            - "- Collect support themes"
            - "## Decisions"
            - "- Send recap by noon"
            - "- Confirm postmortem room"
        - path: "Bench Follow-up Log.md"
          exact_content: |
            Owner: Ops
            Status: Waiting on room reply
        - path: "Team Contacts.md"
          exact_content: |
            PM: Alex
            QA: Sam
        - path: "Snack Ideas.md"
          exact_content: |
            Fruit cups
            Sparkling water
      absent_notes:
        - path: "Launch Retrospective Draft.md"
        - title: "Launch Retrospective Draft"
    timeout_seconds: 10
    poll_interval_seconds: 0.5
limits:
  max_steps: 300
  step_timeout_seconds: 180
metadata:
  tags: [ios, fsnotes, notes, folder, move, rename, create, edit, hard, benchmark]
  app: FSNotes
  app_bundle_id: co.fluder.mobile.FSNotes-iOS
  description: >
    Create a folder, archive and rename a seeded note, append a required section, and create a
    new follow-up note in FSNotes.
  prerequisites:
    - "FSNotes is installed on the simulator."
