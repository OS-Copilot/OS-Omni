instruction: Sign in to the OpenDriver application using the Driver role with the email driver@example.com
  and the password Password123! to access the driver workspace for Maya Rodriguez. The Money section must
  contain a payout request for 95.00 with the note Moring payout. The Work section must reflect a driver
  status set to online before generating passenger requests. Reject the first generated request and accept the
  second, then leave that accepted trip open while completing the remaining steps. The Support section must
  include
  a new support ticket created in the Driver safety and support area with the message Pickup support help.
  The Account section must display an updated Driver onboarding profile with the license number NY-DL-100492,
  vehicle make Tesla, vehicle model Model Y, vehicle year 2023, plate 8XJR214, and color Pearl White,
  saved for review. The Driver documents area must contain a submitted Driver license document with the
  Document ID DL-2026-2048 and an expiration date of 2028-06-30. The application session must be terminated
  so that no active session remains for the driver. Logging out cancels this seeded account's active trip;
  the accepted ride must retain its acceptedAt history and the final driver status must be online.
