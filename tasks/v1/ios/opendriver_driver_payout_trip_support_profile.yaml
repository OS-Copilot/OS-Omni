    source_instruction: |-
      1. 在桌面点击opendriver图标，启动opendriver。
      2. 点击登录表单顶部的 Driver 角色页签。
      3. 点击 Driver 登录表单中的 Email 输入框。
      4. 键入 driver@example.com。
      5. 点击 Driver 登录表单中的 Password 输入框。
      6. 键入 Password123!。
      7. 点击蓝色 Login 按钮，打开 Maya Rodriguez 司机工作区。
      8. 点击司机导航栏中的 Money 页签。
      9. 在 Money 页面向下滚动到 Payouts 区域。
      10. 点击 Payouts 卡片中的 Amount 输入框。
      11. 按 Command+A 清空 Amount 输入框。
      12. 键入 95.00。
      13. 点击 Payouts 卡片中的 Note 输入框。
      14. 按 Command+A 清空 Note 输入框。
      15. 键入 Moring payout。
      16. 点击 Payouts 卡片底部的 Request payout 按钮。
      17. 点击司机导航栏中的 Work 页签。
      18. 点击 Go offline，将接单状态切换为离线。
      19. 点击 Go online，将接单状态切换为在线。
      20. 点击 Create sample request，生成第一条乘客请求。
      21. 点击请求卡片中的 Reject。
      22. 点击 Generate request now，生成第二条乘客请求。
      23. 点击第二条请求卡片中的 Accept trip。
      24. 点击 Open trip，打开当前行程面板。
      25. 点击司机导航栏中的 Support 页签。
      26. 点击 Driver safety and support 区域的 Message 文本框。
      27. 按 Command+A 清空 Support 页面的 Message 文本框。
      28. 键入 Pickup support help.。
      29. 点击 Message 文本框下方的 Create support ticket 按钮。
      30. 在 Support 页面向下滚动到新建的工单卡片。
      31. 点击司机导航栏中的 Account 页签。
      32. 点击 Driver onboarding 表单的 License number 输入框。
      33. 按 Command+A 清空 License number 输入框。
      34. 键入 NY-DL-100492。
      35. 点击 Driver onboarding 表单的 Vehicle make 输入框。
      36. 按 Command+A 清空 Vehicle make 输入框。
      37. 键入 Tesla。
      38. 点击 Driver onboarding 表单的 Vehicle model 输入框。
      39. 按 Command+A 清空 Vehicle model 输入框。
      40. 键入 Model Y。
      41. 点击 Driver onboarding 表单的 Vehicle year 输入框。
      42. 按 Command+A 清空 Vehicle year 输入框。
      43. 键入 2023。
      44. 点击 Driver onboarding 表单的 Plate 输入框。
      45. 按 Command+A 清空 Plate 输入框。
      46. 键入 8XJR214。
      47. 点击 Driver onboarding 表单的 Color 输入框。
      48. 按 Command+A 清空 Color 输入框。
      49. 键入 Pearl White。
      50. 点击 Driver onboarding 表单底部的 Save profile for review。
      51. 在 Account 页面向下滚动到 Driver documents 区域。
      52. 点击 Driver documents 中的文档类型下拉菜单。
      53. 点击 Driver license。
      54. 点击 Document ID 输入框。
      55. 按 Command+A 清空 Document ID 输入框。
      56. 键入 DL-2026-2048。
      57. 点击 Expires at 输入框。
      58. 按 Command+A 清空 Expires at 输入框。
      59. 键入 2028-06-30。
      60. 点击 Submit document，提交驾驶证文档。
      61. 点击司机导航栏中的 Money 页签。
      62. 在 Money 页面向下滚动至 Payouts 卡片。
      63. 点击司机导航栏中的 Support 页签。
      64. 点击窗口右上方的退出登录图标，返回 OpenDriver 登录页。
