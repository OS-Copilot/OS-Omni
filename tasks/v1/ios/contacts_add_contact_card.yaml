task_id: ios.contacts.add_contact_card
platform: ios
instruction: >
  In Contacts, create a new contact with first name Bench and last name Courier. Set the company
  (Organization field) to Bench Logistics, the phone number to 555-010-2486, and the email
  address to courier@bench-example.test.
init:
  initializer_id: initializers.ios.contacts_seed_open_app:ContactsSeedOpenAppInitializer
  params:
    bundle_id: com.apple.MobileAddressBook
    purge_all_contacts: true
    seed_contacts: []
    wait_ms: 1200
evaluation:
  evaluator_id: evaluators.ios.contacts_state:ContactsStateEvaluator
  params:
    exact_count: 1
    present_contacts:
      - first_name: "Bench"
        last_name: "Courier"
        organization: "Bench Logistics"
        phones: ["555-010-2486"]
        emails: ["courier@bench-example.test"]
        exact_phones: true
        exact_emails: true
    timeout_seconds: 8
    poll_interval_seconds: 0.5
limits:
  max_steps: 300
  step_timeout_seconds: 180
metadata:
  tags: [contacts, ios, native, create, simple, benchmark]
  app: Contacts
  app_bundle_id: com.apple.MobileAddressBook
  description: "Create one new contact card with a company, phone number, and email address."
