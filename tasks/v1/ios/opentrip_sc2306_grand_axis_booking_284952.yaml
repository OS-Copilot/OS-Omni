    source_instruction: |
      1. 点按首页搜索卡片中的“Flights”。
      2. 点按 Flights 表单的“Date”输入框。
      3. 输入“2026-06-12”。
      4. 点按“Cabin”。
      5. 选择“Economy”。
      6. 点按“From country”。
      7. 选择“China”。
      8. 点按“From city”。
      9. 选择“Shanghai (SHA)”。
      10. 点按“Sort”。
      11. 选择“Recommended”。
      12. 点按“To country”。
      13. 选择“China”。
      14. 点按“To city”。
      15. 选择“Sanya (SYX)”。
      16. 点按“Search Flights”搜索 Lucas Lin 从上海前往三亚的直飞航班。
      17. 向上滑动航班结果列表，使 Silver Comet SC2306 卡片的“Details”完整可见。
      18. 点按 Silver Comet SC2306 卡片的“Details”。
      19. 向上滑动 SC2306 详情页，使“Book”按钮可见。
      20. 点按“Book”进入 SC2306 的预订页。
      21. 再向上滑动预订页，使“Traveler”“Cabin”和“Extra baggage”字段可见。
      22. 点按“Traveler”。
      23. 选择“Lucas Lin · ID Card”。
      24. 点按“Cabin”。
      25. 选择“Economy”。
      26. 点按“Extra baggage”。
      27. 选择“Add 32kg checked bag / $96”。
      28. 向上滑动航班预订页，使“Contact phone”和“Payment”字段可见。
      29. 点按“Contact phone”输入框。
      30. 输入“13900002020”。
      31. 点按“Payment”。
      32. 选择“Alipay · Fast mobile payment”。
      33. 向上滑动航班预订页，使“Note”输入框可见。
      34. 点按“Note”输入框。
      35. 输入“Direct trip”。
      36. 点按键盘的“Done”收起键盘。
      37. 向上滑动预订页，使“Confirm Booking”按钮可见。
      38. 点按“Confirm Booking”创建 Lucas Lin 的 SC2306 经济舱直飞订单。
      39. 点按确认页顶部导航栏的“Search”进入新的行程搜索。
      40. 点按首页搜索卡片中的“Hotels”。
      41. 点按 Hotels 表单的“Guests”输入框。
      42. 点按数字键盘上的“2”，将 Guests 人数设为两人。
      43. 点按“Check-in”输入框。
      44. 输入“2026-06-12”。
      45. 点按“Country”。
      46. 选择“China”。
      47. 点按“City”。
      48. 选择“Sanya”。
      49. 点按“Sort”。
      50. 选择“Recommended”。
      51. 点按“Check-out”输入框。
      52. 输入“2026-06-13”。
      53. 点按“Search Hotels”，为 Lucas Lin 与已在三亚的同行人搜索住宿。
      54. 再向上滑动酒店结果列表，使 Sanya Grand Axis Residence 卡片的“Details”完整可见。
      55. 点按 Sanya Grand Axis Residence 卡片的“Details”。
      56. 点按酒店详情页的“Book”进入该酒店的预订页。
      57. 向上滑动酒店预订页，使“Room”“Guests”和“Contact phone”字段可见。
      58. 点按“Room”。
      59. 选择“Deluxe Twin Room · $120 · 2 guests”。
      60. 点按“Guests”输入框。
      61. 点按数字键盘上的“2”，将 Guests 人数设为两人。
      62. 点按“Contact phone”输入框。
      63. 输入“13900002020”。
      64. 向上滑动酒店预订页，使“Payment”和“Note”字段可见。
      65. 点按“Payment”。
      66. 选择“WeChat Pay · Scan or authorize payment”。
      67. 点按“Note”输入框。
      68. 输入“Late check-in”。
      69. 向上滑动酒店预订页，使“Confirm Booking”按钮可见。
      70. 点按“Confirm Booking”，为 Lucas Lin 与已在三亚的同行人创建 Sanya Grand Axis Residence 双人酒店订单。
