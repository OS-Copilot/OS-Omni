task_id: ios.calendar.finalize_schedule_with_two_followups
platform: ios
instruction: >
  In Calendar, update today's event Bench Outreach Briefing Draft so the title becomes
  Bench Outreach Briefing Final, the time becomes 16:40-17:25, and the location becomes
  Cedar Room. Delete the event Bench Outreach Draft Hold. Then create two new follow-up
  events: one for tomorrow titled Bench Outreach Supply Pickup from 08:45-09:15 at Market Hall,
  and one for the day after tomorrow titled Bench Outreach Debrief from 18:10-18:50 at Cedar Room.
  Leave Bench Commute unchanged. All times are device-local wall-clock times. The final
  Calendar must contain exactly these four events - Bench Outreach Briefing Final,
  Bench Outreach Supply Pickup, Bench Outreach Debrief, and Bench Commute - and no
  other events.
init:
  initializer_id: initializers.ios.calendar_seed_open_app:CalendarSeedOpenAppInitializer
  params:
    bundle_id: com.apple.mobilecal
    purge_all_events: true
    disable_subscribed_calendars: true
    purge_summaries:
      - "Bench Outreach Briefing Draft"
      - "Bench Outreach Briefing Final"
      - "Bench Outreach Draft Hold"
      - "Bench Outreach Supply Pickup"
      - "Bench Outreach Debrief"
      - "Bench Commute"
    seed_events:
      - summary: "Bench Outreach Briefing Draft"
        day_offset: 0
        start_time: "15:30"
        end_time: "16:00"
        location: "Birch Room"
      - summary: "Bench Outreach Draft Hold"
        day_offset: 0
        start_time: "17:40"
        end_time: "18:00"
        location: "Lobby"
      - summary: "Bench Commute"
        day_offset: 0
        start_time: "18:30"
        end_time: "18:50"
        location: "Station"
    wait_ms: 1500
evaluation:
  evaluator_id: evaluators.ios.calendar_event_state:CalendarEventStateEvaluator
  params:
    visible_calendars_only: true
    present_events:
      - summary: "Bench Outreach Briefing Final"
        day_offset: 0
        start_time: "16:40"
        end_time: "17:25"
        location: "Cedar Room"
      - summary: "Bench Outreach Supply Pickup"
        day_offset: 1
        start_time: "08:45"
        end_time: "09:15"
        location: "Market Hall"
      - summary: "Bench Outreach Debrief"
        day_offset: 2
        start_time: "18:10"
        end_time: "18:50"
        location: "Cedar Room"
      - summary: "Bench Commute"
        day_offset: 0
        start_time: "18:30"
        end_time: "18:50"
        location: "Station"
        exact_description: true
    absent_summaries:
      - "Bench Outreach Briefing Draft"
      - "Bench Outreach Draft Hold"
    exact_count: 4
    timeout_seconds: 10
    poll_interval_seconds: 0.5
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [calendar, ios, native, productivity, multi_step, hard, benchmark]
  app: Calendar
  app_bundle_id: com.apple.mobilecal
  description: "Finalize one seeded calendar event, delete another, and create two follow-up events across two future days."
  prerequisites:
    - "The iOS Calendar app is available in the simulator."
