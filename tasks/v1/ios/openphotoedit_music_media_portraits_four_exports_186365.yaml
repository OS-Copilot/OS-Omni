    source_instruction: |
      1. 轻点首页“Retouch Studio”区域的“Import Photo”。
      2. 在系统照片选择器区域轻点蓝绿色电吉他特写缩略图。

      3. 轻点基础调整行里的“Brightness”。
      4. 将“Brightness”滑块向右拖到界面读数 10，提亮黑色服装旁的琴体暗部。
      5. 沿编辑器工具分类条向左滑动，使“HSL”进入可点区域。
      6. 轻点“HSL”标签打开色彩通道面板。
      7. 在 HSL 通道行向左滑动，使“Cyan”显示出来。
      8. 轻点 HSL 通道行中的“Cyan”。
      9. 将“Cyan”滑块向左拖到界面读数 -10，收敛原图已经很强的蓝绿色琴面。
      10. 继续向左滑动工具分类条，使“Filters”进入可点区域。
      11. 轻点“Filters”标签打开滤镜列表。
      12. 轻点滤镜列表里的“Clean”预设，让琴弦、拾音器和琴面纹理保持清晰。
      13. 点击“Crop”类别。
      14. 轻点裁剪面板中的“Width”参数行。
      15. 将“Width”滑块拖到面板读数 58，收紧左右边缘并突出完整琴体。
      16. 轻点裁剪面板中的“Height”参数行。
      17. 将“Height”滑块拖到面板读数 89，
      18. 轻点右上角“Save”，提交独立音乐人媒体包的乐器识别图成片。
      19. 轻点顶部导航栏的“Back”，回到首页进入影棚肖像导入链。
      20. 在首页“Retouch Studio”区域轻点“Import Photo”。
      21. 从系统照片选择器区域轻点灰色影棚白衣女士缩略图。
      22. 轻点工具分类条中的“Portrait”。

      23. 将“Smooth”滑块向右拖到界面读数 8，只做轻度柔化并保留真实皮肤纹理。
      24. 向左滑动工具分类条，使“HSL”进入可点区域。
      25. 轻点“HSL”标签打开色彩通道面板。
      26. 轻点 HSL 通道行中的“Orange”。
      27. 将“Orange”滑块向左拖到界面读数 -5，降低面部原有的轻微暖色。
      28. 轻点 HSL 通道行中的“Yellow”。
      29. 将“Yellow”滑块向左拖到界面读数 -4，让白色服装和灰色影棚背景保持中性。
      30. 沿工具分类条向左滑动，使“Filters”进入可点区域。
      31. 轻点“Filters”标签打开滤镜列表。
      32. 轻点滤镜列表里的“Portrait”预设，统一媒体包的正式影棚质感。
      33. 点击“Crop”类别。
      34. 轻点裁剪面板中的“Width”参数行。
      35. 将“Width”滑块拖到面板读数 51，
      36. 轻点裁剪面板中的“Height”参数行。
      37. 将“Height”滑块拖到面板读数 90。
      38. 轻点右上角“Save”，提交影棚媒体肖像成片。
      39. 轻点顶部“Back”，回到首页进入暗调采访肖像导入链。
      40. 轻点首页中的“Import Photo”入口。
      41. 在系统照片选择器区域轻点暗窗黑衣胡须男士缩略图。

      42. 轻点基础调整行里的“Brightness”。
      43. 将“Brightness”滑块向右拖到界面读数 14，打开原图大面积黑色衣物和暗窗阴影。
      44. 轻点基础调整行里的“Contrast”。
      45. 将“Contrast”滑块向左拖到界面读数 -8，保留面部与黑衣之间的过渡层次。
      46. 沿编辑器工具分类条向左滑动，使“Filters”进入可点区域。
      47. 轻点“Filters”标签打开滤镜列表。
      48. 轻点滤镜列表里的“Film”预设，保持采访肖像的克制暗调和纪实感。
      49. 点击“Crop”类别。
      50. 轻点裁剪面板中的“Width”参数行。
      51. 将“Width”滑块拖到面板读数 53，保留人物双肩和左侧窗光。
      52. 轻点裁剪面板中的“Height”参数行。
      53. 将“Height”滑块拖到面板读数 90。
      54. 轻点右上角“Save”，提交暗调采访肖像成片。
      55. 轻点顶部“Back”，回到首页进入明亮媒体肖像导入链。
      56. 在首页轻点“Import Photo”入口。
      57. 从系统照片选择器区域轻点亮窗灰衣短发男士缩略图。

      58. 在基础调整行向左滑动，使“Saturation”“Temperature”和“Sharpen”显示出来。
      59. 轻点基础调整行中的“Saturation”。
      60. 将“Saturation”滑块向右拖到界面读数 5，补回亮窗原图偏低的综合色彩。
      61. 轻点基础调整行中的“Temperature”。
      62. 将“Temperature”滑块向左拖到界面读数 -4，校正窗光下略暖的肤色和针织衫。
      63. 继续向左滑动基础调整行，使“Sharpen”进入可点区域。
      64. 轻点基础调整行中的“Sharpen”。
      65. 将“Sharpen”滑块向右拖到界面读数 6，轻度强化发丝和眼部细节。
      66. 沿编辑器工具分类条向左滑动，使“Filters”进入可点区域。
      67. 轻点“Filters”标签打开滤镜列表。
      68. 轻点滤镜列表里的“Clean”预设，保持明亮媒体肖像的清爽风格。
      69. 点击“Crop”类别。
      70. 轻点裁剪面板中的“Width”参数行。
      71. 将“Width”滑块拖到面板读数 63，收紧左右边缘。
      72. 轻点裁剪面板中的“Height”参数行。
      73. 将“Height”滑块拖到面板读数 89。
      74. 轻点右上角“Save”，提交明亮媒体肖像成片。
