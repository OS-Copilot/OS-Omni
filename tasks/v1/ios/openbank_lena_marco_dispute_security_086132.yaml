instruction: |-
  Create two new recipients in the Transfer money section of OpenBank, initiate two specific transfers, file a dispute on one of those transfers, and configure security alerts and card controls. The first recipient record must contain the Name "Lena Wu", Account number "0000007766", Routing number "021000089", Bank "OpenBank", and Nickname "Design split". The second recipient record must contain the Name "Marco Li", Account number "0000007767", Routing number "021000089", Bank "OpenBank", and Nickname "Studio rent". Both recipients must be saved.

  Two transfer records must be submitted from the "Everyday Checking ••••2381" account. The first transfer is to Lena Wu with the Memo "Design split", the Amount "4.20", and the Date "2026-06-01". The second transfer is to Marco Li with the Memo "Studio rent" and the Amount "1.25".

  A dispute must be filed against the "Transfer to Marco Li" entry, which is identified in the Activity section by searching for "Studio rent" with the Category filter set to "Transfer", the Status filter set to "Posted", and the Time filter set to "Last 30 days". The dispute form for this specific entry must have "Unknown rent debit" entered in the Details field and must be submitted.

  The Security section must reflect specific notification and card states. In the "Large purchase" form, the "Push" notification switch must be off. In the "Low balance" form, the "Text" notification switch must be on. In the "Payment due" form, the "Text" notification switch must be on. The "Upcoming bill" alert in the alerts list must be marked as read. The "OpenBank Rewards Card" in the Card controls section must be locked.
