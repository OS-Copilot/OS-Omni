    source_instruction: |
      1. 点击顶部导航栏的“Profile”。
      2. 向上滑动，使订单号为“OT-SEED-HOTEL-2”的 Shanghai Riverlight Suites 卡片完整可见。
      3. 点击该 Completed 酒店卡片中的“Write review”。
      4. 向下滑动页面，使展开的“Write review”表单可见。
      5. 点击“Rating”。
      6. 选择“5.0 / 5”。
      7. 点击“Review”输入框。
      8. 输入“Clean river room”。
      9. 点击“Submit Review”提交 Shanghai Riverlight Suites 的 5.0/5 评价。
      10. 向上滑动页面，使顶部导航栏的“Search”可见。
      11. 点击顶部导航栏的“Search”进入行程搜索页。
      12. 点击搜索卡片中的“Flights”。
      13. 点击 Flights 表单的“From country”。
      14. 选择“China”。
      15. 点击“From city”。
      16. 选择“Shanghai (SHA)”。
      17. 点击“To country”。
      18. 选择“China”。
      19. 点击“To city”。
      20. 选择“Sanya (SYX)”。
      21. 点击“Date”输入框。
      22. 输入“2026-06-12”。
      23. 点击键盘上的“Done”。
      24. 点击“Cabin”。
      25. 选择“Business”。
      26. 点击“Sort”。
      27. 选择“Recommended”。
      28. 点击“Search Flights”搜索上海至三亚的商务舱航班。
      29. 向上滑动航班结果，使 Harbor Link HL2195 卡片完整可见。
      30. 点击 Harbor Link HL2195 卡片的“Details”。
      31. 向上滑动航班详情页，使“Book”按钮可见。
      32. 点击“Book”进入 HL2195 预订页。
      33. 向上滑动，使“Traveler”“Cabin”和“Extra baggage”字段可见。
      34. 点击“Traveler”。
      35. 选择“Maya Chen · Passport”。
      36. 点击“Cabin”。
      37. 选择“Business”。
      38. 点击“Extra baggage”。
      39. 选择“Add 23kg checked bag / $68”。
      40. 点击“Contact phone”。
      41. 输入“13900002026”。
      42. 点击“Payment”。
      43. 选择“Bank Card · Credit or debit card”。
      44. 点击“Note”输入框。
      45. 输入“Aisle seat meal”。
      46. 向上滑动预订页，使“Confirm Booking”按钮可见。
      47. 点击“Confirm Booking”创建 Maya Chen 的 HL2195 商务舱订单。
      48. 点击确认页顶部导航栏的“Search”。
      49. 点击搜索卡片中的“Hotels”。
      50. 点击 Hotels 表单的“Guests”输入框。
      51. 输入“4”。
      52. 点击“Search Hotels”，按表单已有的 China、Sanya、2026-06-12 至 2026-06-13 和 Recommended 条件搜索酒店。
      53. 向上滑动酒店结果，使 Sanya Cloud Terrace Boutique Stay 卡片完整可见。
      54. 点击该酒店卡片的“Details”。
      55. 点击酒店详情页的“Book”。
      56. 向上滑动，使“Room”“Guests”和“Contact phone”字段可见。
      57. 点击“Room”。
      58. 选择“Family Suite · $345 · 4 guests”。
      59. 点击“Guests”输入框。
      60. 输入“3”。
      61. 点击“Contact phone”。
      62. 输入“13900002027”。
      63. 点击“Payment”。
      64. 选择“WeChat Pay · Scan or authorize payment”。
      65. 点击“Note”输入框。
      66. 输入“Late arrival 21:00”。
      67. 向上滑动预订页，使“Confirm Booking”按钮可见。
      68. 点击“Confirm Booking”创建 Cloud Terrace Family Suite 三人酒店订单。
      69. 向下滑动找到“Sanya Seabreeze Resort”。
      70. 点击“Sanya Seabreeze Resort”中的View details。
      71. 向下滑动找到“Guests”输入框。
      72. 点击“Guests”输入框。
      73. 输入“1”。
      74. 点击Reschedule按钮。
