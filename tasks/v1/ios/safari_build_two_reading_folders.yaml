task_id: ios.safari.build_two_reading_folders
platform: ios
instruction: >
  In Safari, open each of these pages in its own tab:
  https://example.com/?bench=safari-delta,
  https://example.org/?bench=safari-epsilon,
  https://example.net/?bench=safari-zeta,
  and https://example.edu/?bench=safari-eta.
  Create two bookmark folders named Bench Research Queue and Bench Follow-up.
  Save the delta page in Bench Research Queue with the title Bench Delta Brief,
  save the epsilon page in Bench Research Queue with the title Bench Epsilon Brief,
  save the eta page in Bench Follow-up with the title Bench Eta Follow-up,
  do not bookmark the zeta page, close the zeta tab, and leave the eta page open in the active tab.
init:
  initializer_id: initializers.ios.safari_prepare_open_app:SafariPrepareOpenAppInitializer
  params:
    bundle_id: com.apple.mobilesafari
    purge_all_tabs: true
    purge_history_urls:
      - "https://example.com/?bench=safari-delta"
      - "https://example.org/?bench=safari-epsilon"
      - "https://example.net/?bench=safari-zeta"
      - "https://example.edu/?bench=safari-eta"
    purge_bookmark_urls:
      - "https://example.com/?bench=safari-delta"
      - "https://example.org/?bench=safari-epsilon"
      - "https://example.net/?bench=safari-zeta"
      - "https://example.edu/?bench=safari-eta"
    purge_bookmark_titles:
      - "Bench Delta Brief"
      - "Bench Epsilon Brief"
      - "Bench Eta Follow-up"
    purge_folder_titles:
      - "Bench Research Queue"
      - "Bench Follow-up"
    terminate_after_setup: true
    wait_ms: 1000
evaluation:
  evaluator_id: evaluators.ios.safari_state:SafariStateEvaluator
  params:
    bundle_id: com.apple.mobilesafari
    present_history_urls:
      - "https://example.com/?bench=safari-delta"
      - "https://example.org/?bench=safari-epsilon"
      - "https://example.net/?bench=safari-zeta"
      - "https://example.edu/?bench=safari-eta"
    present_folders:
      - title: "Bench Research Queue"
      - title: "Bench Follow-up"
    present_bookmarks:
      - title: "Bench Delta Brief"
        url: "https://example.com/?bench=safari-delta"
        parent_title: "Bench Research Queue"
      - title: "Bench Epsilon Brief"
        url: "https://example.org/?bench=safari-epsilon"
        parent_title: "Bench Research Queue"
      - title: "Bench Eta Follow-up"
        url: "https://example.edu/?bench=safari-eta"
        parent_title: "Bench Follow-up"
    absent_bookmark_urls:
      - "https://example.net/?bench=safari-zeta"
    absent_tab_urls:
      - "https://example.net/?bench=safari-zeta"
    present_tabs:
      - url: "https://example.com/?bench=safari-delta"
      - url: "https://example.org/?bench=safari-epsilon"
      - url: "https://example.edu/?bench=safari-eta"
    active_tab_url: "https://example.edu/?bench=safari-eta"
    require_foreground: true
    timeout_seconds: 12
    poll_interval_seconds: 0.5
limits:
  max_steps: 300
  step_timeout_seconds: 180
metadata:
  tags: [safari, ios, browser, tabs, bookmarks, hard, benchmark]
  app: Safari
  app_bundle_id: com.apple.mobilesafari
  description: "Open four Safari tabs, organize three bookmarks into two folders, close the unneeded tab, and finish on the target page."
  prerequisites:
    - "Safari is available in the simulator."
