    source_instruction_sha256: fb1ee9e057e9ba3a500a2f31f484b411c76b7bf4039cc36acb627b4b883d5e3d
    source_instruction: |
      1. 在首页轻点“Import Photo”入口。
      2. 在系统照片选择器区域轻点“林间背景长发女士”缩略图。
      3. 沿编辑器工具分类条向左滑动，使“Crop”进入可点区域。
      4. 轻点分类条里的“Crop”标签打开裁剪面板。
      5. 轻点裁剪面板中的“Width”参数行。
      6. 将宽度滑块拖到界面读数 64，轻微收紧左右边缘并保留人物肩部。
      7. 轻点裁剪面板中的“Height”参数行。
      8. 将高度滑块拖到界面读数 93。
      9. 沿工具分类条向左滑动，使“HSL”进入可点区域。
      10. 轻点分类条里的“HSL”标签打开色彩面板。
      11. 在色彩通道条上向左滑动，显示“Green”和“Cyan”。
      12. 选择“Green”色彩通道。
      13. 将“Green”滑块向左拖到界面读数 -10，减弱林地背景对面部主体的竞争。
      14. 选择“Cyan”色彩通道。
      15. 将“Cyan”滑块向左拖到界面读数 -6，收敛背景中零散的青色亮斑。
      16. 轻点右上角“Save”，提交户外生活方式品牌的林地人物主图成片。
      17. 轻点顶部导航栏的“Back”，回到首页进入户外人物专题导入链。
      18. 在首页轻点“Import Photo”入口。
      19. 从系统照片选择器区域轻点“水泥墙前短卷发女士”缩略图。
      20. 横向滑动工具分类条，定位到“Crop”。
      21. 轻点“Crop”标签进入裁剪工具。
      22. 轻点“Width”参数行。
      23. 将宽度滑块拖到画面数值 51，保留人物双肩并压缩侧边门框。
      24. 轻点“Height”参数行。
      25. 将高度滑块拖到画面数值 90。
      26. 轻点工具分类条中的“Portrait”。
      27. 轻点人像工具里的“Smooth”。
      28. 将柔肤滑块向右拖到画面数值 8，仅弱化局部皮肤起伏并保留雀斑。
      29. 向左滑动工具分类条，使“HSL”出现。
      30. 轻点“HSL”进入通道调整。
      31. 轻点“Orange”通道。
      32. 将“Orange”滑块向左拖到画面数值 -5，收敛原图略暖的肤色。
      33. 向左滑动工具分类条，使“Filters”出现。
      34. 轻点“Filters”进入滤镜列表。
      35. 轻点滤镜列表里的“Portrait”预设，统一户外人物专题的人像质感。
      36. 轻点右上角“Save”，提交户外人物专题成片。
      37. 轻点顶部导航栏的“Back”，回到首页进入水景产品背景导入链。
      38. 在首页轻点“Import Photo”入口。
      39. 从系统照片选择器区域轻点“林间岩石瀑布”缩略图。
      40. 沿工具分类条向左滑动到“Crop”可见位置。
      41. 轻点“Crop”标签打开裁剪工具。
      42. 轻点“Width”参数行。
      43. 将宽度滑块拖到可见读数 89，保留瀑布主体与两侧苔藓岩石。
      44. 轻点“Height”参数行。
      45. 将高度滑块拖到可见读数 70，裁去上下冗余并形成水景背景。
      46. 轻点工具分类条中的“Edit”。
      47. 轻点基础调整里的“Brightness”。
      48. 将亮度滑块向右拖到可见读数 14，打开原图较暗的林下阴影和水流层次。
      49. 向左滑动工具分类条，定位到“Filters”。
      50. 轻点“Filters”打开滤镜预设。
      51. 轻点“Clean”预设，使水流与苔藓细节适合作为产品背景。
      52. 轻点右上角“Save”，提交水景产品背景成片。
      53. 轻点顶部导航栏的“Back”，回到首页进入山湖品牌封面导入链。
      54. 在首页轻点“Import Photo”入口。
      55. 从系统照片选择器区域轻点“雪峰森林与湖泊”缩略图。
      56. 横向滑动工具分类条，定位到“Crop”。
      57. 轻点“Crop”标签进入裁剪面板。
      58. 轻点“Width”参数行。
      59. 将宽度滑块拖到面板读数 89，保留左侧日落、雪峰和湖面倒影。
      60. 轻点“Height”参数行。
      61. 将高度滑块拖到面板读数 72，形成山湖品牌封面。
      62. 横向滑动工具分类条，定位到“HSL”。
      63. 轻点“HSL”打开色彩通道面板。
      64. 在色彩通道条上向左滑动，显示“Yellow”和“Green”。
      65. 轻点“Yellow”通道。
      66. 将黄色通道滑块向左拖到面板读数 -8，压低原图已经很强的金色日落。
      67. 轻点“Green”通道。
      68. 将绿色通道滑块向左拖到面板读数 -10，避免高饱和森林抢过雪峰主体。
      69. 轻点“Edit”打开基础调整面板。
      70. 轻点基础调整里的“Contrast”。
      71. 将对比度滑块向左拖到面板读数 -6，保留云层和湖面高光细节。
      72. 轻点基础调整里的“Saturation”。
      73. 将饱和度滑块向左拖到面板读数 -12，修正原图过强的整体色彩。
      74. 轻点右上角“Save”，提交山湖品牌横版封面成片。
