task_id: ios.openphotoedit.outdoor_brand_four_exports_memory_enhanced_429078
platform: ios
instruction: Import and edit four distinct photos in the photo editing application, saving each finished
  image before returning to the home screen to begin the next import. The first image, a photo of a long-haired
  woman against a forest background, must be cropped to a width of 64 and a height of 93 with the subject's
  shoulders remaining visible, have its HSL Green channel reduced to -10 and Cyan channel reduced to -6
  to tone down the forest background and scattered cyan highlights, and be saved as the main outdoor lifestyle
  brand portrait. The second image, a photo of a woman with short curly hair standing in front of a concrete
  wall, must be cropped to a width of 51 and a height of 90 keeping both shoulders in frame while compressing
  the side door frame, have a Smooth portrait effect applied at a level of 8 to soften skin texture while
  preserving freckles, have its HSL Orange channel adjusted to -5 to correct the slightly warm skin tone,
  have the Portrait filter preset applied to unify the aesthetic, and be saved as the outdoor portrait
  feature image. The third image, a photo of a forest rock waterfall, must be cropped to a width of 89
  and a height of 70 retaining the main waterfall and the mossy rocks on both sides while removing excess
  space above and below, have its Brightness increased to 14 to reveal details in the dark forest shadows
  and water flow, have the Clean filter preset applied to enhance the water and moss details suitable
  for a product background, and be saved as the water scene product background. The fourth image, a photo
  of a snow-capped mountain, forest, and lake, must be cropped to a width of 89 and a height of 72 preserving
  the sunset on the left, the snow peaks, and the lake reflection, have its HSL Yellow channel reduced
  to -8 to lower the intensity of the golden sunset and Green channel reduced to -10 to prevent the high-saturation
  forest from overpowering the snow peaks, have its Contrast reduced to -6 and Saturation reduced to -12
  in the basic Edit adjustments to retain cloud and lake highlight details and correct the overly strong
  overall color, and be saved as the mountain lake brand landscape cover.
