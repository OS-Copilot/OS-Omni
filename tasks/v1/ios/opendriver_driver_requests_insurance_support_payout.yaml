    source_instruction: |-
      1. 在桌面点击opendriver图标，启动opendriver。
      2. 点击登录表单顶部的 Driver 角色页签。
      3. 点击 Driver 登录表单中的 Email 输入框。
      4. 键入 driver@example.com。
      5. 点击 Driver 登录表单中的 Password 输入框。
      6. 键入 Password123!。
      7. 点击蓝色 Login 按钮，进入 Maya Rodriguez 司机工作区。
      8. 点击司机导航栏中的 Work 页签。
      9. 点击 Generate request now，生成第一条可接请求。
      10. 点击请求卡片中的 Reject。
      11. 点击 Create sample request，生成第二条可接请求。
      12. 点击第二条请求卡片中的 Accept trip。
      13. 点击 Open trip，进入当前行程面板。
      14. 点击司机导航栏中的 Account 页签。
      15. 点击司机资料表单第一行的 License number 输入框。
      16. 按 Command+A 清空 License number 输入框。
      17. 键入 NY-DL-100492。
      18. 点击司机资料表单中的 Vehicle make 输入框。
      19. 按 Command+A 清空 Vehicle make 输入框。
      20. 键入 Tesla。
      21. 点击司机资料表单中的 Vehicle model 输入框。
      22. 按 Command+A 清空 Vehicle model 输入框。
      23. 键入 Model Y。
      24. 点击司机资料表单中的 Vehicle year 输入框。
      25. 按 Command+A 清空 Vehicle year 输入框。
      26. 键入 2023。
      27. 点击司机资料表单中的 Plate 输入框。
      28. 按 Command+A 清空 Plate 输入框。
      29. 键入 8XJR214。
      30. 点击司机资料表单中的 Color 输入框。
      31. 按 Command+A 清空 Color 输入框。
      32. 键入 Pearl White。
      33. 点击 Save profile for review，提交车辆资料。
      34. 在 Account 页面向下滚动至 Driver documents 卡片。
      35. 点击 Driver documents 卡片顶部的文档类型下拉菜单。
      36. 点击 Insurance。
      37. 点击保险文档表单中的 Document ID 输入框。
      38. 按 Command+A 清空 Document ID 输入框。
      39. 键入 INS-2026-4096。
      40. 点击保险文档表单中的 Expires at 输入框。
      41. 按 Command+A 清空 Expires at 输入框。
      42. 键入 2028-09-30。
      43. 点击 Submit document，提交保险文档。
      44. 点击工作区导航栏中的 Support 页签。
      45. 点击 Driver safety and support 面板的 Message 文本框。
      46. 按 Command+A 清空 Support 消息内容。
      47. 键入 Route support help.。
      48. 点击 Create support ticket，提交司机支持工单。
      49. 向下滚动到新建的支持工单卡片。
      50. 点击工作区导航栏中的 Money 页签。
      51. 在收入页面向下滚动至底部 Payouts 卡片。
      52. 点击提现卡片中的 Amount 输入框。
      53. 按 Command+A 清空 Amount 输入框。
      54. 键入 135。
      55. 点击提现卡片中的 Note 输入框。
      56. 按 Command+A 清空 Note 输入框。
      57. 键入 Weekend transfer。
      58. 点击 Request payout，提交提现申请。
      59. 点击工作区导航栏中的 Work 页签。
      60. 点击 Active trip in progress 区域的 Open trip。
      61. 点击工作区导航栏中的 Account 页签。
      62. 点击工作区导航栏中的 Support 页签。
      63. 点击窗口右上方的退出登录图标，返回 OpenDriver 登录页。
