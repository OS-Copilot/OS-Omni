    source_instruction: |
      1. 轻点首页搜索卡片中的“Hotels”。
      2. 轻点酒店搜索表单的“Sort”下拉框。
      3. 在排序选项中选择“Lowest price”。
      4. 轻点酒店搜索表单的“Country”下拉框。
      5. 在国家选项中选择“China”。
      6. 轻点酒店搜索表单的“City”下拉框。
      7. 在城市选项中选择“Sanya”。
      8. 轻点酒店搜索表单的“Guests”输入框。
      9. 点按数字键盘上的“1”，将 Guests 人数设为一人。
      10. 轻点“Check-in”输入框。
      11. 输入“2026-06-12”。
      12. 轻点“Check-out”输入框。
      13. 输入“2026-06-13”。
      14. 轻点“Search Hotels”生成本次会务住宿的酒店结果。
      15. 向上滑动酒店结果列表，使 Sanya Parkline Suites 卡片的操作区进入屏幕。
      16. 轻点 Sanya Parkline Suites 卡片的“Details”。
      17. 轻点酒店详情页的“Book”进入该酒店的 checkout。
      18. 向上滑动 checkout 页面，使“Room”和“Guests”字段进入屏幕。
      19. 轻点“Room”下拉框。
      20. 在房型选项中选择“Standard Queen Room · $95 · 2 guests”。
      21. 轻点 checkout 表单的“Guests”输入框。
      22. 点按数字键盘上的“1”，将 Guests 人数设为一人。
      23. 继续向上滑动 checkout 页面，使“Contact phone”“Payment”和“Note”字段进入屏幕。
      24. 轻点“Contact phone”输入框。
      25. 输入“13900004652”。
      26. 轻点“Payment”下拉框。
      27. 在支付选项中选择“WeChat Pay”。
      28. 轻点“Note”输入框。
      29. 输入“Quiet room”。
      30. 轻点“Confirm Booking”，为 Maya Chen 创建一人入住的 Sanya Parkline Suites 酒店订单。
      31. 向上滑动，使“Shanghai Riverlight Suites”卡片中的“Write review”完整可见。
      32. 轻点 Shanghai Riverlight Suites 订单卡片中的“Write review”。
      33. 轻点“Review”输入框。
      34. 输入“Quiet river stay”。
      35. 轻点键盘的“Done”收起键盘。
      36. 轻点“Submit Review”，保存这次上海住宿的英文评价。
      37. 轻点 Profile 页顶部的“Search”返回航班搜索页。
      38. 轻点航班搜索表单的“Sort”下拉框。
      39. 在排序选项中选择“Recommended”。
      40. 轻点“To country”下拉框。
      41. 在到达国家选项中选择“China”。
      42. 轻点“To city”下拉框。
      43. 在到达城市选项中选择“Sanya (SYX)”。
      44. 轻点航班搜索表单的“From country”下拉框。
      45. 在出发国家选项中选择“China”。
      46. 轻点“From city”下拉框。
      47. 在出发城市选项中选择“Shanghai (SHA)”。
      48. 轻点航班搜索表单的“Date”输入框。
      49. 输入“2026-06-12”。
      50. 轻点航班搜索表单的“Cabin”下拉框。
      51. 在舱位选项中选择“Business”。
      52. 轻点“Search Flights”生成上海至三亚的商务舱航班结果。
      53. 继续向上滑动航班结果列表，使 MJ2158 / AP7947 卡片的“Details”进入屏幕。
      54. 轻点 MetroJet + Aurora Pacific MJ2158 / AP7947 卡片的“Details”。
      55. 向上滑动联程详情页，使“Book”进入屏幕。
      56. 轻点“Book”进入 MJ2158 / AP7947 的 checkout。
      57. 再次向上滑动 checkout 页面，使“Traveler”至“Confirm Booking”表单区域进入屏幕。
      58. 轻点“Traveler”下拉框。
      59. 在旅客选项中选择“Maya Chen · Passport”。
      60. 轻点 checkout 表单的“Cabin”下拉框。
      61. 在舱位选项中选择“Business”。
      62. 轻点“Extra baggage”下拉框。
      63. 在行李选项中选择“Add 15kg checked bag / $45”。
      64. 轻点“Contact phone”输入框。
      65. 输入“13900005648”。
      66. 轻点“Payment”下拉框。
      67. 在支付选项中选择“Bank Card”。
      68. 轻点“Note”输入框。
      69. 输入“Basel transfer”。
      70. 轻点“Confirm Booking”，为 Maya Chen 创建经 Basel 的 MJ2158 / AP7947 商务舱联程订单。
