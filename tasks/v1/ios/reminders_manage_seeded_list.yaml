task_id: ios.reminders.manage_seeded_list
platform: ios
instruction: >
  In the Reminders app, go to the "Benchmark Tasks" list and turn it into a Friday lunch checklist.
  Be careful with near-duplicate wording: keep "Buy sparkling water" and "Check dietary notes"
  exactly as they are, but remove "Buy still water" and "Check diet notes". Rename only
  "Plan team lunch" to "Plan Friday team lunch", "Send vendor ping" to "Send final vendor ping",
  and "Draft invite copy" to "Draft polished invite copy". Delete "Old lunch draft",
  "Book extra chairs", and "Unused budget note". Add "Send venue options", "Book projector",
  "Confirm headcount", "Pack receipt envelope", and "Share parking details". When finished,
  the list must contain exactly these reminders in this order: "Plan Friday team lunch",
  "Send final vendor ping", "Draft polished invite copy", "Send venue options", "Book projector",
  "Confirm headcount", "Pack receipt envelope", "Share parking details", "Buy sparkling water",
  and "Check dietary notes".
init:
  initializer_id: initializers.ios.reminder_seed_open_app:ReminderSeedOpenAppInitializer
  params:
    bundle_id: com.apple.reminders
    list_name: "Benchmark Tasks"
    purge_existing_reminders: true
    seed_reminders:
      - title: "Plan team lunch"
      - title: "Old lunch draft"
      - title: "Buy sparkling water"
      - title: "Send vendor ping"
      - title: "Book extra chairs"
      - title: "Draft invite copy"
      - title: "Unused budget note"
      - title: "Check dietary notes"
      - title: "Buy still water"
      - title: "Check diet notes"
    terminate_after_setup: true
    return_to_lists_home_before_terminate: true
evaluation:
  evaluator_id: evaluators.ios.reminder_list_state:ReminderListStateEvaluator
  params:
    bundle_id: com.apple.reminders
    list_name: "Benchmark Tasks"
    # The brief grades the list contents, not where the run stops: open the list
    # before reading it if the agent ended elsewhere.
    navigate_to_list: true
    exact_titles:
      - "Plan Friday team lunch"
      - "Send final vendor ping"
      - "Draft polished invite copy"
      - "Buy sparkling water"
      - "Check dietary notes"
      - "Send venue options"
      - "Book projector"
      - "Confirm headcount"
      - "Pack receipt envelope"
      - "Share parking details"
    ordered_titles:
      - "Plan Friday team lunch"
      - "Send final vendor ping"
      - "Draft polished invite copy"
      - "Send venue options"
      - "Book projector"
      - "Confirm headcount"
      - "Pack receipt envelope"
      - "Share parking details"
      - "Buy sparkling water"
      - "Check dietary notes"
    present_titles:
      - "Plan Friday team lunch"
      - "Send final vendor ping"
      - "Draft polished invite copy"
      - "Buy sparkling water"
      - "Check dietary notes"
      - "Send venue options"
      - "Book projector"
      - "Confirm headcount"
      - "Pack receipt envelope"
      - "Share parking details"
    absent_titles:
      - "Plan team lunch"
      - "Old lunch draft"
      - "Send vendor ping"
      - "Book extra chairs"
      - "Draft invite copy"
      - "Unused budget note"
      - "Buy still water"
      - "Check diet notes"
limits:
  max_steps: 300
  step_timeout_seconds: 180
metadata:
  tags: [reminders, edit, create, delete, ios, native, productivity, hard, benchmark]
  app: Reminders
  app_bundle_id: com.apple.reminders
  description: Perform a careful reminder list transformation with near-duplicate distractors, selective preservation, and exact final-title/order checks.
