    source_instruction_sha256: b3dceb03eb797695a66d85e836ef599d4b66626c544d3d200cebacd2d3a4e9f8
    source_instruction: |-
      任务：在 OpenPhotoEdit 中分别导入两张右上角带三原色校准区的小丑妆人物照片，按指定数值完成两套冷调舞台妆容编辑并各导出一张成片。只能在 Android 桌面、OpenPhotoEdit 和 Android Photo Picker 中操作，不要切换到无关应用。本任务不需要登录或注册；不要 Sign Out / 不要退出登录。最终导出第二张小丑妆正面成片后，停留在当前 OpenPhotoEdit 编辑器页面，不要返回首页。
      重要环境说明：本任务使用 Android Studio Quail 1 Android Emulator/AVD `AndroidWorldAvd_20260611_1`，VM 快照显示名称为 `snap_2026-08-03_16-11-57`。运行前 VM 应已经处于这个快照对应的初始状态。快照中必须已安装 OpenPhotoEdit 包 `com.killt.openphotoedit`，并且系统 Photo Picker 的 Recent/Photos 网格中可见右上角带三原色校准区的小丑妆侧脸人物照片和小丑妆正面人物照片。人工截图定位与 MediaStore 文本映射确认：侧脸小丑妆源图是 `/sdcard/Pictures/portrait_17.jpg`，正面小丑妆源图是 `/sdcard/Pictures/portrait_16.jpg`。快照初始状态不应存在 `/sdcard/Pictures/OpenPhotoEdit/OpenPhotoEdit_*.jpg` 导出图。
      1. 在 Android 虚拟机桌面点击 OpenPhotoEdit 图标打开软件。
      2. 点击首页的 "Import Photo"。
      3. 在 Android Photo Picker 中点击或确认停留在 "Photos" 标签页。
      4. 在照片网格顶部找到右上角带三原色校准区的小丑妆侧脸人物照片；它对应源文件 `portrait_17.jpg`。
      5. 长按小丑妆侧脸人物照片缩略图，直到打开照片预览页。
      6. 点击预览页底部的 "Add"，把侧脸妆容照导入 OpenPhotoEdit。
      7. 在底部工具栏选择 "Edit"。
      8. 在 Edit 工具行选择 "Exposure"。
      9. 把 Exposure 滑块拖到 +6，提亮侧脸但保留舞台阴影。
      10. 在 Edit 工具行选择 "Contrast"。
      11. 把 Contrast 滑块拖到 +12，强化白色底妆与深色背景的分离。
      12. 在 Edit 工具行选择 "Brightness"。
      13. 把 Brightness 滑块拖到 +5，补足面部中间调。
      14. 向左滑动 Edit 工具行，露出 "Temperature"。
      15. 在 Edit 工具行选择 "Temperature"。
      16. 把 Temperature 滑块拖到 -4，让舞台侧光略偏冷。
      17. 在底部工具栏选择 "Portrait"。
      18. 在 Portrait 工具行选择 "Smooth"。
      19. 把 Smooth 滑块拖到 +6，轻度平整底妆而不抹掉纹理。
      20. 在 Portrait 工具行选择 "Whiten"。
      21. 把 Whiten 滑块拖到 +3，保持小丑白色底妆干净。
      22. 向左滑动 Portrait 工具行，确认 "Lip Color" 完整可见。
      23. 在 Portrait 工具行选择 "Lip Color"。
      24. 把 Lip Color 滑块拖到 +8，适度增强侧脸照片的红色嘴妆。
      25. 在底部工具栏选择 "HSL"。
      26. 在颜色行选择 "Blue"。
      27. 在参数行选择 "Hue"。
      28. 把 Blue 的 Hue 滑块拖到 -6，使眼妆偏向深蓝。
      29. 在参数行选择 "Saturation"。
      30. 把 Blue 的 Saturation 滑块拖到 +16，突出蓝色眼妆。
      31. 在颜色行选择 "Red"。
      32. 保持 Saturation 选中，把 Red 的 Saturation 滑块拖到 +12，增强红色嘴妆。
      33. 在参数行选择 "Luminance"。
      34. 把 Red 的 Luminance 滑块拖到 -4，增加嘴妆厚重感。
      35. 在底部工具栏选择 "Filters"。
      36. 选择 "Film" 滤镜。
      37. 把 Amount 滑块拖到 18，加入轻微戏剧胶片质感。
      38. 点击顶部 "Export"，导出小丑妆侧脸成片；等待导出完成，不要重复点击 Export。
      39. 点击 OpenPhotoEdit 顶部返回控件。
      40. 点击 "Discard"，关闭已经导出完成的侧脸工作副本并返回首页。
      41. 点击首页的 "Import Photo"。
      42. 在 Android Photo Picker 中点击或确认停留在 "Photos" 标签页。
      43. 找到右上角带三原色校准区的小丑妆正面人物照片；它对应源文件 `portrait_16.jpg`，不要选择刚导出的侧脸成片。
      44. 长按小丑妆正面人物照片缩略图，直到打开照片预览页。
      45. 点击预览页底部的 "Add"，把正面妆容照导入 OpenPhotoEdit。
      46. 在底部工具栏选择 "Edit"。
      47. 在 Edit 工具行选择 "Exposure"。
      48. 把 Exposure 滑块拖到 +4，保留正面照的舞台暗部。
      49. 在 Edit 工具行选择 "Contrast"。
      50. 把 Contrast 滑块拖到 +18，强化面具式妆容轮廓。
      51. 在 Edit 工具行选择 "Saturation"。
      52. 把 Saturation 滑块拖到 +6，适度增强舞台妆容色彩而不使肤色失真。
      53. 向左滑动 Edit 工具行，露出 "Temperature"。
      54. 在 Edit 工具行选择 "Temperature"。
      55. 把 Temperature 滑块拖到 -3，使两张照片保持相同冷调环境。
      56. 在底部工具栏选择 "Portrait"。
      57. 在 Portrait 工具行选择 "Smooth"。
      58. 把 Smooth 滑块拖到 +5，仅整理白色底妆表面。
      59. 在 Portrait 工具行选择 "Whiten"。
      60. 把 Whiten 滑块拖到 +3，保持底妆亮度统一。
      61. 向左滑动 Portrait 工具行，露出 "Lip Color" 和 "Rosy"。
      62. 在 Portrait 工具行选择 "Lip Color"。
      63. 把 Lip Color 滑块拖到 +14，突出正面红色嘴妆。
      64. 在 Portrait 工具行选择 "Rosy"。
      65. 把 Rosy 滑块拖到 +5，为夸张妆容保留少量面部色彩。
      66. 在底部工具栏选择 "HSL"。
      67. 在颜色行选择 "Cyan"。
      68. 在参数行选择 "Hue"。
      69. 把 Cyan 的 Hue 滑块拖到 -8，使青色眼妆更接近蓝色。
      70. 在参数行选择 "Saturation"。
      71. 把 Cyan 的 Saturation 滑块拖到 +20，强化正面眼妆主色。
      72. 在颜色行选择 "Red"。
      73. 保持 Saturation 选中，把 Red 的 Saturation 滑块拖到 +18，增强红色嘴妆和鼻妆。
      74. 在参数行选择 "Luminance"，把 Red 的 Luminance 滑块拖到 -4，增加嘴妆厚重感。
      75. 在底部工具栏选择 "Filters"，选择 "Clean" 滤镜，把 Amount 滑块拖到 15，点击顶部 "Export" 导出小丑妆正面成片，并最终停留在当前 OpenPhotoEdit 编辑器页面，不要返回首页，不要 Sign Out / 不要退出登录。
