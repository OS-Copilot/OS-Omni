task_id: android.opentwitter.04_mobile_incident_frontend_audit
platform: android
instruction: |-
  Execute a series of engagement, messaging, and posting actions in the OpenTwitter app while signed in as Alex Chen (@alex), concluding with the chat with Priya Shah open and the just-sent message “Mobile audit filed.” visible on screen, without signing out or logging out at any point.

  On Elena Rossi’s post about the Mobile release candidate within the “For you” tab of the Explore section, activate Like, activate Repost, and post a reply with the exact text “Draft issue tracked.” On Devon Brooks’s Reliability post whose body begins with “Runbooks age quietly.” within the “Trending” tab of the Explore section, activate Save, post a reply with the exact text “Timeline owner set,” and activate Like. On Jamal Reed’s Frontend post within the “Technology” tab of the Explore section, activate Like, activate Save, and post a reply with the exact text “Paint timing logged.”

  Send the following direct messages in this order: to Maya Patel, “Mobile gate is clear”; to Devon Brooks, “Runbook owner added”; and to Ben Carter, “QA gate reviewed.”

  Create two new posts on Home in this order: first “Mobile gate ready.” and then “Runbook owner set.” On your own post “Mobile gate ready.” in the Home feed, post a reply with the exact text “Release owner Elena,” activate Like, and activate Save.

  Mark all notifications as read in the Notifications section. Leave the app on the Priya Shah chat page with the message “Mobile audit filed.” visible.
