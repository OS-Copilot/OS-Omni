    source_instruction_sha256: 3a9cbb70c4e6de2ae80fd68f7b6008627e0325264094040489f8652857f2cd83
    source_instruction: |-
      任务：在 OpenPhotoEdit 中分别导入两张右上角带三原色校准区的烹饪活动照片，按指定数值完成两套自然纪实风格编辑并各导出一张成片。只在 Android 桌面、OpenPhotoEdit 和 Android Photo Picker 中操作，不要切换到无关应用。本任务不需要登录或注册；不要 Sign Out / 不要退出登录。最终导出第二张户外烹饪成片后，停留在当前 OpenPhotoEdit 编辑器页面，不要返回首页。

      重要环境说明：本任务使用 Android Studio Quail 1 Android Emulator/AVD `AndroidWorldAvd_20260611_1`，VM 快照显示名称为 `snap_2026-08-03_16-11-57`。运行前 VM 应已经处于这个快照对应的初始状态。快照中必须已安装 OpenPhotoEdit 包 `com.killt.openphotoedit`，并且系统 Photo Picker 的 Recent/Photos 网格中可见右上角带三原色校准区的室内多人备餐照片和户外多人烹饪照片。文本映射确认：室内多人备餐源图是 `/sdcard/Pictures/portrait_20.jpg`，户外多人烹饪源图是 `/sdcard/Pictures/portrait_16.jpg`。快照初始状态不应存在 `/sdcard/Pictures/OpenPhotoEdit/OpenPhotoEdit_*.jpg` 导出图。

      1. 点击 Android 虚拟机桌面上的 OpenPhotoEdit 图标打开软件。
      2. 点击首页的 "Import Photo"。
      3. 在 Android Photo Picker 中点击或确认停留在 "Photos" 标签页。
      4. 在照片网格顶部找到右上角带三原色校准区的“多人围着锅具进行室内备餐”照片；它对应源文件 `portrait_20.jpg`。
      5. 长按室内多人备餐照片缩略图，直到打开照片预览页。
      6. 点击预览页底部的 "Add"，把室内备餐照片导入 OpenPhotoEdit。
      7. 在底部工具栏选择 "Edit"。
      8. 在 Edit 工具行选择 "Exposure"。
      9. 把 Exposure 滑块拖到 +9，改善室内人物和锅具曝光。
      10. 在 Edit 工具行选择 "Brightness"。
      11. 把 Brightness 滑块拖到 +7，提亮活动现场中间调。
      12. 在 Edit 工具行选择 "Contrast"。
      13. 把 Contrast 滑块拖到 +6，保持多人画面的层次但不过度生硬。
      14. 向左滑动 Edit 工具行，露出 "Temperature" 和 "Curve"。
      15. 在 Edit 工具行选择 "Temperature"。
      16. 把 Temperature 滑块拖到 +8，恢复室内灯光和食物暖色。
      17. 在 Edit 工具行选择 "Saturation"。
      18. 把 Saturation 滑块拖到 +5，温和增强食材和活动现场的整体色彩。
      19. 在底部工具栏选择 "Landscape"。
      20. 在 Landscape 工具行选择 "Structure"。
      21. 把 Structure 滑块拖到 +10，增强锅具和食材纹理。
      22. 在 Landscape 工具行选择 "HDR"。
      23. 把 HDR 滑块拖到 +12，平衡室内高光和人物暗部。
      24. 在底部工具栏选择 "HSL"。
      25. 在颜色行选择 "Orange"。
      26. 在参数行选择 "Luminance"。
      27. 把 Orange 的 Luminance 滑块拖到 +8，提亮肤色和暖色食材。
      28. 在参数行选择 "Saturation"。
      29. 把 Orange 的 Saturation 滑块拖到 +6，适度增加食物暖色。
      30. 在颜色行选择 "Yellow"。
      31. 在参数行选择 "Hue"。
      32. 把 Yellow 的 Hue 滑块拖到 -3，减少室内灯光的偏绿感。
      33. 在底部工具栏选择 "Filters"。
      34. 选择 "Clean" 滤镜。
      35. 把 Amount 滑块拖到 16，保持纪实画面清楚自然。
      36. 点击顶部 "Export"，导出室内备餐成片；等待导出完成，不要重复点击 Export。
      37. 点击 OpenPhotoEdit 顶部返回控件。
      38. 点击 "Discard"，关闭已经导出完成的室内工作副本并返回首页。
      39. 点击首页的 "Import Photo"。
      40. 在 Android Photo Picker 中点击或确认停留在 "Photos" 标签页。
      41. 找到右上角带三原色校准区的“多人在户外围着烹饪区域交流”照片；它对应源文件 `portrait_16.jpg`，不要选择刚导出的室内成片。
      42. 长按户外多人烹饪照片缩略图，直到打开照片预览页。
      43. 点击预览页底部的 "Add"，把户外烹饪照片导入 OpenPhotoEdit。
      44. 在底部工具栏选择 "Landscape"。
      45. 在 Landscape 工具行选择 "Structure"。
      46. 把 Structure 滑块拖到 +12，增强户外器具、人物服装和环境细节。
      47. 在 Landscape 工具行选择 "Foliage"。
      48. 把 Foliage 滑块拖到 +8，恢复树木和草地的自然绿色。
      49. 在 Landscape 工具行选择 "Sky"。
      50. 把 Sky 滑块拖到 +6，温和增加户外天空层次。
      51. 在 Landscape 工具行选择 "HDR"。
      52. 把 HDR 滑块拖到 +10，平衡日光和人物阴影。
      53. 在底部工具栏选择 "Edit"。
      54. 在 Edit 工具行选择 "Exposure"。
      55. 把 Exposure 滑块拖到 +6，提亮户外人物面部。
      56. 在 Edit 工具行选择 "Brightness"。
      57. 把 Brightness 滑块拖到 +5，补充现场中间调亮度。
      58. 在 Edit 工具行选择 "Contrast"。
      59. 把 Contrast 滑块拖到 +8，增强人物与背景的分离。
      60. 向左滑动 Edit 工具行，露出 "Temperature"。
      61. 在 Edit 工具行选择 "Temperature"。
      62. 把 Temperature 滑块拖到 +6，使户外照片与室内暖色保持协调。
      63. 在底部工具栏选择 "HSL"。
      64. 在颜色行选择 "Green"。
      65. 在参数行选择 "Saturation"。
      66. 把 Green 的 Saturation 滑块拖到 +8，增强现场植被颜色。
      67. 在参数行选择 "Luminance"。
      68. 把 Green 的 Luminance 滑块拖到 +5，避免绿色背景过暗。
      69. 在颜色行选择 "Orange"。
      70. 保持 "Luminance" 选中，把 Orange 的 Luminance 滑块拖到 +6，提亮人物肤色。
      71. 在底部工具栏选择 "Filters"。
      72. 选择 "Clean" 滤镜。
      73. 把 Amount 滑块拖到 14，使户外纪实照片保持清晰自然。
      74. 点击顶部 "Export"，导出户外烹饪成片，并最终停留在当前 OpenPhotoEdit 编辑器页面，不要返回首页，不要 Sign Out / 不要退出登录。
