instruction: |-
  Submit a dispute for the “Ace Hardware” transaction in the Activity section, selecting “Amount is incorrect” as the reason and entering “Wrong home supply total” in the details field, after locating the transaction using the “Home” category and “Posted” status filters.

  Change the “Paper delivery” setting for the “Rainy Day Savings •••9140” statement in the Statements section from “Paper” to “Go paperless” and save the change.

  Update the Security section settings by turning off the “Push” notification channel for the “Large purchase” alert and saving the form, turning on the “Text” notification channel for the “Low balance” alert and saving the form, marking the “Upcoming bill” reminder as read, turning on the “Text” notification channel for the “Payment due” alert and saving the form, and locking the “OpenBank Rewards Card” in the “Card controls” area.

  Create two new recipients in the Transfer section: the first with the name “Lena Wu”, account number “6492083175”, routing number “031000053”, bank “OpenBank”, and nickname “Design split”; the second with the name “Marco Li”, account number “3078519264”, routing number “124003116”, bank “OpenBank”, and nickname “Studio rent”.

  Submit two new transfers: the first to “Lena Wu” from “Everyday Checking ••••2381” with a memo of “Design split”, an amount of “4.20”, and a date of “2026-06-01”; the second to “Marco Li” with a memo of “Studio rent” and an amount of “1.25”.
