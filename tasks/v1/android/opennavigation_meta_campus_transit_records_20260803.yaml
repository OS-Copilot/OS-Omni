    source_instruction: |-
      请只通过可见的 Android GUI 完成这个 OpenNavigation 工作流。从 Android Studio 快照 `snap_2026-08-01_16-48-36` 的干净状态开始，OpenNavigation 已安装并已登录；不要 Sign Out / 不要退出登录。最终停留在左侧栏的 Records 页面，使页面同时显示 MetaCommute、CampusWalk、TransitLink、Heavy traffic 和 OfficeCongestion。

      1. 点击 OpenNavigation 应用图标，打开应用到地图首页。
      2. 点击顶部搜索框，输入 Meta，收起软键盘，然后点击搜索结果中的 Meta Headquarters。
      3. 点击顶部搜索框右侧的菱形 Directions 按钮，选择 Drive，保持 Leave now。
      4. 点击起点和目的地之间的 + 添加途经点按钮，在新增途经点文本栏输入 Googleplex，收起软键盘，然后点击结果列表中的 Googleplex。
      5. 打开出发时间右侧的 Options 路线设置按钮，在 Route preferences 弹窗中勾选 Avoid highways，然后点击 Apply preferences。
      6. 点击路线摘要下方标签栏最右侧的 Routes；它位于 Saved 的右边。点击该标签下方显示的第一张 Drive 路线卡片。
      7. 点击路线名称文本栏，输入 MetaCommute，收起软键盘，然后点击路线名称右侧的 Save route 按钮。
      8. 点击左侧栏的 Records，再点击左侧栏的 Saved，点击收藏地点列表中的 Stanford University。
      9. 点击顶部搜索框右侧的菱形 Directions 按钮，点击起点和目的地之间的 + 添加途经点按钮。
      10. 在新增途经点文本栏输入 Mountain View，收起软键盘，然后点击结果列表中的 Mountain View Transit Center。
      11. 选择 Walk，点击 Other time，打开 Options，在 Route preferences 弹窗中勾选 Accessible route，然后点击 Apply preferences；路线生成后顶部按钮显示为 Start。
      12. 点击显示 MetaCommute 的路线名称文本栏，长按 MetaCommute 后松开，点击浮动文本菜单中的 Select all，输入 CampusWalk，收起软键盘，然后点击蓝色 Save route 按钮。
      13. 点击左侧栏的 Records，再点击左侧栏的 Recent，点击最近地点列表中的 Mountain View Transit Center。
      14. 点击顶部搜索框右侧的菱形 Directions 按钮，点击起点和目的地之间的 + 添加途经点按钮。
      15. 在新增途经点文本栏输入 Googleplex，收起软键盘，然后点击结果列表中的 Googleplex。
      16. 选择 Transit，点击 Other time，打开 Options，在 Route preferences 弹窗中勾选 Fewer transfers，然后点击 Apply preferences；路线生成后顶部按钮显示为 Start。
      17. 点击显示 CampusWalk 的路线名称文本栏，长按 CampusWalk 后松开，点击浮动文本菜单中的 Select all，输入 TransitLink，收起软键盘，然后点击 Save route 按钮。
      18. 点击左侧栏的 Records，在 Saved routes 区域点击 MetaCommute 路线卡片。
      19. 点击路线摘要下方标签栏最右侧的 Routes；它位于 Saved 的右边。点击该标签下方显示的第一张 Drive 路线卡片，然后点击页面标题行右侧的蓝色 Start 按钮。
      20. 点击导航覆盖层中的 Report，打开 Report an incident 弹窗中的 Incident type 下拉框，选择 Heavy traffic。
      21. 点击 Report note 文本栏，输入 OfficeCongestion，收起软键盘，然后点击 Save report。
      22. 点击左侧栏的 Records，使最终页面同时显示 MetaCommute、CampusWalk、TransitLink、Heavy traffic 和 OfficeCongestion。
