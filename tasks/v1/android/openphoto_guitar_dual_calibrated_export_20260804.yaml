task_id: android.openphoto.guitar_dual_calibrated_export_20260804
platform: android
instruction: In OpenPhotoEdit, import the blue electric guitar close-up photo featuring a three-color
  calibration area in its upper-right corner and the wood guitar photo lying on red fabric with a similar
  calibration area, apply the specified product-photo edit recipes to each, and export the finished images
  while remaining on the wood guitar editor page. The blue electric guitar image must be edited with the
  HSL Blue channel Hue set to -4, Saturation to +18, and Luminance to -6, and the HSL Cyan channel Luminance
  set to +5; within the Edit group, Exposure must be +4, Contrast +15, Brightness +6, and Temperature
  -3; within the Landscape group, Structure must be +20 and HDR +8; the Clean filter must be applied with
  an Amount of 18; and the overall Saturation in the Edit group must be +7. The wood guitar image must
  be edited with Exposure set to +5, Contrast +10, Temperature +12, and Brightness +4 in the Edit group;
  Structure +16 and Warm Sun +10 in the Landscape group; the Orange channel Saturation +12 and Luminance
  +4, the Red channel Hue +3, and the Yellow channel Hue -4 in the HSL group; and the Film filter applied
  with an Amount of 24. The blue electric guitar working copy must be discarded after its export, and
  the wood guitar image must be exported without returning to the home screen or signing out, leaving
  the application in the state of the wood guitar editor page with the interface visible.
