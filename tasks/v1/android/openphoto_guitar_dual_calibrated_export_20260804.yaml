    source_instruction_sha256: b3aef417180df418d0014fbf39b8f54a3a0a6ec8c3a15431cafcb4cb1ee2727f
    source_instruction: |-
      任务：在 OpenPhotoEdit 中分别导入两张右上角带三原色校准区的吉他照片，按指定数值完成两套产品照编辑并各导出一张成片。只能在 Android 桌面、OpenPhotoEdit 和 Android Photo Picker 中操作，不要切换到无关应用。本任务不需要登录或注册；不要 Sign Out / 不要退出登录。最终导出第二张木吉他成片后，停留在当前 OpenPhotoEdit 编辑器页面，不要返回首页。

      重要环境说明：本任务使用 Android Studio Quail 1 Android Emulator/AVD `AndroidWorldAvd_20260611_1`，VM 快照显示名称为 `snap_2026-08-03_16-11-57`。运行前 VM 应已经处于这个快照对应的初始状态。快照中必须已安装 OpenPhotoEdit 包 `com.killt.openphotoedit`，并且系统 Photo Picker 的 Recent/Photos 网格中可见右上角带三原色校准区的蓝色电吉他特写照片和红色织物上的木吉他照片。文本映射确认：蓝色电吉他源图是 `/sdcard/Pictures/portrait_21.jpg`，木吉他源图是 `/sdcard/Pictures/portrait_17.jpg`。快照初始状态不应存在 `/sdcard/Pictures/OpenPhotoEdit/OpenPhotoEdit_*.jpg` 导出图。

      1. 点击 Android 虚拟机桌面上的 OpenPhotoEdit 图标打开软件。
      2. 点击首页的 "Import Photo"。
      3. 在 Android Photo Picker 中点击或确认停留在 "Photos" 标签页。
      4. 在照片网格顶部找到右上角带三原色校准区的蓝色电吉他特写照片；它对应源文件 `portrait_21.jpg`。
      5. 长按蓝色电吉他照片缩略图，直到打开照片预览页。
      6. 点击预览页底部的 "Add"，把电吉他照片导入 OpenPhotoEdit。
      7. 在底部工具栏选择 "HSL"。
      8. 在颜色行选择 "Blue"。
      9. 在参数行选择 "Hue"。
      10. 把 Blue 的 Hue 滑块拖到 -4，使琴身蓝色略偏深蓝。
      11. 在参数行选择 "Saturation"。
      12. 把 Blue 的 Saturation 滑块拖到 +18，突出蓝色琴面。
      13. 在参数行选择 "Luminance"。
      14. 把 Blue 的 Luminance 滑块拖到 -6，保留琴面纹理和高光。
      15. 在颜色行选择 "Cyan"。
      16. 保持 "Luminance" 选中，把 Cyan 的 Luminance 滑块拖到 +5，提亮琴身浅蓝装饰。
      17. 在底部工具栏选择 "Edit"。
      18. 在 Edit 工具行选择 "Exposure"。
      19. 把 Exposure 滑块拖到 +4，提亮乐器主体。
      20. 在 Edit 工具行选择 "Contrast"。
      21. 把 Contrast 滑块拖到 +15，增强琴弦与琴身边缘。
      22. 在 Edit 工具行选择 "Brightness"。
      23. 把 Brightness 滑块拖到 +6，补充产品照中间调。
      24. 向左滑动 Edit 工具行，露出 "Temperature"。
      25. 在 Edit 工具行选择 "Temperature"。
      26. 把 Temperature 滑块拖到 -3，使蓝色琴身保持清爽冷调。
      27. 在底部工具栏选择 "Landscape"。
      28. 在 Landscape 工具行选择 "Structure"。
      29. 把 Structure 滑块拖到 +20，强化琴弦、旋钮和木纹细节。
      30. 在 Landscape 工具行选择 "HDR"。
      31. 把 HDR 滑块拖到 +8，平衡金属反光与琴身暗部。
      32. 在底部工具栏选择 "Filters"。
      33. 选择 "Clean" 滤镜。
      34. 把 Amount 滑块拖到 18，形成清晰的产品展示效果。
      35. 返回底部 "Edit" 分组。
      36. 在 Edit 工具行选择 "Saturation"。
      37. 把 Saturation 滑块拖到 +7，适度增强整体产品色彩并保留右上角校准区。
      38. 点击顶部 "Export"，导出蓝色电吉他成片；等待导出完成，不要重复点击 Export。
      39. 点击 OpenPhotoEdit 顶部返回控件。
      40. 点击 "Discard"，关闭已经导出完成的电吉他工作副本并返回首页。
      41. 点击首页的 "Import Photo"。
      42. 在 Android Photo Picker 中点击或确认停留在 "Photos" 标签页。
      43. 找到右上角带三原色校准区的红色织物上的木吉他照片；它对应源文件 `portrait_17.jpg`，不要选择刚导出的电吉他成片。
      44. 长按木吉他照片缩略图，直到打开照片预览页。
      45. 点击预览页底部的 "Add"，把木吉他照片导入 OpenPhotoEdit。
      46. 在底部工具栏选择 "Edit"。
      47. 在 Edit 工具行选择 "Exposure"。
      48. 把 Exposure 滑块拖到 +5，提亮木吉他面板。
      49. 在 Edit 工具行选择 "Contrast"。
      50. 把 Contrast 滑块拖到 +10，突出琴弦和音孔边缘。
      51. 向左滑动 Edit 工具行，露出 "Temperature" 和 "Curve"。
      52. 在 Edit 工具行选择 "Temperature"。
      53. 把 Temperature 滑块拖到 +12，强化木材与红色织物的暖色。
      54. 在 Edit 工具行选择 "Brightness"。
      55. 把 Brightness 滑块拖到 +4，温和提亮木质面板的中间调。
      56. 在底部工具栏选择 "Landscape"。
      57. 在 Landscape 工具行选择 "Structure"。
      58. 把 Structure 滑块拖到 +16，呈现木纹和琴弦细节。
      59. 向左滑动 Landscape 工具行，露出 "Warm Sun"。
      60. 在 Landscape 工具行选择 "Warm Sun"。
      61. 把 Warm Sun 滑块拖到 +10，营造温暖室内陈列氛围。
      62. 在底部工具栏选择 "HSL"。
      63. 在颜色行选择 "Orange"。
      64. 在参数行选择 "Saturation"。
      65. 把 Orange 的 Saturation 滑块拖到 +12，增强木吉他暖色。
      66. 在参数行选择 "Luminance"。
      67. 把 Orange 的 Luminance 滑块拖到 +4，提亮木质面板。
      68. 在颜色行选择 "Red"。
      69. 在参数行选择 "Hue"。
      70. 把 Red 的 Hue 滑块拖到 +3，使背景红布略偏暖。
      71. 在颜色行选择 "Yellow"。
      72. 保持 "Hue" 选中，把 Yellow 的 Hue 滑块拖到 -4，使木色更接近金黄。
      73. 在底部工具栏选择 "Filters"，选择 "Film" 滤镜，把 Amount 滑块拖到 24，加入克制的复古胶片质感。
      74. 点击顶部 "Export"，导出木吉他成片，并最终停留在当前 OpenPhotoEdit 编辑器页面，不要返回首页，不要 Sign Out / 不要退出登录。
