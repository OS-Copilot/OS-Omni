task_id: android.opentwitter.01_release_review_coordination
platform: android
instruction: |-
  Complete a coordinated set of engagement, messaging, and posting actions in the OpenTwitter app while signed in as Alex Chen (@alex), finishing on the Home feed with the post “Owners aligned.” and its saved state visible.

  In the Explore section under the “For you” tab, the trend “AI assistant rollout” must contain Hana Kim’s post about the assistant rollout plan update, which should be liked, saved, and reposted, with a reply containing the exact text “Citations are clear”. In Explore under the “Technology” tab, the trend “Security reviews” must contain Priya Shah’s security review reminder post, which should be liked and saved, with a reply containing the exact text “Export check passed”.

  In Messages, direct messages must be sent in the following order: to Priya Shah with the text “Export review done.”, to Lina Torres with the text “Fix review is ready.”, and to Hana Kim with the text “Pilot copy checked.”. On the Home feed, two new posts must be created in sequence: first “Review notes ready.”, then “Owners aligned.”.

  In Explore under the “For you” tab, the trend “Mobile release candidate” must contain Elena Rossi’s post about the mobile release candidate, which should be liked and saved, with a reply containing the exact text “Mobile fix is good”. All notifications must be marked as read. In Messages, a direct message must be sent to Devon Brooks with the exact text “Timeline reviewed.”.

  On the Home feed, the post “Owners aligned.” must be fully visible, replied to with the exact text “Next steps assigned”, and saved. The app must remain in the foreground on the Home view, with “Owners aligned.” visible and marked as saved, and the user must remain signed in as Alex Chen (@alex) throughout.
