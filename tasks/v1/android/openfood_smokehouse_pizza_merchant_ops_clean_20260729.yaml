platform: android
instruction: |-
  Complete a multi-part merchant and customer workflow in the OpenFood app while signed in as Lucas Lin, ending with the app open on the Merchant page and still authenticated.

  The first customer order must be placed at Smokehouse at Union 40 Aurora IL, accessed via the Restaurants section filtered by the BBQ cuisine and sorted by Lowest delivery fee. The cart must contain two Smoked Brisket Plates and two Pulled Pork Sandwiches, with the coupon WELCOME12 - $12 off orders over $30 applied. This order must be advanced to Out for delivery and then to Delivered.

  A support ticket must be created in the Support section with the subject exactly `BBQ delivery issue` and the message exactly `Check BBQ delivery`. A voucher code `LUNCH5` must be entered in the Enter voucher code field in the Wallet section and claimed.

  The second customer order must be initiated by using the Reorder action on the first delivered Smokehouse order. In the resulting cart, the quantity of the first line item must be increased from 2 to 3 and the quantity of the second line item from 2 to 3. The coupon LUNCH5 - $5 off orders over $15 must be applied, and the order must be placed and advanced to Out for delivery and then to Delivered.

  The third customer order must be initiated by using the Reorder action on the second delivered Smokehouse order. In that cart, the quantity of the first line item must be increased from 3 to 4 and the quantity of the second line item from 3 to 4. The coupon WELCOME12 - $12 off orders over $30 must be applied, and the order must be placed and advanced to Out for delivery and then to Delivered.

  The fourth customer order must be placed at NY Slice House, accessed via the Restaurants section by searching for `pizza` and filtering the results by the Pizza cuisine. The cart must contain two New York Cheese Pizzas, two Pastrami Rye Sandwiches, and one Bagel Lox Set. The coupon LUNCH5 - $5 off orders over $15 must be applied, and the order must be placed and advanced to Out for delivery and then to Delivered.

  On the Merchant page, Dumpling Room No. 20 San Jose CA must be marked as closed, with Pork Dumplings, Beef Chow Fun, and Mapo Tofu made unavailable. Santana Row Banh Mi Market No. 12 San Jose CA must be marked as closed, with Golden San Jose Pho Tai Rice, Golden San Jose Pho Tai Soup, and Golden San Jose Pho Tai Snack made unavailable. City Little Saigon Grill must be marked as closed, with Heritage Banh Mi Combo made unavailable.
