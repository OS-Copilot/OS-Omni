instruction: |-
  Complete a continuous social collaboration workflow in OpenTwitter while remaining signed in as Alex Chen, resulting in specific posts being engaged with, messages sent, new posts published, and notifications cleared.

  Within the Explore section under the Trending category, the Accessibility audits trend must be opened, and the Design post by Maya Patel titled “The new accessibility audit template is ready...” must be liked, reposted, and replied to with the exact text “Focus lanes approved”. In the Explore section under the For you category, the Research synthesis topic must be opened, and the Research post by Zoe Bennett titled “Research synthesis from seven onboarding sessions...” must be liked, saved, and replied to with the exact text “Checklist is clear”. Also within the Explore section under the For you category, the Community replies topic must be opened, and the Community post by Amina Okafor titled “Community launch prep is more than scheduling posts...” must be liked, saved, and replied to with the exact text “Escalation owner set”.

  In the Messages section, the exact message “Focus review passed.” must be sent to Maya Patel, the exact message “Research clips filed” must be sent to Zoe Bennett, and the exact message “Reply owner assigned” must be sent to Amina Okafor. In the Home feed, two new posts must be published in sequence: first, the exact text “Focus review ready”, and immediately after, the exact text “Research plan set.”. The newly published post “Research plan set.” must have a reply with the exact text “Clips linked today”, and the post itself must be liked and saved.

  All notifications must be marked as read. In the Messages section, the conversation with Priya Shah must be opened, and the exact message “Research audit done” must be sent. The task is complete when the interface is left on the Priya Shah chat page with the user still logged in.
