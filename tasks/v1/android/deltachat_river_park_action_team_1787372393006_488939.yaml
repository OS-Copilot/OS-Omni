      16. 点击 Zoe 的搜索结果。
      17. 长按最下方包含 `headline_set_14_final` 的白色来信。
      18. 点击 Copy。
      19. 点击顶部返回按钮回到搜索页。
      20. 切换到 Markor。
      21. 点击页面右下角红色方形 `+` 按钮。
      22. 在 Title 输入框中输入 `Community event runbook`。
      23. 点击 OK。
