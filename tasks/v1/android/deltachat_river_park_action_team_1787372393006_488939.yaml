      46. 输入 `Owner: Park crew`。
      47. 点击保存按钮。
      48. 点击更多选项按钮。
      49. 点击 Share。
      50. 选择以文件形式分享。
      51. 点击系统分享面板中的 River Park Action Team。
      52. 点击发送按钮。
      53. 输入 `Catering proof follows`。
