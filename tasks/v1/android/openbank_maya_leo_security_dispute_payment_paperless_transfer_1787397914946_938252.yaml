instruction: |-
  Create two new transfer recipients, update security alert and card settings, submit a transaction dispute, schedule a utility payment, change a statement delivery preference, and initiate a new transfer in the OpenBank application.

  The Transfers section must contain two saved recipients: "Maya Fox" with the nickname "Kitchen fund", bank "OpenBank", routing number "125000105", and account number "6829415703"; and "Leo Hart" with the nickname "Storage fund", bank "OpenBank", routing number "102000021", and account number "4197358062". A new transfer must be submitted to "Maya Fox" with the memo "Kitchen followup", a date of "July 30, 2026", an amount of "2.95", and the source account "Everyday Checking ••••2381".

  The Security section must reflect the following saved states: the "Large purchase" alert has the "Push" notification channel turned off; the "Low balance" alert has the "Text" notification channel turned on; the "Upcoming bill" alert is marked as read; the "Payment due" alert has the "Text" notification channel turned on; and the "OpenBank Rewards Card" status is changed from "Unlocked" to "Locked".

  The Activity section must show a submitted dispute for the "Ace Hardware" transaction, with the reason "Canceled or returned item", the "I contacted the merchant" toggle turned on, and the details field containing "Return for rebate".

  The Pay & transfer section must include a submitted scheduled payment for the biller "City Utilities", sourced from "Everyday Checking ••••2381", with an amount of "46.38", a date of "2026-06-02", and a memo of "46.38".

  The Statements section must show the delivery preference for "Rainy Day Savings •••9140" changed from "Paper" to "Go paperless".
