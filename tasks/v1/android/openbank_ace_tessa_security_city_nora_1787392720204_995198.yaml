instruction: |-
  Complete a multi-part banking workflow in the OpenBank app, ensuring every entered value, selected option, and final state matches the specifications below exactly.

  File a dispute for the Ace Hardware transaction by setting the reason to “Canceled or returned item,” enabling the “I contacted the merchant” toggle, and entering “Return for rebate” in the details field before submitting.

  Update the paperless setting for the Rainy Day Savings account ending in 9140 by changing the “Go paperless” setting from “Paper” to paperless and saving the change.

  Create a new transfer recipient named Tessa Quinn with the nickname “Lighting fund,” bank “OpenBank,” routing number “064000020,” and account number “7359041826,” then save the recipient.

  Submit a new transfer to Tessa Quinn with the memo “Audit fee,” the date July 30, 2026, the amount 1.35, and the source account “Everyday Checking ••••2381.”

  In the Security section, mark the “Upcoming bill” alert as read, turn off the “Push” notification toggle in the “Large purchase” alert form and save it, mark the “New sign-in from macOS” alert as read, and lock the “Everyday Checking debit card” by changing its status from “Unlocked” to locked.

  Schedule a bill payment in the Pay & transfer section by selecting “City Utilities” as the biller and “Everyday Checking ••••2381” as the source account, entering 68.24 for both the amount and the memo, and setting the payment date to 2026-06-06.

  Create a second transfer recipient named Nora Vale with the nickname “Cloud backup,” bank “OpenBank,” routing number “084000026,” and account number “2517964308,” then save the recipient.
