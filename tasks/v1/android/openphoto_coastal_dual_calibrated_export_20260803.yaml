    source_instruction: |-
      任务：在 OpenPhotoEdit 中分别导入两张右上角带三原色校准区的海岸悬崖人物照片，按指定数值完成两套风格不同的编辑并各导出一张成片。只能在 Android 桌面、OpenPhotoEdit 和 Android Photo Picker 中操作，不要切换到无关应用。本任务不需要登录或注册；不要 Sign Out / 不要退出登录。最终导出第二张坐姿人物海岸成片后，停留在 OpenPhotoEdit 当前编辑器页面，不要返回首页。

      重要环境说明：本任务使用 Android Studio Quail 1 Android Emulator/AVD `AndroidWorldAvd_20260611_1`，VM 快照显示名称为 `snap_2026-08-03_16-11-57`。运行前 VM 应已经处于这个快照对应的初始状态。快照中必须已安装 OpenPhotoEdit 包 `com.killt.openphotoedit`，并且系统 Photo Picker 顶部可见右上角带三原色校准区的海岸悬崖坐姿人物照片和站立人物照片。快照初始状态不应存在 `/sdcard/Pictures/OpenPhotoEdit/OpenPhotoEdit_*.jpg` 导出图。

      1. 确认 OpenPhotoEdit 首页已打开，并能看到 "Import Photo"。
      2. 点击首页的 "Import Photo"。
      3. 在 Android Photo Picker 中点击或确认停留在 "Photos" 标签页。
      4. 在照片网格顶部找到右上角带三原色校准区的两张海岸悬崖人物照片。
      5. 找到“男子站在海岸悬崖边远眺”的照片缩略图；它通常在顶部第一行中间位置。
      6. 长按这张站立人物海岸照缩略图，直到打开照片预览页。
      7. 在预览页底部点击 "Add"，把站立人物海岸照导入 OpenPhotoEdit。
      8. 导入后确认进入 OpenPhotoEdit 编辑器页面，顶部可以看到 "Export"。
      9. 在底部工具栏选择 "Edit"。
      10. 在 Edit 工具行选择 "Exposure"。
      11. 把 Exposure 滑块拖到 -4。
      12. 在 Edit 工具行选择 "Contrast"。
      13. 把 Contrast 滑块拖到 +16。
      14. 在 Edit 工具行选择 "Saturation"。
      15. 把 Saturation 滑块拖到 -8。
      16. 在底部工具栏选择 "Landscape"。
      17. 在 Landscape 工具行选择 "Structure"。
      18. 把 Structure 滑块拖到 +18。
      19. 在 Landscape 工具行选择 "Sky"。
      20. 把 Sky 滑块拖到 +14。
      21. 在 Landscape 工具行找到 "Cool Tone"。
      22. 在 Landscape 工具行选择 "Cool Tone"。
      23. 把 Cool Tone 滑块拖到 +6。
      24. 在 Landscape 工具行找到并选择 "HDR"。
      25. 把 HDR 滑块拖到 +8。
      26. 在底部工具栏选择 "HSL"。
      27. 在颜色行选择 "Blue"。
      28. 在参数行选择 "Saturation"。
      29. 把 Blue 的 Saturation 滑块拖到 +12。
      30. 在参数行选择 "Luminance"。
      31. 把 Blue 的 Luminance 滑块拖到 -7。
      32. 在颜色行选择 "Cyan"。
      33. 在参数行选择 "Hue"。
      34. 把 Cyan 的 Hue 滑块拖到 -5。
      35. 在底部工具栏选择 "Filters"。
      36. 选择 "Film" 滤镜。
      37. 把 Amount 滑块拖到 22。
      38. 点击顶部 "Export"，导出站立人物海岸成片；等待导出完成，不要重复点击 Export。
      39. 点击 OpenPhotoEdit 顶部返回控件。
      40. 在弹出的放弃编辑对话框中点击 "Discard"，关闭已经导出完成的第一张工作副本并返回首页。
      41. 在首页再次点击 "Import Photo"。
      42. 在 Android Photo Picker 中点击或确认停留在 "Photos" 标签页。
      43. 在照片网格顶部找到右上角带三原色校准区的海岸悬崖坐姿人物照片；忽略刚导出的无校准区成片。
      44. 长按“同一男子坐在海岸悬崖边”的照片缩略图，直到打开照片预览页。
      45. 在预览页底部点击 "Add"，把坐姿人物海岸照导入 OpenPhotoEdit。
      46. 导入后确认进入 OpenPhotoEdit 编辑器页面。
      47. 在底部工具栏选择 "Edit"。
      48. 在 Edit 工具行选择 "Exposure"。
      49. 把 Exposure 滑块拖到 +8。
      50. 在 Edit 工具行选择 "Brightness"。
      51. 把 Brightness 滑块拖到 +6。
      52. 在 Edit 工具行选择 "Contrast"。
      53. 把 Contrast 滑块拖到 +10。
      54. 在 Edit 工具行选择 "Temperature"。
      55. 把 Temperature 滑块拖到 +5。
      56. 在底部工具栏选择 "Portrait"。
      57. 在 Portrait 工具行选择 "Smooth"。
      58. 把 Smooth 滑块拖到 +8。
      59. 在 Portrait 工具行选择 "Whiten"。
      60. 把 Whiten 滑块拖到 +4。
      61. 在底部工具栏选择 "HSL"。
      62. 在颜色行选择 "Orange"。
      63. 在参数行选择 "Luminance"。
      64. 把 Orange 的 Luminance 滑块拖到 +7。
      65. 在颜色行选择 "Blue"。
      66. 在参数行选择 "Saturation"。
      67. 把 Blue 的 Saturation 滑块拖到 +10。
      68. 在底部工具栏选择 "Landscape"。
      69. 在 Landscape 工具行选择 "Structure"。
      70. 把 Structure 滑块拖到 +12。
      71. 在底部工具栏选择 "Filters"。
      72. 选择 "Clean" 滤镜。
      73. 把 Amount 滑块拖到 18。
      74. 点击顶部 "Export"，导出坐姿人物海岸成片。
      75. 等待导出完成，最终停留在当前 OpenPhotoEdit 编辑器页面，不要返回首页，不要 Sign Out / 不要退出登录。
