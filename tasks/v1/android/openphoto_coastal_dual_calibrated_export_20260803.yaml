task_id: android.openphoto.coastal_dual_calibrated_export_20260803
platform: android
instruction: In OpenPhotoEdit, produce two exported images from the calibrated coastal cliff photos, leaving
  the application open on the editor page for the second image. The first exported image must be derived
  from the photo showing a man standing at the edge of the cliff looking into the distance, identifiable
  by the three primary color calibration blocks in its upper-right corner, with Exposure set to -4, Contrast
  to +16, and Saturation to -8 in the Edit section; Structure set to +18, Sky to +14, Cool Tone to +6,
  and HDR to +8 in the Landscape section; Blue Saturation set to +12, Blue Luminance set to -7, and Cyan
  Hue set to -5 in the HSL section; and the Film filter applied with an Amount of 22. The second exported
  image must be derived from the photo showing the same man sitting at the edge of the cliff, also identifiable
  by the three primary color calibration blocks in its upper-right corner, with Exposure set to +8, Brightness
  set to +6, Contrast set to +10, and Temperature set to +5 in the Edit section; Smooth set to +8 and
  Whiten set to +4 in the Portrait section; Orange Luminance set to +7 and Blue Saturation set to +10
  in the HSL section; Structure set to +12 in the Landscape section; and the Clean filter applied with
  an Amount of 18. The editing session for the first image must be discarded after its export, while the
  application state at completion must remain on the current OpenPhotoEdit editor page for the second
  image without returning to the home screen or signing out.
