  exact text “Garage setup” in the Order Note field. The review must be submitted for the Polar Day Slim
  Business Backpack item within the existing order with the ID TBH-LUCAS-20260321-004, setting the rating
  to 5 out of 5 and entering the exact text “Bright image” in the review text box. The final state of
  the app must be the order history page displaying the submitted rating and review for the backpack in
  order TBH-LUCAS-20260321-004, with the user remaining signed in to the Lucas Lin account.
