instruction: |-
  Produce a coordinated set of engagement, messaging, and posting actions in OpenTwitter while signed in as Alex Chen (@alex), leaving the Messages conversation list as the visible screen at completion without signing out.

  The post by Zoe Bennett beginning with “Research synthesis from seven onboarding sessions: users trusted the checklist more when completed items stayed visible.”, found within the Research synthesis trend under the For you tab in Explore, must be liked, saved, and replied to with the exact text “Research note set”. Rachel Stone’s profile, accessed via the Help center search trend under the Entertainment tab in Explore, must be followed, and her post beginning with “Renaming a feature late is expensive. Update onboarding, help search terms, tooltips, emails, and dashboard labels in the same pass.”, located on the same Help center search results page, must be liked, saved, and replied to with the exact text “Search copy is clear”.

  Four direct messages must be sent from the Messages section: “Research note logged” to Zoe Bennett, “Reply plan approved” to Amina Okafor, “Focus notes filed.” to Maya Patel, and “Recap link is live” to Nora Fields.

  Two new posts must be created on the Home screen in this order: “Release brief ready” followed by “Search owner added”. Once both are published, the “Release brief ready” post must be visible in the Home feed and must be replied to with the exact text “Brief link is live”, liked, saved, and reposted.

  All notifications in the Notifications section must be marked as read, and the final visible screen must be the Messages conversation list.
