      41. 向上滑动最新的 Dumpling Room No. 20 San Jose CA 订单卡片并点击 Reorder 按钮。
      42. 向上滑动到 Cart 区域并点击购物车第一行数量右侧的加号按钮，使数量从 3 变为 4。
