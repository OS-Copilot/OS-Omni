      16. 点击购物车中的 Coupon 下拉框。
      17. 点击 WELCOME12 - $12 off orders over $30 选项。
      18. 向上滑动 Cart 区域并点击购物车中的 Place order 按钮，创建第一张 Dumpling Room 订单。
      19. 向上滑动最新订单卡片并点击该卡片里的 Advance status 按钮，将第一张订单推进到 Out for delivery。
      20. 向上滑动最新订单卡片并点击该卡片里的 Advance status 按钮，将第一张订单推进到 Delivered。
      21. 向下滑动到 Orders 页面顶部并点击 Wallet 按钮。
      22. 向上滑动 Wallet 页面并点击 Enter voucher code 文本框。
      23. 使用键盘输入 `LUNCH5`。
      24. 向上滑动 Wallet 页面并点击 Claim 按钮。
      25. 向下滑动到 Wallet 页面顶部并点击 Support 按钮。
      26. 点击 New support ticket 表单里的 Subject 文本框。
      27. 使用键盘输入 `Coupon total review`。
      28. 点击 Message 文本框。
