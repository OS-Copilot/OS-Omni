    source_instruction: |-
      请只通过可见的 Android GUI 完成这个 OpenFood 工作流。从 Android Studio 快照 `snap_2026-07-29_17-27-46` 开始，OpenFood 已安装，已登录 Lucas Lin，并且快照中已包含任务需要的餐厅、菜单、WELCOME12 和 LUNCH5 种子数据。不要 Sign Out / 不要退出登录。最终停留在 Merchant 页面。
      处理 Search、voucher code、Subject、Message 等文本框时，先点击目标文本框；如果文本框里已有内容或输入结果不正确，请使用全选清空后一次性输入完整目标文本，不要逐字反复补输。全选可以通过 Android GUI 键盘快捷操作 Ctrl+A 完成，然后重新输入完整文本。

