      2. 点击顶部的 Restaurants 按钮。
      3. 向上滑动 Restaurants 页面并点击 Search 文本框。
      4. 使用键盘输入 `dumpling`。
      5. 点击 Cuisine 下拉框。
      6. 点击下拉列表里的 Chinese 选项。
      7. 点击 Sort 下拉框。
      8. 点击下拉列表里的 Fastest 选项。
      9. 向上滑动结果列表并点击 Dumpling Room No. 20 San Jose CA 卡片里的 View menu 按钮。
      10. 向上滑动餐厅详情页找到 Pork Dumplings，并点击其下方的 Add to cart 按钮。
      11. 向上滑动 Menu 区域找到 Beef Chow Fun，并点击其下方的 Add to cart 按钮。
      12. 向上滑动 Menu 区域找到 Mapo Tofu，并点击其下方的 Add to cart 按钮。
      13. 向上滑动到 Cart 区域并点击购物车第一行数量右侧的加号按钮，使数量变为 2。
      14. 点击购物车第二行数量右侧的加号按钮，使数量变为 2。
