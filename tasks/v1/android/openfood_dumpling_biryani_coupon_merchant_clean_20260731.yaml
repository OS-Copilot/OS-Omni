instruction: Produce a completed OpenFood session for Lucas Lin that includes three Dumpling Room No.
  20 San Jose CA orders, one Fresh Biryani Block 38 Aurora IL order, a claimed LUNCH5 voucher, a support
  ticket, and specific merchant availability changes. The first Dumpling Room order must be placed from
  a search for “dumpling” filtered by Chinese cuisine and sorted by Fastest, containing Pork Dumplings,
  Beef Chow Fun, and Mapo Tofu each at a quantity of 2, with the coupon WELCOME12 - $12 off orders over
  $30 applied, and its status advanced to Out for delivery and then Delivered. The second Dumpling Room
  order must be placed via the Reorder function from the most recent prior order, containing Pork Dumplings,
  Beef Chow Fun, and Mapo Tofu each at a quantity of 3, with the coupon LUNCH5 - $5 off orders over $15
  applied, and its status advanced to Out for delivery and then Delivered. The third Dumpling Room order
  must be placed via the Reorder function from the most recent prior order, containing Pork Dumplings,
  Beef Chow Fun, and Mapo Tofu each at a quantity of 4, with the coupon WELCOME12 - $12 off orders over
  $30 applied, and its status advanced to Out for delivery and then Delivered. The Fresh Biryani Block
  order must be placed from a search for “biryani” filtered by Indian cuisine and sorted by Rating, containing
  Butter Chicken at a quantity of 2, Chicken Biryani at a quantity of 1, Paneer Tikka Bowl at a quantity
  of 1, and Garlic Naan at a quantity of 1, with the coupon LUNCH5 - $5 off orders over $15 applied, and
  its status advanced to Out for delivery and then Delivered. The Wallet section must contain a claimed
  voucher entered with the code LUNCH5. The Support section must contain a new ticket with the Subject
  exactly “Coupon total review” and the Message exactly “Check coupon total”. The Merchant section must
  show City Little Saigon Grill marked as closed, with Heritage Banh Mi Combo, Fresh Banh Mi Combo, and
  Golden Banh Mi Combo each marked as unavailable. The final state must have the Merchant page visible,
  Lucas Lin remaining logged in, and all specified orders, the support ticket, the claimed voucher, and
  the merchant availability changes in place.
