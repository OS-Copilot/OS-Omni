      30. 向上滑动表单并点击 Create ticket 按钮。
      31. 向下滑动到 Support 页面顶部并点击 Orders 按钮。
      32. 向上滑动最新的 Dumpling Room No. 20 San Jose CA 订单卡片并点击 Reorder 按钮。
      33. 向上滑动到 Cart 区域并点击购物车第一行数量右侧的加号按钮，使数量从 2 变为 3。
