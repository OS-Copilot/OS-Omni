platform: android
instruction: |-
  Execute a multi-part OpenFood workflow while remaining signed in as Lucas Lin and never signing out.

  The first order at Smokehouse at Union 40 Aurora IL must contain Smoked Brisket Plate, Pulled Pork Sandwich, and Mac and Cheese, each with a quantity of 2, and must have the WELCOME12 coupon applied before submission. This order must be advanced through its statuses until it reaches Out for delivery, and finally to Delivered.

  A voucher with the code FEAST20 must be redeemed in the Wallet section. A new support ticket must be created with the subject exactly "BBQ receipt review" and the message exactly "Check BBQ receipt".

  The second order, generated by reordering the most recent delivered Smokehouse at Union 40 Aurora IL order, must contain Smoked Brisket Plate, Pulled Pork Sandwich, and Mac and Cheese, each with a quantity increased from 2 to 3, and must have the FEAST20 coupon applied before submission. This order must be advanced to Out for delivery and then to Delivered.

  The third order, generated by reordering the second delivered Smokehouse at Union 40 Aurora IL order, must contain Smoked Brisket Plate, Pulled Pork Sandwich, and Mac and Cheese, each with a quantity increased from 3 to 4, and must have the FEAST20 coupon applied before submission. This order must be advanced to Out for delivery and then to Delivered.

  The fourth order at Espresso Bar No. 32 Rochester NY must contain Iced Latte with a quantity of 2, and Cold Brew, Breakfast Sandwich, and Butter Croissant each with a quantity of 1, and must have the WELCOME12 coupon applied before submission. This order must be advanced to Out for delivery and then to Delivered.

  The Merchant page must display Smokehouse at Union 40 Aurora IL as closed, with the availability of Smoked Brisket Plate, Pulled Pork Sandwich, and Mac and Cheese toggled to unavailable. The task is complete when the Merchant page is visible, the Smokehouse restaurant is closed, the three specified menu items are unavailable, and the user remains logged in as Lucas Lin.
