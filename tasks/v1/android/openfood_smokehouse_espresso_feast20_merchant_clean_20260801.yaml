    source_instruction: |-
      请只通过可见的 Android GUI 完成这个 OpenFood 工作流。从 Android Studio 快照 `snap_2026-07-29_17-27-46` 开始，OpenFood 已安装，已经登录为 Lucas Lin，并且快照中已经包含任务需要的餐厅、菜单、WELCOME12 和 FEAST20 种子数据。不要 Sign Out / 不要退出登录。最终停留在 Merchant 页面。

      处理 Search、voucher code、Subject、Message 等文本框时，先点击目标文本框；如果文本框里已有内容或输入结果不正确，请使用全选清空后一次性输入完整目标文本，不要逐字反复补输。

      1. 点击 Android 虚拟机桌面上的 OpenFood 图标打开软件。
      2. 进入 Restaurants 页面，找到 Smokehouse at Union 40 Aurora IL 并打开菜单。
      3. 将 Smoked Brisket Plate、Pulled Pork Sandwich、Mac and Cheese 加入购物车，把三项数量都调整为 2，选择 WELCOME12 优惠券并下单。
      4. 在 Orders 页面把这张 Smokehouse 订单连续推进到 Out for delivery，再推进到 Delivered。
      5. 进入 Wallet 页面，输入并领取 voucher code `FEAST20`。
      6. 进入 Support 页面，创建一张新的 support ticket：Subject 输入 `BBQ receipt review`，Message 输入 `Check BBQ receipt`。
      7. 回到 Orders 页面，对最新的 Smokehouse at Union 40 Aurora IL 已送达订单点击 Reorder。
      8. 在购物车中把 Smoked Brisket Plate、Pulled Pork Sandwich、Mac and Cheese 的数量都从 2 调整为 3，选择 FEAST20 优惠券并下单。
      9. 把第二张 Smokehouse 订单连续推进到 Out for delivery，再推进到 Delivered。
      10. 对第二张 Smokehouse at Union 40 Aurora IL 已送达订单点击 Reorder。
      11. 在购物车中把 Smoked Brisket Plate、Pulled Pork Sandwich、Mac and Cheese 的数量都从 3 调整为 4，选择 FEAST20 优惠券并下单。
      12. 把第三张 Smokehouse 订单连续推进到 Out for delivery，再推进到 Delivered。
      13. 回到 Restaurants 页面，找到 Espresso Bar No. 32 Rochester NY 并打开菜单。
      14. 将 Iced Latte、Cold Brew、Breakfast Sandwich、Butter Croissant 加入购物车，把 Iced Latte 数量调整为 2，选择 WELCOME12 优惠券并下单。
      15. 把 Espresso Bar 订单连续推进到 Out for delivery，再推进到 Delivered。
      16. 进入 Merchant 页面，将 Smokehouse at Union 40 Aurora IL 标记为 closed，并把 Smoked Brisket Plate、Pulled Pork Sandwich、Mac and Cheese 都切换为不可用。

      最终停留在 Merchant 页面，保持 Lucas Lin 登录状态，不要 Sign Out / 不要退出登录。
