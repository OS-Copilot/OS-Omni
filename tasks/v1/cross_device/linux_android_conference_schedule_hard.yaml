# Generated from tasks/v1/cross_vm/android_to_windows_conference_schedule_hard.yaml; see metadata.converted_from.
task_id: cross_device.linux_android.conference_schedule_hard
platform: linux
instruction: 'An Android phone is shown in the "Android phone" window on this Linux desktop. Use the phone only through that
  window, without a terminal or adb. First, on the phone: The transfer CSV "schedule_transfer.csv" is open in Markor on the
  phone, and the organizer''s note "schedule_source.txt" is in the same Markor folder. Each session in the note is written
  as Time | Room | Session | Speaker, and the last four lines are changes to apply. Using Markor only, rewrite the transfer
  CSV so it has the header Time,Room,Session,Speaker followed by one row per remaining session after every change is applied,
  sorted by Time and then by Room, with no spaces around commas and no other lines. Save the file and leave it ready to bring
  to this computer. Then put the finished "schedule_transfer.csv" on this computer as ~/Desktop/schedule_transfer.csv with
  exactly the same content (for example, copy its text on the phone and paste it into a text editor here). Last, on this computer:
  A blank LibreOffice Writer document named "conference_schedule.docx" is open. Use only LibreOffice Writer. Build the document
  in this exact order: "DevSummit 2026 Day 1" in the paragraph style Heading 1; then for each of Room A, Room B, and Room
  C a Heading 2 paragraph with the room name followed by a three-column table with the header row Time, Session, Speaker and
  one row per session in that room in time order; then "Speaker index" in Heading 2 followed by one paragraph per distinct
  speaker in alphabetical order in the form "<speaker>: <session>; <session>" listing that speaker''s sessions in time order;
  then "Totals" in Heading 2 followed by the paragraphs "Sessions: <count>", "Speakers: <distinct speakers>", and "Busiest
  room: <room> (<count> sessions)". All non-heading paragraphs use body text styles and the document must contain nothing
  else. Save the document in Word format, then also export it to PDF as "conference_schedule.pdf" in the same Documents folder.
  Apart from creating the file on the Desktop, do not use a text editor.'
init:
  initializer_id: initializers.linux.android_companion:LinuxAndroidCompanionInitializer
  params:
    android:
      initializer_id: initializers.android.cross_vm:AndroidTransferSourceInitializer
      params:
        source_path: /sdcard/Documents/markor/schedule_source.txt
        transfer_path: /sdcard/Documents/markor/schedule_transfer.csv
        open_path: /sdcard/Documents/markor/schedule_transfer.csv
        source_text: 'DevSummit 2026 - Day 1 schedule (Time | Room | Session | Speaker)

          09:00 | Room A | Opening keynote | Maya Chen

          09:00 | Room B | Accessibility clinic | Omar Haddad

          09:00 | Room C | Hiring for platform teams | Rosa Lima

          10:15 | Room A | Scaling event pipelines | Jordan Lee

          10:15 | Room B | Design tokens in practice | Priya Nair

          10:15 | Room C | Edge caching patterns | Kenji Sato

          11:30 | Room A | Observability on a budget | Theo Martin

          11:30 | Room B | Mobile offline sync | Lena Fischer

          11:30 | Room C | Cost reviews that stick | Sam Patel

          13:30 | Room A | Secure defaults for APIs | Rosa Lima

          13:30 | Room B | Testing flaky UIs | Kenji Sato

          13:30 | Room C | Feature flags at scale | Dana Ortiz

          14:45 | Room A | Data contracts | Sam Patel

          14:45 | Room B | Inclusive onboarding | Dana Ortiz

          14:45 | Room C | Incident review rituals | Theo Martin

          16:00 | Room A | Closing panel | Maya Chen

          16:00 | Room B | Design systems Q and A | Priya Nair

          16:00 | Room C | Platform roadmap | Jordan Lee

          Change: "Data contracts" is cancelled.

          Change: "Edge caching patterns" is cancelled.

          Change: "Testing flaky UIs" moves to 14:45 in Room A.

          Change: "Mobile offline sync" will be presented by Ines Duarte.

          '
        transfer_text: 'Time,Room,Session,Speaker

          09:00,Room A,Opening keynote,Maya Chen

          09:00,Room B,Accessibility clinic,Omar Haddad

          13:30,Room B,Testing flaky UIs,Kenji Sato

          14:45,Room A,Data contracts,Sam Patel

          '
    linux:
      steps:
      - type: run_bash
        timeout: 90
        script: "set -e\npkill -f soffice.bin || true\nrm -f /home/user/Desktop/schedule_transfer.csv\nmkdir -p /home/user/Documents\
          \ /home/user/Desktop\nUSERPROFILE=/home/user python3 -W ignore - <<'OSOMNI_PY'\nimport os, subprocess, sys\ndef\
          \ _need(mod, pkg):\n    try:\n        return __import__(mod)\n    except ImportError:\n        subprocess.check_call([sys.executable,\
          \ '-m', 'pip', 'install', pkg, '-q'])\n        return __import__(mod)\ndocx = _need('docx', 'python-docx')\npath\
          \ = os.path.join(os.environ['USERPROFILE'], 'Documents', 'conference_schedule.docx')\nos.makedirs(os.path.dirname(path),\
          \ exist_ok=True)\ndocx.Document().save(path)\nprint('INIT_OK', path)\nOSOMNI_PY"
      - type: run_bash
        timeout: 30
        script: 'export DISPLAY=${DISPLAY:-:0}

          setsid -f libreoffice --writer /home/user/Documents/conference_schedule.docx >/dev/null 2>&1 </dev/null'
      - type: wait
        ms: 8000
evaluation:
  evaluator_id: evaluators.linux.android_companion:LinuxAndroidCompositeEvaluator
  params:
    android:
