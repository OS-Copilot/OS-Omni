          \ A,Priya Nair\\n16:00,Room C,Platform roadmap,Jordan Lee\\n\"\npath = Path('/home/user/Desktop/schedule_transfer.csv')\n\
          norm = lambda s: s.replace('\\r\\n', '\\n').replace('\\r', '\\n').strip()\nif not path.is_file():\n    print('DESKTOP_FILE_MISSING');\
          \ raise SystemExit(1)\nif norm(path.read_text(encoding='utf-8-sig', errors='replace')) != norm(expected):\n    print('DESKTOP_FILE_MISMATCH');\
          \ raise SystemExit(1)\nprint('EVAL_RESULT:PASS')\nOSOMNI_PY"
        timeout: 60
        stdout_contains: EVAL_RESULT:PASS
    - evaluator_id: evaluators.cua_review.evaluators.linux.command_check:CommandCheckEvaluator
      params:
        command: "USERPROFILE=/home/user python3 -W ignore - <<'OSOMNI_PY'\nimport os, subprocess, sys\ndef _need(mod, pkg):\n\
          \    try:\n        return __import__(mod)\n    except ImportError:\n        subprocess.check_call([sys.executable,\
