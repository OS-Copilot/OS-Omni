          \ [norm(' '.join(row)) for row in grid]\n    columns = [norm(' '.join(row[i] for row in grid if i < len(row))) for\
          \ i in range(width)]\n    tables.append({'grid': grid, 'lines': rows + columns, 'shape': (len(grid), width)})\n\n\
          \ndef missing_facts(table, facts):\n    if table['shape'][0] < 2 or table['shape'][1] < 2:\n        return facts\n\
          \    return [fact for fact in facts if not any(all(has(line, term) for term in fact) for line in table['lines'])]\n\
          \n\ncandidates = {name: [i for i, table in enumerate(tables) if not missing_facts(table, facts)]\n             \
          \ for name, facts in SECTIONS.items()}\nowner = {}\n\n\ndef assign(name, seen):\n    for i in candidates[name]:\n\
          \        if i in seen:\n            continue\n        seen.add(i)\n        if i not in owner or assign(owner[i],\
          \ seen):\n            owner[i] = name\n            return True\n    return False\n\n\nunmatched = [name for name\
          \ in SECTIONS if not assign(name, set())]\nif unmatched:\n    for name in unmatched:\n        best = min(range(len(tables)),\
          \ key=lambda i: len(missing_facts(tables[i], SECTIONS[name])), default=None)\n        if best is None:\n       \
          \     detail = 'no tables'\n        elif candidates[name]:\n            detail = 'its only matching tables %r already\
          \ stand for other sections' % [i + 1 for i in candidates[name]]\n        else:\n            detail = 'closest table\
          \ %d misses %r' % (best + 1, missing_facts(tables[best], SECTIONS[name]))\n        print('MISSING_TABLE:' + name\
          \ + ': ' + detail)\n    print('ACTUAL=' + repr([table['grid'] for table in tables]))\n    raise SystemExit(1)\n\
          print('EVAL_RESULT:PASS')\nOSOMNI_PY"
