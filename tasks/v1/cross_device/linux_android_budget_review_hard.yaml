          \ Nair,Central,2026-07-04\\nSupplies,300,340,Theo Martin,East,2026-07-05\\nContingency,600,720,Maya Chen,Central,2026-07-08\\\
          nPermits,250,410,Jordan Lee,East,2026-07-09\\nTraining,500,455,Priya Nair,West,2026-07-10\\nEquipment,850,1025,Theo\
          \ Martin,Central,2026-07-11\\nInsurance,430,610,Maya Chen,East,2026-07-12\\nCatering,780,695,Priya Nair,Central,2026-07-13\\\
          nVenue,3200,3560,Jordan Lee,West,2026-07-14\\nSecurity,950,910,Theo Martin,East,2026-07-15\\nInterpretation,640,820,Maya\
          \ Chen,Central,2026-07-16\\nSignage,380,260,Jordan Lee,East,2026-07-17\\nTransport,1450,1695,Theo Martin,West,2026-07-18\\\
          nAccessibility,520,750,Priya Nair,Central,2026-07-19\\n\"\npath = Path('/home/user/Desktop/budget_transfer.csv')\n\
          norm = lambda s: s.replace('\\r\\n', '\\n').replace('\\r', '\\n').strip()\nif not path.is_file():\n    print('DESKTOP_FILE_MISSING');\
          \ raise SystemExit(1)\nif norm(path.read_text(encoding='utf-8-sig', errors='replace')) != norm(expected):\n    print('DESKTOP_FILE_MISMATCH');\
          \ raise SystemExit(1)\nprint('EVAL_RESULT:PASS')\nOSOMNI_PY"
        timeout: 60
        stdout_contains: EVAL_RESULT:PASS
    - evaluator_id: evaluators.cua_review.evaluators.linux.command_check:CommandCheckEvaluator
      params:
        command: |-
          USERPROFILE=/home/user python3 -W ignore - <<'OSOMNI_PY'
          import os, re, subprocess, sys, datetime
          from pathlib import Path
          try:
              from openpyxl import load_workbook
          except ImportError:
              subprocess.check_call([sys.executable, '-m', 'pip', 'install', 'openpyxl', '-q'])
              from openpyxl import load_workbook
          from openpyxl.utils.cell import range_boundaries
          from openpyxl.worksheet.formula import ArrayFormula

          # Grade what the brief states, not one way of building it. The brief names the six sheets,
          # the RawBudget columns and rows, the twelve VarianceReview columns (computed with formulas
          # that reference RawBudget, one row per budget row), the EscalationQueue filter (Variance Abs
          # at least 100, formulas that reference VarianceReview), SUMIF/COUNTIFS summaries by owner and
          # by region, and the eight ControlPanel items. It does not give the Status/Severity/Disposition
          # policy, the summary or queue columns, row orders, labels, or the transfer-status text, so
          # those are free. Values are read from the results LibreOffice saves with each formula; a
          # row is identified by its Category (owner/region for the summaries). Where a column or
          # label names a quantity the brief defines (planned, actual, variance, escalations, ...), its
          # value must be right.
          path = Path(os.environ['USERPROFILE']) / 'Documents' / 'budget_review.xlsx'
          wb = load_workbook(path, data_only=False)
          saved = load_workbook(path, data_only=True)


          def fail(code, detail=''):
              print(code + (':' + str(detail) if detail != '' else ''))
              raise SystemExit(1)


          SHEETS = ['RawBudget', 'VarianceReview', 'EscalationQueue', 'OwnerSummary', 'RegionalSummary', 'ControlPanel']
          if wb.sheetnames[:len(SHEETS)] != SHEETS:
              fail('SHEET_MISMATCH', repr(wb.sheetnames))

          HEADER = ['Category', 'Planned', 'Actual', 'Owner', 'Region', 'DueDate']
          BUDGET = [
              ('Travel', 1200, 980, 'Jordan Lee', 'West', '2026-07-01'),
              ('Lodging', 2100, 2240, 'Maya Chen', 'West', '2026-07-03'),
              ('Meals', 450, 390, 'Priya Nair', 'Central', '2026-07-04'),
              ('Supplies', 300, 340, 'Theo Martin', 'East', '2026-07-05'),
              ('Contingency', 600, 720, 'Maya Chen', 'Central', '2026-07-08'),
              ('Permits', 250, 410, 'Jordan Lee', 'East', '2026-07-09'),
              ('Training', 500, 455, 'Priya Nair', 'West', '2026-07-10'),
              ('Equipment', 850, 1025, 'Theo Martin', 'Central', '2026-07-11'),
              ('Insurance', 430, 610, 'Maya Chen', 'East', '2026-07-12'),
              ('Catering', 780, 695, 'Priya Nair', 'Central', '2026-07-13'),
              ('Venue', 3200, 3560, 'Jordan Lee', 'West', '2026-07-14'),
              ('Security', 950, 910, 'Theo Martin', 'East', '2026-07-15'),
              ('Interpretation', 640, 820, 'Maya Chen', 'Central', '2026-07-16'),
              ('Signage', 380, 260, 'Jordan Lee', 'East', '2026-07-17'),
              ('Transport', 1450, 1695, 'Theo Martin', 'West', '2026-07-18'),
              ('Accessibility', 520, 750, 'Priya Nair', 'Central', '2026-07-19'),
          ]
          ROWS = [dict(zip(HEADER, row), Variance=row[2] - row[1]) for row in BUDGET]
          ESCALATED = [row['Category'] for row in ROWS if abs(row['Variance']) >= 100]
          COMPUTED = ['Variance', 'Variance Abs', 'Status', 'Severity', 'Review Flag', 'Disposition', 'Recheck Owner',
                      'Review Slot', 'Audit ID', 'Cross-VM Trace', 'Evidence Link', 'Packet Type']
          CONDITIONAL = re.compile(r'\b(?:SUMIFS?|COUNTIFS?)\s*\(')


          def key(text):
              return re.sub(r'[^0-9a-z]+', '', str(text).lower())


          def words(text):
              return ' '.join(re.sub(r'[^0-9a-z]+', ' ', str(text).lower()).split())


          def number(value):
              if isinstance(value, bool) or not isinstance(value, (int, float)):
                  return None
              return float(value)


          def same_number(value, expected):
              got = number(value)
              return got is not None and abs(got - expected) < 1e-6


          def read(name):
              """Cells of a sheet: (row, col) -> (formula text or None, saved value)."""
              ws, values = wb[name], saved[name]
              spilled = {}
              for row in ws.iter_rows():
                  for cell in row:
                      if isinstance(cell.value, ArrayFormula) and cell.value.ref:
                          c1, r1, c2, r2 = range_boundaries(cell.value.ref)
                          for r in range(r1, r2 + 1):
                              for c in range(c1, c2 + 1):
                                  spilled[(r, c)] = str(cell.value.text or '')
              cells = {}
              for row in ws.iter_rows():
                  for cell in row:
                      raw = cell.value
                      if isinstance(raw, ArrayFormula):
                          formula = str(raw.text or '')
                      elif isinstance(raw, str) and raw.startswith('='):
                          formula = raw
                      else:
                          formula = spilled.get((cell.row, cell.column))
                      value = values.cell(cell.row, cell.column).value if formula is not None else raw
                      if formula is None and (value is None or (isinstance(value, str) and not value.strip())):
                          continue
                      cells[(cell.row, cell.column)] = (formula, value)
              return cells


          def rows_of(cells):
              rows = {}
              for (r, c), cell in cells.items():
                  rows.setdefault(r, {})[c] = cell
              return dict(sorted(rows.items()))


          def code(formula):
              return re.sub(r'"[^"]*"', '""', (formula or '').upper())


          def references(formula, sheet):
              return re.search(r"(?<![A-Z0-9_])'?" + sheet.upper() + r"'?\s*[!.]", code(formula)) is not None


          def identify(row, names):
              """The one name of `names` that a cell of the row shows, or None."""
              found = {key(v) for _, v in row.values() if isinstance(v, str)} & {key(n) for n in names}
              matches = [n for n in names if key(n) in found]
              return matches[0] if len(matches) == 1 else (None if not matches else '__AMBIGUOUS__')


          def keyed_rows(sheet, cells, names, header_row):
              by_name = {}
              for r, row in rows_of(cells).items():
                  if r <= header_row:
                      continue
                  name = identify(row, names)
                  if name == '__AMBIGUOUS__':
                      fail(sheet.upper() + '_ROW_NAMES_SEVERAL', r)
                  if name is None:
                      continue
                  if name in by_name:
                      fail(sheet.upper() + '_DUPLICATE_ROW', name)
                  by_name[name] = (r, row)
              return by_name


          def same_value(value, expected):
              if isinstance(expected, str):
                  if isinstance(value, (datetime.datetime, datetime.date)) and re.fullmatch(r'\d{4}-\d{2}-\d{2}', expected):
                      return value.strftime('%Y-%m-%d') == expected and (
                          not isinstance(value, datetime.datetime) or value.time() == datetime.time(0))
                  return isinstance(value, str) and value.strip() == expected
              return same_number(value, expected)


          # --- Sheet 1: RawBudget holds the CSV header and its sixteen rows.
          raw = read('RawBudget')
          for r, expected in enumerate([HEADER] + [list(row) for row in BUDGET], start=1):
              actual = [raw.get((r, c), (None, None))[1] for c in range(1, len(HEADER) + 1)]
              if not all(same_value(a, e) for a, e in zip(actual, expected)):
                  fail('RawBudget_MISMATCH', 'row %d: %r' % (r, actual))

          # --- Sheet 2: VarianceReview, one formula row per budget row with the twelve named columns.
          review = read('VarianceReview')
          review_rows = rows_of(review)
          header_row, columns = None, {}
          for r, row in list(review_rows.items())[:5]:
              names = {key(v): c for c, (_, v) in row.items() if isinstance(v, str)}
              if all(key(name) in names for name in COMPUTED):
                  header_row, columns = r, {name: names[key(name)] for name in COMPUTED}
                  break
          if header_row is None:
              first = next(iter(review_rows.values()), {})
              present = {key(v) for _, v in first.values() if isinstance(v, str)}
              fail('VarianceReview_MISSING_COLUMNS', [name for name in COMPUTED if key(name) not in present])
          table_columns = set(review_rows[header_row])
          by_category = keyed_rows('VarianceReview', review, [row['Category'] for row in ROWS], header_row)
          missing = [row['Category'] for row in ROWS if row['Category'] not in by_category]
          if missing:
              fail('VarianceReview_MISSING_ROWS', missing)
          severity = {}
          for budget in ROWS:
              r, row = by_category[budget['Category']]
              for c in sorted(table_columns):
                  if c in row and row[c][0] is None:
                      fail('VarianceReview_TYPED_VALUE', '%s row %d column %d: %r' % (budget['Category'], r, c, row[c][1]))
              for name, c in columns.items():
                  if c not in row or row[c][0] is None:
                      fail('VarianceReview_FORMULA_MISSING', '%s: %s' % (budget['Category'], name))
              if not any(references(formula, 'RawBudget') for formula, _ in row.values()):
                  fail('VarianceReview_NO_RAWBUDGET_REFERENCE', budget['Category'])
              for name, expected in (('Variance', budget['Variance']), ('Variance Abs', abs(budget['Variance']))):
                  formula, value = row[columns[name]]
                  if not same_number(value, expected):
                      fail('VarianceReview_WRONG_' + name.upper().replace(' ', '_'),
                           '%s: %s gives %r, expected %r' % (budget['Category'], formula, value, expected))
              severity[budget['Category']] = words(row[columns['Severity']][1] or '')
          critical = {category for category, text in severity.items() if text == 'critical'}

          # --- Sheet 3: EscalationQueue lists exactly the rows with Variance Abs at least 100, by formula.
          queue = read('EscalationQueue')
          listed = keyed_rows('EscalationQueue', queue, [row['Category'] for row in ROWS], 0)
          extra = [name for name in listed if name not in ESCALATED]
          missing = [name for name in ESCALATED if name not in listed]
          if extra or missing:
              fail('EscalationQueue_ROWS', 'extra %r, missing %r' % (extra, missing))
          for name, (r, row) in listed.items():
              typed = [c for c, (formula, _) in row.items() if formula is None]
              if typed:
                  fail('EscalationQueue_TYPED_VALUE', '%s row %d columns %r' % (name, r, typed))
              if not any(references(formula, 'VarianceReview') for formula, _ in row.values()):
                  fail('EscalationQueue_NO_VARIANCEREVIEW_REFERENCE', name)


          # --- Sheets 4 and 5: SUMIF/COUNTIFS summaries by owner and by region.
          def measure(header):
              """What a summary column or ControlPanel label names, when the brief defines it."""
              text = words(header)
              tokens = set(text.split())
              if tokens & {'avg', 'average', 'mean', 'median', 'max', 'min', 'maximum', 'minimum', 'pct', 'percent',
                           'percentage', 'rate', 'ratio', 'share'}:
                  return None
              if 'variance' in text and 'abs' in text:
                  return 'abs_variance'
              if 'variance' in text:
                  return 'variance'
              if 'escalat' in text:
                  return 'escalations'
              if 'critical' in text:
                  return 'critical'
              if 'planned' in text or 'plan' in tokens:
                  return 'planned'
              if 'actual' in text:
                  return 'actual'
              if tokens & {'row', 'rows', 'record', 'records', 'item', 'items', 'line', 'lines', 'entries'} or text == 'count':
                  return 'rows'
              if 'status' in tokens or 'android' in tokens or 'transfer' in tokens:
                  return 'status'
              return None


          def totals(rows):
              return {
                  'planned': sum(row['Planned'] for row in rows),
                  'actual': sum(row['Actual'] for row in rows),
                  'variance': sum(row['Variance'] for row in rows),
                  'abs_variance': sum(abs(row['Variance']) for row in rows),
                  'escalations': sum(abs(row['Variance']) >= 100 for row in rows),
                  'critical': sum(row['Category'] in critical for row in rows),
                  'rows': len(rows),
              }


          for sheet, field in (('OwnerSummary', 'Owner'), ('RegionalSummary', 'Region')):
              cells = read(sheet)
              sheet_rows = rows_of(cells)
              groups = list(dict.fromkeys(row[field] for row in ROWS))
              found = keyed_rows(sheet, cells, groups, 0)
              missing = [name for name in groups if name not in found]
              if missing:
                  fail(sheet + '_MISSING_ROWS', missing)
              # The column titles are the text row just above the first summary row.
              first = min(r for r, _ in found.values())
              titled = [r for r, row in sheet_rows.items() if r < first and any(isinstance(v, str) for _, v in row.values())]
              headers = {c: v for c, (_, v) in sheet_rows[titled[-1]].items() if isinstance(v, str)} if titled else {}
              for name, (r, row) in found.items():
                  if not any(CONDITIONAL.search(code(formula)) for formula, _ in row.values()):
                      fail(sheet + '_NO_SUMIF_COUNTIFS', name)
                  expected = totals([budget for budget in ROWS if budget[field] == name])
                  for c, title in headers.items():
                      what = measure(title)
                      if what in (None, 'status') or c not in row:
                          continue
                      formula, value = row[c]
                      if formula is None:
                          fail(sheet + '_TYPED_VALUE', '%s %s: %r' % (name, title, value))
                      if not same_number(value, expected[what]):
                          fail(sheet + '_WRONG_VALUE', '%s %s: %r, expected %r' % (name, title, value, expected[what]))

          # --- Sheet 6: ControlPanel shows the eight items the brief lists.
          panel = read('ControlPanel')
          overall = totals(ROWS)
          allowed = {
              'rows': [overall['rows']], 'planned': [overall['planned']], 'actual': [overall['actual']],
              'variance': [overall['variance']],
              # "absolute variance": the sum of Variance Abs, or the absolute value of the net variance.
              'abs_variance': [overall['abs_variance'], abs(overall['variance'])],
              'escalations': [overall['escalations']], 'critical': [overall['critical']],
          }
          items = {}
          for (r, c) in sorted(panel):
              formula, value = panel[(r, c)]
              if formula is not None or not isinstance(value, str):
                  continue
              what = measure(value)
              if what is None or what in items:
                  continue
              # The value sits to the right of its label (a list) or below it (a row of labels).
              right = [panel[(r, cc)][1] for cc in range(c + 1, c + 4) if (r, cc) in panel]
              below = panel.get((r + 1, c), (None, None))[1]
              if what == 'status':
                  beside = right[0] if right else None
                  is_label = isinstance(beside, str) and measure(beside) not in (None, 'status')
                  items[what] = (value, below if beside is None or is_label else beside)
              else:
                  numbers = [v for v in right[:1] + [below] if number(v) is not None]
                  items[what] = (value, numbers[0] if numbers else (right[0] if right else below))
          for what in ['rows', 'planned', 'actual', 'variance', 'abs_variance', 'escalations', 'critical', 'status']:
              if what not in items:
                  fail('ControlPanel_MISSING', what)
              label, value = items[what]
              if what == 'status':
                  if value is None or not str(value).strip():
                      fail('ControlPanel_EMPTY', label)
              elif not any(same_number(value, expected) for expected in allowed[what]):
                  fail('ControlPanel_WRONG_VALUE', '%s: %r, expected %r' % (label, value, allowed[what]))
          print('EVAL_RESULT:PASS')
          OSOMNI_PY
        timeout: 120
        stdout_contains: EVAL_RESULT:PASS
