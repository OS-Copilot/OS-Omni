        transfer_text: 'Category,Planned,Actual,Owner,Region,DueDate

          Travel,1200,980,Jordan Lee,West,2026-07-01

          Lodging,2100,2240,Maya Chen,West,2026-07-03

          Meals,450,390,Priya Nair,Central,2026-07-04

          '
    linux:
      steps:
      - type: run_bash
        timeout: 90
        script: "set -e\npkill -f soffice.bin || true\nrm -f /home/user/Desktop/budget_transfer.csv\nmkdir -p /home/user/Documents\
          \ /home/user/Desktop\nUSERPROFILE=/home/user python3 -W ignore - <<'OSOMNI_PY'\nimport os\nimport subprocess\nimport\
          \ sys\n\ntry:\n    from openpyxl import Workbook\nexcept ImportError:\n    subprocess.check_call([sys.executable,\
          \ \"-m\", \"pip\", \"install\", \"openpyxl\", \"-q\"])\n    from openpyxl import Workbook\n\npath = os.path.join(os.environ[\"\
          USERPROFILE\"], \"Documents\", \"budget_review.xlsx\")\nos.makedirs(os.path.dirname(path), exist_ok=True)\nwb =\
          \ Workbook()\nwb.active.title = \"Budget\"\nwb.save(path)\nprint(\"INIT_OK\", path)\nOSOMNI_PY"
      - type: run_bash
        timeout: 30
        script: 'export DISPLAY=${DISPLAY:-:0}

          setsid -f libreoffice --calc /home/user/Documents/budget_review.xlsx >/dev/null 2>&1 </dev/null'
      - type: wait
        ms: 8000
