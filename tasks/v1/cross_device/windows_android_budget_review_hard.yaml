# Generated from tasks/v1/cross_vm/windows_to_linux_budget_review_hard.yaml; see metadata.converted_from.
task_id: cross_device.windows_android.budget_review_hard
platform: windows
instruction: 'An Android phone is shown in the "Android phone" window on this Windows desktop. Use the phone only through
  that window; in it, a right-click works as the phone''s Back button and a middle-click as Home. If the window is closed,
  the "Android phone" shortcut on the Desktop opens it again. Do not use a terminal or adb. First, on the phone: The reference
  CSV "budget_source.csv" and the incomplete transfer CSV "budget_transfer.csv" are in Markor on the phone, and the transfer
  CSV is already open. Using Markor only, replace the transfer CSV so it exactly matches the reference CSV: the header Category,
  Planned, Actual and all eight rows in the same order. Save it. Then put the finished "budget_transfer.csv" on this computer
  as C:\Users\User\Desktop\budget_transfer.csv with exactly the same content (for example, copy its text on the phone and
  paste it into Notepad here). Next, on this computer: A blank LibreOffice Calc workbook named budget_review.xlsx is already
  open, and the note finance_review_note.txt is on the Desktop. Use the CSV on the Desktop to complete the workbook like a
  finance review sheet: put the CSV headers and rows into columns A:C, add column D "Variance" with Actual minus Planned formulas,
  column E "Status" with IF formulas that show "Over" when Variance is positive and "Under" otherwise, column F "Owner" with
  IF formulas that assign "Finance Director" when ABS(Variance) is at least 100 and "Team Lead" otherwise, column G "Action"
  with IF formulas that show "Schedule Friday review" for Finance Director rows and "Track in team sync" otherwise, and column
  H "Review Note" with formulas that combine the category, status, and absolute variance as Category: Status by amount. Add
  a final Total row with SUM formulas for Planned, Actual, and Variance, then save the workbook. Then, back on the phone:
  in Markor create the note "budget_followup.txt" in the same folder as the CSV, containing exactly these five lines with
  the values from your workbook: "Rows: <number of budget rows>", "Total planned: <total>", "Total actual: <total>", "Net
  variance: <total actual minus total planned>", and "Finance Director reviews: <number of rows assigned to the Finance Director>".
  In the Tasks app on the phone, add one task for every row assigned to the Finance Director, titled "Friday review: <Category>"
  with the due date October 23, 2026, and no other new tasks.'
init:
  initializer_id: initializers.windows.android_companion:WindowsAndroidCompanionInitializer
  params:
    android:
      initializer_id: initializers.android.cross_vm:AndroidTransferSourceInitializer
      params:
        source_path: /sdcard/Documents/markor/budget_source.csv
        transfer_path: /sdcard/Documents/markor/budget_transfer.csv
        open_path: /sdcard/Documents/markor/budget_transfer.csv
        source_text: 'Category,Planned,Actual

          Travel,1200,980

          Lodging,2100,2240

          Meals,450,390

          Supplies,300,340

          Contingency,600,720

          Permits,250,410

          Training,500,455

          Equipment,850,1025

          '
        transfer_text: 'Category,Planned,Actual

          Travel,1200,980

          Lodging,2100,2240

          '
    windows:
      steps:
      - type: run_powershell
        timeout: 180
        script: '$ErrorActionPreference = ''Stop''

          Get-Process soffice, soffice.bin, notepad -ErrorAction SilentlyContinue | Stop-Process -Force

          Start-Sleep 1

          New-Item -ItemType Directory -Force ''C:\Users\User\Documents'', ''C:\Users\User\Desktop'' | Out-Null

          Remove-Item -LiteralPath ''C:\Users\User\Desktop\budget_transfer.csv'' -ErrorAction SilentlyContinue

          [IO.File]::WriteAllText(''C:\Users\User\Desktop\finance_review_note.txt'', @''

          Create a compact review sheet for the finance lead.

          Escalate any category where the absolute variance is 100 or more.

          Leave formulas visible in the review columns so the sheet can be reused.


          ''@)

          $soffice = ''C:\Program Files\LibreOffice\program\soffice.exe''

          $tmp = Join-Path $env:TEMP (''osomni_'' + [guid]::NewGuid().ToString(''N''))

          New-Item -ItemType Directory $tmp | Out-Null

          [IO.File]::WriteAllText((Join-Path $tmp ''blank.csv''), "`n")

          $p = Start-Process -FilePath $soffice -ArgumentList ''--headless'', ''--convert-to'', ''xlsx'', ''--outdir'', $tmp,
          (Join-Path $tmp ''blank.csv'') -WindowStyle Hidden -PassThru

          $p.WaitForExit(120000) | Out-Null

          $blank = Join-Path $tmp ''blank.xlsx''

          for ($i = 0; $i -lt 60 -and -not (Test-Path $blank); $i++) { Start-Sleep 1 }

          Move-Item -Force $blank ''C:\Users\User\Documents\budget_review.xlsx''

          Remove-Item -Recurse -Force $tmp

          ''INIT_OK'''
      - type: run_powershell
        timeout: 30
        script: Start-Process -FilePath 'C:\Program Files\LibreOffice\program\soffice.exe' -ArgumentList '--calc', '"C:\Users\User\Documents\budget_review.xlsx"'
      - type: wait
        ms: 8000
evaluation:
  evaluator_id: evaluators.windows.android_companion:WindowsAndroidCompositeEvaluator
  params:
    android:
    - evaluator_id: evaluators.android.text_file:AndroidTextFileEvaluator
      params:
        path: /sdcard/Documents/markor/budget_transfer.csv
        expected_text: 'Category,Planned,Actual

          Travel,1200,980

          Lodging,2100,2240

          Meals,450,390

          Supplies,300,340

          Contingency,600,720

          Permits,250,410

          Training,500,455

          Equipment,850,1025

          '
    - evaluator_id: evaluators.android.text_file:AndroidTextFileEvaluator
      params:
        path: /sdcard/Documents/markor/budget_followup.txt
        expected_text: 'Rows: 8

          Total planned: 6250

          Total actual: 6560

          Net variance: 310

          Finance Director reviews: 5'
    - evaluator_id: evaluators.android.companion_records:TasksAppItemsEvaluator
      params:
        tasks:
        - title: 'Friday review: Travel'
          due: '2026-10-23'
        - title: 'Friday review: Lodging'
          due: '2026-10-23'
        - title: 'Friday review: Contingency'
          due: '2026-10-23'
        - title: 'Friday review: Permits'
          due: '2026-10-23'
        - title: 'Friday review: Equipment'
          due: '2026-10-23'
        baseline_count: 7
    phone_copies: []
    windows:
    - evaluator_id: evaluators.windows.powershell_check:PowerShellCheckEvaluator
      params:
        command: '$expected = @''

          Category,Planned,Actual

          Travel,1200,980

          Lodging,2100,2240

          Meals,450,390

          Supplies,300,340

          Contingency,600,720

          Permits,250,410

          Training,500,455

          Equipment,850,1025

          ''@

          $path = ''C:\Users\User\Desktop\budget_transfer.csv''

          if (-not (Test-Path -LiteralPath $path)) { ''DESKTOP_FILE_MISSING''; exit 1 }

          $norm = { param($s) (($s -replace "`r`n", "`n") -replace "`r", "`n").Trim() }

          if ((& $norm ([IO.File]::ReadAllText($path))) -cne (& $norm $expected)) { ''DESKTOP_FILE_MISMATCH''; exit 1 }

          ''EVAL_RESULT:PASS'''
        timeout: 60
        stdout_contains: EVAL_RESULT:PASS
    - evaluator_id: evaluators.windows.powershell_check:PowerShellCheckEvaluator
      params:
        command: "$OutputEncoding = New-Object System.Text.UTF8Encoding $false\n@'\nimport re\nimport zipfile\nimport xml.etree.ElementTree\
          \ as ET\n\n# Grade what the brief describes: the CSV values in A:C, the five named review columns, and\n# formulas\
          \ whose results follow the stated rules. Any formula spelling is accepted; the\n# cached results LibreOffice saves\
          \ with each formula are compared (or, when a formula has no\n# cached result, its text must equal the reference\
          \ formula).\nns = {\"a\": \"http://schemas.openxmlformats.org/spreadsheetml/2006/main\"}\nREF = r\"(?<![A-Z])\\\
          $?{col}\\$?\\d+\"\n\n\ndef number(text):\n    value = float(text)\n    return int(value) if value.is_integer() else\
          \ value\n\n\nwith zipfile.ZipFile(\"C:/Users/User/Documents/budget_review.xlsx\") as zf:\n    sheet = ET.fromstring(zf.read(\"\
          xl/worksheets/sheet1.xml\"))\n    shared_strings = []\n    if \"xl/sharedStrings.xml\" in zf.namelist():\n     \
          \   sst = ET.fromstring(zf.read(\"xl/sharedStrings.xml\"))\n        for si in sst.findall(\"a:si\", ns):\n     \
          \       shared_strings.append(\"\".join(t.text or \"\" for t in si.findall(\".//a:t\", ns)))\n\ncells = {}\nshared_masters\
          \ = {}\nfor row in sheet.findall(\".//a:sheetData/a:row\", ns):\n    for cell in row.findall(\"a:c\", ns):\n   \
          \     ref = cell.attrib[\"r\"]\n        kind = cell.attrib.get(\"t\")\n        formula_node = cell.find(\"a:f\"\
          , ns)\n        formula = None\n        if formula_node is not None:\n            formula = (formula_node.text or\
          \ \"\").strip()\n            si = formula_node.attrib.get(\"si\")\n            if formula_node.attrib.get(\"t\"\
          ) == \"shared\" and si is not None:\n                if formula:\n                    shared_masters[si] = formula\n\
          \                else:\n                    formula = shared_masters.get(si, \"\")\n        value_node = cell.find(\"\
          a:v\", ns)\n        value = None\n        if kind == \"inlineStr\":\n            node = cell.find(\"a:is\", ns)\n\
          \            value = \"\".join(t.text or \"\" for t in node.findall(\".//a:t\", ns)) if node is not None else None\n\
          \        elif value_node is not None and value_node.text is not None:\n            if kind == \"s\":\n         \
          \       value = shared_strings[int(value_node.text)]\n            elif kind in (\"str\", \"e\"):\n             \
          \   value = value_node.text\n            elif kind == \"b\":\n                value = value_node.text == \"1\"\n\
          \            else:\n                try:\n                    value = number(value_node.text)\n                except\
          \ ValueError:\n                    value = value_node.text\n        cells[ref] = {\"formula\": formula, \"value\"\
          : value}\n\n\ndef cell(ref):\n    return cells.get(ref, {\"formula\": None, \"value\": None})\n\n\ndef same(observed,\
          \ expected):\n    if isinstance(expected, str):\n        return isinstance(observed, str) and \" \".join(observed.split())\
          \ == expected\n    if isinstance(observed, bool) or not isinstance(observed, (int, float)):\n        return False\n\
          \    return abs(observed - expected) < 1e-6\n\n\ndef squash(text):\n    return re.sub(r\"\\s+\", \"\", text or \"\
          \").lstrip(\"=\").upper()\n\n\ndef check_value(ref, expected):\n    got = cell(ref)\n    if got[\"formula\"] is\
          \ not None:\n        raise SystemExit(f\"EXPECTED_VALUE_NOT_FORMULA:{ref}:{got}\")\n    if not same(got[\"value\"\
          ], expected):\n        raise SystemExit(f\"VALUE_MISMATCH:{ref}:expected {expected!r}, got {got}\")\n\n\ndef check_formula(ref,\
          \ expected, reference_formula, must_contain=(), must_reference=()):\n    got = cell(ref)\n    formula = got[\"formula\"\
          ]\n    if not formula:\n        raise SystemExit(f\"FORMULA_MISSING:{ref}:{got}\")\n    upper = formula.upper()\n\
          \    code = re.sub(r'\"[^\"]*\"', '\"\"', upper)  # ignore text inside string literals\n    for word in must_contain:\n\
          \        if not re.search(r\"\\b\" + word + r\"\\s*\\(\", code):\n            raise SystemExit(f\"FORMULA_NEEDS_{word}:{ref}:={formula}\"\
          )\n    for column in must_reference:\n        if not re.search(REF.format(col=column), code):\n            raise\
          \ SystemExit(f\"FORMULA_NEEDS_COLUMN_{column}:{ref}:={formula}\")\n    if not re.search(r\"(?<![A-Z])\\$?[A-Z]{1,3}\\\
          $?\\d+\", code):\n        raise SystemExit(f\"FORMULA_HAS_NO_CELL_REFERENCE:{ref}:={formula}\")\n    if got[\"value\"\
          ] is None:\n        if squash(formula) != squash(reference_formula):\n            raise SystemExit(f\"FORMULA_HAS_NO_SAVED_RESULT:{ref}:={formula}\"\
          )\n    elif not same(got[\"value\"], expected):\n        raise SystemExit(f\"RESULT_MISMATCH:{ref}:={formula} gives\
          \ {got['value']!r}, expected {expected!r}\")\n\n\nrows = [\n    (\"Travel\", 1200, 980),\n    (\"Lodging\", 2100,\
          \ 2240),\n    (\"Meals\", 450, 390),\n    (\"Supplies\", 300, 340),\n    (\"Contingency\", 600, 720),\n    (\"Permits\"\
          , 250, 410),\n    (\"Training\", 500, 455),\n    (\"Equipment\", 850, 1025),\n]\nheaders = [\"Category\", \"Planned\"\
          , \"Actual\", \"Variance\", \"Status\", \"Owner\", \"Action\", \"Review Note\"]\nfor col, header in zip(\"ABCDEFGH\"\
          , headers):\n    check_value(f\"{col}1\", header)\n\nfor r, (category, planned, actual) in enumerate(rows, start=2):\n\
          \    variance = actual - planned\n    status = \"Over\" if variance > 0 else \"Under\"\n    owner = \"Finance Director\"\
          \ if abs(variance) >= 100 else \"Team Lead\"\n    action = \"Schedule Friday review\" if owner == \"Finance Director\"\
          \ else \"Track in team sync\"\n    check_value(f\"A{r}\", category)\n    check_value(f\"B{r}\", planned)\n    check_value(f\"\
          C{r}\", actual)\n    check_formula(f\"D{r}\", variance, f\"=C{r}-B{r}\", must_reference=\"BC\")\n    check_formula(f\"\
          E{r}\", status, f'=IF(D{r}>0,\"Over\",\"Under\")', must_contain=(\"IF\",))\n    check_formula(f\"F{r}\", owner,\
          \ f'=IF(ABS(D{r})>=100,\"Finance Director\",\"Team Lead\")', must_contain=(\"IF\",))\n    check_formula(f\"G{r}\"\
          , action, f'=IF(F{r}=\"Finance Director\",\"Schedule Friday review\",\"Track in team sync\")',\n               \
          \   must_contain=(\"IF\",))\n    check_formula(f\"H{r}\", f\"{category}: {status} by {abs(variance)}\", f'=A{r}&\"\
          : \"&E{r}&\" by \"&ABS(D{r})')\n\nlast = len(rows) + 1\ntotal = len(rows) + 2\ncheck_value(f\"A{total}\", \"Total\"\
          )\nfor col, expected in zip(\"BCD\", (sum(p for _, p, _ in rows), sum(a for _, _, a in rows), sum(a - p for _, p,\
          \ a in rows))):\n    check_formula(f\"{col}{total}\", expected, f\"=SUM({col}2:{col}{last})\", must_contain=(\"\
          SUM\",))\nprint(\"PASS\")\n'@ | py -3 -W ignore -"
        timeout: 180
        stdout_contains: PASS
