    - evaluator_id: evaluators.windows.powershell_check:PowerShellCheckEvaluator
      params:
        command: "$OutputEncoding = New-Object System.Text.UTF8Encoding $false\n@'\nimport re\nimport zipfile\nimport xml.etree.ElementTree\
          \ as ET\n\nNS = {\n    \"a\": \"http://schemas.openxmlformats.org/spreadsheetml/2006/main\",\n    \"r\": \"http://schemas.openxmlformats.org/officeDocument/2006/relationships\"\
