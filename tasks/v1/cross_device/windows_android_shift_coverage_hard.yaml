          \    rows = {}\n            for row in root.findall(\".//a:sheetData/a:row\", NS):\n                cells = [None]\
          \ * width\n                for cell in row.findall(\"a:c\", NS):\n                    idx = col_to_idx(cell.attrib[\"\
          r\"]) - 1\n                    if not 0 <= idx < width:\n                        continue\n                    formula\
          \ = cell.find(\"a:f\", NS)\n                    if formula is not None and (formula.text or \"\").strip():\n   \
          \                     cells[idx] = \"=\" + formula.text\n                        continue\n                    kind\
          \ = cell.attrib.get(\"t\")\n                    if kind == \"inlineStr\":\n                        node = cell.find(\"\
          a:is\", NS)\n                        cells[idx] = \"\".join(t.text or \"\" for t in node.findall(\".//a:t\", NS))\n\
          \                        continue\n                    value = cell.find(\"a:v\", NS)\n                    if value\
