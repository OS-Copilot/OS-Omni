# Generated from tasks/v1/cross_vm/windows_to_linux_shift_coverage_hard.yaml; see metadata.converted_from.
task_id: cross_device.windows_android.shift_coverage_hard
platform: windows
instruction: 'An Android phone is shown in the "Android phone" window on this Windows desktop. Use the phone only through
  that window; in it, a right-click works as the phone''s Back button and a middle-click as Home. If the window is closed,
  the "Android phone" shortcut on the Desktop opens it again. Do not use a terminal or adb. First, on the phone: The shift
  roster "roster_source.csv" is open in Markor on the phone; its last six lines are correction notes. The same folder has
  "roster_transfer.csv", which so far holds only the header Name,Day,Shift,Hours. Using Markor only, complete it with the
  corrected roster: apply every correction to the data rows (changing, removing, or appending rows exactly as instructed),
  leave out the correction lines, and keep all remaining rows in their original order. Save it. Then put the finished "roster_transfer.csv"
  on this computer as C:\Users\User\Desktop\roster_transfer.csv with exactly the same content (for example, copy its text
  on the phone and paste it into Notepad here). Next, on this computer: A blank LibreOffice Calc workbook named shift_coverage.xlsx
  is already open. Sheet 1 must be named "Roster" with the CSV header and all roster rows in A1:D25 and Hours as numbers.
  Sheet 2 must be named "Coverage" with the header Day, AM Staff, PM Staff, Hours, Min AM, Min PM, Gap, Status in A1:H1 and
  the days Mon, Tue, Wed, Thu, Fri, Sat, Sun in A2:A8. B uses =COUNTIFS($Roster.$B$2:$B$25;A2;$Roster.$C$2:$C$25;"AM"), C
  uses the same formula with "PM", D uses =SUMIF($Roster.$B$2:$B$25;A2;$Roster.$D$2:$D$25), G uses =MAX(0;E2-B2)+MAX(0;F2-C2),
  and H uses =IF(G2>0;"Short";"OK"), all filled down to row 8. E and F hold the minimum AM/PM staff: Mon 2/2, Tue 2/1, Wed
  2/2, Thu 2/2, Fri 2/2, Sat 2/1, Sun 1/2. Row 9 has "Total" in A9 and =SUM(B2:B8), =SUM(C2:C8), =SUM(D2:D8), and =SUM(G2:G8)
  in B9, C9, D9, and G9, with E9, F9, and H9 empty. Sheet 3 must be named "Summary" with the header Metric, Value in A1:B1
  and the rows "Short days" with =COUNTIF($Coverage.$H$2:$H$8;"Short"), "Total hours" with =$Coverage.D9, "Total gap" with
  =$Coverage.G9, and "Staff on roster" with =COUNTA($Roster.$A$2:$A$25). Leave everything else empty and save the workbook
  in xlsx format. Finally, export the Coverage sheet as a comma-separated CSV file named coverage.csv in the same Documents
  folder. Then, back on the phone: in Markor create the note "coverage_gaps.txt" in the same folder as the CSV, containing
  one line "<Day>: gap <Gap>" for every Short day in the Coverage sheet, in Coverage order (for example "Mon: gap 1"), followed
  by the line "Total gap: <total gap>". In the Calendar app on the phone, add a 30-minute event at 08:00 for every Short day,
  on that weekday in the week starting Monday, October 19, 2026, titled "Fill <Day> coverage gap", and no other new events.'
init:
  initializer_id: initializers.windows.android_companion:WindowsAndroidCompanionInitializer
  params:
    android:
      initializer_id: initializers.android.cross_vm:AndroidTransferSourceInitializer
      params:
        source_path: /sdcard/Documents/markor/roster_source.csv
        transfer_path: /sdcard/Documents/markor/roster_transfer.csv
        open_path: /sdcard/Documents/markor/roster_source.csv
        source_text: 'Name,Day,Shift,Hours

          Avery Brooks,Mon,AM,8

          Dana Ortiz,Tue,PM,6

          Kenji Sato,Mon,PM,4

          Lena Fischer,Wed,AM,8

          Omar Haddad,Thu,AM,6

          Rosa Lima,Fri,PM,8

          Sam Patel,Wed,PM,4

          Tariq Noor,Fri,AM,6

          Mei Wong,Tue,AM,8

          Jonas Berg,Thu,PM,4

          Ines Duarte,Mon,AM,6

          Paul Okafor,Wed,AM,6

          Priya Nair,Sat,AM,8

          Theo Martin,Sat,PM,6

          Maya Chen,Sun,AM,6

          Jordan Lee,Thu,AM,8

          Hugo Silva,Fri,PM,4

          Nora Quinn,Sun,PM,4

          Eli Novak,Tue,PM,6

          Zara Ahmed,Wed,PM,8

          Liam Doyle,Mon,PM,6

          Ava Rossi,Sat,AM,4

          Owen Price,Fri,AM,8

          # Correction: Dana Ortiz moves from Tue PM to Thu PM.

          # Correction: Sam Patel works 6 hours, not 4.

          # Correction: remove Jonas Berg, he has left the team.

          # Correction: add Hana Kim,Fri,AM,4 as the last row.

          # Correction: Nora Quinn switches to the Sun AM shift.

          # Correction: add Leo Brandt,Sun,PM,8 as the last row, after Hana Kim.

          '
        transfer_text: 'Name,Day,Shift,Hours

          '
    windows:
      steps:
      - type: run_powershell
        timeout: 180
        script: '$ErrorActionPreference = ''Stop''

          Get-Process soffice, soffice.bin, notepad -ErrorAction SilentlyContinue | Stop-Process -Force

          Start-Sleep 1

          New-Item -ItemType Directory -Force ''C:\Users\User\Documents'', ''C:\Users\User\Desktop'' | Out-Null

          Remove-Item -LiteralPath ''C:\Users\User\Desktop\roster_transfer.csv'' -ErrorAction SilentlyContinue

          $soffice = ''C:\Program Files\LibreOffice\program\soffice.exe''

          $tmp = Join-Path $env:TEMP (''osomni_'' + [guid]::NewGuid().ToString(''N''))

          New-Item -ItemType Directory $tmp | Out-Null

          [IO.File]::WriteAllText((Join-Path $tmp ''blank.csv''), "`n")

          $p = Start-Process -FilePath $soffice -ArgumentList ''--headless'', ''--convert-to'', ''xlsx'', ''--outdir'', $tmp,
          (Join-Path $tmp ''blank.csv'') -WindowStyle Hidden -PassThru

          $p.WaitForExit(120000) | Out-Null

          $blank = Join-Path $tmp ''blank.xlsx''

          for ($i = 0; $i -lt 60 -and -not (Test-Path $blank); $i++) { Start-Sleep 1 }

          Move-Item -Force $blank ''C:\Users\User\Documents\shift_coverage.xlsx''

          Remove-Item -Recurse -Force $tmp

          ''INIT_OK'''
      - type: run_powershell
        timeout: 30
        script: Start-Process -FilePath 'C:\Program Files\LibreOffice\program\soffice.exe' -ArgumentList '--calc', '"C:\Users\User\Documents\shift_coverage.xlsx"'
      - type: wait
        ms: 8000
