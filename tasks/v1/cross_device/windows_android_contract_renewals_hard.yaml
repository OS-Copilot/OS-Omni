task_id: cross_device.windows_android.contract_renewals_hard
platform: windows
instruction: 'An Android phone is shown in the "Android phone" window on this Windows desktop. Use the phone only through
  that window; in it, a right-click works as the phone''s Back button and a middle-click as Home. If the window is closed,
  the "Android phone" shortcut on the Desktop opens it again. Do not use a terminal or adb. First, on the phone: The contract
  register "contracts_source.csv" is open in Markor on the phone, and the same folder has the transfer file "renewals_transfer.csv",
  which so far holds only the header. Using Markor only, complete "renewals_transfer.csv" so that it keeps the header and
  all five columns but contains only the contracts whose EndDate falls in Q4 2026 (2026-10-01 through 2026-12-31 inclusive),
  sorted by EndDate from earliest to latest and by Contract when dates are equal, with values written exactly as in the register.
  Save it. Then put the finished "renewals_transfer.csv" on this computer as C:\Users\User\Desktop\renewals_transfer.csv with
  exactly the same content (for example, copy its text on the phone and paste it into Notepad here). Next, on this computer:
  A blank LibreOffice Writer document named renewal_brief.docx is already open. Write the brief in this exact order: "Q4 2026
  Contract Renewals" in Heading 1; a six-column table with the header row Contract, Vendor, Owner, End date, Notice by, Annual
  value and every CSV row in order, where Notice by is the date 60 days before the end date in YYYY-MM-DD form; "By owner"
  in Heading 2 followed by a three-column table with the header row Owner, Contracts, Total and one row per owner ordered
  from the largest total to the smallest; "By month" in Heading 2 followed by the paragraphs "October 2026: <n> contracts,
  <total>", "November 2026: <n> contracts, <total>", and "December 2026: <n> contracts, <total>" by end date; and "Totals"
  in Heading 2 followed by the paragraphs "Total annual value up for renewal: <sum>" and "First notice deadline: <earliest
  notice date> (<contract> <vendor>)". Write numbers as plain digits without separators. All non-heading paragraphs use body
  text styles and the document must contain nothing else. Save the document in Word format. Then, back on the phone: in the
  Calendar app on the phone, add a 30-minute event at 09:00 on the Notice by date of every contract in the brief with an annual
  value of at least 30000, titled "Renewal notice: <Contract> <Vendor>" (for example "Renewal notice: C-101 Atlas Freight"),
  and no other new events.'
init:
  initializer_id: initializers.windows.android_companion:WindowsAndroidCompanionInitializer
  params:
    android:
      initializer_id: initializers.android.cross_vm:AndroidTransferSourceInitializer
      params:
        source_path: /sdcard/Documents/markor/contracts_source.csv
        transfer_path: /sdcard/Documents/markor/renewals_transfer.csv
        open_path: /sdcard/Documents/markor/contracts_source.csv
        source_text: 'Contract,Vendor,Owner,EndDate,AnnualValue

          C-101,Atlas Freight,Maya Chen,2026-11-30,48000

          C-102,Brightline Print,Jordan Lee,2027-02-15,12500

