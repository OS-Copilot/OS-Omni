          C-107,Granite Security,Priya Nair,2026-12-31,37200

          C-108,Harbor Supply,Theo Martin,2026-09-30,8800

          C-109,Ironclad Legal,Maya Chen,2026-11-15,30500

          C-110,Juniper Travel,Lena Fischer,2027-03-31,19900

          C-111,Keystone Couriers,Lena Fischer,2026-10-01,11200

          C-112,Lumen Lighting,Theo Martin,2026-12-01,7300

          C-113,Meridian Payroll,Omar Haddad,2027-01-01,54000

          C-114,Northwind Water,Omar Haddad,2026-11-01,4800

          C-115,Orchid Florals,Jordan Lee,2026-12-20,3600

          C-116,Pinnacle Elevators,Priya Nair,2026-08-31,26500

          C-117,Quarry Analytics,Lena Fischer,2026-11-20,41000

          C-118,Redwood Insurance,Maya Chen,2027-02-28,72000

          C-119,Summit Telecom,Omar Haddad,2026-10-20,18900

          C-120,Tidewater Waste,Theo Martin,2026-12-31,9900

          C-121,Umber Printing,Jordan Lee,2026-09-15,6400

          C-122,Vista Parking,Lena Fischer,2026-10-31,5200

          C-123,Willow Wellness,Priya Nair,2027-01-15,14800

          C-124,Xenon Labs,Omar Haddad,2026-12-10,33300

          '
        transfer_text: 'Contract,Vendor,Owner,EndDate,AnnualValue

          '
    windows:
      steps:
      - type: run_powershell
        timeout: 180
        script: '$ErrorActionPreference = ''Stop''

          Get-Process soffice, soffice.bin, notepad -ErrorAction SilentlyContinue | Stop-Process -Force

          Start-Sleep 1

          New-Item -ItemType Directory -Force ''C:\Users\User\Documents'', ''C:\Users\User\Desktop'' | Out-Null

          Remove-Item -LiteralPath ''C:\Users\User\Desktop\renewals_transfer.csv'' -ErrorAction SilentlyContinue

          $soffice = ''C:\Program Files\LibreOffice\program\soffice.exe''

          $tmp = Join-Path $env:TEMP (''osomni_'' + [guid]::NewGuid().ToString(''N''))

          New-Item -ItemType Directory $tmp | Out-Null

          [IO.File]::WriteAllText((Join-Path $tmp ''empty.txt''), "")

          $p = Start-Process -FilePath $soffice -ArgumentList ''--headless'', ''--convert-to'', ''docx'', ''--outdir'', $tmp,
          (Join-Path $tmp ''empty.txt'') -WindowStyle Hidden -PassThru

          $p.WaitForExit(120000) | Out-Null

          $blank = Join-Path $tmp ''empty.docx''

          for ($i = 0; $i -lt 60 -and -not (Test-Path $blank); $i++) { Start-Sleep 1 }

          Move-Item -Force $blank ''C:\Users\User\Documents\renewal_brief.docx''

          Remove-Item -Recurse -Force $tmp

          ''INIT_OK'''
      - type: run_powershell
        timeout: 30
        script: Start-Process -FilePath 'C:\Program Files\LibreOffice\program\soffice.exe' -ArgumentList '--writer', '"C:\Users\User\Documents\renewal_brief.docx"'
      - type: wait
        ms: 8000
