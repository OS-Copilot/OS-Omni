# Generated from tasks/v1/cross_vm/windows_to_linux_payables_ledger_hard.yaml; see metadata.converted_from.
task_id: cross_device.windows_android.payables_ledger_hard
platform: windows
instruction: 'An Android phone is shown in the "Android phone" window on this Windows desktop. Use the phone only through
  that window; in it, a right-click works as the phone''s Back button and a middle-click as Home. If the window is closed,
  the "Android phone" shortcut on the Desktop opens it again. Do not use a terminal or adb. First, on the phone: The invoice
  register "invoices_source.csv" is open in Markor on the phone, and the same folder has "invoices_transfer.csv", which so
  far holds only the header Vendor,Invoice,Category,Amount. Using Markor only, complete it with only the invoices whose Status
  is Pending, in their original order, without the Status column and with values written exactly as in the register. Save
  it. Then put the finished "invoices_transfer.csv" on this computer as C:\Users\User\Desktop\invoices_transfer.csv with exactly
  the same content (for example, copy its text on the phone and paste it into Notepad here). Next, on this computer: A blank
  LibreOffice Calc workbook named payables.xlsx is already open. Sheet 1 must be named "Pending": put the CSV header and all
  16 invoice rows in A1:D17 with Amount as numbers, then add E1 "Tax" with =ROUND(D2*0.08;2), F1 "Total" with =D2+E2, and
  G1 "Size" with =IF(F2>=1000;"Large";"Standard"), each filled down to the last invoice row; the next row has "Total" in A
  and SUM formulas over the invoice rows in D, E, and F. Sheet 2 must be named "ByVendor" with the header Vendor, Invoices,
  Amount Due, Large, Share in A1:E1 and one row per vendor sorted alphabetically from row 2, where B uses COUNTIF over the
  Pending vendor cells, C uses SUMIF over the Pending vendor cells summing the Pending Total cells, D uses COUNTIFS for that
  vendor and Size "Large", and E uses =ROUND(C2/<Amount Due total cell>;4); the row after the last vendor has "Total" in A
  and SUM formulas over the vendor rows in B, C, and D, with E empty. Reference the Pending ranges A2:A17, C2:C17, F2:F17,
  and G2:G17 with absolute references such as $Pending.$A$2:$A$17. Sheet 3 must be named "ByCategory" with the header Category,
  Invoices, Amount Due and one row per category sorted alphabetically, using COUNTIF and SUMIF over the Pending category cells
  in the same way. Leave everything else empty and save the workbook in xlsx format. Finally, export the ByVendor sheet as
  a comma-separated CSV file named vendor_summary.csv in the same Documents folder. Then, back on the phone: put a copy of
  the exported "vendor_summary.csv" onto the phone so it is in the phone''s Download folder (for example, drag it from File
  Explorer onto the phone window). In the Tasks app on the phone, add one task for every invoice whose Size is "Large", titled
  "Approve <Invoice> (<Vendor>)" with the due date October 16, 2026, and no other new tasks.'
init:
  initializer_id: initializers.windows.android_companion:WindowsAndroidCompanionInitializer
  params:
    android:
      initializer_id: initializers.android.cross_vm:AndroidTransferSourceInitializer
      params:
        source_path: /sdcard/Documents/markor/invoices_source.csv
        transfer_path: /sdcard/Documents/markor/invoices_transfer.csv
        open_path: /sdcard/Documents/markor/invoices_source.csv
        source_text: 'Vendor,Invoice,Category,Amount,Status

          Atlas Freight,INV-1042,Freight,1250.00,Pending

          Brightline Print,INV-1043,Print,380.50,Paid

          Atlas Freight,INV-1047,Freight,640.00,Pending

          Cobalt Cleaning,INV-1051,Facilities,915.25,Pending

          Brightline Print,INV-1055,Print,212.75,Pending

          Cobalt Cleaning,INV-1058,Facilities,430.00,Paid

          Delta Office,INV-1060,Office,1575.40,Pending

          Atlas Freight,INV-1063,Freight,298.60,Pending

          Evergreen IT,INV-1066,IT,2240.00,Disputed

          Delta Office,INV-1069,Office,84.90,Pending

          Evergreen IT,INV-1071,IT,1199.00,Pending

          Fjord Catering,INV-1074,Facilities,655.30,Pending

          Brightline Print,INV-1077,Print,1020.00,Pending

          Atlas Freight,INV-1080,Freight,455.45,Paid

          Fjord Catering,INV-1083,Facilities,318.20,Pending

          Evergreen IT,INV-1086,IT,760.00,Pending

          Cobalt Cleaning,INV-1089,Facilities,1105.75,Pending

          Delta Office,INV-1092,Office,142.10,Paid

          Granite Security,INV-1095,Facilities,1890.00,Pending

          Atlas Freight,INV-1098,Freight,930.00,Disputed

          Granite Security,INV-1101,Facilities,415.00,Pending

          Brightline Print,INV-1104,Print,96.40,Pending

          '
        transfer_text: 'Vendor,Invoice,Category,Amount

          '
    windows:
      steps:
      - type: run_powershell
        timeout: 180
        script: '$ErrorActionPreference = ''Stop''

          Get-Process soffice, soffice.bin, notepad -ErrorAction SilentlyContinue | Stop-Process -Force

          Start-Sleep 1

          New-Item -ItemType Directory -Force ''C:\Users\User\Documents'', ''C:\Users\User\Desktop'' | Out-Null

          Remove-Item -LiteralPath ''C:\Users\User\Desktop\invoices_transfer.csv'' -ErrorAction SilentlyContinue

          $soffice = ''C:\Program Files\LibreOffice\program\soffice.exe''

          $tmp = Join-Path $env:TEMP (''osomni_'' + [guid]::NewGuid().ToString(''N''))

          New-Item -ItemType Directory $tmp | Out-Null

          [IO.File]::WriteAllText((Join-Path $tmp ''blank.csv''), "`n")

          $p = Start-Process -FilePath $soffice -ArgumentList ''--headless'', ''--convert-to'', ''xlsx'', ''--outdir'', $tmp,
          (Join-Path $tmp ''blank.csv'') -WindowStyle Hidden -PassThru

          $p.WaitForExit(120000) | Out-Null

          $blank = Join-Path $tmp ''blank.xlsx''

          for ($i = 0; $i -lt 60 -and -not (Test-Path $blank); $i++) { Start-Sleep 1 }

          Move-Item -Force $blank ''C:\Users\User\Documents\payables.xlsx''

          Remove-Item -Recurse -Force $tmp

          ''INIT_OK'''
      - type: run_powershell
        timeout: 30
        script: Start-Process -FilePath 'C:\Program Files\LibreOffice\program\soffice.exe' -ArgumentList '--calc', '"C:\Users\User\Documents\payables.xlsx"'
      - type: wait
        ms: 8000
