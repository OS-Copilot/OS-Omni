# Generated from tasks/v1/cross_vm/android_to_windows_reorder_plan_hard.yaml; see metadata.converted_from.
task_id: cross_device.linux_android.reorder_plan_hard
platform: linux
instruction: 'An Android phone is shown in the "Android phone" window on this Linux desktop. Use the phone only through that
  window, without a terminal or adb. First, on the phone: The incomplete transfer CSV "reorder_transfer.csv" is open in Markor
  on the phone, and the stock count note "stock_count_source.txt" is in the same Markor folder. Using Markor only, make the
  transfer CSV contain the header Item,OnHand,ReorderPoint,Supplier,UnitCost followed by one row for each of the sixteen items
  in the note, in the same order, using plain numbers for OnHand, ReorderPoint, and UnitCost. Apply all five corrections at
  the end of the note, fix any existing row that disagrees with the corrected data, and do not include any other lines. Save
  the file and leave it ready to bring to this computer. Then put the finished "reorder_transfer.csv" on this computer as
  ~/Desktop/reorder_transfer.csv with exactly the same content (for example, copy its text on the phone and paste it into
  a text editor here). Last, on this computer: A blank LibreOffice Calc workbook named "reorder_plan.xlsx" is open. Use only
  LibreOffice Calc. Sheet 1 must be named "Reorder": put the CSV header and sixteen item rows in A1:E17 with numbers kept
  numeric, then add F1 "Shortfall" with =MAX(0;C2-B2), G1 "OrderQty" with =ROUNDUP(F2/10;0)*10, H1 "LineCost" with =G2*E2,
  and I1 "Priority" with =IF(B2=0;"Critical";IF(F2>0;"Reorder";"OK")), each filled down to row 17; in row 18 put "Total" in
  A18, =SUM(G2:G17) in G18, and =SUM(H2:H17) in H18. Sheet 2 must be named "BySupplier" with the header Supplier, Lines, Units,
  Cost, Critical in A1:E1 and one row per supplier sorted alphabetically from row 2, where B uses =COUNTIFS($Reorder.$D$2:$D$17;A2;$Reorder.$G$2:$G$17;">0"),
  C uses =SUMIF($Reorder.$D$2:$D$17;A2;$Reorder.$G$2:$G$17), D uses =SUMIF($Reorder.$D$2:$D$17;A2;$Reorder.$H$2:$H$17), and
  E uses =COUNTIFS($Reorder.$D$2:$D$17;A2;$Reorder.$I$2:$I$17;"Critical"), filled down; the row after the last supplier has
  "Total" in A and SUM formulas over the supplier rows in B through E. Sheet 3 must be named "Summary" with the header Metric,
  Value in A1:B1 and these rows: "Items to reorder" with =COUNTIF($Reorder.$G$2:$G$17;">0"); "Critical items" with =COUNTIF($Reorder.$I$2:$I$17;"Critical");
  "Total order cost" with =$Reorder.H18; "Largest supplier" with =INDEX($BySupplier.A2:A5;MATCH(MAX($BySupplier.D2:D5);$BySupplier.D2:D5;0));
  and "Largest supplier cost" with =MAX($BySupplier.D2:D5). Leave everything else empty and save the workbook in xlsx format.
  Finally, export the BySupplier sheet as a comma-separated CSV file named "supplier_po.csv" in the same Documents folder.'
init:
  initializer_id: initializers.linux.android_companion:LinuxAndroidCompanionInitializer
  params:
    android:
      initializer_id: initializers.android.cross_vm:AndroidTransferSourceInitializer
      params:
        source_path: /sdcard/Documents/markor/stock_count_source.txt
        transfer_path: /sdcard/Documents/markor/reorder_transfer.csv
        open_path: /sdcard/Documents/markor/reorder_transfer.csv
        source_text: 'Aisle 4 stock count - Friday close (Item | on hand | reorder point | supplier | unit cost)

          Packing tape | on hand 18 | reorder point 40 | Harbor Supply | unit cost 3

          Shipping labels | on hand 260 | reorder point 200 | LabelWorks | unit cost 1

          Bubble wrap rolls | on hand 6 | reorder point 12 | Harbor Supply | unit cost 14

          Corrugated boxes M | on hand 95 | reorder point 150 | BoxCo | unit cost 2

          Corrugated boxes L | on hand 140 | reorder point 120 | BoxCo | unit cost 3

          Stretch film | on hand 9 | reorder point 10 | WrapRight | unit cost 22

          Void fill paper | on hand 30 | reorder point 75 | WrapRight | unit cost 5

          Thermal ribbons | on hand 12 | reorder point 10 | LabelWorks | unit cost 9

          Pallet wrap tool | on hand 2 | reorder point 4 | Harbor Supply | unit cost 35

          Edge protectors | on hand 48 | reorder point 100 | BoxCo | unit cost 1

          Fragile stickers | on hand 300 | reorder point 250 | LabelWorks | unit cost 1

          Mailer bags | on hand 75 | reorder point 200 | WrapRight | unit cost 2

          Box cutters | on hand 4 | reorder point 12 | Harbor Supply | unit cost 6

          Corrugated boxes S | on hand 210 | reorder point 180 | BoxCo | unit cost 1

          Label printer rolls | on hand 3 | reorder point 8 | LabelWorks | unit cost 12

          Strapping kits | on hand 5 | reorder point 6 | Harbor Supply | unit cost 28

          Correction from shift lead: the recount found 22 packing tape, not 18.

          Correction from shift lead: shipping labels on hand is 160, not 260.

          Correction from purchasing: Stretch film is now supplied by Harbor Supply.

          Correction from shift lead: box cutters are out of stock, on hand is 0.

          Correction from shift lead: label printer rolls on hand is 0 after the audit.

          '
        transfer_text: 'Item,OnHand,ReorderPoint,Supplier,UnitCost

          Packing tape,18,40,Harbor Supply,3

          Shipping labels,260,200,LabelWorks,1

          Bubble wrap rolls,6,12,Harbor Supply,14

          '
    linux:
      steps:
      - type: run_bash
        timeout: 90
        script: "set -e\npkill -f soffice.bin || true\nrm -f /home/user/Desktop/reorder_transfer.csv\nmkdir -p /home/user/Documents\
          \ /home/user/Desktop\nUSERPROFILE=/home/user python3 -W ignore - <<'OSOMNI_PY'\nimport os, subprocess, sys\ndef\
          \ _need(mod, pkg):\n    try:\n        return __import__(mod)\n    except ImportError:\n        subprocess.check_call([sys.executable,\
          \ '-m', 'pip', 'install', pkg, '-q'])\n        return __import__(mod)\nopenpyxl = _need('openpyxl', 'openpyxl')\n\
          path = os.path.join(os.environ['USERPROFILE'], 'Documents', 'reorder_plan.xlsx')\nos.makedirs(os.path.dirname(path),\
          \ exist_ok=True)\nopenpyxl.Workbook().save(path)\nprint('INIT_OK', path)\nOSOMNI_PY"
      - type: run_bash
        timeout: 30
        script: 'export DISPLAY=${DISPLAY:-:0}

          setsid -f libreoffice --calc /home/user/Documents/reorder_plan.xlsx >/dev/null 2>&1 </dev/null'
      - type: wait
        ms: 8000
