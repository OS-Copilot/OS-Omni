task_id: cross_device.windows_android.incident_postmortem_hard
platform: windows
instruction: 'An Android phone is shown in the "Android phone" window on this Windows desktop. Use the phone only through
  that window; in it, a right-click works as the phone''s Back button and a middle-click as Home. If the window is closed,
  the "Android phone" shortcut on the Desktop opens it again. Do not use a terminal or adb. First, on the phone: The raw incident
  log "incident_source.txt" is open in Markor on the phone. Each timeline entry is written as Time | Service | Event, some
  entries are exact duplicates, and the last three lines are follow-ups written as Follow-up | Owner | Task. The same folder
  has "incident_transfer.csv", which so far holds only the header Time,Service,Event. Using Markor only, complete it with
  each distinct timeline entry exactly once sorted from earliest to latest time, then the three follow-ups in their original
  order as Follow-up,<owner>,<task>. Use no spaces around commas and include no title line or other lines. Save it. Then put
  the finished "incident_transfer.csv" on this computer as C:\Users\User\Desktop\incident_transfer.csv with exactly the same
  content (for example, copy its text on the phone and paste it into Notepad here). Next, on this computer: A blank LibreOffice
  Writer document named incident_postmortem.docx is already open. Write the postmortem in this exact order: "INC-4821 Postmortem"
  in Heading 1; "Summary" in Heading 2 followed by the paragraphs "Start: <first entry time>", "End: <last entry time>", "Duration:
  <minutes from start to end> minutes", and "Peak error rate: 7.4%"; "Timeline" in Heading 2 followed by a three-column table
  with the header row Time, Service, Event and every timeline entry in order; "Events by service" in Heading 2 followed by
  a four-column table with the header row Service, Events, First, Last and one row per service in alphabetical order giving
  its number of entries and its first and last entry times; "Follow-ups" in Heading 2 followed by a two-column table with
  the header row Owner, Task and the three follow-ups in order; and "Status" in Heading 2 followed by the paragraph "Resolved".
  All non-heading paragraphs use body text styles and the document must contain nothing else. Save the document in Word format.
  Then, back on the phone: put a copy of the saved "incident_postmortem.docx" onto the phone so it is in the phone''s Download
  folder (for example, drag it from File Explorer onto the phone window). In the Tasks app on the phone, add one task for
  each follow-up, titled "<Task> (<Owner>)" with the due date October 22, 2026, and no other new tasks.'
init:
  initializer_id: initializers.windows.android_companion:WindowsAndroidCompanionInitializer
  params:
    android:
      initializer_id: initializers.android.cross_vm:AndroidTransferSourceInitializer
      params:
        source_path: /sdcard/Documents/markor/incident_source.txt
        transfer_path: /sdcard/Documents/markor/incident_transfer.csv
        open_path: /sdcard/Documents/markor/incident_source.txt
        source_text: 'INC-4821 checkout latency - raw log export (Time | Service | Event)

          14:32 | cart-service | Rollback of cart-service 2.18 started

          14:05 | monitoring | Alert fired for checkout p95 above 2s

          15:02 | monitoring | Alert resolved

          14:51 | checkout-api | Latency back to baseline

          14:05 | monitoring | Alert fired for checkout p95 above 2s

          14:12 | monitoring | On-call engineer acknowledged

          14:20 | checkout-api | Error rate peaked at 7.4%

          14:38 | cart-service | Rollback completed on all pods

          14:26 | cart-service | Bad config in cart-service 2.18 identified

          14:12 | monitoring | On-call engineer acknowledged

          14:44 | checkout-api | Cache warm-up finished

          14:09 | payments-gw | Timeouts to cart-service above 5%

          14:15 | checkout-api | Retry storm detected on cart calls

          14:17 | payments-gw | Circuit breaker opened for cart-service

          14:12 | monitoring | On-call engineer acknowledged

          14:23 | monitoring | Incident channel opened

          14:29 | cart-service | Config diff posted for review

          14:09 | payments-gw | Timeouts to cart-service above 5%

          14:41 | payments-gw | Circuit breaker closed

          14:47 | checkout-api | Error rate below 0.5%

          14:55 | payments-gw | Timeout rate back to baseline

          14:58 | monitoring | Status page set to monitoring

          14:29 | cart-service | Config diff posted for review

          Follow-up | Rosa Lima | Add config schema validation to the cart-service deploy

          Follow-up | Kenji Sato | Lower the checkout retry budget

          Follow-up | Omar Haddad | Alert on circuit breaker state changes

          '
        transfer_text: 'Time,Service,Event

          '
    windows:
      steps:
      - type: run_powershell
        timeout: 180
        script: '$ErrorActionPreference = ''Stop''

          Get-Process soffice, soffice.bin, notepad -ErrorAction SilentlyContinue | Stop-Process -Force

          Start-Sleep 1

          New-Item -ItemType Directory -Force ''C:\Users\User\Documents'', ''C:\Users\User\Desktop'' | Out-Null

          Remove-Item -LiteralPath ''C:\Users\User\Desktop\incident_transfer.csv'' -ErrorAction SilentlyContinue

          $soffice = ''C:\Program Files\LibreOffice\program\soffice.exe''

          $tmp = Join-Path $env:TEMP (''osomni_'' + [guid]::NewGuid().ToString(''N''))

          New-Item -ItemType Directory $tmp | Out-Null

          [IO.File]::WriteAllText((Join-Path $tmp ''empty.txt''), "")

          $p = Start-Process -FilePath $soffice -ArgumentList ''--headless'', ''--convert-to'', ''docx'', ''--outdir'', $tmp,
          (Join-Path $tmp ''empty.txt'') -WindowStyle Hidden -PassThru

          $p.WaitForExit(120000) | Out-Null

          $blank = Join-Path $tmp ''empty.docx''

          for ($i = 0; $i -lt 60 -and -not (Test-Path $blank); $i++) { Start-Sleep 1 }

          Move-Item -Force $blank ''C:\Users\User\Documents\incident_postmortem.docx''

          Remove-Item -Recurse -Force $tmp

          ''INIT_OK'''
      - type: run_powershell
        timeout: 30
        script: Start-Process -FilePath 'C:\Program Files\LibreOffice\program\soffice.exe' -ArgumentList '--writer', '"C:\Users\User\Documents\incident_postmortem.docx"'
      - type: wait
        ms: 8000
