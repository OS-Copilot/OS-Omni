instruction: 'In the OpenBank application, create three new transfer recipients, submit three new transfers,
  schedule two bill payments, and file two transaction disputes. The three transfer recipients must be
  saved with the following details: the first recipient is named "Elliot Stone" with the nickname "Office
  rent", bank "Cascade Bank", routing number "121042882", and account number "7400196831"; the second
  recipient is named "Nora Kim" with the nickname "Design vendor", bank "Harbor Federal", routing number
  "325182357", and account number "5581047296"; and the third recipient is named "Priya Shah" with the
  nickname "Catering", bank "Rainier Trust", routing number "125108272", and account number "9064317258".
  The three submitted transfers must consist of a transfer from "Rainy Day Savings ...9140" to "Elliot
  Stone" for an amount of "84.25" on the date "2026-06-02" with the memo "T1 office", a transfer from
  "Everyday Checking ...2381" to "Nora Kim" for an amount of "126.40" on the date "2026-06-03" with the
  memo "T1 design", and a transfer from "Rainy Day Savings ...9140" to "Priya Shah" for an amount of "73.65"
  on the date "2026-06-04" with the memo "T1 catering". The two scheduled bill payments must be directed
  to the biller "Northstar Internet - $72.00" from "Rainy Day Savings ...9140" for an amount of "68.50"
  on the date "2026-06-06" with the memo "T1 utilities", and to the biller "OpenBank Rewards Card - $682.45"
  from "Everyday Checking ...2381" for an amount of "340.00" on the date "2026-06-12" with the memo "T1
  internet". The two submitted disputes must target the first search result for "Ace Hardware" with the
  reason "Amount is incorrect", the "I contacted the merchant" box checked, and the details "Wrong total;
  contacted.", and the first search result for "Caffe Vita" with the reason "Duplicate charge", the "I
  contacted the merchant" box checked, and the details "Duplicate; contacted.". OpenBank must remain the
  foreground application when all tasks are complete.'
