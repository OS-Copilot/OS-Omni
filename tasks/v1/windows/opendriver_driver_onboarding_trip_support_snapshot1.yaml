task_id: windows.opendriver.driver_onboarding_trip_support_snapshot1
platform: windows
instruction: |-
  Create a new Driver account in the OpenDriver application and complete the onboarding, work, and support workflows for both the new and an approved Driver. The new account must be established with the Driver role, the name `RoadOps 27`, the email `roadops27@drv.test`, and the password `DriverPass9!`. The driver profile for this account must be saved for review with the license number `CA-DL-2701`, vehicle make `Toyota`, vehicle model `Prius`, vehicle year `2024`, license plate `ROAD27`, and vehicle color `Blue`. Three required documents must be submitted for this account: a Driver license with document ID `DL-ROAD27` and expiration date `2028-12-31`, an Insurance document with document ID `INS-ROAD27` and expiration date `2028-06-30`, and a Vehicle inspection document with document ID `INSP-ROAD27` and expiration date `2028-09-30`, ensuring all three are in a submitted state.

  The approved Driver account, accessed with the Driver role, the name `Maya Rodriguez`, the email `driver@example.com`, and the password `Password123!`, must have one sample request created and subsequently rejected so it returns to the online waiting state. In the Money area, the completed trip from Downtown Palo Alto to Meta MPK 23 must be rated with four stars and the comment `Clear pickup`. A new support ticket must be created in the Report rider category with the message `Rider conduct review`. This specific ticket must contain two driver replies in the exact order: `Check rider history` followed by `Pickup info ready`. The final visible state must be the Driver safety and support page displaying the `Rider conduct review` ticket, with the reply dialog no longer visible.
