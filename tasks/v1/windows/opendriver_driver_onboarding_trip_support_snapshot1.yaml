    source_instruction_sha256: 0629cf77a42845da8e986e112124811a17bef0973d28bb9cab947c147f8248d5
    source_instruction: |
      1. 双击桌面上的 opendriver 快捷方式图标，打开 OpenDriver 登录页。
      2. 点击角色选择区中的 Driver 角色按钮，明确选择司机身份。
      3. 点击新司机姓名字段 Name。
      4. 输入 `RoadOps 27`。
      5. 点击新司机邮箱字段 Email。
      6. 输入 `roadops27@drv.test`。
      7. 点击新司机密码字段 Password。
      8. 输入 `DriverPass9!`。
      9. 点击 Create account 按钮，创建待审核司机账户并进入 Driver Workspace。
      10. 点击 Open account setup，打开新司机的 Account 页面。
      11. 点击驾照号码字段 License number。
      12. 输入 `CA-DL-2701`。
      13. 点击车辆品牌字段 Vehicle make。
      14. 输入 `Toyota`。
      15. 点击车辆型号字段 Vehicle model。
      16. 输入 `Prius`。
      17. 点击车辆年份字段 Vehicle year。
      18. 输入 year value `2024`。
      19. 点击车牌字段 License plate。
      20. 输入 `ROAD27`。
      21. 点击车辆颜色字段 Vehicle color。
      22. 输入 `Blue`。
      23. 点击 Save profile for review 按钮，保存司机及车辆资料供审核。
      24. 在 Account 页面内向下滑动，显示 Driver documents 区域。
      25. 点击驾照文档类型按钮 Document type。
      26. 点击 Driver license 选项，明确选择驾照文档类型。
      27. 点击驾照文档编号字段 Document ID。
      28. 输入 `DL-ROAD27`。
      29. 点击驾照到期日期字段 Expires at。
      30. 输入 `2028-12-31`。
      31. 点击驾照提交按钮 Submit document，提交驾照文档。
      32. 点击保险文档类型按钮 Document type。
      33. 点击 Insurance 选项，明确选择保险文档类型。
      34. 点击保险文档编号字段 Document ID。
      35. 输入 `INS-ROAD27`。
      36. 点击保险到期日期字段 Expires at。
      37. 输入 `2028-06-30`。
      38. 点击保险提交按钮 Submit document，提交保险文档。
      39. 点击车辆检查类型按钮 Document type。
      40. 点击 Vehicle inspection 选项，明确选择车辆检查文档类型。
      41. 点击车辆检查编号字段 Document ID。
      42. 输入 `INSP-ROAD27`。
      43. 点击车辆检查到期日期字段 Expires at。
      44. 输入 `2028-09-30`。
      45. 点击车辆检查提交按钮 Submit document，提交文档并形成 3/3 required submitted 状态。
      46. 点击右上角退出图标，返回 OpenDriver 登录页。
      47. 点击角色选择区中的 Driver 角色按钮，明确选择已批准司机身份。
      48. 点击批准司机姓名字段 Name。
      49. 输入 `Maya Rodriguez`。
      50. 点击批准司机邮箱字段 Email。
      51. 输入 `driver@example.com`。
      52. 点击批准司机密码字段 Password。
      53. 输入 `Password123!`。
      54. 点击司机登录按钮 Login，进入已批准司机的 Driver Workspace。
      55. 点击顶部 Work 标签，打开在线接单页面。
      56. 点击 Create sample request 按钮，生成一条可处理的乘客请求。
      57. 点击新请求卡片中的 Reject，拒绝请求并返回在线候单状态。
      58. 点击顶部 Money 标签，打开司机收入与行程记录页面。
      59. 在 Downtown Palo Alto 至 Meta MPK 23 的已完成行程中点击 Rate rider，打开乘客评分对话框。
      60. 点击第四颗星评分按钮，明确选择四星评分。
      61. 点击乘客评价字段 Comment。
      62. 输入 `Clear pickup`。
      63. 点击 Submit 按钮，提交司机对乘客的评分。
      64. 点击顶部 Support 标签，打开 Driver safety and support 页面。
      65. 点击 Report rider 类别选项，明确选择举报乘客类别。
      66. 点击工单内容字段 Message。
      67. 输入 `Rider conduct review`。
      68. 点击 Create support ticket 按钮，创建举报乘客工单。
      69. 点击最上方新生成的 `Rider conduct review` 工单行最右端黑色弯箭头图标，打开工单详情。
      70. 点击司机回复字段 Reply。
      71. 输入 `Check rider history`。
      72. 点击 Send reply 按钮，发送第一条司机补充信息。
      73. 再次点击司机回复字段 Reply。
      74. 输入 `Pickup info ready`。
      75. 点击 Send reply 按钮，发送第二条司机补充信息并形成两条回复。
      76. 点击工单详情中的 Close，关闭对话框并返回 Support 页面。
