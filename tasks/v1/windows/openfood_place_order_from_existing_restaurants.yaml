task_id: windows.openfood.place_order_from_existing_restaurants
platform: windows
instruction: |-
  In OpenFood, complete the customer ordering flow using only visible Windows GUI controls. The app is already signed in as Lucas Lin in snapshot "Snapshot_2"; do not Sign Out / do not exit the OpenFood account. Use the Restaurants page, search box, restaurant cards, green View menu buttons, Add/Add to cart buttons, the Cart panel quantity controls, the Coupon dropdown, and the green Place order button. Final state must be an OpenFood order confirmation page, Orders page, or the current Cart panel after attempting Place order, with OpenFood still signed in.

  01. 点击顶部导航栏中的 Restaurants。
  02. 点击 Search 输入框。
  03. 输入 salad。
  04. 在 salad 搜索结果中找到 Station Riverwalk Deli No. 33 Aurora IL 餐厅卡片。
  05. 点击 Station Riverwalk Deli No. 33 Aurora IL 卡片中的绿色 View menu 按钮。
  06. 在菜单页点击一个可添加的 salad 菜品。
  07. 如果菜品详情页有默认规格选项，点击默认规格。
  08. 点击菜品旁边的 Add 或加号按钮。
  09. 如果出现 Add to cart 按钮，点击 Add to cart。
  10. 如果出现确认弹窗，点击确认按钮。
  11. 点击顶部导航栏中的 Restaurants。
  12. 点击 Search 输入框。
  13. 使用 Ctrl+A 选中搜索框中的 salad。
  14. 输入 salad。
  15. 在 salad 搜索结果中找到 Fox Valley Grill Union Aurora IL 餐厅卡片。
  16. 点击 Fox Valley Grill Union Aurora IL 卡片中的绿色 View menu 按钮。
  17. 在 Fox Valley Grill Union Aurora IL 的菜单页中，找到第一个带有 Add 或加号按钮的可添加菜品。
  18. 点击该菜品旁边的 Add 或加号按钮。
  19. 如果出现菜品详情页或选项弹窗，保持默认选项。
  20. 如果出现 Add to cart、Add item 或确认按钮，点击该按钮。
  21. 如果右侧 Cart 面板更新，继续下一步。
  22. 点击顶部导航栏中的 Restaurants。
  23. 点击 Search 输入框。
  24. 使用 Ctrl+A 选中搜索框中的 salad。
  25. 清空搜索框，让餐厅列表回到默认可浏览状态。
  26. 在餐厅列表中找到 Dumpling Room No. 20 San Jose CA 餐厅卡片。
  27. 点击 Dumpling Room No. 20 San Jose CA 卡片中的绿色 View menu 按钮。
  28. 在菜单页点击第一个可添加的菜品。
  29. 如果菜品详情页有默认选项，保持默认选项。
  30. 点击该菜品旁边的 Add 或加号按钮。
  31. 如果出现 Add to cart 按钮，点击 Add to cart。
  32. 如果出现确认弹窗，点击确认按钮。
  33. 点击顶部导航栏中的 Restaurants。
  34. 在餐厅列表中找到 Santana Row Banh Mi Market No. 12 San Jose CA 餐厅卡片。
  35. 点击 Santana Row Banh Mi Market No. 12 San Jose CA 卡片中的绿色 View menu 按钮。
  36. 在菜单页点击第一个可添加的越南菜或三明治类菜品。
  37. 如果菜品详情页有默认选项，保持默认选项。
  38. 点击该菜品旁边的 Add 或加号按钮。
  39. 如果出现 Add to cart 按钮，点击 Add to cart。
  40. 如果出现确认弹窗，点击确认按钮。
  41. 点击顶部导航栏中的 Restaurants。
  42. 点击 Search 输入框。
  43. 使用 Ctrl+A 选中搜索框内容。
  44. 输入 ju。
  45. 在 ju 搜索结果中找到 Harbor Space City Viet-Cajun Houston TX 餐厅卡片。
  46. 如果 Harbor Space City Viet-Cajun Houston TX 卡片上可见绿色 View menu 按钮，点击 View menu。
  47. 如果 View menu 按钮不在当前可见区域，向下滚动该卡片直到 View menu 按钮出现。
  48. 点击 Harbor Space City Viet-Cajun Houston TX 卡片中的绿色 View menu 按钮。
  49. 在菜单页点击第一个可添加的菜品。
  50. 如果菜品详情页有默认选项，保持默认选项。
  51. 点击该菜品旁边的 Add 或加号按钮。
  52. 如果出现 Add to cart 按钮，点击 Add to cart。
  53. 如果出现确认弹窗，点击确认按钮。
  54. 在右侧 Cart 面板中点击第一个商品右侧的加号按钮。
  55. 在右侧 Cart 面板中点击第一个商品右侧的减号按钮。
  56. 在右侧 Cart 面板中点击当前商品右侧的加号按钮。
  57. 在右侧 Cart 面板中点击当前商品右侧的减号按钮。
  58. 点击 Coupon 下拉框。
  59. 在 Coupon 下拉框中选择 No coupon。
  60. 点击 Cart 面板中的 Place order 按钮。
  61. 如果仍停留在 Cart 面板，点击 Coupon 下拉框。
  62. 如果 Coupon 下拉框展开，在 Coupon 下拉框中选择 No coupon。
  63. 如果仍停留在 Cart 面板，点击 Cart 面板中商品右侧的加号按钮，将数量增加到 2。
  64. 如果仍停留在 Cart 面板，点击 Cart 面板中商品右侧的减号按钮，将数量改回 1。
  65. 如果仍停留在 Cart 面板，点击 Cart 面板底部的绿色 Place order 按钮。
  66. 最终停留在下单后的确认页面、订单页面，或如果没有跳转则停留在当前 Cart 面板页面，并保持 OpenFood 已登录。
init:
  initializer_id: initializers.windows.openfood_order:OpenFoodOrderInitializer
  params:
    app_name: OpenFood
    wait_ms: 2500

evaluation:
  evaluator_id: evaluators.windows.powershell_check:PowerShellCheckEvaluator
  params:
    timeout: 45
    stdout_contains: EVAL_RESULT:PASS
    command: |+
      $ErrorActionPreference = "Stop"
      $marker = Join-Path $env:TEMP "os_omni_openfood_order_marker.txt"
      $markerIso = if (Test-Path -LiteralPath $marker) { (Get-Content -LiteralPath $marker -Raw).Trim() } else { "" }
      $manifest = Join-Path $env:TEMP "os_omni_openfood_order\current.json"
      $code = @'
      import json
      import os
      import re

      marker_iso = os.environ.get("OPENFOOD_MARKER_ISO", "").strip()
      failures = []
      checks = []
      observed = {}

      checks.append({
          "name": "marker_timestamp_optional",
          "expected": "present during full execution; optional during manual_eval",
          "actual": bool(marker_iso),
          "marker": marker_iso,
      })

      trace_manifest = os.environ.get("OPENFOOD_TRACE_MANIFEST", "").strip()
      states = []
      try:
          with open(trace_manifest, encoding="utf-8") as stream:
              manifest = json.load(stream)
          run_id = manifest["run_id"]
          if not isinstance(run_id, str) or not run_id:
              raise ValueError("missing OpenFood run identity")
          with open(manifest["trace"], encoding="utf-8") as stream:
              for sequence, line in enumerate(stream, 1):
                  row = json.loads(line)
                  if row.get("run_id") != run_id or row.get("seq") != sequence:
                      raise ValueError("stale or unordered OpenFood trace")
                  state = row.get("state")
                  if not isinstance(state, dict) or "createdOrders" not in state or "userId" not in state:
                      raise ValueError("invalid OpenFood state observation")
                  states.append(state)
      except (OSError, ValueError, KeyError, TypeError) as exc:
          states = []
          failures.append("Fresh OpenFood state trace unavailable: " + str(exc))
      checks.append({"name": "fresh_run_state_trace", "expected": True, "actual": bool(states)})
      if not states:
          failures.append("No application localStorage writes were observed for this run")

      observed["state_count"] = len(states)
      checks.append({"name": "openfood_static_state_found", "expected": True, "actual": bool(states)})
      if not states:
          failures.append("Could not find openfood-static-state-v1 JSON state in localStorage")

      state = states[-1] if states else {}
      observed["latest_state"] = {
          "view": state.get("view"),
          "userId": state.get("userId"),
          "selectedRestaurantId": state.get("selectedRestaurantId"),
          "activeCoupon": state.get("activeCoupon"),
          "cart": state.get("cart"),
          "createdOrders": state.get("createdOrders"),
      }

      import struct
      seed_path = os.environ.get("OPENFOOD_SEED_FILE", r"C:\OS-Omni\Apps\OpenFood\resources\app.asar")
      if seed_path.endswith('.json'):
          with open(seed_path, encoding='utf8') as stream:
              seed = json.load(stream)
      else:
          with open(seed_path, 'rb') as stream:
              prefix = stream.read(16)
              header = json.loads(stream.read(struct.unpack_from('<I', prefix, 12)[0]))
              entry = header['files']['shared']['files']['seed-data.json']
              stream.seek(8 + struct.unpack_from('<I', prefix, 4)[0] + int(entry['offset']))
              seed = json.loads(stream.read(entry['size']))
      menu = {item['id']: item for item in seed['menu']}
      first_available = {}
      for item in seed['menu']:
          if item.get('available', True):
              first_available.setdefault(item['restaurantId'], item['id'])

      restaurant_ids = {
          "r7": "Station Riverwalk Deli No. 33 Aurora IL",
          "r8": "Fox Valley Grill Union Aurora IL",
          "r1": "Dumpling Room No. 20 San Jose CA",
          "r2": "Santana Row Banh Mi Market No. 12 San Jose CA",
          "r18": "Harbor Space City Viet-Cajun Houston TX",
      }

      required_restaurant_sequence = ["r7", "r8", "r1", "r2", "r18"]
      selected_sequence = [
          item.get("selectedRestaurantId")
          for item in states
          if item.get("selectedRestaurantId") in restaurant_ids
      ]
      compacted_sequence = []
      for restaurant_id in selected_sequence:
          if not compacted_sequence or compacted_sequence[-1] != restaurant_id:
              compacted_sequence.append(restaurant_id)

      cursor = 0
      for restaurant_id in compacted_sequence:
          if cursor < len(required_restaurant_sequence) and restaurant_id == required_restaurant_sequence[cursor]:
              cursor += 1
      visited_required_in_order = cursor == len(required_restaurant_sequence)
      observed["selected_restaurant_sequence"] = compacted_sequence
      checks.append({
          "name": "visited_required_restaurants_in_order",
          "expected": [
              "{} / {}".format(rid, restaurant_ids[rid])
              for rid in required_restaurant_sequence
          ],
          "actual": compacted_sequence,
          "pass": visited_required_in_order,
      })
      if states and not visited_required_in_order:
          failures.append(
              "Required restaurant visit sequence was not observed in localStorage state history: {}".format(
                  " -> ".join(required_restaurant_sequence)
              )
          )

      cart_activity_by_restaurant = {}
      previous_cart = {}
      for item in states:
          restaurant_id = item.get("selectedRestaurantId")
          cart = item.get("cart") or []
          current_cart = {line.get('itemId'): line.get('qty') for line in cart if isinstance(line, dict)}
          if restaurant_id in restaurant_ids:
              added = [item_id for item_id, qty in current_cart.items()
                       if item_id in menu and menu[item_id]['restaurantId'] == restaurant_id
                       and (restaurant_id == 'r7' or item_id == first_available.get(restaurant_id))
                       and isinstance(qty, int) and not isinstance(qty, bool)
                       and qty > previous_cart.get(item_id, 0)]
              if added:
                  cart_activity_by_restaurant.setdefault(restaurant_id, {'restaurantName': restaurant_ids[restaurant_id], 'addedItems': []})['addedItems'].extend(added)
          previous_cart = current_cart

      missing_cart_activity = [
          rid for rid in required_restaurant_sequence
          if rid not in cart_activity_by_restaurant
      ]
      observed["cart_activity_by_restaurant"] = cart_activity_by_restaurant
      checks.append({
          "name": "cart_or_order_activity_for_each_required_restaurant",
          "expected": [
              "{} / {}".format(rid, restaurant_ids[rid])
              for rid in required_restaurant_sequence
          ],
          "actual": cart_activity_by_restaurant,
          "pass": not missing_cart_activity,
      })
      if states and missing_cart_activity:
          failures.append(
              "Missing add-to-cart/order evidence for required restaurants: {}".format(
                  ", ".join("{} ({})".format(rid, restaurant_ids[rid]) for rid in missing_cart_activity)
              )
          )

      user_ok = state.get("userId") == "lucas"
      checks.append({"name": "signed_in_lucas", "expected": "lucas", "actual": state.get("userId"), "pass": user_ok})
      if states and not user_ok:
          failures.append("OpenFood is not signed in as Lucas Lin (userId lucas)")

      orders = state.get("createdOrders") or []
      candidate = orders[-1] if orders else None
      checks.append({"name": "created_order_exists", "expected": "at least one locally created order", "actual": len(orders), "pass": bool(candidate) and len(orders) == 1})
      if states and len(orders) != 1:
          failures.append("Expected exactly one newly created order")

      if candidate:
          observed["candidate_order"] = candidate
          restaurant_id = candidate.get("restaurantId")
          expected_restaurant = restaurant_ids.get(restaurant_id)
          restaurant_ok = restaurant_id == "r18"
          checks.append({
              "name": "latest_order_from_final_instructed_restaurant",
              "expected": "r18 / Harbor Space City Viet-Cajun Houston TX",
              "actual": {"restaurantId": restaurant_id, "restaurantName": expected_restaurant},
              "pass": restaurant_ok,
          })
          if candidate.get("userId") != "lucas":
              failures.append("Created order does not belong to Lucas Lin")
          if not restaurant_ok:
              failures.append("Latest created order is from restaurantId {!r}, expected r18 Harbor Space City Viet-Cajun Houston TX".format(restaurant_id))

          status = str(candidate.get("status") or "")
          status_ok = status.lower() in {"preparing", "pending", "accepted", "placed"}
          checks.append({"name": "order_status_active", "expected": ["Preparing", "Pending", "Accepted", "Placed"], "actual": status, "pass": status_ok})
          if not status_ok:
              failures.append("Latest created order status is {!r}".format(status))

          items = candidate.get("items") or []
          item_count_ok = len(items) >= 1
          checks.append({"name": "order_has_items", "expected_min": 1, "actual": len(items), "pass": item_count_ok})
          if not item_count_ok:
              failures.append("Latest created order has no items")

          quantities = []
          quantities_ok = len(items) == 1
          for item in items:
              valid = isinstance(item, list) and len(item) == 2
              item_id, qty = item if valid else (None, None)
              valid = (valid and item_id == first_available.get('r18') and item_id in menu and menu[item_id]['restaurantId'] == 'r18'
                       and isinstance(qty, int) and not isinstance(qty, bool) and qty == 1)
              quantities.append(qty)
              quantities_ok = quantities_ok and valid
          checks.append({"name": "final_item_quantities_one", "expected": "all ordered item quantities equal 1", "actual": quantities, "pass": quantities_ok})
          if not quantities_ok:
              failures.append("One or more final order item quantities are not 1")

          total = candidate.get("total")
          try:
              total_ok = float(total) > 0
          except Exception:
              total_ok = False
          checks.append({"name": "positive_total", "expected": "> 0", "actual": total, "pass": total_ok})
          if not total_ok:
              failures.append("Latest created order total is not positive")

      # Both original +/- adjustments occur after the final restaurant is added.
      quantity_sequence = []
      for snapshot in states:
          cart = snapshot.get('cart') or []
          if len(cart) != 1 or not isinstance(cart[0], dict):
              continue
          line = cart[0]
          if menu.get(line.get('itemId'), {}).get('restaurantId') != 'r18':
              continue
          qty = line.get('qty')
          if not quantity_sequence or qty != quantity_sequence[-1]:
              quantity_sequence.append(qty)
      adjustment_ok = any(quantity_sequence[i:i+5] == [1, 2, 1, 2, 1]
                          for i in range(max(0, len(quantity_sequence)-4)))
      checks.append({'name': 'both_quantity_adjustments_observed', 'actual': quantity_sequence, 'pass': adjustment_ok})
      if not adjustment_ok:
          failures.append('Both original quantity increases to 2 and decreases to 1 were not observed')

      no_coupon = state.get("activeCoupon") in {None, ""}
      checks.append({"name": "no_coupon_selected", "expected": "empty activeCoupon", "actual": state.get("activeCoupon"), "pass": no_coupon})
      if states and not no_coupon:
          failures.append("OpenFood activeCoupon is {!r}, expected No coupon/empty".format(state.get("activeCoupon")))

      cart_empty = state.get("cart") == []
      checks.append({"name": "cart_cleared_after_place_order", "expected": [], "actual": state.get("cart"), "pass": cart_empty})
      if states and not cart_empty:
          failures.append("Cart was not cleared after placing the order")

      view_ok = state.get("view") in {"orders", "home", "restaurant"}
      checks.append({"name": "final_view_allowed", "expected": ["orders", "home", "restaurant"], "actual": state.get("view"), "pass": view_ok})
      if states and not view_ok:
          failures.append("Final OpenFood view {!r} is not an allowed final page".format(state.get("view")))

      payload = {
          "target": "Current-run OpenFood order placed by Lucas Lin",
          "trace_manifest": trace_manifest,
          "checks": checks,
          "observed": observed,
          "failures": failures,
      }
      print(json.dumps(payload, ensure_ascii=False, indent=2))
      print("EVAL_RESULT:PASS" if not failures else "EVAL_RESULT:FAIL")
      '@
      $env:OPENFOOD_MARKER_ISO = $markerIso
      $env:OPENFOOD_TRACE_MANIFEST = $manifest
      $tmp = Join-Path $env:TEMP "os_omni_openfood_order_eval.py"
      Set-Content -LiteralPath $tmp -Value $code -Encoding UTF8
      py -3 $tmp

