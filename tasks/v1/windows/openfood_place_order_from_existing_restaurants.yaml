      38. 点击该菜品旁边的 Add 或加号按钮。
      39. 如果出现 Add to cart 按钮，点击 Add to cart。
      40. 如果出现确认弹窗，点击确认按钮。
      41. 点击顶部导航栏中的 Restaurants。
      42. 点击 Search 输入框。
      43. 使用 Ctrl+A 选中搜索框内容。
      44. 输入 ju。
      45. 在 ju 搜索结果中找到 Harbor Space City Viet-Cajun Houston TX 餐厅卡片。
      46. 如果 Harbor Space City Viet-Cajun Houston TX 卡片上可见绿色 View menu 按钮，点击 View menu。
      47. 如果 View menu 按钮不在当前可见区域，向下滚动该卡片直到 View menu 按钮出现。
      48. 点击 Harbor Space City Viet-Cajun Houston TX 卡片中的绿色 View menu 按钮。
      49. 在菜单页点击第一个可添加的菜品。
      50. 如果菜品详情页有默认选项，保持默认选项。
      51. 点击该菜品旁边的 Add 或加号按钮。
      52. 如果出现 Add to cart 按钮，点击 Add to cart。
      53. 如果出现确认弹窗，点击确认按钮。
      54. 在右侧 Cart 面板中点击第一个商品右侧的加号按钮。
      55. 在右侧 Cart 面板中点击第一个商品右侧的减号按钮。
      56. 在右侧 Cart 面板中点击当前商品右侧的加号按钮。
      57. 在右侧 Cart 面板中点击当前商品右侧的减号按钮。
      58. 点击 Coupon 下拉框。
      59. 在 Coupon 下拉框中选择 No coupon。
      60. 点击 Cart 面板中的 Place order 按钮。
      61. 如果仍停留在 Cart 面板，点击 Coupon 下拉框。
      62. 如果 Coupon 下拉框展开，在 Coupon 下拉框中选择 No coupon。
      63. 如果仍停留在 Cart 面板，点击 Cart 面板中商品右侧的加号按钮，将数量增加到 2。
      64. 如果仍停留在 Cart 面板，点击 Cart 面板中商品右侧的减号按钮，将数量改回 1。
      65. 如果仍停留在 Cart 面板，点击 Cart 面板底部的绿色 Place order 按钮。
      66. 最终停留在下单后的确认页面、订单页面，或如果没有跳转则停留在当前 Cart 面板页面，并保持 OpenFood 已登录。
