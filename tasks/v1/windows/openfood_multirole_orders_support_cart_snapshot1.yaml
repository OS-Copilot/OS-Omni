instruction: Complete the customer, merchant, courier, admin, and support work in OpenFood, using the
  `openfood` desktop shortcut rather than `openbank`, and leave Lucas Lin's final restaurant cart ready
  for review. Lucas Lin's initial order should come from Dumpling Room No. 20 San Jose CA, found with
  the `dumpling` search, Chinese cuisine filter, and Rating sort. It must contain 3 Pork Dumplings and
  1 Beef Chow Fun with the `WELCOME12 - $12 off orders over $30` coupon, and it must be placed. Under
  Noah Park's merchant account, Mapo Tofu at that restaurant should become unavailable, Golden Curry Garden
  No. 35 San Jose CA should become closed, and the initial order should progress from Preparing through
  Out for delivery to Delivered. Under Ava Chen's courier account, delivery route D-346 for Bakery Lane
  at Night Market Houston TX should be accepted and advanced twice to completion. Lucas Lin should place
  a second order by reordering his delivered Dumpling Room order with 1 Pork Dumplings and 1 Beef Chow
  Fun and explicitly selecting No coupon. Under Admin Desk's admin account, that latest order with no
  special notes should likewise progress from Preparing through Out for delivery to Delivered. Lucas Lin's
  support tickets should include a new Open ticket with the subject `Recent order check` and message `Check
  latest total`. His final cart should come from Santana Row Banh Mi Market No. 12 San Jose CA, found
  with the `banh mi` search, Vietnamese cuisine filter, and Lowest delivery fee sort; it should contain
  2 Golden San Jose Pho Tai Rice and 2 Golden San Jose Pho Tai Soup with No coupon, and remain visible
  without placing another order.
