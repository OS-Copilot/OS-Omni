    source_instruction: |-
      1. 双击桌面左侧第三个、标签为 `openfood` 的 OpenFood 快捷方式，打开 OpenFood；不要点击右下角或任何标签为 `openbank` 的快捷方式。
      2. 点击顶部导航栏中的 Restaurants。
      3. 点击 Search 字段。
      4. 输入 `dumpling`。
      5. 点击 Cuisine 下拉框。
      6. 点击 Chinese，筛选中餐餐厅。
      7. 点击 Sort 下拉框。
      8. 点击 Rating，按评分排序筛选结果。
      9. 点击 Dumpling Room No. 20 San Jose CA 卡片中的 View menu。
      10. 点击 Pork Dumplings 菜品卡片中的 Add to cart。
      11. 点击 Beef Chow Fun 菜品卡片中的 Add to cart。
      12. 向下滑动菜单页面右侧滚动条，使购物车的数量、优惠券和结算区域完整显示。
      13. 点击购物车中猪肉水饺行右侧的加号，将数量增加到 2。
      14. 再次点击该商品行右侧的加号，将数量增加到 3。
      15. 点击购物车中的 Coupon 下拉框。
      16. 点击 `WELCOME12 - $12 off orders over $30`。
      17. 点击 Place order，提交含 3 份 Pork Dumplings 和 1 份 Beef Chow Fun 的优惠订单。
      18. 点击右上角当前账户下拉框。
      19. 点击 Noah Park - Merchant，切换为商家账户。
      20. 点击顶部导航栏中的 Merchant。
      21. 点击 Dumpling Room No. 20 San Jose CA 区域内 Mapo Tofu 右侧的 Available，将该菜品设为不可用。
      22. 点击 Golden Curry Garden No. 35 San Jose CA 区域中的 Mark closed，将该餐厅设为关闭。
      23. 向下滑动 Merchant 页面右侧滚动条，进入 Restaurant orders 区域并定位含 3 x Pork Dumplings、1 x Beef Chow Fun 和 Coupon WELCOME12 applied 的新订单。
      24. 点击该新订单中的 Advance status，将订单从 Preparing 推进到 Out for delivery。
      25. 再次点击同一订单中的 Advance status，将订单推进到 Delivered。
      26. 按住 Ctrl 键并按下 Home 键，返回 Merchant 页面顶部。
      27. 点击右上角当前账户下拉框。
      28. 点击 Ava Chen - Courier，切换为配送员账户。
      29. 点击顶部导航栏中的 Courier。
      30. 向下滑动 Courier board 页面右侧滚动条，显示 D-346 - Bakery Lane at Night Market Houston TX 配送卡片。
      31. 点击该配送卡片中的 Accept route，接取该配送路线。
      32. 点击同一卡片中的 Next step，推进一次配送状态。
      33. 再次点击同一卡片中的 Next step，继续推进配送状态。
      34. 按住 Ctrl 键并按下 Home 键，返回 Courier board 页面顶部。
      35. 点击右上角当前账户下拉框。
      36. 点击 Lucas Lin - Customer，切换回客户账户。
      37. 点击顶部导航栏中的 Orders。
      38. 点击列表顶部刚完成的 Dumpling Room No. 20 San Jose CA 订单中的 Reorder，将原订单商品复制到购物车。
      39. 点击购物车中猪肉水饺行右侧的减号，将数量从 3 减少到 2。
      40. 再次点击该商品行右侧的减号，将数量减少到 1。
      41. 点击购物车中的 Coupon 下拉框。
      42. 点击 No coupon，明确设置本次复购不使用优惠券。
      43. 点击 Place order，提交含 1 份 Pork Dumplings 和 1 份 Beef Chow Fun 的无券复购订单。
      44. 点击右上角当前账户下拉框。
      45. 点击 Admin Desk - Admin，切换为管理员账户。
      46. 点击顶部导航栏中的 Admin。
      47. 向下滑动 Admin 页面右侧滚动条，进入 All orders 区域并定位含 1 x Pork Dumplings、1 x Beef Chow Fun 和 No special notes 的最新订单。
      48. 点击该最新订单中的 Advance status，将订单从 Preparing 推进到 Out for delivery。
      49. 再次点击同一订单中的 Advance status，将订单推进到 Delivered。
      50. 按住 Ctrl 键并按下 Home 键，返回 Admin 页面顶部。
      51. 点击右上角当前账户下拉框。
      52. 点击 Lucas Lin - Customer，切换回客户账户。
      53. 点击顶部导航栏中的 Support。
      54. 点击 New support ticket 区域中的 Subject 字段。
      55. 输入 `Recent order check`。
      56. 点击 Message 字段。
      57. 输入 `Check latest total`。
      58. 点击 Create ticket，创建一条新的 Open 状态支持工单。
      59. 点击顶部导航栏中的 Restaurants。
      60. 点击 Search 字段。
      61. 按住 Ctrl 键并按下 A 键，选中当前搜索内容。
      62. 输入 `banh mi`。
      63. 点击 Cuisine 下拉框。
      64. 点击 Vietnamese，筛选越南餐厅。
      65. 点击 Sort 下拉框。
      66. 点击 Lowest delivery fee，按最低配送费排序。
      67. 点击 Santana Row Banh Mi Market No. 12 San Jose CA 卡片中的 View menu。
      68. 点击 Golden San Jose Pho Tai Rice 菜品卡片中的 Add to cart。
      69. 点击 Golden San Jose Pho Tai Soup 菜品卡片中的 Add to cart。
      70. 向下滑动菜单页面右侧滚动条，使购物车的数量、优惠券和结算区域完整显示。
      71. 点击购物车中 Golden San Jose Pho Tai Rice 行右侧的加号，将数量增加到 2。
      72. 点击 Golden San Jose Pho Tai Soup 行右侧的加号，将数量增加到 2。
      73. 点击 Coupon 下拉框。
      74. 点击 No coupon，明确保持购物车不使用优惠券。
