    source_instruction: |
      1. 点击顶部“Security”，进入后保持Low balance的Amount为“250”且Text复选框未选中；不要编辑或保存Low balance。
      2. 点击“New sign-in from macOS”旁的“Mark Read”。
      3. 点击“Upcoming bill”旁的“Mark Read”。
      4. 点击“Everyday Checking debit card”旁的“Lock”。
      5. 点击“OpenBank Rewards Card”旁的“Lock”。
      6. 在Large purchase的Amount字段输入“185.00”。
      7. 点击Large purchase区域的“Save”，提交Amount“185.00”且Push复选框保持已选中的设置。
      8. 点击Payment due的Text复选框，使其选中。
      9. 点击Payment due区域的“Save”，提交Text和Push复选框均已选中的设置。
      10. 点击Direct deposit posted的On复选框，使其选中。
      11. 点击Direct deposit posted的Text复选框，使其选中。
      12. 点击Direct deposit posted区域的“Save”。
      13. 点击顶部“Statements”。
      14. 点击Everyday Checking行的“Use paper”。
      15. 点击Rainy Day Savings行的“Go paperless”。
      16. 点击OpenBank Rewards Card行的“Use paper”。
      17. 点击Statements & documents区域的Account下拉框。
      18. 点击选项“Rainy Day Savings ...9140”。
