task_id: windows.opennavigation.stanford_meta_multistop_snapshot1_581746
platform: windows
instruction: Use the Author Route Planner already open in the browser. Generate exactly
  the following routes in this order, with no extra routes. For each route set Origin,
  Destination, Mode and Departure, then click Generate route. 1. Origin "Current location",
  destination "Stanford University", mode "Walking", departure "Leave now". 2. Origin
  "Stanford University", destination "Meta Headquarters", mode "Driving", departure
  "Leave now". 3. Origin "Meta Headquarters", destination "Googleplex", mode "Walking",
  departure "Leave now". 4. Origin "Googleplex", destination "Stanford University",
  mode "Driving", departure "17:20". Finish with the final generated route visible.
  The map is an offline synthetic benchmark map, not live travel advice.
init:
  initializer_id: initializers.windows.rebuilt_routes:RebuiltRoutesInitializer
  params: {}
evaluation:
  evaluator_id: evaluators.windows.rebuilt_routes:RebuiltRoutesEvaluator
  params:
    routes:
    - origin: Current location
      destination: Stanford University
      mode: Walking
      departure: Leave now
    - origin: Stanford University
      destination: Meta Headquarters
      mode: Driving
      departure: Leave now
    - origin: Meta Headquarters
      destination: Googleplex
      mode: Walking
      departure: Leave now
    - origin: Googleplex
      destination: Stanford University
      mode: Driving
      departure: '17:20'
limits:
  max_steps: 300
  step_timeout_seconds: 180
metadata:
  version: author-routes-v1
  original_idea: ordered driving/walking and connected routes with exact departure
    settings
  compatibility_difference: missing OpenNavigation snapshot replaced by author offline
    planner; no live map, saved/recent UI or real travel calculation
  original_archived: docs/windows/legacy-route-tasks/opennavigation_stanford_meta_multistop_snapshot1_581746.yaml
  app_name: Author Route Planner
