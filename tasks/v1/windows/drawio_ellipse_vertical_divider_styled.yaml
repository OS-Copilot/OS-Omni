task_id: windows.drawio.ellipse_vertical_divider_styled
platform: windows
instruction: 'In the draw.io desktop app, use the blank diagram that is already opened from C:\Users\User\Documents\drawio_ellipse_vertical_divider_styled.drawio.
  Insert exactly one ellipse that has a single vertical divider line through its center, like a vertical diameter. Set the
  shape size to 300 pt by 200 pt. Rotate the shape 90 degrees counterclockwise. Set the fill color to RGB (250, 50, 50), enable
  a visible vertical fill gradient on that same ellipse, and set the overall opacity to 65%. Set the line width to 5 pt and
  set the line color to 00FFFF. Do not add any other shapes, lines, or text. Save the currently opened diagram and leave the
  finished file open.

  Additional primary hard-mode requirement: Also enable a shadow on the ellipse while keeping the same single shape and no
  text. Also create these hard-plus verification files so the final state is a multi-artifact handoff bundle: C:\Users\User\Documents\helloworld_hard_plus\windows_drawio_ellipse_vertical_divider_styled\hard_plus_handoff.tsv
  with exactly this content: ''task_id\tlinux_peer\tstatus\nwindows.drawio.ellipse_vertical_divider_styled\tlinux.drawio.refresh_release_flow\thard-plus-ready\napp\tdraw.io\tevaluator-checked'';
  C:\Users\User\Documents\helloworld_hard_plus\windows_drawio_ellipse_vertical_divider_styled\hard_plus_dependency_index.txt
  with exactly this content: ''primary_task=windows.drawio.ellipse_vertical_divider_styled\nlinux_peer=linux.drawio.refresh_release_flow\ndifficulty=hard-plus\nrequires_multi_artifact_handoff=true\noracle_receipt=hard_plus_oracle_receipt.txt'';
  C:\Users\User\Documents\helloworld_hard_plus\windows_drawio_ellipse_vertical_divider_styled\hard_plus_review_matrix.csv
  with exactly this content: ''check,owner,status\nlinux_alignment,benchmark-ops,ready\nextra_artifacts,benchmark-ops,ready\noracle_recheck,benchmark-ops,required''.
  Use the target application for the visual work and create the required verification files at the specified paths.'
init:
  initializer_id: initializers.windows.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_powershell
      script: "$ErrorActionPreference = \"Stop\"\n\nGet-Process \"draw.io\" -ErrorAction SilentlyContinue |\n  Stop-Process\
        \ -Force -ErrorAction SilentlyContinue\nStart-Sleep -Milliseconds 800\n\n$drawioPath = @(\n  \"C:\\Program Files\\\
        draw.io\\draw.io.exe\",\n  \"$env:LOCALAPPDATA\\Programs\\draw.io\\draw.io.exe\"\n) | Where-Object { Test-Path $_\
        \ } | Select-Object -First 1\n\nif (-not $drawioPath) {\n  throw \"draw.io executable not found\"\n}\n\n$documentPath\
        \ = \"C:\\Users\\User\\Documents\\drawio_ellipse_vertical_divider_styled.drawio\"\n$documentDir = Split-Path -Parent\
        \ $documentPath\nNew-Item -ItemType Directory -Path $documentDir -Force | Out-Null\n\nforeach ($path in @(\n  $documentPath,\n\
        \  \"$documentPath.bak\",\n  \"$documentPath.tmp\"\n)) {\n  if (Test-Path $path) {\n    Remove-Item -LiteralPath $path\
        \ -Force -ErrorAction SilentlyContinue\n  }\n}\n\n# Clear persisted Electron/browser state so draw.io does not reopen\n\
        # the previous unsaved canvas from Local Storage / IndexedDB.\n$drawioAppData = Join-Path $env:APPDATA \"draw.io\"\
        \nif (Test-Path $drawioAppData) {\n  foreach ($name in @(\n    \"Local Storage\",\n    \"IndexedDB\",\n    \"Session\
        \ Storage\",\n    \"blob_storage\",\n    \"Cache\",\n    \"Code Cache\",\n    \"GPUCache\",\n    \"DawnCache\",\n\
        \    \"Service Worker\"\n  )) {\n    $target = Join-Path $drawioAppData $name\n    if (Test-Path $target) {\n    \
        \  Remove-Item -LiteralPath $target -Recurse -Force -ErrorAction SilentlyContinue\n    }\n  }\n}\n\n# Also remove\
        \ hidden draft temp files that draw.io may leave next to\n# prior files in Documents.\nGet-ChildItem -Path $documentDir\
        \ -Force -ErrorAction SilentlyContinue |\n  Where-Object {\n    $_.Name -like '.$*.dtmp' -or $_.Name -like '~$*.dtmp'\n\
        \  } |\n  Remove-Item -Force -ErrorAction SilentlyContinue\n\n$blankDiagram = [string]::Join([Environment]::NewLine,\
        \ @(\n  '<mxfile host=\"Electron\" type=\"device\">',\n  '  <diagram id=\"blank\" name=\"Page-1\">',\n  '    <mxGraphModel\
        \ dx=\"1000\" dy=\"1000\" grid=\"1\" gridSize=\"10\" guides=\"1\" tooltips=\"1\" connect=\"1\" arrows=\"1\" fold=\"\
        1\" page=\"1\" pageScale=\"1\" pageWidth=\"850\" pageHeight=\"1100\" math=\"0\" shadow=\"0\">',\n  '      <root>',\n\
        \  '        <mxCell id=\"0\"/>',\n  '        <mxCell id=\"1\" parent=\"0\"/>',\n  '      </root>',\n  '    </mxGraphModel>',\n\
        \  '  </diagram>',\n  '</mxfile>'\n)) + [Environment]::NewLine\n# Set-Content -Encoding UTF8 writes a BOM in PowerShell 5.1, which draw.io rejects as invalid file data.\n[System.IO.File]::WriteAllText($documentPath,\
        \ $blankDiagram, (New-Object System.Text.UTF8Encoding $false))\n\n"
      timeout: 70
    - type: run_powershell
      script: "$ErrorActionPreference = \"Stop\"\n\n$drawioPath = @(\n  \"C:\\Program Files\\draw.io\\draw.io.exe\",\n  \"\
        $env:LOCALAPPDATA\\Programs\\draw.io\\draw.io.exe\"\n) | Where-Object { Test-Path $_ } | Select-Object -First 1\n\n\
        if (-not $drawioPath) {\n  throw \"draw.io executable not found\"\n}\n\n$documentPath = \"C:\\Users\\User\\Documents\\\
        drawio_ellipse_vertical_divider_styled.drawio\"\nStart-Process -FilePath $drawioPath -ArgumentList @($documentPath)\
        \ -WindowStyle Maximized | Out-Null\n"
      timeout: 70
    - type: wait
      ms: 30000
    - type: run_powershell
      script: "$ErrorActionPreference = \"Stop\"\n\nAdd-Type -AssemblyName Microsoft.VisualBasic\nAdd-Type -AssemblyName System.Windows.Forms\n\
        Add-Type @\"\nusing System;\nusing System.Runtime.InteropServices;\npublic static class User32 {\n  [DllImport(\"\
        user32.dll\")]\n  public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow);\n  [DllImport(\"user32.dll\")]\n\
        \  public static extern bool SetForegroundWindow(IntPtr hWnd);\n  [DllImport(\"user32.dll\")]\n  public static extern\
        \ bool MoveWindow(IntPtr hWnd, int X, int Y, int nWidth, int nHeight, bool bRepaint);\n}\n\"@\n\n$drawioProc = $null\n\
        for ($i = 0; $i -lt 90; $i++) {\n  $drawioProc = Get-Process \"draw.io\" -ErrorAction SilentlyContinue |\n    Where-Object\
        \ { $_.MainWindowHandle -ne 0 } |\n    Select-Object -First 1\n  if ($null -ne $drawioProc) {\n    break\n  }\n  Start-Sleep\
        \ -Milliseconds 500\n}\n\nif ($null -eq $drawioProc) {\n  Write-Output \"DRAWIO_WINDOW_WARN=Could not find a visible\
        \ draw.io main window after launch\"; exit 0\n}\n\nGet-Process -ErrorAction SilentlyContinue |\n  Where-Object {\n\
        \    $_.MainWindowHandle -ne 0 -and\n    $_.Id -ne $drawioProc.Id -and\n    ($_.ProcessName -in @(\"WindowsTerminal\"\
        , \"powershell\", \"pwsh\", \"cmd\", \"notepad\"))\n  } |\n  ForEach-Object {\n    [void][User32]::ShowWindow($_.MainWindowHandle,\
        \ 6)\n  }\n\n$workingArea = [System.Windows.Forms.Screen]::PrimaryScreen.WorkingArea\n[void][User32]::MoveWindow(\n\
        \  $drawioProc.MainWindowHandle,\n  $workingArea.X,\n  $workingArea.Y,\n  $workingArea.Width,\n  $workingArea.Height,\n\
        \  $true\n)\nStart-Sleep -Milliseconds 200\n[void][User32]::ShowWindow($drawioProc.MainWindowHandle, 9)\nStart-Sleep\
        \ -Milliseconds 200\n[void][Microsoft.VisualBasic.Interaction]::AppActivate($drawioProc.Id)\nStart-Sleep -Milliseconds\
        \ 300\n[void][User32]::SetForegroundWindow($drawioProc.MainWindowHandle)\nStart-Sleep -Milliseconds 300\n[System.Windows.Forms.SendKeys]::SendWait(\"\
        % \")\nStart-Sleep -Milliseconds 200\n[System.Windows.Forms.SendKeys]::SendWait(\"x\")\n"
      timeout: 70
    - type: wait
      ms: 2000
evaluation:
  evaluator_id: evaluators.windows.drawio:DrawIOEvaluator
  params:
    check_id: drawio_ellipse_vertical_divider_styled
    timeout: 90
    stdout_contains: EVAL_RESULT:PASS
    supplemental_checks:
      files:
      - path: C:\Users\User\Documents\helloworld_hard_plus\windows_drawio_ellipse_vertical_divider_styled\hard_plus_handoff.tsv
        exact_text: "task_id\tlinux_peer\tstatus\nwindows.drawio.ellipse_vertical_divider_styled\tlinux.drawio.refresh_release_flow\t\
          hard-plus-ready\napp\tdraw.io\tevaluator-checked"
      - path: C:\Users\User\Documents\helloworld_hard_plus\windows_drawio_ellipse_vertical_divider_styled\hard_plus_dependency_index.txt
        exact_text: 'primary_task=windows.drawio.ellipse_vertical_divider_styled

          linux_peer=linux.drawio.refresh_release_flow

          difficulty=hard-plus

          requires_multi_artifact_handoff=true

          oracle_receipt=hard_plus_oracle_receipt.txt'
      - path: C:\Users\User\Documents\helloworld_hard_plus\windows_drawio_ellipse_vertical_divider_styled\hard_plus_review_matrix.csv
        exact_text: 'check,owner,status

          linux_alignment,benchmark-ops,ready

          extra_artifacts,benchmark-ops,ready

          oracle_recheck,benchmark-ops,required'
