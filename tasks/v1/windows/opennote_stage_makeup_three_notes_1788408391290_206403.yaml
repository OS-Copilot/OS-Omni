    source_instruction: |
      1. 单击左侧栏中的“Log In”按钮，打开“Log in to OpenNote”登录窗口。
      2. 单击登录窗口顶部的“Code Login”标签，切换到验证码登录表单。
      3. 保留默认手机号 `13800000000` 和验证码 `2026`，单击红色“Log In”按钮登录 Lina Park 账号。
      4. 单击左侧导航栏中的“Post”入口，开始记录舞台妆容排练方案。
      5. 单击 New Note 顶部的 Title 单行编辑区。
      6. 在 Title 中输入 `White Red Stage Look`。
      7. 单击 Body 多行编辑区。
      8. 在 Body 中输入 `Apply a smooth white base across the face.`，按 Enter 将底妆要求独立成行。
      9. 在 Body 中输入 `Draw clean red lines that lift both eyes.`，按 Enter 将眼部线条要求独立成行。
      10. 在 Body 中输入 `Keep a rounded focal shape around the nose.`，按 Enter 将鼻部焦点要求独立成行。
      11. 在 Body 中输入 `Balance both sides of the lip shape carefully.`，按 Enter 将唇形要求独立成行。
      12. 在 Body 中输入 `Place highlights where the stage light lands.`，按 Enter 将高光要求独立成行。
      13. 在 Body 中输入 `Check every painted edge before the show.`，然后按 Enter 换行。
      14. 在 Body 中输入 `Take a reference photo under warm lighting.`。
      15. 单击“Category”下拉框。
      16. 在分类菜单中选择“Beauty”。
      17. 单击 Location 输入框。
      18. 在 Location 中输入 `West rehearsal room`。
      19. 单击 Tags 输入框。
      20. 在 Tags 中输入 `stage makeup red`。
      21. 在 Cover 网格第一行中单击第二张“灰色西装人物站在衣橱旁”的图片，使其红框选中并作为本帖唯一封面。
      22. 在 New Note 表单页面向下滚动，直到“Publish”按钮可见，以便后续单击该按钮提交舞台妆容记录。
      23. 单击“Publish”，发布 `White Red Stage Look`。
      24. 单击左侧导航栏中的“Explore”。
      25. 单击顶部分类栏中的“Beauty”。
      26. 单击“long-wear base tests: small changes that lasts through a long day”笔记卡片。
      27. 在 Beauty 笔记详情卡片区域向下滚动，直到 Like 控件可见，以便后续单击该控件设置点赞状态。
      28. 单击当前未激活的“Like”，将该参考笔记设为已点赞。
      29. 单击当前未激活的“Save”，将该参考笔记设为已收藏。
      30. 单击详情右上角圆形关闭按钮，返回 Beauty 列表以继续后续资料整理。
      31. 单击左侧 Lina Park 账号卡片下方的“My Profile”。
      32. 单击个人页顶部的“Edit Profile”。
      33. 单击“Role”输入框。
      34. 在 Role 现有内容末尾输入 ` Stage makeup editor`。
      35. 单击“Save Profile”，保存舞台妆容编辑角色。
      36. 单击左侧导航栏中的“Post”，开始第二套冷色舞台方案。
      37. 单击 Title 输入框。
      38. 在 Title 中输入 `Blue Red Stage Look`。
      39. 单击 Body 多行编辑区。
      40. 在 Body 中输入 `Build a softer blue tone across the lower face.`，按 Enter 建立冷色底妆条目。
      41. 在 Body 中输入 `Add two measured red marks along the cheeks.`，按 Enter 建立红色面颊条目。
      42. 在 Body 中输入 `Keep the outer edges around both eyes crisp.`，按 Enter 建立眼缘细节条目。
      43. 在 Body 中输入 `Shorten the lip outline for the cooler role.`，按 Enter 建立唇线调整条目。
      44. 在 Body 中输入 `Review the full look beneath cool stage light.`，按 Enter 建立冷光检查条目。
      45. 在 Body 中输入 `Compare both roles beside the costume notes.`，然后按 Enter 换行。
      46. 在 Body 中输入 `Pack separate blue and red palettes for touchups.`，然后按 Enter 换行。
      47. 在 Body 中输入 `Mark a final mirror check before each entrance.`。
      48. 单击“Category”下拉框。
      49. 在分类菜单中选择“Beauty”。
      50. 单击 Location 输入框。
      51. 在 Location 中输入 `Main stage backstage`。
      52. 单击 Tags 输入框。
      53. 在 Tags 中输入 `blue red contours`。
      54. 在 Cover 网格第一行中单击第四张“黑色西装人物站在暖光衣橱前”的图片，使其红框选中并作为本帖唯一封面。
      55. 在 New Note 表单页面向下滚动，直到“Publish”按钮可见，以便后续单击该按钮提交冷色舞台方案。
      56. 单击“Publish”，发布 `Blue Red Stage Look`。
      57. 单击左侧导航栏中的“Post”，开始汇总两套角色妆容。
      58. 单击 Title 输入框。
      59. 在 Title 中输入 `Two Role Makeup List`。
      60. 单击 Body 多行编辑区。
      61. 在 Body 中输入 `Use the pale base only for the red stage role.`，然后按 Enter 换行。
      62. 在 Body 中输入 `Reserve the bold blue outline for the second role.`，然后按 Enter 换行。
      63. 在 Body 中输入 `Keep one clear red focal point near the nose.`，然后按 Enter 换行。
      64. 在 Body 中输入 `Test each finished look in cool and warm light.`，然后按 Enter 换行。
      65. 在 Body 中输入 `Deliver both makeup plans with the daily run sheet.`，然后按 Enter 换行。
      66. 在 Body 中输入 `Label every brush by its matching stage role.`，然后按 Enter 换行。
      67. 在 Body 中输入 `Share the full makeup timing with wardrobe staff.`，然后按 Enter 换行。
      68. 在 Body 中输入 `Keep the reference photo order fixed for review.`。
      69. 单击“Category”下拉框。
      70. 在分类菜单中选择“Beauty”。
      71. 单击 Location 输入框。
      72. 在 Location 中输入 `Makeup run zone`。
      73. 单击 Tags 输入框。
      74. 在 Tags 中输入 `role makeup run`。
      75. 在 Cover 网格第一行中单击第三张“多套中性色造型与人物的拼图”图片，使其红框选中并作为本帖唯一封面。
      76. 在 New Note 表单页面向下滚动，直到“Publish”按钮可见，以便后续单击该按钮提交两套角色妆容清单。
      77. 单击“Publish”，提交并发布 `Two Role Makeup List`。
