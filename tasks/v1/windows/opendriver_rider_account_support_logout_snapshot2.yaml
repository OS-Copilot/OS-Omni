    source_instruction: |-
      只能在 OpenDriver 应用窗口内操作。不要点击、拖动或整理桌面图标，不要打开文件资源管理器，不要操作 VMware、Android Studio 或系统任务栏。
      重要初始状态规则：Windows VM 必须已经处于快照 "Snapshot 2"。该快照应当已经安装 OpenDriver，并显示可进入 Rider 账号页签的登录/创建账号页面。不要在 initializer 或评测脚本中恢复快照；完整自动运行由 Windows runtime 配置负责恢复快照。
      重要最终状态规则：完成 Rider 账户、叫车、安全支持、账户子页面检查后，点击窗口左上角的退出图标，退出当前 Rider 会话，并停留在登出后的 OpenDriver 登录/创建账号页面。

      1. 点击登录页顶部的 Rider 账号页签。
      2. 点击 Name 输入框，键入 Scan Rider。
      3. 点击 Email 输入框，键入 scan.rider@example.com。
      4. 点击 Password 输入框，键入 Pass123!。
      5. 点击 Create account，进入 Rider 页面。
      6. 点击顶部 Ride 页签，使 Rider 叫车页面保持为当前页面。
      7. 点击 Downtown Palo Alto, CA 结果行，加载目的地路线。
      8. 点击 Choose a ride 按钮。
      9. 向下滚动到 RideX、RideXL、Priority pickup 选项区域。
      10. 点击 RideX 选项行。
      11. 点击 Promo code 输入框，按 Ctrl+A，再按 Backspace 清空内容；不要键入优惠码，保持 Promo code 为空。
      12. 点击 Choose RideX 按钮，停留在 RideX 估价区域。
      13. 等待订单完成提示出现后，点击 Done。
      14. 点击 Active 页签。
      15. 点击 Request a ride，返回 Ride 页面。
      16. 点击 Downtown Palo Alto, CA 结果行。
      17. 点击 Choose a ride 按钮。
      18. 向下滚动到 Promo code 输入框。
      19. 点击 Promo code 输入框，按 Ctrl+A。
      20. 按 Backspace 清空优惠码内容，保持 Promo code 为空。
      21. 点击 RideX 选项行，保持 RideX 选择。
      22. 点击 History 页签，打开 Ride history 页面。
      23. 点击 Ride history 页面中部的列表区域。
      24. 点击 History 页签，使 Ride history 列表区域重新聚焦。
      25. 点击 Ride 页签，返回叫车页面。
      26. 点击 Downtown Palo Alto, CA 结果行，恢复路线。
      27. 点击 Choose a ride 按钮。
      28. 向下滚动到 Choose RideX 按钮所在区域。
      29. 点击 Promo code 输入框，按 Ctrl+A。
      30. 按 Backspace 清空优惠码内容，保持 Promo code 为空。
      31. 点击 Choose RideX，停留在 RideX 选择/估价区域。
      32. 点击 Safety 页签，打开 Safety and support。
      33. 点击 Message 文本框，按 Ctrl+A。
      34. 键入 I need help with my ride.。
      35. 点击 Create support ticket。
      36. 点击 safety concern - Open 工单卡片。
      37. 点击 Reply to ticket 区域。
      38. 点击 Safety 页签，返回 Safety ticket 列表区域。
      39. 点击 Message 文本框，按 Ctrl+A。
      40. 键入 Follow up on my ride.。
      41. 点击 Create support ticket，新建第二条 Rider support ticket。
      42. 向上滚动 Safety 页面，使 open ticket 列表区域可见。
      43. 点击 Account 页签。
      44. 点击 Account 页中的 Scan Rider 账户信息区域。
      45. 点击 Edit profile 入口。
      46. 点击 Account 页签，返回 Account 主区域。
      47. 向下滚动 Account 页面，使账户功能入口区域可见。
      48. 点击 Wallet 入口。
      49. 点击 Account 页签，返回 Account 页面。
      50. 点击 Coupons 入口。
      51. 点击 Account 页签，返回 Account 页面。
      52. 点击 Notifications 入口。
      53. 点击 Account 页签，返回 Account 页面。
      54. 点击 Saved places 入口。
      55. 点击 Account 页签，返回 Account 页面。
      56. 点击 Ride 页签。
      57. 点击 Downtown Palo Alto, CA 结果行。
      58. 点击 Choose a ride 按钮。
      59. 向下滚动到 RideX 选项区域。
      60. 点击 Promo code 输入框，按 Ctrl+A。
      61. 按 Backspace 清空优惠码内容，保持 Promo code 为空。
      62. 点击 RideX 选项行。
      63. 点击 Safety 页签，打开 support ticket 区域。
      64. 点击 Account 页签，使最终业务页面回到 Scan Rider 账户页。
      65. 点击窗口左上角的退出图标，退出当前 Rider 会话。
      66. 停止操作，保持在登出后的 OpenDriver 登录/创建账号页面。
