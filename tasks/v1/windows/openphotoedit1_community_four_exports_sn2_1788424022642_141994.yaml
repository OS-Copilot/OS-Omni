    source_instruction: |
      1. 点击左侧栏顶部的“Import Photo”。
      2. 在 Windows“打开”对话框左侧点击“Pictures”。
      3. 根据缩略图找到“庭院里两位微笑女士并排站立、每人提着一只鲜橙色大水桶”的图片；该图片文件名为“pe1_orange_buckets_duo.png”，点击它。
      4. 点击右下角“Open”，将双人橙桶社区照片载入画布。
      5. 将“Temperature”滑块拖到 3，轻微补暖庭院环境和人物肤色。
      6. 将“Exposure”滑块拖到 6，打开灰色上衣和庭院阴影。
      7. 将“Brightness”滑块拖到 4，让两位志愿者面部保持明亮。
      8. 将“Contrast”滑块拖到 8，拉开人物与中性墙面的层次。
      9. 将“Saturation”滑块拖到 6，增强两只橙色水桶的识别度。
      10. 点击右侧固定标签区的“Filters”。
      11. 点击“Clean”预设，建立社区活动主视觉的清晰基调。
      12. 将“Strength”滑块拖到 38，控制 Clean 效果不过度锐化人物。
      13. 点击右侧固定标签区的“HSL”。
      14. 将“Orange”滑块拖到 10，突出两只水桶的暖橙色。
      15. 将“Green”滑块拖到 -8，压低庭院植物对主体的干扰。
      16. 点击右侧固定标签区的“Scene”。
      17. 将“Structure”滑块拖到 7，增强水桶边缘与人物衣物纹理。
      18. 将“HDR”滑块拖到 6，平衡庭院亮部和人物阴影。
      19. 将“Warm Sun”滑块拖到 4，为社区活动主视觉补充轻微暖光。
      20. 点击顶部“Download”，下载“pe1_orange_buckets_duo-edited.png”社区活动主视觉。
      21. 点击左侧栏顶部的“Import Photo”。
      22. 在 Windows“打开”对话框左侧点击“Pictures”。
      23. 根据缩略图找到“棚下五位志愿者围着一只醒目的蓝色大碗共同搅拌食材”的图片；该图片文件名为“pe1_blue_bowl_group.png”，点击它。
      24. 点击右下角“Open”，将蓝碗协作现场载入画布。
      25. 点击右侧固定标签区的“Scene”。
      26. 将“Structure”滑块拖到 14，强化蓝碗边缘和协作手势。
      27. 将“Foliage”滑块拖到 5，轻度整理背景中的绿色环境色。
      28. 将“HDR”滑块拖到 10，平衡棚顶和人物衣物的明暗。
      29. 点击右侧固定标签区的“Edit”。
      30. 将“Brightness”滑块拖到 8，提亮围绕大碗的五位参与者。
      31. 将“Contrast”滑块拖到 6，保留纪实画面的柔和层次。
      32. 点击右侧固定标签区的“HSL”。
      33. 将“Blue”滑块拖到 12，让中央大碗成为协作现场焦点。
      34. 将“Cyan”滑块拖到 -6，避免碗面高光偏青。
      35. 点击右侧固定标签区的“Scene”。
      36. 将“Structure”滑块拖到 10，增强蓝碗边缘和协作手势的清晰度。
      37. 将“HDR”滑块拖到 8，平衡棚下人物与背景亮度。
      38. 将“Warm Sun”滑块拖到 3，保留社区协作现场的自然暖感。
      39. 点击顶部“Download”，下载“pe1_blue_bowl_group-edited.png”协作现场卡。
      40. 点击左侧栏顶部的“Import Photo”。
      41. 在 Windows“打开”对话框左侧点击“Pictures”。
      42. 根据缩略图找到“室内五位成年人围坐交流、桌面中央放着一只白色大碗”的图片；该图片文件名为“pe1_white_bowl_group.png”，点击它。
      43. 点击右下角“Open”，将白碗交流现场载入画布。
      44. 点击右侧固定标签区的“Filters”。
      45. 点击“Cream”预设，为交流场景建立轻微暖调。
      46. 将“Strength”滑块拖到 32，保留白碗本身的中性色。
      47. 点击右侧固定标签区的“Edit”。
      48. 将“Exposure”滑块拖到 3，轻抬室内整体曝光。
      49. 将“Temperature”滑块拖到 5，统一五位参与者的肤色。
      50. 将“Fade”滑块拖到 4，柔化会议室背景的硬边。
      51. 点击右侧固定标签区的“HSL”。
      52. 将“Yellow”滑块拖到 -7，避免墙面暖色污染白碗。
      53. 将“Orange”滑块拖到 4，保留自然肤色活力。
      54. 点击右侧固定标签区的“Scene”。
      55. 将“Structure”滑块拖到 8，增强手势与白碗轮廓。
      56. 将“Cool Tone”滑块拖到 3，平衡 Cream 带来的暖色。
      57. 点击顶部“Download”，下载“pe1_white_bowl_group-edited.png”交流现场卡。
      58. 点击左侧栏顶部的“Import Photo”。
      59. 在 Windows“打开”对话框左侧点击“Pictures”。
      60. 根据缩略图找到“戴彩色头巾的女士在前景，与身后三位佩戴蓝色证带的同伴微笑自拍”的图片；该图片文件名为“pe1_headscarf_selfie.png”，点击它。
      61. 点击右下角“Open”，将头巾志愿者合影载入画布。
      62. 点击右侧固定标签区的“Portrait”。
      63. 将“Smooth”滑块拖到 8，仅做轻度肤质整理。
      64. 将“Whiten”滑块拖到 4，保持户外自拍的自然光感。
      65. 将“Rosy”滑块拖到 5，恢复志愿者面部的健康色泽。
      66. 将“Bright Eyes”滑块拖到 6，提升前景人物的眼神清晰度。
      67. 将“Background Blur”滑块拖到 7，轻微分离活动背景。
      68. 点击右侧固定标签区的“Edit”。
      69. 将“Saturation”滑块拖到 5，补足头巾和志愿者证带的色彩。
      70. 将“Sharpen”滑块拖到 7，强化眼部和头巾织物细节。
      71. 将“Vignette”滑块拖到 5，将视线收向四位人物。
      72. 点击右侧固定标签区的“Filters”。
      73. 点击“Portrait”预设，统一志愿者人物卡的面部层次。
      74. 将“Strength”滑块拖到 24，避免人像预设覆盖纪实质感。
      75. 点击右侧固定标签区的“Edit”。
      76. 将“Brightness”滑块拖到 3，轻微提亮四位志愿者的面部。
      77. 将“Temperature”滑块拖到 2，保持户外自拍的自然暖色。
      78. 将“Fade”滑块拖到 3，柔化活动背景的硬边。
      79. 点击顶部“Download”，下载“pe1_headscarf_selfie-edited.png”志愿者人物卡，并停留在该编辑页面。
