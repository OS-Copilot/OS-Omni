    source_instruction: |
      1. 单击左侧栏中的“Log In”按钮，打开“Log in to OpenNote”登录窗口。
      2. 单击“Code Login”标签，切换到验证码登录表单。
      3. 保留默认手机号 `13800000000` 和验证码 `2026`，单击红色“Log In”按钮登录 Lina Park 账号。
      4. 单击顶部分类栏中的“Food”。
      5. 单击“A half-day version of bakery reviews that is easy to follow without overplanning”笔记卡片。
      6. 单击当前未激活的“Save”，将这篇烘焙点评笔记设为已收藏。
      7. 单击详情右上角圆形关闭按钮，返回 Food 列表以继续筹备交接记录。
      8. 单击左侧导航栏中的“Post”。
      9. 单击 New Note 表单的 Title 输入框。
      10. 在 Title 中输入 `Orange Crate Handoff`。
      11. 单击 Body 多行编辑区。
      12. 在 Body 中输入 `Check the contents of both crates at arrival.`，按 Enter 建立双箱检查条目。
      13. 在 Body 中输入 `Record each crate owner and the handoff time.`，按 Enter 建立责任人和时间条目。
      14. 在 Body 中输入 `Separate chilled food from all dry supplies.`，按 Enter 建立冷藏与干货分区条目。
      15. 在 Body 中输入 `Count every fruit box before the scheduled pickup.`，然后按 Enter 换行。
      16. 在 Body 中输入 `Keep all printed labels facing upward on the table.`，然后按 Enter 换行。
      17. 在 Body 中输入 `Confirm the numbered depot table with both owners.`，然后按 Enter 换行。
      18. 单击“Category”下拉框。
      19. 在分类菜单中选择“Food”。
      20. 单击 Location 输入框。
      21. 在 Location 中输入 `Community depot gate`。
      22. 单击 Tags 输入框。
      23. 在 Tags 中输入 `Food handoff crates`。
      24. 在 Cover 网格的图片中单击第一张“番茄吐司、沙拉与早餐碗拼图”图片，使其红框选中并作为本帖唯一封面。
      25. 在 New Note 表单页面向下滚动，直到“Publish”按钮可见，以便后续单击该按钮提交食材交接记录。
      26. 单击“Publish”，发布 `Orange Crate Handoff`。
      27. 单击左侧导航栏中的“Explore”。
      28. 单击顶部分类栏中的“Food”。
      29. 单击“I tried this picnic boxes 8 times until it finally worked”笔记卡片。
      30. 单击当前未激活的“Like”，将该方案设为已点赞。
      31. 单击详情右上角圆形关闭按钮，返回 Food 列表继续寻找协作者。
      32. 单击“A half-day version of picnic boxes that works for a slow afternoon”笔记卡片。
      33. 单击当前未激活的“Save”，将这篇笔记设为已收藏。
      34. 单击详情右上角圆形关闭按钮，返回 Explore 信息流以继续建立社区餐食计划。
      35. 单击左侧 Lina Park 账号卡片下方的“My Profile”。
      36. 单击个人页顶部的“Edit Profile”。
      37. 单击“Bio”输入框。
      38. 在 Bio 现有内容末尾输入 ` Community meal lead`。
      39. 单击“Save Profile”，保存社区餐食负责人简介。
      40. 单击左侧导航栏中的“Post”。
      41. 单击 Title 输入框。
      42. 在 Title 中输入 `Blue Bowl Cook Log`。
      43. 单击 Body 多行编辑区。
      44. 在 Body 中输入 `Record every batch prepared at the mixing table.`，按 Enter 建立拌料台记录。
      45. 在 Body 中输入 `Assign one cook to weighing and one to plating.`，按 Enter 建立称量装盘分工。
      46. 在 Body 中输入 `Add an allergen check before any bowl is served.`，按 Enter 建立过敏原检查条目。
      47. 在 Body 中输入 `Arrange the blue bowls beside their cooking stations.`，然后按 Enter 换行。
      48. 在 Body 中输入 `Record the planned serving order for all tables.`，然后按 Enter 换行。
      49. 在 Body 中输入 `Hold one sample plate for the final kitchen review.`。
      50. 单击“Category”下拉框。
      51. 在分类菜单中选择“Food”。
      52. 单击 Location 输入框。
      53. 在 Location 中输入 `Community kitchen`。
      54. 单击 Tags 输入框。
      55. 在 Tags 中输入 `cook blue bowl`。
      56. 在 Cover 网格的图片中单击第三张“多份早餐菜品铺满餐桌的拼图”图片，使其红框选中并作为本帖唯一封面。
      57. 在 New Note 表单页面向下滚动，直到“Publish”按钮可见，以便后续单击该按钮提交厨房分工日志。
      58. 单击“Publish”，发布 `Blue Bowl Cook Log`。
      59. 单击左侧导航栏中的“Post”，开始整理最终社区用餐计划。
      60. 单击 Title 输入框。
      61. 在 Title 中输入 `Community Meal Plan`。
      62. 单击 Body 多行编辑区。
      63. 在 Body 中输入 `Use the saved lemon cake note for dessert planning.`，按 Enter 建立甜点参考条目。
      64. 在 Body 中输入 `Use the liked picnic box guide for packing ideas.`，按 Enter 建立饭盒参考条目。
      65. 在 Body 中输入 `Use Freya's ramen notes to prepare the hot station.`，按 Enter 建立拉面准备参考条目。
      66. 在 Body 中输入 `Assign two named owners to receive the food crates.`，然后按 Enter 换行。
      67. 在 Body 中输入 `Post the final kitchen timeline near the entry desk.`，然后按 Enter 换行。
      68. 在 Body 中输入 `Keep every allergy card visible beside its dish.`。
      69. 单击“Category”下拉框。
      70. 在分类菜单中选择“Food”。
      71. 单击 Location 输入框。
      72. 在 Location 中输入 `Community activity`。
      73. 单击 Tags 输入框。
      74. 在 Tags 中输入 `community meal roles`。
      75. 在 Cover 网格的图片中单击第四张“咖啡、牛角包和水果早餐桌”图片，使其红框选中并作为本帖唯一封面。
      76. 在 New Note 表单页面向下滚动，直到“Publish”按钮可见，以便后续单击该按钮提交社区用餐总计划。
      77. 单击“Publish”，提交并发布 `Community Meal Plan`。
