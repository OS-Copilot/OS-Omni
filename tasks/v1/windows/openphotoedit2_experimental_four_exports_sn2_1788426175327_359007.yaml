task_id: windows.openphotoedit2.experimental_four_exports.sn2_1788426175327_359007
platform: windows
instruction: Use GIMP to prepare four independently edited image exports. Source1
  is open; all four source PNG files are in C:\Users\User\Documents\author_rebuilt_images\set2.
  For each source use its own original image; do not accumulate transformations across
  sources. For source1.png, rotate90 degrees clockwise, then export PNG to C:\Users\User\Documents\author_rebuilt_images\set2\export1.png.
  For source2.png, flip horizontally, then export PNG to C:\Users\User\Documents\author_rebuilt_images\set2\export2.png.
  For source3.png, rotate180 degrees, then export PNG to C:\Users\User\Documents\author_rebuilt_images\set2\export3.png.
  For source4.png, flip vertically, then export PNG to C:\Users\User\Documents\author_rebuilt_images\set2\export4.png.
  Preserve source colors and original pixel detail, use no crop, scaling, added text,
  borders, or effects. Close any export options dialog after exporting. All four correctly
  transformed separate PNG files must exist before finishing.
