    source_instruction: |
      1. 点击左侧栏顶部的“Import Photo”。
      2. 在 Windows“打开”对话框左侧点击“Pictures”。
      3. 根据缩略图找到“黑色背景中头部侧倾、脸涂白色并带红色三角彩绘、身穿黑衣的舞台角色”的图片；该图片文件名为“pe2_clown_white_red_tilt.png”，点击它。
      4. 点击右下角“Open”，将白红侧倾角色主视觉载入画布。
      5. 点击右侧固定标签区的“Filters”。
      6. 点击“Film”预设，为第一角色建立颗粒化舞台基调。
      7. 将“Strength”滑块拖到 46，保留白色妆面的纹理。
      8. 点击右侧固定标签区的“Edit”。
      9. 将“Exposure”滑块拖到 7，打开黑色服装中的暗部。
      10. 将“Contrast”滑块拖到 16，强化白脸与黑背景的分离。
      11. 将“Saturation”滑块拖到 -5，控制红色彩绘的艳度。
      12. 将“Fade”滑块拖到 8，形成实验戏剧海报的柔灰层次。
      13. 将“Grain”滑块拖到 11，增加舞台摄影的胶片质感。
      14. 将“Vignette”滑块拖到 15，把视线收向侧倾面部。
      15. 点击右侧固定标签区的“HSL”。
      16. 将“Red”滑块拖到 9，突出眼周和嘴唇的红色几何线。
      17. 将“Orange”滑块拖到 -6，压低裸露皮肤的暖色干扰。
      18. 点击右侧固定标签区的“Scene”。
      19. 将“Structure”滑块拖到 8，强化白红彩绘边界和黑色衣领纹理。
      20. 将“HDR”滑块拖到 6，保留白色妆面与黑衣之间的亮度层级。
      21. 将“Cool Tone”滑块拖到 4，为实验舞台主视觉加入克制冷感。
      22. 点击顶部“Download”，下载“pe2_clown_white_red_tilt-edited.png”第一角色主视觉。
      23. 点击左侧栏顶部的“Import Photo”。
      24. 在 Windows“打开”对话框左侧点击“Pictures”。
      25. 根据缩略图找到“黑色背景中脸部左右分成蓝红两色、身穿黑色西装并手持一扇扑克牌的角色”的图片；该图片文件名为“pe2_clown_blue_red_cards.png”，点击它。
      26. 点击右下角“Open”，将蓝红持牌角色海报载入画布。
      27. 点击右侧固定标签区的“HSL”。
      28. 将“Blue”滑块拖到 11，增强面部蓝色区域的图形感。
      29. 将“Red”滑块拖到 8，保持红色半脸与蓝色半脸平衡。
      30. 将“Cyan”滑块拖到 -7，避免蓝色妆面偏向荧光青。
      31. 点击右侧固定标签区的“Edit”。
      32. 将“Brightness”滑块拖到 6，提亮扑克牌和手指边缘。
      33. 将“Contrast”滑块拖到 13，增强黑色礼服的层次。
      34. 将“Sharpen”滑块拖到 12，突出牌背、眉线和妆面边界。
      35. 点击右侧固定标签区的“Filters”。
      36. 点击“Clean”预设，让第二角色海报保持清晰锐利。
      37. 将“Strength”滑块拖到 34，避免预设压过红蓝妆色。
      38. 点击右侧固定标签区的“Edit”。
      39. 将“Exposure”滑块拖到 3，轻抬蓝红角色和扑克牌的整体曝光。
      40. 将“Fade”滑块拖到 3，柔化黑色背景向人物轮廓的过渡。
      41. 将“Vignette”滑块拖到 4，把视线集中在彩绘面部和扑克牌上。
      42. 点击顶部“Download”，下载“pe2_clown_blue_red_cards-edited.png”第二角色海报。
      43. 点击左侧栏顶部的“Import Photo”。
      44. 在 Windows“打开”对话框左侧点击“Pictures”。
      45. 根据缩略图找到“纯黑背景上只有一条发光白线勾勒左向人物侧脸和肩颈”的图片；该图片文件名为“pe2_white_contour_profile.png”，点击它。
      46. 点击右下角“Open”，将白色轮廓实验节目卡载入画布。
      47. 点击右侧固定标签区的“Filters”。
      48. 点击“Night”预设，建立冷暗节目卡基调。
      49. 将“Strength”滑块拖到 52，使白色轮廓保持可辨。
      50. 点击右侧固定标签区的“Edit”。
      51. 将“Exposure”滑块拖到 -9，压回轮廓周围的灰色光晕。
      52. 将“Contrast”滑块拖到 18，拉开白线与黑色背景。
      53. 将“Fade”滑块拖到 5，缓和头部轮廓的硬边。
      54. 将“Vignette”滑块拖到 12，收束节目卡外围黑场。
      55. 点击右侧固定标签区的“Scene”。
      56. 将“Cool Tone”滑块拖到 14，为白色轮廓加入轻微冷感。
      57. 将“HDR”滑块拖到 9，保留颈肩交界处的亮度层级。
      58. 将“Structure”滑块拖到 11，强化轮廓线的连续性。
      59. 点击顶部“Download”，下载“pe2_white_contour_profile-edited.png”实验轮廓节目卡。
      60. 点击左侧栏顶部的“Import Photo”。
      61. 在 Windows“打开”对话框左侧点击“Pictures”。
      62. 根据缩略图找到“背景左黄右粉，两位穿黑色西装和白衬衫的男士面对面交谈”的图片；该图片文件名为“pe2_suits_yellow_pink_split.png”，点击它。
      63. 点击右下角“Open”，将黄粉背景双人对谈图载入画布。
      64. 点击右侧固定标签区的“Edit”。
      65. 将“Exposure”滑块拖到 2，保持两位对谈者的面部亮度。
      66. 将“Contrast”滑块拖到 10，增强黑色西装和白衬衫的层次。
      67. 将“Saturation”滑块拖到 -9，避免黄粉背景盖过人物。
      68. 将“Temperature”滑块拖到 -4，统一黄色与粉色区域的肤色表现。
      69. 点击右侧固定标签区的“HSL”。
      70. 将“Yellow”滑块拖到 -12，收敛左侧黄色背景。
      71. 将“Magenta”滑块拖到 -8，降低右侧粉色背景的冲击。
      72. 将“Orange”滑块拖到 5，恢复两位人物的自然肤色。
      73. 点击右侧固定标签区的“Scene”。
      74. 将“Structure”滑块拖到 9，增强西装边缘和中央分割线。
      75. 将“HDR”滑块拖到 7，平衡两侧背景亮度。
      76. 点击右侧固定标签区的“Filters”。
      77. 点击“Film”预设，为对谈单元增加克制的节目质感。
      78. 将“Strength”滑块拖到 28，保留黄粉背景的双区结构。
      79. 点击顶部“Download”，下载“pe2_suits_yellow_pink_split-edited.png”对谈宣传卡，并停留在该编辑页面。
