  the cabin set to Economy, the payment method set to Bank Card, and the Note field containing exactly
  V2sanyaSalesA. The second booking is a hotel in Beijing at the Beijing Jade Pavilion Boutique Stay,
  with the Deluxe Twin Room selected, the payment method set to WeChat Pay, and the Note field containing
  exactly V2BeijingTwinA. The third booking is a flight from Shanghai (PVG) to Chongqing (CKG) for 2026-06-01
  on the Eastern Star ES8139 flight, with the traveler set to Maya Chen · Passport, the cabin set to Business,
  the payment method set to WeChat Pay, and the Note field containing exactly V2NorthDealA. The fourth
  booking is a hotel in Chengdu at the Chengdu Jade Pavilion Boutique Stay, with the Family Suite selected,
  the number of guests set to 3, the payment method set to Bank Card, and the Note field containing exactly
  V2ChengduTeamA. The fifth booking is a flight from Shanghai (SHA) to Sanya (SYX) for 2026-06-12 on the
  Eastern Star ES6821 flight, with the traveler set to Maya Chen · Passport, the cabin set to Economy,
  and the Note field containing exactly V2SanyaBaseA.
