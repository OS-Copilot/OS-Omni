    source_instruction: |-
      1. 点击角色选择区中的 Driver 角色按钮，明确选择司机身份。
      2. 点击新司机姓名字段 Name。
      3. 输入 `RoadOps 27`。
      4. 点击新司机邮箱字段 Email。
      5. 输入 `roadops27@drv.test`。
      6. 点击新司机密码字段 Password。
      7. 输入 `DriverPass9!`。
      8. 点击 Create account 按钮，创建待审核司机账户并进入 Driver Workspace。
      9. 点击 Open account setup，打开新司机的 Account 页面。
      10. 点击驾照号码字段 License number。
      11. 输入 `CA-DL-2701`。
      12. 点击车辆品牌字段 Vehicle make。
      13. 输入 `Toyota`。
      14. 点击车辆型号字段 Vehicle model。
      15. 输入 `Prius`。
      16. 点击车辆年份字段 Vehicle year。
      17. 输入 year value `2024`。
      18. 点击车牌字段 License plate。
      19. 输入 `ROAD27`。
      20. 点击车辆颜色字段 Vehicle color。
      21. 输入 `Blue`。
      22. 点击 Save profile for review 按钮，保存司机及车辆资料供审核。
      23. 在 Account 页面内向下滑动，显示 Driver documents 区域。
      24. 点击驾照文档类型按钮 Document type。
      25. 点击 Driver license 选项，明确选择驾照文档类型。
      26. 点击驾照文档编号字段 Document ID。
      27. 输入 `DL-ROAD27`。
      28. 点击驾照到期日期字段 Expires at。
      29. 输入 `2028-12-31`。
      30. 点击驾照提交按钮 Submit document，提交驾照文档。
      31. 点击保险文档类型按钮 Document type。
      32. 点击 Insurance 选项，明确选择保险文档类型。
      33. 点击保险文档编号字段 Document ID。
      34. 输入 `INS-ROAD27`。
      35. 点击保险到期日期字段 Expires at。
      36. 输入 `2028-06-30`。
      37. 点击保险提交按钮 Submit document，提交保险文档。
      38. 点击车辆检查类型按钮 Document type。
      39. 点击 Vehicle inspection 选项，明确选择车辆检查文档类型。
      40. 点击车辆检查编号字段 Document ID。
      41. 输入 `INSP-ROAD27`。
      42. 点击车辆检查到期日期字段 Expires at。
      43. 输入 `2028-09-30`。
      44. 点击车辆检查提交按钮 Submit document，提交文档并形成 3/3 required submitted 状态。
      45. 点击右上角退出图标，返回 OpenDriver 登录页。
      46. 点击角色选择区中的 Driver 角色按钮，明确选择已批准司机身份。
      47. 点击批准司机姓名字段 Name。
      48. 输入 `Maya Rodriguez`。
      49. 点击批准司机邮箱字段 Email。
      50. 输入 `driver@example.com`。
      51. 点击批准司机密码字段 Password。
      52. 输入 `Password123!`。
      53. 点击司机登录按钮 Login，进入已批准司机的 Driver Workspace。
      54. 点击 Create sample request 按钮，生成一条可处理的乘客请求。
      55. 点击新请求卡片中的 Reject，拒绝请求并返回在线候单状态。
      56. 点击顶部 Money 标签，打开司机收入与行程记录页面。
      57. 在 Downtown Palo Alto 至 Meta MPK 23 的已完成行程中点击 Rate rider，打开乘客评分对话框。
      58. 点击第四颗星评分按钮，明确选择四星评分。
      59. 点击乘客评价字段 Comment。
      60. 输入 `Clear pickup`。
      61. 点击 Submit 按钮，提交司机对乘客的评分。
      62. 点击顶部 Support 标签，打开 Driver safety and support 页面。
      63. 点击工单内容字段 Message。
      64. 输入 `Rider conduct review`。
      65. 点击 Create support ticket 按钮，创建举报乘客工单。
      66. 点击最上方新生成的 `Rider conduct review` 工单行最右端黑色弯箭头图标，打开工单详情。
      67. 点击司机回复字段 Reply。
      68. 输入 `Check rider history`。
      69. 点击 Send reply 按钮，发送第一条司机补充信息。
      70. 再次点击司机回复字段 Reply。
      71. 输入 `Pickup info ready`。
      72. 点击 Send reply 按钮，发送第二条司机补充信息并形成两条回复。
      73. 点击工单详情中的 Close，关闭对话框并返回 Support 页面。
      74. 点击顶部 Money 标签，返回司机收入页面。
      75. 点击 Amount 输入框。
      76. 输入 `120`。
      77. 点击 Note 输入框。
      78. 输入 `Weekly payout`。
      79. 点击 Request payout 按钮，提交 120 美元的提现申请；保持 OpenDriver 已登录并停留在 Money 页面，不要退出应用或退出登录。
