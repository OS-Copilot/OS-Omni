platform: windows
instruction: |-
  Create a new driver account in OpenDriver and complete the associated profile, document, and operational workflows for both the new and an existing approved driver. The new driver account must be established with the Driver role, the name RoadOps 27, the email roadops27@drv.test, and the password DriverPass9!. This account’s profile must be saved for review with the license number CA-DL-2701, vehicle make Toyota, vehicle model Prius, vehicle year 2024, license plate ROAD27, and vehicle color Blue. The Driver documents area for this new account must reflect a required documents state of 3/3 submitted, containing a Driver license with Document ID DL-ROAD27 and Expires at 2028-12-31, an Insurance document with Document ID INS-ROAD27 and Expires at 2028-06-30, and a Vehicle inspection document with Document ID INSP-ROAD27 and Expires at 2028-09-30.

  The approved driver session must be established by signing in with the Driver role, the name Maya Rodriguez, the email driver@example.com, and the password Password123!. Within this approved driver’s workspace, a sample request must be created and subsequently rejected so that the driver returns to the online waiting state. The Money page must display a rating for the completed trip from Downtown Palo Alto to Meta MPK 23, where the rider is rated with the fourth star and the comment Clear pickup. A support ticket titled Rider conduct review must exist and contain two driver replies in the following order: Check rider history, then Pickup info ready. The Money page must also contain a submitted payout request with 120 in the Amount field and Weekly payout in the Note field. At completion, OpenDriver must remain logged in and positioned on the Money page without logging out or exiting the application.
