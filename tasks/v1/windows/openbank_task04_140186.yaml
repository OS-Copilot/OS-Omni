instruction: |-
  Download the statements for the account “Rainy Day Savings ...9140” for the month 2026-04, the account “OpenBank Rewards Card ...7712” for the month 2026-03, and the account “Everyday Checking ...2381” for the month 2026-02, and enable the paperless option for the Rainy Day Savings account.

  Create two new transfer recipients with the following details: the first recipient must have the Name “Amina Yusuf”, Nickname “Grant”, Bank “Liberty Bank”, Routing number “011401533”, and Account number “5920864173”; the second recipient must have the Name “Theo Bennett”, Nickname “Equipment”, Bank “Frontier Union”, Routing number “271070801”, and Account number “4186359702”. Save both recipients.

  Submit four transfers in the following order: transfer 95.20 from “Rainy Day Savings ...9140” to “Amina Yusuf” with the date 2026-06-07 and memo “T4 materials”; transfer 212.30 from “Everyday Checking ...2381” to “Theo Bennett” with the date 2026-06-08 and memo “T4 rental”; transfer 64.80 from “Rainy Day Savings ...9140” to “Avery Brooks (...6612)” with the date 2026-06-09 and memo “T4 upkeep”; and transfer 37.45 from “Everyday Checking ...2381” to “Maya Patel (...2044)” with the date 2026-06-10 and memo “T4 split”.

  Mark the alerts “New sign-in from macOS” and “Upcoming bill” as read, and lock the “OpenBank Rewards Card”. Configure the alert settings as follows: for Low balance, set the Amount to 410 and ensure the Text notification is enabled; for Large purchase, set the Amount to 240 and ensure the Email notification is disabled; for Payment due, ensure the Text notification is enabled and the Email notification is disabled; and for Direct deposit posted, ensure both the On and Text notifications are enabled. Save all four alert configurations.
