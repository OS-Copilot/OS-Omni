    source_instruction: |-
      1. 连续点击两次桌面上的 `openfood` 快捷方式。
      2. 在刚打开的 OpenFood 窗口中，点击右上角的账号下拉菜单。
      3. 在账号列表中选择 Lucas Lin - Customer。
      4. 点击顶部导航栏中的 `Restaurants`。
      5. 点击占位文字为 Restaurant, cuisine, district 的搜索框。
      6. 按住 Ctrl 键并按下 A 键以选中搜索框中的现有文字。
      7. 输入 `banh`。
      8. 点击 `Cuisine` 下拉菜单。
      9. 在 Cuisine 列表中选择 Vietnamese。
      10. 点击 `Sort` 下拉菜单。
      11. 在 Sort 列表中选择 Fastest。
      12. 点击 Santana Row Banh Mi Market No. 12 San Jose CA 卡片中的 View menu。
      13. 点击 `Golden San Jose Pho Tai Rice` 右侧的 `Add to cart`。
      14. 点击 `Golden San Jose Pho Tai Soup` 右侧的 `Add to cart`。
      15. 在右侧购物车的 `Golden San Jose Pho Tai Rice` 数量加号按钮上点击一次。
      16. 点击右侧购物车中的 `Coupon` 下拉菜单。
      17. 在 Coupon 列表中选择 WELCOME12 - $12 off orders over $30。
      18. 点击右侧购物车底部的 `Place order` 按钮。
      19. 提交第一张订单后，点击右上角的账号下拉菜单。
      20. 在账号列表中选择 Noah Park - Merchant。
      21. 点击顶部导航栏中的 `Merchant`。
      22. 向下滑动页面直到 Santana Row Banh Mi Market No. 12 San Jose CA 商家卡片显示。
      23. 点击 Golden San Jose Pho Tai Snack 行右侧的 Available 按钮。
      24. 向下滑动页面直到 Restaurant orders 区域显示。
      25. 点击刚创建的 `Santana Row Banh Mi Market No. 12 San Jose CA` 订单中的 `Advance status`。
      26. 再次点击同一订单中的 `Advance status`。
      27. 向上滑动页面到顶部。
      28. 在 Merchant 页面顶部，点击右上角的账号下拉菜单。
      29. 在账号列表中选择 Lucas Lin - Customer。
      30. 点击顶部导航栏中的 `Support`。
      31. 点击 `Subject` 文本栏。
      32. 输入 `Soup quality`。
      33. 点击 Message 文本框。
      34. 输入 `Soup was cold`。
      35. 点击 `Create ticket` 按钮。
      36. 创建支持工单后，点击右上角的账号下拉菜单。
      37. 在账号列表中选择 Ava Chen - Courier。
      38. 点击顶部导航栏中的 `Courier`。
      39. 向下滑动页面直到 D-333 - Station Queens Dumpling No. 33 New York City NY 配送卡片显示。
      40. 点击 D-333 配送卡片中的 Accept route。
      41. 点击 D-333 配送卡片中的 Next step。
      42. 向上滑动页面到顶部。
      43. 在 Courier 页面顶部，点击右上角的账号下拉菜单。
      44. 在账号列表中选择 Lucas Lin - Customer。
      45. 点击顶部导航栏中的 `Orders`。
      46. 向上滑动 Orders 页面到顶部。
      47. 点击最新已送达订单中的 `Reorder`；该订单包含 Golden San Jose Pho Tai Rice、Golden San Jose Pho Tai Soup 和 WELCOME12。
      48. 在右侧购物车中点击 `Golden San Jose Pho Tai Rice` 数量左侧的减号按钮。
      49. 在右侧购物车的 `Golden San Jose Pho Tai Soup` 数量加号按钮上点击一次。
      50. 点击右侧购物车底部的 `Clear` 按钮。
      51. 点击 `Back to restaurants`。
      52. 点击占位文字为 Restaurant, cuisine, district 的搜索框。
      53. 按住 Ctrl 键并按下 A 键以选中搜索框中的现有文字。
      54. 输入 `dumpling`。
      55. 点击 `Cuisine` 下拉菜单。
      56. 在 Cuisine 列表中选择 Chinese。
      57. 点击 `Sort` 下拉菜单。
      58. 在 Sort 列表中选择 Rating。
      59. 点击 Dumpling Room No. 20 San Jose CA 卡片中的 View menu。
      60. 点击 `Pork Dumplings` 右侧的 `Add to cart`。
      61. 点击 `Beef Chow Fun` 右侧的 `Add to cart`。
      62. 在右侧购物车中点击 `Pork Dumplings` 数量右侧的加号按钮。
      63. 再次点击右侧购物车中同一商品行的数量加号按钮。
      64. 点击右侧购物车中的 `Coupon` 下拉菜单。
      65. 在 Coupon 列表中选择 WELCOME12 - $12 off orders over $30。
      66. 点击右侧购物车底部的 `Place order` 按钮。
      67. 提交第二张订单后，点击右上角的账号下拉菜单。
      68. 在账号列表中选择 Noah Park - Merchant。
      69. 点击顶部导航栏中的 `Merchant`。
      70. 向下滑动页面直到 Restaurant orders 区域显示。
      71. 点击刚创建的 `Dumpling Room No. 20 San Jose CA` 订单中的 `Advance status`。
      72. 再次点击同一订单中的 `Advance status`。
      73. 向上滑动页面到顶部。
      74. 再次回到 Merchant 页面顶部后，点击右上角的账号下拉菜单。
      75. 在账号列表中选择 Lucas Lin - Customer。
