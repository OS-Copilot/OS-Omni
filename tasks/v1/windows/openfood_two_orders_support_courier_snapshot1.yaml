platform: windows
instruction: Create two delivered coupon orders, a support ticket, and a courier route progression in
  the OpenFood application, ending with the customer account active and the restaurant list filtered for
  Chinese dumplings. The first order, placed as Lucas Lin - Customer, must be for Santana Row Banh Mi
  Market No. 12 San Jose CA and contain 2 Golden San Jose Pho Tai Rice and 1 Golden San Jose Pho Tai Soup
  with the coupon WELCOME12 - $12 off orders over $30 applied, discovered by searching for banh with the
  Cuisine filter set to Vietnamese and the Sort option set to Fastest. The second order, also placed as
  Lucas Lin - Customer, must be for Dumpling Room No. 20 San Jose CA and contain 3 Pork Dumplings and
  1 Beef Chow Fun with the same WELCOME12 - $12 off orders over $30 coupon applied, discovered by searching
  for dumpling with the Cuisine filter set to Chinese and the Sort option set to Rating. Both orders must
  have their status advanced twice by Noah Park - Merchant to reach Delivered. The menu item Golden San
  Jose Pho Tai Snack at Santana Row Banh Mi Market No. 12 San Jose CA must be marked unavailable by the
  merchant. A support ticket created by Lucas Lin - Customer must have the subject Soup quality and the
  message Soup was cold. The courier Ava Chen - Courier must accept the route for delivery card D-333
  - Station Queens Dumpling No. 33 New York City NY and select Next step on that card. An intermediate
  reorder action initiated by Lucas Lin - Customer from the first delivered order must be performed, adjusting
  the cart to 1 Golden San Jose Pho Tai Rice and 2 Golden San Jose Pho Tai Soup, but this cart must be
  cleared without placing an order. The final state of the application must be signed in as Lucas Lin
  - Customer with an empty cart, no active coupon, the restaurant Dumpling Room No. 20 San Jose CA selected,
  and the restaurant filters set to the search term dumpling, Cuisine Chinese, and Sort Rating.
