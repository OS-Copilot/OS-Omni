task_id: android.cross_vm.prepare_budget_transfer_hard
platform: android
instruction: The reference CSV "budget_source.csv" and the incomplete transfer CSV "budget_transfer.csv" are in Markor on
  Android, and the transfer CSV is already open. Using Markor only, replace the transfer CSV so it exactly matches the reference
  CSV, then save it and leave it ready to be transferred to Windows. The finished transfer CSV must contain the header Category,
  Planned, Actual, Owner, Region, DueDate and all sixteen rows in the same order.
