  initializer_id: initializers.android.cross_vm:AndroidTransferSourceInitializer
  params:
    source_path: /sdcard/Documents/markor/budget_source.csv
    transfer_path: /sdcard/Documents/markor/budget_transfer.csv
    open_path: /sdcard/Documents/markor/budget_transfer.csv
