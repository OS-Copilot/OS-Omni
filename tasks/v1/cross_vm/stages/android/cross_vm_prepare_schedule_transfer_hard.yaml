  oracle_task: tasks/v1/cross_vm/stages/android/oracle/cross_vm_prepare_schedule_transfer_hard_oracle.yaml
  human_steps: 88
  human_steps_breakdown:
  - 'open reference note and copy its lines: 8'
  - 'paste into transfer note and clear old rows: 6'
  - 'convert 18 data lines to CSV (3 each): 54'
  - 'apply 4 corrections (3 each): 12'
  - 'type header, save, leave note: 4'
  - 'move the rescheduled row into time order: 4'
