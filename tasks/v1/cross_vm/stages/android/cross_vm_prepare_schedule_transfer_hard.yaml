limits:
  max_steps: 150
  step_timeout_seconds: 120
metadata:
  tags:
  - android
  - cross_vm
  - markor
  - hard
  app_name: Markor
  difficulty: hard
  description: Rebuild a sorted 16-session conference CSV on Android after two cancellations, a move, and a speaker
    change.
  cross_vm_role: android_source_phase
  composite_task: cross_vm.android_to_windows.conference_schedule_hard
  source_platform: android
