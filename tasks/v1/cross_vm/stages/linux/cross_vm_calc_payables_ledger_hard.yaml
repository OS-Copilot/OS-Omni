  human_steps_breakdown:
  - 'open transferred CSV, copy rows, paste into workbook: 10'
  - 'rename first sheet, insert and name ByVendor and ByCategory: 10'
  - 'Pending headers E1:G1: 6'
  - 'Pending formulas E:G (type + fill down each): 15'
  - 'Pending total row: 8'
  - 'ByVendor headers and 7 vendor names: 17'
  - 'ByVendor formulas B:E (type + fill down each): 20'
  - 'ByVendor total row: 8'
  - 'ByCategory headers, 5 category names, two formulas: 21'
  - 'Save in xlsx (keep-format prompt): 4'
  - 'Export ByVendor as CSV (sheet, Save As, type, name, options): 8'
