task_id: linux.oracle.cross_vm.writer_contract_renewals_hard
platform: linux
instruction: Oracle sanity task for linux.cross_vm.writer_contract_renewals_hard. The initializer already prepares
  the expected document. Wait briefly and finish.
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: |
        pkill -f '[s]office.bin' >/dev/null 2>&1 || true
        pkill -f '/usr/lib/libreoffice/program/[s]office' >/dev/null 2>&1 || true
        mkdir -p /home/user/Documents /home/user/Desktop
        python3 - <<'PY'
        from docx import Document
        doc = Document()
        for kind, value, style in [('p', 'Q4 2026 Contract Renewals', 'heading 1'), ('tbl', [['Contract', 'Vendor', 'Owner', 'End date', 'Notice by', 'Annual value'], ['C-111', 'Keystone Couriers', 'Lena Fischer', '2026-10-01', '2026-08-02', '11200'], ['C-106', 'Fjord Catering', 'Jordan Lee', '2026-10-15', '2026-08-16', '15400'], ['C-119', 'Summit Telecom', 'Omar Haddad', '2026-10-20', '2026-08-21', '18900'], ['C-103', 'Cobalt Cleaning', 'Priya Nair', '2026-10-31', '2026-09-01', '22800'], ['C-122', 'Vista Parking', 'Lena Fischer', '2026-10-31', '2026-09-01', '5200'], ['C-114', 'Northwind Water', 'Omar Haddad', '2026-11-01', '2026-09-02', '4800'], ['C-109', 'Ironclad Legal', 'Maya Chen', '2026-11-15', '2026-09-16', '30500'], ['C-117', 'Quarry Analytics', 'Lena Fischer', '2026-11-20', '2026-09-21', '41000'], ['C-101', 'Atlas Freight', 'Maya Chen', '2026-11-30', '2026-10-01', '48000'], ['C-112', 'Lumen Lighting', 'Theo Martin', '2026-12-01', '2026-10-02', '7300'], ['C-124', 'Xenon Labs', 'Omar Haddad', '2026-12-10', '2026-10-11', '33300'], ['C-104', 'Delta Office', 'Maya Chen', '2026-12-15', '2026-10-16', '9600'], ['C-115', 'Orchid Florals', 'Jordan Lee', '2026-12-20', '2026-10-21', '3600'], ['C-107', 'Granite Security', 'Priya Nair', '2026-12-31', '2026-11-01', '37200'], ['C-120', 'Tidewater Waste', 'Theo Martin', '2026-12-31', '2026-11-01', '9900']], ''), ('p', 'By owner', 'heading 2'), ('tbl', [['Owner', 'Contracts', 'Total'], ['Maya Chen', '3', '88100'], ['Priya Nair', '2', '60000'], ['Lena Fischer', '3', '57400'], ['Omar Haddad', '3', '57000'], ['Jordan Lee', '2', '19000'], ['Theo Martin', '2', '17200']], ''), ('p', 'By month', 'heading 2'), ('p', 'October 2026: 5 contracts, 73500', ''), ('p', 'November 2026: 4 contracts, 124300', ''), ('p', 'December 2026: 6 contracts, 100900', ''), ('p', 'Totals', 'heading 2'), ('p', 'Total annual value up for renewal: 298700', ''), ('p', 'First notice deadline: 2026-08-02 (C-111 Keystone Couriers)', '')]:
            if kind == "tbl":
                table = doc.add_table(rows=len(value), cols=len(value[0]))
                for r, row in enumerate(value):
                    for c, text in enumerate(row):
                        table.cell(r, c).text = text
            elif style.startswith("heading"):
                doc.add_heading(value, level=int(style.split()[-1]))
            else:
                doc.add_paragraph(value)
        doc.save("/home/user/Documents/renewal_brief.docx")
        print("ORACLE_OK")
        PY
      timeout: 120
evaluation:
  evaluator_id: evaluators.linux.command_check:CommandCheckEvaluator
  params:
    timeout: 120
    stdout_contains: PASS
    command: |
      python3 - <<'PY'
      import zipfile
      import xml.etree.ElementTree as ET

      W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main"
      NS = {"w": W}

      def read_docx(path):
          with zipfile.ZipFile(path) as zf:
              body = ET.fromstring(zf.read("word/document.xml")).find("w:body", NS)
              names = {}
              if "word/styles.xml" in zf.namelist():
                  styles = ET.fromstring(zf.read("word/styles.xml"))
                  for style in styles.findall("w:style", NS):
                      name = style.find("w:name", NS)
                      if name is not None:
                          names[style.attrib.get("{%s}styleId" % W)] = name.attrib.get("{%s}val" % W, "")
          items = []
          for child in body:
              tag = child.tag.split("}")[1]
              if tag == "p":
                  text = "".join(t.text or "" for t in child.findall(".//w:t", NS)).strip()
                  if not text:
                      continue
                  style = child.find("w:pPr/w:pStyle", NS)
                  style_id = style.attrib.get("{%s}val" % W) if style is not None else ""
                  items.append(("p", text, names.get(style_id, style_id).lower()))
              elif tag == "tbl":
                  rows = []
                  for tr in child.findall("w:tr", NS):
                      rows.append(["".join(t.text or "" for t in tc.findall(".//w:t", NS)).strip()
                                   for tc in tr.findall("w:tc", NS)])
                  items.append(("tbl", rows, ""))
          return items
      def fail(message):
          raise SystemExit(message)
      items = read_docx("/home/user/Documents/renewal_brief.docx")
      expected = [('p', 'Q4 2026 Contract Renewals', 'heading 1'), ('tbl', [['Contract', 'Vendor', 'Owner', 'End date', 'Notice by', 'Annual value'], ['C-111', 'Keystone Couriers', 'Lena Fischer', '2026-10-01', '2026-08-02', '11200'], ['C-106', 'Fjord Catering', 'Jordan Lee', '2026-10-15', '2026-08-16', '15400'], ['C-119', 'Summit Telecom', 'Omar Haddad', '2026-10-20', '2026-08-21', '18900'], ['C-103', 'Cobalt Cleaning', 'Priya Nair', '2026-10-31', '2026-09-01', '22800'], ['C-122', 'Vista Parking', 'Lena Fischer', '2026-10-31', '2026-09-01', '5200'], ['C-114', 'Northwind Water', 'Omar Haddad', '2026-11-01', '2026-09-02', '4800'], ['C-109', 'Ironclad Legal', 'Maya Chen', '2026-11-15', '2026-09-16', '30500'], ['C-117', 'Quarry Analytics', 'Lena Fischer', '2026-11-20', '2026-09-21', '41000'], ['C-101', 'Atlas Freight', 'Maya Chen', '2026-11-30', '2026-10-01', '48000'], ['C-112', 'Lumen Lighting', 'Theo Martin', '2026-12-01', '2026-10-02', '7300'], ['C-124', 'Xenon Labs', 'Omar Haddad', '2026-12-10', '2026-10-11', '33300'], ['C-104', 'Delta Office', 'Maya Chen', '2026-12-15', '2026-10-16', '9600'], ['C-115', 'Orchid Florals', 'Jordan Lee', '2026-12-20', '2026-10-21', '3600'], ['C-107', 'Granite Security', 'Priya Nair', '2026-12-31', '2026-11-01', '37200'], ['C-120', 'Tidewater Waste', 'Theo Martin', '2026-12-31', '2026-11-01', '9900']], ''), ('p', 'By owner', 'heading 2'), ('tbl', [['Owner', 'Contracts', 'Total'], ['Maya Chen', '3', '88100'], ['Priya Nair', '2', '60000'], ['Lena Fischer', '3', '57400'], ['Omar Haddad', '3', '57000'], ['Jordan Lee', '2', '19000'], ['Theo Martin', '2', '17200']], ''), ('p', 'By month', 'heading 2'), ('p', 'October 2026: 5 contracts, 73500', ''), ('p', 'November 2026: 4 contracts, 124300', ''), ('p', 'December 2026: 6 contracts, 100900', ''), ('p', 'Totals', 'heading 2'), ('p', 'Total annual value up for renewal: 298700', ''), ('p', 'First notice deadline: 2026-08-02 (C-111 Keystone Couriers)', '')]
      if len(items) != len(expected):
          fail('ITEM_COUNT_MISMATCH:%r' % (items,))
      for observed, (kind, value, style) in zip(items, expected):
          if observed[0] != kind or observed[1] != value:
              fail('CONTENT_MISMATCH:%r' % (observed,))
          if kind == 'p' and style and observed[2] != style:
              fail('STYLE_MISMATCH:%r' % (observed,))
          if kind == 'p' and not style and observed[2].startswith('heading'):
              fail('UNEXPECTED_HEADING:%r' % (observed,))
      print("PASS")
      PY
