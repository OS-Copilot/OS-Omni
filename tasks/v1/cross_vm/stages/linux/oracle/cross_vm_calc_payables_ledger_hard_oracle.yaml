        print("ORACLE_OK")
        import csv
        with open("/home/user/Documents/vendor_summary.csv", "w", newline="", encoding="utf-8") as handle:
            csv.writer(handle).writerows([['Vendor', 'Invoices', 'Amount Due', 'Large', 'Share'], ['Atlas Freight', '3', '2363.69', '1', '0.176'], ['Brightline Print', '3', '1435.48', '1', '0.1069'], ['Cobalt Cleaning', '2', '2182.68', '1', '0.1625'], ['Delta Office', '2', '1793.12', '1', '0.1335'], ['Evergreen IT', '2', '2115.72', '1', '0.1575'], ['Fjord Catering', '2', '1051.38', '0', '0.0783'], ['Granite Security', '2', '2489.4', '1', '0.1853'], ['Total', '16', '13431.47', '6', '']])
