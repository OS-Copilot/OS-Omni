task_id: windows.cross_vm.writer_conference_schedule_hard
platform: windows
instruction: 'A blank LibreOffice Writer document named "conference_schedule.docx" is open, and the transferred
  CSV "schedule_transfer.csv" is on the Desktop. Use only LibreOffice Writer. Build the document in this exact order:
  "DevSummit 2026 Day 1" in the paragraph style Heading 1; then for each of Room A, Room B, and Room C a Heading
  2 paragraph with the room name followed by a three-column table with the header row Time, Session, Speaker and
  one row per session in that room in time order; then "Speaker index" in Heading 2 followed by one paragraph per
  distinct speaker in alphabetical order in the form "<speaker>: <session>; <session>" listing that speaker''s sessions
  in time order; then "Totals" in Heading 2 followed by the paragraphs "Sessions: <count>", "Speakers: <distinct
  speakers>", and "Busiest room: <room> (<count> sessions)". All non-heading paragraphs use body text styles and
  the document must contain nothing else. Save the document in Word format, then also export it to PDF as "conference_schedule.pdf"
  in the same Documents folder. Do not open Notepad or any other text editor.'
init:
  initializer_id: initializers.windows.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_powershell
      script: |
        $ErrorActionPreference = 'Stop'
        Get-Process soffice,soffice.bin,swriter -ErrorAction SilentlyContinue |
          Stop-Process -Force -ErrorAction SilentlyContinue
        $docPath = Join-Path $env:USERPROFILE 'Documents\conference_schedule.docx'
        $notePath = Join-Path $env:USERPROFILE 'Desktop\schedule_transfer.csv'
        New-Item -ItemType Directory -Path (Split-Path $docPath) -Force | Out-Null
        New-Item -ItemType Directory -Path (Split-Path $notePath) -Force | Out-Null
        @(
          'Time,Room,Session,Speaker'
          '09:00,Room A,Opening keynote,Maya Chen'
          '09:00,Room B,Accessibility clinic,Omar Haddad'
          '09:00,Room C,Hiring for platform teams,Rosa Lima'
          '10:15,Room A,Scaling event pipelines,Jordan Lee'
          '10:15,Room B,Design tokens in practice,Priya Nair'
          '11:30,Room A,Observability on a budget,Theo Martin'
          '11:30,Room B,Mobile offline sync,Ines Duarte'
          '11:30,Room C,Cost reviews that stick,Sam Patel'
          '13:30,Room A,Secure defaults for APIs,Rosa Lima'
          '13:30,Room C,Feature flags at scale,Dana Ortiz'
          '14:45,Room A,Testing flaky UIs,Kenji Sato'
          '14:45,Room B,Inclusive onboarding,Dana Ortiz'
          '14:45,Room C,Incident review rituals,Theo Martin'
          '16:00,Room A,Closing panel,Maya Chen'
          '16:00,Room B,Design systems Q and A,Priya Nair'
          '16:00,Room C,Platform roadmap,Jordan Lee'
        ) | Set-Content -LiteralPath $notePath -Encoding UTF8
        $code = @'
        import os, subprocess, sys
        def _need(mod, pkg):
            try:
                return __import__(mod)
            except ImportError:
                subprocess.check_call([sys.executable, '-m', 'pip', 'install', pkg, '-q'])
                return __import__(mod)
        docx = _need('docx', 'python-docx')
        path = os.path.join(os.environ['USERPROFILE'], 'Documents', 'conference_schedule.docx')
        os.makedirs(os.path.dirname(path), exist_ok=True)
        docx.Document().save(path)
        print('INIT_OK', path)
        '@
        $code | py -3 -W ignore -
        if ($LASTEXITCODE -ne 0) { throw "Failed to create conference_schedule.docx" }
        if (-not (Test-Path -LiteralPath $docPath)) { throw "Missing initialized document: $docPath" }
        if (-not (Test-Path -LiteralPath $notePath)) { throw "Missing transferred file: $notePath" }
      timeout: 90
    - type: run_powershell
      script: |
        $ErrorActionPreference = 'Stop'
        $filePath = Join-Path $env:USERPROFILE 'Documents\conference_schedule.docx'
        if (-not (Test-Path -LiteralPath $filePath)) { throw "Missing document before launch: $filePath" }
        $candidates = @(
          'C:\Program Files\LibreOffice\program\swriter.exe',
          'C:\Program Files (x86)\LibreOffice\program\swriter.exe',
          'C:\Program Files\LibreOffice\program\soffice.exe',
          'C:\Program Files (x86)\LibreOffice\program\soffice.exe',
          'C:\Program Files\LibreOffice 26\program\swriter.exe',
          'C:\Program Files\LibreOffice 26\program\soffice.exe'
        )
        $officeExe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
        if (-not $officeExe) {
          $cmd = Get-Command swriter.exe -ErrorAction SilentlyContinue
          if ($cmd) { $officeExe = $cmd.Source }
        }
        if (-not $officeExe) { throw 'LibreOffice executable not found' }
        Start-Process -FilePath $officeExe -ArgumentList "`"$filePath`""
      timeout: 30
    - type: wait
      ms: 5000
evaluation:
  evaluator_id: evaluators.windows.powershell_check:PowerShellCheckEvaluator
  params:
    timeout: 90
    stdout_contains: EVAL_RESULT:PASS
    command: |
      @'
      import os, subprocess, sys
      def _need(mod, pkg):
          try:
              return __import__(mod)
          except ImportError:
              subprocess.check_call([sys.executable, '-m', 'pip', 'install', pkg, '-q'])
              return __import__(mod)
      docx = _need('docx', 'python-docx')
      from docx.table import Table
      from docx.text.paragraph import Paragraph
      def fail(message):
          print(message)
          raise SystemExit(1)
      docs = os.path.join(os.environ['USERPROFILE'], 'Documents')
      doc = docx.Document(os.path.join(docs, 'conference_schedule.docx'))
      items = []
      for child in doc.element.body.iterchildren():
          tag = child.tag.split('}')[1]
          if tag == 'p':
              para = Paragraph(child, doc)
              text = para.text.strip()
              if text:
                  items.append(('p', text, (para.style.name if para.style is not None else '').lower()))
          elif tag == 'tbl':
              table = Table(child, doc)
              items.append(('tbl', [[cell.text.strip() for cell in row.cells] for row in table.rows], ''))
      expected = [('p', 'DevSummit 2026 Day 1', 'heading 1'), ('p', 'Room A', 'heading 2'), ('tbl', [['Time', 'Session', 'Speaker'], ['09:00', 'Opening keynote', 'Maya Chen'], ['10:15', 'Scaling event pipelines', 'Jordan Lee'], ['11:30', 'Observability on a budget', 'Theo Martin'], ['13:30', 'Secure defaults for APIs', 'Rosa Lima'], ['14:45', 'Testing flaky UIs', 'Kenji Sato'], ['16:00', 'Closing panel', 'Maya Chen']], ''), ('p', 'Room B', 'heading 2'), ('tbl', [['Time', 'Session', 'Speaker'], ['09:00', 'Accessibility clinic', 'Omar Haddad'], ['10:15', 'Design tokens in practice', 'Priya Nair'], ['11:30', 'Mobile offline sync', 'Ines Duarte'], ['14:45', 'Inclusive onboarding', 'Dana Ortiz'], ['16:00', 'Design systems Q and A', 'Priya Nair']], ''), ('p', 'Room C', 'heading 2'), ('tbl', [['Time', 'Session', 'Speaker'], ['09:00', 'Hiring for platform teams', 'Rosa Lima'], ['11:30', 'Cost reviews that stick', 'Sam Patel'], ['13:30', 'Feature flags at scale', 'Dana Ortiz'], ['14:45', 'Incident review rituals', 'Theo Martin'], ['16:00', 'Platform roadmap', 'Jordan Lee']], ''), ('p', 'Speaker index', 'heading 2'), ('p', 'Dana Ortiz: Feature flags at scale; Inclusive onboarding', ''), ('p', 'Ines Duarte: Mobile offline sync', ''), ('p', 'Jordan Lee: Scaling event pipelines; Platform roadmap', ''), ('p', 'Kenji Sato: Testing flaky UIs', ''), ('p', 'Maya Chen: Opening keynote; Closing panel', ''), ('p', 'Omar Haddad: Accessibility clinic', ''), ('p', 'Priya Nair: Design tokens in practice; Design systems Q and A', ''), ('p', 'Rosa Lima: Hiring for platform teams; Secure defaults for APIs', ''), ('p', 'Sam Patel: Cost reviews that stick', ''), ('p', 'Theo Martin: Observability on a budget; Incident review rituals', ''), ('p', 'Totals', 'heading 2'), ('p', 'Sessions: 16', ''), ('p', 'Speakers: 10', ''), ('p', 'Busiest room: Room A (6 sessions)', '')]
      if len(items) != len(expected):
          fail('ITEM_COUNT_MISMATCH:%r' % (items,))
      for observed, (kind, value, style) in zip(items, expected):
          if observed[0] != kind or observed[1] != value:
              fail('CONTENT_MISMATCH:%r' % (observed,))
          if kind == 'p' and style and observed[2] != style:
              fail('STYLE_MISMATCH:%r' % (observed,))
          if kind == 'p' and not style and observed[2].startswith('heading'):
              fail('UNEXPECTED_HEADING:%r' % (observed,))
      pypdf = _need('pypdf', 'pypdf')
      pdf_path = os.path.join(docs, 'conference_schedule.pdf')
      if not os.path.exists(pdf_path):
          fail('MISSING_PDF')
      text = ' '.join(' '.join((page.extract_text() or '').split()) for page in pypdf.PdfReader(pdf_path).pages)
      for needle in ['DevSummit 2026 Day 1', 'Speaker index', 'Sessions: 16', 'Ines Duarte']:
          if needle not in text:
              fail('PDF_MISSING_TEXT:' + needle)
      print('EVAL_RESULT:PASS')
      '@ | py -3 -W ignore -
    supplemental_checks:
      powershell:
      - label: no_notepad_process
        script: |
          $p = Get-Process -Name notepad -ErrorAction SilentlyContinue
          if ($p) { Write-Output 'NOTEPAD_RUNNING'; exit 1 }
          Write-Output 'NO_NOTEPAD_PROCESS'
        stdout_contains: NO_NOTEPAD_PROCESS
        expected_exit_code: 0
        timeout: 10
limits:
  max_steps: 200
  step_timeout_seconds: 120
metadata:
  tags:
  - windows
  - cross_vm
  - libreoffice
  - writer
  - table
  - pdf
  - hard
  app_name: libreoffice-writer
  difficulty: hard
  description: Build a three-room Writer schedule with heading levels, three tables, a speaker index, derived totals,
    and a PDF export.
  cross_vm_role: windows_target_phase
  composite_task: cross_vm.android_to_windows.conference_schedule_hard
  source_platform: android
  target_platform: windows
  oracle_task: tasks/v1/cross_vm/stages/windows/oracle/cross_vm_writer_conference_schedule_hard_oracle.yaml
  human_steps: 132
  human_steps_breakdown:
  - 'open transferred CSV in Writer and arrange windows: 6'
  - 'Heading 1 title (type, pick style): 3'
  - 'three Heading 2 room headings: 9'
  - 'Room A table (6 sessions): 26'
  - 'Room B table (5 sessions): 23'
  - 'Room C table (5 sessions): 23'
  - 'Speaker index heading: 3'
  - '10 speaker index paragraphs (2 each): 20'
  - 'Totals heading and three derived paragraphs: 9'
  - 'Save in Word format (keep-format prompt): 4'
  - 'Export as PDF with name: 6'
