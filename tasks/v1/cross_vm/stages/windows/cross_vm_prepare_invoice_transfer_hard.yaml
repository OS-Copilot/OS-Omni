task_id: windows.cross_vm.prepare_invoice_transfer_hard
platform: windows
instruction: An invoice register CSV is open in Notepad. Save a filtered copy to the Desktop as "invoices_transfer.csv"
  that contains the header Vendor,Invoice,Category,Amount (drop the Status column) followed by only the invoices
  whose Status is Pending, in their original order, with values written exactly as in the register. Leave the saved
  Desktop file available for transfer.
init:
  initializer_id: initializers.windows.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_powershell
      script: |
        Get-Process notepad -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
        $sourcePath = Join-Path $env:USERPROFILE "Documents\invoices_source.csv"
        New-Item -ItemType Directory -Path (Split-Path $sourcePath) -Force | Out-Null
        @'
        Vendor,Invoice,Category,Amount,Status
        Atlas Freight,INV-1042,Freight,1250.00,Pending
        Brightline Print,INV-1043,Print,380.50,Paid
        Atlas Freight,INV-1047,Freight,640.00,Pending
        Cobalt Cleaning,INV-1051,Facilities,915.25,Pending
        Brightline Print,INV-1055,Print,212.75,Pending
        Cobalt Cleaning,INV-1058,Facilities,430.00,Paid
        Delta Office,INV-1060,Office,1575.40,Pending
        Atlas Freight,INV-1063,Freight,298.60,Pending
        Evergreen IT,INV-1066,IT,2240.00,Disputed
        Delta Office,INV-1069,Office,84.90,Pending
        Evergreen IT,INV-1071,IT,1199.00,Pending
        Fjord Catering,INV-1074,Facilities,655.30,Pending
        Brightline Print,INV-1077,Print,1020.00,Pending
        Atlas Freight,INV-1080,Freight,455.45,Paid
        Fjord Catering,INV-1083,Facilities,318.20,Pending
        Evergreen IT,INV-1086,IT,760.00,Pending
        Cobalt Cleaning,INV-1089,Facilities,1105.75,Pending
        Delta Office,INV-1092,Office,142.10,Paid
        Granite Security,INV-1095,Facilities,1890.00,Pending
        Atlas Freight,INV-1098,Freight,930.00,Disputed
        Granite Security,INV-1101,Facilities,415.00,Pending
        Brightline Print,INV-1104,Print,96.40,Pending
        '@ | Set-Content -Path $sourcePath -Encoding UTF8
        Start-Process notepad.exe $sourcePath
      timeout: 30
    - type: wait
      ms: 4000
evaluation:
  evaluator_id: evaluators.windows.powershell_check:PowerShellCheckEvaluator
  params:
    timeout: 30
    stdout_contains: EVAL_RESULT:PASS
    command: |
      $expected = @'
      Vendor,Invoice,Category,Amount
      Atlas Freight,INV-1042,Freight,1250.00
      Atlas Freight,INV-1047,Freight,640.00
      Cobalt Cleaning,INV-1051,Facilities,915.25
      Brightline Print,INV-1055,Print,212.75
      Delta Office,INV-1060,Office,1575.40
      Atlas Freight,INV-1063,Freight,298.60
      Delta Office,INV-1069,Office,84.90
      Evergreen IT,INV-1071,IT,1199.00
      Fjord Catering,INV-1074,Facilities,655.30
      Brightline Print,INV-1077,Print,1020.00
      Fjord Catering,INV-1083,Facilities,318.20
      Evergreen IT,INV-1086,IT,760.00
      Cobalt Cleaning,INV-1089,Facilities,1105.75
      Granite Security,INV-1095,Facilities,1890.00
      Granite Security,INV-1101,Facilities,415.00
      Brightline Print,INV-1104,Print,96.40
      '@
      $expected = ($expected -replace "`r`n", "`n").Trim()
      $targetPath = Join-Path $env:USERPROFILE "Desktop\invoices_transfer.csv"
      if (-not (Test-Path -LiteralPath $targetPath)) { Write-Output "MISSING_FILE"; exit 1 }
      $actual = ((Get-Content -LiteralPath $targetPath -Raw) -replace "`r`n", "`n").Trim()
      if ($actual -cne $expected) { Write-Output "CONTENT_MISMATCH"; exit 1 }
      Write-Output "EVAL_RESULT:PASS"
limits:
  max_steps: 150
  step_timeout_seconds: 120
metadata:
  tags:
  - windows
  - cross_vm
  - notepad
  - hard
  app_name: notepad
  difficulty: hard
  description: Filter a 22-invoice register to pending rows and drop the Status column in Notepad.
  cross_vm_role: windows_source_phase
  composite_task: cross_vm.windows_to_linux.payables_ledger_hard
  source_platform: windows
  target_platform: linux
  oracle_task: tasks/v1/cross_vm/stages/windows/oracle/cross_vm_prepare_invoice_transfer_hard_oracle.yaml
  human_steps: 26
  human_steps_breakdown:
  - 'delete 6 non-pending rows (select, delete): 12'
  - 'Replace dialog to strip '',Pending'' and fix the header: 8'
  - 'Save As to Desktop with name and type: 6'
