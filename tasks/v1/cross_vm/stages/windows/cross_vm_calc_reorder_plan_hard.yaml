task_id: windows.cross_vm.calc_reorder_plan_hard
platform: windows
instruction: 'A blank LibreOffice Calc workbook named "reorder_plan.xlsx" is open, and the transferred CSV "reorder_transfer.csv"
  is on the Desktop. Use only LibreOffice Calc. Sheet 1 must be named "Reorder": put the CSV header and sixteen
  item rows in A1:E17 with numbers kept numeric, then add F1 "Shortfall" with =MAX(0;C2-B2), G1 "OrderQty" with
  =ROUNDUP(F2/10;0)*10, H1 "LineCost" with =G2*E2, and I1 "Priority" with =IF(B2=0;"Critical";IF(F2>0;"Reorder";"OK")),
  each filled down to row 17; in row 18 put "Total" in A18, =SUM(G2:G17) in G18, and =SUM(H2:H17) in H18. Sheet
  2 must be named "BySupplier" with the header Supplier, Lines, Units, Cost, Critical in A1:E1 and one row per supplier
  sorted alphabetically from row 2, where B uses =COUNTIFS($Reorder.$D$2:$D$17;A2;$Reorder.$G$2:$G$17;">0"), C uses
  =SUMIF($Reorder.$D$2:$D$17;A2;$Reorder.$G$2:$G$17), D uses =SUMIF($Reorder.$D$2:$D$17;A2;$Reorder.$H$2:$H$17),
  and E uses =COUNTIFS($Reorder.$D$2:$D$17;A2;$Reorder.$I$2:$I$17;"Critical"), filled down; the row after the last
  supplier has "Total" in A and SUM formulas over the supplier rows in B through E. Sheet 3 must be named "Summary"
  with the header Metric, Value in A1:B1 and these rows: "Items to reorder" with =COUNTIF($Reorder.$G$2:$G$17;">0");
  "Critical items" with =COUNTIF($Reorder.$I$2:$I$17;"Critical"); "Total order cost" with =$Reorder.H18; "Largest
  supplier" with =INDEX($BySupplier.A2:A5;MATCH(MAX($BySupplier.D2:D5);$BySupplier.D2:D5;0)); and "Largest supplier
  cost" with =MAX($BySupplier.D2:D5). Leave everything else empty and save the workbook in xlsx format. Finally,
  export the BySupplier sheet as a comma-separated CSV file named "supplier_po.csv" in the same Documents folder.'
init:
  initializer_id: initializers.windows.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_powershell
      script: |
        $ErrorActionPreference = 'Stop'
        Get-Process soffice,soffice.bin,scalc -ErrorAction SilentlyContinue |
          Stop-Process -Force -ErrorAction SilentlyContinue
        $docPath = Join-Path $env:USERPROFILE 'Documents\reorder_plan.xlsx'
        $notePath = Join-Path $env:USERPROFILE 'Desktop\reorder_transfer.csv'
        New-Item -ItemType Directory -Path (Split-Path $docPath) -Force | Out-Null
        New-Item -ItemType Directory -Path (Split-Path $notePath) -Force | Out-Null
        @(
          'Item,OnHand,ReorderPoint,Supplier,UnitCost'
          'Packing tape,22,40,Harbor Supply,3'
          'Shipping labels,160,200,LabelWorks,1'
          'Bubble wrap rolls,6,12,Harbor Supply,14'
          'Corrugated boxes M,95,150,BoxCo,2'
          'Corrugated boxes L,140,120,BoxCo,3'
          'Stretch film,9,10,Harbor Supply,22'
          'Void fill paper,30,75,WrapRight,5'
          'Thermal ribbons,12,10,LabelWorks,9'
          'Pallet wrap tool,2,4,Harbor Supply,35'
          'Edge protectors,48,100,BoxCo,1'
          'Fragile stickers,300,250,LabelWorks,1'
          'Mailer bags,75,200,WrapRight,2'
          'Box cutters,0,12,Harbor Supply,6'
          'Corrugated boxes S,210,180,BoxCo,1'
          'Label printer rolls,0,8,LabelWorks,12'
          'Strapping kits,5,6,Harbor Supply,28'
        ) | Set-Content -LiteralPath $notePath -Encoding UTF8
        $code = @'
        import os, subprocess, sys
        def _need(mod, pkg):
            try:
                return __import__(mod)
            except ImportError:
                subprocess.check_call([sys.executable, '-m', 'pip', 'install', pkg, '-q'])
                return __import__(mod)
        openpyxl = _need('openpyxl', 'openpyxl')
        path = os.path.join(os.environ['USERPROFILE'], 'Documents', 'reorder_plan.xlsx')
        os.makedirs(os.path.dirname(path), exist_ok=True)
        openpyxl.Workbook().save(path)
        print('INIT_OK', path)
        '@
        $code | py -3 -W ignore -
        if ($LASTEXITCODE -ne 0) { throw "Failed to create reorder_plan.xlsx" }
        if (-not (Test-Path -LiteralPath $docPath)) { throw "Missing initialized document: $docPath" }
        if (-not (Test-Path -LiteralPath $notePath)) { throw "Missing transferred file: $notePath" }
      timeout: 90
    - type: run_powershell
      script: |
        $ErrorActionPreference = 'Stop'
        $filePath = Join-Path $env:USERPROFILE 'Documents\reorder_plan.xlsx'
        if (-not (Test-Path -LiteralPath $filePath)) { throw "Missing document before launch: $filePath" }
        $candidates = @(
          'C:\Program Files\LibreOffice\program\scalc.exe',
          'C:\Program Files (x86)\LibreOffice\program\scalc.exe',
          'C:\Program Files\LibreOffice\program\soffice.exe',
          'C:\Program Files (x86)\LibreOffice\program\soffice.exe',
          'C:\Program Files\LibreOffice 26\program\scalc.exe',
          'C:\Program Files\LibreOffice 26\program\soffice.exe'
        )
        $officeExe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
        if (-not $officeExe) {
          $cmd = Get-Command scalc.exe -ErrorAction SilentlyContinue
          if ($cmd) { $officeExe = $cmd.Source }
        }
        if (-not $officeExe) { throw 'LibreOffice executable not found' }
        Start-Process -FilePath $officeExe -ArgumentList "`"$filePath`""
      timeout: 30
    - type: wait
      ms: 5000
evaluation:
  evaluator_id: evaluators.windows.powershell_check:PowerShellCheckEvaluator
  params:
    timeout: 90
    stdout_contains: EVAL_RESULT:PASS
    command: |
      @'
      import os, subprocess, sys
      def _need(mod, pkg):
          try:
              return __import__(mod)
          except ImportError:
              subprocess.check_call([sys.executable, '-m', 'pip', 'install', pkg, '-q'])
              return __import__(mod)
      def norm(value):
          if isinstance(value, str):
              text = value.strip()
              if text.startswith('='):
                  return '=' + text[1:].replace(' ', '').replace('$', '').replace("'", '').upper()
              return text
          if isinstance(value, bool) or value is None:
              return value
          number = float(value)
          return int(number) if number.is_integer() else round(number, 4)
      openpyxl = _need('openpyxl', 'openpyxl')
      path = os.path.join(os.environ['USERPROFILE'], 'Documents', 'reorder_plan.xlsx')
      wb = openpyxl.load_workbook(path, data_only=False)
      expected_sheets = [('Reorder', [['Item', 'OnHand', 'ReorderPoint', 'Supplier', 'UnitCost', 'Shortfall', 'OrderQty', 'LineCost', 'Priority'], ['Packing tape', 22, 40, 'Harbor Supply', 3, '=MAX(0,C2-B2)', '=ROUNDUP(F2/10,0)*10', '=G2*E2', '=IF(B2=0,"Critical",IF(F2>0,"Reorder","OK"))'], ['Shipping labels', 160, 200, 'LabelWorks', 1, '=MAX(0,C3-B3)', '=ROUNDUP(F3/10,0)*10', '=G3*E3', '=IF(B3=0,"Critical",IF(F3>0,"Reorder","OK"))'], ['Bubble wrap rolls', 6, 12, 'Harbor Supply', 14, '=MAX(0,C4-B4)', '=ROUNDUP(F4/10,0)*10', '=G4*E4', '=IF(B4=0,"Critical",IF(F4>0,"Reorder","OK"))'], ['Corrugated boxes M', 95, 150, 'BoxCo', 2, '=MAX(0,C5-B5)', '=ROUNDUP(F5/10,0)*10', '=G5*E5', '=IF(B5=0,"Critical",IF(F5>0,"Reorder","OK"))'], ['Corrugated boxes L', 140, 120, 'BoxCo', 3, '=MAX(0,C6-B6)', '=ROUNDUP(F6/10,0)*10', '=G6*E6', '=IF(B6=0,"Critical",IF(F6>0,"Reorder","OK"))'], ['Stretch film', 9, 10, 'Harbor Supply', 22, '=MAX(0,C7-B7)', '=ROUNDUP(F7/10,0)*10', '=G7*E7', '=IF(B7=0,"Critical",IF(F7>0,"Reorder","OK"))'], ['Void fill paper', 30, 75, 'WrapRight', 5, '=MAX(0,C8-B8)', '=ROUNDUP(F8/10,0)*10', '=G8*E8', '=IF(B8=0,"Critical",IF(F8>0,"Reorder","OK"))'], ['Thermal ribbons', 12, 10, 'LabelWorks', 9, '=MAX(0,C9-B9)', '=ROUNDUP(F9/10,0)*10', '=G9*E9', '=IF(B9=0,"Critical",IF(F9>0,"Reorder","OK"))'], ['Pallet wrap tool', 2, 4, 'Harbor Supply', 35, '=MAX(0,C10-B10)', '=ROUNDUP(F10/10,0)*10', '=G10*E10', '=IF(B10=0,"Critical",IF(F10>0,"Reorder","OK"))'], ['Edge protectors', 48, 100, 'BoxCo', 1, '=MAX(0,C11-B11)', '=ROUNDUP(F11/10,0)*10', '=G11*E11', '=IF(B11=0,"Critical",IF(F11>0,"Reorder","OK"))'], ['Fragile stickers', 300, 250, 'LabelWorks', 1, '=MAX(0,C12-B12)', '=ROUNDUP(F12/10,0)*10', '=G12*E12', '=IF(B12=0,"Critical",IF(F12>0,"Reorder","OK"))'], ['Mailer bags', 75, 200, 'WrapRight', 2, '=MAX(0,C13-B13)', '=ROUNDUP(F13/10,0)*10', '=G13*E13', '=IF(B13=0,"Critical",IF(F13>0,"Reorder","OK"))'], ['Box cutters', 0, 12, 'Harbor Supply', 6, '=MAX(0,C14-B14)', '=ROUNDUP(F14/10,0)*10', '=G14*E14', '=IF(B14=0,"Critical",IF(F14>0,"Reorder","OK"))'], ['Corrugated boxes S', 210, 180, 'BoxCo', 1, '=MAX(0,C15-B15)', '=ROUNDUP(F15/10,0)*10', '=G15*E15', '=IF(B15=0,"Critical",IF(F15>0,"Reorder","OK"))'], ['Label printer rolls', 0, 8, 'LabelWorks', 12, '=MAX(0,C16-B16)', '=ROUNDUP(F16/10,0)*10', '=G16*E16', '=IF(B16=0,"Critical",IF(F16>0,"Reorder","OK"))'], ['Strapping kits', 5, 6, 'Harbor Supply', 28, '=MAX(0,C17-B17)', '=ROUNDUP(F17/10,0)*10', '=G17*E17', '=IF(B17=0,"Critical",IF(F17>0,"Reorder","OK"))'], ['Total', None, None, None, None, None, '=SUM(G2:G17)', '=SUM(H2:H17)', None]]), ('BySupplier', [['Supplier', 'Lines', 'Units', 'Cost', 'Critical'], ['BoxCo', '=COUNTIFS(Reorder!D2:D17,A2,Reorder!G2:G17,">0")', '=SUMIF(Reorder!D2:D17,A2,Reorder!G2:G17)', '=SUMIF(Reorder!D2:D17,A2,Reorder!H2:H17)', '=COUNTIFS(Reorder!D2:D17,A2,Reorder!I2:I17,"Critical")'], ['Harbor Supply', '=COUNTIFS(Reorder!D2:D17,A3,Reorder!G2:G17,">0")', '=SUMIF(Reorder!D2:D17,A3,Reorder!G2:G17)', '=SUMIF(Reorder!D2:D17,A3,Reorder!H2:H17)', '=COUNTIFS(Reorder!D2:D17,A3,Reorder!I2:I17,"Critical")'], ['LabelWorks', '=COUNTIFS(Reorder!D2:D17,A4,Reorder!G2:G17,">0")', '=SUMIF(Reorder!D2:D17,A4,Reorder!G2:G17)', '=SUMIF(Reorder!D2:D17,A4,Reorder!H2:H17)', '=COUNTIFS(Reorder!D2:D17,A4,Reorder!I2:I17,"Critical")'], ['WrapRight', '=COUNTIFS(Reorder!D2:D17,A5,Reorder!G2:G17,">0")', '=SUMIF(Reorder!D2:D17,A5,Reorder!G2:G17)', '=SUMIF(Reorder!D2:D17,A5,Reorder!H2:H17)', '=COUNTIFS(Reorder!D2:D17,A5,Reorder!I2:I17,"Critical")'], ['Total', '=SUM(B2:B5)', '=SUM(C2:C5)', '=SUM(D2:D5)', '=SUM(E2:E5)']]), ('Summary', [['Metric', 'Value'], ['Items to reorder', '=COUNTIF(Reorder!G2:G17,">0")'], ['Critical items', '=COUNTIF(Reorder!I2:I17,"Critical")'], ['Total order cost', '=Reorder!H18'], ['Largest supplier', '=INDEX(BySupplier!A2:A5,MATCH(MAX(BySupplier!D2:D5),BySupplier!D2:D5,0))'], ['Largest supplier cost', '=MAX(BySupplier!D2:D5)']])]
      names = wb.sheetnames
      if names[:len(expected_sheets)] != [name for name, _ in expected_sheets]:
          print('SHEET_NAMES_MISMATCH:' + repr(names))
          raise SystemExit(1)
      width = 9
      for name, rows in expected_sheets:
          ws = wb[name]
          for r in range(1, len(rows) + 2):
              expected = [norm(v) for v in rows[r - 1]] if r <= len(rows) else [None] * width
              expected += [None] * (width - len(expected))
              observed = [norm(ws.cell(row=r, column=c).value) for c in range(1, width + 1)]
              observed = [None if v == '' else v for v in observed]
              if observed != expected:
                  print('ROW_MISMATCH:%s:%d:%r' % (name, r, observed))
                  raise SystemExit(1)
      def fail(message):
          print(message)
          raise SystemExit(1)
      def norm_csv(value):
          text = (value or '').strip()
          try:
              number = float(text)
          except ValueError:
              return text
          return int(number) if number.is_integer() else round(number, 2)
      import csv
      csv_path = os.path.join(os.environ['USERPROFILE'], 'Documents', 'supplier_po.csv')
      if not os.path.exists(csv_path):
          fail('MISSING_CSV')
      def trim(row):
          row = [norm_csv(v) for v in row]
          while row and row[-1] == '':
              row.pop()
          return row
      with open(csv_path, newline='', encoding='utf-8-sig') as handle:
          observed_csv = [trim(row) for row in csv.reader(handle) if any(v.strip() for v in row)]
      expected_csv = [trim(row) for row in [['Supplier', 'Lines', 'Units', 'Cost', 'Critical'], ['BoxCo', '2', '120', '180', '0'], ['Harbor Supply', '6', '80', '1170', '1'], ['LabelWorks', '2', '50', '160', '1'], ['WrapRight', '2', '180', '510', '0'], ['Total', '12', '430', '2020', '2']]]
      if observed_csv != expected_csv:
          fail('CSV_MISMATCH:%r' % (observed_csv,))
      print('EVAL_RESULT:PASS')
      '@ | py -3 -W ignore -
    supplemental_checks:
      powershell:
      - label: no_notepad_process
        script: |
          $p = Get-Process -Name notepad -ErrorAction SilentlyContinue
          if ($p) { Write-Output 'NOTEPAD_RUNNING'; exit 1 }
          Write-Output 'NO_NOTEPAD_PROCESS'
        stdout_contains: NO_NOTEPAD_PROCESS
        expected_exit_code: 0
        timeout: 10
limits:
  max_steps: 200
  step_timeout_seconds: 120
metadata:
  tags:
  - windows
  - cross_vm
  - libreoffice
  - calc
  - multi_sheet
  - csv_export
  - hard
  app_name: libreoffice-calc
  difficulty: hard
  description: Build a three-sheet Calc reorder plan with ROUNDUP quantities, nested IF priorities, COUNTIFS/SUMIF
    supplier rollups, an INDEX/MATCH summary, and a CSV export.
  cross_vm_role: windows_target_phase
  composite_task: cross_vm.android_to_windows.reorder_plan_hard
  source_platform: android
  target_platform: windows
  oracle_task: tasks/v1/cross_vm/stages/windows/oracle/cross_vm_calc_reorder_plan_hard_oracle.yaml
  human_steps: 136
  human_steps_breakdown:
  - 'open transferred CSV, copy rows, paste into workbook: 10'
  - 'rename first sheet, insert and name two more sheets: 10'
  - 'Reorder headers F1:I1: 8'
  - 'Reorder formulas F:I (type + fill down each): 20'
  - 'Reorder total row: 6'
  - 'BySupplier headers and supplier names: 18'
  - 'BySupplier formulas B:E (type + fill down each): 20'
  - 'BySupplier total row: 10'
  - 'Summary labels and formulas: 22'
  - 'Save in xlsx (keep-format prompt): 4'
  - 'Export BySupplier as CSV (sheet, Save As, type, name, options): 8'
