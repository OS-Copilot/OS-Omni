task_id: cross_vm.android_to_windows.conference_schedule_hard
platform: cross_vm
instruction: 'First work in the Android emulator: rebuild and save the conference schedule transfer CSV in Markor
  from the organizer''s schedule note, applying all of its changes. Then move to the Windows VM and use the transferred
  CSV to produce the three-room schedule document in LibreOffice Writer and export it as PDF.'
android_task: tasks/v1/cross_vm/stages/android/cross_vm_prepare_schedule_transfer_hard.yaml
windows_task: tasks/v1/cross_vm/stages/windows/cross_vm_writer_conference_schedule_hard.yaml
transfer:
  android_guest_path: /sdcard/Documents/markor/schedule_transfer.csv
  windows_guest_path: C:\Users\User\Desktop\schedule_transfer.csv
  host_filename: schedule_transfer.csv
metadata:
  tags:
  - cross_vm
  - android_to_windows
  - markor
  - libreoffice
  - writer
  - table
  - pdf
  - hard
  difficulty: hard
  source_platform: android
  target_platform: windows
  owner_scope: windows
  counts_as_windows_cross_vm_task: true
  cross_vm_task_unit: composite
  description: Apply four schedule changes to an 18-session Android note, transfer the CSV, and build a three-room
    Writer schedule with tables, a speaker index, derived totals, and a PDF export on Windows.
  oracle_task: tasks/v1/cross_vm/oracle/android_to_windows_conference_schedule_hard_oracle.yaml
  oracle_model: cross_vm_oracle_wait
  human_steps: 220
  human_steps_by_stage:
    android: 88
    windows: 132
