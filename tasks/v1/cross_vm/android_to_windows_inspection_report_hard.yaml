task_id: cross_vm.android_to_windows.inspection_report_hard
platform: cross_vm
instruction: 'First work in the Android emulator: rebuild and save the inspection transfer CSV in Markor from the
  inspector''s log, applying the re-test results. Then move to the Windows VM and use the transferred CSV to write
  the follow-up report in LibreOffice Writer and export it as PDF.'
android_task: tasks/v1/cross_vm/stages/android/cross_vm_prepare_inspection_transfer_hard.yaml
windows_task: tasks/v1/cross_vm/stages/windows/cross_vm_writer_inspection_report_hard.yaml
transfer:
  android_guest_path: /sdcard/Documents/markor/inspection_transfer.csv
  windows_guest_path: C:\Users\User\Desktop\inspection_transfer.csv
  host_filename: inspection_transfer.csv
metadata:
  tags:
  - cross_vm
  - android_to_windows
  - markor
  - libreoffice
  - writer
  - table
  - pdf
  - hard
  difficulty: hard
  source_platform: android
  target_platform: windows
  owner_scope: windows
  counts_as_windows_cross_vm_task: true
  cross_vm_task_unit: composite
  description: Rebuild a 24-finding inspection CSV with four re-tests on Android, transfer it, and write a Writer
    follow-up with a prioritized failure table, rollups, and a PDF export on Windows.
  oracle_task: tasks/v1/cross_vm/oracle/android_to_windows_inspection_report_hard_oracle.yaml
  oracle_model: cross_vm_oracle_wait
  human_steps: 210
  human_steps_by_stage:
    android: 102
    windows: 108
