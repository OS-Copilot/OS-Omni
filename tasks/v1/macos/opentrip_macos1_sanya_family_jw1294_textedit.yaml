    source_instruction_sha256: dd6d7f7ebc12aa7d8ae523a1d5efcc121183352ec7e4be3b0b25caabfe94b39c
    source_instruction: |-
      OpenTrip 已由初始化器在 macOS1 客体中打开，当前显示登录表单，Lucas Lin 账号信息已预填。仅使用 macOS1 客体内可见的 macOS GUI 完成以下工作流；不要操作宿主机上的 TextEdit 或宿主机文件系统，不要 Sign Out / 不要退出 Lucas Lin 账号。最后必须停留在 macOS1 客体内的 TextEdit，并将纯文本文件保存到 macOS1 客体的 Desktop，不能保存到宿主机。

      1. 点击登录表单的“Sign In”，以预填的 Lucas Lin 账号打开搜索主页。
      2. 点击搜索区上方的“Hotels”标签，显示酒店检索表单。
      3. 点击“Check-in”日期栏，展开“June 2026”入住日历。
      4. 点击日历中的日期“13”，将入住日期设为 2026-06-13。
      5. 点击“Check-out”日期栏，展开“June 2026”退房日历。
      6. 点击日历中的日期“16”，将退房日期设为 2026-06-16。
      7. 双击“Guests”输入框中的现有数字，将其完整选中。
      8. 在“Guests”输入框中按数字键 4。
      9. 点击酒店表单内的“Sort”下拉框。
      10. 点击“Top rated”，按评分排列四人酒店。
      11. 点击“Search Hotels”，生成三晚三亚酒店结果。
      12. 在酒店结果页向下滚动，直至“Sanya Cloud Terrace Boutique Stay”卡片完整显示。
      13. 点击该酒店卡片的“Details”，进入酒店详情页。
      14. 点击“Book”，进入酒店确认预订区域。
      15. 在酒店预订页向下滚动，完整显示房型、联系电话、支付方式与备注字段。
      16. 点击“Room”下拉框，展开可预订房型列表。
      17. 点击“Family Suite”，选择四人家庭套房。
      18. 双击“Contact phone”输入框中的现有号码，将其完整选中。
      19. 输入 `13900004301`。
      20. 点击“Payment”下拉框，展开支付方式列表。
      21. 点击“Bank Card · Credit or debit card”，选择银行卡支付。
      22. 点击“Note”输入框，将备注字段置于编辑状态。
      23. 输入 `Family support stay`。
      24. 点击“Confirm Booking”，提交三晚 Family Suite 酒店订单。
      25. 点击顶部“Search”导航项，回到综合行程搜索页。
      26. 点击去程航班的“Date”日期栏，打开“June 2026”月历。
      27. 点击日历中的日期“13”，将去程日期设为 2026-06-13。
      28. 点击“Cabin”下拉框，展开舱位列表。
      29. 点击“Business”，将去程舱位设为商务舱。
      30. 点击“Search Flights”，生成上海至三亚的去程航班结果。
      31. 向下滚动结果页，使“Jade Wings JW1294”卡片进入操作区域。
      32. 点击该航班卡片的“Details”，进入去程航班详情页。
      33. 继续向下滚动去程详情，使“Baggage”行李方案完整可见。
      34. 点击“Add 23kg checked bag”，为去程保留 23kg 额外托运行李。
      35. 向上滚动去程详情页，直到摘要区的“Book”链接可操作。
      36. 点击“Book”，进入去程航班确认预订区域。
      37. 点击“Traveler”下拉框，展开已保存旅客列表。
      38. 点击“Maya Chen · Passport”，选择旅客 Maya Chen。
      39. 双击“Contact phone”输入框中的现有号码，将其完整选中。
      40. 输入 `13900004302`。
      41. 点击“Payment”下拉框，展开支付方式列表。
      42. 点击“Bank Card · Credit or debit card”，选择银行卡支付。
      43. 点击“Confirm Booking”，提交 Jade Wings JW1294 去程航班订单。
      44. 点击顶栏“Search”，从订单流程返回行程搜索主页。
      45. 点击“From city”下拉框，展开出发城市列表。
      46. 点击“Sanya (SYX)”，将返程出发机场设为三亚凤凰。
      47. 点击“To city”下拉框，展开到达城市列表。
      48. 点击“Shanghai (SHA)”，将返程到达机场设为上海虹桥。
      49. 点击返程航班的“Date”栏，展开“June 2026”日期面板。
      50. 点击日历中的日期“16”，将返程日期设为 2026-06-16。
      51. 点击返程搜索表单的“Sort”下拉框。
      52. 点击“Lowest price”，按最低价格排列返程航班。
      53. 点击“Search Flights”，生成三亚至上海的返程航班结果。
      54. 在返程结果页向下滚动，使首张航班卡片完整进入窗口。
      55. 点击第一张返程航班卡片的“Details”，进入返程航班详情页。
      56. 继续滚动返程详情，完整显示“Baggage”方案。
      57. 点击“Add 15kg checked bag”，为返程保留 15kg 额外托运行李。
      58. 向上滚动至航班摘要区，使“Book”链接进入操作区域。
      59. 点击“Book”，进入返程航班确认预订区域。
      60. 双击“Contact phone”输入框中的现有号码，将其完整选中。
      61. 输入 `13900004303`。
      62. 点击“Payment”下拉框，展开支付方式列表。
      63. 点击“WeChat Pay · Scan or authorize payment”，选择微信支付。
      64. 点击“Confirm Booking”，提交三亚至上海的返程航班订单。
      65. 点击启动台，打开应用搜索。
      66. 在搜索框中输入 `TextEdit`。
      67. 按 Return，打开文本编辑。
      68. 按 Command+N，新建空白文稿。
      69. 按 Command+Shift+T，将文稿转换为纯文本。
      70. 输入 `DATES=JUN13-16`。
      71. 按 Return，在文稿中另起一行。
      72. 输入 `HOTEL=FAMILY CARD`。
      73. 按 Return，在文稿中另起一行。
      74. 输入 `OUT=JW1294 RET15`。
      75. 按 Command+S，打开首次保存面板。
      76. 在“Save As”字段输入 `Sanya-Jun13.txt`。
      77. 点击保存面板的展开按钮，显示位置侧栏。
      78. 点击左侧的“Desktop”，将桌面设为保存位置。
      79. 点击“Save”，保存家庭联程记录。
