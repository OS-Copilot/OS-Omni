    source_instruction: |
      从 macOS1 对应的新鲜 clone 中已登录的 DeltaChat 基准账户开始；Documents 中已由基线提供 Round1_Ops.txt 和 Round2_Design.txt。不要 Sign Out / 不要退出登录。
