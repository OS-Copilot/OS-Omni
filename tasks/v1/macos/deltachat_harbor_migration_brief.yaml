      1. 点击右下角圆形“+”按钮。
      2. 点击创建菜单中的“New Group”。
      3. 输入 `Harbor Control`，作为迁移指挥群名。
      4. 点击“Create Group”。
      5. 在 Harbor Control 底部的“Write a message”输入框输入 `Freeze at 08:30`，记录迁移冻结时间。
      6. 点击 Harbor Control 消息栏右侧的纸飞机按钮。
      7. 点击当前迁移指挥会话底部的输入框。
      8. 输入 `Owner is Riley`，记录迁移负责人。
      9. 点击当前迁移指挥会话右下角的发送按钮。
      10. 点击 Harbor Control 底部的消息输入框。
      11. 输入 `Database copy first`，确定数据库复制顺序。
      12. 点击 Harbor Control 消息栏右侧的纸飞机按钮。
      13. 点击 Harbor Control 底部的消息输入框。
      14. 输入 `API switch second`，确定接口切换顺序。
      15. 点击当前迁移指挥会话右下角的纸飞机图标。
      16. 在“Freeze at 08:30”消息气泡上右键单击。
