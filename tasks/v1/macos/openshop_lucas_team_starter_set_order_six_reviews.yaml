platform: macos
instruction: |-
  Place an order in the OpenShop application as Lucas Lin (password spring2026) containing four items, each with a quantity of one: the "Polar Day Slim Business Backpack" in the 16-inch specification, the "Verdant Pro Noise-Canceling Headphones" in the Rose Gold specification, the "Blue Tin Small Batch Trail Mix Pouch" in the 4 Pack specification, and the "Mountain Isle Pour-Over Coffee 20 Pack" in the 10 sachets specification. The checkout for this order must use the "Office" delivery address and "Cash on Delivery" as the payment method, with "Team starter set" entered in the Order Note field.

  Submit a review for each of the four items in the newly placed order. The review for the Polar Day Slim Business Backpack must have a rating of 5 out of 5 and the text "Spacious work bag". The review for the Verdant Pro Noise-Canceling Headphones must have a rating of 4 out of 5 and the text "Warm clear sound". The review for the Blue Tin Small Batch Trail Mix Pouch must have a rating of 5 out of 5 and the text "Fresh desk snack". The review for the Mountain Isle Pour-Over Coffee 20 Pack must have a rating of 4 out of 5 and the text "Quick morning cup".

  Submit a review for the Verdant Pro Noise-Canceling Headphones within the historical order with ID TBH-LUCAS-20260518-001, assigning a rating of 5 out of 5 and the text "Trusted headphones". Submit a review for the Polar Day Slim Business Backpack within the historical order with ID TBH-LUCAS-20260321-004, assigning a rating of 4 out of 5 and the text "Solid travel carry". The session must remain logged in as Lucas Lin, the cart must be empty, and all specified reviews must be saved to their respective orders.
