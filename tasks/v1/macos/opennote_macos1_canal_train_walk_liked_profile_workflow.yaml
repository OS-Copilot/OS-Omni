    source_instruction: |-
      使用可见的 macOS GUI 完成以下 OpenNote 工作流。任务开始时，VM 必须已处于 `macOS1` 对应的初始状态，OpenNote 登录页已预填 Lina Park 账号，Travel 信息流中已有帖子“What changed after I tried train day trip”，Recommended 信息流中已有帖子“A small note on coastal coffee stop and ticket screenshot”，且这些来源帖尚未具有本任务要求的 Lina Park 点赞、收藏和评论状态。不要 Sign Out / 不要退出登录。完成后停留在 Lina Park 个人主页的“Liked”列表，使“Canal Train Walk”处于可见区域，不要再次打开帖子详情。

      1. 点击预填 Lina Park 账号下方的“Log In”，进入 OpenNote。
      2. 点击左侧的“Explore”，打开信息流。
      3. 点击顶部分类栏中的“Travel”，切换到旅行分类。
      4. 向下滚动 Travel 信息流，直到“What changed after I tried train day trip”进入可操作区域。
      5. 点击“What changed after I tried train day trip”，打开帖子详情。
      6. 点击“Like”，为火车旅行来源帖点赞。
      7. 点击“Save”，将火车旅行来源帖加入 Saved。
      8. 点击“Add a thought or question”评论输入框。
      9. 输入 `Train route noted`。
      10. 点击“Send”，提交对火车旅行来源帖的评论。
      11. 点击帖子作者名称，进入火车旅行来源帖作者的个人主页。
      12. 点击“Follow”，关注该作者。
      13. 点击左侧的“My Profile”，进入 Lina Park 的个人主页。
      14. 点击“Edit Profile”，打开个人资料编辑表单。
      15. 点击“Role”项内的现有职业文字。
      16. 按 Command+A 选中现有 Role 内容。
      17. 输入 `rail photo planner`。
      18. 点击“Bio”项内的现有简介文字。
      19. 按 Command+A 选中现有 Bio 内容。
      20. 输入 `Film walks by train`。
      21. 点击“Save Profile”，保存新的 Role 和 Bio。
      22. 点击左侧的“Explore”，返回推荐信息流。
      23. 点击顶部分类栏中的“Recommended”，切换到推荐分类。
      24. 向下滚动 Recommended 信息流，直到“A small note on coastal coffee stop and ticket screenshot”进入可操作区域。
      25. 点击“A small note on coastal coffee stop and ticket screenshot”，打开帖子详情。
      26. 点击“Like”，为咖啡停靠来源帖点赞。
      27. 点击“Save”，将咖啡停靠来源帖加入 Saved。
      28. 点击“Add a thought or question”评论输入框。
      29. 输入 `Cafe stop mapped`。
      30. 点击“Send”，提交对咖啡停靠来源帖的评论。
      31. 点击帖子详情右上角的“×”，收起咖啡停靠来源帖详情。
      32. 点击左侧的“Post”，打开 New Note 表单。
      33. 点击“Title”输入框。
      34. 输入 `Canal Train Walk`。
      35. 点击“Body”输入框。
      36. 输入 `Meet at East Station`。
      37. 点击“Category”下拉框。
      38. 选择“Travel”。
      39. 点击“Location”输入框。
      40. 输入 `East Station`。
      41. 点击“Tags”输入框。
      42. 输入 `train,canal`。
      43. 点击“Use text cover”复选框。
      44. 向下滚动 New Note 表单，使“Publish”按钮进入可操作区域。
      45. 点击“Publish”，创建 Canal Train Walk 帖子。
      46. 点击左侧的“My Profile”，进入 Lina Park 的个人主页。
      47. 点击个人主页的“Posts”标签，打开本人帖子列表。
      48. 向下滚动 Posts 列表，直到“Canal Train Walk”进入可操作区域。
      49. 点击“Canal Train Walk”，打开刚创建的帖子详情。
      50. 点击“Like”，为 Canal Train Walk 点赞。
      51. 点击“Save”，将 Canal Train Walk 加入 Saved。
      52. 点击“Add a thought or question”评论输入框。
      53. 输入 `Walk plan ready`。
      54. 点击“Send”，提交对 Canal Train Walk 的评论。
      55. 点击帖子详情右上角的“×”，收起 Canal Train Walk 详情。
      56. 点击个人主页的“Saved”标签，打开收藏列表。
      57. 向下滚动 Saved 列表，直到“What changed after I tried train day trip”进入可操作区域。
      58. 点击“What changed after I tried train day trip”，从 Saved 列表打开来源帖。
      59. 点击帖子详情右上角的“关闭”按钮，返回 Saved 列表。
      60. 点击个人主页的“Liked”标签，打开点赞列表。
      61. 向下滚动 Liked 列表，直到“Canal Train Walk”进入可操作区域。
      62. 点击“Canal Train Walk”，从 Liked 列表打开本人帖子。
      63. 点击帖子详情右上角的“关闭”按钮，返回 Liked 列表。
      64. 点击个人主页的“Posts”标签，返回本人帖子列表。
      65. 向下滚动 Posts 列表，直到“Canal Train Walk”进入可操作区域。
      66. 点击“Canal Train Walk”，再次打开本人帖子详情。
      67. 点击帖子详情右上角的“关闭”按钮，返回 Posts 列表。
      68. 点击个人主页的“Liked”标签，打开点赞列表。
      69. 向下滚动 Liked 列表，使“Canal Train Walk”进入可见区域，并停留在该 Liked 列表；不要再次打开帖子详情。
