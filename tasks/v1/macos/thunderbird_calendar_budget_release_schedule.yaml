task_id: macos.thunderbird.calendar.budget_release_schedule
platform: macos
instruction: Create five calendar entries in the Thunderbird Calendar, consisting of four single events
  and one recurring series, and ensure the calendar is displayed in the Month view upon completion. The
  single event titled `Budget Approval` must be set for `7/14/26` from `9:00 AM` to `9:30 AM` with the
  location `Finance Room`, the category `Finance`, a reminder set to `30 minutes before`, and the description
  `Approve Q3 budget`. The single event titled `Budget Prep` must be set for `7/14/26` from `10:00 AM`
  to `10:30 AM` with the category `Work` and a reminder set to `15 minutes before`. The single event titled
  `Release Brief` must be set for `7/15/26` from `1:00 PM` to `1:30 PM` with the category `Work` and a
  reminder set to `15 minutes before`. The single event titled `Budget Signoff` must be set for `7/14/26`
  from `2:00 PM` to `2:45 PM` with the location `Board Room`, the category `Finance`, and a reminder set
  to `30 minutes before`. The recurring event series titled `Release Sync` must be set for `7/15/26` from
  `11:00 AM` to `11:45 AM` with the location `Launch Room`, the category `Work`, a recurrence set to `Weekly`,
  a reminder set to `30 minutes before`, and the description `Track launch risks`. The `Release Sync`
  series must ultimately reflect a location of `Launch Center` and a reminder set to `15 minutes before`
  for all occurrences. The final state of the calendar must contain exactly one instance of each of the
  five titles, with the `Release Sync` series fully updated, and the Thunderbird Calendar must be displayed
  in the Month view.
