    source_instruction: |
      使用可见的 macOS GUI 完成以下 Finder 与 OpenNote 工作流。任务开始时，VM 必须已处于 `macOS1` 对应的初始状态：桌面已有资料文件“Harbor-Coffee-Plan.txt”，OpenNote 登录页已预填 Lina Park 账号，Explore 信息流中已有帖子“A small note on coastal coffee stop and ticket screenshot”，且三个目标帖子尚不存在。不要 Sign Out / 不要退出登录。完成后停留在 Lina Park 的“My Profile”页面内“Saved”标签所显示的收藏列表。

      1. 点击 Dock 中的“Finder”图标。
      2. 点击 Finder 侧边栏中的“Desktop”。
      3. 双击桌面上的“Harbor-Coffee-Plan.txt”。
      4. 向下滚动文稿，查看“说明帖”和“清单帖”两部分内容。
      5. 点击 Dock 中的“OpenNote”图标。
      6. 点击“Log In”，进入 Explore 页面。
      7. 点击左侧的“Explore”。
      8. 点击顶部分类栏中的“Food”，输入“coffee”。
      9. 向下滚动 Food 信息流，直到“A small note on coastal coffee stop and ticket screenshot”进入可操作区域。
      10. 点击“A small note on coastal coffee stop and ticket screenshot”。
      11. 向下滚动帖子详情，使评论输入框和“Send”按钮进入可操作区域。
      12. 点击评论输入框。
      13. 输入 `Keep ticket offline.`。
      14. 点击“Send”，提交资料中固定问题的回答。
      15. 向上滚动帖子详情，使“Save”按钮进入可操作区域。
      16. 点击“Save”，将咖啡路线来源帖加入 Saved。
      17. 点击帖子详情右上角的“关闭”按钮，关闭帖子详情。
      18. 点击左侧的“Post”，打开 New Note 表单。
      19. 点击咖啡说明表单的“Title”输入框。
      20. 输入 `Harbor Coffee Meetup`。
      21. 点击咖啡说明表单的“Body”输入框。
      22. 输入 `Meet at Pier Cafe at 09:30 for a quiet tasting table.`。
      23. 点击咖啡说明表单的“Category”下拉框。
      24. 选择“Food”。
      25. 点击咖啡说明表单的“Location”输入框。
      26. 输入 `Pier Cafe`。
      27. 点击“Tags”输入框。
      28. 输入 `harbor,quiet`。
      29. 点击“Use text cover”复选框。
      30. 向下滚动 New Note 表单，使“Publish”按钮进入可操作区域。
      31. 点击“Publish”，创建咖啡活动说明帖。
      32. 点击 Dock 中的“Finder”图标。
      33. 点击 Finder 侧边栏中的“Desktop”。
      34. 双击桌面上的“Harbor-Coffee-Plan.txt”。
      35. 向下滚动到“清单帖标题”和“清单帖正文”。
      36. 点击 Dock 中的“OpenNote”图标。
      37. 点击左侧的“Post”，再次打开 New Note 表单。
      38. 点击随身清单表单的“Title”输入框。
      39. 输入 `Coffee Meetup Checklist`。
      40. 点击随身清单表单的“Body”输入框。
      41. 输入 `Bring a cup, tasting card, and transit ticket screenshot.`。
      42. 点击随身清单表单的“Category”下拉框。
      43. 选择“Food”。
      44. 点击随身清单表单的“Location”输入框。
      45. 输入 `Pier Cafe`。
      46. 点击“Tags”输入框。
      47. 输入 `harbor,quiet`。
      48. 点击“Use text cover”复选框。
      49. 向下滚动 New Note 表单，使“Publish”按钮进入可操作区域。
      50. 点击“Publish”，创建同一活动的随身清单帖。
      51. 点击 Dock 中的“Finder”图标。
      52. 点击 Finder 侧边栏中的“Desktop”。
      53. 双击桌面上的“Harbor-Coffee-Plan.txt”。
      54. 向下滚动到“提示帖标题”和“提示帖正文”。
      55. 点击 Dock 中的“OpenNote”图标。
      56. 点击左侧的“Post”，再次打开 New Note 表单。
      57. 点击咖啡入场提示表单的“Title”输入框。
      58. 输入 `Coffee Meetup Access`。
      59. 点击咖啡入场提示表单的“Body”输入框。
      60. 输入 `Use pier entrance. Quiet table is beside the window.`。
      61. 点击咖啡入场提示表单的“Category”下拉框。
      62. 选择“Food”。
      63. 点击咖啡入场提示表单的“Location”输入框。
      64. 输入 `Pier Cafe`。
      65. 点击“Tags”输入框。
      66. 输入 `harbor,quiet`。
      67. 点击“Use text cover”复选框。
      68. 向下滚动 New Note 表单，使“Publish”按钮进入可操作区域。
      69. 点击“Publish”，创建同一活动的入场提示帖。
      70. 点击左侧的“My Profile”。
      71. 点击“Saved”标签，停留在包含咖啡路线来源帖的收藏列表。
