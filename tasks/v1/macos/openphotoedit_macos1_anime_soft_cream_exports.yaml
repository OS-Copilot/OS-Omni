    source_instruction: '请只使用可见的 macOS 图形界面完成 OpenPhotoEdit 工作流。OpenPhotoEdit 已由初始化器启动并置于前台；从应用首页开始。使用原生打开与保存面板操作
      Desktop/PhotoFixtures 中的指定图片。为同一动漫角色制作两张用途不同的视觉稿：第一张控制白底高光并增强蓝紫服装细节，作为清晰角色卡；第二张降低饱和度并加入暖奶油质感，作为柔和宣传海报。完成两个导出后，最终停留在
      OpenPhotoEdit 编辑器页面，不要退出 OpenPhotoEdit。


      1. 点击首页的“Import Photo”。

      2. 点击原生打开面板左侧的“Desktop”。

      3. 双击文件列表中的“PhotoFixtures”文件夹。

      4. 点击右上角带 RGB 校准块的“Anime-Portrait.jpg”文件。

      5. 点击原生打开面板右下角的“Open”。

      6. 点击“Filters”分类标签。

      7. 点击“Portrait”滤镜预设。

      8. 将“Portrait Amount”滑块拖到 13。

      9. 点击“Edit”分类标签。

      10. 点击“Exposure”工具图标。

      11. 将 Exposure 滑块拖到 -7。

      12. 点击“Contrast”工具图标。

      13. 将 Contrast 滑块拖到 +12。

      14. 点击“Saturation”工具图标。

      15. 将 Saturation 滑块拖到 +4。

      16. 点击“Temperature”工具图标。

      17. 将 Temperature 滑块拖到 +3。

      18. 点击“Sharpen”工具图标。

      19. 将 Sharpen 滑块拖到 +8。

      20. 点击“Structure”工具图标。

      21. 将 Structure 滑块拖到 +5。

      22. 点击“Fade”工具图标。

      23. 将 Fade 滑块拖到 +3。

      24. 点击“HSL”分类标签。

      25. 点击“Blue”色彩通道。

      26. 将 Blue 通道滑块拖到 +5。

      27. 点击“Purple”色彩通道。

      28. 将 Purple 通道滑块拖到 +4。

      29. 点击“Red”色彩通道。

      30. 将 Red 通道滑块拖到 +3。

      31. 点击右上角“Export”图标，打开原生保存面板。

      32. 选择原生保存面板中的“Save As”文件名字段。

      33. 按 Command+A 全选原文件名。

      34. 输入 `anime-soft.png`。

      35. 点击保存面板中的“Save”，把清晰角色卡保存到 PhotoFixtures。

      36. 点击编辑器左上角的“Back”按钮，回到首页。

      37. 点击首页的“Import Photo”。

      38. 点击原生打开面板左侧的“Desktop”。

      39. 双击文件列表中的“PhotoFixtures”文件夹。

      40. 点击右上角带 RGB 校准块的“Anime-Portrait-Mirror.jpg”文件。

      41. 点击原生打开面板右下角的“Open”。

      42. 点击“Filters”分类标签。

      43. 点击“Cream”滤镜预设。

      44. 将“Cream Amount”滑块拖到 16。

      45. 点击“Edit”分类标签。

      46. 点击“Exposure”工具图标。

      47. 将 Exposure 滑块拖到 -6。

      48. 点击“Contrast”工具图标。

      49. 将 Contrast 滑块拖到 +10。

      50. 点击“Saturation”工具图标。

      51. 将 Saturation 滑块拖到 -7。

      52. 点击“Temperature”工具图标。

      53. 将 Temperature 滑块拖到 +7。

      54. 点击“Fade”工具图标。

      55. 将 Fade 滑块拖到 +6。

      56. 点击“Vignette”工具图标。

      57. 将 Vignette 滑块拖到 +9。

      58. 点击“Grain”工具图标。

      59. 将 Grain 滑块拖到 +3。

      60. 点击“Sharpen”工具图标。

      61. 将 Sharpen 滑块拖到 +6。

      62. 点击“HSL”分类标签。

      63. 点击“Blue”色彩通道。

      64. 将 Blue 通道滑块拖到 -6。

      65. 点击“Purple”色彩通道。

      66. 将 Purple 通道滑块拖到 -4。

      67. 点击“Yellow”色彩通道。

      68. 将 Yellow 通道滑块拖到 +3。

      69. 点击“Magenta”色彩通道。

      70. 将 Magenta 通道滑块拖到 +4。

      71. 点击右上角“Export”图标，打开原生保存面板。

      72. 选择原生保存面板中的“Save As”文件名字段。

      73. 按 Command+A 全选原文件名。

      74. 输入 `anime-cream.png`。

      75. 点击保存面板中的“Save”，把暖奶油宣传海报保存到 PhotoFixtures，并停留在 OpenPhotoEdit 编辑器页面。'
