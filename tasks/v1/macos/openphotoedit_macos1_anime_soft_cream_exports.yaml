task_id: macos.openphotoedit.macos1_anime_soft_cream_exports
platform: macos
instruction: 'In OpenPhotoEdit, create exact no-edit PNG exports from the specified source images. Select
  each source by its filename, preserve its appearance and orientation, and save the PNG into ~/Desktop/PhotoFixtures.


  Open Anime-Portrait.jpg in OpenPhotoEdit and export the image as a PNG named anime-soft.png in PhotoFixtures,
  without applying edits.

  Open Anime-Portrait-Mirror.jpg in OpenPhotoEdit and export the image as a PNG named anime-cream.png
  in PhotoFixtures, without applying edits.


  Leave OpenPhotoEdit open on the editor page for the second source.'
init:
  initializer_id: evaluators.cua_review.initializers.macos.openphotoedit:OpenPhotoEditInitializer
  params:
    app_name: OpenPhotoEdit
    bundle_id: com.killt.openphotoedit
    fixture_dir: ~/Desktop/PhotoFixtures
    fixture_version: rgb-calibration-v3-author-rebuilt
    manifest_name: CalibrationManifest.json
    expected_files:
    - Anime-Portrait.jpg
    - Anime-Portrait-Mirror.jpg
    expected_exports:
    - anime-soft.png
    - anime-cream.png
    final_wait_seconds: 1.5
evaluation:
  evaluator_id: evaluators.macos.openphotoedit_macos1_anime_soft_cream_exports:OpenPhotoEditAnimeSoftCreamEvaluator
  params:
    profile_id: openphotoedit-export-only-v1
    fixture_dir: ~/Desktop/PhotoFixtures
    expected_width: 2512
    expected_height: 832
    expected_filenames:
    - anime-soft.png
    - anime-cream.png
    expected_sha256: {}
    reference_images:
      anime-soft.png:
        name: Anime-Portrait.reference.png
        expected_sha256: 5114fef59c648071f0b8beda8be203b874e2960e77c1e44fc585e60438bfaef0
      anime-cream.png:
        name: Anime-Portrait-Mirror.reference.png
        expected_sha256: a6371fd3601e0a6f530ac701f88f56f8a2a34310aac4549c43d9dbf82eef2b42
    marker_mae_tolerance: 3.0
    marker_peak_tolerance: 12.0
    image_mae_tolerance: 3.0
    median_tolerance: 3.0
limits:
  max_steps: 300
  step_timeout_seconds: 180
