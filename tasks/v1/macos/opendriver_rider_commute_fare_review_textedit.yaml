    source_instruction: |-
      1. 点击 Email 输入框。
      2. 输入 `rider@example.com`。
      3. 点击 Password 输入框。
      4. 输入 `Password123!`。
      5. 点击“Login”，进入 Riley Rider 的乘客页面。
      6. 点击顶部“Ride”页签。
      7. 点击目的地列表中的 Downtown Palo Alto, CA。
      8. 点击“Choose a ride”。
      9. 向下滚动到车型列表。
      10. 点击“RideX”车型行。
      11. 点击“Payment method”下拉框。
      12. 点击“Visa ending in 4242”。
      13. 点击 Promo code 输入框。
      14. 输入 `COMMUTE15`。
      15. 点击优惠码右侧的勾选按钮。
      16. 点击“Choose RideX”，提交通勤叫车请求。
      17. 点击顶部“Active”页签。
      18. 点击当前行程卡片中的路线区域。
      19. 点击顶部“History”页签。
      20. 向下滚动到 Receipt 中的 Payment 和 Total 区域。
      21. 向上滚动到已完成的通勤行程卡片。
      22. 点击顶部“Safety”页签。
      23. 点击“Ticket category”下拉框。
      24. 点击“payment issue”。
      25. 选择当前工单的“Message”文本框。
      26. 按 Command+A 清空原消息。
      27. 输入 `Fare needs review`。
      28. 点击“Create support ticket”。
      29. 点击新建的“payment issue - Open”工单右侧回复箭头。
      30. 选择“Ticket open”弹窗中的“Reply”文本框。
      31. 按 Command+A 清空 Reply 文本框。
      32. 输入 `Please review fare`。
      33. 点击“Send reply”，提交车费说明。
      34. 点击工单弹窗中的 Close。
      35. 点击顶部“Account”页签。
      36. 点击 Riley Rider 姓名右侧的铅笔图标。
      37. 选择 Edit profile 窗口中的 Name 输入框。
      38. 按 Command+A 清空现有姓名。
      39. 输入 `Riley Commute`。
      40. 选择 Phone 输入框。
      41. 按 Command+A 清空现有手机号。
      42. 输入 `6505550194`。
      43. 点击“Save”，保存通勤联系资料。
      44. 点击 Wallet 区域标题。
      45. 点击 Mastercard ending in 9001 行右侧的星形图标。
      46. 点击 Coupons 区域标题。
      47. 点击 WELCOME20 优惠券右侧的复制图标。
      48. 点击 Saved places 区域标题。
      49. 点击 Home — Downtown Palo Alto 保存地点行。
      50. 点击顶部“History”页签。
      51. 向下滚动到该通勤 Receipt 的 Payment 区域。
      52. 点击顶部“Safety”页签。
      53. 点击“Ticket category”下拉框。
      54. 点击“payment issue”。
      55. 选择新工单的“Message”文本框。
      56. 按 Command+A 清空原消息。
      57. 输入 `Receipt total check`。
      58. 点击“Create support ticket”，提交收据复核工单。
      59. 点击新建工单右侧的回复箭头图标。
      60. 选择“Ticket open”弹窗中的“Reply”文本框。
      61. 按 Command+A 清空回复文本框。
      62. 输入 `Commute receipt sent`。
      63. 点击“Send reply”，提交收据补充说明。
      64. 点击工单弹窗中的 Close。
      65. 点击启动台，打开搜索框。
      66. 在搜索框中输入 `TextEdit`。
      67. 按 Return，打开文本编辑。
      68. 按 Command+N，新建空白文稿。
      69. 按 Command+Shift+T，将文稿转换为纯文本。
      70. 输入 `ROUTE=DOWNTOWN`。
      71. 按 Return 另起一行并输入 `RIDE=RIDEX`。
      72. 按 Return 另起一行并输入 `TICKET=FARE OPEN`。
      73. 按 Command+S 打开首次保存面板，并在“Save As”字段输入 `Commute-Fare.txt`。
      74. 点击保存面板的展开按钮显示位置侧栏，再点击左侧的“Desktop”将桌面设为保存位置。
      75. 点击“Save”，保存通勤车费复核记录；最终保持 TextEdit 在前台，不要返回 OpenDriver，也不要退出登录。
