    source_instruction: |
      macOS1 必须已处于对应的初始状态，OpenTwitter 显示登录页，账号 Alex Chen 可使用用户名 alex 和密码 chirp2026 登录；四个指定源帖、既有会话和未读通知由该快照提供，任务目标状态尚未完成。不要 Sign Out，不要退出登录。完成后停留在 Home 首页，并让新帖“Launch trail closed”及其已收藏状态保留为最终页面证据。

      1. 点击登录页的“Email or username”输入框。
      2. 输入 `alex`。
      3. 点击“Password”输入框。
      4. 输入 `chirp2026`。
      5. 点击蓝色“Sign in”按钮，进入 Alex Chen 的首页。
      6. 点击左侧导航栏的“Explore”，进入搜索页面。
      7. 点击页面右上角的“Search OpenTwitter”搜索输入框。
      8. 输入 `accessibility audit`。
      9. 按 Return，提交搜索并显示匹配帖子。
      10. 点击 Maya Patel 的“accessibility audit template”帖子回复按钮。
      11. 点击展开的回复输入框。
      12. 输入 `Audit notes added`。
      13. 点击回复区右侧的提交按钮，发布回复。
      14. 点击该帖子的点赞按钮，将它加入已赞内容。
      15. 双击搜索输入框中的原搜索词，将其完整选中。
      16. 输入 `post-incident note`。
      17. 按 Return，提交搜索并显示匹配帖子。
      18. 点击 Devon Brooks 的“Post-incident note”帖子收藏按钮。
      19. 点击该帖子的回复按钮。
      20. 点击展开的回复输入框。
      21. 输入 `Timeline linked`。
      22. 点击回复区右侧的提交按钮，发布回复。
      23. 双击搜索输入框中的原搜索词，将其完整选中。
      24. 输入 `release candidate`。
      25. 按 Return，提交搜索并显示匹配帖子。
      26. 点击 Elena Rossi 的“Mobile release candidate”帖子转发按钮。
      27. 点击该帖子的回复按钮。
      28. 点击展开的回复输入框。
      29. 输入 `RC owner confirmed`。
      30. 点击回复区右侧的提交按钮，发布回复。
      31. 双击搜索输入框中的原搜索词，将其完整选中。
      32. 输入 `security review`。
      33. 按 Return，提交搜索并显示匹配帖子。
      34. 点击 Priya Shah 的“Security review reminder”帖子收藏按钮。
      35. 点击该帖子的点赞按钮。
      36. 点击左侧导航栏的“Home”，返回首页。
      37. 点击首页顶部的“What is happening?”发帖文本框。
      38. 输入 `Launch review ready`。
      39. 点击编辑区右下角的“Post”，发布项目状态。
      40. 点击左侧导航栏的“Messages”，进入私信页面。
      41. 点击会话列表中的“Maya Patel”会话卡片。
      42. 点击会话底部的“Message Maya Patel”输入框。
      43. 输入 `Audit reply posted`。
      44. 点击会话底部右侧的“Send”，发送私信。
      45. 点击会话列表中的“Devon Brooks”会话卡片。
      46. 点击会话底部的“Message Devon Brooks”输入框。
      47. 输入 `Timeline saved`。
      48. 点击会话底部右侧的“Send”，发送私信。
      49. 点击左侧导航栏的“Profile”，进入 Alex Chen 个人页。
      50. 点击个人资料区域的“Edit profile”。
      51. 双击“Bio”输入框中的原简介，将其完整选中。
      52. 输入 `Launch notes owner`。
      53. 点击资料编辑区的“Save”，保存新简介。
      54. 点击左侧导航栏的“Notifications”，进入通知页面。
      55. 点击通知顶部的“Mark all as read”，将通知标记为已读。
      56. 点击左侧导航栏的“Messages”，返回私信页面。
      57. 点击会话列表中的“Hana Kim”会话卡片。
      58. 点击会话底部的“Message Hana Kim”输入框。
      59. 输入 `RC repost complete`。
      60. 点击会话底部右侧的“Send”，发送私信。
      61. 点击左侧导航栏的“Messages”，返回私信页面。
      62. 点击会话列表中的“Priya Shah”会话卡片。
      63. 点击会话底部的“Message Priya Shah”输入框。
      64. 输入 `Checks saved`。
      65. 点击会话底部右侧的“Send”，发送私信。
      66. 点击左侧导航栏的“Home”，返回首页。
      67. 点击首页顶部的“What is happening?”发帖文本框。
      68. 输入 `Launch trail closed`。
      69. 点击编辑区右下角的“Post”，发布最终状态。
      70. 点击该新帖操作行中的收藏按钮，将最终状态加入书签，并停留在显示该帖的 Home 首页。
