platform: macos
instruction: |-
  Log in to OpenTwitter as Alex Chen using the username alex and the password chirp2026, and keep the session active without signing out.

  The Explore search area must yield four distinct result sets for the queries "accessibility audit", "post-incident note", "release candidate", and "security review". Within the "accessibility audit" results, Maya Patel's post containing "accessibility audit template" must be liked and replied to with the exact text "Audit notes added". Within the "post-incident note" results, Devon Brooks's post containing "Post-incident note" must be bookmarked and replied to with the exact text "Timeline linked". Within the "release candidate" results, Elena Rossi's post containing "Mobile release candidate" must be reposted and replied to with the exact text "RC owner confirmed". Within the "security review" results, Priya Shah's post containing "Security review reminder" must be both bookmarked and liked.

  The Home feed must contain two newly published status posts with the exact texts "Launch review ready" and "Launch trail closed". The final status post, "Launch trail closed", must be bookmarked. The Messages section must contain four sent direct messages: "Audit reply posted" to Maya Patel, "Timeline saved" to Devon Brooks, "RC repost complete" to Hana Kim, and "Checks saved" to Priya Shah. The Profile page Bio field must contain exactly "Launch notes owner". All notifications must be marked as read. The task is complete when the Home feed is visible and displays the newly posted and bookmarked "Launch trail closed" status.
