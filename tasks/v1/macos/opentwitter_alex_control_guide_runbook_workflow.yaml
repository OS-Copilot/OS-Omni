instruction: |-
  Sign in to OpenTwitter as Alex Chen using the username alex and the password chirp2026, maintaining the signed-in state throughout the task without signing out.

  Four specific posts must be modified based on their content and authors. Mateo Rivera’s post containing the phrase compact controls must receive a reply reading exactly Focus states clear and a like. Iris Walker’s post containing the phrase expected final state must be bookmarked and reposted. Alex Chen’s post containing the phrase Support macro pass must be liked. Devon Brooks’s post titled Runbooks age quietly, which contains the phrase review date, must receive a reply reading exactly Review date added.

  The Home feed must contain three newly published posts with the exact texts Control guide ready, Control trail closed, and Runbook labels set. The post Control trail closed must be liked and bookmarked, and the post Runbook labels set must be bookmarked.

  The Messages section must contain four direct messages: one to Mateo Rivera reading exactly Focus notes posted, one to Oscar Liu reading exactly Final state saved, one to Devon Brooks reading exactly Runbook date fixed, and a second to Oscar Liu reading exactly Warning saved.

  The Profile page must reflect an edited bio containing the exact text Interaction lead, replacing the existing bio. The Notifications section must have all notifications marked as read.

  At completion, the OpenTwitter Home page must be visible in the foreground, showing the newly published post Runbook labels set with its bookmarked state retained as the final page evidence.
