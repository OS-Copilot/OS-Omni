platform: macos
instruction: |-
  Produce two edited PNG exports in the macOS OpenPhotoEdit application, which is already open and in the foreground.

  The first export, named "anime-clean.png", is derived from the file "Anime-Floral-Composite.jpg" located in the Desktop/PhotoFixtures directory. This image must have the "Clean" filter preset applied with the "Clean Amount" set to 12. Within the "Edit" category, the "Exposure" must be -9, "Brightness" -5, "Contrast" +20, "Saturation" +6, "Structure" +15, "Sharpen" +11, and "Vignette" +7. Within the "HSL" category, the "Blue" channel must be -8, "Cyan" -10, "Magenta" +5, and "Yellow" -4. The resulting file must be saved as a PNG in the PhotoFixtures directory.

  The second export, named "floral-cool.png", is derived from the file "Blue-Floral-Rotated.jpg" located in the Desktop/PhotoFixtures directory. Within the "HSL" category, the "Cyan" channel must be +10, "Blue" +12, and "Purple" +7. Within the "Edit" category, the "Exposure" must be -10, "Brightness" -7, "Contrast" +18, "Saturation" -10, "Temperature" -14, "Structure" +13, and "Sharpen" +8. Within the "Landscape" category, the "Cool Tone" must be +15 and "HDR" +8. The resulting file must be saved as a PNG in the PhotoFixtures directory.

  At completion, the application must remain open and the view must be positioned on the OpenPhotoEdit editor page for the second image (Blue-Floral-Rotated.jpg). Do not sign out or exit the application.
