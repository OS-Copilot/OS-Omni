    source_instruction: '请只使用可见的 macOS 图形界面完成 OpenPhotoEdit 工作流。OpenPhotoEdit 已由初始化器启动并置于前台；从应用首页开始。macOS1
      快照中的原生打开面板会保留 Desktop/PhotoFixtures 作为当前文件列表。先把动漫花卉合成图制作为层次清晰的版本，再把旋转花卉底图制作为低饱和冷色版本。完成两个导出后，最终停留在第二张图的
      OpenPhotoEdit 编辑器页面。不要 Sign Out / 不要退出登录，不要退出 OpenPhotoEdit。


      1. 点击首页的“Import Photo”。

      2. 在当前已打开的 PhotoFixtures 文件列表中，点击右上角带 RGB 校准块的“Anime-Floral-Composite.jpg”文件。

      3. 点击原生打开面板右下角的“Open”。

      4. 点击“Filters”分类标签。

      5. 点击“Clean”滤镜预设。

      6. 将“Clean Amount”滑块拖到 12。

      7. 点击“Edit”分类标签。

      8. 点击“Exposure”工具图标。

      9. 将 Exposure 滑块拖到 -9。

      10. 点击“Brightness”工具图标。

      11. 将 Brightness 滑块拖到 -5。

      12. 点击“Contrast”工具图标。

      13. 将 Contrast 滑块拖到 +20。

      14. 点击“Saturation”工具图标。

      15. 将 Saturation 滑块拖到 +6。

      16. 点击“Structure”工具图标。

      17. 将 Structure 滑块拖到 +15。

      18. 点击“Sharpen”工具图标。

      19. 将 Sharpen 滑块拖到 +11。

      20. 点击“Vignette”工具图标。

      21. 将 Vignette 滑块拖到 +7。

      22. 点击“HSL”分类标签。

      23. 点击“Blue”色彩通道。

      24. 将 Blue 通道滑块拖到 -8。

      25. 点击“Cyan”色彩通道。

      26. 将 Cyan 通道滑块拖到 -10。

      27. 点击“Magenta”色彩通道。

      28. 将 Magenta 通道滑块拖到 +5。

      29. 点击“Yellow”色彩通道。

      30. 将 Yellow 通道滑块拖到 -4。

      31. 点击右上角“Export”图标，打开原生保存面板。

      32. 选择原生保存面板中的“Save As”文件名字段。

      33. 按 Command+A 全选原文件名。

      34. 输入 `anime-clean.png`。

      35. 点击保存面板中的“Save”，把层次清晰的合成图保存到 PhotoFixtures。

      36. 点击编辑器左上角的“Back”按钮，回到首页。

      37. 点击首页的“Import Photo”。

      38. 在当前已打开的 PhotoFixtures 文件列表中，点击右上角带 RGB 校准块的“Blue-Floral-Rotated.jpg”文件。

      39. 点击原生打开面板右下角的“Open”。

      40. 点击“HSL”分类标签。

      41. 点击“Cyan”色彩通道。

      42. 将 Cyan 通道滑块拖到 +10。

      43. 点击“Blue”色彩通道。

      44. 将 Blue 通道滑块拖到 +12。

      45. 点击“Purple”色彩通道。

      46. 将 Purple 通道滑块拖到 +7。

      47. 点击“Edit”分类标签。

      48. 点击“Exposure”工具图标。

      49. 将 Exposure 滑块拖到 -10。

      50. 点击“Brightness”工具图标。

      51. 将 Brightness 滑块拖到 -7。

      52. 点击“Contrast”工具图标。

      53. 将 Contrast 滑块拖到 +18。

      54. 点击“Saturation”工具图标。

      55. 将 Saturation 滑块拖到 -10。

      56. 点击“Temperature”工具图标。

      57. 将 Temperature 滑块拖到 -14。

      58. 点击“Structure”工具图标。

      59. 将 Structure 滑块拖到 +13。

      60. 点击“Sharpen”工具图标。

      61. 将 Sharpen 滑块拖到 +8。

      62. 点击“Landscape”分类标签。

      63. 点击“Cool Tone”工具图标。

      64. 将 Cool Tone 滑块拖到 +15。

      65. 点击“HDR”工具图标。

      66. 将 HDR 滑块拖到 +8。

      67. 点击右上角“Export”图标，打开原生保存面板。

      68. 选择原生保存面板中的“Save As”文件名字段。

      69. 按 Command+A 全选原文件名。

      70. 输入 `floral-cool.png`。

      71. 点击保存面板中的“Save”，把低饱和冷色底图保存到 PhotoFixtures，并停留在第二张图的 OpenPhotoEdit 编辑器页面。'
