task_id: macos.blender.prepare_social_render
platform: macos
instruction: 'Blender has prepared `/Users/bench/Downloads/helloworld_blender_workspace/blender_social_render/product_stage.blend`
  for this run.


  Restage the prepared product scene into a polished social-preview composition.
  Apply this exact setup, then save the `.blend` file:


  1. Render settings:
     - render engine: **Cycles**
     - output resolution: **1800 x 1000**
     - resolution percentage: **100**
     - FPS: **30**
     - frame range: start **24**, end **240**
     - output path: `//renders/social_preview_final.png`
     - image format: **PNG**
     - color mode: **RGBA**
     - **Transparent** film enabled

  2. Camera and light:
     - move **Camera** to X **7.4**, Y **-7.2**, Z **5.8**
     - rotate Camera to X **62**, Y **0**, Z **46** degrees
     - move **FillLight** to X **1.8**, Y **-3.2**, Z **6.5**
     - rotate FillLight to X **48**, Y **0**, Z **28** degrees
     - scale FillLight to X **1.2**, Y **1.2**, Z **1.2**

  3. Product objects:
     - move **FeatureCube** to X **0.8**, Y **-0.6**, Z **1.25**
     - rotate FeatureCube to X **8**, Y **0**, Z **22** degrees
     - scale FeatureCube to X **1.15**, Y **0.9**, Z **1.35**
     - set FeatureCube diffuse color to RGBA **0.92, 0.34, 0.18, 1.0**
     - move **AccentCylinder** to X **-1.6**, Y **1.2**, Z **1.35**
     - rotate AccentCylinder to X **6**, Y **0**, Z **-18** degrees
     - scale AccentCylinder to X **0.7**, Y **0.7**, Z **1.45**
     - set AccentCylinder diffuse color to RGBA **0.10, 0.42, 0.82, 1.0**
     - move **HeroSphere** to X **2.6**, Y **1.9**, Z **1.15**
     - rotate HeroSphere to X **12**, Y **0**, Z **35** degrees
     - scale HeroSphere to X **1.05**, Y **0.95**, Z **1.1**
     - set HeroSphere diffuse color to RGBA **0.15, 0.78, 0.62, 1.0**
     - move **BackdropPlane** to X **0.2**, Y **0.1**, Z **-0.05**
     - rotate BackdropPlane to X **2**, Y **-1**, Z **6** degrees
     - scale BackdropPlane to X **6.2**, Y **4.8**, Z **1.0**
     - set BackdropPlane diffuse color to RGBA **0.08, 0.08, 0.10, 1.0**

  4. Add two helper objects:
     - add a plane named **CaptionBar** at X **1.4**, Y **-2.4**, Z **0.04**,
       rotation **0, 0, 9** degrees, scale **2.2, 0.22, 1.0**, color
       **0.96, 0.96, 0.18, 1.0**
     - add a UV sphere named **HeroPin** at X **2.15**, Y **0.15**, Z **0.62**,
       rotation **4, 0, -18** degrees, scale **0.18, 0.18, 0.18**, color
       **1.00, 0.20, 0.45, 1.0**


  Stop as soon as the file is saved.

  '
init:
  initializer_id: initializers.macos.blender:BlenderInitializer
  params:
    app_command: blender
    workspace_name: blender_social_render
    scene_name: product_stage.blend
    scene_template: product_stage
    launch_gui: false
evaluation:
  evaluator_id: evaluators.macos.blender:BlenderSceneEvaluator
  params:
    blend_path: /Users/bench/Downloads/helloworld_blender_workspace/blender_social_render/product_stage.blend
    app_command: blender
    render:
      engine: CYCLES
      resolution_x: 1800
      resolution_y: 1000
      resolution_percentage: 100
      fps: 30
      frame_start: 24
      frame_end: 240
      filepath: //renders/social_preview_final.png
      file_format: PNG
      color_mode: RGBA
      film_transparent: true
    objects:
    - name: Camera
      location: [7.4, -7.2, 5.8]
      rotation_degrees: [62.0, 0.0, 46.0]
    - name: FillLight
      location: [1.8, -3.2, 6.5]
      rotation_degrees: [48.0, 0.0, 28.0]
      scale: [1.2, 1.2, 1.2]
    - name: FeatureCube
      location: [0.8, -0.6, 1.25]
      rotation_degrees: [8.0, 0.0, 22.0]
      scale: [1.15, 0.9, 1.35]
      material_diffuse_color: [0.92, 0.34, 0.18, 1.0]
    - name: AccentCylinder
      location: [-1.6, 1.2, 1.35]
      rotation_degrees: [6.0, 0.0, -18.0]
      scale: [0.7, 0.7, 1.45]
      material_diffuse_color: [0.1, 0.42, 0.82, 1.0]
    - name: HeroSphere
      location: [2.6, 1.9, 1.15]
      rotation_degrees: [12.0, 0.0, 35.0]
      scale: [1.05, 0.95, 1.1]
      material_diffuse_color: [0.15, 0.78, 0.62, 1.0]
    - name: BackdropPlane
      location: [0.2, 0.1, -0.05]
      rotation_degrees: [2.0, -1.0, 6.0]
      scale: [6.2, 4.8, 1.0]
      material_diffuse_color: [0.08, 0.08, 0.1, 1.0]
    - name: CaptionBar
      type: MESH
      location: [1.4, -2.4, 0.04]
      rotation_degrees: [0.0, 0.0, 9.0]
      scale: [2.2, 0.22, 1.0]
      material_diffuse_color: [0.96, 0.96, 0.18, 1.0]
    - name: HeroPin
      type: MESH
      location: [2.15, 0.15, 0.62]
      rotation_degrees: [4.0, 0.0, -18.0]
      scale: [0.18, 0.18, 0.18]
      material_diffuse_color: [1.0, 0.2, 0.45, 1.0]
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  difficulty: hard
