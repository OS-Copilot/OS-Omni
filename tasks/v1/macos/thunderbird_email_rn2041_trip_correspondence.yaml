task_id: macos.thunderbird.email.rn2041_trip_correspondence
platform: macos
instruction: 'In the Thunderbird account for Anonym Tester, process the trip correspondence in the Inbox
  by sending two replies, forwarding two emails, sending two new emails, and saving one draft. The Sent
  folder must contain exactly one reply to the email with the subject "Schedule change for trip RN-2041"
  with the body text exactly "change receivd", one forwarded copy of the email with the subject "Receipt
  for ticket RN-2041" sent to itinerary@airvale.example.test with the body text "Trip receipt review",
  one new email to reservations@hoteljuniper.example.test with the subject "Arrival Update" and the body
  text "Train arrives late" referencing the source email with the subject "Reservation confirmation for
  March 12-14", one reply to the email with the subject "Travel document reminder" with the body text
  exactly "Documents ready", one forwarded copy of the email with the subject "Before your stay: parking
  and breakfast" sent to itinerary@airvale.example.test with the body text "Add to trip plan", and one
  new email to operations@railway-ne.example with the subject "RN-2041 Summary" and the body text "Route
  notes ready". The Drafts folder must contain exactly one unsent draft addressed to operations@railway-ne.example
  with the subject "Platform Notes" and the body text "Image reviewed Route confirmed", which is derived
  from the email with the subject "Platform reference image for RN-2041".'
