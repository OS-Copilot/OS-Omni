    source_instruction: |
      1. 点击左侧“Anonym Tester”账户的展开箭头显示邮件文件夹。
      2. 点击该账户下显示164封邮件的“Inbox”打开历史邮件。
      3. 点击“Quick Filter”打开当前文件夹筛选栏。
      4. 在筛选框输入 `Schedule change` 定位RN-2041行程变更邮件。
      5. 点击“Schedule change for trip RN-2041”邮件行读取行程变更。
      6. 点击邮件阅读区的“Reply”打开行程回复窗口。
      7. 在回复正文编辑器输入 `change receivd`。
      8. 点击发送按钮向Railway Northeast发送行程确认回复。
      9. 点击已发送文件夹打开已发送邮件列表。
      10. 点击“Re: Schedule change for trip RN-2041”邮件行读取回复结果。
      11. 点击“Inbox”返回164封历史邮件列表。
      12. 在筛选框输入 `Receipt for ticket` 定位RN-2041车票收据。
      13. 点击“Receipt for ticket RN-2041”邮件行读取车票收据。
      14. 点击邮件阅读区的“Forward”打开车票转发窗口。
      15. 在“To”框输入 `itinerary@airvale.example.test`。
      16. 点击键盘的“Enter”键确认Airvale行程地址。
      17. 在转发正文编辑器输入 `Trip receipt review`。
      18. 点击发送按钮将RN-2041收据转发给Airvale Airlines。
      19. 点击已发送文件夹打开已发送邮件列表。
      20. 点击“Fwd: Receipt for ticket RN-2041”邮件行读取转发结果。
      21. 点击“Inbox”返回164封历史邮件列表。
      22. 在筛选框输入 `March 12-14` 定位酒店确认邮件。
      23. 点击“Reservation confirmation for March 12-14”邮件行读取入住信息。
      24. 点击“New Message”打开酒店到达更新撰写窗口。
      25. 在“To”框输入 `reservations@hoteljuniper.example.test`。
      26. 点击键盘的“Enter”键确认Hotel Juniper地址。
      27. 在“Subject”框输入 `Arrival Update`。
      28. 在正文编辑器输入 `Train arrives late`。
      29. 点击撰写窗口右上角的发送控件向Hotel Juniper发送到达更新。
      30. 点击左侧纸飞机图标的已发送文件夹打开已发送邮件列表。
      31. 点击“Arrival Update”邮件行读取酒店更新结果。
      32. 点击左侧“Anonym Tester”账户下显示164封邮件的“Inbox”返回历史邮件列表。
      33. 在筛选框输入 `Platform reference` 定位RN-2041站台图片邮件。
      34. 点击“Platform reference image for RN-2041”邮件行读取站台资料。
      35. 点击“New Message”打开站台资料草稿窗口。
      36. 在“To”框输入 `operations@railway-ne.example`。
      37. 点击键盘的“Enter”键确认Railway Northeast Desk地址。
      38. 在“Subject”框输入 `Platform Notes`。
      39. 在正文编辑器输入 `Image reviewed`。
      40. 点击“Save”保存站台资料草稿。
      41. 关闭“Platform Notes”撰写窗口。
      42. 点击“Drafts”文件夹打开草稿列表。
      43. 点击“Platform Notes”草稿行打开草稿阅读视图。
      44. 点击阅读区的“Edit”重新打开草稿编辑器。
      45. 在正文末尾输入 ` Route confirmed` 补充路线结论。
      46. 点击“Save”保存更新后的站台资料草稿。
      47. 关闭“Platform Notes”撰写窗口。
      48. 点击左侧“Inbox”返回164封历史邮件列表。
      49. 在筛选框输入 `Travel document` 定位Airvale出行提醒。
      50. 点击“Travel document reminder”邮件行读取证件提醒。
      51. 点击邮件阅读区的“Reply”打开证件提醒回复窗口。
      52. 在回复正文编辑器输入 `Documents ready`。
      53. 点击撰写窗口右上角的发送控件向Airvale Airlines发送证件确认回复。
      54. 点击左侧纸飞机图标的已发送文件夹打开已发送邮件列表。
      55. 点击“Re: Travel document reminder”邮件行读取证件回复结果。
      56. 点击左侧显示164封邮件的“Inbox”返回历史邮件列表。
      57. 在筛选框输入 `breakfast` 定位酒店行前邮件。
      58. 点击“Before your stay: parking and breakfast”邮件行读取行前说明。
      59. 点击邮件阅读区的“Forward”打开酒店说明转发窗口。
      60. 在“To”框输入 `itinerary@airvale.example.test`。
      61. 点击键盘的“Enter”键确认Airvale行程地址。
      62. 在转发正文编辑器输入 `Add to trip plan`。
      63. 点击发送按钮将酒店行前说明转发给Airvale Airlines。
      64. 点击已发送文件夹打开最终已发送邮件列表。
      65. 点击“Fwd: Before your stay: parking and breakfast”邮件行读取最终转发结果。
      66. 点击“Drafts”文件夹打开最终草稿列表。
      67. 点击“Platform Notes”草稿行保留站台资料草稿作为最终证据。
      68. 点击工具栏的“New Message”，打开新邮件窗口。
      69. 在“To”框输入 `operations@railway-ne.example`。
      70. 按 Enter 确认“To”框中的收件地址。
      71. 在“Subject”框输入 `RN-2041 Summary`。
      72. 在正文编辑器输入 `Route notes ready`。
      73. 点击撰写窗口右上角的发送控件，发送行程汇总邮件。
