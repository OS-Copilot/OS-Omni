instruction: |-
  Log in to OpenTwitter as Alex Chen using the username alex and the password chirp2026, and remain signed in throughout the task without signing out.

  The four searched-post interaction chains must be completed as follows: locate the post by Priya Shah titled "Security review reminder" by searching for security review, reply to that post with the exact text Owner checks added, and bookmark the post; locate the post by Elena Rossi titled "Mobile release candidate" by searching for release candidate, like that post, and repost it; locate the post by Hana Kim titled "Assistant rollout plan" by searching for assistant rollout, reply to that post with the exact text Fallback copy set, and bookmark the post; and locate the post by Ben Carter titled "Regression checklist" by searching for Regression checklist, like that post, and reply to it with the exact text Empty states tested.

  The two status posts must be published on the Home feed: the first with the exact text Security gate ready, and the final post with the exact text Security closed, which must be bookmarked.

  The four direct messages must be sent from Messages: to Priya Shah with the exact text Checks are tracked, to Hana Kim with the exact text Fallback approved, to Rachel Stone with the exact text Release check saved, and to Ben Carter with the exact text Regression logged.

  Alex Chen's profile bio must be edited to replace the existing bio with the exact text Security review lead and saved. All notifications must be marked as read.

  At completion, the application must be left on the Home page with the Security closed post visible as the final page evidence.
