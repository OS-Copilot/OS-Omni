instruction: |-
  Sign in to the OpenShop app as Lucas Lin using the phone number 13800138000 and the password spring2026, and remain logged in for the rest of the session.

  Create two new orders and one historical order review with the following specifications. The first order must contain the Verdant Pro Noise-Canceling Headphones in the Navy $299 specification and the Blue Tin Small Batch Trail Mix Pouch in the Family Pack $50.16 specification, with the delivery address set to Office, the payment method set to WeChat Pay, and the Order Note text Client room setup. Within this order, the Verdant Pro Noise-Canceling Headphones item must have a 5 / 5 rating and the review text Focused audio, and the Blue Tin Small Batch Trail Mix Pouch item must have a 4 / 5 rating and the review text Meeting snack. The second order must contain the Mountain Isle Pour-Over Coffee 20 Pack in the 40 sachets $143.55 specification and the Polar Day Slim Business Backpack in the 15.6-inch $182.85 specification, with the delivery address set to Office, the payment method set to Cash on Delivery, and the Order Note text Hybrid work kit. Within this order, the Mountain Isle Pour-Over Coffee 20 Pack item must have a 5 / 5 rating and the review text Smooth office brew, and the Polar Day Slim Business Backpack item must have a 4 / 5 rating and the review text Reliable commute. Additionally, the Mountain Isle Pour-Over Coffee 20 Pack item in the historical order TBH-LUCAS-20260429-002 must have a 5 / 5 rating and the review text Daily coffee pick.

  At completion, the cart should be empty, the two new orders should exist with the specified items, totals, addresses, payment methods, notes, and reviews, and the historical order’s coffee item should have the specified rating and review.
