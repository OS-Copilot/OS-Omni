task_id: macos.oracle.actual_budget.create_emergency_fund_account
platform: macos
instruction: |-
  Oracle sanity task for macos.actual_budget.create_emergency_fund_account. Wait briefly and finish.
init:
  initializer_id: initializers.macos.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: "pkill -x Actual >/dev/null 2>&1 || true\nmkdir -p \"$HOME/Documents/Actual\"\nmkdir -p \"$HOME/Library/Application Support/Actual\"\n"
    - type: wait
      ms: 300
evaluation:
  evaluator_id: evaluators.macos.actual_budget:ActualBudgetEvaluator
  params:
    mode: full_setup
    accounts:
    - name: Main Checking
      opening_balance: 4200
    - name: Emergency Fund
      opening_balance: 8000
    categories:
    - name: Home Repair Buffer
    - name: Medical Buffer
    - name: Insurance Deductible
    payees:
    - name: Roof Crew
    - name: City Clinic
    - name: SafeAuto
    budgets:
    - category: Home Repair Buffer
      amount: 450
    - category: Medical Buffer
      amount: 325
    - category: Insurance Deductible
      amount: 275
    transactions:
    - account: Main Checking
      payee: Roof Crew
      category: Home Repair Buffer
      amount: 180
    - account: Emergency Fund
      payee: City Clinic
      category: Medical Buffer
      amount: 95
    - account: Emergency Fund
      payee: SafeAuto
      category: Insurance Deductible
      amount: 120
    transfers:
    - from_account: Main Checking
      to_account: Emergency Fund
      amount: 600
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  oracle_for: macos.actual_budget.create_emergency_fund_account
  human_steps: 20
  tags:
    - oracle
  difficulty: hard
