task_id: macos.actual_budget.create_emergency_fund_account
platform: macos
instruction: |
  Open Actual Budget and build a small emergency reserve budget.

  If no local budget is open yet, create one in the default location. Then set up this exact state:

  1. Create two local accounts in this order:
     - "Main Checking" with an opening balance of $4,200
     - "Emergency Fund" with an opening balance of $8,000
  2. Create these budget categories with these amounts:
     - Home Repair Buffer: $450
     - Medical Buffer: $325
     - Insurance Deductible: $275
  3. Add these three spending transactions:
     - In Main Checking, a payment of $180 to "Roof Crew" in Home Repair Buffer
     - In Emergency Fund, a payment of $95 to "City Clinic" in Medical Buffer
     - In Emergency Fund, a payment of $120 to "SafeAuto" in Insurance Deductible
  4. Record a transfer of $600 from Main Checking to Emergency Fund.

  Finish only after the accounts, categories, spending transactions, and transfer are all saved.
init:
  initializer_id: initializers.macos.actual_budget:ActualBudgetInitializer
  params:
    wait_ms: 2500
evaluation:
  evaluator_id: evaluators.macos.actual_budget:ActualBudgetEvaluator
  params:
    mode: full_setup
    accounts:
    - name: Main Checking
      opening_balance: 4200
    - name: Emergency Fund
      opening_balance: 8000
    categories:
    - name: Home Repair Buffer
    - name: Medical Buffer
    - name: Insurance Deductible
    payees:
    - name: Roof Crew
    - name: City Clinic
    - name: SafeAuto
    budgets:
    - category: Home Repair Buffer
      amount: 450
    - category: Medical Buffer
      amount: 325
    - category: Insurance Deductible
      amount: 275
    transactions:
    - account: Main Checking
      payee: Roof Crew
      category: Home Repair Buffer
      amount: 180
    - account: Emergency Fund
      payee: City Clinic
      category: Medical Buffer
      amount: 95
    - account: Emergency Fund
      payee: SafeAuto
      category: Insurance Deductible
      amount: 120
    transfers:
    - from_account: Main Checking
      to_account: Emergency Fund
      amount: 600
limits:
  max_steps: 300
  step_timeout_seconds: 180
metadata:
  difficulty: hard
