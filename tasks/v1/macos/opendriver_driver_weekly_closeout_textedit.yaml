instruction: |-
  Sign in to the OpenDriver application using the Driver role with the email driver@example.com and the password Password123! to enter the Maya Rodriguez driver workspace, where a new request generated from the Work area must be accepted and confirmed as active in the trip panel. The Money area must contain two separate payout requests: one with an amount of 120.00 and a note of Weekly payout, and a second with an amount of 45.00 and a note of Trip reserve. The Account area must reflect an updated driver onboarding profile with the License number set to NY-DL-100492, the Vehicle make set to Tesla, the Vehicle model set to Model Y, the Plate set to 8XJR214, and the Color set to Pearl White, saved for review, alongside a submitted Insurance document with the Document ID INS-2026-2048 and an Expires at date of 2027-12-31. The Support area must contain two distinct support tickets, the first containing the message Payout status help. and the second containing the message Document status. A new plain-text document in TextEdit must contain exactly the following three lines in this order:
  ROLE=DRIVER
  PAYOUTS=165.00
  DOC=INS-2026-2048
  This file must be saved to the Desktop with the filename Driver-Week.txt, with TextEdit remaining the foreground application and the driver session still active in OpenDriver at completion.
