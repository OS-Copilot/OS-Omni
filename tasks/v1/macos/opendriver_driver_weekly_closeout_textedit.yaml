    source_instruction: |-
      1. 点击登录表单顶部的“Driver”角色页签。
      2. 点击“Email”输入框。
      3. 输入 `driver@example.com`。
      4. 点击“Driver”登录表单中的 Password 输入框。
      5. 输入 `Password123!`。
      6. 点击蓝色“Login”按钮，进入 Maya Rodriguez 司机工作区。
      7. 点击司机导航栏中的“Work”页签。
      8. 点击“Generate request now”，生成一条可接请求。
      9. 点击请求卡片中的“Accept trip”。
      10. 点击“Open trip”，打开当前行程面板。
      11. 点击司机导航栏中的“Money”页签。
      12. 向下滚动到页面底部的 Payouts 区域。
      13. 选择 Payouts 区域中的 Amount 输入框。
      14. 按 Command+A 清空 Amount 输入框。
      15. 输入 `120.00`。
      16. 选择 Payouts 区域中的 Note 输入框。
      17. 按 Command+A 清空 Note 输入框。
      18. 输入 `Weekly payout`。
      19. 点击“Request payout”，提交本次提现申请。
      20. 点击司机导航栏中的“Account”页签。
      21. 选择“Driver”onboarding 区域的 License number 输入框。
      22. 按 Command+A 清空 License number 输入框。
      23. 输入 `NY-DL-100492`。
      24. 选择 Vehicle make 输入框。
      25. 按 Command+A 清空 Vehicle make 输入框。
      26. 输入 `Tesla`。
      27. 选择 Vehicle model 输入框。
      28. 按 Command+A 清空 Vehicle model 输入框。
      29. 输入 `Model Y`。
      30. 选择 Plate 输入框。
      31. 按 Command+A 清空 Plate 输入框。
      32. 输入 `8XJR214`。
      33. 选择 Color 输入框。
      34. 按 Command+A 清空 Color 输入框。
      35. 输入 `Pearl White`。
      36. 点击“Save profile for review”，提交车辆资料。
      37. 向下滚动到“Driver”documents 区域。
      38. 点击“Driver”documents 区域的文档类型下拉框。
      39. 点击“Insurance”。
      40. 选择 Document ID 输入框。
      41. 按 Command+A 清空 Document ID 输入框。
      42. 输入 `INS-2026-2048`。
      43. 选择 Expires at 输入框。
      44. 按 Command+A 清空 Expires at 输入框。
      45. 输入 `2027-12-31`。
      46. 点击“Submit document”，提交保险文档。
      47. 点击司机导航栏中的“Support”页签。
      48. 选择当前工单表单的“Message”文本框。
      49. 按 Command+A 清空 Message 文本框。
      50. 输入 `Payout status help.`。
      51. 点击“Create support ticket”，提交运营支持工单。
      52. 再次点击司机导航栏中的“Support”页签。
      53. 选择第二张工单表单的“Message”文本框。
      54. 按 Command+A 清空原消息。
      55. 输入 `Document status`。
      56. 点击“Create support ticket”，提交第二张支持工单。
      57. 点击司机导航栏中的“Money”页签。
      58. 向下滚动到“Payouts”区域。
      59. 选择第二笔提现的 Amount 输入框。
      60. 按 Command+A 清空现有金额。
      61. 输入 `45.00`。
      62. 选择第二笔提现的 Note 输入框。
      63. 按 Command+A 清空现有备注。
      64. 输入 `Trip reserve`。
      65. 点击“Request payout”，提交第二笔提现申请。
      66. 按 Command+Space，打开 macOS 聚焦搜索框。
      67. 在聚焦搜索框中输入 `TextEdit`，然后按 Return 打开文本编辑。
      68. 按 Command+N，新建空白文稿。
      69. 按 Command+Shift+T，将文稿转换为纯文本。
      70. 输入 `ROLE=DRIVER`。
      71. 按 Return 另起一行并输入 `PAYOUTS=165.00`。
      72. 按 Return 另起一行并输入 `DOC=INS-2026-2048`。
      73. 按 Command+S，打开首次保存面板。
      74. 在“Save As”字段输入 `Driver-Week.txt`，再点击展开按钮显示位置侧栏。
      75. 点击左侧“Desktop”，再点击“Save”保存司机周结记录；最终保持 TextEdit 在前台，不要返回 OpenDriver，也不要退出登录。
