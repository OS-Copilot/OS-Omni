      14. 点击 “Choose Priority pickup”，提交优先接驾请求。
      15. 点击顶部 “Active” 页签。
      16. 点击当前行程卡片中的司机信息区域。
      17. 点击顶部 “Safety” 页签。
      18. 点击“Ticket category”下拉框。
      19. 点击 “lost item”。
      20. 选择当前工单的“Message”文本框。
      21. 按 Command+A 清空原消息。
      22. 输入 `Lost blue umbrella.`。
      23. 点击 “Create support ticket”。
      24. 向下滚动到新建的 “lost item” - Open 工单。
      25. 点击新建工单右侧的回复箭头图标。
      26. 选择“Ticket open”弹窗中的“Reply”文本框。
      27. 按 Command+A 清空 Reply 文本框。
      28. 输入 `Found it, thank you.`。
