      41. 点击 Notifications 区域标题。
      42. 点击 Refund progress 通知行。
      43. 点击 Saved places 区域标题。
      44. 点击 “Work” 保存地点行，返回目的地已填入 “Work” 地址的 “Ride” 页面。
      45. 点击顶部“Safety”页签。
      46. 点击“Ticket category”下拉框。
      47. 点击“lost item”。
      48. 选择当前工单的“Message”文本框。
      49. 按 Command+A 清空原消息。
