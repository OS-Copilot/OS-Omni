      30. 点击工单弹窗中的 Close。
      31. 点击顶部 “Account” 页签。
      32. 点击 Riley Rider 姓名右侧的铅笔图标。
      33. 选择 Phone 输入框。
      34. 按 Command+A 清空 Phone 输入框。
      35. 输入 `6505550172`。
      36. 点击“Save”，提交个人资料修改。
