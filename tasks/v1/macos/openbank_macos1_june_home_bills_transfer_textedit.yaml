      8. 单击“City Utilities”，选择城市公用事业账单。
      9. 单击城市账单的“From”下拉框。
      10. 单击“Rainy Day Savings ...9140”。
      11. 单击城市账单的“Amount”数字栏。
      12. 按 Command+A，全选现有金额。
      13. 在当前字段中输入 `92.35`。
      14. 单击城市账单的“Date”日期栏，展开 2026 年 6 月的日期下拉框。
      15. 单击日期下拉框中的“2”，将付款日期设为 `2026-06-02`。
      16. 单击城市账单的“Memo”输入框。
      17. 在当前字段中输入 `June utilities`。
      18. 单击“Schedule”，提交城市公用事业付款。
      19. 单击第二笔账单的“Biller”下拉框。
      20. 单击“Northstar Internet”，选择家庭网络账单。
      21. 单击网络账单的“From”下拉框。
      22. 单击“Everyday Checking ...2381”。
      23. 单击网络账单的“Amount”数字栏。
      24. 按 Command+A，全选上一笔账单金额。
      25. 在当前字段中输入 `72.00`。
      26. 单击网络账单的“Date”日期栏，展开 2026 年 6 月的日期下拉框。
      27. 单击日期下拉框中的“6”，将付款日期设为 `2026-06-06`。
      28. 单击网络账单的“Memo”输入框。
      29. 按 Command+A，全选上一笔账单备注。
      30. 在当前字段中输入 `June internet`。
      31. 单击“Schedule”，提交家庭网络账单付款。
      32. 单击第三笔账单的“Biller”下拉框。
      33. 单击“OpenBank Rewards Card”，选择信用卡账单。
      34. 单击信用卡还款的“From”下拉框。
      35. 单击“Rainy Day Savings ...9140”。
      36. 单击信用卡还款的“Amount”数字栏。
      37. 按 Command+A，全选上一笔账单金额。
      38. 在当前字段中输入 `120.00`。
      39. 单击信用卡还款的“Date”日期栏，展开 2026 年 6 月的日期下拉框。
      40. 单击日期下拉框中的“10”，将还款日期设为 `2026-06-10`。
      41. 单击信用卡还款的“Memo”输入框。
      42. 按 Command+A，全选上一笔账单备注。
      43. 在当前字段中输入 `Card payment`。
      44. 单击“Schedule”，提交六月信用卡还款。
      45. 单击顶部“Transfers”，进入房租分摊页面。
      46. 单击房租转账的“From”下拉框。
      47. 单击“Rainy Day Savings ...9140”。
      48. 单击房租转账的“To”下拉框。
      49. 单击“Avery Brooks”，选择房租分摊收款人。
      50. 单击房租转账的“Amount”输入框。
      51. 在当前字段中输入 `14.35`。
      52. 单击房租转账的“Date”日期栏，展开 2026 年 6 月的日期下拉框。
      53. 单击日期下拉框中的“18”，将转账日期设为 `2026-06-18`。
      54. 单击房租转账的“Memo”输入框。
      55. 在当前字段中输入 `Rent share`。
      56. 单击“Submit transfer”，提交房租分摊转账。
