      58. 在搜索框中输入 `TextEdit`。
      59. 按 Return，打开文本编辑。
      60. 按 Command+N，新建空白文稿。
      61. 按 Command+Shift+T，将文稿转换为纯文本。
      62. 输入 `PLAN=JUNE HOME`。
      63. 按 Return，在文稿中另起一行。
      64. 输入 `BILLS=284.35`。
      65. 按 Return，在文稿中另起一行。
      66. 输入 `TRANSFER=14.35`。
