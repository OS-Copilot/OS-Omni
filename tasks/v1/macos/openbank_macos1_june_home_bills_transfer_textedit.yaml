instruction: 'Sign in to the OpenBank application with the username jordan and the password vault2026
  to access Jordan Lee''s account, where three scheduled bill payments and one scheduled transfer must
  be recorded on the June home bills page and in the Transfers section. The first scheduled bill payment
  is for City Utilities, drawn from the Rainy Day Savings account ending in 9140, for an amount of 92.35,
  scheduled for 2026-06-02, with the memo June utilities. The second scheduled bill payment is for Northstar
  Internet, drawn from the Everyday Checking account ending in 2381, for an amount of 72.00, scheduled
  for 2026-06-06, with the memo June internet. The third scheduled bill payment is for the OpenBank Rewards
  Card, drawn from the Rainy Day Savings account ending in 9140, for an amount of 120.00, scheduled for
  2026-06-10, with the memo Card payment. The scheduled transfer is to Avery Brooks for a rent share,
  drawn from the Rainy Day Savings account ending in 9140, for an amount of 14.35, scheduled for 2026-06-18,
  with the memo Rent share. A new plain text document in TextEdit must contain exactly three lines: PLAN=JUNE
  HOME, BILLS=284.35, and TRANSFER=14.35, each on its own separate line. This document must be saved as
  a UTF-8 plain text file named June-Home.txt to the Desktop. The task is complete when the three bill
  payments and the Avery Brooks transfer are recorded as scheduled in the account, the file June-Home.txt
  exists on the Desktop with the specified content, and the TextEdit application is the active foreground
  window.'
