      68. 在“Save As”字段输入 `June-Home.txt`。
      69. 点击保存面板的展开按钮，显示位置侧栏。
      70. 点击左侧的“Desktop”，将桌面设为保存位置。
      71. 点击“Save”，保存六月家庭现金流记录。
