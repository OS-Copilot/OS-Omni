  document in TextEdit must contain exactly three lines: the first line PAYOUT=75.00, the second line
  DOCS=2, and the third line PLATE=8XJR214, and this file must be saved to the Desktop with the filename
  Driver-Docs.txt. The task is complete when the OpenDriver session remains signed in as Maya Rodriguez
