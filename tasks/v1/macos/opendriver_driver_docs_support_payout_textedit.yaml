    source_instruction: |-
      1. 点击登录页顶部的“Driver”页签。
      2. 点击 Email 输入框。
      3. 输入 `driver@example.com`。
      4. 点击 Password 输入框。
      5. 输入 `Password123!`。
      6. 点击“Login”，进入 Maya Rodriguez 的司机工作区。
      7. 点击顶部“Work”页签。
      8. 点击顶部“Account”页签。
      9. 选择 License number 输入框。
      10. 按 Command+A 清空 License number 输入框。
      11. 输入 `NY-DL-100492`。
      12. 选择 Vehicle make 输入框。
      13. 按 Command+A 清空 Vehicle make 输入框。
      14. 输入 `Tesla`。
      15. 选择 Vehicle model 输入框。
      16. 按 Command+A 清空 Vehicle model 输入框。
      17. 输入 `Model Y`。
      18. 选择 Plate 输入框。
      19. 按 Command+A 清空 Plate 输入框。
      20. 输入 `8XJR214`。
      21. 选择 Color 输入框。
      22. 按 Command+A 清空 Color 输入框。
      23. 输入 `Pearl white`。
      24. 点击“Save profile for review”。
      25. 向下滚动到“Driver”documents 区域。
      26. 点击“Document type”下拉框。
      27. 点击“Driver license”。
      28. 选择 Document ID 输入框。
      29. 按 Command+A 清空 Document ID 输入框。
      30. 输入 `DL-2026-100492`。
      31. 选择 Expires at 输入框。
      32. 按 Command+A 清空 Expires at 输入框。
      33. 输入 `2027-12-31`。
      34. 点击“Submit document”，提交驾驶证文档。
      35. 点击顶部“Support”页签。
      36. 选择当前工单的“Message”文本框。
      37. 按 Command+A 清空 Message 文本框。
      38. 输入 `Rider ID question`。
      39. 点击“Create support ticket”。
      40. 向下滚动到新建的支持工单卡片。
      41. 点击顶部“Money”页签。
      42. 向下滚动到 Payouts 区域。
      43. 选择 Amount 输入框。
      44. 按 Command+A 清空 Amount 输入框。
      45. 输入 `75.00`。
      46. 选择 Note 输入框。
      47. 按 Command+A 清空 Note 输入框。
      48. 输入 `Fuel reimbursement`。
      49. 点击“Request payout”，提交提现申请。
      50. 点击顶部“Account”页签。
      51. 向下滚动到“Driver”documents 区域。
      52. 点击“Document type”下拉框。
      53. 点击“Insurance”。
      54. 选择“Document ID”输入框。
      55. 按 Command+A 清空现有文档编号。
      56. 输入 `INS-2026-3091`。
      57. 选择“Expires at”输入框。
      58. 按 Command+A 清空现有到期日期。
      59. 输入 `2028-06-30`。
      60. 点击“Submit document”，提交保险文档。
      61. 点击启动台，打开搜索框。
      62. 在搜索框中输入 `TextEdit`。
      63. 按 Return，打开文本编辑。
      64. 按 Command+N，新建空白文稿。
      65. 按 Command+Shift+T，将文稿转换为纯文本。
      66. 输入 `PAYOUT=75.00`。
      67. 按 Return，在文稿中另起一行。
      68. 输入 `DOCS=2`。
      69. 按 Return，在文稿中另起一行。
      70. 输入 `PLATE=8XJR214`。
      71. 按 Command+S，打开首次保存面板。
      72. 在“Save As”字段输入 `Driver-Docs.txt`。
      73. 点击保存面板的展开按钮，显示位置侧栏。
      74. 点击左侧的“Desktop”，将桌面设为保存位置。
      75. 点击“Save”，保存司机资料提交记录；最终保持 TextEdit 在前台，不要返回 OpenDriver，也不要退出登录。
