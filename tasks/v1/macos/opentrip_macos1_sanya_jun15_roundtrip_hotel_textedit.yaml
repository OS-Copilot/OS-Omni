    source_instruction: |-
      OpenTrip 已由初始化器在 macOS1 客体中打开，当前显示登录表单，Lucas Lin 账号信息已预填。仅使用 macOS1 客体内可见的 macOS GUI 完成以下工作流；不要操作宿主机上的 TextEdit 或宿主机文件系统，不要 Sign Out / 不要退出 Lucas Lin 账号。最后必须停留在 macOS1 客体内的 TextEdit，并将纯文本文件保存到 macOS1 客体的 Desktop，不能保存到宿主机。

      1. 点击登录页底部的“Sign In”，以 Lucas Lin 的预填账号进入行程搜索页。
      2. 点击“Date”日期栏，展开“June 2026”日历。
      3. 点击日历中的日期“15”，将去程日期设为 2026-06-15。
      4. 点击“Cabin”下拉框，展开舱位列表。
      5. 点击“Business”，将去程舱位设为商务舱。
      6. 点击航班“Sort”下拉框，展开排序列表。
      7. 点击“Lowest price”，按最低价格排列去程航班。
      8. 点击“Search Flights”，生成上海至三亚的去程航班结果。
      9. 向下滚动结果页，使“MetroJet MJ1386”卡片进入操作区域。
      10. 点击去程首张航班卡片右侧的“Details”，打开其详情页。
      11. 向下滚动详情页，使“Baggage”行李方案完整显示。
      12. 点击“Add 15kg checked bag”，为去程保留 15kg 额外托运行李。
      13. 向上滚动至航班摘要区，使“Book”链接进入操作区域。
      14. 点击“Book”，进入去程航班确认预订区域。
      15. 点击“Traveler”下拉框，展开已保存旅客列表。
      16. 点击“Maya Chen · Passport”，选择旅客 Maya Chen。
      17. 双击“Contact phone”输入框中的现有号码，将其完整选中。
      18. 输入 `13900004201`。
      19. 点击“Payment”下拉框，展开支付方式列表。
      20. 点击“Bank Card · Credit or debit card”，选择银行卡支付。
      21. 点击“Confirm Booking”，提交 MetroJet MJ1386 去程航班订单。
      22. 点击顶部“Search”导航项，回到行程检索首页。
      23. 点击“Hotels”选项卡，将搜索表单切换到酒店模式。
      24. 点击“Check-in”日期栏，展开“June 2026”入住日历。
      25. 点击日历中的日期“15”，将入住日期设为 2026-06-15。
      26. 点击“Check-out”日期栏，展开“June 2026”退房日历。
      27. 点击日历中的日期“17”，将退房日期设为 2026-06-17。
      28. 点击酒店“Sort”下拉框，展开排序列表。
      29. 点击“Lowest price”，按最低价格排列酒店。
      30. 点击“Search Hotels”，生成两晚三亚酒店结果。
      31. 向下滚动酒店结果页，使“Sanya Meridian Suites”卡片进入操作区域。
      32. 点击该酒店卡片的“Details”，进入酒店详情页。
      33. 点击“Book”，进入酒店确认预订区域。
      34. 向下滚动预订页，使房型、电话、支付方式和备注字段完整显示。
      35. 点击“Room”下拉框，展开可预订房型列表。
      36. 点击“Deluxe Twin Room”，选择豪华双床房。
      37. 双击“Contact phone”输入框中的现有号码，将其完整选中。
      38. 输入 `13900004202`。
      39. 点击“Payment”下拉框，展开支付方式列表。
      40. 点击“WeChat Pay · Scan or authorize payment”，选择微信支付。
      41. 点击“Note”输入框，将备注字段置于编辑状态。
      42. 输入 `Quiet room please`。
      43. 点击“Confirm Booking”，提交两晚 Deluxe Twin Room 酒店订单。
      44. 点击页面顶栏的“Search”，回到航班与酒店检索页。
      45. 点击“From city”下拉框，展开出发城市列表。
      46. 点击“Sanya (SYX)”，将返程出发机场设为三亚凤凰。
      47. 点击“To city”下拉框，展开到达城市列表。
      48. 点击“Shanghai (SHA)”，将返程到达机场设为上海虹桥。
      49. 点击“Date”日期栏，展开“June 2026”日历。
      50. 点击日历中的日期“17”，将返程日期设为 2026-06-17。
      51. 点击航班“Sort”下拉框，展开排序列表。
      52. 点击“Earliest”，按最早起飞时间排列返程航班。
      53. 点击“Search Flights”，生成三亚至上海的返程航班结果。
      54. 在返程结果中向下滚动，直至首张航班卡片完整可见。
      55. 点击第一张返程航班卡片的“Details”，进入返程航班详情页。
      56. 向下滚动详情页，使“Baggage”行李方案完整显示。
      57. 点击“Add 23kg checked bag”，为返程保留 23kg 额外托运行李。
      58. 向上滚动至航班摘要区，使“Book”链接进入操作区域。
      59. 点击“Book”，进入返程航班确认预订区域。
      60. 双击“Contact phone”输入框中的现有号码，将其完整选中。
      61. 输入 `13900004203`。
      62. 点击“Payment”下拉框，展开支付方式列表。
      63. 点击“Bank Card · Credit or debit card”，选择银行卡支付。
      64. 点击“Confirm Booking”，提交三亚至上海的返程航班订单。
      65. 点击启动台，打开应用搜索。
      66. 在搜索框中输入 `TextEdit`。
      67. 按 Return，打开文本编辑。
      68. 按 Command+N，新建空白文稿。
      69. 按 Command+Shift+T，将文稿转换为纯文本。
      70. 输入 `DATES=JUN15-17`。
      71. 按 Return，在文稿中另起一行。
      72. 输入 `OUT=MJ1386 15KG`。
      73. 按 Return，在文稿中另起一行。
      74. 输入 `HOTEL=TWIN RET23`。
      75. 按 Command+S，打开首次保存面板。
      76. 在“Save As”字段输入 `Sanya-Jun15.txt`。
      77. 点击保存面板的展开按钮，显示位置侧栏。
      78. 点击左侧的“Desktop”，将桌面设为保存位置。
      79. 点击“Save”，保存安静房联程记录。
