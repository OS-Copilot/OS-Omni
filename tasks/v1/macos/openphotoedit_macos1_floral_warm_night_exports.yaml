task_id: macos.openphotoedit.macos1_floral_warm_night_exports
platform: macos
instruction: 'Produce two edited PNG exports in the OpenPhotoEdit application by processing the source
  images Blue-Floral.jpg and Blue-Floral-Mirror.jpg from the PhotoFixtures folder on the Desktop. The
  first export, named floral-warm.png, must be derived from Blue-Floral.jpg and contain the following
  adjustments: in the Edit category, Exposure set to -12, Brightness set to -6, Contrast set to +22, Saturation
  set to +6, Temperature set to +18, Structure set to +14, Sharpen set to +7, and Vignette set to +8;
  in the Filters category, the Sunset preset selected with the Sunset Amount slider set to 14; and in
  the HSL category, the Blue channel slider set to -16, the Cyan channel slider set to -12, the Magenta
  channel slider set to +8, and the Purple channel slider set to +5. The second export, named floral-night.png,
  must be derived from Blue-Floral-Mirror.jpg and contain the following adjustments: in the Filters category,
  the Night preset selected with the Night Amount slider set to 18; in the Edit category, Exposure set
  to -18, Contrast set to +24, Saturation set to -8, Temperature set to -16, Structure set to +12, and
  Vignette set to +16; and in the HSL category, the Cyan channel slider set to +8, the Blue channel slider
  set to +14, and the Purple channel slider set to +10. Both files must be saved to the PhotoFixtures
  folder on the Desktop with their exact specified filenames. At completion, the OpenPhotoEdit application
  must remain open with the editor page visible, and the user must not sign out, log out, or quit the
  application.'
