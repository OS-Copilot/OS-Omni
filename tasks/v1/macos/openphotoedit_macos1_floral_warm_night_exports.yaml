  vm_snapshot_name: macOS1
  snapshot_display_name: macOS1
  requested_vm_snapshot_name: macOS1
  desktop_run_vm_name: macOS1
  description: Identify the requested replacement source images and export exact no-edit PNG copies.
  prerequisites:
  - macOS1 对应的 allapps-base 快照状态已安装 OpenPhotoEdit 1.0.0（com.killt.openphotoedit）。
  - macOS1 快照的 ~/Desktop/PhotoFixtures 已包含 CalibrationManifest.json、Blue-Floral.jpg 与 Blue-Floral-Mirror.jpg，且
    fixture_version 为 rgb-calibration-v2。
  - macOS1 快照中尚不存在 ~/Desktop/PhotoFixtures/floral-warm.png 与 ~/Desktop/PhotoFixtures/floral-night.png。
  - 完整自动执行由 macOS runner 从已停止的 allapps-base 创建名为 macOS1 的新 APFS COW 运行克隆；initializer 不执行快照恢复。
  initializer_message: The initializer restores versioned source and reference assets only when missing,
    opens OpenPhotoEdit, and removes only this task's stale target exports to provide a fresh starting
    state.
  verifier_rules:
    primary_business_evidence:
    - Each requested PNG exists, is readable, and has the dimensions of its source.
    - RGB pixels match the independently decoded source reference within documented decoder tolerance.
    negative_cases:
    - Wrong source, rotated source, missing output, malformed PNG, or visible pixel edits fail.
    evaluator_is_read_only: true
    evaluation_revision: openphotoedit-export-only-v1
  evaluation_standard: Both named PNGs must match their independent source-pixel references at 2512x832;
    wrong source, altered pixels, missing or corrupt export fails.
  durable_checks:
  - floral-warm.png 与已确认的 2512x832 暖色展板成品 SHA-256 完全一致。
  - floral-night.png 与已确认的 2512x832 深色夜间版成品 SHA-256 完全一致。
  - evaluator 不点击、输入、滑动、提交，也不修改 App、文件或 VM 状态。
