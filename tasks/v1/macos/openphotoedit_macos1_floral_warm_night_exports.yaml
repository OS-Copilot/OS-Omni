    source_instruction: '请只使用可见的 macOS 图形界面完成 OpenPhotoEdit 工作流。OpenPhotoEdit 已由初始化器启动并置于前台；从应用首页开始。使用原生打开与保存面板操作
      Desktop/PhotoFixtures 中的指定图片。为蓝色花卉展板分别制作暖色版和深色夜间版；完成两个导出后，最终停留在 OpenPhotoEdit 编辑器页面。不要 Sign Out
      / 不要退出登录，不要退出 OpenPhotoEdit。


      1. 点击首页的“Import Photo”。

      2. 点击原生打开面板左侧的“Desktop”。

      3. 双击文件列表中的“PhotoFixtures”文件夹。

      4. 点击右上角带 RGB 校准块的“Blue-Floral.jpg”文件。

      5. 点击原生打开面板右下角的“Open”。

      6. 点击“Edit”分类标签。

      7. 点击“Exposure”工具图标。

      8. 将 Exposure 滑块拖到 -12。

      9. 点击“Brightness”工具图标。

      10. 将 Brightness 滑块拖到 -6。

      11. 点击“Contrast”工具图标。

      12. 将 Contrast 滑块拖到 +22。

      13. 点击“Saturation”工具图标。

      14. 将 Saturation 滑块拖到 +6。

      15. 点击“Temperature”工具图标。

      16. 将 Temperature 滑块拖到 +18。

      17. 点击“Structure”工具图标。

      18. 将 Structure 滑块拖到 +14。

      19. 点击“Sharpen”工具图标。

      20. 将 Sharpen 滑块拖到 +7。

      21. 点击“Filters”分类标签。

      22. 点击“Sunset”滤镜预设。

      23. 将“Sunset Amount”滑块拖到 14。

      24. 点击“HSL”分类标签。

      25. 点击“Blue”色彩通道。

      26. 将 Blue 通道滑块拖到 -16。

      27. 点击“Cyan”色彩通道。

      28. 将 Cyan 通道滑块拖到 -12。

      29. 点击“Magenta”色彩通道。

      30. 将 Magenta 通道滑块拖到 +8。

      31. 点击“Purple”色彩通道。

      32. 将 Purple 通道滑块拖到 +5。

      33. 点击“Edit”分类标签。

      34. 点击“Vignette”工具图标。

      35. 将 Vignette 滑块拖到 +8。

      36. 点击右上角“Export”图标，打开原生保存面板。

      37. 选择原生保存面板中的“Save As”文件名字段。

      38. 按 Command+A 全选原文件名。

      39. 输入 `floral-warm.png`。

      40. 点击保存面板中的“Save”，把暖色展板背景保存到 PhotoFixtures。

      41. 点击编辑器左上角的“Back”按钮，回到首页。

      42. 点击首页的“Import Photo”。

      43. 点击原生打开面板左侧的“Desktop”。

      44. 双击文件列表中的“PhotoFixtures”文件夹。

      45. 点击右上角带 RGB 校准块的“Blue-Floral-Mirror.jpg”文件。

      46. 点击原生打开面板右下角的“Open”。

      47. 点击“Filters”分类标签。

      48. 点击“Night”滤镜预设。

      49. 将“Night Amount”滑块拖到 18。

      50. 点击“Edit”分类标签。

      51. 点击“Exposure”工具图标。

      52. 将 Exposure 滑块拖到 -18。

      53. 点击“Contrast”工具图标。

      54. 将 Contrast 滑块拖到 +24。

      55. 点击“Saturation”工具图标。

      56. 将 Saturation 滑块拖到 -8。

      57. 点击“Temperature”工具图标。

      58. 将 Temperature 滑块拖到 -16。

      59. 点击“Structure”工具图标。

      60. 将 Structure 滑块拖到 +12。

      61. 点击“Vignette”工具图标。

      62. 将 Vignette 滑块拖到 +16。

      63. 点击“HSL”分类标签。

      64. 点击“Cyan”色彩通道。

      65. 将 Cyan 通道滑块拖到 +8。

      66. 点击“Blue”色彩通道。

      67. 将 Blue 通道滑块拖到 +14。

      68. 点击“Purple”色彩通道。

      69. 将 Purple 通道滑块拖到 +10。

      70. 点击右上角“Export”图标，打开原生保存面板。

      71. 选择原生保存面板中的“Save As”文件名字段。

      72. 按 Command+A 全选原文件名。

      73. 输入 `floral-night.png`。

      74. 点击保存面板中的“Save”，把深色夜间背景保存到 PhotoFixtures，并停留在 OpenPhotoEdit 编辑器页面。'
