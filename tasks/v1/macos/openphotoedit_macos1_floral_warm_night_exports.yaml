task_id: macos.openphotoedit.macos1_floral_warm_night_exports
platform: macos
instruction: 'In OpenPhotoEdit, create exact no-edit PNG exports from the specified source images. Select
  each source by its filename, preserve its appearance and orientation, and save the PNG into ~/Desktop/PhotoFixtures.


  Open Blue-Floral.jpg in OpenPhotoEdit and export the image as a PNG named floral-warm.png in PhotoFixtures,
  without applying edits.

  Open Blue-Floral-Mirror.jpg in OpenPhotoEdit and export the image as a PNG named floral-night.png in
  PhotoFixtures, without applying edits.


  Leave OpenPhotoEdit open on the editor page for the second source.'
init:
  initializer_id: evaluators.cua_review.initializers.macos.openphotoedit:OpenPhotoEditInitializer
  params:
    app_name: OpenPhotoEdit
    bundle_id: com.killt.openphotoedit
    fixture_dir: ~/Desktop/PhotoFixtures
    fixture_version: rgb-calibration-v3-author-rebuilt
    manifest_name: CalibrationManifest.json
    expected_files:
    - Blue-Floral.jpg
    - Blue-Floral-Mirror.jpg
    expected_exports:
    - floral-warm.png
    - floral-night.png
    final_wait_seconds: 1.5
evaluation:
  evaluator_id: evaluators.macos.openphotoedit_macos1_floral_warm_night_exports:OpenPhotoEditFloralWarmNightEvaluator
  params:
    profile_id: openphotoedit-export-only-v1
    fixture_dir: ~/Desktop/PhotoFixtures
    expected_width: 2512
    expected_height: 832
    expected_filenames:
    - floral-warm.png
    - floral-night.png
    expected_sha256: {}
    reference_images:
      floral-warm.png:
        name: Blue-Floral.reference.png
        expected_sha256: 14d963183673349d13ac12020393d117273dafa19f8d672ac05503fda8d54929
      floral-night.png:
        name: Blue-Floral-Mirror.reference.png
        expected_sha256: eb328c673b53df4b3935b852de8053fb73b6843912cf49afb85db8bda31e4f62
    marker_mae_tolerance: 3.0
    marker_peak_tolerance: 12.0
    image_mae_tolerance: 3.0
    median_tolerance: 3.0
limits:
  max_steps: 300
  step_timeout_seconds: 180
