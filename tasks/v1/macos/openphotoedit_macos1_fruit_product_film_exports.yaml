    source_instruction: '请只使用可见的 macOS 图形界面完成 OpenPhotoEdit 工作流。OpenPhotoEdit 已由初始化器启动并置于前台；从应用首页开始。使用原生打开与保存面板操作
      Desktop/PhotoFixtures 中的指定图片。完成两个用途不同的成品后，最终停留在 OpenPhotoEdit 编辑器页面。不要 Sign Out / 不要退出登录，不要退出 OpenPhotoEdit。


      1. 点击首页的“Import Photo”。

      2. 点击原生打开面板左侧的“Desktop”。

      3. 双击文件列表中的“PhotoFixtures”文件夹。

      4. 点击右上角带 RGB 校准块的“Fruit-Pair.jpg”文件。

      5. 点击原生打开面板右下角的“Open”。

      6. 点击“Edit”分类标签。

      7. 点击“Exposure”工具图标。

      8. 将 Exposure 滑块拖到 -10。

      9. 点击“Brightness”工具图标。

      10. 将 Brightness 滑块拖到 -6。

      11. 点击“Contrast”工具图标。

      12. 将 Contrast 滑块拖到 +18。

      13. 点击“Saturation”工具图标。

      14. 将 Saturation 滑块拖到 +8。

      15. 点击“Temperature”工具图标。

      16. 将 Temperature 滑块拖到 -3。

      17. 点击“Sharpen”工具图标。

      18. 将 Sharpen 滑块拖到 +12。

      19. 点击“Filters”分类标签。

      20. 点击“Clean”滤镜预设。

      21. 将“Clean Amount”滑块拖到 10。

      22. 点击“HSL”分类标签。

      23. 点击“Green”色彩通道。

      24. 将 Green 通道滑块拖到 +6。

      25. 点击“Orange”色彩通道。

      26. 将 Orange 通道滑块拖到 +8。

      27. 点击“Yellow”色彩通道。

      28. 将 Yellow 通道滑块拖到 -10。

      29. 点击“Red”色彩通道。

      30. 将 Red 通道滑块拖到 +3。

      31. 点击右上角“Export”图标，打开原生保存面板。

      32. 选择原生保存面板中的“Save As”文件名字段。

      33. 按 Command+A 全选原文件名。

      34. 输入 `fruit-warm.png`。

      35. 点击保存面板中的“Save”，把清爽商品主图保存到 PhotoFixtures。

      36. 点击编辑器左上角的“Back”按钮，回到首页。

      37. 点击首页的“Import Photo”。

      38. 点击原生打开面板左侧的“Desktop”。

      39. 双击文件列表中的“PhotoFixtures”文件夹。

      40. 点击右上角带 RGB 校准块的“Fruit-Pair-Rotated.jpg”文件。

      41. 点击原生打开面板右下角的“Open”。

      42. 点击“Filters”分类标签。

      43. 点击“Film”滤镜预设。

      44. 将“Film Amount”滑块拖到 14。

      45. 点击“Edit”分类标签。

      46. 点击“Exposure”工具图标。

      47. 将 Exposure 滑块拖到 -8。

      48. 点击“Contrast”工具图标。

      49. 将 Contrast 滑块拖到 +16。

      50. 点击“Saturation”工具图标。

      51. 将 Saturation 滑块拖到 -12。

      52. 点击“Fade”工具图标。

      53. 将 Fade 滑块拖到 +9。

      54. 点击“Grain”工具图标。

      55. 将 Grain 滑块拖到 +7。

      56. 点击“Vignette”工具图标。

      57. 将 Vignette 滑块拖到 +12。

      58. 点击“Temperature”工具图标。

      59. 将 Temperature 滑块拖到 +4。

      60. 点击“HSL”分类标签。

      61. 点击“Orange”色彩通道。

      62. 将 Orange 通道滑块拖到 +5。

      63. 点击“Green”色彩通道。

      64. 将 Green 通道滑块拖到 -6。

      65. 点击“Yellow”色彩通道。

      66. 将 Yellow 通道滑块拖到 -8。

      67. 点击“Edit”分类标签。

      68. 点击“Sharpen”工具图标。

      69. 将 Sharpen 滑块拖到 +8。

      70. 点击右上角“Export”图标，打开原生保存面板。

      71. 选择原生保存面板中的“Save As”文件名字段。

      72. 按 Command+A 全选原文件名。

      73. 输入 `fruit-film.png`。

      74. 点击保存面板中的“Save”，把复古宣传副图保存到 PhotoFixtures，并停留在 OpenPhotoEdit 编辑器页面。'
