task_id: macos.openphotoedit.macos1_fruit_product_film_exports
platform: macos
instruction: 'In OpenPhotoEdit, create exact no-edit PNG exports from the specified source images. Select
  each source by its filename, preserve its appearance and orientation, and save the PNG into ~/Desktop/PhotoFixtures.


  Open Fruit-Pair.jpg in OpenPhotoEdit and export the image as a PNG named fruit-warm.png in PhotoFixtures,
  without applying edits.

  Open Fruit-Pair-Rotated.jpg in OpenPhotoEdit and export the image as a PNG named fruit-film.png in PhotoFixtures,
  without applying edits.


  Leave OpenPhotoEdit open on the editor page for the second source.'
init:
  initializer_id: evaluators.cua_review.initializers.macos.openphotoedit:OpenPhotoEditInitializer
  params:
    app_name: OpenPhotoEdit
    bundle_id: com.killt.openphotoedit
    fixture_dir: ~/Desktop/PhotoFixtures
    fixture_version: rgb-calibration-v3-author-rebuilt
    manifest_name: CalibrationManifest.json
    expected_files:
    - Fruit-Pair.jpg
    - Fruit-Pair-Rotated.jpg
    expected_exports:
    - fruit-warm.png
    - fruit-film.png
    final_wait_seconds: 1.5
evaluation:
  evaluator_id: evaluators.macos.openphotoedit_macos1_fruit_product_film_exports:OpenPhotoEditFruitProductFilmEvaluator
  params:
    profile_id: openphotoedit-export-only-v1
    fixture_dir: ~/Desktop/PhotoFixtures
    expected_width: 2512
    expected_height: 832
    expected_filenames:
    - fruit-warm.png
    - fruit-film.png
    expected_sha256: {}
    reference_images:
      fruit-warm.png:
        name: Fruit-Pair.reference.png
        expected_sha256: c9fce769919139116ff0d374514eaab5598641e5c12f14c2c4393f46accbbb6b
      fruit-film.png:
        name: Fruit-Pair-Rotated.reference.png
        expected_sha256: 96bfe6cff43466e858542fb1634ce009009632954a26195a80c3a5df0d5971be
    marker_mae_tolerance: 3.0
    marker_peak_tolerance: 12.0
    image_mae_tolerance: 3.0
    median_tolerance: 3.0
limits:
  max_steps: 300
  step_timeout_seconds: 180
