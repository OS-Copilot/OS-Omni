    source_instruction: |
      1. 点击左侧空间栏的“Calendar”图标，进入日历页面。
      2. 点击“Multiweek”，切换到多周视图。
      3. 点击“New Event”，打开库存盘点系列编辑器。
      4. 在库存盘点系列的“Title”框输入 `Inventory Audit`。
      5. 在库存盘点系列的“Location”框输入 `Warehouse East`。
      6. 点击库存盘点系列的“Category”下拉框。
      7. 选择“Work”，将系列归入工作类别。
      8. 在库存盘点系列的“Start date”字段输入 `7/16/26`。
      9. 在库存盘点系列的“Start time”字段输入 `2:00 PM`。
      10. 在库存盘点系列的“End date”字段输入 `7/16/26`。
      11. 在库存盘点系列的“End time”字段输入 `2:45 PM`。
      12. 点击库存盘点系列的“Repeat”下拉框。
      13. 选择“Custom…”，打开“Edit Recurrence”设置窗口。
      14. 点击“Every”选项右侧当前显示“1”的重复间隔数字栏。
      15. 按 Command+A 选中现有间隔值。
      16. 输入 `2.0`，将系列设为每两天重复。
      17. 点击“Edit Recurrence”窗口中的“OK”。
      18. 点击“Inventory Audit”编辑器中标有“Reminder”的下拉框。
      19. 选择“15 minutes before”。
      20. 点击库存盘点系列的白色说明正文区域。
      21. 输入 `Audit stock levels`。
      22. 点击“Save and Close”，创建带工作类别的每两天库存盘点系列。
      23. 点击工具栏的“+ New Event”，打开库存计数事件编辑器。
      24. 在库存计数事件的“Title”框输入 `Stock Count`。
      25. 在库存计数事件的“Location”框输入 `Warehouse West`。
      26. 在库存计数事件的“Start date”字段输入 `7/16/26`。
      27. 在库存计数事件的“Start time”字段输入 `4:00 PM`。
      28. 在库存计数事件的“End date”字段输入 `7/16/26`。
      29. 在库存计数事件的“End time”字段输入 `4:30 PM`。
      30. 点击“Stock Count”编辑器中标有“Reminder”的下拉框。
      31. 选择“15 minutes before”。
      32. 点击库存计数事件的说明正文区域。
      33. 输入 `Count west inventory`。
      34. 点击事件编辑器左上角的保存并关闭按钮，创建库存计数事件。
      35. 点击“New Event”，打开客户复盘系列编辑器。
      36. 在客户复盘系列的“Title”框输入 `Client Review`。
      37. 在客户复盘系列的“Location”框输入 `Success Room`。
      38. 在客户复盘系列的“Start date”字段输入 `7/17/26`。
      39. 在客户复盘系列的“Start time”字段输入 `9:00 AM`。
      40. 在客户复盘系列的“End date”字段输入 `7/17/26`。
      41. 在客户复盘系列的“End time”字段输入 `10:00 AM`。
      42. 点击客户复盘系列的“Repeat”下拉框。
      43. 选择“Weekly”。
      44. 点击“Client Review”编辑器中标有“Reminder”的下拉框。
      45. 选择“30 minutes before”。
      46. 点击客户复盘系列的说明正文区域。
      47. 输入 `Review client health`。
      48. 点击“Save and Close”，创建每周客户复盘系列。
      49. 点击工具栏的“+ New Event”，打开客户记录事件编辑器。
      50. 在客户记录事件的“Title”框输入 `Account Notes`。
      51. 在客户记录事件的“Location”框输入 `Briefing Room`。
      52. 点击客户记录事件的“Calendar”下拉框。
      53. 选择“Personal”，把客户记录保存到个人日历。
      54. 在客户记录事件的“Start date”字段输入 `7/17/26`。
      55. 在客户记录事件的“Start time”字段输入 `11:00 AM`。
      56. 在客户记录事件的“End date”字段输入 `7/17/26`。
      57. 在客户记录事件的“End time”字段输入 `11:30 AM`。
      58. 点击“Account Notes”编辑器中标有“Reminder”的下拉框。
      59. 选择“15 minutes before”。
      60. 点击客户记录事件的说明正文区域。
      61. 输入 `Record client notes`。
      62. 点击事件编辑器左上角的保存并关闭按钮，创建个人日历中的客户记录事件。
      63. 双击“Inventory Audit”事件块，打开库存盘点系列摘要。
      64. 点击库存盘点摘要中的“Edit”下拉按钮。
      65. 选择“Edit all occurrences”，编辑整个库存盘点系列。
      66. 点击库存盘点系列的“Location”框。
      67. 按 Command+A 选中现有地点。
      68. 输入 `Ops Center`。
      69. 点击“Inventory Audit”系列编辑器中标有“Reminder”的下拉框。
      70. 选择“30 minutes before”。
      71. 点击库存盘点系列的说明正文区域。
      72. 按 Command+A 选中现有说明。
      73. 输入 `Audit priority stock`。
      74. 点击“Save and Close”，保存整个库存盘点系列的新地点、提醒与说明。
      75. 点击“Month”，切换到月视图并保留四个事件或系列作为最终状态。
