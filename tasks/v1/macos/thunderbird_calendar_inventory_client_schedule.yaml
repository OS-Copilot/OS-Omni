task_id: macos.thunderbird.calendar.inventory_client_schedule
platform: macos
instruction: In Thunderbird Calendar, create four calendar entries and finish with the Month view active.
  The calendar must contain a recurring series titled Inventory Audit with the location Warehouse East,
  the category Work, a start date of 7/16/26 at 2:00 PM, an end date of 7/16/26 at 2:45 PM, a custom recurrence
  of every 2.0 days, a reminder set to 15 minutes before, and the description Audit stock levels. A single
  event titled Stock Count must exist with the location Warehouse West, a start date of 7/16/26 at 4:00
  PM, an end date of 7/16/26 at 4:30 PM, a reminder set to 15 minutes before, and the description Count
  west inventory. A recurring series titled Client Review must be present with the location Success Room,
  a start date of 7/17/26 at 9:00 AM, an end date of 7/17/26 at 10:00 AM, a weekly recurrence, a reminder
  set to 30 minutes before, and the description Review client health. A single event titled Account Notes
  must be assigned to the Personal calendar with the location Briefing Room, a start date of 7/17/26 at
  11:00 AM, an end date of 7/17/26 at 11:30 AM, a reminder set to 15 minutes before, and the description
  Record client notes. The entire Inventory Audit series must be edited so that its location becomes Ops
  Center, its reminder becomes 30 minutes before, and its description becomes Audit priority stock, while
  preserving its Work category and every-two-days recurrence. When the task is complete, the calendar
  should contain exactly one Inventory Audit series, one Stock Count event, one Client Review series,
  and one Account Notes event, with the Thunderbird Calendar Month view selected and visible.
