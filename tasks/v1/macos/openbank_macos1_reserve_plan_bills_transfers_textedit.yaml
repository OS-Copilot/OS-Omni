instruction: |-
  Sign in to OpenBank with the username jordan and the password vault2026 to access Jordan Lee’s account, where two scheduled bill payments and two scheduled transfers must be created, followed by a summary text file saved to the Desktop.

  The Pay & transfer area must contain two scheduled bill payments for June 2026. The first payment is for City Utilities, paid from the Rainy Day Savings account ending in 9140, for an amount of 92.35, scheduled for 2026-06-02, with the memo June utilities. The second payment is for Northstar Internet, paid from the Everyday Checking account ending in 2381, for an amount of 72.00, scheduled for 2026-06-06, with the memo June internet. Both bill payments must be saved as Scheduled.

  The Transfers section must contain two scheduled transfers. The first transfer moves 55.25 from the Rainy Day Savings account ending in 9140 to Maya Patel, scheduled for 2026-06-23, with the memo Emergency supplies. The second transfer moves 70.30 from the Everyday Checking account ending in 2381 to the Rainy Day Savings account, scheduled for 2026-06-26, with the memo Reserve restore. Both transfers must be submitted and saved as Scheduled.

  A new plain text document in TextEdit must contain exactly three lines in this order: BILLS=164.35, SUPPLIES=55.25, and RESERVE=70.30. This document must be saved as Reserve-Plan.txt to the Desktop.

  At completion, TextEdit must be in the foreground displaying the saved document, and the OpenBank session must remain logged in as Jordan Lee without signing out.
