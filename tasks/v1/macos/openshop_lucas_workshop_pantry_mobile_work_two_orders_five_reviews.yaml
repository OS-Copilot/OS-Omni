instruction: Sign in to the OpenShop app with the password spring2026 to maintain a logged-in session
  as Lucas Lin with phone 13800138000, and place two new orders followed by a review on a historical order,
  leaving the cart empty and the Orders page visible at completion. The first order must contain two units
  of the Mountain Isle Pour-Over Coffee 20 Pack in the 60 sachets $205.10 option and one unit of the Blue
  Tin Small Batch Trail Mix Pouch in the 2 Pack $42.56 option, shipped to the Office delivery address
  via WeChat Pay with the Order Note set to Workshop pantry. The second order must contain one unit of
  the Verdant Pro Noise-Canceling Headphones in the White $299 option and one unit of the Polar Day Slim
  Business Backpack in the 13-inch $159 option, shipped to the Office delivery address via Cash on Delivery
  with the Order Note set to Mobile work pair. The first order requires a 5 / 5 rating with the review
  text Team coffee supply for the Mountain Isle Pour-Over Coffee 20 Pack and a 4 / 5 rating with the review
  text Easy shared snack for the Blue Tin Small Batch Trail Mix Pouch. The second order requires a 5 /
  5 rating with the review text Strong focus sound for the Verdant Pro Noise-Canceling Headphones and
  a 5 / 5 rating with the review text Compact daily carry for the Polar Day Slim Business Backpack. The
  historical order TBH-LUCAS-20260429-002 requires a 4 / 5 rating with the review text Dependable brew
  for the Mountain Isle coffee item.
