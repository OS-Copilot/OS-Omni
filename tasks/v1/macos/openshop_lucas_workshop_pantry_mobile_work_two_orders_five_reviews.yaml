      9. 点击“60 sachets $205.10”规格。
      10. 点击“Add to Cart”，把 60 sachets 咖啡加入购物车。
      11. 点击“Back to Home”，返回商品首页。
      12. 点击首页搜索区左侧的商品关键词输入框。
      13. 在商品关键词输入框中输入 `Blue Tin`。
      14. 点击检索框右侧的橙色提交按钮，打开坚果搜索结果。
      15. 向下滚动商品结果，使“Blue Tin Small Batch Trail Mix Pouch”卡片进入操作区域。
      16. 点击“Blue Tin Small Batch Trail Mix Pouch”商品卡片。
      17. 点击“2 Pack $42.56”规格。
      18. 点击“Add to Cart”，把 2 Pack 坚果加入购物车。
      19. 点击页面右上角“Cart”，进入购物车。
      20. 点击咖啡商品行数量控件右侧的加号，把咖啡数量从 1 增加到 2。
      21. 点击“Proceed to Checkout”，进入第一笔订单的结算页。
      22. 点击配送地址“Office”。
      23. 点击支付方式“WeChat Pay”。
      24. 向下滚动结算页，使“Order Note”文本框完整显示。
      25. 在“Order Note”文本框中输入 `Workshop pantry`。
      26. 点击“Place Order”，生成咖啡与坚果订单并进入 Orders 页面。
      27. 向下滚动新订单，使 Mountain Isle 咖啡评价区域进入操作范围。
      28. 点击咖啡评价区域的星级选择框。
      29. 点击“5 / 5”，设置咖啡评分。
      30. 在咖啡的“Review”文本框中输入 `Team coffee supply`。
      31. 点击咖啡评价区域的“Submit Review”，提交咖啡评价。
      32. 向下滚动同一订单，使 Blue Tin 坚果评价区域进入操作范围。
      33. 点击坚果评价区域的分数菜单。
      34. 点击“4 / 5”，设置坚果评分。
      35. 在坚果的“Review”文本框中输入 `Easy shared snack`。
      36. 点击坚果评价区域的“Submit Review”，提交坚果评价。
