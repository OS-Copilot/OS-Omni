task_id: linux.cross_app.wireshark_writer_protocol_hard
platform: linux
instruction: >
  Open the seeded Wireshark capture /tmp/helloworld_wireshark/retail_mix.pcapng.
  In the display filter bar at the top, type "udp" and press Enter or click
  the Apply button to apply the filter. Count the number of displayed UDP
  packets shown in the packet list.
  Then clear the filter by clicking the Clear button (X icon) next to the
  filter bar.
  Now type "icmp" in the filter bar and apply it. Count the number of
  displayed ICMP packets.
  Then clear the filter again.
  Now type "tcp.port == 80" in the filter bar and apply it. Count the
  number of displayed packets.
  Then switch to the already-open LibreOffice Writer window. Create a new
  document with the heading "Protocol Analysis Report" and include:
  "UDP Packets: [your count]
  ICMP Packets: [your count]
  TCP Port 80 Packets: [your count]"
  Save the Writer document as /home/user/Documents/protocol_report.odt.
  Finish after the document is saved.
