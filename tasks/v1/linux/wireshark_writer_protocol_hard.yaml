evaluation:
  evaluator_id: evaluators.linux.command_check:CommandCheckEvaluator
  params:
    timeout: 120
    stdout_contains: "PASS"
    command: |
      set -euo pipefail
      python3 - <<'PY'
      import os
      import zipfile

      expected_headings = [
          "Protocol Analysis Report",
          "UDP Packets:",
          "ICMP Packets:",
          "TCP Port 80 Packets:"
      ]

      odt_path = os.path.expanduser("~/Documents/protocol_report.odt")
      if not os.path.exists(odt_path):
          raise SystemExit("WRITER_FILE_NOT_FOUND")

      with zipfile.ZipFile(odt_path, 'r') as z:
          content = z.read('content.xml').decode('utf-8')

      for value in expected_headings:
          if value not in content:
              raise SystemExit(f"MISSING_VALUE_{value.replace(' ', '_').replace(':', '')}")
      import re
      import html

      def plain_text(xml):
          return html.unescape(re.sub(r"<[^>]+>", " ", xml))

      def count_after(text, label):
          match = re.search(re.escape(label) + r"\s*(\d+)", text)
          if not match:
              raise SystemExit(f"MISSING_COUNT_{label.replace(' ', '_').replace(':', '')}")
          return int(match.group(1))
      # Counts of the seeded retail_mix.pcapng under the instruction's display filters (verified with tshark).
      expected_counts = {"UDP Packets:": 4, "ICMP Packets:": 2, "TCP Port 80 Packets:": 7}
      text = plain_text(content)
      for label, expected in expected_counts.items():
          actual = count_after(text, label)
          if actual != expected:
              raise SystemExit(f"WRONG_COUNT_{label.replace(' ', '_').replace(':', '')}: expected {expected}, got {actual}")

      print("PASS")
      PY
limits:
  max_steps: 300
  step_timeout_seconds: 180
metadata:
  tags:
  - linux
  - cross_app
  - wireshark
  - writer
  - network
  - filter
  - protocol
  - hard
  app_name: wireshark + libreoffice_writer
  difficulty: hard
  description: Apply 3 different display filters in Wireshark (udp, icmp, tcp.port==80),
    count packets for each, then create a protocol analysis report in Writer
    with those counts.
