task_id: linux.vscode.apply_theme_ticket
platform: linux
instruction: >-
  In Gedit, use docs/theme-ticket.md as the source of truth. Update web/src/header.html
  so the title becomes Harbor Ops Console, the status badge becomes Ready for QA,
  and the shortcut button label becomes Open Runbook. Update web/src/theme.css so
  --primary-color is #1F6FEB and --accent-color is #F59E0B. Update config/support.json
  so the support email is ops@harbor.example. Keep the rest of each file unchanged
  and save all three files.
init:
  initializer_id: initializers.linux.notepadqq:NotepadqqInitializer
  params:
    app_command: gedit
    workspace_name: vscode_theme_ticket
    workspace_root: /tmp/helloworld_vscode_workspace
    files:
    - path: docs/theme-ticket.md
      content: '# Theme Ticket


        Product title: Harbor Ops Console

        Status badge: Ready for QA

        Shortcut label: Open Runbook

        Primary color: #1F6FEB

        Accent color: #F59E0B

        Support email: ops@harbor.example

        '
    - path: web/src/header.html
      content: "<header class=\"app-header\">\n  <h1>Console Placeholder</h1>\n  <span\
        \ class=\"status-badge\">Draft</span>\n  <button class=\"shortcut-button\"\
        >Open Shortcut</button>\n</header>\n"
    - path: web/src/theme.css
      content: ":root {\n  --primary-color: #222222;\n  --accent-color: #999999;\n\
        }\n"
    - path: config/support.json
      content: "{\n  \"email\": \"support@example.com\"\n}\n"
    open_files:
    - docs/theme-ticket.md
    - web/src/header.html
    - web/src/theme.css
    - config/support.json
evaluation:
  evaluator_id: evaluators.linux.vscode:VSCodeWorkspaceEvaluator
  params:
    workspace_path: /tmp/helloworld_vscode_workspace/vscode_theme_ticket
    files:
    - path: web/src/header.html
      equals: "<header class=\"app-header\">\n  <h1>Harbor Ops Console</h1>\n  <span\
        \ class=\"status-badge\">Ready for QA</span>\n  <button class=\"shortcut-button\"\
        >Open Runbook</button>\n</header>\n"
    - path: web/src/theme.css
      equals: ":root {\n  --primary-color: #1F6FEB;\n  --accent-color: #F59E0B;\n\
        }\n"
    - path: config/support.json
      json:
        email: ops@harbor.example
limits:
  max_steps: 300
  step_timeout_seconds: 180
metadata:
  tags:
  - linux
  - gui
  - gedit
  - editor
  - html
  - css
  - json
  - hard
  app: vscode
  difficulty: hard
  description: Read a theme ticket in Gedit and apply its values across HTML, CSS,
    and JSON files.
  oracle_task: tasks/v1/linux/oracle/vscode_apply_theme_ticket_oracle.yaml
  oracle_model: linux_oracle_wait
