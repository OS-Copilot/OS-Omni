task_id: linux.notepadqq.prepare_release_packet
platform: linux
instruction: In Gedit, use docs/release-brief.md as the source of truth. Update config/release-plan.json
  so version is 5.4.2, owner is Elena Park, qaStatus is Ready for sign-off, rolloutDate
  is 2026-06-12, rollbackOwner is Mina Sol, signoffRequired is true, and channels
  is exactly [\"linux\", \"windows\", \"android\"]. Then update notes/release-summary.md
  so its first sentence is Release 5.4.2 is owned by Elena Park and rolls out on
  2026-06-12 for linux, windows, and android. Add a second sentence reading QA is
  Ready for sign-off and rollback is owned by Mina Sol. Save both files.
init:
  initializer_id: initializers.linux.notepadqq:NotepadqqInitializer
  params:
    app_command: gedit
    workspace_name: notepadqq_release_packet
    files:
    - path: docs/release-brief.md
      content: '# Release Brief


        Release version: 5.4.2

        Release owner: Elena Park

        QA status: Ready for sign-off

        Rollout date: 2026-06-12

        Rollback owner: Mina Sol

        Sign-off required: true


        Channels:

        - linux

        - windows

        - android


        Summary:

        Release 5.4.2 is owned by Elena Park and rolls out on 2026-06-12 for linux,
        windows, and android.

        QA is Ready for sign-off and rollback is owned by Mina Sol.

        '
    - path: config/release-plan.json
      content: "{\n  \"version\": \"0.0.0\",\n  \"owner\": \"\",\n  \"qaStatus\":\
        \ \"pending\",\n  \"rolloutDate\": \"\",\n  \"rollbackOwner\": \"\",\n \
        \ \"signoffRequired\": false,\n  \"channels\": []\n}\n"
    - path: notes/release-summary.md
      content: 'Summary goes here.


        Keep this note short.

        '
    open_files:
    - docs/release-brief.md
    - config/release-plan.json
    - notes/release-summary.md
evaluation:
  evaluator_id: evaluators.linux.notepadqq:NotepadqqWorkspaceEvaluator
  params:
    workspace_path: /tmp/helloworld_notepadqq_workspace/notepadqq_release_packet
    files:
    - path: config/release-plan.json
      json:
        version: 5.4.2
        owner: Elena Park
        qaStatus: Ready for sign-off
        rolloutDate: '2026-06-12'
        rollbackOwner: Mina Sol
        signoffRequired: true
        channels:
        - linux
        - windows
        - android
    - path: notes/release-summary.md
      equals: 'Release 5.4.2 is owned by Elena Park and rolls out on 2026-06-12 for
        linux, windows, and android. QA is Ready for sign-off and rollback is owned
        by Mina Sol.


        Keep this note short.

        '
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - linux
  - gui
  - gedit
  - editor
  - json
  - markdown
  - hard
  app: notepadqq
  difficulty: hard
  description: Use one brief file to update a richer JSON plan and a two-sentence markdown summary in Gedit.
  oracle_task: tasks/v1/linux/oracle/notepadqq_prepare_release_packet_oracle.yaml
  oracle_model: linux_oracle_wait
