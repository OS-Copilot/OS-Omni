task_id: linux.cross_app.thunderbird_calendar_checkout_coffee_followup_hard
platform: linux
instruction: In OpenShop, you are already signed in and coffee is already in the cart. Complete checkout using the Office address, WeChat Pay, and the note Leave it at the front desk. Submit the order. Then switch to the already-open Thunderbird Calendar window, create a 30-minute event titled Bench Coffee Delivery Follow-up for the day after tomorrow at 9:00 AM, and save it.
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
      - type: run_bash
        script: |
          pkill -f thunderbird || true
          pkill -f openshop || true
        timeout: 120
      - type: wait
        ms: 1200
      - type: download
        url: https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/thunderbird/dd84e895-72fd-4023-a336-97689ded257c/thunderbird-profile.tar.gz
        path: /home/user/thunderbird-profile.tar.gz
      - type: run_bash
        script: tar -xzv --recursive-unlink -f /home/user/thunderbird-profile.tar.gz -C /home/user/
        timeout: 120
      - type: run_bash
        # The shared OSWorld profile ships the local Home calendar disabled; the task expects a usable calendar.
        script: sed -i '/calendar\.registry\.[^.]*\.disabled/d' /home/user/.thunderbird/*/prefs.js
        timeout: 60
      - type: openshop_current_app
        port: 4310
        launch_browser: false
      - type: wait
        ms: 4000
      - type: run_bash
        script: |
          python3 - <<'PY'
          import json
          import time
          import urllib.request

          BASE_URL = "http://127.0.0.1:4310"
          DEADLINE = time.time() + 30
          CART_ITEMS = [
              {"productId": "p1005", "quantity": 1, "selectedSpec": "20 sachets"},
          ]

          def request_json(path, method="GET", payload=None):
              data = None
              headers = {"Content-Type": "application/json"}
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(BASE_URL + path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=5) as resp:
                  body = resp.read().decode("utf-8")
                  return json.loads(body) if body else {}

          while time.time() < DEADLINE:
              try:
                  request_json("/api/bootstrap")
                  break
              except Exception:
                  time.sleep(0.5)
          else:
              raise SystemExit("Timed out waiting for OpenShop app API")

          request_json("/api/dev/reset", method="POST", payload={})
          request_json(
              "/api/login",
              method="POST",
              payload={"phone": "13800138000", "password": "spring2026"},
          )
          for item in CART_ITEMS:
              request_json("/api/cart/items", method="POST", payload=item)
          print("OPENSHOP_READY")
          PY
        timeout: 120
      - type: openshop_open_browser
        port: 4310
      - type: wait
        ms: 3000
      - type: run_bash
        script: |
          export DISPLAY=:0
          setsid -f /usr/bin/thunderbird -calendar >/dev/null 2>&1
        timeout: 120
      - type: wait
        ms: 4500
evaluation:
  evaluator_id: evaluators.linux.command_check:CommandCheckEvaluator
  params:
    timeout: 120
    stdout_contains: "PASS"
    command: |
      set -euo pipefail
      python3 - <<'PY'
      import json
      import urllib.request

      BASE_URL = "http://127.0.0.1:4310"

      def request_json(path):
          req = urllib.request.Request(BASE_URL + path, method="GET")
          with urllib.request.urlopen(req, timeout=8) as resp:
              return json.loads(resp.read().decode("utf-8"))

      session_payload = request_json("/api/session")
      cart_payload = request_json("/api/cart")
      orders_payload = request_json("/api/orders")

      session = dict(session_payload.get("session") or {})
      assert bool(session.get("loggedIn")) is True, f"expected loggedIn=True, got {session!r}"
      assert str((session.get("user") or {}).get("phone") or "") == "13800138000"

      items = list(cart_payload.get("items") or [])
      assert len(items) == 0, f"expected empty cart, got {items!r}"
      assert float(cart_payload.get("total") or 0) == 0.0, f"expected cart total 0, got {cart_payload!r}"

      orders = list(orders_payload.get("orders") or [])
      assert len(orders) == 1, f"expected 1 order, got {orders!r}"
      latest = dict(orders[0] or {})
      assert str(latest.get("status") or "") == "Awaiting Shipment", f"unexpected order status: {latest!r}"
      assert str((latest.get("address") or {}).get("label") or "") == "Office", f"unexpected address: {latest!r}"
      assert str((latest.get("payment") or {}).get("id") or "") == "wechat", f"unexpected payment id: {latest!r}"
      assert str((latest.get("payment") or {}).get("label") or "") == "WeChat Pay", f"unexpected payment label: {latest!r}"
      assert str(latest.get("note") or "").strip().rstrip(".") == "Leave it at the front desk", f"unexpected note: {latest!r}"
      # Items subtotal as authored; the app adds 12 shipping and takes 30 off at 300+.
      subtotal = sum(float((item.get("product") or {}).get("price") or 0) * int(item.get("quantity") or 0) for item in (latest.get("items") or []))
      assert subtotal == 78.0, f"unexpected items subtotal {subtotal}: {latest!r}"
      expected_total = subtotal + 12 - (30 if subtotal >= 300 else 0)
      assert float(latest.get("total") or 0) == expected_total, f"unexpected total, expected {expected_total}: {latest!r}"
      order_items = list(latest.get("items") or [])
      assert len(order_items) == 1, f"unexpected order items: {latest!r}"
      order_item = dict(order_items[0] or {})
      product = dict(order_item.get("product") or {})
      assert str(product.get("id") or "") == "p1005", f"unexpected ordered product: {product!r}"
      assert int(order_item.get("quantity") or 0) == 1, f"unexpected order quantity: {order_item!r}"
      assert str(order_item.get("selectedSpec") or "") == "20 sachets", f"unexpected order spec: {order_item!r}"
      print("OPENSHOP_OK")
      PY
      grep -R -a -q "Bench Coffee Delivery Follow-up" /home/user/.thunderbird
      echo "PASS"
limits:
  max_steps: 300
  step_timeout_seconds: 180
metadata:
  tags: [linux, cross_app, calendar, shopping, thunderbird, openshop, hard]
  app_name: thunderbird_calendar + openshop
  difficulty: hard
  description: Finish a seeded OpenShop checkout, then create a delivery follow-up event in Thunderbird Calendar.
  oracle_task: tasks/v1/linux/oracle/cross_app_thunderbird_calendar_checkout_coffee_followup_hard_oracle.yaml
  oracle_model: linux_oracle_wait
