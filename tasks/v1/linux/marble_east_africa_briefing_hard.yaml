task_id: linux.marble.east_africa_briefing
platform: linux
instruction: 'In Marble, first switch the map theme to OpenStreetMap. Create a new
  bookmark folder named East Africa Briefing. Then search for Nairobi, Kampala, Kigali,
  and Mombasa one by one. After centering on each city, add a bookmark to the East
  Africa Briefing folder using these exact names: Brief Nairobi, Brief Kampala, Brief
  Kigali, and Brief Mombasa. Stop after all four bookmarks are saved.'
init:
  initializer_id: initializers.linux.marble:MarbleInitializer
  params:
    app_command: marble
evaluation:
  evaluator_id: evaluators.linux.marble:MarbleBookmarkEvaluator
  params:
    map_theme: earth/openstreetmap/openstreetmap.dgml
    required_folders:
    - East Africa Briefing
    required_bookmarks:
    - name: Brief Nairobi
      folder: East Africa Briefing
    - name: Brief Kampala
      folder: East Africa Briefing
    - name: Brief Kigali
      folder: East Africa Briefing
    - name: Brief Mombasa
      folder: East Africa Briefing
limits:
  max_steps: 300
  step_timeout_seconds: 180
metadata:
  tags:
  - linux
  - gui
  - marble
  - maps
  - bookmark
  - folder
  - hard
  app: Marble
  difficulty: hard
  description: Switch Marble to OpenStreetMap and build a four-city East Africa bookmark
    briefing folder.
  oracle_task: tasks/v1/linux/oracle/marble_east_africa_briefing_oracle.yaml
  oracle_model: linux_oracle_wait
