evaluation:
  evaluator_id: evaluators.linux.command_check:CommandCheckEvaluator
  params:
    timeout: 120
    stdout_contains: "PASS"
    command: |
      set -euo pipefail
      python3 - <<'PY'
      import os
      import zipfile

      odp_path = os.path.expanduser("~/Documents/traffic_slide.odp")
      if not os.path.exists(odp_path):
          raise SystemExit("IMPRESS_FILE_NOT_FOUND")

      with zipfile.ZipFile(odp_path, 'r') as z:
          content = z.read('content.xml').decode('utf-8')

      if "Network Traffic Summary" not in content:
          raise SystemExit("MISSING_TITLE")

      for protocol in ["DNS Packets:", "HTTP Packets:", "TCP Packets:"]:
          if protocol not in content:
              raise SystemExit(f"MISSING_{protocol.replace(':', '').replace(' ', '_')}")

      print("PASS")
      PY
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - linux
  - cross_app
  - wireshark
  - impress
  - network
  - filter
  - presentation
  - hard
  app_name: wireshark + libreoffice_impress
  difficulty: hard
  description: Apply 3 display filters in Wireshark (dns, http, tcp), count packets
    for each, then create a traffic summary slide in Impress with protocol counts.
