task_id: linux.cross_app.gimp_writer_color_balance_hard
platform: linux
instruction: >
  Open the seeded image /tmp/helloworld_gimp/input.png in GIMP.
  Use the scroll wheel to zoom out until you can see the entire image.
  Then use Image → Scale Image to resize the image to exactly 800×600 pixels.
  Click Scale to confirm.
  Then use Image → Mode → Grayscale to convert the image to grayscale.
  Then use Colors → Brightness-Contrast to increase the contrast by 30.
  Click OK to confirm.
  Finally use File → Export As to export the result to
  /home/user/Documents/adjusted.png as a PNG file. In the export dialog,
  click Export to confirm.
  Then switch to the already-open LibreOffice Writer window. Create a new
  document. Type the heading "Adjusted Image" and then use Insert → Image
  to insert the exported image /home/user/Documents/adjusted.png. In the
  insert dialog, navigate to /home/user/Documents/, select adjusted.png,
  and click Open. Save the Writer document as
  /home/user/Documents/adjusted_report.odt.
  Finish after both files exist.
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: |
        pkill -f gimp || true
        pkill -f soffice.bin || true
        mkdir -p /tmp/helloworld_gimp /home/user/Documents
    - type: wait
      ms: 1200
    - type: run_bash
      script: |
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/gimp/045bf3ff-9077-4b86-b483-a1040a949cff/gate.jpeg"
        out = Path("/tmp/helloworld_gimp/input.png")
        out.write_bytes(urlopen(url).read())
        PY
    - type: run_bash
      script: |
        export DISPLAY=:0
        setsid -f gimp /tmp/helloworld_gimp/input.png >/dev/null 2>&1
    - type: wait
      ms: 8000
    - type: run_bash
      script: |
        export DISPLAY=:0
        setsid -f libreoffice --writer >/dev/null 2>&1
    - type: wait
      ms: 5000
evaluation:
  evaluator_id: evaluators.linux.command_check:CommandCheckEvaluator
  params:
    timeout: 120
    stdout_contains: "PASS"
    command: |
      set -euo pipefail
      python3 - <<'PY'
      import os
      import zipfile

      img_path = os.path.expanduser("~/Documents/adjusted.png")
      if not os.path.exists(img_path):
          raise SystemExit("GIMP_OUTPUT_NOT_FOUND")

      odt_path = os.path.expanduser("~/Documents/adjusted_report.odt")
      if not os.path.exists(odt_path):
          raise SystemExit("WRITER_FILE_NOT_FOUND")

      with zipfile.ZipFile(odt_path, 'r') as z:
          content = z.read('content.xml').decode('utf-8')

      if "Adjusted Image" not in content:
          raise SystemExit("MISSING_HEADING")
      if "Pictures/" not in content and ".png" not in content:
          raise SystemExit("MISSING_IMAGE_REFERENCE")

      print("PASS")
      PY
limits:
  max_steps: 300
  step_timeout_seconds: 180
metadata:
  tags:
  - linux
  - cross_app
  - gimp
  - writer
  - image
  - scale
  - grayscale
  - contrast
  - hard
  app_name: gimp + libreoffice_writer
  difficulty: hard
  description: Scale an image to 800x600, convert to grayscale, adjust contrast
    in GIMP, export via File → Export As dialog, then insert into Writer
    via Insert → Image dialog.
