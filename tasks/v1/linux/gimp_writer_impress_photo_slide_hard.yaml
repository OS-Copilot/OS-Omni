task_id: linux.cross_app.gimp_writer_impress_photo_slide_hard
platform: linux
instruction: >
  Open the seeded image /tmp/helloworld_gimp/input.png in GIMP.
  Use the scroll wheel to zoom out until you can see the entire image.
  Then use Image → Scale Image to resize the image to exactly 640×480 pixels.
  Click Scale to confirm.
  Then use Colors → Hue-Saturation to increase the saturation by 40.
  Click OK to confirm.
  Then use File → Export As to export the result to
  /home/user/Documents/vivid_photo.png as a PNG file. In the export dialog,
  click Export to confirm.
  Then switch to the already-open LibreOffice Writer window. Create a new
  document. Type the heading "Photo Enhancement Report" and below it include:
  "Original image: input.png
  Resize: 640x480 pixels
  Color adjustment: Saturation +40
  Output: vivid_photo.png"
  Then use Insert → Image to insert the exported image
  /home/user/Documents/vivid_photo.png. Save the Writer document as
  /home/user/Documents/photo_report.odt.
  Then switch to the already-open LibreOffice Impress window. Create a new
  presentation. On the first slide, use Insert → Text Box to add a text box
  and type "Enhanced Photo" as the title. Then use Insert → Image to insert
  /home/user/Documents/vivid_photo.png. Save the presentation as
  /home/user/Documents/photo_slide.odp.
  Finish after all three files exist.
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: |
        pkill -f gimp || true
        pkill -f soffice.bin || true
        mkdir -p /tmp/helloworld_gimp /home/user/Documents
    - type: wait
      ms: 1200
    - type: run_bash
      script: |
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/gimp/045bf3ff-9077-4b86-b483-a1040a949cff/gate.jpeg"
        out = Path("/tmp/helloworld_gimp/input.png")
        out.write_bytes(urlopen(url).read())
        PY
    - type: run_bash
      script: |
        export DISPLAY=:0
        setsid -f gimp /tmp/helloworld_gimp/input.png >/dev/null 2>&1
    - type: wait
      ms: 8000
    - type: run_bash
      script: |
        export DISPLAY=:0
        setsid -f libreoffice --writer >/dev/null 2>&1
    - type: wait
      ms: 5000
    - type: run_bash
      script: |
        export DISPLAY=:0
        setsid -f libreoffice --impress >/dev/null 2>&1
    - type: wait
      ms: 5000
evaluation:
  evaluator_id: evaluators.linux.command_check:CommandCheckEvaluator
  params:
    timeout: 120
    stdout_contains: "PASS"
    command: |
      set -euo pipefail
      python3 - <<'PY'
      import os
      import zipfile

      # Check GIMP output
      img_path = os.path.expanduser("~/Documents/vivid_photo.png")
      if not os.path.exists(img_path):
          raise SystemExit("GIMP_OUTPUT_NOT_FOUND")

      # Check Writer document
      odt_path = os.path.expanduser("~/Documents/photo_report.odt")
      if not os.path.exists(odt_path):
          raise SystemExit("WRITER_FILE_NOT_FOUND")

      with zipfile.ZipFile(odt_path, 'r') as z:
          content = z.read('content.xml').decode('utf-8')

      for val in ["Photo Enhancement Report", "Saturation", "640x480"]:
          if val not in content:
              raise SystemExit(f"MISSING_VALUE_{val}")

      # Check Impress presentation
      odp_path = os.path.expanduser("~/Documents/photo_slide.odp")
      if not os.path.exists(odp_path):
          raise SystemExit("IMPRESS_FILE_NOT_FOUND")

      with zipfile.ZipFile(odp_path, 'r') as z:
          content = z.read('content.xml').decode('utf-8')

      if "Enhanced Photo" not in content:
          raise SystemExit("MISSING_SLIDE_TITLE")

      print("PASS")
      PY
limits:
  max_steps: 300
  step_timeout_seconds: 180
metadata:
  tags:
  - linux
  - cross_app
  - gimp
  - writer
  - impress
  - image
  - three_app
  - hard
  app_name: gimp + libreoffice_writer + libreoffice_impress
  difficulty: hard
  description: Scale and adjust saturation of an image in GIMP, create a photo
    enhancement report in Writer with the image embedded, then create a
    presentation slide in Impress with the same image.
