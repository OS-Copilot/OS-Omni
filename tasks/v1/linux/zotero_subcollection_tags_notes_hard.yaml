task_id: linux.cross_app.zotero_subcollection_tags_notes_hard
platform: linux
instruction: >
  Open Zotero. Create a new collection named "Computer Science" under My Library.
  Create a subcollection named "Databases" under "Computer Science". To create
  a subcollection, right-click on "Computer Science" in the left sidebar and
  select "New Subcollection". Type "Databases" and press Enter.
  Create another subcollection named "Networking" under "Computer Science".
  Add two Book items to the "Databases" subcollection:
  1. "Designing Data-Intensive Applications" by Martin Kleppmann
  2. "Database System Concepts" by Abraham Silberschatz
  Add two Journal Article items to the "Networking" subcollection:
  1. "A Protocol for Packet Network Intercommunication" by Vint Cerf
  2. "The Byzantine Generals Problem" by Leslie Lamport
  Add the tag "foundational" to all four items. To add a tag, select an item,
  then in the right panel click the Tags tab, click Add, and type "foundational".
  Add a child note to "Designing Data-Intensive Applications". To add a note,
  right-click the item and select Add Note. Type "Covers distributed systems,
  replication, partitioning, and consistency models."
  Add a child note to "A Protocol for Packet Network Intercommunication".
  Type "Seminal paper on TCP/IP architecture."
  Select the "Computer Science" collection. Go to File → Export Collection.
  In the export dialog, choose "BibTeX" format and export. The file will be
  saved to /home/user/Documents/cs_refs.bib.
  Finish after the BibTeX file exists.
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: |
        set -e
        export HOME=/home/user
        export PATH="$HOME/.local/bin:$PATH"
        mkdir -p "$HOME/Applications" "$HOME/.local/share/applications" "$HOME/.local/bin" "$HOME/Downloads" "$HOME/Documents"
        pkill -x zotero >/dev/null 2>&1 || true
        archive="$HOME/Downloads/Zotero-9.0.1_linux-x86_64.tar.xz"
        if [ ! -x "$HOME/Applications/Zotero_linux-x86_64/zotero" ]; then
          if [ ! -f "$archive" ]; then
            # One line: an indented heredoc terminator is not recognised by bash.
            python3 -c 'import sys, urllib.request; open(sys.argv[2], "wb").write(urllib.request.urlopen(sys.argv[1]).read())' "https://download.zotero.org/client/release/9.0.1/Zotero-9.0.1_linux-x86_64.tar.xz" "$archive"
          fi
          rm -rf "$HOME/Applications/Zotero_linux-x86_64"
          tar -xf "$archive" -C "$HOME/Applications"
          (
            cd "$HOME/Applications/Zotero_linux-x86_64"
            ./set_launcher_icon
          )
          ln -sf "$HOME/Applications/Zotero_linux-x86_64/zotero.desktop" "$HOME/.local/share/applications/zotero.desktop"
          ln -sf "$HOME/Applications/Zotero_linux-x86_64/zotero" "$HOME/.local/bin/zotero"
        fi
        rm -rf "$HOME/Zotero" "$HOME/.zotero"
    - type: launch_app
      command: /home/user/Applications/Zotero_linux-x86_64/zotero
    - type: wait
      ms: 12000
    - type: run_bash
      script: |
        export DISPLAY=${DISPLAY:-:0}
        wmctrl -a Zotero 2>/dev/null || true
        wmctrl -r Zotero -b remove,maximized_vert,maximized_horz 2>/dev/null || true
        wmctrl -r Zotero -e 0,80,80,1320,860 2>/dev/null || true
    - type: wait
      ms: 1000
evaluation:
  evaluator_id: evaluators.linux.command_check:CommandCheckEvaluator
  params:
    timeout: 120
    stdout_contains: "PASS"
    command: |
      set -euo pipefail
      python3 - <<'PY'
      import sqlite3
      import os

      db_path = os.path.expanduser("~/Zotero/zotero.sqlite")
      if not os.path.exists(db_path):
          raise SystemExit("ZOTERO_DB_NOT_FOUND")

      # Zotero keeps an exclusive lock on the live database; read a copy.
      import shutil, tempfile
      snapshot_dir = tempfile.mkdtemp()
      for suffix in ("", "-wal", "-journal"):
          if os.path.exists(db_path + suffix):
              shutil.copy2(db_path + suffix, os.path.join(snapshot_dir, "zotero.sqlite" + suffix))
      conn = sqlite3.connect(os.path.join(snapshot_dir, "zotero.sqlite"))
      cur = conn.cursor()

      # Check parent collection
      cur.execute("SELECT collectionID FROM collections WHERE collectionName='Computer Science'")
      parent = cur.fetchone()
      if not parent:
          raise SystemExit("PARENT_COLLECTION_NOT_FOUND")

      # Check subcollections
      cur.execute("SELECT collectionName FROM collections WHERE collectionName='Databases'")
      if not cur.fetchone():
          raise SystemExit("SUBCOLLECTION_DATABASES_NOT_FOUND")
      cur.execute("SELECT collectionName FROM collections WHERE collectionName='Networking'")
      if not cur.fetchone():
          raise SystemExit("SUBCOLLECTION_NETWORKING_NOT_FOUND")

      # Check 4 items exist
      cur.execute("""
          SELECT DISTINCT idv.value FROM items i
          JOIN itemData id ON i.itemID = id.itemID
          JOIN fields f ON id.fieldID = f.fieldID
          JOIN itemDataValues idv ON id.valueID = idv.valueID
          WHERE f.fieldName = 'title'
          AND idv.value IN ('Designing Data-Intensive Applications', 'Database System Concepts',
                            'A Protocol for Packet Network Intercommunication', 'The Byzantine Generals Problem')
      """)
      items = cur.fetchall()
      if len(items) != 4:
          raise SystemExit(f"EXPECTED_4_ITEMS_GOT_{len(items)}")

      # Check tag exists
      cur.execute("SELECT DISTINCT name FROM tags WHERE name = 'foundational'")
      if not cur.fetchone():
          raise SystemExit("TAG_NOT_FOUND")

      # Check BibTeX file
      bib_path = os.path.expanduser("~/Documents/cs_refs.bib")
      if not os.path.exists(bib_path):
          raise SystemExit("BIBTEX_FILE_NOT_FOUND")

      print("PASS")
      PY
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - linux
  - zotero
  - subcollection
  - tags
  - notes
  - bibliography
  - hard
  app_name: zotero
  difficulty: hard
  description: Create a Zotero collection hierarchy with 2 subcollections, add 4 items
    of different types across subcollections, add tags and child notes, then
    export as BibTeX.
