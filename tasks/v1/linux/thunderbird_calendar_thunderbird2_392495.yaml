instruction: In Thunderbird's Calendar, dismiss any popup that appears (without logging out), move to
  the week of July 6 to July 10, 2026, and create a set of nine events that all persist in the local calendar,
  each title appearing exactly once. "Kickoff Alignment" must be on July 6, 2026 from 09:20 to 10:00.
  "Requirements Freeze" must be on July 6, 2026 from 13:10 to 13:55 with a single reminder 15 minutes
  before. "Prototype Review" must be on July 7, 2026 from 10:30 to 11:15. "Data Migration Check" must
  be on July 8, 2026 from 08:45 to 09:30 with a reminder 15 minutes before. "Stakeholder Demo Prep" must
  be on July 8, 2026 from 15:00 to 15:50. "Security Review Window" must be on July 9, 2026 from 11:40
  to 12:20 with a reminder 30 minutes before. "Weekly Delivery Sync" must be on July 10, 2026 from 09:00
  to 09:35, repeating every week (Weekly), with a reminder 30 minutes before. "Launch Decision Brief"
  must be on July 10, 2026 from 16:15 to 17:00; it is first saved without a description and then edited
  so that its description is exactly "Decision owners confirmed". "Release Readiness" must be on July
  9, 2026 from 14:00 to 14:40 with a reminder 15 minutes before and the description "Review launch blockers".
  Events without a stated reminder, repeat rule, or description should keep none, and every event must
  be saved with Save and Close so the week plan retains the release events and their descriptions.
