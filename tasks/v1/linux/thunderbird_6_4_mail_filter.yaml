task_id: linux.thunderbird.6_4_mail_filter
platform: linux
instruction: In Thunderbird Mail, create two new folders and two subject-based message filters under Local
  Folders. Local Folders must contain new folders named `BillsDesk64` and `TripsDesk64`. The Local Folders
  message filters must include an enabled filter named `Bill64Route` and an enabled filter named `Travel64Route`,
  each with the Archiving and Periodically, every 10 minutes triggers checked and set to Match any of
  the following. Bill64Route must use the conditions Subject contains `invoice64` and Subject contains
  `receipt64` with the action Move Message to Local Folders > `BillsDesk64`. Travel64Route must use the
  conditions Subject contains `booking64` and Subject contains `checkin64` with the action Move Message
  to Local Folders > `TripsDesk64`. Both filters must be saved so they persist in the Local Folders filter
  rules, and finally, with the filter list narrowed by the search text `64`, Bill64Route must be run once
  with Run Now on the `BillsDesk64` folder.
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      timeout: 120
      script: |
        pkill -f thunderbird || true
        tar -xzv --recursive-unlink -f /home/user/thunderbird-profile.tar.gz -C /home/user/
    - type: launch_app
      app_name: thunderbird
    - type: wait
      ms: 5000
evaluation:
  evaluator_id: evaluators.cua_review.evaluators.linux.thunderbird:ThunderbirdTaskEvaluator
  params:
    # The brief asks for the two folders and for the filters in the Local Folders filter
    # rules (not the IMAP account's), each named, enabled and triggered on Archiving and
    # Periodically (nsMsgFilterType Archive 0x80 and Periodic 0x100 in type=).
    required_folders:
    - BillsDesk64
    - TripsDesk64
    osworld_evaluator:
      # Thunderbird writes msgFilterRules.dat when the Message Filters window closes; the
      # evaluator runs these steps before reading the file.
      postconfig:
      - type: close_window
        parameters:
          window_name: Message Filters
          strict: false
      - type: sleep
        parameters:
          seconds: 0.5
      func: check_thunderbird_filter
      result:
        type: vm_file
        path: /home/user/.thunderbird/t5q2a5hp.default-release/Mail/Local Folders/msgFilterRules.dat
        dest: msgFilterRules.dat
      expected:
        type: rule
        rules:
          expect:
          - name: Bill64Route
            enabled: 'yes'
            type_flags:
            - archive
            - periodic
            action: Move to folder
            actionValue: mailbox://nobody@Local%20Folders/BillsDesk64
            condition:
            - OR (subject,contains,invoice64) OR (subject,contains,receipt64)
          - name: Travel64Route
            enabled: 'yes'
            type_flags:
            - archive
            - periodic
            action: Move to folder
            actionValue: mailbox://nobody@Local%20Folders/TripsDesk64
            condition:
            - OR (subject,contains,booking64) OR (subject,contains,checkin64)
