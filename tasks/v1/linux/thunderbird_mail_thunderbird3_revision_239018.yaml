instruction: 'In Thunderbird, produce two related drafts addressed to `assistant@outlook.com` in the Local
  Folders `Drafts` folder: an original draft and a revised copy of it. The original draft, composed from
  the `anonym-x2024@outlook.com` account, must have the subject `Support triage check` and a body of exactly
  two lines, `Owner:Alex` and `Status:Draft only`; it must be saved and kept unchanged, remaining unread
  and not starred. The revised draft must be created from the original with Edit As New Message (so the
  original is preserved) and, in its final saved form, must have the subject `Support triage check - final`
  and a body of exactly these lines in order: `Owner:Alex`, `Status:Draft only`, `Follow-up:pending`,
  `Ready for review`, `Priority:high`, and `Next review:Monday`. The copy is built up in stages that are
  each saved: first with the added line `Follow-up:pending`, then with ` - final` appended to the subject
  and the line `Ready for review`, and finally with `Priority:high` and `Next review:Monday` appended
  at the end of the body. In the final state, the Drafts folder must contain exactly one draft with each
  subject, and the `Support triage check - final` draft must be marked as read and starred.'
