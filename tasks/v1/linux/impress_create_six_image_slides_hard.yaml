task_id: linux.impress.create_six_image_slides
platform: linux
instruction: >-
  Six images named pic1.png through pic6.png are saved on the Desktop. In the
  open LibreOffice Impress presentation, create a six-slide kiosk deck with
  blank slides only: one picture object per slide, pic1.png on slide 1 through
  pic6.png on slide 6. Each image should keep the same placement and fitted size
  as the reference kiosk layout. Set each picture's alternative-text description
  to its source filename, for example pic1.png on slide 1 and pic6.png on slide
  6. Also create /tmp/helloworld_office/impress_asset_manifest.csv with exactly
  these seven comma-separated lines in this order: slide,image,alt_text,status;
  1,pic1.png,pic1.png,placed; 2,pic2.png,pic2.png,placed;
  3,pic3.png,pic3.png,placed; 4,pic4.png,pic4.png,placed;
  5,pic5.png,pic5.png,placed; 6,pic6.png,pic6.png,placed. Then create
  /tmp/helloworld_office/impress_operator_handoff.txt with exactly these four
  non-empty lines in this order: deck=impress_bf4e9888_actual.pptx,
  mode=continuous-playback, owner=media-desk, status=ready-for-preview. Save the
  presentation when finished.
init:
  initializer_id: initializers.linux.office_setup:LinuxOfficeSetupInitializer
  params:
    tool_source_dir: platforms/linux/office_tools
    tool_names:
    - libreoffice_writer.py
    - libreoffice_calc.py
    - libreoffice_impress.py
    remote_tool_dir: "~"
    uno_port: 2002
    startup_wait_seconds: 6
    cleanup_paths:
    - /tmp/helloworld_office/impress_asset_manifest.csv
    - /tmp/helloworld_office/impress_operator_handoff.txt
    - /tmp/helloworld_office/impress_image_manifest.txt
    - /tmp/helloworld_office/impress_kiosk_manifest.txt
    - /tmp/helloworld_office/impress_slide_checks.txt
    - /tmp/helloworld_office/impress_timing_manifest.txt
    - /tmp/helloworld_office/impress_playback_manifest.txt
    - /tmp/helloworld_office/impress_qc_manifest.txt
    - /tmp/helloworld_office/impress_accessibility_manifest.txt
    - /tmp/helloworld_office/impress_export_manifest.txt
    - /tmp/helloworld_office/impress_operator_manifest.txt
    - /tmp/helloworld_office/impress_quality_gate_manifest.txt
    - /tmp/helloworld_office/impress_handoff_audit.txt
    - /tmp/helloworld_office/impress_asset_receipt.csv
    - /tmp/helloworld_office/impress_operator_queue.txt
    - /tmp/helloworld_office/impress_export_receipt.txt
    - /tmp/helloworld_office/impress_asset_timing_crosswalk.tsv
    - /tmp/helloworld_office/impress_bundle_dependency_index.txt
    seed_downloads:
    - url: https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_impress/bf4e9888-f10f-47af-8dba-76413038b73c/4.3-Template_4.29.2016.pptx
      path: /tmp/helloworld_office/impress_bf4e9888_actual.pptx
    - url: https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_impress/bf4e9888-f10f-47af-8dba-76413038b73c/4.3-Template_4.29.2016_Gold.pptx
      path: /tmp/helloworld_office/impress_bf4e9888_expected.pptx
    - url: https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_impress/bf4e9888-f10f-47af-8dba-76413038b73c/pic1.png
      path: /home/user/Desktop/pic1.png
    - url: https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_impress/bf4e9888-f10f-47af-8dba-76413038b73c/pic2.png
      path: /home/user/Desktop/pic2.png
    - url: https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_impress/bf4e9888-f10f-47af-8dba-76413038b73c/pic3.png
      path: /home/user/Desktop/pic3.png
    - url: https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_impress/bf4e9888-f10f-47af-8dba-76413038b73c/pic4.png
      path: /home/user/Desktop/pic4.png
    - url: https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_impress/bf4e9888-f10f-47af-8dba-76413038b73c/pic5.png
      path: /home/user/Desktop/pic5.png
    - url: https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_impress/bf4e9888-f10f-47af-8dba-76413038b73c/pic6.png
      path: /home/user/Desktop/pic6.png
    open_documents_after_download:
    - /tmp/helloworld_office/impress_bf4e9888_actual.pptx
    open_documents_wait_seconds: 5
evaluation:
  evaluator_id: evaluators.linux.pptx_compare:PptxCompareEvaluator
  params:
    actual_path: /tmp/helloworld_office/impress_bf4e9888_actual.pptx
    expected_path: /tmp/helloworld_office/impress_bf4e9888_expected.pptx
    options:
      examine_number_of_slides: true
      examine_text: false
      examine_shape: true
      # The brief gives no target geometry ("the same placement and fitted size as the
      # reference kiosk layout"; the seeded deck has no picture to copy), so the pictures are
      # not sized against the hidden gold deck. picture_box_rules below requires all six to
      # share slide 1's box instead, as the Windows peer (impress_slide_shape_bold) does.
      examine_image_size: false
      examine_run_count: false
      examine_alignment: false
    picture_box_rules:
    - reference_slide: 1
      slides: [2, 3, 4, 5, 6]
      picture_index: 1
      tolerance: 0.005
    image_count_rules:
    - slide_index: 1
      picture_count: 1
    - slide_index: 2
      picture_count: 1
    - slide_index: 3
      picture_count: 1
    - slide_index: 4
      picture_count: 1
    - slide_index: 5
      picture_count: 1
    - slide_index: 6
      picture_count: 1
    picture_alt_rules:
    - slide_index: 1
      picture_index: 1
      descr: pic1.png
    - slide_index: 2
      picture_index: 1
      descr: pic2.png
    - slide_index: 3
      picture_index: 1
      descr: pic3.png
    - slide_index: 4
      picture_index: 1
      descr: pic4.png
    - slide_index: 5
      picture_index: 1
      descr: pic5.png
    - slide_index: 6
      picture_index: 1
      descr: pic6.png
    # Alt text alone does not identify the picture: slide N must show the Desktop picN.png
    # (same bytes, or the same pixels if Impress re-encoded it).
    picture_image_rules:
    - slide_index: 1
      source_path: /home/user/Desktop/pic1.png
    - slide_index: 2
      source_path: /home/user/Desktop/pic2.png
    - slide_index: 3
      source_path: /home/user/Desktop/pic3.png
    - slide_index: 4
      source_path: /home/user/Desktop/pic4.png
    - slide_index: 5
      source_path: /home/user/Desktop/pic5.png
    - slide_index: 6
      source_path: /home/user/Desktop/pic6.png
    text_artifacts:
    - path: /tmp/helloworld_office/impress_asset_manifest.csv
      equals: |
        slide,image,alt_text,status
        1,pic1.png,pic1.png,placed
        2,pic2.png,pic2.png,placed
        3,pic3.png,pic3.png,placed
        4,pic4.png,pic4.png,placed
        5,pic5.png,pic5.png,placed
        6,pic6.png,pic6.png,placed
    - path: /tmp/helloworld_office/impress_operator_handoff.txt
      equals: |
        deck=impress_bf4e9888_actual.pptx
        mode=continuous-playback
        owner=media-desk
        status=ready-for-preview
limits:
  max_steps: 300
  step_timeout_seconds: 180
metadata:
  tags:
  - linux
  - gui
  - libreoffice
  - impress
  - pptx
  - images
  - file_handoff
  - hard
  app: LibreOffice Impress
  difficulty: hard
  description: Build a six-slide kiosk deck with one prepared image per blank
    slide, reference-fit image placement, source-filename alt text, and concise
    asset/operator handoff files.
  oracle_task: tasks/v1/linux/oracle/impress_create_six_image_slides_oracle.yaml
  oracle_model: linux_oracle_wait
