evaluation:
  evaluator_id: evaluators.linux.command_check:CommandCheckEvaluator
  params:
    timeout: 120
    stdout_contains: "PASS"
    command: |
      set -euo pipefail
      python3 - <<'PY'
      import os
      import zipfile

      ods_path = os.path.expanduser("~/Documents/traffic_summary.ods")
      if not os.path.exists(ods_path):
          raise SystemExit("CALC_FILE_NOT_FOUND")

      with zipfile.ZipFile(ods_path, 'r') as z:
          content = z.read('content.xml').decode('utf-8')

      for protocol in ["DNS", "HTTP", "TCP"]:
          if protocol not in content:
              raise SystemExit(f"MISSING_PROTOCOL_{protocol}")

      if "SUM" not in content:
          raise SystemExit("MISSING_SUM_FORMULA")
      # Counts of the seeded retail_mix.pcapng under the instruction's display filters (verified with tshark).
      import xml.etree.ElementTree as ET
      ns = {"table": "urn:oasis:names:tc:opendocument:xmlns:table:1.0", "office": "urn:oasis:names:tc:opendocument:xmlns:office:1.0"}
      rows = {}
      for row in ET.fromstring(content).iter("{%s}table-row" % ns["table"]):
          cells = []
          for cell in row.findall("table:table-cell", ns):
              repeat = min(int(cell.get("{%s}number-columns-repeated" % ns["table"], "1")), 8)
              value = cell.get("{%s}value" % ns["office"])
              text = " ".join("".join(p.itertext()) for p in cell.iter("{urn:oasis:names:tc:opendocument:xmlns:text:1.0}p"))
              cells += [(value, text.strip())] * repeat
          if cells and cells[0][1]:
              rows.setdefault(cells[0][1], cells[1:])
      for label, expected in {"DNS": 4, "HTTP": 2, "TCP": 8}.items():
          rest = rows.get(label)
          if not rest:
              raise SystemExit(f"MISSING_ROW_{label}")
          value, text = rest[0]
          actual = float(value) if value is not None else float(text or "nan")
          if actual != expected:
              raise SystemExit(f"WRONG_COUNT_{label}: expected {expected}, got {actual}")
      total = rows.get("Total")
      if not total or float(total[0][0] or "nan") != 14:
          raise SystemExit(f"WRONG_TOTAL: expected 14, got {total and total[0]}")

      print("PASS")
      PY
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - linux
  - cross_app
  - wireshark
  - calc
  - network
  - filter
  - spreadsheet
  - hard
  app_name: wireshark + libreoffice_calc
  difficulty: hard
  description: Apply 3 display filters in Wireshark (dns, http, tcp), count packets
    for each, then create a traffic summary spreadsheet in Calc with protocol
    counts and a SUM total.
