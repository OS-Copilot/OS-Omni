task_id: linux.cross_app.wireshark_calc_summary_hard
platform: linux
instruction: >
  Open the seeded Wireshark capture /tmp/helloworld_wireshark/retail_mix.pcapng.
  In the display filter bar at the top, type "dns" and press Enter or click
  the Apply button to apply the filter. Count the number of displayed DNS
  packets.
  Then clear the filter by clicking the Clear button.
  Now type "http" in the filter bar and apply it. Count the number of
  displayed HTTP packets.
  Then clear the filter again.
  Now type "tcp" in the filter bar and apply it. Count the number of
  displayed TCP packets.
  Then switch to the already-open LibreOffice Calc window. Create a new
  spreadsheet. In cell A1 type "Protocol", in B1 type "Packet Count".
  In row 2, enter "DNS" and the DNS packet count. In row 3, enter "HTTP"
  and the HTTP packet count. In row 4, enter "TCP" and the TCP packet count.
  In cell A6, type "Total". In cell B6, enter a SUM formula =SUM(B2:B4).
  Save the spreadsheet as /home/user/Documents/traffic_summary.ods.
  Finish after the spreadsheet is saved.
