task_id: android.tasks_org.create_task_with_due_date
platform: android
instruction: 'In Tasks.org, the list already contains several seeded launch-review decoys. Delete exactly these two stale top-level tasks: Prepare launch review slides - stale budget copy and Prepare launch review slides - draft appendix. Preserve the other four seeded top-level tasks unchanged. Then create exactly one new top-level task titled Prepare launch review slides - FINAL BLUE. Its description must be exactly these five lines, in this order: bench_prepare_slides_note_v4 / owner=Mei; lane=blue; checkpoint=17:40 / include: risks, rollback, metrics / exclude: draft appendix, budget table / checksum=BMK-774. Set its due date nine days from today. Do not create subtasks, reminders, duplicate draft tasks, completed tasks, or any other top-level task.'
init:
  initializer_id: initializers.android.tasks_org:TasksOrgCreateTaskWithDueDateInitializer
  params:
    app_package: "org.tasks"
    app_activity: "com.todoroo.astrid.activity.TaskListActivity"
    clear_app_data: true
    open_blank_editor: false
    seed_tasks:
      - title: "Prepare launch review slides - DRAFT BLUE"
        note: "seeded keep: draft blue reference, do not edit"
        due_day_offset: 2
        order_index: 1
      - title: "Prepare launch review slide - FINAL BLUE"
        note: "seeded keep: near-title decoy missing plural slides"
        due_day_offset: 9
        order_index: 2
      - title: "Budget table appendix - HOLD"
        note: "seeded keep: budget table remains excluded"
        order_index: 3
      - title: "Rollback metrics capture - KEEP"
        note: "seeded keep: metrics source remains unchanged"
        due_day_offset: 5
        order_index: 4
      - title: "Prepare launch review slides - stale budget copy"
        note: "seeded delete: stale budget copy"
        due_day_offset: 1
        order_index: 5
      - title: "Prepare launch review slides - draft appendix"
        note: "seeded delete: draft appendix"
        due_day_offset: 3
        order_index: 6
    wait_ms: 1200
evaluation:
  evaluator_id: evaluators.android.tasks_org:TasksOrgTaskWithDueDateEvaluator
  params:
    title: "Prepare launch review slides - FINAL BLUE"
    note: |-
      bench_prepare_slides_note_v4
      owner=Mei; lane=blue; checkpoint=17:40
      include: risks, rollback, metrics
      exclude: draft appendix, budget table
      checksum=BMK-774
    due_day_offset: 9
    preserved_top_level_tasks:
      - title: "Prepare launch review slides - DRAFT BLUE"
        note: "seeded keep: draft blue reference, do not edit"
        due_day_offset: 2
      - title: "Prepare launch review slide - FINAL BLUE"
        note: "seeded keep: near-title decoy missing plural slides"
        due_day_offset: 9
      - title: "Budget table appendix - HOLD"
        note: "seeded keep: budget table remains excluded"
      - title: "Rollback metrics capture - KEEP"
        note: "seeded keep: metrics source remains unchanged"
        due_day_offset: 5
    forbidden_top_level_titles:
      - "Prepare launch review slides - stale budget copy"
      - "Prepare launch review slides - draft appendix"
    timeout_seconds: 20
    poll_interval_seconds: 1
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [tasks_org, productivity, local_db, hard, benchmark]
  app: "Tasks.org"
  app_bundle_id: org.tasks
  difficulty: hard
  observed_agent_steps: 10
  description: "From a seeded decoy list, delete two exact stale tasks, preserve four similar tasks, and create one exact multiline due-date task with strict final database validation."
