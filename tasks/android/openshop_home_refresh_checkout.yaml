task_id: android.openshop.home_refresh_checkout
platform: android
instruction: "In OpenShop, sign in with phone 13800138000 and password spring2026. Build a home-refresh order from the final checklist, not the draft checklist: Garden White Cotton Bedding Set 1.8m with the 200x230cm spec quantity 2, Polar Day Slim Business Backpack with the External USB port spec quantity 1, Mountain Isle Pour-Over Coffee 20 Pack with the 20 sachets spec quantity 1, and Lumen Magnetic Phone Stand with the Aluminum alloy spec quantity 1. If you add any headphones or camping tables while comparing options, remove them before checkout. Check out to the Home address, use Cash on Delivery, add the note 'Home refresh final: bedding x2, backpack, coffee, stand.', and place the order."
init:
  initializer_id: initializers.android.openshop:OpenShopFreshOpenInitializer
  params:
    app_package: com.killt.openshop
    app_activity: com.killt.openshop.MainActivity
    clear_app_data: true
    wait_ms: 1800
evaluation:
  evaluator_id: evaluators.android.openshop:OpenShopStateEvaluator
  params:
    app_package: com.killt.openshop
    session_logged_in: true
    cart_size: 0
    order_count: 1
    latest_order:
      address_id: addr-home
      payment_method_id: cod
      note: "Home refresh final: bedding x2, backpack, coffee, stand."
      status: "Awaiting Shipment"
      items:
        - product_id: p1003
          quantity: 2
          selected_spec: "200x230cm"
        - product_id: p1004
          quantity: 1
          selected_spec: "External USB port"
        - product_id: p1005
          quantity: 1
          selected_spec: "20 sachets"
        - product_id: p1006
          quantity: 1
          selected_spec: "Aluminum alloy"
    timeout_seconds: 12
    poll_interval_seconds: 0.5
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [shopping, android, openshop, cart, checkout, multi_step, hard, benchmark]
  app: OpenShop
  app_bundle_id: com.killt.openshop
  description: "Build a four-item cart, remove one distractor item, set product specs and quantity, and place the final OpenShop home delivery order."
  prerequisites:
    - "OpenShop is installed on the emulator."
  difficulty: hard
