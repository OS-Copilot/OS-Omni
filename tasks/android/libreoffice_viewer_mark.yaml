task_id: android.libreoffice.viewer.mark
platform: android
instruction: |-
  Create a new text document in LibreOffice, put only this exact marker on its own line: READ_BY_VIEWER_2026_FINAL_ROUTE_BLUE_OWNER_MEI__KEEP_CASE__BMK_774__NO_DRAFT. Save it specifically as bench_read_by_viewer.odt, reopen that saved file, and confirm the marker is still there. Do not save as a draft name and do not add any extra words.
  Important LibreOffice Android tip: after you type, the page may still look blank even when the input succeeded, so do not assume typing failed just because the text is not yet visible, and do not keep retyping the same marker.
  A reliable way to make the typed content visible again is to use More options, then Save as, enter bench_read_by_viewer.odt, and tap Save; after returning to the document view, the text is usually visible again.
init:
  initializer_id: initializers.android.libreoffice_viewer_prep:LibreOfficeViewerNewTextPrepInitializer
  params:
    app_name: libreoffice
    wait_ms: 2000
    sheet_settle_ms: 800
    after_template_ms: 1200
    home_ready_timeout_seconds: 20
evaluation:
  evaluator_id: evaluators.android.libreoffice_viewer_mark:LibreOfficeViewerMarkEvaluator
  params:
    expected_marker: "READ_BY_VIEWER_2026_FINAL_ROUTE_BLUE_OWNER_MEI__KEEP_CASE__BMK_774__NO_DRAFT"
    expected_filename: "bench_read_by_viewer.odt"
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [libreoffice, viewer, document, ascii, easy]
  app: LibreOffice
  difficulty: easy
  description: "Prep opens New Text Document; agent types a long exact marker, saves/reopens bench_read_by_viewer.odt, and evaluator verifies persisted ODT content."
