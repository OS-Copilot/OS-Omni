task_id: android.material_files.rename_file
platform: android
instruction: In Material Files, open incoming/rename_instructions.txt inside the benchmark files workspace and apply only the FINAL BLUE batch. Ignore the DRAFT, HOLD, BACKUP, and RED decoy lines. Rename eight final source files exactly, move exactly three final archive files into archive after renaming them, leave every hold/backup/draft file unchanged, keep the remaining final files inside incoming, and delete rename_instructions.txt when finished. Do not delete, rename, or move any hold/backup/draft file.
init:
  initializer_id: initializers.android.material_files:MaterialFilesRenameFileInitializer
  params:
    app_package: "me.zhanghai.android.files"
    app_activity: ".filelist.FileListActivity"
    workspace_root: "/sdcard/Documents/bench_files_lab"
    extra_seed_files:
      - path: "/sdcard/Documents/bench_files_lab/incoming/hold_reference.txt"
        text: "hold_reference\n"
      - path: "/sdcard/Documents/bench_files_lab/incoming/seed_invoice.txt"
        text: "seed_invoice\n"
      - path: "/sdcard/Documents/bench_files_lab/incoming/seed_summary.txt"
        text: "seed_summary\n"
      - path: "/sdcard/Documents/bench_files_lab/incoming/seed_manifest.txt"
        text: "seed_manifest\n"
      - path: "/sdcard/Documents/bench_files_lab/incoming/seed_receipt_alpha.txt"
        text: "seed_receipt_alpha\n"
      - path: "/sdcard/Documents/bench_files_lab/incoming/seed_receipt_beta.txt"
        text: "seed_receipt_beta\n"
      - path: "/sdcard/Documents/bench_files_lab/incoming/seed_route_card.txt"
        text: "seed_route_card\n"
      - path: "/sdcard/Documents/bench_files_lab/incoming/seed_vendor_packet.txt"
        text: "seed_vendor_packet\n"
      - path: "/sdcard/Documents/bench_files_lab/incoming/seed_note_backup.txt"
        text: "seed_note_backup_decoy\n"
      - path: "/sdcard/Documents/bench_files_lab/incoming/draft_receipt_note.txt"
        text: "draft_receipt_note_decoy\n"
      - path: "/sdcard/Documents/bench_files_lab/incoming/hold_invoice_note.txt"
        text: "hold_invoice_note_decoy\n"
      - path: "/sdcard/Documents/bench_files_lab/incoming/backup_manifest_keep_case_BMK_9.txt"
        text: "backup_manifest_decoy\n"
      - path: "/sdcard/Documents/bench_files_lab/archive/archive_hold_do_not_touch.txt"
        text: "archive_hold_do_not_touch\n"
      - path: "/sdcard/Documents/bench_files_lab/incoming/rename_instructions.txt"
        text: "DRAFT: rename hold_reference.txt to archived_reference.txt; ignore this line.\nDECOY: rename seed_note_backup.txt to receipt_note_FINAL_774.txt; ignore this line.\nRED: rename seed_receipt_alpha.txt to receipt_alpha_RED_wrong.txt; ignore this line.\nFINAL BLUE incoming: seed_note.txt -> receipt_note_FINAL_774.txt; seed_invoice.txt -> invoice_note_FINAL_203.txt; seed_summary.txt -> summary_BLUE_route_17_40.txt; seed_manifest.txt -> manifest_keep_case_BMK_9.txt; seed_receipt_alpha.txt -> receipt_alpha_FINAL_BLUE_501.txt.\nFINAL BLUE archive: seed_receipt_beta.txt -> archive/receipt_beta_ARCHIVE_BLUE_502.txt; seed_route_card.txt -> archive/route_card_ARCHIVE_17_40.txt; seed_vendor_packet.txt -> archive/vendor_packet_ARCHIVE_MEI_774.txt.\nKEEP UNCHANGED: hold_reference.txt, seed_note_backup.txt, draft_receipt_note.txt, hold_invoice_note.txt, backup_manifest_keep_case_BMK_9.txt, archive/archive_hold_do_not_touch.txt.\nDELETE AFTER APPLYING FINAL BLUE: rename_instructions.txt.\n"
    clear_app_data: true
    wait_ms: 1200
