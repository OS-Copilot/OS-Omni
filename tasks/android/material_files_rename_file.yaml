  app: "Material Files"
  app_bundle_id: me.zhanghai.android.files
  difficulty: hard
  observed_agent_steps: 10
  description: "Read an instruction file with decoys, apply eight exact final renames, move three renamed files into archive, preserve all hold/draft/backup files, delete the instruction file, and verify exact directory contents."
