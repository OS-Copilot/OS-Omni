instruction: |-
  Create three saved route records and one incident report record in the OpenNavigation app, finishing on the Records page where all four artifacts are visible together.

  The first saved route, named MetaCommute, must be a Drive route from the current location to Meta Headquarters with a waypoint at Googleplex, configured with the Avoid highways preference and set to Leave now. The second saved route, named CampusWalk, must be a Walk route from Stanford University to Mountain View Transit Center, configured with the Accessible route preference and set to Other time. The third saved route, named TransitLink, must be a Transit route from Mountain View Transit Center to Googleplex, configured with the Fewer transfers preference and set to Other time. Each route must be generated with a Start button available before being renamed and saved.

  The incident report record must be filed against the MetaCommute route during active navigation, specifying Heavy traffic as the incident type and OfficeCongestion as the report note.

  At completion, the Records page must display the Saved routes section containing MetaCommute, CampusWalk, and TransitLink, and the Incident reports section containing the Heavy traffic report with the OfficeCongestion note, with no “No saved routes” or “No incident reports” placeholders visible.
