task_id: android.material_files.organize_file
platform: android
instruction: In Material Files, open the benchmark files workspace and read incoming/route_plan.txt. Follow the final route plan inside that file, not the draft note. When finished, the incoming folder should be empty.
init:
  initializer_id: initializers.android.material_files:MaterialFilesOrganizeFileInitializer
  params:
    app_package: "me.zhanghai.android.files"
    app_activity: ".filelist.FileListActivity"
    workspace_root: "/sdcard/Documents/bench_files_lab"
    extra_seed_files:
      - path: "/sdcard/Documents/bench_files_lab/incoming/seed_invoice.txt"
        text: "seed_invoice\n"
      - path: "/sdcard/Documents/bench_files_lab/incoming/seed_photo.txt"
        text: "seed_photo\n"
      - path: "/sdcard/Documents/bench_files_lab/incoming/tmp_discard.txt"
        text: "tmp_discard\n"
      - path: "/sdcard/Documents/bench_files_lab/incoming/route_plan.txt"
        text: "FINAL ROUTE: create archive/processed and archive/review. Move seed_note.txt to archive/processed/receipt_note.txt. Move seed_invoice.txt to archive/processed/invoice_note.txt. Move seed_photo.txt to archive/review/photo_manifest.txt. Delete tmp_discard.txt and this route_plan.txt. Leave incoming empty.\n"
      - path: "/sdcard/Documents/bench_files_lab/incoming/draft_plan.txt"
        text: "DRAFT ONLY: put everything in archive/draft. Ignore this file and delete it.\n"
    clear_app_data: true
    wait_ms: 1200
evaluation:
  evaluator_id: evaluators.android.filesystem_state:ExternalStoragePathStateEvaluator
  params:
    expected_paths:
      - path: "/sdcard/Documents/bench_files_lab/archive/processed"
        type: dir
      - path: "/sdcard/Documents/bench_files_lab/archive/processed/receipt_note.txt"
        type: file
      - path: "/sdcard/Documents/bench_files_lab/archive/processed/invoice_note.txt"
        type: file
      - path: "/sdcard/Documents/bench_files_lab/archive/review"
        type: dir
      - path: "/sdcard/Documents/bench_files_lab/archive/review/photo_manifest.txt"
        type: file
    forbidden_paths:
      - path: "/sdcard/Documents/bench_files_lab/incoming/seed_note.txt"
        type: any
      - path: "/sdcard/Documents/bench_files_lab/incoming/receipt_note.txt"
        type: any
      - path: "/sdcard/Documents/bench_files_lab/incoming/seed_invoice.txt"
        type: any
      - path: "/sdcard/Documents/bench_files_lab/incoming/invoice_note.txt"
        type: any
      - path: "/sdcard/Documents/bench_files_lab/incoming/seed_photo.txt"
        type: any
      - path: "/sdcard/Documents/bench_files_lab/incoming/photo_manifest.txt"
        type: any
      - path: "/sdcard/Documents/bench_files_lab/incoming/tmp_discard.txt"
        type: any
      - path: "/sdcard/Documents/bench_files_lab/incoming/route_plan.txt"
        type: any
      - path: "/sdcard/Documents/bench_files_lab/incoming/draft_plan.txt"
        type: any
    exact_directory_entries:
      - path: "/sdcard/Documents/bench_files_lab"
        entries: ["archive", "incoming"]
      - path: "/sdcard/Documents/bench_files_lab/incoming"
        entries: []
      - path: "/sdcard/Documents/bench_files_lab/archive"
        entries: ["processed", "review"]
      - path: "/sdcard/Documents/bench_files_lab/archive/processed"
        entries: ["invoice_note.txt", "receipt_note.txt"]
      - path: "/sdcard/Documents/bench_files_lab/archive/review"
        entries: ["photo_manifest.txt"]
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [material_files, files, local_storage, hard, benchmark]
  app: "Material Files"
  app_bundle_id: me.zhanghai.android.files
  difficulty: hard
  observed_agent_steps: 32
  description: "Create an archive subfolder, move and rename two seeded files, then verify the source folder is empty before ending on the archived files."
