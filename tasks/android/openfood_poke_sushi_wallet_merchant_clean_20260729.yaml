instruction: |-
  Execute a series of customer, support, wallet, and merchant operations in the OpenFood app while signed in as Lucas Lin, concluding with the app remaining signed in and displayed on the Merchant page. The final state must include four delivered orders with specific item quantities and applied coupons, a submitted support ticket, a redeemed wallet voucher, and a closed merchant status.

  The first order must be placed at Central La Jolla Poke No. 21 San Diego CA, identified by searching for `poke` in the Restaurants section, filtering by Mexican cuisine, and sorting by Rating. The cart for this order must contain Roasted San Diego California Burrito Wrap, Roasted San Diego California Burrito Noodles, Roasted San Diego California Burrito Rice, and Roasted San Diego California Burrito Soup, with the quantities for the Wrap, Noodles, and Rice set to 2 each and the Soup at 1. The coupon WELCOME12 - $12 off orders over $30 must be applied, and the order must be advanced through its status flow until it reaches Delivered.

  A support ticket must be created and submitted with the subject `Poke menu review` and the message `Review poke listing`. In the Wallet section, the voucher code `LUNCH5` must be redeemed.

  The second order must be initiated by using the Reorder function on the first delivered Central La Jolla Poke No. 21 San Diego CA order. The resulting cart must have the quantities for the Wrap, Noodles, and Rice increased to 3 each and the Soup to 2. The coupon LUNCH5 - $5 off orders over $15 must be applied, and the order must be advanced through its status flow until it reaches Delivered.

  The third order must be initiated by using the Reorder function on the second delivered Central La Jolla Poke No. 21 San Diego CA order. The resulting cart must have the quantities for the Wrap, Noodles, and Rice increased to 4 each and the Soup to 3. The coupon WELCOME12 - $12 off orders over $30 must be applied, and the order must be advanced through its status flow until it reaches Delivered.

  The fourth order must be placed at Nigiri Room San Francisco Bay Area CA 30, identified by searching for `sushi` in the Restaurants section, filtering by Sushi cuisine, and sorting by Fastest. The cart must contain one each of Salmon Avocado Roll, Spicy Tuna Roll, and Nigiri Combo. The coupon LUNCH5 - $5 off orders over $15 must be applied, and the order must be advanced through its status flow until it reaches Delivered.

  On the Merchant page, Golden Curry Garden No. 35 San Jose CA must be marked as closed. The app must remain signed in as Lucas Lin on the Merchant page without signing out.
