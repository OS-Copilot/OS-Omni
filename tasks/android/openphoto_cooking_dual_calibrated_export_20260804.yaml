task_id: android.openphoto.cooking_dual_calibrated_export_20260804
platform: android
instruction: |-
  In OpenPhotoEdit on the Android device, produce two exported images from the specified cooking photos, each with a natural documentary-style edit, and leave the application on the outdoor photo’s editor page.

  The first deliverable is an exported image of the indoor cooking photo that shows multiple people preparing food around cookware and has a three-color calibration area in its upper-right corner. This image must carry the following adjustments: in the Edit tools, Exposure at +9, Brightness at +7, Contrast at +6, Temperature at +8, and Saturation at +5; in the Landscape tools, Structure at +10 and HDR at +12; in the HSL tools, Orange with Luminance at +8 and Saturation at +6, and Yellow with Hue at -3; and in the Filters tools, the Clean filter with an Amount of 16. The completed indoor working copy must be discarded after export, leaving no residual indoor project on the OpenPhotoEdit home screen.

  The second deliverable is an exported image of the outdoor cooking photo that shows multiple people gathered around an outdoor cooking area and has a three-color calibration area in its upper-right corner. This image must be distinct from the previously exported indoor image and must carry the following adjustments: in the Landscape tools, Structure at +12, Foliage at +8, Sky at +6, and HDR at +10; in the Edit tools, Exposure at +6, Brightness at +5, Contrast at +8, and Temperature at +6; in the HSL tools, Green with Saturation at +8 and Luminance at +5, and Orange with Luminance at +6; and in the Filters tools, the Clean filter with an Amount of 14. At completion, the outdoor image must be exported, and the application state must remain on the current OpenPhotoEdit editor page with the editor controls visible, without returning to the home screen or signing out.
