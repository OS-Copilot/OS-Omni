instruction: |-
  Execute a continuous operations handoff workflow in the OpenTwitter app while remaining signed in as Alex Chen.

  The Explore section must contain three specific post interactions. Under the For you section, the trending topic “AI assistant rollout” must include a post by Hana Kim whose body begins with “Assistant rollout plan update:”; this post must be liked once, saved once, and replied to with the exact text “Handoff copy works” published only once. Under the Trending section, the “Incident reviews” trend must include a post by Devon Brooks whose body begins with “Post-incident note:”, explicitly excluding any post by Devon Brooks that begins with “Runbooks age quietly.”; this target post must be reposted once, saved once, and replied to with the exact text “Comms owner is set” published only once. Under the Technology section, the “Security reviews” trend must include a post by Priya Shah whose body begins with “Security review reminder:”, excluding other posts by Priya Shah; this post must be liked once, saved once, and replied to with the exact text “Audit trail checked” published only once.

  The Messages section must contain four new direct messages sent in sequence: “Handoff copy ready.” to Hana Kim, “Comms owner noted” to Devon Brooks, “Ops audit complete.” to Priya Shah, and “Ops recap shared.” to Nora Fields.

  The Home feed must contain two new posts created in sequence: first “Ops review complete”, then “Handoff plan ready”. The “Handoff plan ready” post must have a reply with the exact text “Owner have signed”, and that same post must be liked, saved, and reposted once each.

  The Notifications section must have all notifications marked as read. The Messages section must contain a final message “Focus note shared.” sent to Maya Patel. The task is complete when the Maya Patel conversation screen is visible and the account remains signed in.
