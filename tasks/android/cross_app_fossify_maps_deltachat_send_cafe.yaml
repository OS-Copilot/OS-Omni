task_id: android.fossify_maps_deltachat.send_cafe_address
platform: android
instruction: Check today's Bench Coffee Task in Fossify Calendar, use the FINAL target in that note to find the right cafe in Organic Maps, then send benchrecv@example.test exactly one ASCII line in Delta Chat in the format '<place name> - <full address shown in Organic Maps>'. The note includes draft/casino/cafe distractors; ignore them. The line must include the street number, street name, postcode, Monaco, and no words from the distractor cafe.
init:
  initializer_id: initializers.android.calendar_map_deltachat:CalendarMapDeltaChatInitializer
  params:
    api_base_url: "http://127.0.0.1:8081"
    calendar_package: "org.fossify.calendar"
    map_package: "app.organicmaps.web"
    delta_chat_package: "chat.delta"
    reset_app_data: true
    calendar_event_title: "Bench Coffee Task"
    calendar_event_location: "Monaco"
    calendar_event_description: "DRAFT target: Cafe de Paris Monte-Carlo near the casino; ignore this. DECOY target: any casino address; ignore this. FINAL target: find the place titled Richmond Bar on Boulevard Princesse Charlotte in Monaco. Final reply rule: send one ASCII line as <place name> - <full address shown in Organic Maps>; include street number, street name, postcode, and Monaco; do not include Cafe de Paris or casino."
    map_region_query: "Monaco"
    map_target_query: "Richmond Bar Monaco"
    map_target_title: "Richmond Bar"
    seed_map_files_from_host: true
    organic_maps_apk_path: ".cache/apks/OrganicMaps-26040708-web-release.apk"
    organic_maps_cache_dir: ".cache/organicmaps"
    organic_map_file_ids:
      - "World"
      - "WorldCoasts"
      - "Monaco"
    purge_greenmail: true
    seed_sender_email: "benchrecv@example.test"
    seed_sender_password: "benchpass"
    seed_recipient_email: "benchsender@example.test"
    seed_subject: "Seed existing chat"
    seed_body: "seed_existing_chat_message"
    seed_smtp_host: "127.0.0.1"
    seed_smtp_port: 3025
evaluation:
  evaluator_id: evaluators.android.calendar_map_deltachat:CalendarMapDeltaChatEvaluator
  params:
    api_base_url: "http://127.0.0.1:8081"
    sender_email: "benchsender@example.test"
    recipient_email: "benchrecv@example.test"
    required_substrings:
      - "Richmond Bar"
      - "Boulevard Princesse Charlotte"
      - " - "
      - "20"
      - "98000"
      - "Monaco"
    forbidden_substrings:
      - "Cafe de Paris"
      - "casino"
      - "Casino"
    mailbox: "INBOX"
    timeout_seconds: 60
    poll_interval_seconds: 1
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [calendar, maps, deltachat, greenmail, multimodal, cross_app, hard, benchmark]
  app: "Fossify Calendar + Organic Maps + Delta Chat"
  difficulty: hard
  description: "Read today's event from Fossify Calendar, ignore draft/casino distractors, find the target cafe in Organic Maps, and send the resolved cafe name plus full address through Delta Chat."
  prerequisites:
    - "Fossify Calendar is installed on the emulator."
    - "Organic Maps is installed on the emulator."
    - "Delta Chat already contains the benchsender@example.test account configured against GreenMail."
    - "GreenMail is running on the host and reachable at http://127.0.0.1:8081."
