  Create two new transfer recipients and submit two new transfers in the Transfers section of the OpenBank application. The first recipient record must contain the name "Lena Wu", account number "2946081375", routing number "121000358", bank "OpenBank", and nickname "Design split". The second recipient record must contain the name "Marco Li", account number "5831974062", routing number "122105155", bank "OpenBank", and nickname "Studio rent". The first transfer must be sent to Lena Wu from the "Everyday Checking ••••2381" account with a memo of "Design split", an amount of "4.20", and a date of "2026-06-01". The second transfer must be sent to Marco Li with a memo of "Studio rent" and an amount of "1.25".

  In the Activity section, the search results for transactions with the description "Studio rent" must be filtered by the "Transfer" category, "Posted" status, and "Last 30 days" time range. A dispute must be submitted for the "Transfer to Marco Li" entry with the details "Unknown rent debit".

  In the Security section, the alert settings must be updated so that the "Push" notification for "Large purchase" is turned off and saved, the "Text" notification for "Low balance" is turned on and saved, the "Upcoming bill" alert is marked as read, and the "Text" notification for "Payment due" is turned on and saved. The "OpenBank Rewards Card", which is currently in an "Unlocked" state, must be locked.

  In the Statements section, the delivery preference for the "Rainy Day Savings •••9140" statement must be changed from "Paper" to "Go paperless".
