task_id: android.fossify_gallery.rename_photo
platform: android
instruction: In Fossify Gallery, rename only the FINAL photos inside bench_gallery_lab and keep every album membership unchanged. In camera, rename blue.jpg to travel_blue_FINAL_774.jpg, red.jpg to cover_red_FINAL_203.jpg, and blue_route_card.jpg to route_card_BLUE_17_40.jpg. Leave blue_draft.jpg and red_backup.jpg unchanged. In receipts, rename green.jpg to receipt_green_FINAL_9.jpg and vendor_coupon.jpg to vendor_coupon_FINAL_515.jpg. Leave green_draft.jpg unchanged. In archive, rename old_route.jpg to route_archive_FINAL_BLUE_303.jpg and invoice_archive.jpg to invoice_archive_FINAL_404.jpg. Leave archive_hold.jpg unchanged. Do not move photos between albums and do not delete anything.
init:
  initializer_id: initializers.android.fossify_gallery:FossifyGalleryRenamePhotoInitializer
  params:
    app_package: "org.fossify.gallery"
    app_activity: ".activities.SplashActivity.Green"
    workspace_root: "/sdcard/Pictures/bench_gallery_lab"
    extra_media_files:
      - path: "/sdcard/Pictures/bench_gallery_lab/camera/blue_route_card.jpg"
        color: blue
      - path: "/sdcard/Pictures/bench_gallery_lab/camera/blue_draft.jpg"
        color: blue
      - path: "/sdcard/Pictures/bench_gallery_lab/camera/red_backup.jpg"
        color: red
      - path: "/sdcard/Pictures/bench_gallery_lab/receipts/vendor_coupon.jpg"
        color: red
      - path: "/sdcard/Pictures/bench_gallery_lab/receipts/green_draft.jpg"
        color: green
      - path: "/sdcard/Pictures/bench_gallery_lab/archive/old_route.jpg"
        color: blue
      - path: "/sdcard/Pictures/bench_gallery_lab/archive/invoice_archive.jpg"
        color: red
      - path: "/sdcard/Pictures/bench_gallery_lab/archive/archive_hold.jpg"
        color: green
    clear_app_data: true
    wait_ms: 1500
evaluation:
  evaluator_id: evaluators.android.filesystem_state:ExternalStoragePathStateEvaluator
  params:
    expected_paths:
      - path: "/sdcard/Pictures/bench_gallery_lab/camera/travel_blue_FINAL_774.jpg"
        type: file
      - path: "/sdcard/Pictures/bench_gallery_lab/camera/cover_red_FINAL_203.jpg"
        type: file
      - path: "/sdcard/Pictures/bench_gallery_lab/camera/route_card_BLUE_17_40.jpg"
        type: file
      - path: "/sdcard/Pictures/bench_gallery_lab/camera/blue_draft.jpg"
        type: file
      - path: "/sdcard/Pictures/bench_gallery_lab/camera/red_backup.jpg"
        type: file
      - path: "/sdcard/Pictures/bench_gallery_lab/receipts/receipt_green_FINAL_9.jpg"
        type: file
      - path: "/sdcard/Pictures/bench_gallery_lab/receipts/vendor_coupon_FINAL_515.jpg"
        type: file
      - path: "/sdcard/Pictures/bench_gallery_lab/receipts/green_draft.jpg"
        type: file
      - path: "/sdcard/Pictures/bench_gallery_lab/archive/route_archive_FINAL_BLUE_303.jpg"
        type: file
      - path: "/sdcard/Pictures/bench_gallery_lab/archive/invoice_archive_FINAL_404.jpg"
        type: file
      - path: "/sdcard/Pictures/bench_gallery_lab/archive/archive_hold.jpg"
        type: file
    forbidden_paths:
      - path: "/sdcard/Pictures/bench_gallery_lab/camera/blue.jpg"
        type: any
      - path: "/sdcard/Pictures/bench_gallery_lab/camera/red.jpg"
        type: any
      - path: "/sdcard/Pictures/bench_gallery_lab/camera/blue_route_card.jpg"
        type: any
      - path: "/sdcard/Pictures/bench_gallery_lab/receipts/green.jpg"
        type: any
      - path: "/sdcard/Pictures/bench_gallery_lab/receipts/vendor_coupon.jpg"
        type: any
      - path: "/sdcard/Pictures/bench_gallery_lab/archive/old_route.jpg"
        type: any
      - path: "/sdcard/Pictures/bench_gallery_lab/archive/invoice_archive.jpg"
        type: any
    exact_directory_entries:
      - path: "/sdcard/Pictures/bench_gallery_lab/camera"
        entries: ["blue_draft.jpg", "cover_red_FINAL_203.jpg", "red_backup.jpg", "route_card_BLUE_17_40.jpg", "travel_blue_FINAL_774.jpg"]
      - path: "/sdcard/Pictures/bench_gallery_lab/receipts"
        entries: ["green_draft.jpg", "receipt_green_FINAL_9.jpg", "vendor_coupon_FINAL_515.jpg"]
      - path: "/sdcard/Pictures/bench_gallery_lab/archive"
        entries: ["archive_hold.jpg", "invoice_archive_FINAL_404.jpg", "route_archive_FINAL_BLUE_303.jpg"]
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [fossify_gallery, gallery, media, hard, benchmark]
  app: "Fossify Gallery"
  app_bundle_id: org.fossify.gallery
  difficulty: hard
  observed_agent_steps: 12
  description: "Rename a routed set of final photos across three albums while preserving similarly named draft/hold decoys and keeping album membership unchanged."
