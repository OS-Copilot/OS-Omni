task_id: android.calendar_shopping.home_delivery_reminder_hard
platform: android
instruction: Check the BMK Home Refresh Order event in Fossify Calendar and carry out only the shopping work and follow-up reminder work it asks for. There are older BMK draft events that look similar; delete those draft BMK events after you identify they are not the active order. If OpenShop asks you to sign in, use phone 13800138000 and password spring2026.
init:
  initializer_id: initializers.android.calendar_shopping_cross_app:CalendarShoppingCrossAppInitializer
  params:
    app_package: "org.fossify.calendar"
    database_path: "/data/user/0/org.fossify.calendar/databases/events.db"
    timezone: "UTC"
    clear_calendar_data: true
    clear_openshop_data: true
    seed_events:
      - title: "BMK Home Refresh Order"
        start: "2026-05-06T18:00:00"
        end: "2026-05-06T18:45:00"
        location: "OpenShop"
        description: "Active order. Order Garden White Cotton Bedding Set 1.8m x2 with spec 200x230cm, Polar Day Slim Business Backpack x1 with spec External USB port, Mountain Isle Pour-Over Coffee 20 Pack x1 with spec 20 sachets, and Lumen Magnetic Phone Stand x1 with spec Aluminum alloy. Use the Home address, Cash on Delivery, and exact order note \"Home refresh calendar order: bedding x2, backpack, coffee, stand.\" Then create two calendar events: \"BMK Home Delivery Reminder\" on 2026-05-07 from 7:00 PM to 7:30 PM at \"Home\" with description \"Watch for OpenShop COD delivery\", and \"BMK Home Setup Check\" on 2026-05-08 from 8:15 PM to 8:45 PM at \"Home\" with description \"Confirm bedding, backpack, coffee, and stand are ready\"."
      - title: "BMK Home Refresh Draft"
        start: "2026-05-06T16:00:00"
        end: "2026-05-06T16:30:00"
        location: "OpenShop"
        description: "Draft only. Do not order headphones. Delete this BMK draft."
      - title: "BMK Home Delivery Old Reminder"
        start: "2026-05-07T18:00:00"
        end: "2026-05-07T18:30:00"
        location: "Home"
        description: "Old reminder. Delete this BMK draft."
    wait_ms: 1500
evaluation:
  evaluator_id: evaluators.android.calendar_shopping_cross_app:CalendarShoppingCrossAppEvaluator
  params:
    calendar:
      database_path: "/data/user/0/org.fossify.calendar/databases/events.db"
      timezone: "UTC"
      expected_events:
        - title: "BMK Home Refresh Order"
          start: "2026-05-06T18:00:00"
          end: "2026-05-06T18:45:00"
          location: "OpenShop"
          description: "Active order. Order Garden White Cotton Bedding Set 1.8m x2 with spec 200x230cm, Polar Day Slim Business Backpack x1 with spec External USB port, Mountain Isle Pour-Over Coffee 20 Pack x1 with spec 20 sachets, and Lumen Magnetic Phone Stand x1 with spec Aluminum alloy. Use the Home address, Cash on Delivery, and exact order note \"Home refresh calendar order: bedding x2, backpack, coffee, stand.\" Then create two calendar events: \"BMK Home Delivery Reminder\" on 2026-05-07 from 7:00 PM to 7:30 PM at \"Home\" with description \"Watch for OpenShop COD delivery\", and \"BMK Home Setup Check\" on 2026-05-08 from 8:15 PM to 8:45 PM at \"Home\" with description \"Confirm bedding, backpack, coffee, and stand are ready\"."
        - title: "BMK Home Delivery Reminder"
          start: "2026-05-07T19:00:00"
          end: "2026-05-07T19:30:00"
          location: "Home"
          description: "Watch for OpenShop COD delivery"
        - title: "BMK Home Setup Check"
          start: "2026-05-08T20:15:00"
          end: "2026-05-08T20:45:00"
          location: "Home"
          description: "Confirm bedding, backpack, coffee, and stand are ready"
      absent_titles:
        - "BMK Home Refresh Draft"
        - "BMK Home Delivery Old Reminder"
      strict_benchmark_titles: true
      timeout_seconds: 10
      poll_interval_seconds: 1
    openshop:
      app_package: com.killt.openshop
      session_logged_in: true
      cart_size: 0
      order_count: 1
      latest_order:
        address_id: addr-home
        payment_method_id: cod
        note: "Home refresh calendar order: bedding x2, backpack, coffee, stand."
        status: "Awaiting Shipment"
        items:
          - product_id: p1003
            quantity: 2
            selected_spec: "200x230cm"
          - product_id: p1004
            quantity: 1
            selected_spec: "External USB port"
          - product_id: p1005
            quantity: 1
            selected_spec: "20 sachets"
          - product_id: p1006
            quantity: 1
            selected_spec: "Aluminum alloy"
      timeout_seconds: 12
      poll_interval_seconds: 0.5
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [calendar, shopping, fossify_calendar, openshop, checkout, cross_app, hard, benchmark]
  app: "Fossify Calendar + OpenShop"
  app_bundle_id: org.fossify.calendar
  description: "Read a calendar home-refresh order, complete a OpenShop checkout with exact specs, and create a delivery reminder."
  difficulty_basis: "Human path is over 20 steps because it requires reading a calendar event, logging in, adding products with exact specs and quantity changes, checkout details, placing the order, and creating a reminder event."
  prerequisites:
    - "Fossify Calendar and OpenShop are installed on the emulator."
  difficulty: hard
