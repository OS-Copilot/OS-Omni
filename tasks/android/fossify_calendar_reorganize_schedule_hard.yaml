task_id: android.fossify_calendar.reorganize_schedule_hard
platform: android
instruction: 'Please clean up the BMK schedule in Fossify Calendar. The event BMK Candidate Alpha contains the final routing plan in its description. Apply that plan exactly, delete the candidate/draft BMK events that the plan says are obsolete, preserve the hold event it says to preserve, and create every final BMK event named in the plan. Ignore any conflicting candidate event titles or old draft details.'
init:
  initializer_id: initializers.android.fossify_calendar:FossifyCalendarInitializer
  params:
    app_package: "org.fossify.calendar"
    database_path: "/data/user/0/org.fossify.calendar/databases/events.db"
    timezone: "UTC"
    clear_app_data: true
    seed_events:
      - title: "BMK Candidate Alpha"
        start: "2026-04-30T13:00:00"
        end: "2026-04-30T14:00:00"
        location: "Room 301"
        description: "FINAL ROUTING PLAN: convert this event into BMK Final Review on 2026-05-03 16:00-17:30 at Conference Room A with description Review final release notes. Delete BMK Candidate Beta and BMK Draft Vendor Sync. Preserve BMK Logistics Hold unchanged. Add BMK Release Window on 2026-05-04 10:00-11:00 at Ops Room with description Monitor release window. Add BMK Backup Call on 2026-05-05 18:00-18:30 at Zoom with description Backup owner check-in. Ignore any candidate title that conflicts with this description."
      - title: "BMK Candidate Beta"
        start: "2026-05-01T13:00:00"
        end: "2026-05-01T14:00:00"
        location: "Room 302"
        description: "Beta candidate slot"
      - title: "BMK Draft Vendor Sync"
        start: "2026-05-02T12:00:00"
        end: "2026-05-02T12:30:00"
        location: "Room 305"
        description: "Outdated vendor candidate"
      - title: "BMK Logistics Hold"
        start: "2026-05-02T08:30:00"
        end: "2026-05-02T09:00:00"
        location: "Ops Desk"
        description: "Keep this logistics hold"
    wait_ms: 1500
evaluation:
  evaluator_id: evaluators.android.fossify_calendar:FossifyCalendarEventStateEvaluator
  params:
    database_path: "/data/user/0/org.fossify.calendar/databases/events.db"
    timezone: "UTC"
    expected_events:
      - title: "BMK Final Review"
        start: "2026-05-03T16:00:00"
        end: "2026-05-03T17:30:00"
        location: "Conference Room A"
        description: "Review final release notes"
      - title: "BMK Logistics Hold"
        start: "2026-05-02T08:30:00"
        end: "2026-05-02T09:00:00"
        location: "Ops Desk"
        description: "Keep this logistics hold"
      - title: "BMK Release Window"
        start: "2026-05-04T10:00:00"
        end: "2026-05-04T11:00:00"
        location: "Ops Room"
        description: "Monitor release window"
      - title: "BMK Backup Call"
        start: "2026-05-05T18:00:00"
        end: "2026-05-05T18:30:00"
        location: "Zoom"
        description: "Backup owner check-in"
    absent_titles:
      - "BMK Candidate Alpha"
      - "BMK Candidate Beta"
      - "BMK Draft Vendor Sync"
    strict_benchmark_titles: true
    timeout_seconds: 10
    poll_interval_seconds: 1
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [calendar, fossify_calendar, productivity, edit, delete, multi_event, hard, benchmark]
  app: "Fossify Calendar"
  app_bundle_id: org.fossify.calendar
  description: "Rename and reschedule one seeded event, delete obsolete candidate events, preserve a hold, and create two final follow-up events from the routing plan."
  difficulty_basis: "Human path is hard because it requires extracting the authoritative plan from an event description, ignoring conflicting draft titles, editing one existing event, deleting obsolete events, preserving a hold, and creating two detailed follow-ups."
  prerequisites:
    - "Fossify Calendar is installed on the emulator."
  difficulty: hard
