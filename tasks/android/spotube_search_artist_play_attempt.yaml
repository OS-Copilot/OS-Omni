task_id: android.spotube.search_artist_play_attempt
platform: android
instruction: In Spotube, search for A. R. Rahman, open the artist result for exactly A. R. Rahman rather than a song, playlist, or similarly named result, and tap a song from that artist page to start a fresh play attempt. Leave Spotube in the foreground with A. R. Rahman still visible in the page or mini-player.
init:
  initializer_id: initializers.android.spotube_open_clean_session:SpotubeOpenCleanSessionInitializer
  params:
    app_package: "oss.krtirtho.spotube"
    app_activity: "com.ryanheise.audioservice.AudioServiceActivity"
    clear_external_log: true
    external_log_path: "/sdcard/Android/data/oss.krtirtho.spotube/files/.spotube_logs"
    wait_ms: 2200
evaluation:
  evaluator_id: evaluators.android.spotube_search_artist_play_attempt:SpotubeSearchArtistPlayAttemptEvaluator
  params:
    app_package: "oss.krtirtho.spotube"
    artist_name: "A. R. Rahman"
    max_media_updated_age_seconds: 20
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [spotube, android, search, artist, play_attempt, hard, benchmark]
  app: Spotube
  app_bundle_id: oss.krtirtho.spotube
  difficulty: hard
  description: "Search a punctuation-heavy artist name in Spotube, open the artist result rather than near-match content, and click a song to trigger a fresh play attempt."
  prerequisites:
    - "Spotube is installed on the emulator."
    - "Spotify login is already completed in Spotube."
