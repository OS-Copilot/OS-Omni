task_id: android.tasks_org.create_task_with_subtasks
platform: android
instruction: 'In Tasks.org, the list already contains seeded weekend-errand decoys. Delete exactly the stale top-level task Weekend errands - duplicate charger draft. Preserve the other four seeded top-level tasks unchanged. Then create exactly one new top-level parent task titled Weekend errands - final route blue. Its description must be exactly these three lines: bench_weekend_errands_note_v5 / route=blue owner=family window=Sat-09:30 / keep=beans,laptop,water,tickets,Mei,keys,charger,photos. Set the parent task due four days from today. Add exactly seven subtasks in this exact order and with no extras: Buy beans, Charge laptop, Refill water, Print tickets, Text Mei, Find spare keys, Back up ticket photos. Do not create duplicate subtasks, reminders, completed tasks, or any other top-level task.'
init:
  initializer_id: initializers.android.tasks_org:TasksOrgCreateTaskWithSubtasksInitializer
  params:
    app_package: "org.tasks"
    app_activity: "com.todoroo.astrid.activity.TaskListActivity"
    clear_app_data: true
    open_blank_editor: false
    seed_tasks:
      - title: "Weekend errands - draft snacks"
        note: "seeded keep: snack draft remains for comparison"
        order_index: 1
      - title: "Weekend errands - old parking pass"
        note: "seeded keep: parking pass is not part of final parent"
        due_day_offset: 2
        order_index: 2
      - title: "Weekend errands - red route"
        note: "seeded keep: wrong route decoy"
        order_index: 3
      - title: "Weekend errands - supplies hold"
        note: "seeded keep: hold task unchanged"
        due_day_offset: 4
        order_index: 4
      - title: "Weekend errands - duplicate charger draft"
        note: "seeded delete: duplicate charger draft"
        order_index: 5
    wait_ms: 1200
evaluation:
  evaluator_id: evaluators.android.tasks_org:TasksOrgTaskWithSubtasksEvaluator
  params:
    parent_title: "Weekend errands - final route blue"
    parent_note: |-
      bench_weekend_errands_note_v5
      route=blue owner=family window=Sat-09:30
      keep=beans,laptop,water,tickets,Mei,keys,charger,photos
    subtasks: ["Buy beans", "Charge laptop", "Refill water", "Print tickets", "Text Mei", "Find spare keys", "Back up ticket photos"]
    due_day_offset: 4
    preserved_top_level_tasks:
      - title: "Weekend errands - draft snacks"
        note: "seeded keep: snack draft remains for comparison"
      - title: "Weekend errands - old parking pass"
        note: "seeded keep: parking pass is not part of final parent"
        due_day_offset: 2
      - title: "Weekend errands - red route"
        note: "seeded keep: wrong route decoy"
      - title: "Weekend errands - supplies hold"
        note: "seeded keep: hold task unchanged"
        due_day_offset: 4
    forbidden_top_level_titles:
      - "Weekend errands - duplicate charger draft"
    timeout_seconds: 20
    poll_interval_seconds: 1
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [tasks_org, productivity, local_db, hard, benchmark]
  app: "Tasks.org"
  app_bundle_id: org.tasks
  difficulty: hard
  observed_agent_steps: 33
  description: "From a seeded decoy list, delete one stale task, preserve four similar top-level tasks, then create one exact parent with strict multiline note, due date, and seven ordered subtasks."
