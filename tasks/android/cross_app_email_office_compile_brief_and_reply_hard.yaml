task_id: android.email_office.compile_brief_and_reply_hard
platform: android
instruction: In K-9 Mail, first read the email titled BMK Office Brief Routing to discover which input emails are authoritative and which similarly named emails are noise. Use only the authoritative inputs to update office_brief.md in Markor, then use K-9 Mail (not Gmail) to send the completion email described by the routing memo.
init:
  initializer_id: initializers.android.email_office_cross_app:EmailOfficeCrossAppInitializer
  params:
    filename: "office_brief.md"
    document_format: "markdown"
    open_app: "k9"
    document_lines:
      - "BMK Office Brief"
      - "Alpha: pending"
      - "Beta: pending"
      - "Gamma: pending"
      - "Delta: pending"
      - "Decision: pending"
    reset_app_data: true
    seed_messages:
      - sender_email: "benchrecv@example.test"
        sender_password: "benchpass"
        recipient_email: "benchsender@example.test"
        subject: "BMK Office Brief Routing"
        body: "Authoritative inputs: BMK Alpha Office Input, BMK Beta Office Input, BMK Gamma Office Input, BMK Delta Office Input. Ignore subjects containing DRAFT or Noise. Update office_brief.md with Alpha/Beta/Gamma/Delta plus Escalation and Decision. Send benchrecv@example.test subject BMK Office Brief Complete."
      - sender_email: "benchrecv@example.test"
        sender_password: "benchpass"
        recipient_email: "benchsender@example.test"
        subject: "BMK Alpha Office Input"
        body: "Alpha line for the brief: printer room ready"
      - sender_email: "benchrecv@example.test"
        sender_password: "benchpass"
        recipient_email: "benchsender@example.test"
        subject: "BMK Beta Office Input"
        body: "Beta line for the brief: visitor badges ready."
      - sender_email: "benchrecv@example.test"
        sender_password: "benchpass"
        recipient_email: "benchsender@example.test"
        subject: "BMK Gamma Office Input"
        body: "Gamma line for the brief: security desk briefed. Final decision: release office memo after 4 PM."
      - sender_email: "benchrecv@example.test"
        sender_password: "benchpass"
        recipient_email: "benchsender@example.test"
        subject: "BMK Delta Office Input"
        body: "Delta line for the brief: visitor Wi-Fi reset queued. Escalation owner: Nia."
      - sender_email: "benchrecv@example.test"
        sender_password: "benchpass"
        recipient_email: "benchsender@example.test"
        subject: "BMK Alpha Office Input DRAFT"
        body: "Ignore this draft: printer room blocked."
      - sender_email: "benchrecv@example.test"
        sender_password: "benchpass"
        recipient_email: "benchsender@example.test"
        subject: "BMK Office Noise"
        body: "Ignore this noise: decision is delayed until next week."
    wait_ms: 2000
evaluation:
  evaluator_id: evaluators.android.email_office_cross_app:EmailOfficeCrossAppEvaluator
  params:
    filename: "office_brief.md"
    document_format: "markdown"
    required_document_texts:
      - "Alpha: printer room ready"
      - "Beta: visitor badges ready"
      - "Gamma: security desk briefed"
      - "Delta: visitor Wi-Fi reset queued"
      - "Escalation: Nia"
      - "Decision: release office memo after 4 PM"
    absent_document_texts:
      - "Alpha: pending"
      - "Beta: pending"
      - "Gamma: pending"
      - "Delta: pending"
      - "Decision: pending"
      - "printer room blocked"
      - "decision is delayed until next week"
    expected_emails:
      - recipient_email: "benchrecv@example.test"
        sender_email: "benchsender@example.test"
        subject: "BMK Office Brief Complete"
        body_contains:
          - "printer room ready"
          - "visitor badges ready"
          - "security desk briefed"
          - "visitor Wi-Fi reset queued"
          - "Nia"
          - "release office memo after 4 PM"
    email_timeout_seconds: 25
    email_poll_interval_seconds: 1
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [email, office, markor, k9, greenmail, cross_app, hard, benchmark]
  app: "K-9 Mail + Markor"
  app_bundle_id: com.fsck.k9
  description: "Read three emails, compile their details into a Markor note, save it, and send a completion email."
  difficulty_basis: "Human path is over 20 steps because it involves reading three messages, editing four note lines, saving, switching back to mail, and composing a precise reply."
  prerequisites:
    - "K-9 Mail is configured against GreenMail using adb reverse for ports 3143 and 3025."
    - "Markor is installed on the emulator."
  difficulty: hard
