task_id: android.material_files.create_folder
platform: android
instruction: In Material Files, create a folder named travel_docs in the benchmark files workspace.
init:
  initializer_id: initializers.android.material_files:MaterialFilesCreateFolderInitializer
  params:
    app_package: "me.zhanghai.android.files"
    app_activity: ".filelist.FileListActivity"
    workspace_root: "/sdcard/Documents/bench_files_lab"
    clear_app_data: true
    wait_ms: 1200
evaluation:
  evaluator_id: evaluators.android.filesystem_state:ExternalStoragePathStateEvaluator
  params:
    expected_paths:
      - path: "/sdcard/Documents/bench_files_lab/travel_docs"
        type: dir
    exact_directory_entries:
      - path: "/sdcard/Documents/bench_files_lab"
        entries: ["archive", "incoming", "travel_docs"]
      - path: "/sdcard/Documents/bench_files_lab/incoming"
        entries: ["seed_note.txt"]
      - path: "/sdcard/Documents/bench_files_lab/archive"
        entries: []
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [material_files, files, local_storage, easy, benchmark]
  app: "Material Files"
  app_bundle_id: me.zhanghai.android.files
  difficulty: easy
  observed_agent_steps: 5
  description: "Create a folder in a deterministic workspace using Material Files and verify the result from shared storage."
