task_id: android.k9.manual_setup_send_email
platform: android
instruction: >-
  Use K-9 Mail to read the 10 inbox messages whose subjects start with BMK
  Manual Mail Packet. Each message contains one line in the form "field: value".
  Send one synthesized email to benchrecv@example.test with subject
  HelloWorldBenchManual-IMAP3143, and make the body contain the 10 extracted
  value strings as separate lines. The line order does not matter, but every
  value string must be copied exactly. The sender account is
  benchsender@example.test on the local test mail server 10.0.2.2; the account
  password is benchpass, incoming mail is available via IMAP on port 3143 with
  no encryption, and outgoing mail is available via SMTP on port 3025 with no
  encryption.
init:
  initializer_id: initializers.android.k9_manual_setup:K9ManualSetupInitializer
  params:
    api_base_url: "http://127.0.0.1:8081"
    app_package: "com.fsck.k9"
    app_activity: "net.thunderbird.app.common.MainActivity"
    purge_greenmail: true
    clear_app_data: true
    seed_smtp_host: "127.0.0.1"
    seed_smtp_port: 3025
    default_recipient_email: "benchsender@example.test"
    seed_messages:
      - sender_email: "benchrecv@example.test"
        sender_password: "benchpass"
        subject: "BMK Manual Mail Packet 01 of 10"
        body: |
          triage_code: alpine-17-river
      - sender_email: "benchrecv@example.test"
        sender_password: "benchpass"
        subject: "BMK Manual Mail Packet 02 of 10"
        body: |
          site_label: north loading dock
      - sender_email: "benchrecv@example.test"
        sender_password: "benchpass"
        subject: "BMK Manual Mail Packet 03 of 10"
        body: |
          contact_window: 14:35-15:05
      - sender_email: "benchrecv@example.test"
        sender_password: "benchpass"
        subject: "BMK Manual Mail Packet 04 of 10"
        body: |
          asset_tag: VX-2049-blue
      - sender_email: "benchrecv@example.test"
        sender_password: "benchpass"
        subject: "BMK Manual Mail Packet 05 of 10"
        body: |
          route_phrase: use manual corridor
      - sender_email: "benchrecv@example.test"
        sender_password: "benchpass"
        subject: "BMK Manual Mail Packet 06 of 10"
        body: |
          checksum_note: keep BMK-774 intact
      - sender_email: "benchrecv@example.test"
        sender_password: "benchpass"
        subject: "BMK Manual Mail Packet 07 of 10"
        body: |
          owner_line: owner=bench route=manual
      - sender_email: "benchrecv@example.test"
        sender_password: "benchpass"
        subject: "BMK Manual Mail Packet 08 of 10"
        body: |
          server_line: imap3143 smtp3025 no-encryption
      - sender_email: "benchrecv@example.test"
        sender_password: "benchpass"
        subject: "BMK Manual Mail Packet 09 of 10"
        body: |
          confirmation_line: verified by K-9 manual setup
      - sender_email: "benchrecv@example.test"
        sender_password: "benchpass"
        subject: "BMK Manual Mail Packet 10 of 10"
        body: |
          closing_line: final blue route ready
    wait_ms: 1500
evaluation:
  evaluator_id: evaluators.android.k9_send_email:K9SendEmailEvaluator
  params:
    api_base_url: "http://127.0.0.1:8081"
    sender_email: "benchsender@example.test"
    recipient_email: "benchrecv@example.test"
    subject: "HelloWorldBenchManual-IMAP3143"
    body_lines_unordered:
      - "alpine-17-river"
      - "north loading dock"
      - "14:35-15:05"
      - "VX-2049-blue"
      - "use manual corridor"
      - "keep BMK-774 intact"
      - "owner=bench route=manual"
      - "imap3143 smtp3025 no-encryption"
      - "verified by K-9 manual setup"
      - "final blue route ready"
    mailbox: "INBOX"
    timeout_seconds: 30
    poll_interval_seconds: 1
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [email, k9, greenmail, onboarding, manual_setup, hard, benchmark]
  app: "K-9 Mail"
  app_bundle_id: com.fsck.k9
  description: "Starting from an unconfigured K-9 state, configure the account, read ten seeded inbox messages, synthesize the final recipient/subject/body, and verify delivery through GreenMail."
  prerequisites:
    - "K-9 Mail is installed on the emulator."
    - "GreenMail is running on the host and reachable at http://127.0.0.1:8081."
  difficulty: hard
