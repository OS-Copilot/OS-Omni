task_id: android.tasks_org.create_task_with_note
platform: android
instruction: 'In Tasks.org, the list already contains seeded landlord-call decoys. Delete exactly these two stale top-level tasks: Call landlord - old rent draft and Call landlord - wrong building. Preserve the other four seeded top-level tasks unchanged. Then create exactly one new top-level task titled Call landlord - FINAL BLUE ROUTE. Its description must be exactly these five lines, in this order: bench_tasks_note_v9 / owner=Mei; channel=phone; route=blue / ask: lease renewal, sink repair / window=17:40-18:10 / checksum=LAND-774. Do not create subtasks, reminders, completed tasks, duplicate final tasks, or any other top-level task.'
init:
  initializer_id: initializers.android.tasks_org:TasksOrgCreateTaskInitializer
  params:
    app_package: "org.tasks"
    app_activity: "com.todoroo.astrid.activity.TaskListActivity"
    clear_app_data: true
    open_blank_editor: false
    seed_tasks:
      - title: "Call landlord - old rent draft"
        note: "seeded delete: old rent draft"
        order_index: 1
      - title: "Call landlord - wrong building"
        note: "seeded delete: wrong building decoy"
        order_index: 2
      - title: "Call landlord - HOLD insurance"
        note: "seeded keep: insurance hold, do not edit"
        order_index: 3
      - title: "Call landlord - BLUE reference"
        note: "seeded keep: near-title blue reference"
        order_index: 4
      - title: "Lease packet - KEEP"
        note: "seeded keep: lease packet reminder"
        order_index: 5
      - title: "Mailbox code - KEEP"
        note: "seeded keep: mailbox code source"
        order_index: 6
    wait_ms: 1200
evaluation:
  evaluator_id: evaluators.android.tasks_org:TasksOrgTaskWithNoteEvaluator
  params:
    title: "Call landlord - FINAL BLUE ROUTE"
    note: |-
      bench_tasks_note_v9
      owner=Mei; channel=phone; route=blue
      ask: lease renewal, sink repair
      window=17:40-18:10
      checksum=LAND-774
    preserved_top_level_tasks:
      - title: "Call landlord - HOLD insurance"
        note: "seeded keep: insurance hold, do not edit"
      - title: "Call landlord - BLUE reference"
        note: "seeded keep: near-title blue reference"
      - title: "Lease packet - KEEP"
        note: "seeded keep: lease packet reminder"
      - title: "Mailbox code - KEEP"
        note: "seeded keep: mailbox code source"
    forbidden_top_level_titles:
      - "Call landlord - old rent draft"
      - "Call landlord - wrong building"
    timeout_seconds: 20
    poll_interval_seconds: 1
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [tasks_org, productivity, local_db, easy, benchmark]
  app: "Tasks.org"
  app_bundle_id: org.tasks
  difficulty: easy
  observed_agent_steps: 19
  description: "From a seeded decoy list, delete two stale landlord tasks, preserve four similar top-level tasks, and create one exact five-line final note with strict database validation."
