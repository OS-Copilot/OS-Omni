task_id: android.openphoto.clown_dual_calibrated_export_20260804
platform: android
instruction: |-
  In OpenPhotoEdit, import the clown-makeup side-face portrait with a three-color calibration area in its upper-right corner, corresponding to the source file portrait_17.jpg, and apply a cold-toned stage makeup edit by setting the Exposure to +6, Contrast to +12, Brightness to +5, and Temperature to -4. Within the Portrait tools, set Smooth to +6, Whiten to +3, and Lip Color to +8, and in the HSL tools, select Blue to set its Hue to -6 and Saturation to +16, then select Red to set its Saturation to +12 and Luminance to -4. Apply the Film filter with an Amount of 18 and export the finished side-face image, discarding the working copy of the side-face image after the export completes.

  Import the clown-makeup front-face portrait with a three-color calibration area in its upper-right corner, corresponding to the source file portrait_16.jpg, ensuring the previously exported side-face image is not selected, and apply a second cold-toned stage makeup edit by setting the Exposure to +4, Contrast to +18, Saturation to +6, and Temperature to -3. In the Portrait tools, set Smooth to +5, Whiten to +3, Lip Color to +14, and Rosy to +5, and in the HSL tools, select Cyan to set its Hue to -8 and Saturation to +20, then select Red to set its Saturation to +18 and Luminance to -4. Apply the Clean filter with an Amount of 15 and export the finished front-face image, remaining on the current OpenPhotoEdit editor page for the front-face image with the editor interface still visible, without returning to the home screen or signing out.
