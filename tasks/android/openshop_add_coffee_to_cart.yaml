task_id: android.openshop.add_coffee_to_cart
platform: android
instruction: Find Mountain Isle Pour-Over Coffee 20 Pack in OpenShop and add exactly one unit to the cart.
init:
  initializer_id: initializers.android.openshop:OpenShopFreshOpenInitializer
  params:
    app_package: com.killt.openshop
    app_activity: com.killt.openshop.MainActivity
    clear_app_data: true
    wait_ms: 1800
evaluation:
  evaluator_id: evaluators.android.openshop:OpenShopStateEvaluator
  params:
    app_package: com.killt.openshop
    present_cart_items:
      - product_id: p1005
        quantity: 1
    cart_size: 1
    order_count: 0
    session_logged_in: false
    absent_cart_product_ids:
      - p1001
      - p1002
      - p1003
      - p1004
      - p1006
    timeout_seconds: 10
    poll_interval_seconds: 0.5
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [shopping, android, openshop, cart, search, easy, benchmark]
  app: OpenShop
  app_bundle_id: com.killt.openshop
  description: "Search for one specific product in OpenShop and add it to the cart."
  prerequisites:
    - "OpenShop is installed on the emulator."
  difficulty: easy
