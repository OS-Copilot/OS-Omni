task_id: android.k9.forward_alpha_beta_reports
platform: android
instruction: 'In K-9 Mail (not Gmail), first read BMK Forward Routing. It tells you which report emails are final, which emails are distractors, the recipient, the subject pattern, and the exact body prefix lines. Forward only the final report emails according to that routing memo.'
init:
  initializer_id: initializers.android.k9_seed_inbox_open:K9SeedInboxOpenInitializer
  params:
    api_base_url: "http://127.0.0.1:8081"
    app_package: "com.fsck.k9"
    app_activity: "net.thunderbird.app.common.MainActivity"
    reset_app_data: true
    purge_greenmail: true
    seed_smtp_host: "127.0.0.1"
    seed_smtp_port: 3025
    auto_refresh_inbox: true
    refresh_attempts: 3
    refresh_pause_ms: 1500
    default_recipient_email: "benchsender@example.test"
    seed_messages:
      - sender_email: "reports@example.test"
        sender_password: "reportspass"
        subject: "BMK Forward Routing"
        body: "FINAL REPORTS: Alpha Report, Beta Report, Gamma Report, Delta Report. DISTRACTORS: Weekly Digest, Ops Reminder, any subject containing Draft. RECIPIENT=benchrecv@example.test. SUBJECT PATTERN=Combined Reports - <original subject>. BODY PREFIX LINES: Combined Reports / Source: <original subject> / Routing: final-only."
      - sender_email: "reports@example.test"
        sender_password: "reportspass"
        subject: "Alpha Report"
        body: "alpha_report_unique_marker_2026"
      - sender_email: "reports@example.test"
        sender_password: "reportspass"
        subject: "Beta Report"
        body: "beta_report_unique_marker_2026"
      - sender_email: "reports@example.test"
        sender_password: "reportspass"
        subject: "Gamma Report"
        body: "gamma_report_unique_marker_2026"
      - sender_email: "reports@example.test"
        sender_password: "reportspass"
        subject: "Delta Report"
        body: "delta_report_unique_marker_2026"
      - sender_email: "reports@example.test"
        sender_password: "reportspass"
        subject: "Delta Report Draft"
        body: "delta_report_draft_ignore_marker_2026"
      - sender_email: "newsletter@example.test"
        sender_password: "newsletterpass"
        subject: "Weekly Digest"
        body: "digest_noise_marker_04"
      - sender_email: "ops@example.test"
        sender_password: "opspass"
        subject: "Ops Reminder"
        body: "ops_noise_marker_05"
    wait_ms: 2500
evaluation:
  evaluator_id: evaluators.android.k9_forward_email:K9ForwardAlphaBetaReportsEvaluator
  params:
    api_base_url: "http://127.0.0.1:8081"
    sender_email: "benchsender@example.test"
    recipient_email: "benchrecv@example.test"
    required_prefix_line: "Combined Reports"
    required_forwards:
      - source_subject_contains: "Alpha Report"
        source_body_marker: "alpha_report_unique_marker_2026"
        expected_subject_contains: "Combined Reports - Alpha Report"
        expected_prefix_lines:
          - "Combined Reports"
          - "Source: Alpha Report"
          - "Routing: final-only"
      - source_subject_contains: "Beta Report"
        source_body_marker: "beta_report_unique_marker_2026"
        expected_subject_contains: "Combined Reports - Beta Report"
        expected_prefix_lines:
          - "Combined Reports"
          - "Source: Beta Report"
          - "Routing: final-only"
      - source_subject_contains: "Gamma Report"
        source_body_marker: "gamma_report_unique_marker_2026"
        expected_subject_contains: "Combined Reports - Gamma Report"
        expected_prefix_lines:
          - "Combined Reports"
          - "Source: Gamma Report"
          - "Routing: final-only"
      - source_subject_contains: "Delta Report"
        source_body_marker: "delta_report_unique_marker_2026"
        expected_subject_contains: "Combined Reports - Delta Report"
        expected_prefix_lines:
          - "Combined Reports"
          - "Source: Delta Report"
          - "Routing: final-only"
    mailbox: "INBOX"
    timeout_seconds: 50
    poll_interval_seconds: 1
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [email, k9, forward, greenmail, hard, benchmark]
  app: "K-9 Mail"
  app_bundle_id: com.fsck.k9
  description: "Forward four different seeded report emails with required top body lines, then verify all deliveries."
  prerequisites:
    - "K-9 Mail is installed on the emulator."
    - "The benchsender@example.test account is already configured in K-9."
    - "GreenMail is running on the host and reachable at http://127.0.0.1:8081."
  difficulty: hard
