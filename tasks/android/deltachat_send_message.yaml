task_id: android.deltachat.send_message
platform: android
instruction: |-
  Open the existing Delta Chat conversation with benchrecv@example.test. The incoming message is an instruction card with DRAFT, DECOY, and FINAL sections. Reply only with the exact three-line text after FINAL_RESPONSE=, preserving line breaks, punctuation, case, and the bracketed code. Do not include RESPONSE=, the draft line, the decoy eta, or any explanation. Do not start a new contact and do not use an email app.
init:
  initializer_id: initializers.android.deltachat:DeltaChatSendMessageInitializer
  params:
    api_base_url: "http://127.0.0.1:8081"
    app_package: "chat.delta"
    app_activity: "org.thoughtcrime.securesms.RoutingActivity"
    reset_app_data: true
    purge_greenmail: true
    seed_sender_email: "benchrecv@example.test"
    seed_sender_password: "benchpass"
    seed_recipient_email: "benchsender@example.test"
    seed_subject: "Seed existing chat"
    seed_body: |-
      Delta request card for bench route.
      DRAFT_RESPONSE=greenmail_chat_message route=red eta=16:20 confirm=NO owner=old checksum=111
      DECOY_RESPONSE=greenmail_chat_message route=blue eta=17:04 confirm=MAYBE owner=Mei checksum=747
      FINAL_RESPONSE=
      greenmail_chat_message route=blue eta=17:40
      confirm=YES owner=Mei checksum=774
      archive=[BMK-DELTA-774]; ignore=draft/red/17:04
      Send only the three lines after FINAL_RESPONSE=.
    seed_smtp_host: "127.0.0.1"
    seed_smtp_port: 3025
    wait_ms: 2500
evaluation:
  evaluator_id: evaluators.android.deltachat_send_message:DeltaChatSendMessageEvaluator
  params:
    api_base_url: "http://127.0.0.1:8081"
    sender_email: "benchsender@example.test"
    recipient_email: "benchrecv@example.test"
    body: |-
      greenmail_chat_message route=blue eta=17:40
      confirm=YES owner=Mei checksum=774
      archive=[BMK-DELTA-774]; ignore=draft/red/17:04
    require_body_exact: true
    forbidden_body_substrings:
      - "route=red"
      - "eta=16:20"
      - "eta=17:04"
      - "RESPONSE="
      - "DRAFT_RESPONSE"
      - "DECOY_RESPONSE"
    mailbox: "INBOX"
    timeout_seconds: 20
    poll_interval_seconds: 1
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [chat, deltachat, greenmail, communication, easy, benchmark]
  app: "Delta Chat"
  app_bundle_id: chat.delta
  difficulty: easy
  description: "Reply in a seeded Delta Chat conversation by extracting the final multiline response from draft/decoy instructions, verified as exact GreenMail body text."
  prerequisites:
    - "Delta Chat is installed on the emulator."
    - "Delta Chat already contains the benchsender@example.test account configured against GreenMail."
    - "GreenMail is running on the host and reachable at http://127.0.0.1:8081."
