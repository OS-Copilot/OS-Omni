instruction: Sign in to the OpenDriver application using the Rider role with the name Avery, the email
  address rider@example.com, and the password password123, and complete a full service cycle ending with
  a logged-out state. The first ride request must use the current location as the pickup point and University
  Avenue, Palo Alto, CA as the destination, with pins adjusted as needed, the destination saved, and the
  ride requested for immediate departure. Once the first ride is active, save the invoice as a PDF, rate
  the trip, and book a second ride. The second ride must have University Avenue, Palo Alto, CA as the
  destination, with the pickup and destination locations swapped and a stop added. The ride history must
  display the first University Avenue, Palo Alto, CA trip record, and both the scheduled and completed
  ride cards must be checked. The active ride view must have the invoice PDF saved again, and the receipt
  in the history section must be accessed. In the safety section, the trip must be shared, emergency help
  must be requested, and the ride PIN must be entered. A support ticket must be created by selecting the
  safety concern category and entering the message Need ride help, followed by a reply to the ticket.
  The open tickets for Payments and rider issue in the safety section must be reviewed. In the account
  section, the profile must be edited, and the wallet, coupons, notifications, and saved places must be
  accessed. In the ride section, the no payment option must be selected, and the ride must be requested
  for now. The ride, history, and account sections must be refreshed, and the application must be logged
  out.
