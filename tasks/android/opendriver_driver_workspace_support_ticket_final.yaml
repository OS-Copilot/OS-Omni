instruction: Sign in to the OpenDriver application using the name Dana Driver, the email address dash@example.com,
  and the password password123 to access the Driver Workspace. The Work tab must display the Review requests
  section with the Open queue active, and the map view must reflect interactions including zooming in,
  zooming out, selecting the Service city, and activating My location, with the page view adjusted to
  reveal the Vehicle area before returning to the request cards area. The Work page must be refreshed,
  the Review requests and Open queue sections re-entered, and the map zoom in and zoom out actions performed
  again. The Account tab must show the driver status set to Go online, with the page reflecting the online
  state, and one request must be opened with the Service city selected on the map. The status must then
  be set to Go offline and immediately back to Go online. The Account page view must display the Driver
  onboarding form with input fields interacted for the D-2048 driver license, Toyota vehicle make, Camry
  vehicle model, 2022 year, DRV-204 license plate, and Blue color, with the keyboard dismissed and the
  view returned to the Availability area. The Money tab must be selected and refreshed, with the view
  adjusted to reveal the Payouts area before returning to the Today and Total cards, and then adjusted
  again to make the Trip earnings and Available payout information visible before returning to the top
  of the income summary, followed by another refresh of the Money page. The Support tab must show the
  customer support message input field interacted with and the keyboard dismissed, a new support ticket
  created, and the list refreshed to ensure the new ticket is displayed. The Support page view must be
  adjusted to make the newly appearing rider issue - open ticket visible, with Reply to ticket selected
  within the rider issue - open ticket and the view returned to the support list area, followed by Reply
  to ticket selected within the Payments - open ticket and the view returned to the support list area
  again. The Support page view must be returned to the Driver safety and support top, the customer support
  message input field interacted with, and the keyboard dismissed. The Support page must be refreshed,
  and the final view must be the support ticket list page where the rider issue - open ticket is visible.
