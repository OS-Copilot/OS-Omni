task_id: android.libreoffice.status_report_update
platform: android
instruction: 'Open status_report.odt in LibreOffice, navigate to the final decision section, and change the exact later line Status: Pending to Status: Completed FINAL-BLUE [owner=Mei; confirmed=17:40; risk=reviewed; archive=BMK-774; ignore=draft-monitoring]. Do not alter the earlier monitoring/status-like lines, save the file, reopen it, and make sure the change stuck.'
init:
  initializer_id: initializers.android.libreoffice_status_report_prep:LibreOfficeStatusReportPrepInitializer
  params:
    app_package: "org.documentfoundation.libreoffice"
    app_activity: "org.libreoffice.ui.LibreOfficeUIActivity"
    document_dir: "/sdcard/Documents"
    filename: "status_report.odt"
    clear_app_data: false
    wait_ms: 2400
evaluation:
  evaluator_id: evaluators.android.libreoffice_status_report:LibreOfficeStatusReportEvaluator
  params:
    expected_filename: "status_report.odt"
    old_text: "Status: Pending"
    new_text: "Status: Completed FINAL-BLUE [owner=Mei; confirmed=17:40; risk=reviewed; archive=BMK-774; ignore=draft-monitoring]"
    require_filename_visible: false
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [libreoffice, android, odt, edit, verify, hard, benchmark]
  app: LibreOffice
  app_bundle_id: org.documentfoundation.libreoffice
  difficulty: hard
  description: "Open a seeded multi-page ODT, update only the final pending status to a punctuation-heavy exact line, save/reopen, and verify persistence."
  prerequisites:
    - "LibreOffice is installed on the emulator."
