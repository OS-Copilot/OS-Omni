task_id: android.opennavigation.4_2_gui_workflow
platform: android
instruction: |-
  Produce a completed OpenNavigation session on the Android profile quail1 that demonstrates map control interactions, multi-destination routing comparisons, and specific sidebar states without ever using the Sign Out control, the Android Back button, or blank areas to dismiss dialogs or cancel actions. The session must begin with the sidebar toggled from collapsed to expanded, the map displaying the Current location indicator after a zoom-in, a long-press on the central current location dot, and a subsequent zoom-out, followed by the standard map layer dialog being acknowledged via OK.

  The routing workflow must establish Googleplex as the current location from the Recent section, initiate routing with the destination field containing Googleplex submitted via the keyboard, and select the Googleplex result to access route options where the Walk, Bike, Transit, and Drive travel modes are systematically cycled through. The route controls must reflect a selection of Other time reverted to Leave now, and the Options dialog must be confirmed with OK. The Routes tab must display the route history list before returning to the Results tab to show the current route results.

  A second routing sequence must set Meta Headquarters as the current location by long-pressing and selecting its row in the Recent section, initiate routing with the destination text Meta Headquarters submitted via the keyboard, and select the Meta Headquarters result to enter route options. The Transit, Walk, Bike, and Drive travel modes must be cycled through, the route controls must show Other time reverted to Leave now, and the Options dialog must be confirmed with OK. The Routes tab must verify the visibility of the Home to Meta Headquarters history route.

  A third sequence must set Mountain View Transit Center as the current location by long-pressing and selecting its row in the Recent section, initiate routing with the destination field displaying Mountain View Transit Center submitted via the keyboard, and proceed to the Saved section without selecting a result to select the Stanford University row. Routing for Stanford University must be initiated with the destination text Stanford University submitted via the keyboard, and the Stanford University result must be selected to enter route options. The Walk, Bike, Transit, and Drive travel modes must be cycled through, the route controls must show Other time reverted to Leave now, and the Options dialog must be confirmed with OK. The Routes tab must confirm the Mountain View to Stanford history route is visible before returning to the Results tab to display the Stanford University route results.

  The session must conclude with Googleplex set as the current location from the Recent section, the standard map layer dialog acknowledged via OK after opening the Layers section, and the Recent section selected in the sidebar. The final interface must display the Saved, Recent, Layers, and Sign Out entries while remaining in a logged-in state.
