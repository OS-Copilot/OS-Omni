task_id: android.fossify_gallery.move_rename_photo
platform: android
instruction: In Fossify Gallery, apply the final routing inside bench_gallery_lab without touching draft or backup photos. In camera, move blue.jpg into receipts and rename it to travel_blue_FINAL_774.jpg; move yellow_board.jpg into archive and rename it to board_yellow_ARCHIVE_FINAL_501.jpg; rename red.jpg to cover_red_FINAL_203.jpg. Leave blue_draft.jpg and red_backup.jpg in camera unchanged. In receipts, rename green.jpg to receipt_green_FINAL_9.jpg; move receipt_scan.jpg into archive and rename it to receipt_scan_ARCHIVE_BLUE_662.jpg. Leave green_draft.jpg in receipts unchanged. In archive, rename old_route.jpg to route_archive_FINAL_BLUE_303.jpg and leave archive_hold.jpg unchanged. Do not delete anything.
init:
  initializer_id: initializers.android.fossify_gallery:FossifyGalleryMoveRenamePhotoInitializer
  params:
    app_package: "org.fossify.gallery"
    app_activity: ".activities.SplashActivity.Green"
    workspace_root: "/sdcard/Pictures/bench_gallery_lab"
    extra_media_files:
      - path: "/sdcard/Pictures/bench_gallery_lab/camera/yellow_board.jpg"
        color: green
      - path: "/sdcard/Pictures/bench_gallery_lab/camera/blue_draft.jpg"
        color: blue
      - path: "/sdcard/Pictures/bench_gallery_lab/camera/red_backup.jpg"
        color: red
      - path: "/sdcard/Pictures/bench_gallery_lab/receipts/receipt_scan.jpg"
        color: blue
      - path: "/sdcard/Pictures/bench_gallery_lab/receipts/green_draft.jpg"
        color: green
      - path: "/sdcard/Pictures/bench_gallery_lab/archive/old_route.jpg"
        color: blue
      - path: "/sdcard/Pictures/bench_gallery_lab/archive/archive_hold.jpg"
        color: green
    clear_app_data: true
    wait_ms: 1500
evaluation:
  evaluator_id: evaluators.android.filesystem_state:ExternalStoragePathStateEvaluator
  params:
    expected_paths:
      - path: "/sdcard/Pictures/bench_gallery_lab/camera/cover_red_FINAL_203.jpg"
        type: file
      - path: "/sdcard/Pictures/bench_gallery_lab/camera/blue_draft.jpg"
        type: file
      - path: "/sdcard/Pictures/bench_gallery_lab/camera/red_backup.jpg"
        type: file
      - path: "/sdcard/Pictures/bench_gallery_lab/receipts/travel_blue_FINAL_774.jpg"
        type: file
      - path: "/sdcard/Pictures/bench_gallery_lab/receipts/receipt_green_FINAL_9.jpg"
        type: file
      - path: "/sdcard/Pictures/bench_gallery_lab/receipts/green_draft.jpg"
        type: file
      - path: "/sdcard/Pictures/bench_gallery_lab/archive/board_yellow_ARCHIVE_FINAL_501.jpg"
        type: file
      - path: "/sdcard/Pictures/bench_gallery_lab/archive/receipt_scan_ARCHIVE_BLUE_662.jpg"
        type: file
      - path: "/sdcard/Pictures/bench_gallery_lab/archive/route_archive_FINAL_BLUE_303.jpg"
        type: file
      - path: "/sdcard/Pictures/bench_gallery_lab/archive/archive_hold.jpg"
        type: file
    forbidden_paths:
      - path: "/sdcard/Pictures/bench_gallery_lab/camera/blue.jpg"
        type: any
      - path: "/sdcard/Pictures/bench_gallery_lab/camera/yellow_board.jpg"
        type: any
      - path: "/sdcard/Pictures/bench_gallery_lab/camera/red.jpg"
        type: any
      - path: "/sdcard/Pictures/bench_gallery_lab/receipts/green.jpg"
        type: any
      - path: "/sdcard/Pictures/bench_gallery_lab/receipts/receipt_scan.jpg"
        type: any
      - path: "/sdcard/Pictures/bench_gallery_lab/archive/old_route.jpg"
        type: any
      - path: "/sdcard/Pictures/bench_gallery_lab/camera/travel_blue_FINAL_774.jpg"
        type: any
      - path: "/sdcard/Pictures/bench_gallery_lab/camera/board_yellow_ARCHIVE_FINAL_501.jpg"
        type: any
      - path: "/sdcard/Pictures/bench_gallery_lab/receipts/receipt_scan_ARCHIVE_BLUE_662.jpg"
        type: any
    exact_directory_entries:
      - path: "/sdcard/Pictures/bench_gallery_lab/camera"
        entries: ["blue_draft.jpg", "cover_red_FINAL_203.jpg", "red_backup.jpg"]
      - path: "/sdcard/Pictures/bench_gallery_lab/receipts"
        entries: ["green_draft.jpg", "receipt_green_FINAL_9.jpg", "travel_blue_FINAL_774.jpg"]
      - path: "/sdcard/Pictures/bench_gallery_lab/archive"
        entries: ["archive_hold.jpg", "board_yellow_ARCHIVE_FINAL_501.jpg", "receipt_scan_ARCHIVE_BLUE_662.jpg", "route_archive_FINAL_BLUE_303.jpg"]
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [fossify_gallery, gallery, media, hard, benchmark]
  app: "Fossify Gallery"
  app_bundle_id: org.fossify.gallery
  observed_agent_steps: 14
  difficulty: hard
  description: "Move and rename a small routed set of photos across three albums while preserving draft/backup decoys and exact final directory contents."
