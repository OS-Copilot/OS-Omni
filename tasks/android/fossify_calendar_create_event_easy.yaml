task_id: android.fossify_calendar.create_task_easy
platform: android
instruction: Create a Fossify Calendar task titled BMK Easy Standup on April 26, 2026.
init:
  initializer_id: initializers.android.fossify_calendar:FossifyCalendarInitializer
  params:
    app_package: "org.fossify.calendar"
    database_path: "/data/user/0/org.fossify.calendar/databases/events.db"
    timezone: "UTC"
    clear_app_data: true
    seed_events: []
    wait_ms: 1500
evaluation:
  evaluator_id: evaluators.android.fossify_calendar:FossifyCalendarEventStateEvaluator
  params:
    database_path: "/data/user/0/org.fossify.calendar/databases/events.db"
    timezone: "UTC"
    expected_events:
      - title: "BMK Easy Standup"
        date: "2026-04-26"
        type: 1
    absent_titles: []
    strict_benchmark_titles: true
    timeout_seconds: 10
    poll_interval_seconds: 1
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [calendar, fossify_calendar, productivity, easy, benchmark]
  app: "Fossify Calendar"
  app_bundle_id: org.fossify.calendar
  description: "Create one same-day task in Fossify Calendar and verify it through Fossify Calendar's local database."
  difficulty_basis: "Human path is typically under 10 steps: tap New Task, enter title, save."
  prerequisites:
    - "Fossify Calendar is installed on the emulator."
  difficulty: easy
