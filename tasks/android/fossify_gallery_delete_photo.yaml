task_id: android.fossify_gallery.delete_photo
platform: android
instruction: In Fossify Gallery, delete the blue photo from the camera album while keeping the red camera photo and the green receipts photo.
init:
  initializer_id: initializers.android.fossify_gallery:FossifyGalleryDeletePhotoInitializer
  params:
    app_package: "org.fossify.gallery"
    app_activity: ".activities.SplashActivity.Green"
    workspace_root: "/sdcard/Pictures/bench_gallery_lab"
    clear_app_data: true
    wait_ms: 1500
evaluation:
  evaluator_id: evaluators.android.filesystem_state:ExternalStoragePathStateEvaluator
  params:
    expected_paths:
      - path: "/sdcard/Pictures/bench_gallery_lab/camera/red.jpg"
        type: file
      - path: "/sdcard/Pictures/bench_gallery_lab/receipts/green.jpg"
        type: file
    forbidden_paths:
      - path: "/sdcard/Pictures/bench_gallery_lab/camera/blue.jpg"
        type: any
    exact_directory_entries:
      - path: "/sdcard/Pictures/bench_gallery_lab/camera"
        entries: ["red.jpg"]
      - path: "/sdcard/Pictures/bench_gallery_lab/receipts"
        entries: ["green.jpg"]
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [fossify_gallery, gallery, media, easy, benchmark]
  app: "Fossify Gallery"
  app_bundle_id: org.fossify.gallery
  difficulty: easy
  observed_agent_steps: 4
  description: "Delete one target photo from a seeded album while preserving the other albums, verified from shared storage."
