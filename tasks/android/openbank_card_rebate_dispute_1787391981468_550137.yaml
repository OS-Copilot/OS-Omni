instruction: |-
  File a card rebate dispute, create two transfer recipients, submit two transfers, update a statement delivery preference, adjust security reminder settings, and lock a debit card in the OpenBank app.

  The card rebate dispute must be filed against the “Ace Hardware” transaction, citing “Canceled or returned item” as the reason, with the “I contacted the merchant” toggle enabled and “Return for rebate” entered in the Details field.

  Two new recipients must exist in the Transfers section. The first recipient must have the name “Mira song”, account number “8163057294”, routing number “071000013”, nickname “Card rebate”, and bank “OpenBank”. The second recipient must have the name “Dana Cole”, account number “3479206185”, routing number “091000019”, nickname “Audit fee”, and bank “OpenBank”.

  Two new transfers must be submitted from the “Everyday Checking ••••2381” account. The first transfer is to “Mira Song” for an amount of “2.75” with the memo “Card rebate” and a date of “June 29, 2026”. The second transfer is to “Dana Cole” for an amount of “1.35” with the memo “Audit fee” and a date of “June 30, 2026”.

  The delivery preference for the “Rainy Day Savings ••••9140” statement must be changed from “Paper” to “Go paperless”.

  In the Security section, the “Text” toggle for the “Payment due” reminder must be enabled and saved. The “Upcoming bill” reminder must be marked as read. The “Text” toggle for the “Low balance” reminder must be enabled and saved. The “Everyday Checking debit card” status must be changed from “Unlocked” to locked.
