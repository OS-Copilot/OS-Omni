task_id: android.deltachat.archive_and_reply
platform: android
instruction: In Delta Chat, archive the conversation with archiveuser@example.test first. Then find it in Archived chats and reply with the exact one-line response requested inside that archived conversation. Do not reply before archiving it.
init:
  initializer_id: initializers.android.deltachat_archive:DeltaChatArchiveAndReplyInitializer
  params:
    api_base_url: "http://127.0.0.1:8081"
    app_package: "chat.delta"
    app_activity: "org.thoughtcrime.securesms.RoutingActivity"
    reset_app_data: true
    purge_greenmail: true
    seed_sender_email: "archiveuser@example.test"
    seed_sender_password: "archivepass"
    seed_recipient_email: "benchsender@example.test"
    seed_subject: "Chat to archive"
    seed_body: "Archive this chat before replying. Final response: reply_from_archive_message archive_checked_2026 route=blue owner=bench"
    seed_smtp_host: "127.0.0.1"
    seed_smtp_port: 3025
    wait_ms: 3000
evaluation:
  evaluator_id: evaluators.android.deltachat_archive_and_reply:DeltaChatArchiveAndReplyEvaluator
  params:
    api_base_url: "http://127.0.0.1:8081"
    sender_email: "benchsender@example.test"
    recipient_email: "archiveuser@example.test"
    reply_body: "reply_from_archive_message archive_checked_2026 route=blue owner=bench"
    mailbox: "INBOX"
    timeout_seconds: 30
    poll_interval_seconds: 1
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [deltachat, archive, communication, hard, benchmark]
  app: "Delta Chat"
  app_bundle_id: chat.delta
  description: "Archive a Delta Chat conversation, navigate to archives, and send a reply. Verified via GreenMail."
  prerequisites:
    - "Delta Chat is installed on the emulator."
    - "Delta Chat already contains the benchsender@example.test account configured against GreenMail."
    - "GreenMail is running on the host and reachable at http://127.0.0.1:8081."
  difficulty: hard
