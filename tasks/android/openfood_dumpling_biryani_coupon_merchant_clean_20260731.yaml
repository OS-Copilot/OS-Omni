  order must be placed via the Reorder function from the most recent prior order, containing Pork Dumplings,
  Beef Chow Fun, and Mapo Tofu each at a quantity of 3, with the coupon LUNCH5 - $5 off orders over $15
  applied, and its status advanced to Out for delivery and then Delivered. The third Dumpling Room order
