task_id: android.spotube.profile_setup
platform: android
instruction: In Spotube settings, repair the profile from the default/reset state. Install Jiosaavn Audio if it is missing, make Jiosaavn Audio the only selected default audio source, and make sure YouTube/Piped-style sources are not also selected as defaults. Set Language to English, Marketplace Region to Austria, Theme to Light, Accent Color to rose, and turn Normalize audio on. Leave the app on the Settings page when you finish.
init:
  initializer_id: initializers.android.spotube_open_clean_session:SpotubeOpenCleanSessionInitializer
  params:
    app_package: "oss.krtirtho.spotube"
    app_activity: "com.ryanheise.audioservice.AudioServiceActivity"
    clear_external_log: true
    external_log_path: "/sdcard/Android/data/oss.krtirtho.spotube/files/.spotube_logs"
    reset_profile_settings: true
    require_profile_reset: true
    scroll_home_to_top: true
    home_top_scrolls: 4
    wait_ms: 2200
evaluation:
  evaluator_id: evaluators.android.spotube_profile_setup:SpotubeProfileSetupEvaluator
  params:
    app_package: "oss.krtirtho.spotube"
    expected_audio_source: "Jiosaavn Audio"
    expected_language: "English"
    expected_marketplace_region: "Austria"
    expected_market: "AT"
    expected_theme: "Light"
    expected_theme_code: "light"
    expected_accent_color: "rose"
    expected_language_code: "en"
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [spotube, android, settings, plugins, audio_source, easy, benchmark]
  app: Spotube
  app_bundle_id: oss.krtirtho.spotube
  difficulty: easy
  description: "Configure Spotube profile settings from reset state, including plugin installation/default-source exclusivity and exact English/Austria/Light/rose/Normalize audio preferences."
  prerequisites:
    - "Spotube is installed on the emulator."
    - "Network access is available for plugin installation if Jiosaavn Audio is not installed yet."
