task_id: linux.cross_app.wireshark_writer_analysis_report_hard
platform: linux
instruction: >
  Open the seeded Wireshark capture /tmp/helloworld_wireshark/retail_mix.pcapng.
  In the display filter bar at the top, type "dns" and press Enter or click
  the Apply button (blue arrow) to apply the filter. Count the number of
  displayed DNS packets shown in the packet list. There should be 4 DNS packets.
  Then clear the filter by clicking the Clear button (X icon) next to the
  filter bar.
  Now type "http" in the filter bar and apply it. Count the number of
  displayed HTTP packets. There should be 2 HTTP packets.
  Then clear the filter again.
  Now type "tcp" in the filter bar and apply it. Count the number of
  displayed TCP packets. There should be 8 TCP packets.
  Then switch to the already-open LibreOffice Writer window. Create a new
  document with the heading "Network Traffic Analysis Report" and include:
  "DNS Packets: 4
  HTTP Packets: 2
  TCP Packets: 8
  Filters Applied: dns, http, tcp"
  Save the Writer document as /home/user/Documents/network_report.odt.
  Finish after the document is saved.
