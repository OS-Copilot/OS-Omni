instruction: |-
  In the OpenMail application, produce a set of email states and a final visible search result for the query "Receipt follow up draft".

  The email titled "Profile restore checklist PDF" in the Inbox must be starred and marked as unread. The email titled "Brunch notes PDF" in the Inbox must have a reply sent with the exact body text "Thanks for the brunch notes".

  A sent email addressed to "receipts@northline.example.test" with "anonym-x2024@outlook.com" in the Cc field, the subject "Receipt follow up draft", "High" priority, and the "Receipts" label must exist. The body of this sent email must contain the text "Please keep this receipt thread ready for the June review. Include the Northline receipt note.".

  A forwarded version of the "Receipt follow up draft" email must be sent to "receipts@railne.example.test" with the body text "Forwarding the draft follow up for rail reference.".

  The original "Receipt follow up draft" email in the Sent folder must have the "Follow up" label applied. This specific email must be moved from the Archive folder back to the Inbox.

  The application must conclude with the Inbox view active, the search box containing the query "Receipt follow up draft", and the search results for that query visible.
