task_id: linux.opendoc.launch_review_duplicate_hard
platform: linux
instruction: Create a duplicate of the OpenDoc document titled Project planning memo, rename the new document
  to Launch Review, and replace the main title text within the document body with Launch Review. Format
  this new title with a font size of 12, bold text, and a light yellow highlight. Add a comment to the
  document with the text OK. Position the cursor at the end of the Launch Review title line, create a
  new line, and type Launch. Add another comment with the text good, select all text in the comment input
  field, replace it with Reviewing, and submit the comment. Position the cursor at the end of the Launch
  line, create a new line, and type Action notes. Select the text Action notes and apply the Heading 2
  style. Move the cursor to the end of the Action notes line, create a new line, and type Alex owns copy.
  Create another new line and type Maya checks risk. Create a final new line and type Design signs off.
  Select these three lines of text, apply a list format, and set the line spacing to 1.62. Deselect the
  text and ensure the cursor is positioned at the end of the Design signs off line. Insert a date into
  the document. Add a Table of Contents (TOC) and a page number to the layout. Add a final comment with
  the text Review by EOD and resolve this specific comment. Share the document by copying the link and
  closing the share dialog. Export the document as a Word .doc file and as a Plain text file. Enable the
  Ruler view. Ensure the left-hand search box contains the text Launch.
