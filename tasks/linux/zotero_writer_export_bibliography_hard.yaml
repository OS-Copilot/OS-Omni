task_id: linux.cross_app.zotero_writer_export_bibliography_hard
platform: linux
instruction: >
  Open Zotero. Create a new collection named "CS Papers" under My Library.
  Add three Book items to this collection:
  1. "Designing Data-Intensive Applications" by Martin Kleppmann
  2. "Clean Code" by Robert Martin
  3. "The Pragmatic Programmer" by Andrew Hunt
  Then create a new subcollection named "AI Papers" under "CS Papers".
  To create a subcollection, right-click on "CS Papers" in the left sidebar
  and select "New Subcollection" from the context menu. Type "AI Papers" and
  press Enter.
  Add two Journal Article items to "AI Papers":
  1. "Attention Is All You Need" by Ashish Vaswani
  2. "BERT" by Jacob Devlin
  Select the "CS Papers" collection (the parent, not the subcollection).
  Go to File → Export Collection. In the export dialog, choose "BibTeX" format,
  make sure to check "Export Files" if available, and export. The file will be
  saved to /home/user/Documents/cs_refs/cs_refs.bib.
  Then switch to the already-open LibreOffice Writer window. Create a new
  document. Type the heading "Reference List" and then drag the file
  /home/user/Documents/cs_refs/cs_refs.bib into the document to insert it.
  Save the Writer document as /home/user/Documents/reference_report.odt.
  Finish after both files exist.
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: |
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_writer/B11B17CA-0B48-4A7E-B567-A2524C24D26F/Bench_Status_Update.docx"
        out = Path("/home/user/Desktop/Bench_Status_Update.docx")
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(urlopen(url).read())
        PY|
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/wireshark/C9CCC440-B4EE-407E-B53D-B389ED564F8E/retail_mix.pcapng"
        out = Path("/tmp/helloworld_wireshark/retail_mix.pcapng")
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(urlopen(url).read())
        PY|
        set -e
        export HOME=/home/user
        export PATH="$HOME/.local/bin:$PATH"
        mkdir -p "$HOME/Applications" "$HOME/.local/share/applications" "$HOME/.local/bin" "$HOME/Downloads" "$HOME/Documents"
        pkill -x zotero >/dev/null 2>&1 || true
        pkill -f soffice.bin >/dev/null 2>&1 || true
        archive="$HOME/Downloads/Zotero-9.0.1_linux-x86_64.tar.xz"
        if [ ! -x "$HOME/Applications/Zotero_linux-x86_64/zotero" ]; then
          if [ ! -f "$archive" ]; then
            python3 - <<'PY'
            from pathlib import Path
            from urllib.request import urlopen
            url = "https://download.zotero.org/client/release/9.0.1/Zotero-9.0.1_linux-x86_64.tar.xz"
            out = Path("/home/user/Downloads/Zotero-9.0.1_linux-x86_64.tar.xz")
            out.write_bytes(urlopen(url).read())
            PY
          fi
          rm -rf "$HOME/Applications/Zotero_linux-x86_64"
          tar -xf "$archive" -C "$HOME/Applications"
          (
            cd "$HOME/Applications/Zotero_linux-x86_64"
            ./set_launcher_icon
          )
          ln -sf "$HOME/Applications/Zotero_linux-x86_64/zotero.desktop" "$HOME/.local/share/applications/zotero.desktop"
          ln -sf "$HOME/Applications/Zotero_linux-x86_64/zotero" "$HOME/.local/bin/zotero"
        fi
        rm -rf "$HOME/Zotero" "$HOME/.zotero"
    - type: launch_app
      command: /home/user/Applications/Zotero_linux-x86_64/zotero
    - type: wait
      ms: 12000
    - type: run_bash
      script: |
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_writer/B11B17CA-0B48-4A7E-B567-A2524C24D26F/Bench_Status_Update.docx"
        out = Path("/home/user/Desktop/Bench_Status_Update.docx")
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(urlopen(url).read())
        PY|
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/wireshark/C9CCC440-B4EE-407E-B53D-B389ED564F8E/retail_mix.pcapng"
        out = Path("/tmp/helloworld_wireshark/retail_mix.pcapng")
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(urlopen(url).read())
        PY|
        export DISPLAY=${DISPLAY:-:0}
        wmctrl -a Zotero 2>/dev/null || true
        wmctrl -r Zotero -b remove,maximized_vert,maximized_horz 2>/dev/null || true
        wmctrl -r Zotero -e 0,80,80,1320,860 2>/dev/null || true
    - type: wait
      ms: 1000
    - type: run_bash
      script: |
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_writer/B11B17CA-0B48-4A7E-B567-A2524C24D26F/Bench_Status_Update.docx"
        out = Path("/home/user/Desktop/Bench_Status_Update.docx")
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(urlopen(url).read())
        PY|
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/wireshark/C9CCC440-B4EE-407E-B53D-B389ED564F8E/retail_mix.pcapng"
        out = Path("/tmp/helloworld_wireshark/retail_mix.pcapng")
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(urlopen(url).read())
        PY|
        export DISPLAY=:0
        setsid -f libreoffice --writer >/dev/null 2>&1
    - type: wait
      ms: 5000
evaluation:
  evaluator_id: evaluators.linux.command_check:CommandCheckEvaluator
  params:
    timeout: 120
    stdout_contains: "PASS"
    command: |
      set -euo pipefail
      python3 - <<'PY'
      import sqlite3
      import os

      # Check Zotero database
      db_path = os.path.expanduser("~/Zotero/zotero.sqlite")
      if not os.path.exists(db_path):
          raise SystemExit("ZOTERO_DB_NOT_FOUND")

      conn = sqlite3.connect(db_path)
      cur = conn.cursor()

      # Check parent collection exists
      cur.execute("SELECT collectionName FROM collections WHERE collectionName='CS Papers'")
      if not cur.fetchone():
          raise SystemExit("PARENT_COLLECTION_NOT_FOUND")

      # Check subcollection exists
      cur.execute("SELECT collectionName FROM collections WHERE collectionName='AI Papers'")
      if not cur.fetchone():
          raise SystemExit("SUBCOLLECTION_NOT_FOUND")

      # Check 5 items exist (3 books + 2 articles)
      cur.execute("""
          SELECT DISTINCT idv.value FROM items i
          JOIN itemData id ON i.itemID = id.itemID
          JOIN fields f ON id.fieldID = f.fieldID
          JOIN itemDataValues idv ON id.valueID = idv.valueID
          WHERE f.fieldName = 'title'
          AND idv.value IN ('Designing Data-Intensive Applications', 'Clean Code', 'The Pragmatic Programmer', 'Attention Is All You Need', 'BERT')
      """)
      items = cur.fetchall()
      if len(items) != 5:
          raise SystemExit(f"EXPECTED_5_ITEMS_GOT_{len(items)}")

      conn.close()

      # Check BibTeX file exists (may be in cs_refs/ subdirectory)
      bib_path = os.path.expanduser("~/Documents/cs_refs.bib")
      bib_path_alt = os.path.expanduser("~/Documents/cs_refs/cs_refs.bib")
      if not os.path.exists(bib_path) and not os.path.exists(bib_path_alt):
          raise SystemExit("BIBTEX_FILE_NOT_FOUND")

      # Check Writer document exists
      odt_path = os.path.expanduser("~/Documents/reference_report.odt")
      if not os.path.exists(odt_path):
          raise SystemExit("WRITER_DOCUMENT_NOT_FOUND")

      print("PASS")
      PY
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - linux
  - cross_app
  - zotero
  - writer
  - bibliography
  - subcollection
  - hard
  app_name: zotero + libreoffice_writer
  difficulty: hard
  description: Create a Zotero collection with subcollection, add 5 items of different
    types, export as BibTeX via File menu dialog, then insert into Writer via
    Insert → File dialog.
  oracle_task: tasks/linux/oracle/cross_app_zotero_writer_export_bibliography_oracle.yaml
  oracle_model: linux_oracle_wait
