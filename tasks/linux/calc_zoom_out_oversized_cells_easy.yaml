task_id: linux.calc.zoom_out_oversized_cells
platform: linux
instruction: The cells are so big that I can not click on the cell I want, zoom out a little bit. The spreadsheet should already be open in LibreOffice Calc. Save the workbook when finished.
init:
  initializer_id: initializers.linux.office_setup:LinuxOfficeSetupInitializer
  params:
    tool_source_dir: platforms/linux/office_tools
    tool_names:
    - libreoffice_writer.py
    - libreoffice_calc.py
    - libreoffice_impress.py
    remote_tool_dir: "~"
    uno_port: 2002
    startup_wait_seconds: 6
    seed_downloads:
    - url: https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_calc/1334ca3e-f9e3-4db8-9ca7-b4c653be7d17/Zoom_Out_Oversized_Cells.xlsx
      path: /tmp/helloworld_office/calc_1334ca3e_actual.xlsx
    - url: https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_calc/1334ca3e-f9e3-4db8-9ca7-b4c653be7d17/Zoom_Out_Oversized_Cells_gold.xlsx
      path: /tmp/helloworld_office/calc_1334ca3e_expected.xlsx
    open_documents_after_download:
    - /tmp/helloworld_office/calc_1334ca3e_actual.xlsx
    open_documents_wait_seconds: 5
evaluation:
  evaluator_id: evaluators.linux.xlsx_rule_compare:XlsxRuleEvaluator
  params:
    actual_path: /tmp/helloworld_office/calc_1334ca3e_actual.xlsx
    expected_path: /tmp/helloworld_office/calc_1334ca3e_expected.xlsx
    rules:
    - type: zoom
      sheet_idx: 0
      method: lt
      ref: 260
    - type: sheet_data
      sheet_idx0: 0
      sheet_idx1: EI0
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - linux
  - gui
  - libreoffice
  - calc
  - xlsx
  - zoom
  - easy
  app: LibreOffice Calc
  difficulty: easy
  description: Zoom out an oversized Calc worksheet enough to restore normal editing and save the workbook.
  oracle_task: tasks/linux/oracle/calc_zoom_out_oversized_cells_oracle.yaml
  oracle_model: linux_oracle_wait
