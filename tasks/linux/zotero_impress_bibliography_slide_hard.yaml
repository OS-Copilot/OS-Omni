task_id: linux.cross_app.zotero_impress_bibliography_slide_hard
platform: linux
instruction: >
  Open Zotero. Create a new collection named "ML Papers" under My Library.
  Add three Journal Article items to this collection:
  1. "Attention Is All You Need" by Ashish Vaswani
  2. "BERT" by Jacob Devlin
  3. "Longformer" by Iz Beltagy
  Select the "ML Papers" collection. Go to File → Export Collection. In the
  export dialog, choose "BibTeX" format and save the file to
  /home/user/Documents/ml_papers.bib.
  Then switch to the already-open LibreOffice Impress window. Create a new
  presentation. On the first slide, use Insert → Text Box to add a text box
  and type "ML Papers Bibliography" as the title. Then use Insert → File
  to insert the BibTeX file /home/user/Documents/ml_papers.bib. In the
  insert dialog, navigate to /home/user/Documents/, select ml_papers.bib,
  and click Open.
  Save the presentation as /home/user/Documents/ml_presentation.odp.
  Finish after the presentation is saved.
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: |
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_writer/B11B17CA-0B48-4A7E-B567-A2524C24D26F/Bench_Status_Update.docx"
        out = Path("/home/user/Desktop/Bench_Status_Update.docx")
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(urlopen(url).read())
        PY|
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/wireshark/C9CCC440-B4EE-407E-B53D-B389ED564F8E/retail_mix.pcapng"
        out = Path("/tmp/helloworld_wireshark/retail_mix.pcapng")
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(urlopen(url).read())
        PY|
        set -e
        export HOME=/home/user
        export PATH="$HOME/.local/bin:$PATH"
        mkdir -p "$HOME/Applications" "$HOME/.local/share/applications" "$HOME/.local/bin" "$HOME/Downloads" "$HOME/Documents"
        pkill -x zotero >/dev/null 2>&1 || true
        pkill -f soffice.bin >/dev/null 2>&1 || true
        archive="$HOME/Downloads/Zotero-9.0.1_linux-x86_64.tar.xz"
        if [ ! -x "$HOME/Applications/Zotero_linux-x86_64/zotero" ]; then
          if [ ! -f "$archive" ]; then
            python3 - <<'PY'
            from pathlib import Path
            from urllib.request import urlopen
            url = "https://download.zotero.org/client/release/9.0.1/Zotero-9.0.1_linux-x86_64.tar.xz"
            out = Path("/home/user/Downloads/Zotero-9.0.1_linux-x86_64.tar.xz")
            out.write_bytes(urlopen(url).read())
            PY
          fi
          rm -rf "$HOME/Applications/Zotero_linux-x86_64"
          tar -xf "$archive" -C "$HOME/Applications"
          (
            cd "$HOME/Applications/Zotero_linux-x86_64"
            ./set_launcher_icon
          )
          ln -sf "$HOME/Applications/Zotero_linux-x86_64/zotero.desktop" "$HOME/.local/share/applications/zotero.desktop"
          ln -sf "$HOME/Applications/Zotero_linux-x86_64/zotero" "$HOME/.local/bin/zotero"
        fi
        rm -rf "$HOME/Zotero" "$HOME/.zotero"
    - type: launch_app
      command: /home/user/Applications/Zotero_linux-x86_64/zotero
    - type: wait
      ms: 12000
    - type: run_bash
      script: |
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_writer/B11B17CA-0B48-4A7E-B567-A2524C24D26F/Bench_Status_Update.docx"
        out = Path("/home/user/Desktop/Bench_Status_Update.docx")
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(urlopen(url).read())
        PY|
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/wireshark/C9CCC440-B4EE-407E-B53D-B389ED564F8E/retail_mix.pcapng"
        out = Path("/tmp/helloworld_wireshark/retail_mix.pcapng")
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(urlopen(url).read())
        PY|
        export DISPLAY=${DISPLAY:-:0}
        wmctrl -a Zotero 2>/dev/null || true
        wmctrl -r Zotero -b remove,maximized_vert,maximized_horz 2>/dev/null || true
        wmctrl -r Zotero -e 0,80,80,1320,860 2>/dev/null || true
    - type: wait
      ms: 1000
    - type: run_bash
      script: |
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_writer/B11B17CA-0B48-4A7E-B567-A2524C24D26F/Bench_Status_Update.docx"
        out = Path("/home/user/Desktop/Bench_Status_Update.docx")
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(urlopen(url).read())
        PY|
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/wireshark/C9CCC440-B4EE-407E-B53D-B389ED564F8E/retail_mix.pcapng"
        out = Path("/tmp/helloworld_wireshark/retail_mix.pcapng")
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(urlopen(url).read())
        PY|
        export DISPLAY=:0
        setsid -f libreoffice --impress >/dev/null 2>&1
    - type: wait
      ms: 5000
evaluation:
  evaluator_id: evaluators.linux.command_check:CommandCheckEvaluator
  params:
    timeout: 120
    stdout_contains: "PASS"
    command: |
      set -euo pipefail
      python3 - <<'PY'
      import sqlite3
      import os

      db_path = os.path.expanduser("~/Zotero/zotero.sqlite")
      if not os.path.exists(db_path):
          raise SystemExit("ZOTERO_DB_NOT_FOUND")

      conn = sqlite3.connect(db_path)
      cur = conn.cursor()

      cur.execute("SELECT collectionName FROM collections WHERE collectionName='ML Papers'")
      if not cur.fetchone():
          raise SystemExit("COLLECTION_NOT_FOUND")

      cur.execute("""
          SELECT DISTINCT idv.value FROM items i
          JOIN itemData id ON i.itemID = id.itemID
          JOIN fields f ON id.fieldID = f.fieldID
          JOIN itemDataValues idv ON id.valueID = idv.valueID
          WHERE f.fieldName = 'title'
          AND idv.value IN ('Attention Is All You Need', 'BERT', 'Longformer')
      """)
      items = cur.fetchall()
      if len(items) != 3:
          raise SystemExit(f"EXPECTED_3_ITEMS_GOT_{len(items)}")

      conn.close()

      bib_path = os.path.expanduser("~/Documents/ml_papers.bib")
      if not os.path.exists(bib_path):
          raise SystemExit("BIBTEX_FILE_NOT_FOUND")

      odp_path = os.path.expanduser("~/Documents/ml_presentation.odp")
      if not os.path.exists(odp_path):
          raise SystemExit("IMPRESS_FILE_NOT_FOUND")

      print("PASS")
      PY
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - linux
  - cross_app
  - zotero
  - impress
  - bibliography
  - presentation
  - hard
  app_name: zotero + libreoffice_impress
  difficulty: hard
  description: Create a Zotero collection with 3 journal articles, export as
    BibTeX via File menu dialog, then insert into Impress presentation via
    Insert → File dialog.
