task_id: linux.oracle.cross_vm.writer_site_visit_brief_easy
platform: linux
instruction: >
  Oracle sanity task for linux.cross_vm.writer_site_visit_brief_easy. The
  initializer already prepares the expected document. Wait briefly and finish.
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
      - type: run_bash
        script: |
          pkill -f soffice.bin >/dev/null 2>&1 || true
          pkill -f '/usr/lib/libreoffice/program/soffice' >/dev/null 2>&1 || true
          mkdir -p /home/user/Documents /home/user/Desktop
          python3 - <<'PY'
          from docx import Document
          doc = Document()
          for line in [
              "Northwind Site Visit",
              "Confirm loading dock access at 08:30",
              "Bring revised safety checklist",
              "Share the updated visitor badge count: 14",
          ]:
              doc.add_paragraph(line)
          doc.save("/home/user/Documents/site_visit_brief.docx")
          PY
        timeout: 120
evaluation:
  evaluator_id: evaluators.linux.command_check:CommandCheckEvaluator
  params:
    timeout: 120
    stdout_contains: PASS
    command: |
      python3 - <<'PY'
      from docx import Document
      doc = Document("/home/user/Documents/site_visit_brief.docx")
      lines = [p.text.strip() for p in doc.paragraphs if p.text.strip()]
      expected = [
          "Northwind Site Visit",
          "Confirm loading dock access at 08:30",
          "Bring revised safety checklist",
          "Share the updated visitor badge count: 14",
      ]
      if lines != expected:
          raise SystemExit(f"LINES_MISMATCH:{lines}")
      print("PASS")
      PY
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [linux, cross_vm, oracle, easy]
  difficulty: easy
  oracle_for: linux.cross_vm.writer_site_visit_brief_easy

