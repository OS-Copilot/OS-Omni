task_id: linux.thunderbird.oracle.thunderbird_filter_discount_to_promotions
platform: linux
instruction: Oracle sanity task for linux.thunderbird.thunderbird_filter_discount_to_promotions.
  The initializer already patches the Thunderbird profile to the expected state. Wait
  briefly and finish.
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
    - type: download
      url: https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/thunderbird/dd84e895-72fd-4023-a336-97689ded257c/thunderbird-profile.tar.gz
      path: /home/user/thunderbird-profile.tar.gz
    - type: run_command
      command: tar -xzv --recursive-unlink -f /home/user/thunderbird-profile.tar.gz
        -C /home/user/
    - type: launch_app
      command: /usr/bin/thunderbird
    - type: run_bash
      script: 'python3 - <<''PY''

        from pathlib import Path

        base = Path(''/home/user/.thunderbird/t5q2a5hp.default-release'')

        (base / ''Mail'' / ''Local Folders'').mkdir(parents=True, exist_ok=True)

        (base / ''Mail'' / ''Local Folders'' / ''Promotions'').write_text('''', encoding=''utf-8'')

        (base / ''Mail'' / ''Local Folders'' / ''Promotions.msf'').write_text('''',
        encoding=''utf-8'')

        rules = base / ''ImapMail'' / ''outlook.office365.com'' / ''msgFilterRules.dat''

        rules.parent.mkdir(parents=True, exist_ok=True)

        rules.write_text(''version=9\nlogging=no\nname=discount to Promotions\nenabled=yes\ntype=17\naction=Move
        to folder\nactionValue=mailbox://nobody@Local%20Folders/Promotions\ncondition=AND
        (subject,contains,discount)\n'', encoding=''utf-8'')

        PY'
    wait_ms: 1200
evaluation:
  evaluator_id: evaluators.linux.thunderbird:ThunderbirdTaskEvaluator
  params:
    osworld_evaluator:
      postconfig:
      - type: close_window
        parameters:
          window_name: Message Filters
          strict: true
      - type: sleep
        parameters:
          seconds: 0.5
      func: check_thunderbird_filter
      result:
        type: vm_file
        path: /home/user/.thunderbird/t5q2a5hp.default-release/ImapMail/outlook.office365.com/msgFilterRules.dat
        dest: msgFilterRules.dat
      expected:
        type: rule
        rules:
          expect:
          - enabled: 'yes'
            action: Move to folder
            actionValue: mailbox://nobody@Local%20Folders/Promotions
            condition:
            - AND (subject,contains,discount)
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  app: Thunderbird
  difficulty: null
  tags:
  - email
  - thunderbird
  - hard
  - osworld
  - oracle
  description: Oracle sanity task for linux.thunderbird.thunderbird_filter_discount_to_promotions
  oracle_for: linux.thunderbird.thunderbird_filter_discount_to_promotions
