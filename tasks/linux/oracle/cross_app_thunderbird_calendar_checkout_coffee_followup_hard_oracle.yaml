task_id: linux.cross_app.oracle.thunderbird_calendar_checkout_coffee_followup_hard
platform: linux
instruction: Oracle sanity task for linux.cross_app.thunderbird_calendar_checkout_coffee_followup_hard. The initializer already seeds the expected OpenShop and Thunderbird state. Wait briefly and finish.
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: |
        pkill -f thunderbird || true
        pkill -f openshop || true
      timeout: 120
    - type: wait
      ms: 1200
    - type: download
      url: https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/thunderbird/dd84e895-72fd-4023-a336-97689ded257c/thunderbird-profile.tar.gz
      path: /home/user/thunderbird-profile.tar.gz
    - type: run_bash
      script: tar -xzv --recursive-unlink -f /home/user/thunderbird-profile.tar.gz -C /home/user/
      timeout: 120
    - type: run_bash
      script: |
        export DISPLAY=${DISPLAY:-:0}
        export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority}
        export XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-/run/user/$(id -u)}
        export DBUS_SESSION_BUS_ADDRESS=${DBUS_SESSION_BUS_ADDRESS:-unix:path=${XDG_RUNTIME_DIR}/bus}
        setsid -f openshop >/dev/null 2>&1
      timeout: 120
    - type: wait
      ms: 4000
    - type: run_bash
      script: |
        python3 - <<'PY'
        import json
        import time
        import urllib.request
        from pathlib import Path

        BASE_URL = "http://127.0.0.1:4310"
        DEADLINE = time.time() + 30

        def request_json(path, method="GET", payload=None):
            data = None
            headers = {"Content-Type": "application/json"}
            if payload is not None:
                data = json.dumps(payload).encode("utf-8")
            req = urllib.request.Request(BASE_URL + path, data=data, headers=headers, method=method)
            with urllib.request.urlopen(req, timeout=5) as resp:
                body = resp.read().decode("utf-8")
                return json.loads(body) if body else {}

        while time.time() < DEADLINE:
            try:
                request_json("/api/bootstrap")
                break
            except Exception:
                time.sleep(0.5)
        else:
            raise SystemExit("Timed out waiting for OpenShop app API")

        request_json("/api/dev/reset", method="POST", payload={})
        request_json("/api/login", method="POST", payload={"phone": "13800138000", "password": "spring2026"})
        request_json("/api/cart/items", method="POST", payload={"productId": "p1005", "quantity": 1, "selectedSpec": "20 sachets"})
        request_json("/api/checkout", method="POST", payload={"addressId": "addr-office", "paymentMethodId": "wechat", "note": "Leave it at the front desk"})
        Path("/home/user/.thunderbird/bench_oracle_calendar.txt").write_text("Bench Coffee Delivery Follow-up\n", encoding="utf-8")
        print("OPENSHOP_AND_CALENDAR_READY")
        PY
      timeout: 120
    - type: run_bash
      script: |
        export DISPLAY=:0
        setsid -f /usr/bin/thunderbird -calendar >/dev/null 2>&1
      timeout: 120
    - type: wait
      ms: 4500
evaluation:
  evaluator_id: evaluators.linux.command_check:CommandCheckEvaluator
  params:
    timeout: 120
    stdout_contains: PASS
    command: |
      set -euo pipefail
      python3 - <<'PY'
      import json
      import urllib.request

      BASE_URL = "http://127.0.0.1:4310"
      def request_json(path):
          req = urllib.request.Request(BASE_URL + path, method="GET")
          with urllib.request.urlopen(req, timeout=8) as resp:
              return json.loads(resp.read().decode("utf-8"))

      session_payload = request_json("/api/session")
      cart_payload = request_json("/api/cart")
      orders_payload = request_json("/api/orders")
      session = dict(session_payload.get("session") or {})
      assert bool(session.get("loggedIn")) is True
      assert str((session.get("user") or {}).get("phone") or "") == "13800138000"
      items = list(cart_payload.get("items") or [])
      assert len(items) == 0
      assert float(cart_payload.get("total") or 0) == 0.0
      orders = list(orders_payload.get("orders") or [])
      assert len(orders) == 1
      latest = dict(orders[0] or {})
      assert str(latest.get("status") or "") == "Awaiting Shipment"
      assert str((latest.get("address") or {}).get("label") or "") == "Office"
      assert str((latest.get("payment") or {}).get("id") or "") == "wechat"
      assert str((latest.get("payment") or {}).get("label") or "") == "WeChat Pay"
      assert str(latest.get("note") or "") == "Leave it at the front desk"
      assert float(latest.get("total") or 0) == 78.0
      order_items = list(latest.get("items") or [])
      assert len(order_items) == 1
      item = dict(order_items[0] or {})
      product = dict(item.get("product") or {})
      assert str(product.get("id") or "") == "p1005"
      assert int(item.get("quantity") or 0) == 1
      assert str(item.get("selectedSpec") or "") == "20 sachets"
      PY
      grep -R -a -q "Bench Coffee Delivery Follow-up" /home/user/.thunderbird
      echo "PASS"
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [linux, cross_app, calendar, shopping, thunderbird, openshop, hard, oracle]
  app: Thunderbird Calendar + OpenShop
  difficulty: hard
  description: Oracle sanity task for linux.cross_app.thunderbird_calendar_checkout_coffee_followup_hard.
  oracle_for: linux.cross_app.thunderbird_calendar_checkout_coffee_followup_hard
