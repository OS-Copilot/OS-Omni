task_id: linux.thunderbird.oracle.thunderbird_enable_dark_mode
platform: linux
instruction: Oracle sanity task for linux.thunderbird.thunderbird_enable_dark_mode.
  The initializer already patches the Thunderbird profile to the expected state. Wait
  briefly and finish.
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
    - type: download
      url: https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/thunderbird/dd84e895-72fd-4023-a336-97689ded257c/thunderbird-profile.tar.gz
      path: /home/user/thunderbird-profile.tar.gz
    - type: run_command
      command: tar -xzv --recursive-unlink -f /home/user/thunderbird-profile.tar.gz
        -C /home/user/
    - type: launch_app
      command: /usr/bin/thunderbird
    - type: run_bash
      script: "python3 - <<'PY'\nfrom pathlib import Path\np = Path('/home/user/.thunderbird/t5q2a5hp.default-release/prefs.js')\n\
        text = p.read_text(encoding='utf-8') if p.exists() else ''\nline = 'user_pref(\"\
        extensions.activeThemeID\", \"thunderbird-compact-dark@mozilla.org\");'\n\
        if 'extensions.activeThemeID' in text:\n    import re\n    text = re.sub(r'user_pref\\\
        (\"extensions\\.activeThemeID\", .*?\\);', line, text)\nelse:\n    if text\
        \ and not text.endswith('\\n'):\n        text += '\\n'\n    text += line +\
        \ '\\n'\np.write_text(text, encoding='utf-8')\nPY"
    wait_ms: 1200
evaluation:
  evaluator_id: evaluators.linux.thunderbird:ThunderbirdTaskEvaluator
  params:
    osworld_evaluator:
      postconfig:
      - type: close_window
        parameters:
          window_name: Mail.thunderbird
          strict: true
          by_class: true
      - type: sleep
        parameters:
          seconds: 0.5
      func: check_thunderbird_prefs
      result:
        type: vm_file
        path: /home/user/.thunderbird/t5q2a5hp.default-release/prefs.js
        dest: thunder-prefs.js
      expected:
        type: rule
        rules:
          expect:
            extensions.activeThemeID:
              method: re
              ref: dark
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  app: Thunderbird
  difficulty: null
  tags:
  - email
  - thunderbird
  - easy
  - osworld
  - oracle
  description: Oracle sanity task for linux.thunderbird.thunderbird_enable_dark_mode
  oracle_for: linux.thunderbird.thunderbird_enable_dark_mode
