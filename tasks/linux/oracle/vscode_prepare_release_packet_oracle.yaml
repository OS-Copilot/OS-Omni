task_id: linux.vscode.oracle.prepare_release_packet
platform: linux
instruction: Oracle sanity task for linux.vscode.prepare_release_packet. The initializer
  already writes the expected workspace files. Wait briefly and finish.
init:
  initializer_id: initializers.linux.notepadqq:NotepadqqInitializer
  params:
    app_command: gedit
    workspace_name: vscode_release_packet
    workspace_root: /tmp/helloworld_vscode_workspace
    files:
    - path: config/release-plan.json
      content: "{\n  \"version\": \"2.7.4\",\n  \"owner\": \"Priya Nair\",\n  \"qaStatus\"\
        : \"Ready for verification\",\n  \"rolloutDate\": \"2026-05-02\",\n  \"featureFlags\"\
        : [\n    \"fast-sync\",\n    \"side-panel\",\n    \"share-sheet\"\n  ]\n}\n"
    - path: notes/release-summary.md
      content: 'Release 2.7.4 is owned by Priya Nair and rolls out on 2026-05-02 with
        fast-sync, side-panel, and share-sheet enabled.


        Keep this note under 2 sentences.

        '
    open_files:
    - config/release-plan.json
    - notes/release-summary.md
evaluation:
  evaluator_id: evaluators.linux.vscode:VSCodeWorkspaceEvaluator
  params:
    workspace_path: /tmp/helloworld_vscode_workspace/vscode_release_packet
    files:
    - path: config/release-plan.json
      json:
        version: 2.7.4
        owner: Priya Nair
        qaStatus: Ready for verification
        rolloutDate: '2026-05-02'
        featureFlags:
        - fast-sync
        - side-panel
        - share-sheet
    - path: notes/release-summary.md
      equals: 'Release 2.7.4 is owned by Priya Nair and rolls out on 2026-05-02 with
        fast-sync, side-panel, and share-sheet enabled.


        Keep this note under 2 sentences.

        '
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  app: VS Code
  difficulty: hard
  tags:
  - linux
  - gui
  - gedit
  - editor
  - json
  - markdown
  - hard
  - oracle
  description: Oracle sanity task for linux.vscode.prepare_release_packet
  oracle_for: linux.vscode.prepare_release_packet
