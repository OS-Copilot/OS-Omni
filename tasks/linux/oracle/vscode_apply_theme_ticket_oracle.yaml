task_id: linux.vscode.oracle.apply_theme_ticket
platform: linux
instruction: Oracle sanity task for linux.vscode.apply_theme_ticket. The initializer
  already writes the expected workspace files. Wait briefly and finish.
init:
  initializer_id: initializers.linux.notepadqq:NotepadqqInitializer
  params:
    app_command: gedit
    workspace_name: vscode_theme_ticket
    workspace_root: /tmp/helloworld_vscode_workspace
    files:
    - path: web/src/header.html
      content: "<header class=\"app-header\">\n  <h1>Harbor Ops Console</h1>\n  <span\
        \ class=\"status-badge\">Ready for QA</span>\n  <button class=\"shortcut-button\"\
        >Open Runbook</button>\n</header>\n"
    - path: web/src/theme.css
      content: ":root {\n  --primary-color: #1F6FEB;\n  --accent-color: #F59E0B;\n\
        }\n"
    - path: config/support.json
      content: "{\n  \"email\": \"ops@harbor.example\"\n}\n"
    open_files:
    - web/src/header.html
    - web/src/theme.css
    - config/support.json
evaluation:
  evaluator_id: evaluators.linux.vscode:VSCodeWorkspaceEvaluator
  params:
    workspace_path: /tmp/helloworld_vscode_workspace/vscode_theme_ticket
    files:
    - path: web/src/header.html
      equals: "<header class=\"app-header\">\n  <h1>Harbor Ops Console</h1>\n  <span\
        \ class=\"status-badge\">Ready for QA</span>\n  <button class=\"shortcut-button\"\
        >Open Runbook</button>\n</header>\n"
    - path: web/src/theme.css
      equals: ":root {\n  --primary-color: #1F6FEB;\n  --accent-color: #F59E0B;\n\
        }\n"
    - path: config/support.json
      json:
        email: ops@harbor.example
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  app: VS Code
  difficulty: hard
  tags:
  - linux
  - gui
  - gedit
  - editor
  - html
  - css
  - json
  - hard
  - oracle
  description: Oracle sanity task for linux.vscode.apply_theme_ticket
  oracle_for: linux.vscode.apply_theme_ticket
