task_id: linux.gimp.oracle.convert_grayscale
platform: linux
instruction: Open the image at /tmp/helloworld_gimp/input.png in GIMP. Convert the image to grayscale using Image → Mode → Grayscale, then export the result to /tmp/helloworld_gimp/gray.png as a PNG file using File → Export As. Stop once the file has been saved.
init:
  initializer_id: initializers.linux.gimp:GimpInitializer
  params:
    app_command: gimp
    workspace: /tmp/helloworld_gimp
    input_image: /tmp/helloworld_gimp/input.png
    image_width: 1920
    image_height: 1080
evaluation:
  evaluator_id: evaluators.linux.gimp:GimpFileEvaluator
  params:
    output_path: /tmp/helloworld_gimp/gray.png
    expected_mode: L
    expected_format: PNG
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - linux
  - gui
  - image
  - gimp
  - grayscale
  - mode
  - oracle
  app: GIMP
  difficulty: easy
  description: Oracle sanity task for linux.gimp.convert_grayscale.
  oracle_for: linux.gimp.convert_grayscale
