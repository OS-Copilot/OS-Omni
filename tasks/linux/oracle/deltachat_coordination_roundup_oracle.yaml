task_id: linux.deltachat.oracle.coordination_roundup
platform: linux
instruction: "In Delta Chat, read the seeded chats and complete every follow-up below. Use the exact sentence templates shown, replacing each placeholder with the correct values from the conversations. 1. In Alice, send: Confirmed for {meeting_time} in {meeting_room}. 2. In Bob, send: I will send {budget_filename} by {budget_deadline}. 3. In Nora, send: The coffee restock order is {order_number} from {vendor}. 4. In Ops Sprint, send: Coordination update: Alice confirmed for {meeting_time} in {meeting_room}, Bob gets {budget_filename} by {budget_deadline}, Nora needs {order_number} from {vendor}."
init:
  initializer_id: initializers.linux.deltachat:DeltaChatOracleInitializer
  params:
    app_command: deltachat-desktop
    expectations:
      - chat_name: Alice
        expected_text: "Confirmed for 14:30 in Cedar Room."
      - chat_name: Bob
        expected_text: "I will send budget-v4.xlsx by 16:45."
      - chat_name: Nora
        expected_text: "The coffee restock order is PO-417 from Northwind."
      - chat_name: Ops Sprint
        expected_text: "Coordination update: Alice confirmed for 14:30 in Cedar Room, Bob gets budget-v4.xlsx by 16:45, Nora needs PO-417 from Northwind."
evaluation:
  evaluator_id: evaluators.linux.deltachat:DeltaChatMessageEvaluator
  params:
    expectations:
      - chat_name: Alice
        expected_text: "Confirmed for 14:30 in Cedar Room."
      - chat_name: Bob
        expected_text: "I will send budget-v4.xlsx by 16:45."
      - chat_name: Nora
        expected_text: "The coffee restock order is PO-417 from Northwind."
      - chat_name: Ops Sprint
        expected_text: "Coordination update: Alice confirmed for 14:30 in Cedar Room, Bob gets budget-v4.xlsx by 16:45, Nora needs PO-417 from Northwind."
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [linux, gui, chat, deltachat, coordination, oracle]
  app: Delta Chat
  description: Oracle sanity task for the coordination roundup workflow.
  oracle_for: linux.deltachat.reply_alice
