task_id: linux.deltachat.oracle.end_of_day_wrap
platform: linux
instruction: "In Delta Chat, prepare the end-of-day wrap-up by reading the seeded chats and sending every required message. Replace each placeholder with the correct values from the conversations. 1. In Alice, send: Confirmed {meeting_time} in {meeting_room}; budget file {budget_filename} follows after. 2. In Bob, send: {budget_filename} with initials {owner_initials} by {budget_deadline}; order {order_number} tracked. 3. In Nora, send: Order {order_number} from {vendor} will be sent before {order_deadline}. 4. In Support Desk, send: Ticket {ticket_id} hit {error_code}, recovered after second launch, owner {owner}, window {deploy_window}. 5. In Ops Sprint, send: End-of-day plan: Alice {meeting_time}/{meeting_room}, Bob {budget_filename} by {budget_deadline}, Nora {order_number} for {vendor} before {order_deadline}, Support {ticket_id}/{error_code} owned by {owner} during {deploy_window}."
init:
  initializer_id: initializers.linux.deltachat:DeltaChatOracleInitializer
  params:
    app_command: deltachat-desktop
    expectations:
      - chat_name: Alice
        expected_text: "Confirmed 14:30 in Cedar Room; budget file budget-v4.xlsx follows after."
      - chat_name: Bob
        expected_text: "budget-v4.xlsx with initials EP by 16:45; order PO-417 tracked."
      - chat_name: Nora
        expected_text: "Order PO-417 from Northwind will be sent before 18:10."
      - chat_name: Support Desk
        expected_text: "Ticket SR-88 hit WX-17, recovered after second launch, owner Malik, window 19:30-20:00."
      - chat_name: Ops Sprint
        expected_text: "End-of-day plan: Alice 14:30/Cedar Room, Bob budget-v4.xlsx by 16:45, Nora PO-417 for Northwind before 18:10, Support SR-88/WX-17 owned by Malik during 19:30-20:00."
evaluation:
  evaluator_id: evaluators.linux.deltachat:DeltaChatMessageEvaluator
  params:
    expectations:
      - chat_name: Alice
        expected_text: "Confirmed 14:30 in Cedar Room; budget file budget-v4.xlsx follows after."
      - chat_name: Bob
        expected_text: "budget-v4.xlsx with initials EP by 16:45; order PO-417 tracked."
      - chat_name: Nora
        expected_text: "Order PO-417 from Northwind will be sent before 18:10."
      - chat_name: Support Desk
        expected_text: "Ticket SR-88 hit WX-17, recovered after second launch, owner Malik, window 19:30-20:00."
      - chat_name: Ops Sprint
        expected_text: "End-of-day plan: Alice 14:30/Cedar Room, Bob budget-v4.xlsx by 16:45, Nora PO-417 for Northwind before 18:10, Support SR-88/WX-17 owned by Malik during 19:30-20:00."
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [linux, gui, chat, deltachat, wrapup, oracle]
  app: Delta Chat
  description: Oracle sanity task for the end-of-day wrap workflow.
  oracle_for: linux.deltachat.group_ops_sprint
