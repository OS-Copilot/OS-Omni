task_id: linux.notepadqq.oracle.prepare_release_packet
platform: linux
instruction: Oracle sanity task for linux.notepadqq.prepare_release_packet. The initializer
  already writes the expected workspace files. Wait briefly and finish.
init:
  initializer_id: initializers.linux.notepadqq:NotepadqqInitializer
  params:
    app_command: gedit
    workspace_name: notepadqq_release_packet
    workspace_root: /tmp/helloworld_notepadqq_workspace
    files:
    - path: config/release-plan.json
      content: "{\n  \"version\": \"5.4.2\",\n  \"owner\": \"Elena Park\",\n  \"qaStatus\"\
        : \"Ready for sign-off\",\n  \"rolloutDate\": \"2026-06-12\",\n  \"rollbackOwner\"\
        : \"Mina Sol\",\n  \"signoffRequired\": true,\n  \"channels\": [\n    \"linux\"\
        ,\n    \"windows\",\n    \"android\"\n  ]\n}\n"
    - path: notes/release-summary.md
      content: 'Release 5.4.2 is owned by Elena Park and rolls out on 2026-06-12 for
        linux, windows, and android. QA is Ready for sign-off and rollback is owned
        by Mina Sol.


        Keep this note short.

        '
    open_files:
    - config/release-plan.json
    - notes/release-summary.md
evaluation:
  evaluator_id: evaluators.linux.notepadqq:NotepadqqWorkspaceEvaluator
  params:
    workspace_path: /tmp/helloworld_notepadqq_workspace/notepadqq_release_packet
    files:
    - path: config/release-plan.json
      json:
        version: 5.4.2
        owner: Elena Park
        qaStatus: Ready for sign-off
        rolloutDate: '2026-06-12'
        rollbackOwner: Mina Sol
        signoffRequired: true
        channels:
        - linux
        - windows
        - android
    - path: notes/release-summary.md
      equals: 'Release 5.4.2 is owned by Elena Park and rolls out on 2026-06-12 for
        linux, windows, and android. QA is Ready for sign-off and rollback is owned
        by Mina Sol.


        Keep this note short.

        '
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  app: Notepadqq
  difficulty: hard
  tags:
  - linux
  - gui
  - gedit
  - editor
  - json
  - markdown
  - hard
  - oracle
  description: Oracle sanity task for linux.notepadqq.prepare_release_packet
  oracle_for: linux.notepadqq.prepare_release_packet
