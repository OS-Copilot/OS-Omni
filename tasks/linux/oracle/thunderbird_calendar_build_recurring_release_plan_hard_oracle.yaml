task_id: linux.oracle.thunderbird_calendar_build_recurring_release_plan_hard
platform: linux
instruction: Oracle sanity task for linux.thunderbird_calendar.build_recurring_release_plan_hard. The initializer already seeds the expected Thunderbird Calendar state. Wait briefly and finish.
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
      - type: run_bash
        script: |
          pkill -f thunderbird || true
        timeout: 120
      - type: wait
        ms: 1200
      - type: download
        url: https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/thunderbird/dd84e895-72fd-4023-a336-97689ded257c/thunderbird-profile.tar.gz
        path: /home/user/thunderbird-profile.tar.gz
      - type: run_bash
        script: tar -xzv --recursive-unlink -f /home/user/thunderbird-profile.tar.gz -C /home/user/
        timeout: 120
      - type: run_bash
        script: |
          for _ in $(seq 1 10); do
            if ! pgrep -x thunderbird >/dev/null 2>&1; then
              break
            fi
            pkill -TERM -x thunderbird || true
            sleep 0.5
          done
          pkill -KILL -x thunderbird || true
          sleep 1
          python3 - <<'PY'
          import sqlite3
          from datetime import datetime, time as dt_time, timedelta, timezone
          from pathlib import Path

          profile_dir = Path("/home/user/.thunderbird/t5q2a5hp.default-release")
          db_path = profile_dir / "calendar-data" / "local.sqlite"
          conn = sqlite3.connect(db_path)
          cur = conn.cursor()
          cur.execute("DELETE FROM cal_alarms")
          cur.execute("DELETE FROM cal_recurrence")
          cur.execute("DELETE FROM cal_events")

          now_local = datetime.now().astimezone()
          local_tz = now_local.tzinfo
          tz_name = str(local_tz or "")
          created = int(round(now_local.astimezone(timezone.utc).timestamp() * 1000000))
          next_monday = now_local.date() - timedelta(days=now_local.date().weekday()) + timedelta(days=7)

          def to_micros(dt_value):
              return int(round(dt_value.astimezone(timezone.utc).timestamp() * 1000000))

          def insert_event(item_id, title, event_date, hour, minute, duration_minutes):
              start_local = datetime.combine(
                  event_date,
                  dt_time(hour=hour, minute=minute),
                  tzinfo=local_tz,
              )
              end_local = start_local + timedelta(minutes=duration_minutes)
              cur.execute(
                  """
                  INSERT INTO cal_events (
                      cal_id, id, time_created, last_modified, title, priority, privacy, ical_status,
                      flags, event_start, event_end, event_stamp, event_start_tz, event_end_tz,
                      recurrence_id, recurrence_id_tz, alarm_last_ack, offline_journal
                  ) VALUES (?, ?, ?, ?, ?, 0, '', '', 0, ?, ?, ?, ?, ?, NULL, '', NULL, 0)
                  """,
                  (
                      "home",
                      item_id,
                      created,
                      created,
                      title,
                      to_micros(start_local),
                      to_micros(end_local),
                      created,
                      tz_name,
                      tz_name,
                  ),
              )

          recurring_date = next_monday + timedelta(days=1)
          insert_event("weekly-release-triage", "Weekly Release Triage", recurring_date, 9, 15, 45)
          cur.execute(
              "INSERT INTO cal_recurrence (item_id, cal_id, icalString) VALUES (?, ?, ?)",
              ("weekly-release-triage", "home", "RRULE:FREQ=WEEKLY;BYDAY=TU"),
          )
          cur.execute(
              "INSERT INTO cal_alarms (cal_id, item_id, recurrence_id, recurrence_id_tz, icalString) VALUES (?, ?, NULL, '', ?)",
              ("home", "weekly-release-triage", "BEGIN:VALARM\nTRIGGER:-PT15M\nACTION:DISPLAY\nEND:VALARM"),
          )

          insert_event("qa-signoff", "QA Sign-off", next_monday + timedelta(days=3), 11, 0, 30)
          insert_event("launch-readiness-review", "Launch Readiness Review", next_monday + timedelta(days=4), 16, 0, 60)

          conn.commit()
          conn.close()
          print("THUNDERBIRD_CALENDAR_READY")
          PY
        timeout: 120
evaluation:
  evaluator_id: evaluators.linux.thunderbird_calendar:ThunderbirdCalendarEvaluator
  params:
    profile_dir: /home/user/.thunderbird/t5q2a5hp.default-release
    required_titles:
      - Weekly Release Triage
      - QA Sign-off
      - Launch Readiness Review
    recurrence_checks:
      Weekly Release Triage:
        - rrule
        - freq=weekly
        - byday=tu
    event_expectations:
      Weekly Release Triage:
        relative_day: next_week
        weekday: tuesday
        start_time: "09:15"
        duration_minutes: 45
        recurrence_keywords:
          - rrule
          - freq=weekly
          - byday=tu
        alarm_keywords:
          - -pt15m
      QA Sign-off:
        relative_day: next_week
        weekday: thursday
        start_time: "11:00"
        duration_minutes: 30
      Launch Readiness Review:
        relative_day: next_week
        weekday: friday
        start_time: "16:00"
        duration_minutes: 60
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [linux, thunderbird, calendar, recurring, hard, oracle]
  app: Thunderbird Calendar
  difficulty: hard
  description: Oracle sanity task for linux.thunderbird_calendar.build_recurring_release_plan_hard.
  oracle_for: linux.thunderbird_calendar.build_recurring_release_plan_hard
