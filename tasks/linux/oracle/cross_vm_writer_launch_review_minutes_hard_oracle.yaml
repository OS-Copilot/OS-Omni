task_id: linux.oracle.cross_vm.writer_launch_review_minutes_hard
platform: linux
instruction: >
  Oracle sanity task for linux.cross_vm.writer_launch_review_minutes_hard. The
  initializer writes the expected document and sidecar files directly.
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: |
        set -e
        pkill -f '[s]office.bin' >/dev/null 2>&1 || true
        pkill -f '/usr/lib/libreoffice/program/[s]office' >/dev/null 2>&1 || true
        mkdir -p /home/user/Documents /home/user/Desktop
        rm -f /home/user/Documents/launch_review_minutes.docx \
          /home/user/Documents/launch_review_owner_matrix.csv \
          /home/user/Desktop/launch_review_archive_manifest.txt
      timeout: 120
    - type: write_file
      path: /home/user/Desktop/launch_review_transfer.txt
      content: |
        Launch Readiness Review
        Attendees: Maya Chen; Jordan Lee; Priya Nair; Theo Martin
        Decisions: Keep the launch window on July 18; publish the final checklist after the dry run
        Actions: Jordan owns vendor staging access by Tuesday; Priya owns revised demo script; Theo owns final travel roster at 18 people
        Risks: vendor staging account owners are not final; demo recording depends on the dry-run room audio
        Next checkpoint: Friday 09:30 readiness sync with launch leads
    - type: run_python
      code: |
        import zipfile
        from pathlib import Path
        from xml.sax.saxutils import escape

        lines = [
            "Launch Readiness Review",
            "Source: launch_review_transfer.txt",
            "Attendees:",
            "Maya Chen",
            "Jordan Lee",
            "Priya Nair",
            "Theo Martin",
            "Decisions:",
            "Keep the launch window on July 18.",
            "Publish the final checklist after the dry run.",
            "Action Items:",
            "Jordan Lee - confirm vendor staging access by Tuesday.",
            "Priya Nair - send revised demo script to the field team.",
            "Theo Martin - lock the final travel roster at 18 people.",
            "Risks:",
            "Vendor staging account owners are not final.",
            "Demo recording depends on the dry-run room audio.",
            "Next Checkpoint:",
            "Friday 09:30 readiness sync with launch leads.",
        ]
        paragraphs = "".join(f"<w:p><w:r><w:t>{escape(line)}</w:t></w:r></w:p>" for line in lines)
        document_xml = (
            '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
            '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'
            f"<w:body>{paragraphs}<w:sectPr><w:pgSz w:w=\"12240\" w:h=\"15840\"/>"
            '<w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" '
            'w:header="720" w:footer="720" w:gutter="0"/></w:sectPr></w:body></w:document>'
        )
        content_types = (
            '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
            '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
            '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
            '<Default Extension="xml" ContentType="application/xml"/>'
            '<Override PartName="/word/document.xml" '
            'ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'
            '</Types>'
        )
        package_rels = (
            '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
            '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
            '<Relationship Id="rId1" '
            'Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" '
            'Target="word/document.xml"/></Relationships>'
        )
        docx_path = Path("/home/user/Documents/launch_review_minutes.docx")
        with zipfile.ZipFile(docx_path, "w", compression=zipfile.ZIP_DEFLATED) as docx:
            docx.writestr("[Content_Types].xml", content_types)
            docx.writestr("_rels/.rels", package_rels)
            docx.writestr("word/document.xml", document_xml)

        Path("/home/user/Documents/launch_review_owner_matrix.csv").write_text(
            "owner,area,status\n"
            "Jordan Lee,vendor staging,blocked\n"
            "Priya Nair,demo script,ready\n"
            "Theo Martin,travel roster,locked\n",
            encoding="utf-8",
        )
        Path("/home/user/Desktop/launch_review_archive_manifest.txt").write_text(
            "document=launch_review_minutes.docx\n"
            "source=launch_review_transfer.txt\n"
            "archive=Launch/Readiness/Final\n"
            "status=ready\n",
            encoding="utf-8",
        )
evaluation:
  evaluator_id: evaluators.linux.command_check:CommandCheckEvaluator
  params:
    timeout: 120
    stdout_contains: PASS
    command: |
      python3 - <<'PY'
      import zipfile
      import xml.etree.ElementTree as ET
      from pathlib import Path

      with zipfile.ZipFile("/home/user/Documents/launch_review_minutes.docx") as zf:
          root = ET.fromstring(zf.read("word/document.xml"))
      ns = {"w": "http://schemas.openxmlformats.org/wordprocessingml/2006/main"}
      lines = []
      for paragraph in root.findall(".//w:body/w:p", ns):
          text = "".join(node.text or "" for node in paragraph.findall(".//w:t", ns)).strip()
          if text:
              lines.append(text)
      expected = [
          "Launch Readiness Review",
          "Source: launch_review_transfer.txt",
          "Attendees:",
          "Maya Chen",
          "Jordan Lee",
          "Priya Nair",
          "Theo Martin",
          "Decisions:",
          "Keep the launch window on July 18.",
          "Publish the final checklist after the dry run.",
          "Action Items:",
          "Jordan Lee - confirm vendor staging access by Tuesday.",
          "Priya Nair - send revised demo script to the field team.",
          "Theo Martin - lock the final travel roster at 18 people.",
          "Risks:",
          "Vendor staging account owners are not final.",
          "Demo recording depends on the dry-run room audio.",
          "Next Checkpoint:",
          "Friday 09:30 readiness sync with launch leads.",
      ]
      if lines != expected:
          raise SystemExit(f"LINES_MISMATCH:{lines}")

      sidecars = {
          "/home/user/Documents/launch_review_owner_matrix.csv": [
              "owner,area,status",
              "Jordan Lee,vendor staging,blocked",
              "Priya Nair,demo script,ready",
              "Theo Martin,travel roster,locked",
          ],
          "/home/user/Desktop/launch_review_archive_manifest.txt": [
              "document=launch_review_minutes.docx",
              "source=launch_review_transfer.txt",
              "archive=Launch/Readiness/Final",
              "status=ready",
          ],
      }
      for path, expected_lines in sidecars.items():
          actual_lines = [
              line.strip()
              for line in Path(path).read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          if actual_lines != expected_lines:
              raise SystemExit(f"SIDECAR_MISMATCH:{path}:{actual_lines}")
      print("PASS")
      PY
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [linux, cross_vm, oracle, hard]
  difficulty: hard
  oracle_for: linux.cross_vm.writer_launch_review_minutes_hard
