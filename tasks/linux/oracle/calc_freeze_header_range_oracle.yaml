task_id: linux.calc.oracle.freeze_header_range
platform: linux
instruction: Oracle sanity task for linux.calc.freeze_header_range. The initializer writes the expected workbook state and handoff files. Wait briefly and finish.
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
    - type: download
      url: https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_calc/4188d3a4-077d-46b7-9c86-23e1a036f6c1/Freeze_row_column2_gold.xlsx
      path: /tmp/helloworld_office/calc_4188d3a4_actual.xlsx
    - type: download
      url: https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_calc/4188d3a4-077d-46b7-9c86-23e1a036f6c1/Freeze_row_column2_gold.xlsx
      path: /tmp/helloworld_office/calc_4188d3a4_expected.xlsx
    - type: run_bash
      script: |
        rm -f /tmp/helloworld_office/calc_freeze_audit_export.csv \
          /tmp/helloworld_office/calc_freeze_review_manifest.txt \
          /tmp/helloworld_office/calc_freeze_dimension_manifest.txt \
          /tmp/helloworld_office/calc_freeze_signoff_manifest.txt \
          /tmp/helloworld_office/calc_freeze_review_packet.tsv \
          /tmp/helloworld_office/calc_freeze_ui_checklist.txt \
          /tmp/helloworld_office/calc_freeze_bundle_crosswalk.tsv \
          /tmp/helloworld_office/calc_freeze_dependency_index.txt || true
        mkdir -p /tmp/helloworld_office
        cat > /tmp/helloworld_office/calc_freeze_review.csv <<'EOF'
        check,state,owner
        freeze-pane,verified,ops
        header-style,verified,ops
        zoom,67,ops
        EOF
        cat > /tmp/helloworld_office/calc_freeze_handoff.txt <<'EOF'
        workbook=calc_4188d3a4_actual.xlsx
        sheet=Freeze Audit Final
        freeze=A1:B1
        status=ready-for-review
        EOF
      timeout: 120
evaluation:
  evaluator_id: evaluators.linux.xlsx_rule_compare:XlsxRuleEvaluator
  params:
    actual_path: /tmp/helloworld_office/calc_4188d3a4_actual.xlsx
    expected_path: /tmp/helloworld_office/calc_4188d3a4_expected.xlsx
    rules:
    - type: freeze
      sheet_idx0: 0
      sheet_idx1: EI0
    - type: zoom
      sheet_idx: 0
      method: eq
      ref: 67
    - type: sheet_name
      sheet_idx: 0
      method: eq
      ref: Freeze Audit Final
    - type: check_cell
      sheet_idx: 0
      coordinate: A1
      props:
        font_bold:
          method: eq
          ref: true
        bgcolor:
          method: eq
          ref: FFF2CC
        font_color:
          method: eq
          ref: 9C6500
        alignment_horizontal:
          method: eq
          ref: center
        alignment_vertical:
          method: eq
          ref: center
    - type: check_cell
      sheet_idx: 0
      coordinate: B1
      props:
        font_bold:
          method: eq
          ref: true
        bgcolor:
          method: eq
          ref: FFF2CC
        font_color:
          method: eq
          ref: 9C6500
        alignment_horizontal:
          method: eq
          ref: center
        alignment_vertical:
          method: eq
          ref: center
    - type: check_cell
      sheet_idx: 0
      coordinate: C1
      props:
        font_bold:
          method: eq
          ref: true
        bgcolor:
          method: eq
          ref: FFF2CC
        font_color:
          method: eq
          ref: 9C6500
        alignment_horizontal:
          method: eq
          ref: center
        alignment_vertical:
          method: eq
          ref: center
    - type: check_cell
      sheet_idx: 0
      coordinate: D1
      props:
        font_bold:
          method: eq
          ref: true
        bgcolor:
          method: eq
          ref: FFF2CC
        font_color:
          method: eq
          ref: 9C6500
        alignment_horizontal:
          method: eq
          ref: center
        alignment_vertical:
          method: eq
          ref: center
    - type: check_cell
      sheet_idx: 0
      coordinate: E1
      props:
        font_bold:
          method: eq
          ref: true
        bgcolor:
          method: eq
          ref: FFF2CC
        font_color:
          method: eq
          ref: 9C6500
        alignment_horizontal:
          method: eq
          ref: center
        alignment_vertical:
          method: eq
          ref: center
    - type: row_height
      sheet_idx: 0
      row: 1
      method: eq
      ref: 24
    - type: column_width
      sheet_idx: 0
      column: A
      method: eq
      ref: 18
    - type: column_width
      sheet_idx: 0
      column: B
      method: eq
      ref: 22
    - type: sheet_data
      sheet_idx0: 0
      sheet_idx1: EI0
    text_artifacts:
    - path: /tmp/helloworld_office/calc_freeze_review.csv
      equals: |
        check,state,owner
        freeze-pane,verified,ops
        header-style,verified,ops
        zoom,67,ops
    - path: /tmp/helloworld_office/calc_freeze_handoff.txt
      equals: |
        workbook=calc_4188d3a4_actual.xlsx
        sheet=Freeze Audit Final
        freeze=A1:B1
        status=ready-for-review
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - linux
  - gui
  - libreoffice
  - calc
  - xlsx
  - freeze
  - file_handoff
  - hard
  - oracle
  app: LibreOffice Calc
  difficulty: hard
  description: Oracle sanity task for linux.calc.freeze_header_range.
  oracle_for: linux.calc.freeze_header_range
