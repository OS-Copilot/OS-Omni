task_id: linux.openshop.oracle.add_headphones_to_cart
platform: linux
instruction: >
  In OpenShop, sign in with phone number 13800138000 and password spring2026.
  Use the Desktop file OpenShop_Bulk_Order_Request.txt as the source list.
  Add the six requested products to one cart, using the requested search,
  category, sort, and option/spec for each product. Keep every cart quantity at
  1. After the cart contains all six products, create
  /home/user/Desktop/OpenShop_Cart_Handoff.csv with exactly these seven
  comma-separated lines in this order: product_id,product,selected_spec,quantity;
  p1001,Verdant Pro Noise-Canceling Headphones,Bluetooth 5.4,1;
  p1005,Mountain Isle Pour-Over Coffee 20 Pack,20 sachets,1;
  p1006,Lumen Magnetic Phone Stand,Magnetic mount,1;
  p1004,Polar Day Slim Business Backpack,15.6-inch fit,1;
  p1002,Mukawa Folding Camping Table and Chair Set,Storage bag,1;
  p1003,Garden White Cotton Bedding Set 1.8m,200x230cm,1. Leave the cart open
  for review without checking out.
init:
  initializer_id: initializers.linux.openshop:OpenShopInitializer
  params:
    app_command: openshop
    benchmark_mode: linux.openshop.cart_handoff
    require_benchmark_api: true
    cleanup_paths:
      - /home/user/Desktop/OpenShop_Cart_Handoff.csv
    seed_files:
      - path: /home/user/Desktop/OpenShop_Bulk_Order_Request.txt
        content: |
          OpenShop bulk cart request
          1. Search "Verdant Pro Noise-Canceling Headphones"; category Electronics; sort Price High to Low; option Bluetooth 5.4.
          2. Search "Mountain Isle Pour-Over Coffee"; category Grocery; sort Price Low to High; option 20 sachets.
          3. Search "Lumen Magnetic Phone Stand"; category Electronics; sort Price Low to High; option Magnetic mount.
          4. Search "Polar Day Slim Business Backpack"; category Bags; sort Price High to Low; option 15.6-inch fit.
          5. Search "Mukawa Folding Camping Table and Chair Set"; category Home; sort Price High to Low; option Storage bag.
          6. Search "Garden White Cotton Bedding Set"; category Home; sort Price Low to High; option 200x230cm.
          Keep quantity 1 for every item and create OpenShop_Cart_Handoff.csv after review.
evaluation:
  evaluator_id: evaluators.linux.openshop:OpenShopApiEvaluator
  params:
    session:
      logged_in: true
      phone: '13800138000'
    cart:
      item_count: 6
      total: 1282
      items:
      - product_id: p1001
        quantity: 1
        selected_spec: Bluetooth 5.4
      - product_id: p1005
        quantity: 1
        selected_spec: 20 sachets
      - product_id: p1006
        quantity: 1
        selected_spec: Magnetic mount
      - product_id: p1004
        quantity: 1
        selected_spec: 15.6-inch fit
      - product_id: p1002
        quantity: 1
        selected_spec: Storage bag
      - product_id: p1003
        quantity: 1
        selected_spec: 200x230cm
    text_artifacts:
      - path: /home/user/Desktop/OpenShop_Cart_Handoff.csv
        equals: |
          product_id,product,selected_spec,quantity
          p1001,Verdant Pro Noise-Canceling Headphones,Bluetooth 5.4,1
          p1005,Mountain Isle Pour-Over Coffee 20 Pack,20 sachets,1
          p1006,Lumen Magnetic Phone Stand,Magnetic mount,1
          p1004,Polar Day Slim Business Backpack,15.6-inch fit,1
          p1002,Mukawa Folding Camping Table and Chair Set,Storage bag,1
          p1003,Garden White Cotton Bedding Set 1.8m,200x230cm,1
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - linux
  - gui
  - shopping
  - openshop
  - cart
  - file_handoff
  - hard
  - oracle
  description: Oracle task for building the six-item OpenShop cart from a desktop
    request file and creating the cart handoff CSV.
  oracle_for: linux.openshop.add_headphones_to_cart
  difficulty: hard
