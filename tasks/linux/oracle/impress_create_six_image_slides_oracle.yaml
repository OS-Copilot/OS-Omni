task_id: linux.impress.oracle.create_six_image_slides
platform: linux
instruction: Oracle sanity task for linux.impress.create_six_image_slides. The initializer already opens the expected presentation state and handoff files. Wait briefly and finish.
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: mkdir -p /tmp/helloworld_office
      timeout: 120
    - type: download
      url: https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_impress/bf4e9888-f10f-47af-8dba-76413038b73c/4.3-Template_4.29.2016_Gold.pptx
      path: /tmp/helloworld_office/impress_bf4e9888_actual.pptx
    - type: download
      url: https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_impress/bf4e9888-f10f-47af-8dba-76413038b73c/4.3-Template_4.29.2016_Gold.pptx
      path: /tmp/helloworld_office/impress_bf4e9888_expected.pptx
    - type: run_bash
      script: |
        rm -f /tmp/helloworld_office/impress_image_manifest.txt \
          /tmp/helloworld_office/impress_kiosk_manifest.txt \
          /tmp/helloworld_office/impress_slide_checks.txt \
          /tmp/helloworld_office/impress_timing_manifest.txt \
          /tmp/helloworld_office/impress_playback_manifest.txt \
          /tmp/helloworld_office/impress_qc_manifest.txt \
          /tmp/helloworld_office/impress_accessibility_manifest.txt \
          /tmp/helloworld_office/impress_export_manifest.txt \
          /tmp/helloworld_office/impress_operator_manifest.txt \
          /tmp/helloworld_office/impress_quality_gate_manifest.txt \
          /tmp/helloworld_office/impress_handoff_audit.txt \
          /tmp/helloworld_office/impress_asset_receipt.csv \
          /tmp/helloworld_office/impress_operator_queue.txt \
          /tmp/helloworld_office/impress_export_receipt.txt \
          /tmp/helloworld_office/impress_asset_timing_crosswalk.tsv \
          /tmp/helloworld_office/impress_bundle_dependency_index.txt || true
        cat > /tmp/helloworld_office/impress_asset_manifest.csv <<'EOF'
        slide,image,alt_text,status
        1,pic1.png,pic1.png,placed
        2,pic2.png,pic2.png,placed
        3,pic3.png,pic3.png,placed
        4,pic4.png,pic4.png,placed
        5,pic5.png,pic5.png,placed
        6,pic6.png,pic6.png,placed
        EOF
        cat > /tmp/helloworld_office/impress_operator_handoff.txt <<'EOF'
        deck=impress_bf4e9888_actual.pptx
        mode=continuous-playback
        owner=media-desk
        status=ready-for-preview
        EOF
        python3 - <<'PY'
        from pathlib import Path
        import re
        import tempfile
        import zipfile
        import xml.etree.ElementTree as ET

        pptx_path = Path("/tmp/helloworld_office/impress_bf4e9888_actual.pptx")
        presentation_ns = "http://schemas.openxmlformats.org/presentationml/2006/main"
        ET.register_namespace("p", presentation_ns)

        def q(name):
            return f"{{{presentation_ns}}}{name}"

        with tempfile.NamedTemporaryFile(delete=False, suffix=".pptx") as temp_file:
            temp_path = Path(temp_file.name)
        with zipfile.ZipFile(pptx_path, "r") as src, zipfile.ZipFile(temp_path, "w", zipfile.ZIP_DEFLATED) as dst:
            for info in src.infolist():
                data = src.read(info.filename)
                match = re.fullmatch(r"ppt/slides/slide([0-9]+)\.xml", info.filename)
                if match:
                    slide_index = int(match.group(1))
                    root = ET.fromstring(data)
                    pictures = root.findall(f".//{q('pic')}")
                    if not pictures:
                        raise SystemExit(f"NO_PICTURE_ON_SLIDE:{slide_index}")
                    c_nv_pr = pictures[0].find(f"{q('nvPicPr')}/{q('cNvPr')}")
                    if c_nv_pr is None:
                        raise SystemExit(f"NO_PICTURE_NONVISUAL_PROPS:{slide_index}")
                    c_nv_pr.set("descr", f"pic{slide_index}.png")
                    data = ET.tostring(root, encoding="utf-8", xml_declaration=True)
                dst.writestr(info, data)
        temp_path.replace(pptx_path)
        PY
      timeout: 120
evaluation:
  evaluator_id: evaluators.linux.pptx_compare:PptxCompareEvaluator
  params:
    actual_path: /tmp/helloworld_office/impress_bf4e9888_actual.pptx
    expected_path: /tmp/helloworld_office/impress_bf4e9888_expected.pptx
    options:
      examine_number_of_slides: true
      examine_text: false
      examine_shape: true
      examine_image_size: true
      examine_run_count: false
      examine_alignment: false
    image_count_rules:
    - slide_index: 1
      picture_count: 1
    - slide_index: 2
      picture_count: 1
    - slide_index: 3
      picture_count: 1
    - slide_index: 4
      picture_count: 1
    - slide_index: 5
      picture_count: 1
    - slide_index: 6
      picture_count: 1
    picture_alt_rules:
    - slide_index: 1
      picture_index: 1
      descr: pic1.png
    - slide_index: 2
      picture_index: 1
      descr: pic2.png
    - slide_index: 3
      picture_index: 1
      descr: pic3.png
    - slide_index: 4
      picture_index: 1
      descr: pic4.png
    - slide_index: 5
      picture_index: 1
      descr: pic5.png
    - slide_index: 6
      picture_index: 1
      descr: pic6.png
    text_artifacts:
    - path: /tmp/helloworld_office/impress_asset_manifest.csv
      equals: |
        slide,image,alt_text,status
        1,pic1.png,pic1.png,placed
        2,pic2.png,pic2.png,placed
        3,pic3.png,pic3.png,placed
        4,pic4.png,pic4.png,placed
        5,pic5.png,pic5.png,placed
        6,pic6.png,pic6.png,placed
    - path: /tmp/helloworld_office/impress_operator_handoff.txt
      equals: |
        deck=impress_bf4e9888_actual.pptx
        mode=continuous-playback
        owner=media-desk
        status=ready-for-preview
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - linux
  - gui
  - libreoffice
  - impress
  - pptx
  - images
  - file_handoff
  - hard
  - oracle
  app: LibreOffice Impress
  difficulty: hard
  description: Oracle sanity task for linux.impress.create_six_image_slides.
  oracle_for: linux.impress.create_six_image_slides
