task_id: linux.oracle.cross_vm.calc_budget_review_hard
platform: linux
instruction: >
  Oracle sanity task for linux.cross_vm.calc_budget_review_hard. The initializer
  already prepares the expected workbook. Wait briefly and finish.
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
      - type: run_bash
        script: |
          pkill -f '[s]office.bin' >/dev/null 2>&1 || true
          pkill -f '/usr/lib/libreoffice/program/[s]office' >/dev/null 2>&1 || true
          mkdir -p /home/user/Documents /home/user/Desktop
          python3 - <<'PY'
          import tempfile
          import zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("/home/user/Documents/budget_review.xlsx")
          ns = "http://schemas.openxmlformats.org/spreadsheetml/2006/main"
          ET.register_namespace("", ns)

          def q(tag):
              return f"{{{ns}}}{tag}"

          def col_name(index):
              name = ""
              while index:
                  index, rem = divmod(index - 1, 26)
                  name = chr(ord("A") + rem) + name
              return name

          rows = [
              ["Category", "Planned", "Actual", "Variance", "Status", "Owner", "Action", "Review Note"],
              ["Travel", 1200, 980, "=C2-B2", '=IF(D2>0,"Over","Under")', '=IF(ABS(D2)>=100,"Finance Director","Team Lead")', '=IF(F2="Finance Director","Schedule Friday review","Track in team sync")', '=A2&": "&E2&" by "&ABS(D2)'],
              ["Lodging", 2100, 2240, "=C3-B3", '=IF(D3>0,"Over","Under")', '=IF(ABS(D3)>=100,"Finance Director","Team Lead")', '=IF(F3="Finance Director","Schedule Friday review","Track in team sync")', '=A3&": "&E3&" by "&ABS(D3)'],
              ["Meals", 450, 390, "=C4-B4", '=IF(D4>0,"Over","Under")', '=IF(ABS(D4)>=100,"Finance Director","Team Lead")', '=IF(F4="Finance Director","Schedule Friday review","Track in team sync")', '=A4&": "&E4&" by "&ABS(D4)'],
              ["Supplies", 300, 340, "=C5-B5", '=IF(D5>0,"Over","Under")', '=IF(ABS(D5)>=100,"Finance Director","Team Lead")', '=IF(F5="Finance Director","Schedule Friday review","Track in team sync")', '=A5&": "&E5&" by "&ABS(D5)'],
              ["Contingency", 600, 720, "=C6-B6", '=IF(D6>0,"Over","Under")', '=IF(ABS(D6)>=100,"Finance Director","Team Lead")', '=IF(F6="Finance Director","Schedule Friday review","Track in team sync")', '=A6&": "&E6&" by "&ABS(D6)'],
              ["Permits", 250, 410, "=C7-B7", '=IF(D7>0,"Over","Under")', '=IF(ABS(D7)>=100,"Finance Director","Team Lead")', '=IF(F7="Finance Director","Schedule Friday review","Track in team sync")', '=A7&": "&E7&" by "&ABS(D7)'],
              ["Training", 500, 455, "=C8-B8", '=IF(D8>0,"Over","Under")', '=IF(ABS(D8)>=100,"Finance Director","Team Lead")', '=IF(F8="Finance Director","Schedule Friday review","Track in team sync")', '=A8&": "&E8&" by "&ABS(D8)'],
              ["Equipment", 850, 1025, "=C9-B9", '=IF(D9>0,"Over","Under")', '=IF(ABS(D9)>=100,"Finance Director","Team Lead")', '=IF(F9="Finance Director","Schedule Friday review","Track in team sync")', '=A9&": "&E9&" by "&ABS(D9)'],
              ["Total", "=SUM(B2:B9)", "=SUM(C2:C9)", "=SUM(D2:D9)", None, None, None, None],
          ]

          worksheet = ET.Element(q("worksheet"))
          sheet_data = ET.SubElement(worksheet, q("sheetData"))
          for row_index, row_values in enumerate(rows, start=1):
              row_el = ET.SubElement(sheet_data, q("row"), {"r": str(row_index)})
              for col_index, value in enumerate(row_values, start=1):
                  if value is None:
                      continue
                  cell_ref = f"{col_name(col_index)}{row_index}"
                  cell = ET.SubElement(row_el, q("c"), {"r": cell_ref})
                  if isinstance(value, str) and value.startswith("="):
                      ET.SubElement(cell, q("f")).text = value[1:]
                  elif isinstance(value, str):
                      cell.set("t", "inlineStr")
                      inline = ET.SubElement(cell, q("is"))
                      ET.SubElement(inline, q("t")).text = value
                  else:
                      ET.SubElement(cell, q("v")).text = str(value)
          sheet_xml = ET.tostring(worksheet, encoding="utf-8", xml_declaration=True)

          path.parent.mkdir(parents=True, exist_ok=True)
          if path.exists() and zipfile.is_zipfile(path):
              with tempfile.TemporaryDirectory(prefix="crossvm-calc-oracle-") as tmpdir:
                  patched = Path(tmpdir) / path.name
                  replaced = False
                  with zipfile.ZipFile(path, "r") as src, zipfile.ZipFile(patched, "w", zipfile.ZIP_DEFLATED) as dst:
                      for info in src.infolist():
                          data = sheet_xml if info.filename == "xl/worksheets/sheet1.xml" else src.read(info.filename)
                          replaced = replaced or info.filename == "xl/worksheets/sheet1.xml"
                          dst.writestr(info, data)
                      if not replaced:
                          dst.writestr("xl/worksheets/sheet1.xml", sheet_xml)
                  patched.replace(path)
          else:
              with zipfile.ZipFile(path, "w", zipfile.ZIP_DEFLATED) as dst:
                  dst.writestr("xl/worksheets/sheet1.xml", sheet_xml)
          PY
        timeout: 120
evaluation:
  evaluator_id: evaluators.linux.command_check:CommandCheckEvaluator
  params:
    timeout: 120
    stdout_contains: PASS
    command: |
      python3 - <<'PY'
      import re
      import zipfile
      import xml.etree.ElementTree as ET

      ns = {"a": "http://schemas.openxmlformats.org/spreadsheetml/2006/main"}

      def col_to_idx(ref):
          letters = re.match(r"([A-Z]+)", ref).group(1)
          value = 0
          for ch in letters:
              value = value * 26 + (ord(ch) - ord("A") + 1)
          return value

      def normalize_number(text):
          value = float(text)
          return int(value) if value.is_integer() else value

      with zipfile.ZipFile("/home/user/Documents/budget_review.xlsx") as zf:
          sheet = ET.fromstring(zf.read("xl/worksheets/sheet1.xml"))
          shared_strings = []
          if "xl/sharedStrings.xml" in zf.namelist():
              sst = ET.fromstring(zf.read("xl/sharedStrings.xml"))
              for si in sst.findall("a:si", ns):
                  text = "".join(t.text or "" for t in si.findall(".//a:t", ns))
                  shared_strings.append(text)

      observed_rows = {}
      for row in sheet.findall(".//a:sheetData/a:row", ns):
          row_idx = int(row.attrib["r"])
          cells = [None] * 8
          for cell in row.findall("a:c", ns):
              col_idx = col_to_idx(cell.attrib["r"]) - 1
              if not 0 <= col_idx < 8:
                  continue
              formula = cell.find("a:f", ns)
              if formula is not None:
                  cells[col_idx] = f"={formula.text or ''}"
                  continue
              cell_type = cell.attrib.get("t")
              if cell_type == "inlineStr":
                  text_node = cell.find("a:is", ns)
                  cells[col_idx] = "".join(t.text or "" for t in text_node.findall(".//a:t", ns))
                  continue
              value_node = cell.find("a:v", ns)
              if value_node is None:
                  continue
              if cell_type == "s":
                  cells[col_idx] = shared_strings[int(value_node.text)]
              else:
                  cells[col_idx] = normalize_number(value_node.text)
          observed_rows[row_idx] = cells

      expected_rows = [
          ["Category", "Planned", "Actual", "Variance", "Status", "Owner", "Action", "Review Note"],
          ["Travel", 1200, 980, "=C2-B2", '=IF(D2>0,"Over","Under")', '=IF(ABS(D2)>=100,"Finance Director","Team Lead")', '=IF(F2="Finance Director","Schedule Friday review","Track in team sync")', '=A2&": "&E2&" by "&ABS(D2)'],
          ["Lodging", 2100, 2240, "=C3-B3", '=IF(D3>0,"Over","Under")', '=IF(ABS(D3)>=100,"Finance Director","Team Lead")', '=IF(F3="Finance Director","Schedule Friday review","Track in team sync")', '=A3&": "&E3&" by "&ABS(D3)'],
          ["Meals", 450, 390, "=C4-B4", '=IF(D4>0,"Over","Under")', '=IF(ABS(D4)>=100,"Finance Director","Team Lead")', '=IF(F4="Finance Director","Schedule Friday review","Track in team sync")', '=A4&": "&E4&" by "&ABS(D4)'],
          ["Supplies", 300, 340, "=C5-B5", '=IF(D5>0,"Over","Under")', '=IF(ABS(D5)>=100,"Finance Director","Team Lead")', '=IF(F5="Finance Director","Schedule Friday review","Track in team sync")', '=A5&": "&E5&" by "&ABS(D5)'],
          ["Contingency", 600, 720, "=C6-B6", '=IF(D6>0,"Over","Under")', '=IF(ABS(D6)>=100,"Finance Director","Team Lead")', '=IF(F6="Finance Director","Schedule Friday review","Track in team sync")', '=A6&": "&E6&" by "&ABS(D6)'],
          ["Permits", 250, 410, "=C7-B7", '=IF(D7>0,"Over","Under")', '=IF(ABS(D7)>=100,"Finance Director","Team Lead")', '=IF(F7="Finance Director","Schedule Friday review","Track in team sync")', '=A7&": "&E7&" by "&ABS(D7)'],
          ["Training", 500, 455, "=C8-B8", '=IF(D8>0,"Over","Under")', '=IF(ABS(D8)>=100,"Finance Director","Team Lead")', '=IF(F8="Finance Director","Schedule Friday review","Track in team sync")', '=A8&": "&E8&" by "&ABS(D8)'],
          ["Equipment", 850, 1025, "=C9-B9", '=IF(D9>0,"Over","Under")', '=IF(ABS(D9)>=100,"Finance Director","Team Lead")', '=IF(F9="Finance Director","Schedule Friday review","Track in team sync")', '=A9&": "&E9&" by "&ABS(D9)'],
          ["Total", "=SUM(B2:B9)", "=SUM(C2:C9)", "=SUM(D2:D9)", None, None, None, None],
      ]
      for row_idx, expected in enumerate(expected_rows, start=1):
          observed = observed_rows.get(row_idx, [None] * 8)
          if observed != expected:
              raise SystemExit(f"ROW_MISMATCH:{row_idx}:{observed}")
      print("PASS")
      PY
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [linux, cross_vm, oracle, hard]
  difficulty: hard
  oracle_for: linux.cross_vm.calc_budget_review_hard
