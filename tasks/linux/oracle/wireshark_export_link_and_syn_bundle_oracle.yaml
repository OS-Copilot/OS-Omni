task_id: linux.wireshark.oracle.export_link_and_syn_bundle
platform: linux
instruction: >
  In Wireshark, use the seeded retail capture to assemble the network ticket
  evidence for checkout reachability. Export ARP discovery packets to
  /tmp/helloworld_wireshark/link_discovery_arp.pcapng. Export ICMP echo health
  packets to /tmp/helloworld_wireshark/echo_check_icmp.pcapng. Export initial
  TCP SYN packets where SYN is set and ACK is not set to
  /tmp/helloworld_wireshark/first_syn_attempts.pcapng. Export the TCP port 80
  checkout conversation to /tmp/helloworld_wireshark/storefront_tcp80_checkout.pcapng.
  Save every export as pcapng. Then create
  /tmp/helloworld_wireshark/link_syn_ticket_update.txt with exactly these six
  lines: ticket=NET-142 checkout reachability, link=arp discovery exported,
  echo=icmp pair exported, syn=initial tcp attempts exported,
  web=tcp80 conversation exported, next_action=attach to incident.
init:
  initializer_id: initializers.linux.wireshark:WiresharkInitializer
  params:
    app_command: wireshark
    workspace_root: /tmp/helloworld_wireshark
    capture_name: retail_mix.pcapng
    capture_template: retail_mix
evaluation:
  evaluator_id: evaluators.linux.wireshark:WiresharkArtifactEvaluator
  params:
    artifacts:
      - kind: pcap
        path: /tmp/helloworld_wireshark/link_discovery_arp.pcapng
        packet_count: 2
        all_match_filter: arp
      - kind: pcap
        path: /tmp/helloworld_wireshark/echo_check_icmp.pcapng
        packet_count: 2
        all_match_filter: icmp
      - kind: pcap
        path: /tmp/helloworld_wireshark/first_syn_attempts.pcapng
        packet_count: 2
        all_match_filter: tcp.flags.syn == 1 && tcp.flags.ack == 0
      - kind: pcap
        path: /tmp/helloworld_wireshark/storefront_tcp80_checkout.pcapng
        packet_count: 7
        all_match_filter: tcp.port == 80
        field_values:
          - field: ip.src
            contains:
              - 10.10.0.2
              - 10.10.0.10
      - kind: text
        path: /tmp/helloworld_wireshark/link_syn_ticket_update.txt
        equals: |
          ticket=NET-142 checkout reachability
          link=arp discovery exported
          echo=icmp pair exported
          syn=initial tcp attempts exported
          web=tcp80 conversation exported
          next_action=attach to incident
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
    - linux
    - gui
    - wireshark
    - network
    - filter
    - export
    - oracle
  app: Wireshark
  difficulty: hard
  description: Oracle sanity task for linux.wireshark.export_link_and_syn_bundle with ticket-focused exports.
  oracle_for: linux.wireshark.export_link_and_syn_bundle
