task_id: linux.thunderbird.oracle.thunderbird_unified_inbox
platform: linux
instruction: Oracle sanity task for linux.thunderbird.thunderbird_unified_inbox. The
  initializer already patches the Thunderbird profile to the expected state. Wait
  briefly and finish.
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
    - type: download
      url: https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/thunderbird/dd84e895-72fd-4023-a336-97689ded257c/thunderbird-profile.tar.gz
      path: /home/user/thunderbird-profile.tar.gz
    - type: run_command
      command: tar -xzv --recursive-unlink -f /home/user/thunderbird-profile.tar.gz
        -C /home/user/
    - type: launch_app
      command: /usr/bin/thunderbird
    - type: run_bash
      script: "python3 - <<'PY'\nimport json\nfrom pathlib import Path\np = Path('/home/user/.thunderbird/t5q2a5hp.default-release/xulstore.json')\n\
        data = {}\nif p.exists():\n    try:\n        data = json.loads(p.read_text(encoding='utf-8'))\n\
        \    except Exception:\n        data = {}\nentry = data.setdefault('chrome://messenger/content/messenger.xhtml',\
        \ {})\nfolder_tree = entry.setdefault('folderTree', {})\nfolder_tree['mode']\
        \ = 'smart'\np.write_text(json.dumps(data, ensure_ascii=False, indent=2) +\
        \ '\\n', encoding='utf-8')\nPY"
    wait_ms: 1200
evaluation:
  evaluator_id: evaluators.linux.thunderbird:ThunderbirdUnifiedInboxEvaluator
  params:
    profile_dir: /home/user/.thunderbird/t5q2a5hp.default-release
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  app: Thunderbird
  difficulty: null
  tags:
  - email
  - thunderbird
  - medium
  - osworld
  - oracle
  description: Oracle sanity task for linux.thunderbird.thunderbird_unified_inbox
  oracle_for: linux.thunderbird.thunderbird_unified_inbox
