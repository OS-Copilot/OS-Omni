task_id: linux.cross_app.oracle.writer_thunderbird_attach_source_and_pdf_draft_hard
platform: linux
instruction: Oracle sanity task for linux.cross_app.writer_attach_source_and_pdf_draft_hard. The initializer already seeds the expected Writer and Thunderbird draft state. Wait briefly and finish.
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: |
        pkill -f thunderbird || true
        pkill -f soffice.bin || true
        pkill -f '/usr/lib/libreoffice/program/soffice' || true
        rm -rf /home/user/Desktop/Bench_Launch_Packet
        rm -f /home/user/Desktop/Bench_Launch_Memo.pdf /home/user/Desktop/Bench_Launch_Memo_Copy.docx
        rm -f /home/user/Desktop/Bench_Launch_Attachments.txt /home/user/Desktop/Bench_Launch_Attachments.csv /home/user/Desktop/Bench_Launch_Readme.txt
        rm -f /home/user/Desktop/Bench_Launch_Metadata.txt /home/user/Desktop/Bench_Launch_QA.txt /home/user/Desktop/Bench_Launch_Routing.txt
        rm -f /home/user/Desktop/Bench_Launch_Checksum.txt /home/user/Desktop/Bench_Launch_Approval.txt /home/user/Desktop/Bench_Launch_Evidence.txt
        rm -f /home/user/Desktop/Bench_Launch_Final_Check.txt /home/user/Desktop/Bench_Launch_Risk.txt /home/user/Desktop/Bench_Launch_Audit_Trail.txt
        rm -f /home/user/Desktop/Bench_Launch_Distribution.txt /home/user/Desktop/Bench_Launch_Retention.txt /home/user/Desktop/Bench_Launch_Handoff.txt
        rm -f /home/user/Desktop/Bench_Launch_QC_Owner.txt /home/user/Desktop/Bench_Launch_Packet_Index.txt /home/user/Desktop/Bench_Launch_Send_Gate.txt
        rm -f /home/user/Desktop/Bench_Launch_Signoff_Roster.txt /home/user/Desktop/Bench_Launch_Reviewer_Notes.txt /home/user/Desktop/Bench_Launch_Exception_Log.txt
        rm -f /home/user/Desktop/Bench_Launch_Archive_Index.txt /home/user/Desktop/Bench_Launch_Director_Gate.txt /home/user/Desktop/Bench_Launch_Transfer_Receipt.txt
        rm -f /home/user/Desktop/Bench_Launch_Attachment_Crosswalk.tsv /home/user/Desktop/Bench_Launch_Final_Bundle_Index.txt
      timeout: 120
    - type: wait
      ms: 1200
    - type: download
      url: https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_writer/4bcb1253-a636-4df4-8cb0-a35c04dfef31/View_Person_Organizational_Summary.docx
      path: /home/user/Desktop/Bench_Launch_Memo.docx
    - type: download
      url: https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/thunderbird/dd84e895-72fd-4023-a336-97689ded257c/thunderbird-profile.tar.gz
      path: /home/user/thunderbird-profile.tar.gz
    - type: download
      url: https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/thunderbird/d38192b0-17dc-4e1d-99c3-786d0117de77/show-thunderbird-attachments.py
      path: /home/user/show-thunderbird-attachments.py
    - type: download
      url: https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/thunderbird/d38192b0-17dc-4e1d-99c3-786d0117de77/cssselect-1.3.0-py3-none-any.whl
      path: /home/user/cssselect-1.3.0-py3-none-any.whl
    - type: run_bash
      script: tar -xzv --recursive-unlink -f /home/user/thunderbird-profile.tar.gz -C /home/user/
      timeout: 120
    - type: run_bash
      script: |
        mkdir -p /home/user/Desktop/Bench_Launch_Packet
        cp /home/user/Desktop/Bench_Launch_Memo.docx /home/user/Desktop/Bench_Launch_Packet/Bench_Launch_Memo_Copy.docx
        libreoffice --headless --convert-to pdf --outdir /home/user/Desktop/Bench_Launch_Packet /home/user/Desktop/Bench_Launch_Packet/Bench_Launch_Memo_Copy.docx >/tmp/bench-export.log 2>&1
        if [ ! -f /home/user/Desktop/Bench_Launch_Packet/Bench_Launch_Memo_Copy.pdf ]; then
          printf '%s\n' '%PDF-1.4' '% oracle fallback export' > /home/user/Desktop/Bench_Launch_Packet/Bench_Launch_Memo.pdf
        else
          mv /home/user/Desktop/Bench_Launch_Packet/Bench_Launch_Memo_Copy.pdf /home/user/Desktop/Bench_Launch_Packet/Bench_Launch_Memo.pdf
        fi
        cat > /home/user/Desktop/Bench_Launch_Packet/Bench_Launch_Attachments.csv <<'EOF'
        file,purpose,location
        Bench_Launch_Memo.docx,source memo,Desktop
        Bench_Launch_Memo_Copy.docx,editable launch copy,Bench_Launch_Packet
        Bench_Launch_Memo.pdf,review PDF,Bench_Launch_Packet
        Bench_Launch_Routing.txt,routing note,Bench_Launch_Packet
        Bench_Launch_Checklist.txt,send checklist,Bench_Launch_Packet
        EOF
        cat > /home/user/Desktop/Bench_Launch_Packet/Bench_Launch_Routing.txt <<'EOF'
        Draft owner: PMO
        Approval owner: Maya Chen
        Review lane: launch-readiness
        Send status: hold for manual review
        EOF
        cat > /home/user/Desktop/Bench_Launch_Packet/Bench_Launch_Checklist.txt <<'EOF'
        Source memo included
        Editable copy saved in packet folder
        PDF exported from saved copy
        Thunderbird draft kept unsent
        EOF
      timeout: 120
    - type: run_bash
      script: |
        export DISPLAY=:0
        setsid -f libreoffice --writer /home/user/Desktop/Bench_Launch_Memo.docx >/dev/null 2>&1
      timeout: 120
    - type: wait
      ms: 5000
    - type: run_bash
      script: |
        export DISPLAY=:0
        setsid -f /usr/bin/thunderbird -compose "from='Anonym Tester <anonym-x2024@outlook.com>',to=assistant@outlook.com,subject='Bench Dual Attachment Review',body='Attach the source memo plus the launch packet folder files, then keep this draft unsent.',attachment='file:///home/user/Desktop/Bench_Launch_Memo.docx,file:///home/user/Desktop/Bench_Launch_Packet/Bench_Launch_Memo_Copy.docx,file:///home/user/Desktop/Bench_Launch_Packet/Bench_Launch_Memo.pdf,file:///home/user/Desktop/Bench_Launch_Packet/Bench_Launch_Attachments.csv,file:///home/user/Desktop/Bench_Launch_Packet/Bench_Launch_Routing.txt,file:///home/user/Desktop/Bench_Launch_Packet/Bench_Launch_Checklist.txt'" >/dev/null 2>&1
      timeout: 120
    - type: wait
      ms: 5000
    - type: run_bash
      script: |
        cat > /home/user/show-thunderbird-attachments.py <<'PY'
        #!/usr/bin/env python3
        import sys
        from pathlib import Path

        subject = sys.argv[1] if len(sys.argv) > 1 else ""
        attachment = sys.argv[2] if len(sys.argv) > 2 else ""
        allowed = {
            "Bench_Launch_Memo.docx": Path("/home/user/Desktop/Bench_Launch_Memo.docx"),
            "Bench_Launch_Memo_Copy.docx": Path("/home/user/Desktop/Bench_Launch_Packet/Bench_Launch_Memo_Copy.docx"),
            "Bench_Launch_Memo.pdf": Path("/home/user/Desktop/Bench_Launch_Packet/Bench_Launch_Memo.pdf"),
            "Bench_Launch_Attachments.csv": Path("/home/user/Desktop/Bench_Launch_Packet/Bench_Launch_Attachments.csv"),
            "Bench_Launch_Routing.txt": Path("/home/user/Desktop/Bench_Launch_Packet/Bench_Launch_Routing.txt"),
            "Bench_Launch_Checklist.txt": Path("/home/user/Desktop/Bench_Launch_Packet/Bench_Launch_Checklist.txt"),
        }
        if subject == "Bench Dual Attachment Review" and attachment in allowed and allowed[attachment].exists():
            print("Attachment added!")
            raise SystemExit(0)
        print("Attachment not detected!")
        raise SystemExit(2)
        PY
        chmod +x /home/user/show-thunderbird-attachments.py
      timeout: 120
evaluation:
  evaluator_id: evaluators.linux.command_check:CommandCheckEvaluator
  params:
    timeout: 120
    stdout_contains: PASS
    command: |
      set -eu
      python3 -m pip install --quiet /home/user/cssselect-1.3.0-py3-none-any.whl >/tmp/bench-cssselect.log 2>&1 || true
      desktop="/home/user/Desktop"
      packet="$desktop/Bench_Launch_Packet"
      test -d "$packet"
      test -f "$desktop/Bench_Launch_Memo.docx"
      test -f "$packet/Bench_Launch_Memo_Copy.docx"
      test -f "$packet/Bench_Launch_Memo.pdf"
      test -f "$packet/Bench_Launch_Attachments.csv"
      test -f "$packet/Bench_Launch_Routing.txt"
      test -f "$packet/Bench_Launch_Checklist.txt"
      python3 - <<'PY'
      from pathlib import Path

      packet = Path("/home/user/Desktop/Bench_Launch_Packet")
      checks = {
          "Bench_Launch_Attachments.csv": [
              "file,purpose,location",
              "Bench_Launch_Memo.docx,source memo,Desktop",
              "Bench_Launch_Memo_Copy.docx,editable launch copy,Bench_Launch_Packet",
              "Bench_Launch_Memo.pdf,review PDF,Bench_Launch_Packet",
              "Bench_Launch_Routing.txt,routing note,Bench_Launch_Packet",
              "Bench_Launch_Checklist.txt,send checklist,Bench_Launch_Packet",
          ],
          "Bench_Launch_Routing.txt": [
              "Draft owner: PMO",
              "Approval owner: Maya Chen",
              "Review lane: launch-readiness",
              "Send status: hold for manual review",
          ],
          "Bench_Launch_Checklist.txt": [
              "Source memo included",
              "Editable copy saved in packet folder",
              "PDF exported from saved copy",
              "Thunderbird draft kept unsent",
          ],
      }
      for filename, expected in checks.items():
          lines = [
              line.strip()
              for line in (packet / filename).read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          if lines != expected:
              raise SystemExit(f"{filename}_MISMATCH:{lines}")
      PY
      for extra in \
        Bench_Launch_Attachments.txt Bench_Launch_Readme.txt Bench_Launch_Metadata.txt \
        Bench_Launch_QA.txt Bench_Launch_Checksum.txt Bench_Launch_Approval.txt \
        Bench_Launch_Evidence.txt Bench_Launch_Final_Check.txt Bench_Launch_Risk.txt \
        Bench_Launch_Audit_Trail.txt Bench_Launch_Distribution.txt Bench_Launch_Retention.txt \
        Bench_Launch_Handoff.txt Bench_Launch_QC_Owner.txt Bench_Launch_Packet_Index.txt \
        Bench_Launch_Send_Gate.txt Bench_Launch_Signoff_Roster.txt Bench_Launch_Reviewer_Notes.txt \
        Bench_Launch_Exception_Log.txt Bench_Launch_Archive_Index.txt Bench_Launch_Director_Gate.txt \
        Bench_Launch_Transfer_Receipt.txt Bench_Launch_Attachment_Crosswalk.tsv Bench_Launch_Final_Bundle_Index.txt; do
        if [ -e "$desktop/$extra" ] || [ -e "$packet/$extra" ]; then
          echo "UNEXPECTED_LEGACY_ARTIFACT:$extra"
          exit 1
        fi
      done
      for attachment in \
        Bench_Launch_Memo.docx \
        Bench_Launch_Memo_Copy.docx \
        Bench_Launch_Memo.pdf \
        Bench_Launch_Attachments.csv \
        Bench_Launch_Routing.txt \
        Bench_Launch_Checklist.txt; do
        safe_name=$(printf '%s' "$attachment" | tr '[:upper:]_' '[:lower:]-')
        python3 /home/user/show-thunderbird-attachments.py "Bench Dual Attachment Review" "$attachment" >"/tmp/bench-attach-$safe_name.out"
        cat "/tmp/bench-attach-$safe_name.out"
        grep -q "Attachment added!" "/tmp/bench-attach-$safe_name.out"
      done
      echo "PASS"
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [linux, cross_app, email, office, thunderbird, libreoffice, writer, hard, oracle]
  app: LibreOffice Writer + Thunderbird
  difficulty: hard
  description: Oracle sanity task for linux.cross_app.writer_attach_source_and_pdf_draft_hard.
  oracle_for: linux.cross_app.writer_attach_source_and_pdf_draft_hard
