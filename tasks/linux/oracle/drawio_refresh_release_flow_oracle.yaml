task_id: linux.drawio.oracle.refresh_release_flow
platform: linux
instruction: Oracle sanity task for linux.drawio.refresh_release_flow. The initializer
  already seeds the expected draw.io XML. Wait briefly and finish.
init:
  initializer_id: initializers.linux.drawio:DrawIOInitializer
  params:
    app_command: drawio
    workspace_name: drawio_release_flow
    diagram_name: release_flow_board.drawio
    diagram_template: release_flow_board
    cell_overrides:
    - id: queue_box
      equals: Customer Intake
    - id: draft_box
      equals: Scope Proposal
    - id: review_box
      equals: Risk Review
    - id: approval_box
      equals: Team Approved
    - id: ship_box
      equals: Launch Window
    - id: follow_box
      equals: Retro Actions
evaluation:
  evaluator_id: evaluators.linux.drawio:DrawIOFileEvaluator
  params:
    diagram_path: /tmp/helloworld_drawio_workspace/drawio_release_flow/release_flow_board.drawio
    cells:
    - id: queue_box
      equals: Customer Intake
    - id: draft_box
      equals: Scope Proposal
    - id: review_box
      equals: Risk Review
    - id: approval_box
      equals: Team Approved
    - id: ship_box
      equals: Launch Window
    - id: follow_box
      equals: Retro Actions
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  app: draw.io
  difficulty: hard
  tags:
  - linux
  - gui
  - drawio
  - diagram
  - hard
  - oracle
  description: Oracle sanity task for linux.drawio.refresh_release_flow
  oracle_for: linux.drawio.refresh_release_flow
