task_id: linux.oracle.actual_budget_create_checking_account_easy
platform: linux
instruction: Oracle sanity task for linux.actual_budget.create_checking_account_easy. The initializer already restores the blank Actual app state. Wait briefly and finish.
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
      - type: run_bash
        script: |
          python3 - <<'PY'
          import os
          import signal
          import time

          targets = {"Actual", "actualbudget", "AppRun", "chrome_crashpad_handler"}
          for _ in range(2):
              killed = False
              for pid_text in os.listdir("/proc"):
                  if not pid_text.isdigit():
                      continue
                  try:
                      comm = open(f"/proc/{pid_text}/comm", "r", encoding="utf-8").read().strip()
                  except OSError:
                      continue
                  if comm in targets:
                      try:
                          os.kill(int(pid_text), signal.SIGTERM)
                          killed = True
                      except OSError:
                          pass
              if not killed:
                  break
              time.sleep(1)
          PY
          rm -rf /home/user/.config/Actual /home/user/Documents/Actual /home/user/.cache/Actual
          mkdir -p /home/user/Documents
        timeout: 120
      - type: run_bash
        script: |
          export DISPLAY=:0
          export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority}
          export XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-/run/user/$(id -u)}
          export DBUS_SESSION_BUS_ADDRESS=${DBUS_SESSION_BUS_ADDRESS:-unix:path=${XDG_RUNTIME_DIR}/bus}
          if [ ! -x /home/user/.local/bin/actualbudget ]; then
            echo "Actual Budget is not installed in the Linux VM." >&2
            exit 1
          fi
          setsid -f /home/user/.local/bin/actualbudget >/tmp/actualbudget.log 2>&1
        timeout: 120
      - type: wait
        ms: 10000
      - type: run_bash
        script: |
          python3 - <<'PY'
          import json
          import os
          import signal
          import sqlite3
          import time
          from pathlib import Path

          targets = {"Actual", "actualbudget", "AppRun", "chrome_crashpad_handler"}
          for _ in range(3):
              killed = False
              for pid_text in os.listdir("/proc"):
                  if not pid_text.isdigit():
                      continue
                  try:
                      comm = open(f"/proc/{pid_text}/comm", "r", encoding="utf-8").read().strip()
                  except OSError:
                      continue
                  if comm in targets:
                      try:
                          os.kill(int(pid_text), signal.SIGTERM)
                          killed = True
                      except OSError:
                          pass
              if not killed:
                  break
              time.sleep(1)

          state_root = Path("/home/user/.config/Actual")
          document_root = Path("/home/user/Documents/Actual")
          budget_id = "bench-starter-budget"
          budget_dir = document_root / budget_id
          budget_dir.mkdir(parents=True, exist_ok=True)
          state_root.mkdir(parents=True, exist_ok=True)
          (state_root / "global-store.json").write_text(
              json.dumps({"lastBudget": budget_id, "document-dir": str(document_root)}, ensure_ascii=False),
              encoding="utf-8",
          )

          db_path = budget_dir / "db.sqlite"
          conn = sqlite3.connect(db_path)
          cur = conn.cursor()
          cur.executescript(
              '''
              DROP TABLE IF EXISTS accounts;
              DROP TABLE IF EXISTS categories;
              DROP TABLE IF EXISTS payees;
              DROP TABLE IF EXISTS transactions;
              DROP TABLE IF EXISTS zero_budgets;
              CREATE TABLE accounts (
                  id TEXT PRIMARY KEY,
                  account_id TEXT,
                  name TEXT,
                  balance_current INTEGER,
                  balance_available INTEGER,
                  balance_limit INTEGER,
                  mask TEXT,
                  official_name TEXT,
                  subtype TEXT,
                  bank TEXT,
                  offbudget INTEGER,
                  closed INTEGER,
                  tombstone INTEGER,
                  sort_order REAL,
                  type TEXT,
                  account_sync_source TEXT,
                  last_sync INTEGER,
                  last_reconciled INTEGER
              );
              CREATE TABLE categories (
                  id TEXT PRIMARY KEY,
                  name TEXT,
                  tombstone INTEGER
              );
              CREATE TABLE payees (
                  id TEXT PRIMARY KEY,
                  name TEXT,
                  tombstone INTEGER
              );
              CREATE TABLE transactions (
                  id TEXT PRIMARY KEY,
                  acct TEXT,
                  category TEXT,
                  description TEXT,
                  starting_balance_flag INTEGER,
                  tombstone INTEGER,
                  amount INTEGER,
                  transfer_id TEXT
              );
              CREATE TABLE zero_budgets (
                  id TEXT PRIMARY KEY,
                  category TEXT,
                  amount INTEGER
              );
              '''
          )
          cur.execute(
              """
              INSERT INTO accounts (
                  id, account_id, name, balance_current, balance_available, balance_limit,
                  mask, official_name, subtype, bank, offbudget, closed, tombstone,
                  sort_order, type, account_sync_source, last_sync, last_reconciled
              ) VALUES (?, NULL, ?, NULL, NULL, NULL, NULL, NULL, NULL, NULL, 0, 0, 0, 1.0, NULL, NULL, NULL, NULL)
              """,
              ("acct-bench-checking", "Bench Checking"),
          )
          cur.execute(
              "INSERT INTO transactions (id, acct, category, description, starting_balance_flag, tombstone, amount, transfer_id) VALUES (?, ?, NULL, NULL, 1, 0, ?, NULL)",
              ("tx-opening-bench-checking", "acct-bench-checking", 500000),
          )
          conn.commit()
          conn.close()
          print("ACTUAL_ORACLE_READY")
          PY
        timeout: 120
evaluation:
  evaluator_id: evaluators.linux.actual_budget:ActualBudgetEvaluator
  params:
    mode: create_account
    account_name: Bench Checking
    opening_balance: 5000
    state_root: /home/user/.config/Actual
    document_root: /home/user/Documents/Actual
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [linux, actual_budget, finance, accounting, easy, oracle]
  app_name: actual-budget
  difficulty: easy
  description: Oracle sanity task for linux.actual_budget.create_checking_account_easy.
  oracle_for: linux.actual_budget.create_checking_account_easy
