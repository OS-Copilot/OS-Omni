task_id: linux.impress.oracle.add_dissolve_transition
platform: linux
instruction: Oracle sanity task for linux.impress.add_dissolve_transition. The initializer already seeds the expected transitions in the presentation. Wait briefly and finish.
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: |
        pkill -f soffice.bin || true
        pkill -f '/usr/lib/libreoffice/program/soffice' || true
      timeout: 120
    - type: wait
      ms: 1200
    - type: download
      url: https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_impress/21760ecb-8f62-40d2-8d85-0cee5725cb72/Ch4%20Video%20Effect.pptx
      path: /tmp/helloworld_office/impress_21760ecb_actual.pptx
    - type: run_bash
      script: |
        python3 - <<'PY'
        import tempfile
        import xml.etree.ElementTree as ET
        import zipfile
        from pathlib import Path

        pptx_path = Path("/tmp/helloworld_office/impress_21760ecb_actual.pptx")
        ns_p = "http://schemas.openxmlformats.org/presentationml/2006/main"
        ET.register_namespace("p", ns_p)
        ET.register_namespace("a", "http://schemas.openxmlformats.org/drawingml/2006/main")
        ET.register_namespace("r", "http://schemas.openxmlformats.org/officeDocument/2006/relationships")

        with tempfile.TemporaryDirectory() as tmpdir:
            tmp_path = Path(tmpdir) / "patched.pptx"
            with zipfile.ZipFile(pptx_path, "r") as src, zipfile.ZipFile(tmp_path, "w") as dst:
                for info in src.infolist():
                    data = src.read(info.filename)
                    if info.filename in {
                        "ppt/slides/slide1.xml",
                        "ppt/slides/slide2.xml",
                        "ppt/slides/slide3.xml",
                        "ppt/slides/slide4.xml",
                    }:
                        root = ET.fromstring(data)
                        transition = root.find(f'{{{ns_p}}}transition')
                        if transition is None:
                            transition = ET.Element(f'{{{ns_p}}}transition')
                            root.append(transition)
                        for child in list(transition):
                            transition.remove(child)
                        transition.append(ET.Element(f'{{{ns_p}}}dissolve'))
                        data = ET.tostring(root, encoding="utf-8", xml_declaration=True)
                    dst.writestr(info, data)
            tmp_path.replace(pptx_path)
        PY
      timeout: 120
    - type: run_bash
      script: |
        export DISPLAY=:0
        setsid -f libreoffice --impress /tmp/helloworld_office/impress_21760ecb_actual.pptx >/dev/null 2>&1
      timeout: 120
    - type: wait
      ms: 5000
evaluation:
  evaluator_id: evaluators.linux.pptx_transition_compare:PptxTransitionEvaluator
  params:
    actual_path: /tmp/helloworld_office/impress_21760ecb_actual.pptx
    expected_path: ""
    options:
      rules:
      - slide_idx: 0
        transition_type: dissolve
      - slide_idx: 1
        transition_type: dissolve
      - slide_idx: 2
        transition_type: dissolve
      - slide_idx: 3
        transition_type: dissolve
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - linux
  - gui
  - libreoffice
  - impress
  - pptx
  - transition
  - hard
  - oracle
  app: LibreOffice Impress
  difficulty: hard
  description: Oracle sanity task for linux.impress.add_dissolve_transition.
  oracle_for: linux.impress.add_dissolve_transition
