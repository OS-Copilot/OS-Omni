task_id: linux.deltachat.oracle.support_escalation
platform: linux
instruction: "In Delta Chat, use the seeded chats to send every required escalation update. Replace each placeholder with the correct values from the conversations. 1. In Support Desk, send: Ticket {ticket_id}: restart hit error {error_code}, recovered after the second launch, escalation owner is {owner}, window {deploy_window}. 2. In Malik, send: Please own ticket {ticket_id} during the {deploy_window} window. 3. In Ops Sprint, send: Escalation update: {ticket_id}, {error_code}, recovered after second launch, owner {owner}, window {deploy_window}."
init:
  initializer_id: initializers.linux.deltachat:DeltaChatOracleInitializer
  params:
    app_command: deltachat-desktop
    expectations:
      - chat_name: Support Desk
        expected_text: "Ticket SR-88: restart hit error WX-17, recovered after the second launch, escalation owner is Malik, window 19:30-20:00."
      - chat_name: Malik
        expected_text: "Please own ticket SR-88 during the 19:30-20:00 window."
      - chat_name: Ops Sprint
        expected_text: "Escalation update: SR-88, WX-17, recovered after second launch, owner Malik, window 19:30-20:00."
evaluation:
  evaluator_id: evaluators.linux.deltachat:DeltaChatMessageEvaluator
  params:
    expectations:
      - chat_name: Support Desk
        expected_text: "Ticket SR-88: restart hit error WX-17, recovered after the second launch, escalation owner is Malik, window 19:30-20:00."
      - chat_name: Malik
        expected_text: "Please own ticket SR-88 during the 19:30-20:00 window."
      - chat_name: Ops Sprint
        expected_text: "Escalation update: SR-88, WX-17, recovered after second launch, owner Malik, window 19:30-20:00."
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [linux, gui, chat, deltachat, escalation, oracle]
  app: Delta Chat
  description: Oracle sanity task for the support escalation workflow.
  oracle_for: linux.deltachat.reply_bob
