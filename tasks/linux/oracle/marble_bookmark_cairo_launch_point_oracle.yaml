    map_theme: earth/openstreetmap/openstreetmap.dgml
    required_bookmarks:
    - name: Cairo Launch Point
      folder: Default
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  app: Marble
  difficulty: easy
  tags:
  - linux
  - gui
  - marble
  - maps
  - bookmark
  - easy
  - oracle
  description: Oracle sanity task for linux.marble.bookmark_cairo_launch_point
  oracle_for: linux.marble.bookmark_cairo_launch_point
