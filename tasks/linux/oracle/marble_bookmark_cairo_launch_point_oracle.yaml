task_id: linux.marble.oracle.bookmark_cairo_launch_point
platform: linux
instruction: Oracle sanity task for linux.marble.bookmark_cairo_launch_point. The
  initializer already seeds the expected Marble config and bookmarks. Wait briefly
  and finish.
init:
  initializer_id: initializers.linux.marble:MarbleInitializer
  params:
    app_command: marble
    preseed_map_theme: earth/openstreetmap/openstreetmap.dgml
    preseed_folders: []
    preseed_bookmarks:
    - name: Cairo Launch Point
      folder: Default
evaluation:
  evaluator_id: evaluators.linux.marble:MarbleBookmarkEvaluator
