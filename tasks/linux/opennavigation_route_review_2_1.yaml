task_id: linux.opennavigation.route_review_2_1
platform: linux
instruction: Execute a comprehensive multi-route navigation review within the OpenNavigation application
  consisting of seven distinct navigation sessions, each involving a specific destination, travel mode,
  and a complete Start, Overview, and End cycle. The first session must begin by selecting Meta Headquarters
  from the Recent list, initiating a Drive route from Current location with the current departure time,
  selecting the top route card, starting the navigation, accessing the voice icon located to the right
  of the Report button, viewing the Overview, and ending the navigation. The second session must select
  Googleplex from the Recent list, initiate a Walk route from Current location, open the Other time option
  to select Leave now, choose the first route card, start the navigation, view the Overview, and end the
  navigation. The third session must select Mountain View Transit Center from the Recent list, initiate
  a Bike route from Current location with the current departure time, select the top route card, start
  the navigation, view the Overview, and end the navigation. The fourth session must select Stanford University
  from the Saved list, initiate a Transit route from Current location with the current departure time,
  select the first route card, start the navigation, view the Overview, and end the navigation. The fifth
  session must select Meta Headquarters from the Recent list, initiate a Drive route, open the Other time
  option to select Leave now, select the first route card, start the navigation, view the Overview, and
  end the navigation. The sixth session must select Stanford University from the Saved list, initiate
  a Walk route, select the first route card, start the navigation, access the voice icon near the Report
  button, and end the navigation. A final seventh session must select Googleplex from the Recent list,
  initiate a Bike route, start the navigation, view the Overview, and end the navigation. Throughout the
  entire process, ensure that the trajectory includes at least sixty distinct interaction steps, explicitly
  utilizes the Route, Current location, Drive, Walk, Bike, and Transit controls, and strictly avoids selecting
  any Coffee Option or Hotels Option entries.
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: |
        patch_opennavigation_web_route_fallback() {
          APP_JS="/home/user/OpenApps/opennavigation/public/app.js"
          if [ ! -f "$APP_JS" ]; then
            return 0
          fi
          if grep -q "function createOfflineRoutePlan" "$APP_JS"; then
            return 0
          fi
          python3 - "$APP_JS" <<'PY'
        from pathlib import Path
        import sys

        path = Path(sys.argv[1])
        text = path.read_text(encoding='utf-8')
        if 'function createOfflineRoutePlan' in text:
            raise SystemExit(0)

        helpers = '''
        function routeAbortSignal(timeoutMs) {
          if (typeof AbortSignal !== "undefined" && typeof AbortSignal.timeout === "function") {
            return AbortSignal.timeout(timeoutMs);
          }
          const controller = new AbortController();
          window.setTimeout(() => controller.abort(new Error("route timeout")), timeoutMs);
          return controller.signal;
        }

        function estimateDistanceMeters(origin, destination) {
          const start = origin?.location || currentLocationPlace.location;
          const end = destination?.location || start;
          const toRadians = (value) => Number(value || 0) * Math.PI / 180;
          const earthRadiusMeters = 6371000;
          const dLat = toRadians(end.lat - start.lat);
          const dLng = toRadians(end.lng - start.lng);
          const lat1 = toRadians(start.lat);
          const lat2 = toRadians(end.lat);
          const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
          return Math.max(800, Math.round(earthRadiusMeters * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a))));
        }

        function normalizeRouteStep(step, index) {
          if (typeof step === "string") {
            return { instruction: step };
          }
          const item = step && typeof step === "object" ? { ...step } : {};
          const rawInstruction = item.instruction ?? item.html_instructions ?? item.name ?? item.summary ?? item.maneuver;
          item.instruction = typeof rawInstruction === "string"
            ? rawInstruction
            : rawInstruction?.text || rawInstruction?.value || rawInstruction?.name || `Continue on step ${index + 1}.`;
          return item;
        }

        function normalizeRoutePlan(response, mode) {
          const routes = Array.isArray(response?.routes) ? response.routes : [];
          return {
            ...(response || {}),
            routes: routes.map((route, index) => ({
              ...route,
              route_id: route.route_id || `${mode}-route-${index + 1}`,
              label: route.label || `${modeLabel(mode)} route`,
              mode: route.mode || mode,
              steps: Array.isArray(route.steps) ? route.steps.map(normalizeRouteStep) : []
            }))
          };
        }

        function createOfflineRoutePlan(mode) {
          const originName = displayPlaceName(state.origin || currentLocationPlace);
          const destinationName = displayPlaceName(state.destination || currentLocationPlace);
          const distanceMeters = estimateDistanceMeters(state.origin, state.destination);
          const speedMetersPerSecond = { drive: 14, walk: 1.35, bike: 4.5, transit: 8 }[mode] || 6;
          const durationSeconds = Math.max(300, Math.round(distanceMeters / speedMetersPerSecond));
          return {
            provider: "opennavigation-offline",
            routes: [{
              route_id: `offline-${mode}-fallback`,
              label: "Offline route",
              summary: `${originName} to ${destinationName}`,
              mode,
              distance_meters: distanceMeters,
              duration_seconds: durationSeconds,
              polyline: "",
              steps: [
                { instruction: `Start from ${originName}.` },
                { instruction: `Continue toward ${destinationName}.` },
                { instruction: `Arrive at ${destinationName}.` }
              ],
              transfers: mode === "transit" ? 0 : undefined,
              fare_label: mode === "transit" ? "Fare unavailable offline" : undefined
            }]
          };
        }

        '''

        if 'function lonToX' not in text:
            raise SystemExit('OpenNavigation app.js patch anchor missing: function lonToX')
        text = text.replace('function lonToX', helpers + 'function lonToX', 1)
        text = text.replace('signal: AbortSignal.timeout(ROUTE_REQUEST_TIMEOUT_MS)', 'signal: routeAbortSignal(ROUTE_REQUEST_TIMEOUT_MS)')
        text = text.replace('state.routePlansByMode[mode] = response;\n    return response;', 'const normalizedResponse = normalizeRoutePlan(response, mode);\n    state.routePlansByMode[mode] = normalizedResponse;\n    return normalizedResponse;')
        text = text.replace('state.routeModeErrors[mode] = routeErrorMessage(error, mode);\n    throw error;', 'const fallback = createOfflineRoutePlan(mode);\n    state.routePlansByMode[mode] = fallback;\n    state.routeModeErrors[mode] = null;\n    setStatus(`Using offline ${modeLabel(mode).toLowerCase()} route.`);\n    return fallback;')
        path.write_text(text, encoding='utf-8')
        PY
        }
        patch_opennavigation_web_route_fallback
        set -eu
        export DISPLAY=${DISPLAY:-:0}
        export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority}
        export XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-/run/user/$(id -u)}
        export DBUS_SESSION_BUS_ADDRESS=${DBUS_SESSION_BUS_ADDRESS:-unix:path=${XDG_RUNTIME_DIR}/bus}
        BASE="/home/user/Desktop/webpage/OpenNavigation"
        LOG="/tmp/opennavigation_webpage_launch.log"
        if [ -x "$BASE" ] && [ ! -d "$BASE" ]; then
          setsid -f "$BASE" >"$LOG" 2>&1
        elif [ -f "$BASE" ]; then
          nohup xdg-open "$BASE" >"$LOG" 2>&1 &
        elif [ -d "$BASE" ]; then
          if [ -x "$BASE/OpenNavigation" ]; then
            setsid -f "$BASE/OpenNavigation" >"$LOG" 2>&1
          elif [ -f "$BASE/index.html" ]; then
            nohup xdg-open "$BASE/index.html" >"$LOG" 2>&1 &
          elif [ -f "$BASE/package.json" ]; then
            if command -v npm >/dev/null 2>&1; then
              (cd "$BASE" && nohup npm run dev -- --host 127.0.0.1 >"$LOG" 2>&1 &)
              sleep 4
              nohup xdg-open http://127.0.0.1:4321 > /tmp/opennavigation_browser.log 2>&1 &
            else
              echo "npm is required to launch webpage OpenNavigation package" >&2
              exit 12
            fi
          else
            echo "No launchable webpage OpenNavigation entry found under $BASE" >&2
            find "$BASE" -maxdepth 2 -type f | sed -n '1,40p' >&2
            exit 11
          fi
        else
          echo "Missing webpage OpenNavigation entry: $BASE" >&2
          exit 10
        fi
      timeout: 120
    - type: wait
      ms: 8000
