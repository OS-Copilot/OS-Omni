task_id: linux.openshop.login
platform: linux
instruction: >
  Open OpenShop and sign in with phone number 13800138000 and password
  spring2026. Use the cart request at
  /tmp/helloworld_openshop/login_cart_request.txt as the shopping note. Search
  for "Mountain Isle Pour-Over Coffee", choose Grocery and Price Low to High,
  open Mountain Isle Pour-Over Coffee 20 Pack, select the 20 sachets option,
  and add quantity 1. Return to the catalog, search "Lumen Magnetic Phone
  Stand", choose Electronics and Price Low to High, open Lumen Magnetic Phone
  Stand, select the Magnetic mount option, and add quantity 1. Open the cart
  and stop only when the signed-in cart contains exactly those two products at
  quantity 1 each. Also create /tmp/helloworld_openshop/starter_cart_note.txt
  with exactly these four lines: account=13800138000,
  cart=Mountain Isle Pour-Over Coffee 20 Pack|Lumen Magnetic Phone Stand,
  quantities=1 each, handoff=starter cart ready.
init:
  initializer_id: initializers.linux.openshop:OpenShopInitializer
  params:
    app_command: openshop
    benchmark_mode: linux.openshop.login
    require_benchmark_api: true
    cleanup_paths:
      - /tmp/helloworld_openshop
    seed_files:
      - path: /tmp/helloworld_openshop/login_cart_request.txt
        content: |
          Starter cart request:
          - Sign in with the benchmark account.
          - Add one coffee pack for the office pantry.
          - Add one magnetic phone stand for the demo desk.
          - Leave a short cart handoff note.
evaluation:
  evaluator_id: evaluators.linux.openshop:OpenShopApiEvaluator
  params:
    session:
      logged_in: true
      phone: '13800138000'
    cart:
      item_count: 2
      total: 167
      items:
        - product_id: p1005
          quantity: 1
          selected_spec: 20 sachets
        - product_id: p1006
          quantity: 1
          selected_spec: Magnetic mount
    benchmark_events:
      - type: catalog_view
        match:
          query: mountain isle pour-over coffee
          category: Grocery
          sort: priceAsc
      - type: cart_item_added
        match:
          productId: p1005
      - type: catalog_view
        match:
          query: lumen magnetic phone stand
          category: Electronics
          sort: priceAsc
      - type: cart_item_added
        match:
          productId: p1006
    benchmark_event_sequence:
      - type: catalog_view
        match:
          query: mountain isle pour-over coffee
          category: Grocery
          sort: priceAsc
      - type: cart_item_added
        match:
          productId: p1005
      - type: catalog_view
        match:
          query: lumen magnetic phone stand
          category: Electronics
          sort: priceAsc
      - type: cart_item_added
        match:
          productId: p1006
    text_artifacts:
      - path: /tmp/helloworld_openshop/starter_cart_note.txt
        equals: |
          account=13800138000
          cart=Mountain Isle Pour-Over Coffee 20 Pack|Lumen Magnetic Phone Stand
          quantities=1 each
          handoff=starter cart ready
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
    - linux
    - gui
    - shopping
    - openshop
    - login
    - easy
  description: Sign in, search for two requested products, confirm a realistic starter cart, and leave a short handoff note.
  oracle_task: tasks/linux/oracle/openshop_login_oracle.yaml
  oracle_model: openshop_oracle
  difficulty: easy
