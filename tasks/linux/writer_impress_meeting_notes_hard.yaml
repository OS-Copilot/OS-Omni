task_id: linux.cross_app.writer_impress_meeting_notes_hard
platform: linux
instruction: >
  Open LibreOffice Writer. Create a new document with the heading
  "Weekly Team Meeting Notes". Below the heading, create a table with
  two columns: "Topic" and "Owner". Add these rows:
  - Sprint Planning, Alice
  - Bug Triage, Bob
  - Release Review, Carol
  Save the document as /home/user/Documents/meeting_notes.odt.
  Then switch to the already-open LibreOffice Impress window. Create a new
  presentation. On the first slide, use Insert → Text Box to add a text box
  and type "Meeting Summary" as the title. Then use Insert → File to insert
  the document /home/user/Documents/meeting_notes.odt. In the insert dialog,
  navigate to /home/user/Documents/, select meeting_notes.odt, and click Open.
  Save the presentation as /home/user/Documents/meeting_presentation.odp.
  Finish after the presentation is saved.
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: |
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_writer/B11B17CA-0B48-4A7E-B567-A2524C24D26F/Bench_Status_Update.docx"
        out = Path("/home/user/Desktop/Bench_Status_Update.docx")
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(urlopen(url).read())
        PY|
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/wireshark/C9CCC440-B4EE-407E-B53D-B389ED564F8E/retail_mix.pcapng"
        out = Path("/tmp/helloworld_wireshark/retail_mix.pcapng")
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(urlopen(url).read())
        PY|
        pkill -f soffice.bin || true
        pkill -f '/usr/lib/libreoffice/program/soffice' || true
        mkdir -p /home/user/Documents
    - type: wait
      ms: 1200
    - type: run_bash
      script: |
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_writer/B11B17CA-0B48-4A7E-B567-A2524C24D26F/Bench_Status_Update.docx"
        out = Path("/home/user/Desktop/Bench_Status_Update.docx")
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(urlopen(url).read())
        PY|
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/wireshark/C9CCC440-B4EE-407E-B53D-B389ED564F8E/retail_mix.pcapng"
        out = Path("/tmp/helloworld_wireshark/retail_mix.pcapng")
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(urlopen(url).read())
        PY|
        export DISPLAY=:0
        setsid -f libreoffice --writer >/dev/null 2>&1
    - type: wait
      ms: 5000
    - type: run_bash
      script: |
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_writer/B11B17CA-0B48-4A7E-B567-A2524C24D26F/Bench_Status_Update.docx"
        out = Path("/home/user/Desktop/Bench_Status_Update.docx")
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(urlopen(url).read())
        PY|
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/wireshark/C9CCC440-B4EE-407E-B53D-B389ED564F8E/retail_mix.pcapng"
        out = Path("/tmp/helloworld_wireshark/retail_mix.pcapng")
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(urlopen(url).read())
        PY|
        export DISPLAY=:0
        setsid -f libreoffice --impress >/dev/null 2>&1
    - type: wait
      ms: 5000
evaluation:
  evaluator_id: evaluators.linux.command_check:CommandCheckEvaluator
  params:
    timeout: 120
    stdout_contains: "PASS"
    command: |
      set -euo pipefail
      python3 - <<'PY'
      import os
      import zipfile

      odt_path = os.path.expanduser("~/Documents/meeting_notes.odt")
      if not os.path.exists(odt_path):
          raise SystemExit("WRITER_FILE_NOT_FOUND")

      with zipfile.ZipFile(odt_path, 'r') as z:
          content = z.read('content.xml').decode('utf-8')

      for value in ["Weekly Team Meeting Notes", "Sprint Planning", "Bug Triage", "Release Review"]:
          if value not in content:
              raise SystemExit(f"MISSING_VALUE_{value.replace(' ', '_')}")

      odp_path = os.path.expanduser("~/Documents/meeting_presentation.odp")
      if not os.path.exists(odp_path):
          raise SystemExit("IMPRESS_FILE_NOT_FOUND")

      print("PASS")
      PY
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - linux
  - cross_app
  - writer
  - impress
  - meeting
  - table
  - presentation
  - hard
  app_name: libreoffice_writer + libreoffice_impress
  difficulty: hard
  description: Create a meeting notes document in Writer with a table of topics
    and owners, then insert it into an Impress presentation via Insert →
    File dialog.
