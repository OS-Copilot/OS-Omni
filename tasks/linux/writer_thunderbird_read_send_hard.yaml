evaluation:
  evaluator_id: evaluators.linux.command_check:CommandCheckEvaluator
  params:
    timeout: 120
    stdout_contains: "PASS"
    command: |
      set -euo pipefail
      python3 - <<'PY'
      import os
      import subprocess

      # Expected values from the Writer document
      expected_values = [
          "Bench Infrastructure Upgrade",
          "In Progress",
          "Deploy to staging environment"
      ]

      # Check Thunderbird draft contains expected values
      thunderbird_dir = os.path.expanduser("~/.thunderbird")
      if not os.path.exists(thunderbird_dir):
          raise SystemExit("THUNDERBIRD_DIR_NOT_FOUND")

      for value in expected_values:
          result = subprocess.run(
              ["grep", "-R", "-a", "-q", value, thunderbird_dir],
              capture_output=True
          )
          if result.returncode != 0:
              raise SystemExit(f"MISSING_VALUE_IN_DRAFT_{value}")

      print("PASS")
      PY
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
