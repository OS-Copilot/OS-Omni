  description: Read a seeded Writer document with a table containing project info,
    extract three known values, then compose a Thunderbird email with those
    exact values.
  oracle_task: tasks/linux/oracle/cross_app_writer_thunderbird_read_send_oracle.yaml
  oracle_model: linux_oracle_wait
