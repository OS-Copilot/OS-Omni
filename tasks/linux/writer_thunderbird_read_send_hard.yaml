task_id: linux.cross_app.writer_thunderbird_read_send_hard
platform: linux
instruction: >
  Open the seeded Writer document "Bench_Status_Update.docx" on the Desktop.
  The document contains a table with two columns: "Field" and "Value".
  Find these three rows in the table:
  - Project Name: Bench Infrastructure Upgrade
  - Status: In Progress
  - Next Steps: Deploy to staging environment
  Then switch to the already-open Thunderbird compose window. In the email
  body, type:
  "Project: Bench Infrastructure Upgrade
  Status: In Progress
  Next Steps: Deploy to staging environment"
  Leave the draft open without sending.
  Finish after the email body is updated.
