task_id: linux.cross_app.zotero_thunderbird_export_attach_hard
platform: linux
instruction: >
  Open Zotero. Create a new collection named "Reading List" under My Library.
  Add three Journal Article items to this collection:
  1. "Attention Is All You Need" by Ashish Vaswani
  2. "BERT" by Jacob Devlin
  3. "Longformer" by Iz Beltagy
  Add the tag "transformer" to all three items. To add a tag, select an item,
  then in the right panel click the Tags tab, click Add, and type "transformer".
  Select the "Reading List" collection. Go to File → Export Collection. In the
  export dialog, choose "BibTeX" format and save the file to
  /home/user/Documents/reading_list.bib.
  Then switch to the already-open Thunderbird compose window. The email should
  have subject "Bench Reading List Export" and body "Please find attached the
  exported bibliography." Click the Attach button in the compose toolbar,
  navigate to /home/user/Documents/, select reading_list.bib, and click Open.
  Leave the draft open without sending.
  Finish after the attachment is added.
