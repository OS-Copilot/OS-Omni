evaluation:
  evaluator_id: evaluators.linux.command_check:CommandCheckEvaluator
  params:
    timeout: 120
    stdout_contains: "PASS"
    command: |
      set -euo pipefail
      python3 - <<'PY'
      import sqlite3
      import os

      # Check Zotero database
      db_path = os.path.expanduser("~/Zotero/zotero.sqlite")
      if not os.path.exists(db_path):
          raise SystemExit("ZOTERO_DB_NOT_FOUND")

      conn = sqlite3.connect(db_path)
      cur = conn.cursor()

      # Check collection exists
      cur.execute("SELECT collectionName FROM collections WHERE collectionName='Reading List'")
      if not cur.fetchone():
          raise SystemExit("COLLECTION_NOT_FOUND")

      # Check 3 journal articles exist
      cur.execute("""
          SELECT i.itemID, f.value FROM items i
          JOIN itemData id ON i.itemID = id.itemID
          JOIN fields f ON id.fieldID = f.fieldID
          JOIN itemDataValues idv ON id.valueID = idv.valueID
          WHERE f.fieldName = 'title'
          AND idv.value IN ('Attention Is All You Need', 'BERT', 'Longformer')
      """)
      items = cur.fetchall()
      if len(items) != 3:
          raise SystemExit(f"EXPECTED_3_ITEMS_GOT_{len(items)}")

      # Check tags exist
      cur.execute("""
          SELECT DISTINCT tag FROM tags
          WHERE tag = 'transformer'
      """)
      if not cur.fetchone():
          raise SystemExit("TAG_NOT_FOUND")

      conn.close()

      # Check BibTeX file exists
      bib_path = os.path.expanduser("~/Documents/reading_list.bib")
      if not os.path.exists(bib_path):
          raise SystemExit("BIBTEX_FILE_NOT_FOUND")

      # Check Thunderbird draft has attachment
      import subprocess
      result = subprocess.run(
          ["grep", "-R", "-a", "-q", "reading_list.bib", os.path.expanduser("~/.thunderbird")],
          capture_output=True
      )
      if result.returncode != 0:
          raise SystemExit("ATTACHMENT_NOT_FOUND_IN_THUNDERBIRD")

      print("PASS")
      PY
limits:
  max_steps: 100
  step_timeout_seconds: 120
