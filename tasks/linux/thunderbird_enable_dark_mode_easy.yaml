task_id: linux.thunderbird.thunderbird_enable_dark_mode
platform: linux
instruction: Considering I work late into the night and use Thunderbird frequently,
  I find that a full dark mode would be easier on my eyes during those hours. Can
  you help me enable a complete dark mode in Thunderbird?
source: https://superuser.com/questions/1757333/how-can-i-view-thunderbird-in-full-dark-mode
osworld_id: 10a730d5-d414-4b40-b479-684bed1ae522
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
    - type: download
      url: https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/thunderbird/dd84e895-72fd-4023-a336-97689ded257c/thunderbird-profile.tar.gz
      path: /home/user/thunderbird-profile.tar.gz
    - type: run_command
      command: tar -xzv --recursive-unlink -f /home/user/thunderbird-profile.tar.gz
        -C /home/user/
    - type: launch_app
      command: /usr/bin/thunderbird
evaluation:
  evaluator_id: evaluators.linux.thunderbird:ThunderbirdTaskEvaluator
  params:
    osworld_evaluator:
      postconfig:
      - type: close_window
        parameters:
          window_name: Mail.thunderbird
          strict: true
          by_class: true
      - type: sleep
        parameters:
          seconds: 0.5
      func: check_thunderbird_prefs
      result:
        type: vm_file
        path: /home/user/.thunderbird/t5q2a5hp.default-release/prefs.js
        dest: thunder-prefs.js
      expected:
        type: rule
        rules:
          expect:
            extensions.activeThemeID:
              method: re
              ref: dark
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - email
  - thunderbird
  - easy
  - osworld
  app_name: thunderbird
  source: https://superuser.com/questions/1757333/how-can-i-view-thunderbird-in-full-dark-mode
  osworld_id: 10a730d5-d414-4b40-b479-684bed1ae522
  oracle_task: tasks/linux/oracle/thunderbird_enable_dark_mode_oracle.yaml
  oracle_model: linux_oracle_wait
  difficulty: easy
