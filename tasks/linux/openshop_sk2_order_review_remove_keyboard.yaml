task_id: linux.openshop.sk2_order_review_remove_keyboard
platform: linux
instruction: Sign in to the OpenShop application as Lucas Lin using the password spring2026 and place
  a four-item order with a specific note and review, then add and remove a keyboard from the cart. The
  order must contain the Verdant Pro Noise-Canceling Headphones with the White option selected, the Lumen
  Fast-Charge LED Desk Lamp, the North Orchard Whole Grain Cookie Tin, and the ClearPage Wireless Desktop
  Printer, each with a quantity of one. The checkout process must use the Office shipping address and
  WeChat Pay as the payment method, with the text desk kit entered into the Order Note field. The order
  confirmation page must display a submitted review with a rating of 5 / 5 and the review text works well.
  The Lumen Travel Compact Keyboard must be added to the cart and subsequently removed. The final state
  must have the browser remaining on the Cart page and the user still logged in as Lucas Lin.
init:
