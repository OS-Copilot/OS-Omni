    - type: run_bash
      timeout: 30
      script: |-
        python3 - <<'PY'
        import json
        from pathlib import Path

        webpage_dir = Path("/home/user/Desktop/webpage")
        candidates = []
        if webpage_dir.is_dir():
            for pattern in ("*openshop*", "*OpenShop*", "*.desktop", "*.html"):
                candidates.extend(str(path) for path in webpage_dir.glob(pattern))
                candidates.extend(str(path) for path in webpage_dir.glob(f"**/{pattern}"))
        candidates = sorted(set(candidates))
        openshop_candidates = [path for path in candidates if "openshop" in Path(path).name.lower()]
        checks = [
            {"name": "webpage_dir_exists", "path": str(webpage_dir), "passed": webpage_dir.is_dir()},
            {
                "name": "openshop_launcher_present",
                "webpage_dir": str(webpage_dir),
                "candidate_count": len(openshop_candidates),
                "candidates": openshop_candidates[:20],
                "passed": bool(openshop_candidates),
            },
        ]
        failures = [check["name"] for check in checks if not check["passed"]]
        print(json.dumps({
            "snapshot_assumption": "sk2",
            "vm_profile": "ubuntu0",
            "checks": checks,
            "failures": failures,
            "note": "Initializer only validates that the sk2 snapshot has the webpage/OpenShop launch assets. It does not launch OpenShop, sign in, add products, submit orders, write app state, or restore snapshots.",
        }, ensure_ascii=False))
        raise SystemExit(1 if failures else 0)
        PY
evaluation:
  evaluator_id: evaluators.linux.command_check:CommandCheckEvaluator
  params:
    timeout: 60
    expected_exit_code: 0
    command: |-
      python3 - <<'PY'
      from __future__ import annotations

      import json
      import re
      import urllib.error
      import urllib.request
      from pathlib import Path
      from typing import Any

      PORT = 4310
      EXPECTED_PRODUCTS = [
          "Verdant Pro Noise-Canceling Headphones",
          "Lumen Fast-Charge LED Desk Lamp",
          "North Orchard Whole Grain Cookie Tin",
          "ClearPage Wireless Desktop Printer",
      ]
      KEYBOARD = "Lumen Travel Compact Keyboard"
      EXPECTED_QUERY_CATEGORY = [
          ("headphones", "Electronics"),
          ("desk lamp", "Electronics"),
          ("cookie tin", "Grocery"),
          ("desktop printer", "Office"),
          ("keyboard", "Electronics"),
      ]
      REQUIRED_FINAL_TEXTS = [
          "Lucas Lin",
          "desk kit",
          "works well",
          "Office",
          "WeChat Pay",
          "White",
          *EXPECTED_PRODUCTS,
      ]

      checks: list[dict[str, Any]] = []
      failures: list[str] = []
      api_payloads: dict[str, Any] = {}
      storage_hits: dict[str, list[dict[str, Any]]] = {}

      def add_check(name: str, passed: bool, *, observed: Any = None, required: Any = None, source: str | None = None) -> None:
          item: dict[str, Any] = {"name": name, "passed": bool(passed)}
          if observed is not None:
              item["observed"] = observed
          if required is not None:
              item["required"] = required
          if source:
              item["source"] = source
          checks.append(item)
          if not passed:
              failures.append(name)

      def fetch_json(path: str) -> Any:
          url = f"http://127.0.0.1:{PORT}{path}"
          req = urllib.request.Request(url, method="GET")
          with urllib.request.urlopen(req, timeout=5) as resp:
              return json.loads(resp.read().decode("utf-8"))

      for path in ("/api/session", "/api/cart", "/api/orders", "/api/benchmark", "/api/reviews"):
          try:
              api_payloads[path] = fetch_json(path)
          except Exception as exc:
              api_payloads[path] = {"error": f"{type(exc).__name__}: {exc}"}

      def json_text(value: Any) -> str:
          return json.dumps(value, ensure_ascii=False, sort_keys=True)

      def lower_text(value: Any) -> str:
          return json_text(value).lower()

      browser_roots = [
          Path("/home/user/.config/google-chrome"),
          Path("/home/user/.config/chromium"),
          Path("/home/user/snap/chromium/common/chromium"),
          Path("/home/user/.mozilla/firefox"),
          Path("/tmp/helloworld_openshop_current"),
          Path("/tmp/helloworld_openshop"),
      ]
      needles = set(REQUIRED_FINAL_TEXTS + [KEYBOARD, "cart", "orders", "review", "rating", "benchmarkEvents"])
      text_blobs: list[tuple[str, str]] = []
      inspected_files = 0
      for root in browser_roots:
          if not root.exists():
              continue
          for path in root.rglob("*"):
              try:
                  if not path.is_file():
                      continue
                  size = path.stat().st_size
                  if size <= 0 or size > 15_000_000:
                      continue
                  if path.suffix.lower() not in {"", ".log", ".ldb", ".sqlite", ".sqlite3", ".json", ".js", ".html", ".txt"}:
                      continue
                  data = path.read_bytes()
                  text = data.decode("utf-8", errors="ignore")
                  if not text.strip():
                      text = data.decode("latin-1", errors="ignore")
                  compact_text = text.replace("\x00", "")
                  lowered = compact_text.lower()
                  matched = [needle for needle in needles if needle.lower() in lowered]
                  inspected_files += 1
                  if matched:
                      text_blobs.append((str(path), compact_text))
                      for needle in matched:
                          idx = lowered.find(needle.lower())
                          snippet = compact_text[max(0, idx - 140): idx + len(needle) + 140]
                          storage_hits.setdefault(needle, []).append({"path": str(path), "snippet": snippet[:420]})
              except Exception:
                  continue
              if len(text_blobs) >= 80:
                  break
          if len(text_blobs) >= 80:
              break

      combined_storage_text = "\n".join(text for _, text in text_blobs)
      combined_evidence_text = "\n".join([json_text(api_payloads), combined_storage_text])
      combined_lower = combined_evidence_text.lower()

      def walk(value: Any):
          if isinstance(value, dict):
              yield value
              for child in value.values():
                  yield from walk(child)
          elif isinstance(value, list):
              for child in value:
                  yield from walk(child)

      def find_lists_with_key(value: Any, key_names: set[str]) -> list[list[Any]]:
          found: list[list[Any]] = []
          for obj in walk(value):
              if not isinstance(obj, dict):
                  continue
              for key, item in obj.items():
                  if str(key).lower() in key_names and isinstance(item, list):
                      found.append(item)
          return found

      def extract_json_objects(text: str) -> list[Any]:
          marker_positions = []
          for marker in ('"orders"', '"cart"', '"reviews"', '"benchmarkEvents"', '"events"'):
              start = 0
              while True:
                  pos = text.find(marker, start)
                  if pos < 0:
                      break
                  marker_positions.append(pos)
                  start = pos + len(marker)
          parsed: list[Any] = []
          seen: set[tuple[int, int]] = set()
          for marker_pos in marker_positions[:120]:
              for left in range(marker_pos, max(-1, marker_pos - 60000), -1):
                  if text[left] != "{":
                      continue
                  depth = 0
                  in_string = False
                  escape = False
                  right_limit = min(len(text), left + 900000)
                  for right in range(left, right_limit):
                      ch = text[right]
                      if in_string:
                          if escape:
                              escape = False
                          elif ch == "\\":
                              escape = True
                          elif ch == '"':
                              in_string = False
                      else:
                          if ch == '"':
                              in_string = True
                          elif ch == "{":
                              depth += 1
                          elif ch == "}":
                              depth -= 1
                              if depth == 0:
                                  key = (left, right)
                                  if key not in seen:
                                      seen.add(key)
                                      candidate = text[left:right + 1]
                                      try:
                                          parsed.append(json.loads(candidate))
                                      except Exception:
                                          pass
                                  break
                  if parsed and marker_pos - left > 2000:
                      break
          return parsed

      parsed_states: list[Any] = []
      for payload in api_payloads.values():
          if not (isinstance(payload, dict) and "error" in payload):
              parsed_states.append(payload)
      for _, blob in text_blobs:
          parsed_states.extend(extract_json_objects(blob))

      orders: list[Any] = []
      carts: list[list[Any]] = []
      events: list[Any] = []
      reviews: list[Any] = []
      for state in parsed_states:
          orders.extend(find_lists_with_key(state, {"orders", "orderlist"}))
          carts.extend(find_lists_with_key(state, {"cart", "cartitems", "cart_items"}))
          events.extend(find_lists_with_key(state, {"events", "benchmarkevents", "eventlog", "logs"}))
          reviews.extend(find_lists_with_key(state, {"reviews", "reviewlist"}))
      flat_orders = [item for sublist in orders for item in sublist]
      flat_events = [item for sublist in events for item in sublist]
      flat_reviews = [item for sublist in reviews for item in sublist]

      session_payload = api_payloads.get("/api/session")
      session_text = lower_text(session_payload)
      add_check(
          "logged_in_as_lucas_lin",
          ("lucas lin" in session_text and ("loggedin" in session_text or "logged_in" in session_text or "true" in session_text)) or "lucas lin" in combined_lower,
          required={"user_name": "Lucas Lin"},
          observed=session_payload,
          source="api:/api/session plus browser storage fallback",
      )

      order_candidates = sorted(
          flat_orders,
          key=lambda item: len([text for text in REQUIRED_FINAL_TEXTS if text.lower() in lower_text(item)]),
          reverse=True,
      )
      latest_order = order_candidates[0] if order_candidates else None
      latest_order_text = lower_text(latest_order) if latest_order is not None else ""
      order_or_storage_text = "\n".join([latest_order_text, combined_lower])
      add_check(
          "latest_order_found",
          latest_order is not None or all(text.lower() in combined_lower for text in ("desk kit", "wechat pay", "works well")),
          observed={"api_order_count": len(flat_orders), "storage_hit_keys": sorted(storage_hits.keys())[:80]},
          required="Submitted order with note, payment, and review evidence",
          source="api orders or browser storage",
      )
      for product in EXPECTED_PRODUCTS:
          add_check(
              f"order_contains:{product}",
              product.lower() in order_or_storage_text,
              required=product,
              observed=storage_hits.get(product, [])[:3],
              source="latest order or browser storage",
          )
      add_check("headphones_option_white", "white" in order_or_storage_text, required="White", observed=storage_hits.get("White", [])[:3])
      add_check("order_note_desk_kit", "desk kit" in order_or_storage_text, required="desk kit", observed=storage_hits.get("desk kit", [])[:3])
      add_check("shipping_address_office", "office" in order_or_storage_text, required="Office")
      add_check("payment_wechat_pay", "wechat pay" in order_or_storage_text or "wechat" in order_or_storage_text, required="WeChat Pay")
      review_text = "\n".join([lower_text(flat_reviews), latest_order_text, lower_text(api_payloads.get("/api/reviews")), combined_lower])
      add_check("review_text_works_well", "works well" in review_text, required="works well", observed=storage_hits.get("works well", [])[:3])
      rating_patterns = [
          r'"rating"\s*:\s*5\b',
          r'"score"\s*:\s*5\b',
          r'"stars"\s*:\s*5\b',
          r'5\s*/\s*5',
          r'rating[^0-9]{0,20}5',
      ]
      add_check("review_rating_5", any(re.search(pattern, review_text, re.I) for pattern in rating_patterns), required="5 / 5")

      cart_payload = api_payloads.get("/api/cart")
      cart_items = None
      if isinstance(cart_payload, dict):
          maybe_items = cart_payload.get("items") or cart_payload.get("cart") or cart_payload.get("cartItems")
          if isinstance(maybe_items, list):
              cart_items = maybe_items
      if cart_items is None and carts:
          cart_candidates = sorted(carts, key=lambda cart: len(json_text(cart)))
          cart_items = cart_candidates[0]
      add_check(
          "final_cart_empty_after_keyboard_removed",
          isinstance(cart_items, list) and len(cart_items) == 0,
          required="Cart has zero items after removing Lumen Travel Compact Keyboard",
          observed=cart_items if cart_items is not None else "no structured cart source found",
          source="api:/api/cart or parsed browser state",
      )

      event_texts = [lower_text(event) for event in flat_events]
      add_check(
          "event_log_source_found",
          bool(event_texts),
          required="Readable OpenShop event or benchmark history",
          observed={"event_count": len(event_texts)},
          source="api:/api/benchmark or parsed browser state",
      )

      def find_event_after(cursor: int, tokens: list[str]) -> int:
          for index in range(cursor, len(event_texts)):
              event_text = event_texts[index]
              if all(token.lower() in event_text for token in tokens):
                  return index
          return -1

      cursor = 0
      sequence_details = []
      sequence_ok = bool(event_texts)
      expected_sequence: list[tuple[str, list[str]]] = []
      for query, category in EXPECTED_QUERY_CATEGORY[:4]:
          expected_sequence.append((f"search_{query}", [query, category]))
          product = {
              "headphones": "Verdant",
              "desk lamp": "Lumen",
              "cookie tin": "North Orchard",
              "desktop printer": "ClearPage",
          }[query]
          expected_sequence.append((f"add_{query}", [product]))
      for product in ("Verdant", "Lumen Fast", "North Orchard", "ClearPage"):
          expected_sequence.append((f"quantity_plus_{product}", [product.split()[0], "2"]))
          expected_sequence.append((f"quantity_minus_{product}", [product.split()[0], "1"]))
      expected_sequence.extend([
          ("select_home_address", ["home"]),
          ("select_office_address", ["office"]),
          ("select_alipay", ["alipay"]),
          ("select_wechat_pay", ["wechat"]),
          ("checkout_submitted", ["desk kit"]),
          ("review_submitted", ["works well"]),
          ("search_keyboard", ["keyboard", "electronics"]),
          ("add_keyboard", ["keyboard"]),
          ("remove_keyboard", ["keyboard", "remove"]),
      ])
      for label, tokens in expected_sequence:
          index = find_event_after(cursor, tokens)
          sequence_details.append({"label": label, "tokens": tokens, "matched_index": index})
          if index < 0:
              sequence_ok = False
          else:
              cursor = index + 1
      checks.append({
          "name": "gui_event_sequence_observed_non_blocking",
          "passed": sequence_ok,
          "required": expected_sequence,
          "observed": sequence_details,
          "source": "OpenShop event log when available",
          "non_blocking": True,
          "note": (
              "The sk2 OpenShop webpage persists the final order, review, and cart state in browser storage, "
              "but the local API/event history is not always available after a human-run session. "
              "Final business state is the hard verifier evidence."
          ),
      })

      result = {
          "task_id": "linux.openshop.sk2_order_review_remove_keyboard",
          "status": "PASS" if not failures else "FAIL",
          "checks": checks,
          "failures": failures,
          "api_payload_paths": {path: ("ok" if not (isinstance(payload, dict) and "error" in payload) else payload["error"]) for path, payload in api_payloads.items()},
          "browser_storage": {
              "inspected_files": inspected_files,
              "matched_file_count": len(text_blobs),
              "storage_hit_keys": sorted(storage_hits.keys()),
          },
          "verifier_rules": [
              "Final business evidence is the submitted OpenShop order: four specified products, headphones option White, address Office, payment WeChat Pay, and order note desk kit.",
              "Review evidence must include rating 5 / 5 and review text works well.",
              "The final cart must be empty after the keyboard item is removed.",
              "OpenShop event/benchmark history is recorded as non-blocking diagnostic evidence when available because the sk2 webpage may only persist final business state in browser storage after a human-run session.",
              "The evaluator only performs read-only HTTP GET requests and read-only filesystem scans of browser/app storage; it does not click, type, submit, reset, restore snapshots, or edit app/VM state.",
          ],
      }
      print(json.dumps(result, ensure_ascii=False, indent=2))
      raise SystemExit(0 if not failures else 1)
      PY
