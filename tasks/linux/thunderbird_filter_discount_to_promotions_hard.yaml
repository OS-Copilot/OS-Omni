task_id: linux.thunderbird.thunderbird_filter_discount_to_promotions
platform: linux
instruction: Create a local folder called "Promotions" and create a filter to auto
  move the inbox emails whose subject contains “discount” to the new folder
source: https://support.mozilla.org/en-US/kb/organize-your-messages-using-filters
osworld_id: 5203d847-2572-4150-912a-03f062254390
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
    - type: download
      url: https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/thunderbird/dd84e895-72fd-4023-a336-97689ded257c/thunderbird-profile.tar.gz
      path: /home/user/thunderbird-profile.tar.gz
    - type: run_command
      command: tar -xzv --recursive-unlink -f /home/user/thunderbird-profile.tar.gz
        -C /home/user/
    - type: launch_app
      command: /usr/bin/thunderbird
evaluation:
  evaluator_id: evaluators.linux.thunderbird:ThunderbirdTaskEvaluator
  params:
    osworld_evaluator:
      postconfig:
      - type: close_window
        parameters:
          window_name: Message Filters
          strict: true
      - type: sleep
        parameters:
          seconds: 0.5
      func: check_thunderbird_filter
      result:
        type: vm_file
        path: /home/user/.thunderbird/t5q2a5hp.default-release/ImapMail/outlook.office365.com/msgFilterRules.dat
        dest: msgFilterRules.dat
      expected:
        type: rule
        rules:
          expect:
          - enabled: 'yes'
            action: Move to folder
            actionValue: mailbox://nobody@Local%20Folders/Promotions
            condition:
            - AND (subject,contains,discount)
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - email
  - thunderbird
  - hard
  - osworld
  app_name: thunderbird
  source: https://support.mozilla.org/en-US/kb/organize-your-messages-using-filters
  osworld_id: 5203d847-2572-4150-912a-03f062254390
  oracle_task: tasks/linux/oracle/thunderbird_filter_discount_to_promotions_oracle.yaml
  oracle_model: linux_oracle_wait
  difficulty: hard
