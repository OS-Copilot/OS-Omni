instruction: |-
  Update the OpenFinance application to reflect a revised budget, a corrected transaction, filtered rule execution, account reconciliation, new financial goals, bill status changes, payee preferences, rule application, and a new portfolio holding.

  The Subscriptions category budget for the month following the current view must be set to 120. A new transaction must exist with the date 2026-06-30, payee QA Market, type Expense, amount 33.45, account Travel Rewards Card, category Groceries, cleared status enabled, and note receipt fixed. The transaction originally created with the note market audit must be updated to reflect this corrected note while retaining the Groceries category. The transaction list must be filtered to display only transactions with the category Groceries and the account Travel Rewards Card, with all visible transactions selected and the Run rules action executed.

  In the Accounts section, the Account Register must display the Travel Rewards Card with reconciled items hidden, and the status of the first transaction in the register must be changed from Cleared to Reconciled. In the Budgets section, the Fill action must be activated for the Housing category, the Groceries budget must be set to 540, and the Dining budget must be set to 310. A new goal named QA Reserve with a target amount of 900 must be added.

  In the Bills section, the Brightline Energy bill amount must be edited to 150, and both the Evergreen Rent bill and the Travel Rewards Card bill must be marked as paid. In the Payees section, both Whole Basket Market and Brightline Energy must be marked as favorites. In the Rules section, rules must be applied to existing transactions, and both the market rule and the energy rule must be run.

  In the Portfolio section, a new holding must be added with the ticker symbol QAETF, 2 shares, and a current price of 101. The Reports section must be visible at completion.
