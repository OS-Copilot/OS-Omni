evaluation:
  evaluator_id: evaluators.linux.command_check:CommandCheckEvaluator
  params:
    timeout: 120
    stdout_contains: "PASS"
    command: |
      set -euo pipefail
      python3 - <<'PY'
      import os
      import zipfile

      # Expected values from the chat conversations
      expected_values = [
          "Bench Infrastructure Upgrade",
          "2026-06-15",
          "Database migration",
          "API refactoring",
          "UI redesign",
          "70% complete",
          "Waiting for API credentials"
      ]

      # Check Writer document
      odt_path = os.path.expanduser("~/Documents/project_summary.odt")
      if not os.path.exists(odt_path):
          raise SystemExit("WRITER_FILE_NOT_FOUND")

      # Parse ODT to verify content
      with zipfile.ZipFile(odt_path, 'r') as z:
          content = z.read('content.xml').decode('utf-8')

      # Check for expected values
      for value in expected_values:
          if value not in content:
              raise SystemExit(f"MISSING_VALUE_{value}")

      print("PASS")
      PY
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - linux
  - cross_app
  - deltachat
  - writer
  - chat
  - sidebar
  - hard
  app_name: deltachat + libreoffice_writer
  difficulty: hard
  description: Read two Delta Chat conversations (Alice and Bob) via sidebar navigation,
    extract known project info from each, then create a combined summary document
    in Writer with those exact values.
  oracle_task: tasks/linux/oracle/cross_app_deltachat_writer_read_summary_oracle.yaml
  oracle_model: linux_oracle_wait
