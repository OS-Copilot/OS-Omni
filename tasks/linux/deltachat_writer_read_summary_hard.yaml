task_id: linux.cross_app.deltachat_writer_read_summary_hard
platform: linux
instruction: >
  Open Delta Chat. In the left sidebar, click on the conversation with Alice.
  Read the messages and find:
  - Project name: Bench Infrastructure Upgrade
  - Deadline: 2026-06-15
  - Key tasks: Database migration, API refactoring, UI redesign
  Then click on the conversation with Bob in the left sidebar. Read the
  messages and find:
  - Status update: 70% complete
  - Blocker: Waiting for API credentials
  Then switch to the already-open LibreOffice Writer window. Create a new
  document with the heading "Project Status Summary" and include:
  "Project: Bench Infrastructure Upgrade
  Deadline: 2026-06-15
  Key Tasks:
  - Database migration
  - API refactoring
  - UI redesign
  Status Update: 70% complete
  Blocker: Waiting for API credentials"
  Save the Writer document as /home/user/Documents/project_summary.odt.
  Finish after the document is saved.
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: |
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_writer/B11B17CA-0B48-4A7E-B567-A2524C24D26F/Bench_Status_Update.docx"
        out = Path("/home/user/Desktop/Bench_Status_Update.docx")
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(urlopen(url).read())
        PY|
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/wireshark/C9CCC440-B4EE-407E-B53D-B389ED564F8E/retail_mix.pcapng"
        out = Path("/tmp/helloworld_wireshark/retail_mix.pcapng")
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(urlopen(url).read())
        PY|
        pkill -f deltachat || true
        pkill -f soffice.bin || true
        mkdir -p /home/user/Documents
