instruction: |-
  Log in to the ride-hailing application as Riley Rider using the email rider@example.com and the password Password123!, then configure the Ride section for the city San Francisco Bay, CA - USD.

  Create three scheduled ride bookings that form a continuous travel itinerary. The first ride must have a pickup at University Avenue, Palo Alto, CA, a destination of San Francisco International Airport, and an added stop at Stanford University, Stanford, CA; it requires the RideXL vehicle type, the payment method PayPal rider@example.com, and a schedule for the 30th of the current month in the 02:45 - 03:00 time window. The second ride must have a pickup at San Francisco International Airport and a destination of Ferry Building, San Francisco, CA; it requires the RideX vehicle type and a schedule for the 31st of the current month in the 03:00 - 03:15 time window. The third ride must have a pickup at Ferry Building, San Francisco, CA, a destination of University Avenue, Palo Alto, CA, and a stop at San Francisco International Airport; it requires the RideXL vehicle type, the promo code WELCOME20, and a schedule for the 31st of the current month in the 03:15 - 03:30 time window. All three bookings must be confirmed.

  In the Account section, expand the Wallet area and add a new card with the brand Mastercard, the last 4 digits 7788, and the label Travel Mastercard. Save this new card and set it as the default payment method.
