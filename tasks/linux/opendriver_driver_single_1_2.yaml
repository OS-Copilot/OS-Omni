platform: linux
instruction: |-
  Log in to the OpenDriver application as the driver Maya Rodriguez using the email address driver@example.com and the password Password123!.

  The driver workspace must be accessed, and the Money, Account, and Support sections must be visited before returning to the Work area. A sample request must be generated, and the ride request card displayed under Available ride requests must be selected. The first ride request must be rejected. A second sample request must be generated, and the ride request card under Available ride requests must be selected again. The trip must be accepted, and the active trip view must be opened. Within the Active trip controls panel, the passenger card for Riley Rider must be interacted with, and the Message function must be used. The trip must be opened again, and both the Message rider and Contact support functions must be used. The trip must be opened again, and the Mark arrived function must be used. The arrived status row must be selected. The Money tab must be visited, and the trip must be opened again to use the Message rider function. The Account and Support tabs must be visited, and the view must be refreshed. The trip must be opened again, and the Contact support function must be used. The driver arriving status row must be selected, and the Mark arrived function must be used to ensure the trip status is advanced to arrived.
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      timeout: 30
      script: |
        set -e
        pkill -f '/home/user/Applications/opendriver' 2>/dev/null || true
        pkill -f 'opendriver' 2>/dev/null || true
        cd /home/user/Applications/opendriver/shared/backend
        npm run seed
    - type: launch
      app_name: /home/user/Applications/opendriver/start-opendriver.sh
    - type: wait
      ms: 2500
evaluation:
  evaluator_id: evaluators.linux.command_check:CommandCheckEvaluator
  params:
    timeout: 30
    expected_exit_code: 0
    stdout_contains: OPENDRIVER_DRIVER_SINGLE_1_2_PASS
    command: |
      set -e
      cd /home/user/Applications/opendriver
      node - <<'NODE'
      const fs = require('fs');
      const db = JSON.parse(fs.readFileSync('shared/backend/data/opendriver-db.json', 'utf8'));
      const rides = db.rides || [];
      const target = rides
        .filter(r => r.driverId === 'usr_driver_primary' && ['arrived','in_progress','completed'].includes(r.status))
        .sort((a,b) => String(b.updatedAt || b.createdAt || '').localeCompare(String(a.updatedAt || a.createdAt || '')))[0];
      const failures = [];
      if (!target) failures.push('missing driver ride advanced to arrived or later');
      if (target) {
        if (target.status === 'searching') failures.push('ride still searching');
        if (target.cancelledAt) failures.push(`cancelledAt=${target.cancelledAt}`);
      }
      if (failures.length) {
        console.log(JSON.stringify({ok:false, failures, observed: rides.filter(r => r.driverId === 'usr_driver_primary').map(r => ({id:r.id,status:r.status,createdAt:r.createdAt,updatedAt:r.updatedAt}))}, null, 2));
        process.exit(1);
      }
      console.log('OPENDRIVER_DRIVER_SINGLE_1_2_PASS');
      console.log(JSON.stringify({rideId: target.id, status: target.status, riderId: target.riderId}, null, 2));
      NODE
