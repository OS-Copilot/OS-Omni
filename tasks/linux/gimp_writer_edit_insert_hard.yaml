task_id: linux.cross_app.gimp_writer_edit_insert_hard
platform: linux
instruction: >
  Open the seeded image /tmp/helloworld_gimp/input.png in GIMP.
  Use the scroll wheel to zoom out until you can see the entire image.
  Then use Image → Scale Image to resize the image to exactly 1024×768 pixels.
  Click Scale to confirm.
  Then use Image → Crop to Content to auto-crop any transparent borders.
  Then use Image → Mode → Grayscale to convert the image to grayscale.
  Finally use File → Export As to export the result to
  /home/user/Documents/processed.png as a PNG file. In the export dialog,
  click Export to confirm.
  Then switch to the already-open LibreOffice Writer window. Create a new
  document. Type the heading "Processed Image" and then use Insert → Image
  to insert the exported image /home/user/Documents/processed.png. In the
  insert dialog, navigate to /home/user/Documents/, select processed.png,
  and click Open. Save the Writer document as
  /home/user/Documents/image_report.odt.
  Finish after both files exist.
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: |
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_writer/B11B17CA-0B48-4A7E-B567-A2524C24D26F/Bench_Status_Update.docx"
        out = Path("/home/user/Desktop/Bench_Status_Update.docx")
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(urlopen(url).read())
        PY|
        python3 - <<'PY'
