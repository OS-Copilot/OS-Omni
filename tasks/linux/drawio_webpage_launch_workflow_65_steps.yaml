instruction: |-
  Create a flowchart titled Webpage Launch Workflow in the draw.io editor and save it as webpage_launch_workflow.drawio. The diagram must begin with a rectangle positioned at the top-center of the canvas containing the title Webpage Launch Workflow, resized so the full title is visible. Below the title, arrange eight process nodes and one decision diamond to form the workflow. The first row of process nodes, aligned horizontally, should consist of three rounded rectangles labeled Draft Homepage Copy, Review Navigation, and Build Feature Sections, arranged from left to right. The second row, positioned below the first, should consist of three rounded rectangles labeled Add Signup CTA, Check Analytics Tags, and Update Footer Links, arranged from right to left so that Add Signup CTA is on the right, Check Analytics Tags is in the middle, and Update Footer Links is on the left.

  Connect these nodes with arrow connectors in the following sequence: from Draft Homepage Copy to Review Navigation, from Review Navigation to Build Feature Sections, from Build Feature Sections to Add Signup CTA, from Add Signup CTA to Check Analytics Tags, and from Check Analytics Tags to Update Footer Links. Below the second row, place a diamond shape labeled QA Approved?, resized so the text is fully visible, and connect Update Footer Links to this diamond. Below the diamond, place a rounded rectangle labeled Publish Website at the bottom-center of the workflow and connect the QA Approved? diamond to Publish Website with an arrow connector labeled Yes. To the left of the QA Approved? diamond, place a plain rectangle labeled Fix Issues. Connect the QA Approved? diamond to Fix Issues with an arrow connector labeled No, and connect Fix Issues back to Check Analytics Tags with an arrow connector. The layout must be clear with all labels readable, and the completed canvas must remain open in Chrome.
