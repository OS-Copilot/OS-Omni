task_id: linux.thunderbird.qa66_mail_folder_search_calendar
platform: linux
instruction: Review the Local Folders mail search, filter, and calendar features in Thunderbird, create
  the `qa66box` folder and `qa66 event`, and leave the Local Folders tree selected with the Events panel
  visible. The expanded Local Folders tree should show Trash, Attachments - Images PDFs, Bills, Inbox
  History, Personal - Friends Family, Promotions Receipts, Travel Events Services, and Work - Bench Project.
  The mail-search review should cover the default-field queries `travel` and `bills`, each cleared before
  the next query; a `From` query for `qa66`; and a `Subject` condition for `receipt` after changing the
  matching mode from `Match any of the following` to `Match all of the following`. The search results
  should be cleared and the Search Messages window closed. A new message filter should be named `qa66
  filter` in the filter editor, but its creation must be canceled so no such filter is saved. Create `qa66box`
  under Local Folders. The Events review should include Travel Events Services and Work - Bench Project,
  the events `Cabin weekend packing`, `Drive to cabin`, and `Return from cabin`, and movement forward
  and backward through the event list. Save a new event titled `qa66 event`; leave the Events panel visible
  beside the selected Local Folders tree.
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    snapshot_name: snap_2
    notes: The snap_2 VM snapshot is expected to contain the prepared Thunderbird profile, Local Folders
      seed folders, and Events panel seed events used by this task. This initializer only opens Thunderbird
      Mail from that snapshot state.
    steps:
    - type: run_bash
      script: |
        echo "INIT_INFO: expecting VM snapshot snap_2 with prepared Thunderbird Mail profile and seed folders/events"
        pkill -f thunderbird || true
        PROFILE_DIR="/home/user/.thunderbird/t5q2a5hp.default-release"
        LOCAL_FOLDERS="$PROFILE_DIR/Mail/Local Folders"
        rm -f "$LOCAL_FOLDERS/qa66box" "$LOCAL_FOLDERS/qa66box.msf"
        rm -rf "$LOCAL_FOLDERS/qa66box.sbd"
        python3 - <<'PY'
        import os
        import shutil
        import sqlite3
        import tempfile
        from pathlib import Path

        db_path = Path("/home/user/.thunderbird/t5q2a5hp.default-release/calendar-data/local.sqlite")
        if not db_path.exists():
            raise SystemExit(0)
        temp_root = Path(tempfile.mkdtemp(prefix="qa66-init-calendar-"))
        query_db_path = temp_root / "local.sqlite"
        for suffix in ("", "-wal", "-shm"):
            source = Path(str(db_path) + suffix)
            if source.exists():
                shutil.copy2(source, Path(str(query_db_path) + suffix))
        conn = sqlite3.connect(query_db_path)
        try:
            rows = conn.execute(
                "SELECT id FROM cal_events WHERE lower(trim(title)) = lower(trim(?))",
                ("qa66 event",),
            ).fetchall()
            ids = [str(row[0]) for row in rows if row and row[0]]
            for item_id in ids:
                conn.execute("DELETE FROM cal_attendees WHERE item_id = ?", (item_id,))
                conn.execute("DELETE FROM cal_properties WHERE item_id = ?", (item_id,))
                conn.execute("DELETE FROM cal_recurrence WHERE item_id = ?", (item_id,))
                conn.execute("DELETE FROM cal_alarms WHERE item_id = ?", (item_id,))
                conn.execute("DELETE FROM cal_events WHERE id = ?", (item_id,))
            conn.commit()
        finally:
            conn.close()
        shutil.copy2(query_db_path, db_path)
        for suffix in ("-wal", "-shm"):
            sidecar = Path(str(db_path) + suffix)
            if sidecar.exists():
                sidecar.unlink()
        PY
      timeout: 120
    - type: wait
      ms: 1200
    - type: run_bash
      script: |
        export DISPLAY=${DISPLAY:-:0}
        export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority}
        export XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-/run/user/$(id -u)}
        export DBUS_SESSION_BUS_ADDRESS=${DBUS_SESSION_BUS_ADDRESS:-unix:path=${XDG_RUNTIME_DIR}/bus}
        setsid -f /usr/bin/thunderbird -mail >/dev/null 2>&1
      timeout: 120
    - type: wait
      ms: 5000
