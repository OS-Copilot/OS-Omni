task_id: linux.spotube.set_market_algeria
platform: linux
instruction: In Rhythmbox, import the folder Music > BenchVault > North Africa Sampler
  > Sahara Set. Use search to find sahara_dawn and play sahara_dawn.
init:
  initializer_id: initializers.linux.spotube:SpotubeInitializer
  params:
    app_command: rhythmbox
    libraries:
    - root_segments:
      - BenchVault
      - North Africa Sampler
      - Sahara Set
      tracks:
      - name: atlas_night
        frequency_hz: 265.0
      - name: desert_bus
        frequency_hz: 305.0
      - name: sahara_dawn
        frequency_hz: 345.0
evaluation:
  evaluator_id: evaluators.linux.spotube:SpotubeStateEvaluator
  params:
    state:
      playing: true
      current_track_name: sahara_dawn
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - linux
  - gui
  - music
  - rhythmbox
  - local-library
  - easy
  app: Rhythmbox
  difficulty: easy
  description: Import a small Rhythmbox library, search for sahara_dawn, and start
    playback.
  oracle_task: tasks/linux/oracle/spotube_set_market_algeria_oracle.yaml
  oracle_model: linux_oracle_wait
