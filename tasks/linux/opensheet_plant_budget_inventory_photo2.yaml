task_id: linux.opensheet.plant_budget_inventory_photo2
platform: linux
instruction: Create and export a plant budget OpenSheet workbook containing a formatted budget table,
  a second inventory sheet, and specific view settings, saving the final file as plant-budget*.json in
  /home/user/Downloads. The first sheet must display a budget table with headers Item, Planned, Actual,
  and Delta in cells A1 through D1, followed by data rows for Soil (18 planned, 21 actual), Pots (24 planned,
  20 actual), and Seeds (12 planned, 16 actual), where the Delta column in rows 2 through 4 contains the
  formula =C2-B2, =C3-B3, and =C4-B4 respectively. Row 5 must contain the label Total in A5, the formula
  =SUM(B2:B4) in B5, the formula =SUM(C2:C4) in C5, and the formula =C5-B5 in D5. Cell A1 must be bold
  and center-aligned, while cell B2 must use Currency number format with one decimal place. A chart preview
  must be generated from the data, and a note with the text seed costs must be attached to cell A1. The
  Actual column (C1) must have a filter applied for the value 20 and subsequently cleared so that no active
  filters remain. The first sheet’s page layout grid density must be set to Compact, freeze panes must
  be enabled, the view zoom must be set to 125%, and the gridlines display state must be toggled. A second
  sheet must be added to the workbook with headers SKU, Item, Count, and Reorder in A1 through D1, and
  row 2 must contain A-104 in A2, Keyboard in B2, 42 in C2, and 20 in D2. The Audit formulas action must
  be run on the workbook, and the final state must include the exported OpenSheet JSON file matching the
  pattern plant-budget*.json in the /home/user/Downloads directory.
