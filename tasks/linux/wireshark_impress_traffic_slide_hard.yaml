task_id: linux.cross_app.wireshark_impress_traffic_slide_hard
platform: linux
instruction: >
  Open the seeded Wireshark capture /tmp/helloworld_wireshark/retail_mix.pcapng.
  In the display filter bar at the top, type "dns" and press Enter or click
  the Apply button to apply the filter. Count the number of displayed DNS
  packets shown in the packet list.
  Then clear the filter by clicking the Clear button.
  Now type "http" in the filter bar and apply it. Count the number of
  displayed HTTP packets.
  Then clear the filter again.
  Now type "tcp" in the filter bar and apply it. Count the number of
  displayed TCP packets.
  Then switch to the already-open LibreOffice Impress window. Create a new
  presentation. On the first slide, use Insert → Text Box to add a text box
  and type "Network Traffic Summary" as the title. Then add another text box
  below it with the content:
  "DNS Packets: [your count]
  HTTP Packets: [your count]
  TCP Packets: [your count]"
  Save the presentation as /home/user/Documents/traffic_slide.odp.
  Finish after the presentation is saved.
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: |
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_writer/B11B17CA-0B48-4A7E-B567-A2524C24D26F/Bench_Status_Update.docx"
        out = Path("/home/user/Desktop/Bench_Status_Update.docx")
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(urlopen(url).read())
        PY|
