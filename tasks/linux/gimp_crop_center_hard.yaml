task_id: linux.gimp.crop_center
platform: linux
instruction: Open the image at /tmp/helloworld_gimp/input.png in GIMP. First crop
  a centered 1280×720 region from the 1920×1080 image, so the crop box starts at
  x=320 and y=180. Then scale the cropped result to exactly 640×480 pixels, convert
  the image to grayscale, and export the final result to /tmp/helloworld_gimp/cropped.png
  as a PNG file using File → Export As. Stop once the file has been saved.
init:
  initializer_id: initializers.linux.gimp:GimpInitializer
  params:
    app_command: gimp
    workspace: /tmp/helloworld_gimp
    input_image: /tmp/helloworld_gimp/input.png
    image_width: 1920
    image_height: 1080
evaluation:
  evaluator_id: evaluators.linux.gimp:GimpFileEvaluator
  params:
    output_path: /tmp/helloworld_gimp/cropped.png
    expected_width: 640
    expected_height: 480
    expected_mode: L
    expected_format: PNG
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - linux
  - gui
  - image
  - gimp
  - crop
  - hard
  app: GIMP
  description: Crop a large centered region, scale it down, convert it to grayscale,
    and export the result from GIMP.
  oracle_task: tasks/linux/oracle/gimp_crop_center_oracle.yaml
  oracle_model: gimp_oracle
  difficulty: hard
