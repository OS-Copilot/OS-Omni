  The Pay & transfer area must contain two scheduled bill payments. The first payment is to OpenBank Rewards Card - $682.45, funded from Everyday Checking ...2381, for the amount 682.45, scheduled for 2026-06-14, with the memo card pay. The second payment is to City Utilities - $92.35, funded from Everyday Checking ...2381, for the amount 92.35, scheduled for 2026-06-03, with the memo utilities.

  The Transfers area must contain two scheduled transfers. The first transfer is from Everyday Checking ...2381 to Avery Brooks (...6612) for 1450.00, scheduled for 2026-06-02, with the memo rent. The second transfer is from Everyday Checking ...2381 to Maya Patel (...2044) for 125.00, scheduled for 2026-06-04, with the memo tickets.

  The Rainy Day Savings ...9140 account must have its statement for 2026-05 requested and downloaded, and the account delivery preference must be set to paperless.

  The security settings must reflect the Upcoming bill alert marked as read, the Everyday Checking debit card in an unlocked state (having been locked and then unlocked), the Large purchase alert threshold set to 150, and the notification preferences saved.
