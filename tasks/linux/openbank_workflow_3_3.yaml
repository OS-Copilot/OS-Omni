instruction: |-
  Execute the OpenBank banking workflow within the authenticated web session for Jordan Lee, ensuring the session remains signed in and the separate OpenBank desktop application is not used. The completed state must include three specific transaction searches, two scheduled bill payments, two scheduled transfers, a downloaded statement with updated delivery preferences, and modified security settings.

