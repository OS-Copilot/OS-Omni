task_id: linux.blender.pedestal_orbit_study
platform: linux
instruction: |-
  In Blender, build a pedestal orbit study from a fresh General scene and save it to /home/user/Desktop/Blender/00_task_history/blender_pedestal_orbit/pedestal_orbit_study.blend. The scene must contain the default cube renamed PedestalBase, with Scale X 3.20, Scale Y 2.40, Scale Z 0.35, and Location Z 0.35. PedestalBase must have a Bevel modifier with Amount 0.12 and Segments 4, and it must use a new material named PedestalGraphite whose Base Color is dark gray, Metallic is 0.35, and Roughness is 0.48.

  Add a Mesh UV Sphere named HeroSphere with Location Z 1.65 and Scale X, Y, and Z all set to 1.15. HeroSphere must be shaded smooth and assigned a new material named HeroBlue with a blue Base Color, Metallic 0.70, and Roughness 0.26. Add a Mesh Torus named OrbitRing with Location Z 1.65, Rotation X 72 degrees, and Scale X, Y, and Z all set to 1.55. OrbitRing must also be shaded smooth and assigned a new material named OrbitOrange with an orange Base Color, Metallic 0.55, and Roughness 0.30.

  Add an Area light named ProductKeyLight at Location X 4.00, Y -3.00, and Z 6.00, with Power set to 850. Configure the Output properties so Resolution X is 1600, Resolution Y is 1200, File Format is PNG, and the Output path is //renders/pedestal_study/. When the task is complete, the file must be saved as pedestal_orbit_study.blend at the specified path, and HeroSphere must be the selected object in the Outliner.
