task_id: linux.cross_app.quickshop_actual_budget_purchase_record_hard
platform: linux
instruction: >
  In QuickShop, you are already signed in. Search for "Mountain Isle Pour-Over
  Coffee 20 Pack" in the Grocery category. Open the product page, select the
  "20 sachets" option from the dropdown, and add quantity 1 to the cart.
  Go to the cart, verify the item is there, and proceed to checkout.
  In the checkout page, switch the shipping address to "Office" by clicking
  the address selector and choosing Office. Switch the payment method to
  "WeChat Pay" by clicking the payment selector and choosing WeChat Pay.
  Enter the note "Leave it at the front desk" in the note field.
  Submit the order. Note the total amount from the order confirmation.
  Then switch to the already-open Actual Budget window. Create a new local
  budget called "Bench Shopping Budget". In the budget view, create a new
  category named "Shopping" by clicking Add Category and typing "Shopping".
  Then go to the accounts view, select "Bench Checking", and add a new
  transaction. Set the payee to "QuickShop", the category to "Shopping", and
  the amount to the order total from QuickShop. Save the transaction.
  Finish after the transaction is recorded.
