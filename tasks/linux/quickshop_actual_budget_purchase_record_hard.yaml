evaluation:
  evaluator_id: evaluators.linux.command_check:CommandCheckEvaluator
  params:
    timeout: 120
    stdout_contains: "PASS"
    command: |
      set -euo pipefail
      python3 - <<'PY'
      import json
      import os
      import sqlite3
      import urllib.request

      # Check QuickShop order
      BASE_URL = "http://127.0.0.1:4310"
      req = urllib.request.Request(BASE_URL + "/api/orders", method="GET")
      with urllib.request.urlopen(req, timeout=8) as resp:
          orders_payload = json.loads(resp.read().decode("utf-8"))

      orders = list(orders_payload.get("orders") or [])
      if len(orders) != 1:
          raise SystemExit(f"EXPECTED_1_ORDER_GOT_{len(orders)}")

      order = dict(orders[0] or {})
      total = float(order.get("total") or 0)
      if total <= 0:
          raise SystemExit(f"INVALID_ORDER_TOTAL_{total}")

      # Check Actual Budget database
      db_path = os.path.expanduser("~/Actual/budget.sqlite")
      if not os.path.exists(db_path):
          raise SystemExit("ACTUAL_DB_NOT_FOUND")

      conn = sqlite3.connect(db_path)
      cur = conn.cursor()

      # Check for Shopping category
      cur.execute("SELECT name FROM categories WHERE name='Shopping'")
      if not cur.fetchone():
          raise SystemExit("SHOPPING_CATEGORY_NOT_FOUND")

      # Check for transaction with matching amount
      cur.execute("SELECT amount FROM transactions WHERE payee='QuickShop'")
      transactions = cur.fetchall()
      if not transactions:
          raise SystemExit("NO_QUICKSHOP_TRANSACTION")

      # Check if any transaction matches the order total
      found = False
      for (amount,) in transactions:
          if abs(amount - total) < 0.01:
              found = True
              break

      if not found:
          raise SystemExit(f"TRANSACTION_AMOUNT_MISMATCH_{total}")

      conn.close()
      print("PASS")
      PY
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
