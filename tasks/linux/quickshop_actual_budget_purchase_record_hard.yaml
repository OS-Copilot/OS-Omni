                body = resp.read().decode("utf-8")
                return json.loads(body) if body else {}

        while time.time() < DEADLINE:
            try:
                request_json("/api/bootstrap")
                break
            except Exception:
                time.sleep(0.5)
        else:
            raise SystemExit("Timed out waiting for QuickShop app API")

