instruction: |-
  Configure OpenWireshark to process three capture files with specific profile, filter, view, and statistics settings, leaving the application in a cleared filter state with the packet bytes display set to Hex.

  For the storefront_tcp80_checkout.pcapng file, set the active profile to HTTP Checkout. The Checkout HTTP saved filter must be applied with the GET /checkout HTTP/1.1 packet selected and its bytes displayed in the Hex view, while the Follow TCP Stream view for that packet is opened and subsequently closed. The Port 80 saved filter must be applied with the POST /api/cart/confirm packet selected and its bytes displayed in the ASCII view. The statistics panel must display the Conversations view and then the Protocol Hierarchy view, and the Export Specified Packets dialog must be opened and closed. A display filter for http.response must be applied with the HTTP/1.1 200 OK packet selected and its bytes displayed in the Bits view, while the statistics panel switches to the IO Graph view. The string order-ready must be located via the Find feature with navigation back and forward through the search results performed, and the display filter must be cleared. The Initial SYN saved filter must be applied with the 53120 -> 80 [SYN] packet selected, followed by selection of the 80 -> 53120 [SYN, ACK] packet, and the Decode As dialog must be opened and closed. A display filter for tcp.flags.fin == 1 must be applied with the 53120 -> 80 [FIN, ACK] packet selected and its bytes displayed in the Hex view. The Errors and warnings saved filter must be applied, and in the expert information panel, the WARNING - Packet 20 entry must be selected followed by the NOTE - Packet 28 entry. The Expert Information view must be opened, followed by the Coloring Rules view, with the coloring rules dialog closed.

  For the tls_login_retry_0430.pcapng file, the Initial SYN saved filter must be applied with the 53130 -> 443 [SYN] packet selected and its bytes displayed in the ASCII view. The statistics panel must display the Endpoints view and then the Conversations view.

  For the wireless_roam_0429.pcapng file, the IO Graph view must be displayed in the statistics panel. In the capture interface list, wlan0 must be selected followed by any. The capture options must be opened with the capture filter set to tcp port 443, and the capture options window must be closed.

  The packet bytes display must be set to Hex via the View menu with the packet bytes zoomed in. The Display Filter Expression panel must be opened and closed, and the About OpenWireshark dialog must be opened and closed. The display filter must be cleared.
