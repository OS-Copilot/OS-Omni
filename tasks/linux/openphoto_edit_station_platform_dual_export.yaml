task_id: linux.openphoto_edit.station_platform_dual_export
platform: linux
instruction: |-
  Produce two edited JPEG exports in the OpenPhoto Edit application by processing the source images station_platform_wide.jpg and station_train_arrival.jpg from the /home/user/Desktop/attachment folder. The first output, saved as station_platform_wide_edited.jpg, must reflect a wide-angle station platform photograph with an RGB calibration color block in the top-left corner that remains untouched. Its Edit tab settings are Exposure +10, Brightness +6, Contrast +14, Saturation -6, Temperature -6, Sharpen +24, and Grain +10; its Scene tab settings are Structure +26 and HDR +18; and its HSL tab settings are Yellow -14, Green -10, Cyan +8, and Blue +10. Dodge brush marks with a Brush Size of 24 and Brush Strength of 40 must clarify passenger silhouettes in the dark areas beneath the crowd or in the waiting zone. Burn brush marks with a Brush Size of 22 and Brush Strength of 36 must be applied to ceiling glass windows, light boxes, or overexposed electronic screen areas while avoiding the top-left RGB calibration block. Heal brush marks with a Brush Size of 12 and Brush Strength of 42 must remove ground stains, track debris, or edge artifacts. Mosaic brush marks with a Brush Size of 16 and Brush Strength of 56 must obscure train schedule information on platform screens, passenger faces, or identifiable advertisement text.

  The second output, saved as station_train_arrival_edited.jpg, must reflect a close-up photograph of a train arriving at the same platform. Its Edit tab settings are Exposure +8, Contrast +18, Saturation -4, Temperature -8, Sharpen +26, and Vignette +10; its Scene tab settings are Structure +22 and HDR +16; and its HSL tab settings are Yellow -10, Cyan +10, and Blue +12. Dodge brush marks with a Brush Size of 20 and Brush Strength of 38 must be applied to the dark areas of passengers near the train doors or the shadowed side of the train, including a second mark to the darker interior area of the train doors. Burn brush marks must be applied to train lights, platform electronic screens, or overexposed ceiling areas, including a second mark to the high-light areas at the edges of the platform light boxes, ensuring all burn marks are far from the RGB calibration block. Mosaic brush marks with a Brush Size of 14 and Brush Strength of 58 must obscure car numbers, ticket QR codes, passenger faces, or screen time information. Heal brush marks with a Brush Size of 10 and Brush Strength of 40 must remove small stains on the train body, paper scraps on the ground, or track debris. The Filters tab must have the Clean preset selected with a Strength of 46 to maintain a clean documentary feel. Both resulting files must remain in the Downloads folder without being deleted or moved.
