task_id: linux.writer.add_reference_cross_reference
platform: linux
instruction: >-
  Help me adding "Steinberg, F. M., Bearden, M. M., & Keen, C. L. (2003). Cocoa
  and chocolate flavonoids: Implications for cardiovascular health. Journal of
  the American Dietetic Association, 103(2), 215-223. doi: 10.1053/jada.2003.50028"
  to my reference list, and add a cross reference using reference number in the
  fourth paragraph where I marked "<add here>". The document should already be
  open in LibreOffice Writer. When done, save the document so evaluation can
  compare it to the expected result.
init:
  initializer_id: initializers.linux.office_setup:LinuxOfficeSetupInitializer
  params:
    tool_source_dir: platforms/linux/office_tools
    tool_names:
    - libreoffice_writer.py
    - libreoffice_calc.py
    - libreoffice_impress.py
    remote_tool_dir: "~"
    uno_port: 2002
    startup_wait_seconds: 6
    seed_downloads:
    - url: https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_writer/adf5e2c3-64c7-4644-b7b6-d2f0167927e7/Essay_Writing_English_for_uni.docx
      path: /tmp/helloworld_office/writer_adf5e2c3_actual.docx
    - url: https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_writer/adf5e2c3-64c7-4644-b7b6-d2f0167927e7/Essay_Writing_English_for_uni_Gold.docx
      path: /tmp/helloworld_office/writer_adf5e2c3_expected.docx
    open_documents_after_download:
    - /tmp/helloworld_office/writer_adf5e2c3_actual.docx
    open_documents_wait_seconds: 6
evaluation:
  evaluator_id: evaluators.linux.docx_compare:DocxCompareEvaluator
  params:
    actual_path: /tmp/helloworld_office/writer_adf5e2c3_actual.docx
    expected_path: /tmp/helloworld_office/writer_adf5e2c3_expected.docx
    options:
      examine_text: true
      examine_strike_through: false
      examine_alignment: false
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - linux
  - gui
  - libreoffice
  - writer
  - docx
  - reference
  - cross-reference
  - hard
  app: LibreOffice Writer
  difficulty: hard
  description: Add a missing bibliography entry and insert the matching cross-reference into a prepared Writer document.
  oracle_task: tasks/linux/oracle/writer_add_reference_cross_reference_oracle.yaml
  oracle_model: linux_oracle_wait
