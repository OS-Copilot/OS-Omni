task_id: linux.writer.h2o_subscript
platform: linux
instruction: Help me change the 2 in "H2O" to a subscript. The document should already be open in LibreOffice Writer. When done, save the document so evaluation can compare it to the expected result.
init:
  initializer_id: initializers.linux.office_setup:LinuxOfficeSetupInitializer
  params:
    tool_source_dir: platforms/linux/office_tools
    tool_names:
    - libreoffice_writer.py
    - libreoffice_calc.py
    - libreoffice_impress.py
    remote_tool_dir: "~"
    uno_port: 2002
    startup_wait_seconds: 6
    seed_downloads:
    - url: https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_writer/0b17a146-2934-46c7-8727-73ff6b6483e8/H2O_Factsheet_WA.docx
      path: /tmp/helloworld_office/writer_0b17a146_actual.docx
    - url: https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_writer/0b17a146-2934-46c7-8727-73ff6b6483e8/H2O_Factsheet_WA_Gold.docx
      path: /tmp/helloworld_office/writer_0b17a146_expected.docx
    open_documents_after_download:
    - /tmp/helloworld_office/writer_0b17a146_actual.docx
    open_documents_wait_seconds: 6
evaluation:
  evaluator_id: evaluators.linux.docx_compare:DocxCompareEvaluator
  params:
    actual_path: /tmp/helloworld_office/writer_0b17a146_actual.docx
    expected_path: /tmp/helloworld_office/writer_0b17a146_expected.docx
    options:
      examine_text: true
      examine_strike_through: false
      examine_alignment: false
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - linux
  - gui
  - libreoffice
  - writer
  - docx
  - subscript
  - easy
  app: LibreOffice Writer
  difficulty: easy
  description: Open a prepared Writer document, convert the 2 in H2O to subscript, and save the file.
  oracle_task: tasks/linux/oracle/writer_h2o_subscript_oracle.yaml
  oracle_model: linux_oracle_wait
