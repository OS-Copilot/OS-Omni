task_id: linux.thunderbird.thunderbird_unified_inbox
platform: linux
instruction: I've got a bunch of email accounts in Thunderbird, and it's a hassle
  to check them one by one. Please switch Thunderbird to the unified inbox view,
  expand the Smart Folders section if needed, and click into the unified Inbox so
  I can land directly in the combined inbox view next time I open it.
source: https://www.reddit.com/r/Thunderbird/comments/182dg5p/unified_inbox_howto/
osworld_id: 3f49d2cc-f400-4e7d-90cc-9b18e401cc31
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
    - type: download
      url: https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/thunderbird/dd84e895-72fd-4023-a336-97689ded257c/thunderbird-profile.tar.gz
      path: /home/user/thunderbird-profile.tar.gz
    - type: run_command
      command: tar -xzv --recursive-unlink -f /home/user/thunderbird-profile.tar.gz
        -C /home/user/
    - type: launch_app
      command: /usr/bin/thunderbird
evaluation:
  evaluator_id: evaluators.linux.thunderbird:ThunderbirdUnifiedInboxEvaluator
  params:
    profile_dir: /home/user/.thunderbird/t5q2a5hp.default-release
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - email
  - thunderbird
  - hard
  - osworld
  app_name: thunderbird
  source: https://www.reddit.com/r/Thunderbird/comments/182dg5p/unified_inbox_howto/
  osworld_id: 3f49d2cc-f400-4e7d-90cc-9b18e401cc31
  oracle_task: tasks/linux/oracle/thunderbird_unified_inbox_oracle.yaml
  oracle_model: linux_oracle_wait
  difficulty: hard
