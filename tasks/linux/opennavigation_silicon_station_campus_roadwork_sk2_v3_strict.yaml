task_id: linux.opennavigation.silicon_station_campus_roadwork.sk2.v3.strict
platform: linux
instruction: |-
  Create and modify three saved routes and file one incident report within the OpenNavigation application, finishing on the Records page.

  The first saved route, named SiliconRide, must start from the Googleplex location, include Stanford University as a waypoint, and use the Bike travel mode with the Avoid tolls preference enabled. The second available Bike route option must be selected for this route.

  The second saved route, named StationDrive, must be derived from the SiliconRide route by removing the Stanford University waypoint, swapping the origin and destination, and changing the destination to Meta Headquarters. This route must use the Drive travel mode with the Other time departure option selected. The route preferences must have Accessible route enabled.

  The third saved route, named CampusTransit, must start from the Stanford University location, include Mountain View Transit Center as a waypoint, and use the Transit travel mode with the Fewer transfers preference enabled. The first available Transit route option must be selected for this route. After saving, the Mountain View Transit Center waypoint must be removed from this route, the origin and destination must be swapped, and the first available Transit route option must be re-selected while keeping the Transit travel mode.

  An incident report must be filed during an active navigation session for the StationDrive route, which must have the second available Drive route option selected. The incident report must be of the Construction type with the note RoadWork.

  Upon completion, the application must remain logged in as Maya Chen and display the Records page, where the Saved routes and Incident reports sections are visible.
