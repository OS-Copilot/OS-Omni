instruction: Create a new Driver account in the OpenDriver web application using the name DriverA1, the
  email address drivera1@od.io, and the password pass1234. The resulting driver profile must contain the
  license number DRV12345, the vehicle make Toyota, the vehicle model Prius, the vehicle year 2024, the
  license plate OD42, and the vehicle color Blue, saved for review. The account documents area must include
  an Insurance document with the document ID DOC-2026-0001 and an expiration date of 2027-12-31, as well
  as a second document of type Vehicle inspection with the document ID DOC-2026-0002. The Money section
  must reflect a payout request with an amount of 0.00 and a note of Weekly payout. The Support section
  must contain a ticket under the Report rider category with the message Need rider review, with the support
  category subsequently switched to Rider verification and then to Operations support. The final state
  of the application must be logged out, displaying the Driver role and Create account option with no
  logged-in Driver workspace content remaining visible.
