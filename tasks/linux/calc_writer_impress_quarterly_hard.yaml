task_id: linux.cross_app.calc_writer_impress_quarterly_hard
platform: linux
instruction: >
  Open LibreOffice Calc. Create a new spreadsheet with quarterly sales data:
  - Row 1: Headers "Quarter", "Revenue", "Expenses", "Profit"
  - Row 2: Q1, 50000, 30000, (formula: B2-C2)
  - Row 3: Q2, 65000, 35000, (formula: B3-C3)
  - Row 4: Q3, 72000, 38000, (formula: B4-C4)
  - Row 5: Q4, 88000, 42000, (formula: B5-C5)
  In cell A7, type "Total". In cell B7, enter =SUM(B2:B5). In cell C7,
  enter =SUM(C2:C5). In cell D7, enter =SUM(D2:D5).
  Save the spreadsheet as /home/user/Documents/quarterly_sales.ods.
  Then switch to the already-open LibreOffice Writer window. Create a new
  document with the heading "Quarterly Sales Report" and include:
  "Total Revenue: [value from B7]
  Total Expenses: [value from C7]
  Total Profit: [value from D7]
  Best Quarter: [quarter with highest profit]"
  Save the Writer document as /home/user/Documents/sales_report.odt.
  Then switch to the already-open LibreOffice Impress window. Create a new
  presentation. On the first slide, use Insert → Text Box to add a text box
  and type "Quarterly Sales Summary" as the title. Then add another text box
  with the total profit value. Save the presentation as
  /home/user/Documents/sales_presentation.odp.
  Finish after all three files exist.
