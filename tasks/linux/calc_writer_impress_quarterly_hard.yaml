evaluation:
  evaluator_id: evaluators.linux.command_check:CommandCheckEvaluator
  params:
    timeout: 120
    stdout_contains: "PASS"
    command: |
      set -euo pipefail
      python3 - <<'PY'
      import os
      import zipfile

      # Check Calc
      ods_path = os.path.expanduser("~/Documents/quarterly_sales.ods")
      if not os.path.exists(ods_path):
          raise SystemExit("CALC_FILE_NOT_FOUND")

      with zipfile.ZipFile(ods_path, 'r') as z:
          content = z.read('content.xml').decode('utf-8')

      for val in ["Q1", "Q2", "Q3", "Q4", "SUM"]:
          if val not in content:
              raise SystemExit(f"MISSING_VALUE_{val}")

      # Check Writer
      odt_path = os.path.expanduser("~/Documents/sales_report.odt")
      if not os.path.exists(odt_path):
          raise SystemExit("WRITER_FILE_NOT_FOUND")

      with zipfile.ZipFile(odt_path, 'r') as z:
          content = z.read('content.xml').decode('utf-8')

      for val in ["Quarterly Sales Report", "Total Revenue", "Total Expenses", "Total Profit", "Best Quarter"]:
          if val not in content:
              raise SystemExit(f"MISSING_VALUE_{val}")

      # Check Impress
      odp_path = os.path.expanduser("~/Documents/sales_presentation.odp")
      if not os.path.exists(odp_path):
          raise SystemExit("IMPRESS_FILE_NOT_FOUND")

      with zipfile.ZipFile(odp_path, 'r') as z:
          content = z.read('content.xml').decode('utf-8')

      if "Quarterly Sales Summary" not in content:
          raise SystemExit("MISSING_SLIDE_TITLE")

      print("PASS")
      PY
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - linux
  - cross_app
  - calc
  - writer
  - impress
  - spreadsheet
  - formula
  - three_app
  - hard
  app_name: libreoffice_calc + libreoffice_writer + libreoffice_impress
  difficulty: hard
  description: Create a quarterly sales spreadsheet in Calc with formulas, generate
    a sales report in Writer with totals and analysis, then create a summary
    presentation in Impress.
