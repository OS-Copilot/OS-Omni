task_id: linux.actual_budget.create_checking_account_easy
platform: linux
instruction: >
  Actual Budget is already open. If no budget file is open yet, create a new
  local budget called "Bench Starter Budget" in the default documents
  location. Then create a new bank account named "Bench Checking" with an
  opening balance of $5,000 and leave that account visible when you finish.
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
      - type: run_bash
        script: |
          python3 - <<'PY'
          import os
          import signal
          import time

          targets = {"Actual", "actualbudget", "AppRun", "chrome_crashpad_handler"}
          for _ in range(2):
              killed = False
              for pid_text in os.listdir("/proc"):
                  if not pid_text.isdigit():
                      continue
                  try:
                      comm = open(f"/proc/{pid_text}/comm", "r", encoding="utf-8").read().strip()
                  except OSError:
                      continue
                  if comm in targets:
                      try:
                          os.kill(int(pid_text), signal.SIGTERM)
                          killed = True
                      except OSError:
                          pass
              if not killed:
                  break
              time.sleep(1)
          PY
          rm -rf /home/user/.config/Actual /home/user/Documents/Actual /home/user/.cache/Actual
          mkdir -p /home/user/Documents
        timeout: 120
      - type: run_bash
        script: |
          export DISPLAY=:0
          export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority}
          export XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-/run/user/$(id -u)}
          export DBUS_SESSION_BUS_ADDRESS=${DBUS_SESSION_BUS_ADDRESS:-unix:path=${XDG_RUNTIME_DIR}/bus}
          if [ ! -x /home/user/.local/bin/actualbudget ]; then
            echo "Actual Budget is not installed in the Linux VM." >&2
            exit 1
          fi
          setsid -f /home/user/.local/bin/actualbudget >/tmp/actualbudget.log 2>&1
        timeout: 120
      - type: wait
        ms: 10000
evaluation:
  evaluator_id: evaluators.linux.actual_budget:ActualBudgetEvaluator
  params:
    mode: create_account
    account_name: Bench Checking
    opening_balance: 5000
    state_root: /home/user/.config/Actual
    document_root: /home/user/Documents/Actual
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [linux, actual_budget, finance, accounting, easy]
  app_name: actual-budget
  difficulty: easy
  description: Create a fresh local Actual budget and add one checking account with an opening balance.
  oracle_task: tasks/linux/oracle/actual_budget_create_checking_account_easy_oracle.yaml
  oracle_model: linux_oracle_wait
