task_id: linux.cross_app.drawio_impress_diagram_slide_hard
platform: linux
instruction: >
  Open draw.io. Create a new diagram. From the shape panel on the left side,
  drag a rectangle shape onto the canvas. Double-click the shape to edit its
  text and type "Start".
  Drag another rectangle onto the canvas below the first one. Double-click
  and type "Process".
  Drag a third rectangle onto the canvas below the second one. Double-click
  and type "End".
  To connect the shapes, hover over the bottom edge of "Start" until you see
  a connection point (small blue circle). Click and hold on that point, then
  drag to the top edge of "Process" and release to create an arrow.
  Repeat to connect "Process" to "End" by dragging from Process's bottom
  connection point to End's top connection point.
  Save the diagram as /home/user/Documents/workflow.drawio.
  Then use File → Export as PNG to export the diagram. In the export dialog,
  uncheck "Selection only" and click Export. Save to
  /home/user/Documents/workflow.png.
  Then switch to the already-open LibreOffice Impress window. Create a new
  presentation. On the first slide, use Insert → Image to insert the exported
  image /home/user/Documents/workflow.png. In the insert dialog, navigate to
  /home/user/Documents/, select workflow.png, and click Open.
  Save the presentation as /home/user/Documents/workflow_presentation.odp.
  Finish after the presentation is saved.
