evaluation:
  evaluator_id: evaluators.linux.command_check:CommandCheckEvaluator
  params:
    timeout: 120
    stdout_contains: "PASS"
    command: |
      set -euo pipefail
      python3 - <<'PY'
      import os
      import zipfile

      # Check draw.io file
      drawio_path = os.path.expanduser("~/Documents/workflow.drawio")
      if not os.path.exists(drawio_path):
          raise SystemExit("DRAWIO_FILE_NOT_FOUND")

      # Verify diagram contains expected shapes
      with open(drawio_path, 'r') as f:
          content = f.read()
      if "Start" not in content:
          raise SystemExit("MISSING_START_SHAPE")
      if "Process" not in content:
          raise SystemExit("MISSING_PROCESS_SHAPE")
      if "End" not in content:
          raise SystemExit("MISSING_END_SHAPE")

      # Check exported PNG
      png_path = os.path.expanduser("~/Documents/workflow.png")
      if not os.path.exists(png_path):
          raise SystemExit("PNG_FILE_NOT_FOUND")

      # Check Impress presentation
      odp_path = os.path.expanduser("~/Documents/workflow_presentation.odp")
      if not os.path.exists(odp_path):
          raise SystemExit("IMPRESS_FILE_NOT_FOUND")

      # Parse ODP to verify content
      with zipfile.ZipFile(odp_path, 'r') as z:
          content = z.read('content.xml').decode('utf-8')

      # Check for any embedded image (LibreOffice uses Pictures/ directory)
      if "Pictures/" not in content and ".png" not in content:
          raise SystemExit("MISSING_IMAGE_REFERENCE")

      print("PASS")
      PY
limits:
  max_steps: 100
  step_timeout_seconds: 120
