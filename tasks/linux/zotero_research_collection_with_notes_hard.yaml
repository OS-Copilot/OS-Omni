task_id: linux.zotero.research_collection_with_notes
platform: linux
instruction: >
  Open Zotero and use /home/user/Documents/zotero_research_request.txt as the
  intake list. Create exactly the five requested collections under My Library.
  In each collection, add the requested manual item, author, tag, and child note:
  "Research" gets the Book "Deep Learning" by "Ian Goodfellow" with tag
  "textbook" and note "Foundational text on deep learning"; "Methods Queue"
  gets the Journal Article "Attention Is All You Need" by "Ashish Vaswani" with
  tag "transformers" and note "Prioritize for architecture review"; "Benchmark
  Queue" gets the Report "HELM" by "Percy Liang" with tag "benchmarking" and
  note "Use scenario taxonomy"; "Agent Systems" gets the Report "Toolformer" by
  "Timo Schick" with tag "tool-use" and note "Use tool-call comparison"; "Long
  Context Queue" gets the Journal Article "Longformer" by "Iz Beltagy" with tag
  "long-context" and note "Use sparse attention baseline". After the library is
  built, create /home/user/Documents/zotero_research_handoff.tsv with exactly
  these six tab-separated lines: collection, title, owner, then Research, Deep
  Learning, research-ops; Methods Queue, Attention Is All You Need, research-ops;
  Benchmark Queue, HELM, research-ops; Agent Systems, Toolformer, research-ops;
  Long Context Queue, Longformer, research-ops. Also create
  /home/user/Documents/zotero_research_review_note.txt with exactly these four
  lines: request=zotero_research_request.txt, collections=5, items=5,
  status=ready-for-review.
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: |
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_writer/B11B17CA-0B48-4A7E-B567-A2524C24D26F/Bench_Status_Update.docx"
        out = Path("/home/user/Desktop/Bench_Status_Update.docx")
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(urlopen(url).read())
        PY|
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/wireshark/C9CCC440-B4EE-407E-B53D-B389ED564F8E/retail_mix.pcapng"
        out = Path("/tmp/helloworld_wireshark/retail_mix.pcapng")
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(urlopen(url).read())
        PY|
        set -e
        export HOME=/home/user
        export PATH="$HOME/.local/bin:$PATH"
        mkdir -p "$HOME/Applications" "$HOME/.local/share/applications" "$HOME/.local/bin" "$HOME/Downloads" "$HOME/Documents"
        pkill -x zotero >/dev/null 2>&1 || true
        archive="$HOME/Downloads/Zotero-9.0.1_linux-x86_64.tar.xz"
        if [ ! -x "$HOME/Applications/Zotero_linux-x86_64/zotero" ]; then
          if [ ! -f "$archive" ]; then
            python3 -c 'from pathlib import Path; from urllib.request import urlopen; url = "https://download.zotero.org/client/release/9.0.1/Zotero-9.0.1_linux-x86_64.tar.xz"; out = Path("/home/user/Downloads/Zotero-9.0.1_linux-x86_64.tar.xz"); out.write_bytes(urlopen(url).read())'
          fi
          rm -rf "$HOME/Applications/Zotero_linux-x86_64"
          tar -xf "$archive" -C "$HOME/Applications"
          (
            cd "$HOME/Applications/Zotero_linux-x86_64"
            ./set_launcher_icon
          )
          ln -sf "$HOME/Applications/Zotero_linux-x86_64/zotero.desktop" "$HOME/.local/share/applications/zotero.desktop"
          ln -sf "$HOME/Applications/Zotero_linux-x86_64/zotero" "$HOME/.local/bin/zotero"
        fi
        rm -rf "$HOME/Zotero" "$HOME/.zotero"
        rm -f "$HOME/Documents"/zotero_research_*.txt "$HOME/Documents"/zotero_research_*.tsv "$HOME/Documents"/zotero_research_*.csv
        cat > "$HOME/Documents/zotero_research_request.txt" <<'EOF'
        collection	title	type	author	tag	note
        Research	Deep Learning	Book	Ian Goodfellow	textbook	Foundational text on deep learning
        Methods Queue	Attention Is All You Need	Journal Article	Ashish Vaswani	transformers	Prioritize for architecture review
        Benchmark Queue	HELM	Report	Percy Liang	benchmarking	Use scenario taxonomy
        Agent Systems	Toolformer	Report	Timo Schick	tool-use	Use tool-call comparison
        Long Context Queue	Longformer	Journal Article	Iz Beltagy	long-context	Use sparse attention baseline
        EOF
    - type: launch_app
      command: /home/user/Applications/Zotero_linux-x86_64/zotero
    - type: wait
      ms: 12000
    - type: run_bash
      script: |
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_writer/B11B17CA-0B48-4A7E-B567-A2524C24D26F/Bench_Status_Update.docx"
        out = Path("/home/user/Desktop/Bench_Status_Update.docx")
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(urlopen(url).read())
        PY|
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/wireshark/C9CCC440-B4EE-407E-B53D-B389ED564F8E/retail_mix.pcapng"
        out = Path("/tmp/helloworld_wireshark/retail_mix.pcapng")
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(urlopen(url).read())
        PY|
        export DISPLAY=${DISPLAY:-:0}
        wmctrl -a Zotero 2>/dev/null || true
        wmctrl -r Zotero -b remove,maximized_vert,maximized_horz 2>/dev/null || true
        wmctrl -r Zotero -e 0,80,80,1320,860 2>/dev/null || true
    - type: wait
      ms: 1000
evaluation:
  evaluator_id: evaluators.linux.zotero:ZoteroLibraryEvaluator
  params:
    db_path: /home/user/Zotero/zotero.sqlite
    required_collections:
    - Research
    - Methods Queue
    - Benchmark Queue
    - Agent Systems
    - Long Context Queue
    required_items:
    - title: Deep Learning
      item_type: book
      collections:
      - Research
      creators:
      - Ian Goodfellow
      tags:
      - textbook
      note_contains:
      - Foundational text on deep learning
    - title: Attention Is All You Need
      item_type: journalArticle
      collections:
      - Methods Queue
      creators:
      - Ashish Vaswani
      tags:
      - transformers
      note_contains:
      - Prioritize for architecture review
    - title: HELM
      item_type: report
      collections:
      - Benchmark Queue
      creators:
      - Percy Liang
      tags:
      - benchmarking
      note_contains:
      - Use scenario taxonomy
    - title: Toolformer
      item_type: report
      collections:
      - Agent Systems
      creators:
      - Timo Schick
      tags:
      - tool-use
      note_contains:
      - Use tool-call comparison
    - title: Longformer
      item_type: journalArticle
      collections:
      - Long Context Queue
      creators:
      - Iz Beltagy
      tags:
      - long-context
      note_contains:
      - Use sparse attention baseline
    text_artifacts:
    - path: /home/user/Documents/zotero_research_handoff.tsv
      equals: |
        collection	title	owner
        Research	Deep Learning	research-ops
        Methods Queue	Attention Is All You Need	research-ops
        Benchmark Queue	HELM	research-ops
        Agent Systems	Toolformer	research-ops
        Long Context Queue	Longformer	research-ops
    - path: /home/user/Documents/zotero_research_review_note.txt
      equals: |
        request=zotero_research_request.txt
        collections=5
        items=5
        status=ready-for-review
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - linux
  - gui
  - zotero
  - cross_file
  - collection
  - tag
  - note
  - hard
  app_name: zotero
  description: Build five Zotero research collections from a seeded request file
    with manual books/articles/reports, tags, child notes, and two exact handoff files.
  oracle_task: tasks/linux/oracle/zotero_research_collection_with_notes_oracle.yaml
  oracle_model: linux_oracle_wait
  difficulty: hard
