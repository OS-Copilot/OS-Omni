task_id: linux.cross_app.drawio_writer_flowchart_hard
platform: linux
instruction: >
  Open draw.io. Create a new diagram. From the shape panel on the left side,
  drag a diamond shape onto the canvas. Double-click the shape to edit its
  text and type "Decision".
  Drag a rectangle shape onto the canvas below the diamond. Double-click
  and type "Action A".
  Drag another rectangle onto the canvas to the right of the diamond.
  Double-click and type "Action B".
  Connect the diamond to "Action A" by dragging from the diamond's bottom
  connection point to Action A's top connection point.
  Connect the diamond to "Action B" by dragging from the diamond's right
  connection point to Action B's left connection point.
  Save the diagram as /home/user/Documents/flowchart.drawio.
  Then switch to the already-open LibreOffice Writer window. Create a new
  document with the heading "Flowchart Description" and include:
  "Diagram: flowchart.drawio
  Shapes: Diamond (Decision), Rectangle (Action A), Rectangle (Action B)
  Connections: Decision to Action A, Decision to Action B"
  Save the Writer document as /home/user/Documents/flowchart_report.odt.
  Finish after both files exist.
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: |
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_writer/B11B17CA-0B48-4A7E-B567-A2524C24D26F/Bench_Status_Update.docx"
        out = Path("/home/user/Desktop/Bench_Status_Update.docx")
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(urlopen(url).read())
        PY|
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/wireshark/C9CCC440-B4EE-407E-B53D-B389ED564F8E/retail_mix.pcapng"
        out = Path("/tmp/helloworld_wireshark/retail_mix.pcapng")
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(urlopen(url).read())
        PY|
        pkill -f drawio || true
        pkill -f soffice.bin || true
        mkdir -p /home/user/Documents
    - type: wait
      ms: 1200
    - type: run_bash
      script: |
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_writer/B11B17CA-0B48-4A7E-B567-A2524C24D26F/Bench_Status_Update.docx"
        out = Path("/home/user/Desktop/Bench_Status_Update.docx")
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(urlopen(url).read())
        PY|
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/wireshark/C9CCC440-B4EE-407E-B53D-B389ED564F8E/retail_mix.pcapng"
        out = Path("/tmp/helloworld_wireshark/retail_mix.pcapng")
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(urlopen(url).read())
        PY|
        export DISPLAY=:0
        setsid -f drawio >/dev/null 2>&1
    - type: wait
      ms: 8000
    - type: run_bash
      script: |
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_writer/B11B17CA-0B48-4A7E-B567-A2524C24D26F/Bench_Status_Update.docx"
        out = Path("/home/user/Desktop/Bench_Status_Update.docx")
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(urlopen(url).read())
        PY|
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/wireshark/C9CCC440-B4EE-407E-B53D-B389ED564F8E/retail_mix.pcapng"
        out = Path("/tmp/helloworld_wireshark/retail_mix.pcapng")
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(urlopen(url).read())
        PY|
        export DISPLAY=:0
        setsid -f libreoffice --writer >/dev/null 2>&1
    - type: wait
      ms: 5000
evaluation:
  evaluator_id: evaluators.linux.command_check:CommandCheckEvaluator
  params:
    timeout: 120
    stdout_contains: "PASS"
    command: |
      set -euo pipefail
      python3 - <<'PY'
      import os
      import zipfile

      drawio_path = os.path.expanduser("~/Documents/flowchart.drawio")
      if not os.path.exists(drawio_path):
          raise SystemExit("DRAWIO_FILE_NOT_FOUND")

      with open(drawio_path, 'r') as f:
          content = f.read()
      if "Decision" not in content:
          raise SystemExit("MISSING_DECISION_SHAPE")
      if "Action A" not in content:
          raise SystemExit("MISSING_ACTION_A_SHAPE")
      if "Action B" not in content:
          raise SystemExit("MISSING_ACTION_B_SHAPE")

      odt_path = os.path.expanduser("~/Documents/flowchart_report.odt")
      if not os.path.exists(odt_path):
          raise SystemExit("WRITER_FILE_NOT_FOUND")

      with zipfile.ZipFile(odt_path, 'r') as z:
          content = z.read('content.xml').decode('utf-8')

      if "Flowchart Description" not in content:
          raise SystemExit("MISSING_HEADING")

      print("PASS")
      PY
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - linux
  - cross_app
  - drawio
  - writer
  - flowchart
  - shapes
  - hard
  app_name: drawio + libreoffice_writer
  difficulty: hard
  description: Create a flowchart in draw.io with a diamond and two rectangles
    connected via connection points, then create a description report in Writer.
