platform: linux
instruction: |-
  Produce two edited images in the OpenPhotoEdit web application, saved as sunset_beach_wide_edited.jpg and sunset_beach_close_edited.jpg, derived from the source files sunset_beach_wide.jpg and sunset_beach_close.jpg located in the /home/user/Desktop/attachment folder.

  The first output, sunset_beach_wide_edited.jpg, is a wide shot of a sunset beach featuring RGB calibration color blocks in the top-right corner. Its global adjustments in the Edit panel must be set to Exposure +8, Brightness +6, Contrast +18, Saturation +28, Temperature +18, Sharpen +16, and Vignette +14. The HSL panel settings for this image are Red +22, Orange +26, Yellow +14, Cyan -8, and Blue +10. The Scene panel settings are Sky +24, Warm Sun +30, and HDR +12. Local adjustments include a Dodge brush application with Size 26 and Strength 42 to the darker reflection areas on the sea surface to simulate brightened sunset reflections, a Burn brush application with Size 22 and Strength 38 to the overexposed edges of the clouds in the sky while ensuring the RGB calibration color blocks in the top-right corner are not touched, and a Heal brush application with Size 12 and Strength 45 to small specks or footprints on the beach.

  The second output, sunset_beach_close_edited.jpg, is a close-up shot of the same beach. Its global adjustments in the Edit panel must be set to Exposure +12, Contrast +12, Saturation +20, Temperature +14, and Sharpen +22. The HSL panel settings for this image are Orange +20, Yellow +18, and Blue +8. The Filters panel must have the Sunset preset applied with a Strength of 58. The Scene panel settings are Warm Sun 22, HDR 10, and Structure 14. Local adjustments include a Dodge brush application with Size 20 and Strength 40 to the wave foam and wet sand reflection areas, a Burn brush application to the overexposed beach areas at the edges of the frame while avoiding the RGB calibration color blocks, a Heal brush application with Size 10 to small trash, black dots, or extra footprints on the beach, a Mosaic brush application with Size 12 and Strength 48 to the faces of distant people or recognizable signs, a second Dodge brush mark with Size 16 to the dark areas at the edges of the waves, and a second Burn brush mark to the overexposed sand area on the right side of the frame ensuring it is far from the RGB calibration color blocks.
