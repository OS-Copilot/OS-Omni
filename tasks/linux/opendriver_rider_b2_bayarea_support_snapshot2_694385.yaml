platform: linux
instruction: |-
  Create a new Rider account on the OpenDriver application using the name RiderB2, the email riderb2@od.io, and the password pass1234. Configure a ride request with the pickup location set to University Avenue, Palo Alto, CA and the destination set to Googleplex, Mountain View, CA, including two intermediate stops where Stop 1 is Stanford University, Stanford, CA and Stop 2 is Castro Street, Mountain View, CA. Select the Green ride option, apply the promo code COMMUTE15, and submit the ride request by choosing Green. Confirm the pickup once the driver has arrived and view the receipt for the completed trip in the History section.

  Create two support tickets in the Safety section: the first ticket must have the category lost item and the message Lost blue bag, and the second ticket must have the category other and the message Need app help. Reply to the Lost blue bag ticket with the text Bag last seen near Stanford and send the reply, then close the ticket view. Reply to the Need app help ticket with the text Account navigation reviewed and send the reply, then close the ticket view.

  Edit the profile in the Account section by entering the phone number 6505550132 and saving the changes. Add a new payment card to the Wallet section with the brand Mastercard, the last four digits 7788, and the label Travel Mastercard, then set the Travel Mastercard as the default payment method and collapse the Wallet section. Mark the first unread notification as read in the Notifications section and collapse the section. Expand the Coupons section to display the list of available coupons.
