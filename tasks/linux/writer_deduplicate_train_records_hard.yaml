task_id: linux.writer.deduplicate_train_records
platform: linux
instruction: >-
  A certain railway company in Hong Kong uses a signaling system to keep track
  of trains in its railway system. Each line in the document represents a train
  calling at a station from 06:00 to 12:00 on 2022-09-22, and has the format
  time_HH:MM:SS, train_id, station_id, platform_no. Remove the duplicated train
  IDs so the document keeps only one line per train. The document should
  already be open in LibreOffice Writer. When done, save the document so
  evaluation can compare it to the expected result.
init:
  initializer_id: initializers.linux.office_setup:LinuxOfficeSetupInitializer
  params:
    tool_source_dir: platforms/linux/office_tools
    tool_names:
    - libreoffice_writer.py
    - libreoffice_calc.py
    - libreoffice_impress.py
    remote_tool_dir: "~"
    uno_port: 2002
    startup_wait_seconds: 6
    seed_downloads:
    - url: https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_writer/6f81754e-285d-4ce0-b59e-af7edb02d108/HK_train_record.docx
      path: /tmp/helloworld_office/writer_6f81754e_actual.docx
    - url: https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_writer/6f81754e-285d-4ce0-b59e-af7edb02d108/HK_train_record_Gold.docx
      path: /tmp/helloworld_office/writer_6f81754e_expected.docx
    open_documents_after_download:
    - /tmp/helloworld_office/writer_6f81754e_actual.docx
    open_documents_wait_seconds: 6
evaluation:
  evaluator_id: evaluators.linux.docx_compare:DocxCompareEvaluator
  params:
    actual_path: /tmp/helloworld_office/writer_6f81754e_actual.docx
    expected_path: /tmp/helloworld_office/writer_6f81754e_expected.docx
    options:
      examine_text: true
      examine_strike_through: false
      examine_alignment: false
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - linux
  - gui
  - libreoffice
  - writer
  - docx
  - deduplication
  - data-cleanup
  - hard
  app: LibreOffice Writer
  difficulty: hard
  description: Remove duplicate train-record lines so only one row remains for each train ID in a prepared Writer document.
  oracle_task: tasks/linux/oracle/writer_deduplicate_train_records_oracle.yaml
  oracle_model: linux_oracle_wait
