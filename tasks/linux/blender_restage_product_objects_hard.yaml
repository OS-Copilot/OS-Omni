task_id: linux.blender.restage_product_objects
platform: linux
instruction: >
  In Blender, restage the prepared product scene using the client layout note
  at /tmp/helloworld_blender_workspace/blender_restage_product/restage_client_spec.txt.
  Set the scene to EEVEE, transparent PNG RGBA output, 1440 by 1080 at 100%,
  24 FPS, frames 1 to 144, 72 EEVEE render samples, and output path
  //renders/restage_client_review.png. Move Camera to X 7.2, Y -6.8, Z 5.6
  with rotation X 60, Y 0, Z 46. Move FillLight to X 1.2, Y -3.4, Z 6.6
  with rotation X 50, Y 0, Z 35 and scale 1.2 on all axes. Put FeatureCube in
  the hero shelf position at X 1.65, Y -0.7, Z 1.35 with rotation X 0, Y 10,
  Z -18, scale X 1.35, Y 0.85, Z 1.70, and diffuse color RGBA 0.78, 0.22,
  0.14, 1.0. Put AccentCylinder at X -1.85, Y 0.95, Z 0.85 with rotation
  X 0, Y 0, Z 16, scale X 0.55, Y 0.55, Z 1.70, and diffuse color RGBA
  0.12, 0.52, 0.70, 1.0. Put HeroSphere at X 2.45, Y 1.65, Z 1.05 with
  scale X 0.90, Y 0.90, Z 0.90 and diffuse color RGBA 0.96, 0.78, 0.22,
  1.0. Set BackdropPlane to X 0, Y 0, Z -0.05, rotation X 0, Y 0, Z 5,
  scale X 6.0, Y 4.6, Z 1.0, and diffuse color RGBA 0.04, 0.05, 0.06,
  1.0. Add a cylinder named ScaleMarker at X 0.15, Y -2.15, Z 0.55 with
  rotation X 0, Y 0, Z 28, scale X 0.24, Y 0.24, Z 0.95, and diffuse color
  RGBA 0.22, 0.86, 0.38, 1.0. Add a plane named LabelStrip at X -1.10,
  Y 2.65, Z 0.05 with rotation X 0, Y 0, Z -10, scale X 2.0, Y 0.18,
  Z 1.0, and diffuse color RGBA 0.18, 0.62, 0.88, 1.0. Save the scene, then
  create /tmp/helloworld_blender_workspace/blender_restage_product/restage_delivery_manifest.tsv
  with exactly these five tab-separated lines: file\trole\tnotes,
  product_stage.blend\tprimary\tclient shelf layout,
  ScaleMarker\tscale reference\tkeep visible,
  LabelStrip\tlabel zone\treserved for copy,
  status\tready\treview handoff.
init:
  initializer_id: initializers.linux.blender:BlenderInitializer
  params:
    app_command: blender
    workspace_name: blender_restage_product
    scene_name: product_stage.blend
    scene_template: product_stage
    text_artifacts:
      - path: /tmp/helloworld_blender_workspace/blender_restage_product/restage_client_spec.txt
        content: |
          Client note: create a cleaner shelf layout for the next review.
          Keep one visible scale marker and one copy-safe label strip.
          Deliverable: save the scene and leave a manifest for the producer.
evaluation:
  evaluator_id: evaluators.linux.blender:BlenderSceneEvaluator
  params:
    blend_path: /tmp/helloworld_blender_workspace/blender_restage_product/product_stage.blend
    render:
      engine: BLENDER_EEVEE
      resolution_x: 1440
      resolution_y: 1080
      resolution_percentage: 100
      fps: 24
      frame_start: 1
      frame_end: 144
      filepath: //renders/restage_client_review.png
      file_format: PNG
      color_mode: RGBA
      film_transparent: true
      eevee_taa_render_samples: 72
    objects:
      - name: Camera
        location: [7.2, -6.8, 5.6]
        rotation_degrees: [60.0, 0.0, 46.0]
      - name: FillLight
        location: [1.2, -3.4, 6.6]
        rotation_degrees: [50.0, 0.0, 35.0]
        scale: [1.2, 1.2, 1.2]
      - name: FeatureCube
        location: [1.65, -0.7, 1.35]
        rotation_degrees: [0.0, 10.0, -18.0]
        scale: [1.35, 0.85, 1.7]
        material_diffuse_color: [0.78, 0.22, 0.14, 1.0]
      - name: AccentCylinder
        location: [-1.85, 0.95, 0.85]
        rotation_degrees: [0.0, 0.0, 16.0]
        scale: [0.55, 0.55, 1.7]
        material_diffuse_color: [0.12, 0.52, 0.7, 1.0]
      - name: HeroSphere
        location: [2.45, 1.65, 1.05]
        scale: [0.9, 0.9, 0.9]
        material_diffuse_color: [0.96, 0.78, 0.22, 1.0]
      - name: BackdropPlane
        location: [0.0, 0.0, -0.05]
        rotation_degrees: [0.0, 0.0, 5.0]
        scale: [6.0, 4.6, 1.0]
        material_diffuse_color: [0.04, 0.05, 0.06, 1.0]
      - name: ScaleMarker
        type: MESH
        location: [0.15, -2.15, 0.55]
        rotation_degrees: [0.0, 0.0, 28.0]
        scale: [0.24, 0.24, 0.95]
        material_diffuse_color: [0.22, 0.86, 0.38, 1.0]
      - name: LabelStrip
        type: MESH
        location: [-1.1, 2.65, 0.05]
        rotation_degrees: [0.0, 0.0, -10.0]
        scale: [2.0, 0.18, 1.0]
        material_diffuse_color: [0.18, 0.62, 0.88, 1.0]
    text_artifacts:
      - path: /tmp/helloworld_blender_workspace/blender_restage_product/restage_delivery_manifest.tsv
        equals: |
          file	role	notes
          product_stage.blend	primary	client shelf layout
          ScaleMarker	scale reference	keep visible
          LabelStrip	label zone	reserved for copy
          status	ready	review handoff
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
    - linux
    - gui
    - blender
    - transform
    - hard
  app: Blender
  difficulty: hard
  description: Restage a product scene from a client note, save the updated Blender file, and write a compact delivery manifest.
  oracle_task: tasks/linux/oracle/blender_restage_product_objects_oracle.yaml
  oracle_model: linux_oracle_wait
