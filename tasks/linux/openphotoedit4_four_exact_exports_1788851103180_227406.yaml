instruction: Export four edited images from OpenPhotoEdit, each derived from a specific source file in
  /home/user/Pictures/ and saved with a designated filename. The first export, pe4_bluegreen_guitar-edited.png,
  is created from pe4_bluegreen_guitar.png, which depicts a musician in dark clothing playing a blue-green
  wood-grain electric guitar with visible strings and pickups, and must include a Structure slider set
  to 17, an HDR slider set to 9, and a Cool Tone slider set to 6 in the Scene panel; a Cyan slider set
  to -9 and a Blue slider set to -6 in the HSL panel; a Brightness slider set to 7, a Contrast slider
  set to 9, and a Sharpen slider set to 13 in the Edit panel; and the Clean preset selected with a Strength
  slider set to 31 in the Filters panel. The second export, pe4_studio_white_outfit-edited.png, is created
  from pe4_studio_white_outfit.png, which shows a woman with long brown hair facing the camera in a white
  outfit against a gray studio background, and must include a Smooth slider set to 7, a Whiten slider
  set to 5, a Rosy slider set to 4, a Bright Eyes slider set to 6, and a Background Blur slider set to
  5 in the Portrait panel; a Temperature slider set to -3, an Exposure slider set to 3, and a Sharpen
  slider set to 6 in the Edit panel; and the Portrait preset selected with a Strength slider set to 20
  in the Filters panel. The third export, pe4_darkwindow_bearded_man-edited.png, is created from pe4_darkwindow_bearded_man.png,
  which features a bearded man in dark clothing looking out a window while holding a dark wooden guitar,
  and must include the Film preset selected with a Strength slider set to 40 in the Filters panel; an
  Exposure slider set to 9, a Brightness slider set to 4, a Contrast slider set to -5, a Fade slider set
  to 7, a Grain slider set to 9, and a Vignette slider set to 13 in the Edit panel; an Orange slider set
  to 5 and a Yellow slider set to -6 in the HSL panel; and a Background Blur slider set to 5, a Bright
  Eyes slider set to 4, and a Smooth slider set to 3 in the Portrait panel. The fourth export, pe4_brightwindow_gray_sweater-edited.png,
  is created from pe4_brightwindow_gray_sweater.png, which shows a short-haired man in a gray knit sweater
  holding a light wood guitar and looking at the camera near a bright white window, and must include a
  Saturation slider set to 5, a Temperature slider set to -4, a Contrast slider set to 4, and a Sharpen
  slider set to 10 in the Edit panel; a Smooth slider set to 4, a Bright Eyes slider set to 5, and a Background
  Blur slider set to 4 in the Portrait panel; and the Clean preset selected with a Strength slider set
  to 23 in the Filters panel. The application must remain on the editing page for the pe4_brightwindow_gray_sweater.png
  image upon completion.
