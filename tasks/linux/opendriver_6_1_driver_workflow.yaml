instruction: Log in to the OpenDriver application using the Driver role with the email address driver@example.com
  and the password Password123! to generate a new ride request in the Work section and accept the available
  trip for Riley Rider, ensuring the ride is assigned to the primary driver account and reaches the driver
  arriving status with the appropriate timeline entry recorded. In the Money section, view the receipt
  for the trip to Downtown Palo Alto, CA and rate the rider four stars with the comment Safe pickup; view
  the receipt for the trip to Stanford University, Stanford, CA and rate the rider five stars with the
  comment Clean handoff; view the receipt for the trip to Equinox Palo Alto and rate the rider four stars
  with the comment Good route; view the receipt for the trip from Downtown Palo Alto, CA to Stanford University
  and rate the rider five stars with the comment Quick pickup; and view the receipt for the trip to Airport
  and rate the rider four stars with the comment Smooth close. In the Work section, open the active trip
  and interact with the passenger card for Riley Rider to zoom in, zoom out, and recenter the map. In
  the Money section, interact with the amount and status badge of the current driver arriving trip, view
  the receipt for the first rated completed trip, and refresh the page to ensure all data is current.
