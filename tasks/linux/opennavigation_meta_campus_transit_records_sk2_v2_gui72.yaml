platform: linux
instruction: |-
  Create and save three distinct routes in the OpenNavigation application, then submit an incident report for one of them, leaving the application on the Records page.

  The first route, a driving route named "MetaCommute", must have Meta Headquarters as the destination and Googleplex as a waypoint. Its departure time must be set to "Leave now", and the route preferences must have "Avoid highways" checked. The second route, a walking route named "CampusWalk", must have Stanford University as the destination and Mountain View Transit Center as a waypoint. Its departure time must be set to "Other time", and the route preferences must have "Accessible route" checked. The third route, a transit route named "TransitLink", must have Mountain View Transit Center as the destination and Googleplex as a waypoint. Its departure time must be set to "Other time", and the route preferences must have "Fewer transfers" checked.

  After all three routes are saved, initiate navigation for the "MetaCommute" route. During this active navigation, submit an incident report with the incident type set to "Hazard" and the report note set exactly to "OfficeCongestion". Following the submission of this report, mute the voice guidance and end the navigation session.

  The final state of the application must be logged in as Maya Chen, with the visible screen being the Records page. This page must display both the "Saved routes" and "Incident reports" sections.
