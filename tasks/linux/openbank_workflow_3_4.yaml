  The Statements section must show that the statement for the Everyday Checking account ending in 2381 for the month of 2026-05 has been downloaded, and the paperless delivery option for the Rainy Day Savings account must be enabled. In the Security section, the New sign-in from macOS alert must be marked as read, and the OpenBank Rewards Card must be in an unlocked state following a sequence of locking and immediately unlocking it. The notification preferences must be saved with the Large purchase threshold set to 150 and the SMS notification toggle for that setting turned off.
