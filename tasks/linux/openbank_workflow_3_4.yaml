instruction: |-
  Execute a comprehensive account review, payment scheduling, transfer submission, statement retrieval, and security configuration workflow in the OpenBank web application while signed in as Jordan Lee, ensuring the session remains active and the desktop OpenBank application is not opened. The activity review for the Everyday Checking account ending in 2381 must reflect a search executed with the Shopping category, Posted status, and the search term BrightMart. The activity review for the OpenBank Rewards Card ending in 7712 must include two distinct searches: one filtered by the Software category with the search term CloudBox, and another filtered by the Dining category with the search term Sora Cafe.

