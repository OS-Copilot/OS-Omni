task_id: linux.thunderbird_calendar.build_recurring_release_plan_hard
platform: linux
instruction: >
  Thunderbird is already open in Calendar view. Create a recurring event called
  "Weekly Release Triage" every Tuesday at 9:15 AM for 45 minutes with a
  reminder 15 minutes before the event. Also create "QA Sign-off" for next
  Thursday at 11:00 AM for 30 minutes and "Launch Readiness Review" for next
  Friday at 4:00 PM for 1 hour. Save everything when finished.
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
      - type: run_bash
        script: |
          pkill -f thunderbird || true
        timeout: 120
      - type: wait
        ms: 1200
      - type: download
        url: https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/thunderbird/dd84e895-72fd-4023-a336-97689ded257c/thunderbird-profile.tar.gz
        path: /home/user/thunderbird-profile.tar.gz
      - type: run_bash
        script: tar -xzv --recursive-unlink -f /home/user/thunderbird-profile.tar.gz -C /home/user/
        timeout: 120
      - type: run_bash
        script: |
          export DISPLAY=:0
          setsid -f /usr/bin/thunderbird -calendar >/dev/null 2>&1
        timeout: 120
      - type: wait
        ms: 5000
evaluation:
  evaluator_id: evaluators.linux.thunderbird_calendar:ThunderbirdCalendarEvaluator
  params:
    profile_dir: /home/user/.thunderbird/t5q2a5hp.default-release
    required_titles:
      - Weekly Release Triage
      - QA Sign-off
      - Launch Readiness Review
    recurrence_checks:
      Weekly Release Triage:
        - rrule
        - freq=weekly
        - byday=tu
    event_expectations:
      Weekly Release Triage:
        relative_day: next_week
        weekday: tuesday
        start_time: "09:15"
        duration_minutes: 45
        recurrence_keywords:
          - rrule
          - freq=weekly
          - byday=tu
        alarm_keywords:
          - -pt15m
      QA Sign-off:
        relative_day: next_week
        weekday: thursday
        start_time: "11:00"
        duration_minutes: 30
      Launch Readiness Review:
        relative_day: next_week
        weekday: friday
        start_time: "16:00"
        duration_minutes: 60
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [linux, thunderbird, calendar, recurring, hard]
  app_name: thunderbird_calendar
  difficulty: hard
  description: Create a recurring release meeting and two additional planning events in Thunderbird Calendar.
  oracle_task: tasks/linux/oracle/thunderbird_calendar_build_recurring_release_plan_hard_oracle.yaml
  oracle_model: linux_oracle_wait
