task_id: linux.opennavigation.campus_walk_bike_incidents.sk2.v1
platform: linux
instruction: |-
  Create two saved routes, CampusWalk and CampusBike, in OpenNavigation while signed in as Maya Chen, and submit two incident reports during navigation sessions before ending on the Records page.

  The CampusWalk route must start from Current location, pass through Googleplex and Meta Headquarters in that order, and end at Stanford University. It must use Walk mode with the departure time set to Other time, and both the Avoid tolls and Avoid highways preferences must be enabled. The first Walk route option must be selected and saved under the name CampusWalk.

  The CampusBike route must be derived from CampusWalk by removing both waypoints, changing the destination to Mountain View Transit Center, switching the travel mode to Bike, and setting the departure time to Leave now. Both Avoid tolls and Avoid highways preferences must be disabled. The second Bike route option must be selected and the result saved as CampusBike.

  Two navigation sessions must be conducted with specific incident reports. The first session loads CampusBike, chooses the first Bike route, and starts navigation, during which an incident report of type Hazard with the note Pothole is submitted. The second session loads CampusWalk, chooses the first Walk route, and starts navigation, during which an incident report of type Hazard with the note Crowd is submitted. Voice guidance must be muted and navigation ended after the second incident report.

  When the task is complete, the application must be on the Records page, where both saved routes, CampusWalk and CampusBike, and both incident reports are visible and retained. The user must remain signed in as Maya Chen, with no sign-out or logout performed.
