task_id: linux.thunderbird_calendar.create_vendor_followup_easy
platform: linux
instruction: >
  Thunderbird is already open in Calendar view. Create a new event titled
  "Vendor Follow-up" for tomorrow at 3:00 PM. Make it last 45 minutes, then
  save it.
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
      - type: run_bash
        script: |
          pkill -f thunderbird || true
        timeout: 120
      - type: wait
        ms: 1200
      - type: download
        url: https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/thunderbird/dd84e895-72fd-4023-a336-97689ded257c/thunderbird-profile.tar.gz
        path: /home/user/thunderbird-profile.tar.gz
      - type: run_bash
        script: tar -xzv --recursive-unlink -f /home/user/thunderbird-profile.tar.gz -C /home/user/
        timeout: 120
      - type: run_bash
        script: |
          export DISPLAY=:0
          setsid -f /usr/bin/thunderbird -calendar >/dev/null 2>&1
        timeout: 120
      - type: wait
        ms: 5000
evaluation:
  evaluator_id: evaluators.linux.thunderbird_calendar:ThunderbirdCalendarEvaluator
  params:
    profile_dir: /home/user/.thunderbird/t5q2a5hp.default-release
    required_titles:
      - Vendor Follow-up
    event_expectations:
      Vendor Follow-up:
        relative_day: tomorrow
        start_time: "15:00"
        duration_minutes: 45
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [linux, thunderbird, calendar, easy]
  app_name: thunderbird_calendar
  difficulty: easy
  description: Create a single follow-up event in Thunderbird Calendar for tomorrow afternoon.
  oracle_task: tasks/linux/oracle/thunderbird_calendar_create_vendor_followup_easy_oracle.yaml
  oracle_model: linux_oracle_wait
