task_id: linux.opennavigation.qa65_navigation_workflow
platform: linux
instruction: |-
  Launch the OpenNavigation application to execute a four-session navigation workflow that concludes with the Layers dialog open and displaying the standard map layer message.

  The first navigation session originates from Stanford University in the Saved section of the left sidebar. The Directions panel for this destination must reflect a travel mode sequence of Walk, Drive, Bike, and finally Drive, with the time setting configured to Leave now via the Other time option. The Routes tab must be active in the Options area before the route is generated. If the Route options panel persists after the initial route generation, the Fastest route card must be selected to enter the active navigation interface. During this session, the navigation control bar must be used to activate Zoom +, Zoom -, Overview, and Report in that order. Any resulting Incident report saved for this session dialog must be dismissed by selecting Ok. The session concludes by activating Mute and then selecting End.

  The second navigation session begins from the Route options panel by selecting the Alternative 2 route card. The navigation control bar must be used to activate Report, and any Incident report saved for this session dialog must be dismissed by selecting Ok. The session ends by selecting End.

  The third navigation session originates from Meta Headquarters in the Recent section of the left sidebar. The Directions panel must reflect a travel mode sequence of Walk, Bike, and finally Drive. The Routes tab must be selected before generating the route. If the Route options panel remains visible, the Fastest route card must be selected to enter navigation. The navigation control bar must be used to activate Overview and then Report, with any Incident report saved for this session dialog dismissed by selecting Ok. The session concludes by selecting End.

  The fourth navigation session originates from Googleplex in the Recent section of the left sidebar. The Directions panel must reflect a travel mode sequence of Transit followed by Drive. With the Routes tab active, the route is generated, selecting the Fastest route card if necessary to enter navigation. The navigation control bar must be used to activate Zoom +, Zoom -, and Report. Any Incident report saved for this session dialog must be dismissed by selecting Ok. The session ends by selecting End.

  Upon completion of the fourth session, the Layers option at the bottom of the left sidebar must be selected. The final state of the application is the Layers dialog open and visible, displaying the message that OpenNavigation is using the standard map layer, with the Ok button remaining visible and unclicked.
