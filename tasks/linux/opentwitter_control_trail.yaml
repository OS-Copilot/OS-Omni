instruction: |-
  Sign in to OpenTwitter as Alex Chen with the username alex and password chirp2026 to establish a control trail across posts, messages, profile settings, and notifications.

  The resulting state must include a reply to Mateo Rivera's post about compact controls containing the exact text "Focus states clear", with that same post also marked as liked. Iris Walker's post about the expected final state must be both bookmarked and reposted. Alex Chen's post about the Support macro pass must be marked as liked. Devon Brooks's post titled "Runbooks age quietly" must have a reply containing the exact text "Review date added".

  The Home feed must contain three new posts authored by Alex Chen: one with the text "Control guide ready", one with the text "Control trail closed" that is also bookmarked and liked, and one with the text "Runbook labels set" that is also bookmarked.

  The Messages section must contain four new direct messages sent by Alex Chen: one to Mateo Rivera with the text "Focus notes posted", one to Oscar Liu with the text "Final state saved", one to Devon Brooks with the text "Runbook date fixed", and one to Oscar Liu with the text "Warning saved".

  Alex Chen's profile bio must be set to exactly "Interaction lead", and if a "Remove photo" control is present in the profile editor, it must be activated before the profile changes are saved. All notifications must be marked as read.
