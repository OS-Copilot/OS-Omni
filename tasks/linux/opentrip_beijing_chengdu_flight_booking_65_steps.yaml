instruction: Book the Bamboo Horizon flight BH1694 from Beijing to Chengdu on the OpenTrip website in
  the Linux desktop browser. The user must be signed in as Lucas Lin using the phone number 13900002026
  and the password travel2026. The flight search must be configured to depart from Beijing (PKX) in China
  and arrive in Chengdu (CTU) in China for the date 2026-06-12, with the cabin class set to Economy and
  the results sorted by Recommended. The selected flight must be Bamboo Horizon BH1694, departing Beijing
  at 11:46, arriving in Chengdu at 14:51, and priced at 480. On the booking confirmation page, Lucas Lin
  must be selected as the traveler, the contact phone number must be set to 13900002026, Alipay must be
  chosen as the payment method, and the note must be entered exactly as "Beijing to Chengdu client visit
  - economy cabin." The booking must be submitted without any validation errors. The task is complete
  when the OpenTrip Bookings page is displayed with the new Bamboo Horizon BH1694 booking visible and
  its status shown as Confirmed, while the user remains signed in and the browser remains open.
