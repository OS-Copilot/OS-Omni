task_id: linux.opencode.tooling_notes_settings
platform: linux
instruction: Configure the OpenCode application by installing the Vite Tools and React Snippets extensions,
  updating the extension set, and adjusting the environment settings to use the Default Light theme, a
  font size of 16, and enabled Word Wrap, Minimap, Format On Save, and Auto Save. The notes folder within
  the webpage directory on the Ubuntu0 desktop must contain the file review-2026-04-30.md, which should
  be modified to append the lines "Tooling notes", "Vite helpers on", and "React snippets on" to the end
  of the document, each on its own new line, followed by saving the file and executing the Save File command
  via the command palette. The search functionality should be used to locate the term "review" and select
  the review-2026-04-30.md file from the results, while the Copilot Chat panel must receive the message
  "git changes". In the Source Control view, the review-2026-04-30.md file should be staged with the commit
  message "Add tooling notes" and committed. The ESLint extension must be disabled and then reinstalled,
  and the application settings must be updated to the Default Dark theme with a font size of 14, ensuring
  Format On Save remains enabled. The final state requires the Source Control view to be active with "Add
  tooling notes" as the latest entry in the timeline and no uncommitted changes remaining, while strictly
  prohibiting the opening, editing, or creation of any README.md files, OpenZotero, Zotero, launcher,
  desktop entry, or desktop shortcuts.
