evaluation:
  evaluator_id: evaluators.linux.command_check:CommandCheckEvaluator
  params:
    timeout: 120
    stdout_contains: "PASS"
    command: |
      set -euo pipefail
      python3 - <<'PY'
      import os
      import zipfile

      # Check draw.io file
      drawio_path = os.path.expanduser("~/Documents/org_chart.drawio")
      if not os.path.exists(drawio_path):
          raise SystemExit("DRAWIO_FILE_NOT_FOUND")

      with open(drawio_path, 'r') as f:
          content = f.read()
      for val in ["CEO", "VP Engineering", "VP Sales"]:
          if val not in content:
              raise SystemExit(f"MISSING_SHAPE_{val}")

      # Check Calc spreadsheet
      ods_path = os.path.expanduser("~/Documents/org_data.ods")
      if not os.path.exists(ods_path):
          raise SystemExit("CALC_FILE_NOT_FOUND")

      with zipfile.ZipFile(ods_path, 'r') as z:
          content = z.read('content.xml').decode('utf-8')

      for val in ["VP Engineering", "VP Sales", "CEO"]:
          if val not in content:
              raise SystemExit(f"MISSING_VALUE_{val}")

      print("PASS")
      PY
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - linux
  - cross_app
  - drawio
  - calc
  - org_chart
  - shapes
  - hard
  app_name: drawio + libreoffice_calc
  difficulty: hard
  description: Create an org chart in draw.io with 3 rectangles and connecting
    arrows, then create a position data spreadsheet in Calc with reporting
    relationships.
