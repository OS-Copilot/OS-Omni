task_id: linux.cross_app.drawio_calc_org_chart_hard
platform: linux
instruction: >
  Open draw.io. Create a new diagram. From the shape panel on the left side,
  drag a rectangle shape onto the canvas. Double-click the shape to edit its
  text and type "CEO".
  Drag another rectangle onto the canvas below the first one. Double-click
  and type "VP Engineering".
  Drag another rectangle onto the canvas below the first one but to the right.
  Double-click and type "VP Sales".
  Connect "CEO" to "VP Engineering" by dragging from the CEO's bottom
  connection point to VP Engineering's top connection point.
  Connect "CEO" to "VP Sales" by dragging from the CEO's bottom connection
  point to VP Sales's top connection point.
  Save the diagram as /home/user/Documents/org_chart.drawio.
  Then switch to the already-open LibreOffice Calc window. Create a new
  spreadsheet. In cell A1 type "Position", in B1 type "Reports To".
  In row 2, enter "VP Engineering" and "CEO". In row 3, enter "VP Sales"
  and "CEO". In cell A5, type "Total Positions". In cell B5, type 3.
  Save the spreadsheet as /home/user/Documents/org_data.ods.
  Finish after both files exist.
