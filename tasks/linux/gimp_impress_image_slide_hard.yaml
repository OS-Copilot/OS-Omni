task_id: linux.cross_app.gimp_impress_image_slide_hard
platform: linux
instruction: >
  Open the seeded image /tmp/helloworld_gimp/input.png in GIMP.
  Use the scroll wheel to zoom out until you can see the entire image.
  Then use Image → Scale Image to resize the image to exactly 1024×768 pixels.
  Click Scale to confirm.
  Then use Image → Mode → Grayscale to convert the image to grayscale.
  Finally use File → Export As to export the result to
  /home/user/Documents/slide_image.png as a PNG file. In the export dialog,
  click Export to confirm.
  Then switch to the already-open LibreOffice Impress window. Create a new
  presentation. On the first slide, use Insert → Image to insert the exported
  image /home/user/Documents/slide_image.png. In the insert dialog, navigate
  to /home/user/Documents/, select slide_image.png, and click Open.
  Save the presentation as /home/user/Documents/image_slide.odp.
  Finish after the presentation is saved.
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: |
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_writer/B11B17CA-0B48-4A7E-B567-A2524C24D26F/Bench_Status_Update.docx"
        out = Path("/home/user/Desktop/Bench_Status_Update.docx")
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(urlopen(url).read())
        PY|
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/wireshark/C9CCC440-B4EE-407E-B53D-B389ED564F8E/retail_mix.pcapng"
        out = Path("/tmp/helloworld_wireshark/retail_mix.pcapng")
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(urlopen(url).read())
        PY|
        pkill -f gimp || true
