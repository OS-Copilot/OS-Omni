task_id: linux.thunderbird_calendar.plan_next_week_reviews_hard
platform: linux
instruction: >
  Thunderbird is already open in Calendar view. Use the schedule request at
  /home/user/Desktop/review_schedule_request.txt to create the next-week review
  calendar. Add "Design Review" on Monday at 10:00 AM for 1 hour, "Backlog
  Triage" on Tuesday at 9:15 AM for 45 minutes with a reminder 15 minutes
  before the event, "Sprint Planning" on Wednesday at 1:30 PM for 1 hour,
  "Launch Debrief" on Thursday at 4:15 PM for 30 minutes with a reminder
  10 minutes before the event, and "Retrospective" on Friday at 2:30 PM for
  1 hour with a reminder 30 minutes before the event. Save all five events.
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
      - type: run_bash
        script: |
          pkill -f thunderbird || true
          mkdir -p /home/user/Desktop
          cat > /home/user/Desktop/review_schedule_request.txt <<'EOF'
          Next-week review calendar request:
          - Design Review: Monday 10:00, 60 minutes
          - Backlog Triage: Tuesday 09:15, 45 minutes, reminder 15 minutes before
          - Sprint Planning: Wednesday 13:30, 60 minutes
          - Launch Debrief: Thursday 16:15, 30 minutes, reminder 10 minutes before
          - Retrospective: Friday 14:30, 60 minutes, reminder 30 minutes before
          EOF
        timeout: 120
      - type: wait
        ms: 1200
      - type: download
        url: https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/thunderbird/dd84e895-72fd-4023-a336-97689ded257c/thunderbird-profile.tar.gz
        path: /home/user/thunderbird-profile.tar.gz
      - type: run_bash
        script: tar -xzv --recursive-unlink -f /home/user/thunderbird-profile.tar.gz -C /home/user/
        timeout: 120
      - type: run_bash
        script: |
          export DISPLAY=:0
          setsid -f /usr/bin/thunderbird -calendar >/dev/null 2>&1
        timeout: 120
      - type: wait
        ms: 5000
evaluation:
  evaluator_id: evaluators.linux.thunderbird_calendar:ThunderbirdCalendarEvaluator
  params:
    profile_dir: /home/user/.thunderbird/t5q2a5hp.default-release
    required_titles:
      - Design Review
      - Backlog Triage
      - Sprint Planning
      - Launch Debrief
      - Retrospective
    event_expectations:
      Design Review:
        relative_day: next_week
        weekday: monday
        start_time: "10:00"
        duration_minutes: 60
      Backlog Triage:
        relative_day: next_week
        weekday: tuesday
        start_time: "09:15"
        duration_minutes: 45
        alarm_keywords:
          - -pt15m
      Sprint Planning:
        relative_day: next_week
        weekday: wednesday
        start_time: "13:30"
        duration_minutes: 60
      Launch Debrief:
        relative_day: next_week
        weekday: thursday
        start_time: "16:15"
        duration_minutes: 30
        alarm_keywords:
          - -pt10m
      Retrospective:
        relative_day: next_week
        weekday: friday
        start_time: "14:30"
        duration_minutes: 60
        alarm_keywords:
          - -pt30m
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [linux, thunderbird, calendar, hard]
  app_name: thunderbird_calendar
  difficulty: hard
  description: Build a focused five-event review schedule in Thunderbird Calendar from a desktop request note.
  oracle_task: tasks/linux/oracle/thunderbird_calendar_plan_next_week_reviews_hard_oracle.yaml
  oracle_model: linux_oracle_wait
