instruction: Produce the final state of the qa82 snap_2 operations workflow in OpenFood. The Merchant
  section must display the Dumpling Room No. 20 San Jose CA card as closed, with the availability of the
  Pork Dumplings, Beef Chow Fun, and Mapo Tofu rows set to Available, and the Santana Row Banh Mi Market
  No. 12 San Jose CA card as closed, with the availability of its first, second, and third dish rows set
  to Available. The Courier section must show the D-331 delivery card, the D-332 delivery card, and one
  additional delivery card that has a Next step button all advanced to their next step. The Restaurants
  section must contain the text pizza in the search input, the Cuisine filter set to Pizza, and the Sort
  filter set to Recommended, with the Deep Dish Works menu accessed and Deep Dish Pizza, Chicago Hot Dog,
  and Golden Deep Dish Pizza added to the cart. The Cart area must reflect a quantity of 2 for each of
  these three items, a selected option from the Coupon dropdown, and a placed order. The Orders section
  must show the top order in the list selected for Reorder, with the resulting Cart area showing the quantity
  of one dish row increased by one and a second order placed. A support ticket must exist in the Support
  section with the subject qa82, the Order ID OF-2011, and the message qa82 courier status. The Wallet
  section must show the voucher code SAVE15 entered and claimed. The Restaurants section must subsequently
  contain the text dumpling in the search input, the Cuisine filter set to All, and the Dumpling Room
  No. 20 result selected, while the Merchant section must keep Dumpling Room No. 20 San Jose CA closed
  and not reopened. The final visible state must be the Admin page, displaying the Menu availability audit
  alert card with the description 15 imported menu items are unavailable but still visible for merchant
  tasks, and the Users list on the right must show Admin Desk with the role Admin.
