instruction: |-
  Create a new DeltaChat group named `Release Control Room` with the description `Launch evidence and owners`, and immediately send the message `Release room is open` into the group.

  The group must contain a markdown file named `Release control pack.md` located in the user's home `Documents` folder. This file must contain the following lines in order, separated by newlines: `# Release Control Pack`, `Incident lead: Core team`, `Owner: Release team`, `Window: Evening launch`, `## Source Signal`, `Avatar alert copied`, followed by the exact text content of the message from `Avatar Bot` that contains `Unread Avatar expansion 04` (located by searching for `avatar_unread_04`), then `## Launch Checklist`, `- Verify release window`, `- Confirm alert channel`, `- Assign rollback owner`, and `Verify build and rollback`.

  The group chat history must include the following sequence of artifacts and messages: the `Release control pack.md` file attachment followed by the message `Workspace baseline follows`; the image `office_dashboard_desk.png` from the `Pictures/deltachat_evidence_assets` directory (depicting a sunlit office with a wooden desk, a silver laptop on the left displaying blue-green statistics, an open paper notebook and pen in the front, a gray coffee cup on the right, and a green plant in the background) followed by the message `Planning board follows`; the image `meeting_room_planning_board.png` from the same directory (showing an empty meeting room with a long table holding scattered notebooks, pink and blue sticky notes, and three water bottles, a whiteboard on the right wall covered in multicolored sticky notes, and a large window on the left letting in daylight) followed by the message `Delivery risk follows`; the image `shipment_boxes_labels.png` from the same directory (showing an office receiving desk with four sealed brown cardboard boxes stacked on the right, each with a blank white label, and a blue tape dispenser and clipboard in the bottom left corner) followed by the message `Three baselines accepted`.

  The chat must also contain specific replies: a reply to the message `Three baselines accepted` with the text `Proceed with monitored launch`; a reply to the sent image `meeting_room_planning_board.png` with the text `Board owns launch sequence`; and a reply to the sent attachment `Release control pack.md` with the text `Pack binds the three photos`. Following these replies, the group must contain the messages `Core team owns the window` and `Pack and photos delivered`, and finally the image `cracked_phone_repair_table.png` from the `Pictures/deltachat_evidence_assets` directory (showing a black phone on a gray repair table with glass cracked in multiple places from the bottom upwards, a metal precision screwdriver on the left, and a black USB-C cable on the right). The task is complete when the `Release Control Room` group chat is the active view and the user remains logged in.
