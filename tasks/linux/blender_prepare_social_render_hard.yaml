task_id: linux.blender.prepare_social_render
platform: linux
instruction: >
  In Blender, use the brief at
  /tmp/helloworld_blender_workspace/blender_social_render/social_brief.txt
  to turn the prepared product stage into the paid-social preview. Set the
  primary scene to EEVEE, transparent PNG RGBA output, 1600 by 900 at 100%,
  30 FPS, frames 1 to 120, 80 EEVEE render samples, and output path
  //renders/social_preview_final.png. Reframe the Camera to X 6.4, Y -6.0,
  Z 4.8 with rotation X 60, Y 0, Z 43; move FillLight to X 1.5, Y -3.0,
  Z 6.2 with rotation X 52, Y 0, Z 30 and scale 1.1 on all axes. Arrange
  FeatureCube as the hero product at X 0.45, Y -0.35, Z 1.25 with rotation
  X 0, Y 0, Z 12, scale X 1.20, Y 0.85, Z 1.35, and diffuse color
  RGBA 0.90, 0.32, 0.16, 1.0. Place AccentCylinder at X -1.5, Y 0.9,
  Z 1.05 with rotation X 0, Y 0, Z -14, scale X 0.55, Y 0.55, Z 1.35,
  and diffuse color RGBA 0.12, 0.45, 0.82, 1.0. Place HeroSphere at X 2.0,
  Y 1.15, Z 0.95 with scale X 0.75, Y 0.75, Z 0.75 and diffuse color
  RGBA 0.16, 0.75, 0.55, 1.0. Set BackdropPlane to X 0, Y 0, Z -0.05,
  rotation X 0, Y 0, Z 4, scale X 5.8, Y 4.2, Z 1.0, and diffuse color
  RGBA 0.06, 0.07, 0.09, 1.0. Add a plane named CTAPlate at X 1.35,
  Y -2.35, Z 0.06 with rotation X 0, Y 0, Z 6, scale X 1.65, Y 0.25,
  Z 1.0, and diffuse color RGBA 0.95, 0.78, 0.14, 1.0. Add a cube named
  CropGuide at X -2.65, Y 2.0, Z 0.35 with rotation X 0, Y 0, Z -18,
  scale X 0.32, Y 0.32, Z 0.70, and diffuse color RGBA 0.95, 0.95,
  0.95, 1.0. Save product_stage.blend, then create
  /tmp/helloworld_blender_workspace/blender_social_render/social_render_handoff.txt
  with exactly these five lines: brief=social paid preview,
  primary=product_stage.blend, render=social_preview_final.png,
  crop=safe for feed, status=ready.
init:
  initializer_id: initializers.linux.blender:BlenderInitializer
  params:
    app_command: blender
    workspace_name: blender_social_render
    scene_name: product_stage.blend
    scene_template: product_stage
    text_artifacts:
      - path: /tmp/helloworld_blender_workspace/blender_social_render/social_brief.txt
        content: |
          Channel: paid social feed
          Goal: make the hero product readable with a small CTA zone.
          Crop: keep the upper-left area clear for review notes.
          Deliverable: save the scene and leave a short handoff note.
evaluation:
  evaluator_id: evaluators.linux.blender:BlenderSceneEvaluator
  params:
    blend_path: /tmp/helloworld_blender_workspace/blender_social_render/product_stage.blend
    render:
      engine: BLENDER_EEVEE
      resolution_x: 1600
      resolution_y: 900
      resolution_percentage: 100
      fps: 30
      frame_start: 1
      frame_end: 120
      filepath: //renders/social_preview_final.png
      file_format: PNG
      color_mode: RGBA
      film_transparent: true
      eevee_taa_render_samples: 80
    objects:
      - name: Camera
        location: [6.4, -6.0, 4.8]
        rotation_degrees: [60.0, 0.0, 43.0]
      - name: FillLight
        location: [1.5, -3.0, 6.2]
        rotation_degrees: [52.0, 0.0, 30.0]
        scale: [1.1, 1.1, 1.1]
      - name: FeatureCube
        location: [0.45, -0.35, 1.25]
        rotation_degrees: [0.0, 0.0, 12.0]
        scale: [1.2, 0.85, 1.35]
        material_diffuse_color: [0.9, 0.32, 0.16, 1.0]
      - name: AccentCylinder
        location: [-1.5, 0.9, 1.05]
        rotation_degrees: [0.0, 0.0, -14.0]
        scale: [0.55, 0.55, 1.35]
        material_diffuse_color: [0.12, 0.45, 0.82, 1.0]
      - name: HeroSphere
        location: [2.0, 1.15, 0.95]
        scale: [0.75, 0.75, 0.75]
        material_diffuse_color: [0.16, 0.75, 0.55, 1.0]
      - name: BackdropPlane
        location: [0.0, 0.0, -0.05]
        rotation_degrees: [0.0, 0.0, 4.0]
        scale: [5.8, 4.2, 1.0]
        material_diffuse_color: [0.06, 0.07, 0.09, 1.0]
      - name: CTAPlate
        type: MESH
        location: [1.35, -2.35, 0.06]
        rotation_degrees: [0.0, 0.0, 6.0]
        scale: [1.65, 0.25, 1.0]
        material_diffuse_color: [0.95, 0.78, 0.14, 1.0]
      - name: CropGuide
        type: MESH
        location: [-2.65, 2.0, 0.35]
        rotation_degrees: [0.0, 0.0, -18.0]
        scale: [0.32, 0.32, 0.7]
        material_diffuse_color: [0.95, 0.95, 0.95, 1.0]
    text_artifacts:
      - path: /tmp/helloworld_blender_workspace/blender_social_render/social_render_handoff.txt
        equals: |
          brief=social paid preview
          primary=product_stage.blend
          render=social_preview_final.png
          crop=safe for feed
          status=ready
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
    - linux
    - gui
    - blender
    - render
    - hard
  app: Blender
  difficulty: hard
  description: Use a seeded social brief to stage a product render, save the Blender scene, and write a short producer handoff note.
  oracle_task: tasks/linux/oracle/blender_prepare_social_render_oracle.yaml
  oracle_model: linux_oracle_wait
