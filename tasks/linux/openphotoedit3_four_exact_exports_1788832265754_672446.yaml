instruction: |-
  Produce four edited image exports in OpenPhotoEdit3, each derived from a specific source file with a defined set of adjustments and saved under a designated filename.

  The first export, pe3_forest_longhair_portrait-edited.png, is created from /home/user/Pictures/pe3_forest_longhair_portrait.png, which depicts a woman with long brown hair facing the camera in a khaki jacket within a green forest. This image requires the Portrait section settings of Smooth 7, Whiten 3, Rosy 4, Bright Eyes 6, and Background Blur 9; the HSL section settings of Green -10 and Yellow -5; the Edit section settings of Exposure 4, Contrast 6, and Sharpen 7; and the Filters section selection of the Portrait preset with Strength 22.

  The second export, pe3_concrete_shortcurl_portrait-edited.png, is created from /home/user/Pictures/pe3_concrete_shortcurl_portrait.png, which shows a woman with short black curly hair in a white sleeveless top standing in front of a gray concrete wall and looking to the side. This image requires the Edit section settings of Exposure 2, Brightness 5, Temperature -4, and Sharpen 9; the Portrait section settings of Smooth 5, Slim Face 3, and Bright Eyes 5; the Filters section selection of the Cream preset with Strength 18; and the HSL section settings of Orange -5 and Red 3.

  The third export, pe3_forest_waterfall-edited.png, is created from /home/user/Pictures/pe3_forest_waterfall.png, which features a multi-tiered white waterfall flowing over dark rocks and moss in a dense green forest. This image requires the Scene section settings of Structure 16, Foliage 9, Cool Tone 7, and HDR 12; the HSL section settings of Green -8, Cyan 6, and Blue 4; the Edit section settings of Brightness 6, Contrast 8, and Sharpen 10; and the Filters section selection of the Clean preset with Strength 30.

  The fourth export, pe3_snow_lake_mountain-edited.png, is created from /home/user/Pictures/pe3_snow_lake_mountain.png, which displays a twin-peaked snow mountain, deep green forest, and a lake with a complete reflection under a golden sunset. This image requires the Scene section settings of Sky 13, Structure 12, Foliage 5, Warm Sun 10, and HDR 11; the HSL section settings of Yellow -8, Green -9, and Blue 5; and the Edit section settings of Saturation -7 and Contrast -4. Upon completion, the application must remain on the editing page for this final image.
