platform: linux
instruction: Create two new folders under Local Folders in Thunderbird named exactly BillsDesk64 and TripsDesk64,
  and establish two enabled message filters configured to run periodically every 10 minutes. The first
  filter, named Bill64Route, must match messages where the Subject contains invoice64 or the Subject contains
  receipt64, and its action must move the message to the BillsDesk64 folder under Local Folders. The second
  filter, named Travel64Route, must match messages where the Subject contains booking64 or the Subject
  contains checkin64, and its action must move the message to the TripsDesk64 folder under Local Folders.
  Upon completion, the Bill64Route filter must have its run-now target folder set to BillsDesk64 under
  Local Folders and must be executed immediately.
