task_id: linux.zotero.reference_library_buildout
platform: linux
instruction: >
  Open Zotero and use /home/user/Documents/zotero_reference_request.txt as the
  intake list. Create exactly the five requested collections under My Library.
  In each collection, add the requested manual item, author, tag, and child note:
  "Reference Shelf" gets the Book "Designing Data-Intensive Applications" by
  "Martin Kleppmann" with tag "systems" and note "Review storage and
  replication notes"; "AI Papers" gets the Journal Article "BERT" by "Jacob
  Devlin" with tag "transformer" and note "Compare encoder baseline";
  "Operations Reading" gets the Book "Site Reliability Engineering" by "Betsy
  Beyer" with tag "reliability" and note "Review incident chapter"; "Security
  Review" gets the Book "Security Engineering" by "Ross Anderson" with tag
  "security" and note "Review threat modeling chapter"; "Architecture Shelf"
  gets the Book "Software Architecture: The Hard Parts" by "Neal Ford" with tag
  "architecture" and note "Review tradeoff chapter". After the library is built,
  create /home/user/Documents/zotero_reference_handoff.tsv with exactly these
  six tab-separated lines: collection, title, owner, then Reference Shelf,
  Designing Data-Intensive Applications, library-ops; AI Papers, BERT,
  library-ops; Operations Reading, Site Reliability Engineering, library-ops;
  Security Review, Security Engineering, library-ops; Architecture Shelf,
  Software Architecture: The Hard Parts, library-ops. Also create
  /home/user/Documents/zotero_reference_review_note.txt with exactly these four
  lines: request=zotero_reference_request.txt, collections=5, items=5,
  status=ready-for-review.
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: |
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_writer/B11B17CA-0B48-4A7E-B567-A2524C24D26F/Bench_Status_Update.docx"
        out = Path("/home/user/Desktop/Bench_Status_Update.docx")
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(urlopen(url).read())
        PY|
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/wireshark/C9CCC440-B4EE-407E-B53D-B389ED564F8E/retail_mix.pcapng"
        out = Path("/tmp/helloworld_wireshark/retail_mix.pcapng")
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(urlopen(url).read())
        PY|
        set -e
        export HOME=/home/user
        export PATH="$HOME/.local/bin:$PATH"
        mkdir -p "$HOME/Applications" "$HOME/.local/share/applications" "$HOME/.local/bin" "$HOME/Downloads" "$HOME/Documents"
        pkill -x zotero >/dev/null 2>&1 || true
        archive="$HOME/Downloads/Zotero-9.0.1_linux-x86_64.tar.xz"
        if [ ! -x "$HOME/Applications/Zotero_linux-x86_64/zotero" ]; then
          if [ ! -f "$archive" ]; then
            python3 -c 'from pathlib import Path; from urllib.request import urlopen; url = "https://download.zotero.org/client/release/9.0.1/Zotero-9.0.1_linux-x86_64.tar.xz"; out = Path("/home/user/Downloads/Zotero-9.0.1_linux-x86_64.tar.xz"); out.write_bytes(urlopen(url).read())'
          fi
          rm -rf "$HOME/Applications/Zotero_linux-x86_64"
          tar -xf "$archive" -C "$HOME/Applications"
          (
            cd "$HOME/Applications/Zotero_linux-x86_64"
            ./set_launcher_icon
          )
          ln -sf "$HOME/Applications/Zotero_linux-x86_64/zotero.desktop" "$HOME/.local/share/applications/zotero.desktop"
          ln -sf "$HOME/Applications/Zotero_linux-x86_64/zotero" "$HOME/.local/bin/zotero"
        fi
        rm -rf "$HOME/Zotero" "$HOME/.zotero"
        rm -f "$HOME/Documents"/zotero_reference_*.txt "$HOME/Documents"/zotero_reference_*.tsv "$HOME/Documents"/zotero_reference_*.csv
        cat > "$HOME/Documents/zotero_reference_request.txt" <<'EOF'
        collection	title	type	author	tag	note
        Reference Shelf	Designing Data-Intensive Applications	Book	Martin Kleppmann	systems	Review storage and replication notes
        AI Papers	BERT	Journal Article	Jacob Devlin	transformer	Compare encoder baseline
        Operations Reading	Site Reliability Engineering	Book	Betsy Beyer	reliability	Review incident chapter
        Security Review	Security Engineering	Book	Ross Anderson	security	Review threat modeling chapter
        Architecture Shelf	Software Architecture: The Hard Parts	Book	Neal Ford	architecture	Review tradeoff chapter
        EOF
    - type: launch_app
      command: /home/user/Applications/Zotero_linux-x86_64/zotero
    - type: wait
      ms: 12000
    - type: run_bash
      script: |
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/libreoffice_writer/B11B17CA-0B48-4A7E-B567-A2524C24D26F/Bench_Status_Update.docx"
        out = Path("/home/user/Desktop/Bench_Status_Update.docx")
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(urlopen(url).read())
        PY|
        python3 - <<'PY'
        from pathlib import Path
        from urllib.request import urlopen
        url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/wireshark/C9CCC440-B4EE-407E-B53D-B389ED564F8E/retail_mix.pcapng"
        out = Path("/tmp/helloworld_wireshark/retail_mix.pcapng")
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(urlopen(url).read())
        PY|
        export DISPLAY=${DISPLAY:-:0}
        wmctrl -a Zotero 2>/dev/null || true
        wmctrl -r Zotero -b remove,maximized_vert,maximized_horz 2>/dev/null || true
        wmctrl -r Zotero -e 0,80,80,1320,860 2>/dev/null || true
    - type: wait
      ms: 1000
evaluation:
  evaluator_id: evaluators.linux.zotero:ZoteroLibraryEvaluator
  params:
    db_path: /home/user/Zotero/zotero.sqlite
    required_collections:
    - Reference Shelf
    - AI Papers
    - Operations Reading
    - Security Review
    - Architecture Shelf
    required_items:
    - title: Designing Data-Intensive Applications
      item_type: book
      collections:
      - Reference Shelf
      creators:
      - Martin Kleppmann
      tags:
      - systems
      note_contains:
      - Review storage and replication notes
    - title: BERT
      item_type: journalArticle
      collections:
      - AI Papers
      creators:
      - Jacob Devlin
      tags:
      - transformer
      note_contains:
      - Compare encoder baseline
    - title: Site Reliability Engineering
      item_type: book
      collections:
      - Operations Reading
      creators:
      - Betsy Beyer
      tags:
      - reliability
      note_contains:
      - Review incident chapter
    - title: Security Engineering
      item_type: book
      collections:
      - Security Review
      creators:
      - Ross Anderson
      tags:
      - security
      note_contains:
      - Review threat modeling chapter
    - title: "Software Architecture: The Hard Parts"
      item_type: book
      collections:
      - Architecture Shelf
      creators:
      - Neal Ford
      tags:
      - architecture
      note_contains:
      - Review tradeoff chapter
    text_artifacts:
    - path: /home/user/Documents/zotero_reference_handoff.tsv
      equals: |
        collection	title	owner
        Reference Shelf	Designing Data-Intensive Applications	library-ops
        AI Papers	BERT	library-ops
        Operations Reading	Site Reliability Engineering	library-ops
        Security Review	Security Engineering	library-ops
        Architecture Shelf	Software Architecture: The Hard Parts	library-ops
    - path: /home/user/Documents/zotero_reference_review_note.txt
      equals: |
        request=zotero_reference_request.txt
        collections=5
        items=5
        status=ready-for-review
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - linux
  - gui
  - zotero
  - cross_file
  - multi_collection
  - hard
  app_name: zotero
  description: Build five Zotero collections from a seeded request file with typed
    references, metadata tags, child notes, and two exact handoff files.
  oracle_task: tasks/linux/oracle/zotero_reference_library_buildout_oracle.yaml
  oracle_model: linux_oracle_wait
  difficulty: hard
