instruction: |-
  In the OpenBank web application, signed in as Jordan Lee, complete a series of account reviews, scheduled payments, transfers, statement and security updates, and leave the session signed in without opening the separate OpenBank desktop application.

  The Everyday Checking account ending in 2381 must have its activity view reviewed with two specific searches executed: one filtering by the Shopping category, Posted status, and the search term BrightMart, and another filtering by the Groceries category, Posted status, and the search term Harbor Market. Three bill payments must be scheduled from this same Everyday Checking account ending in 2381: a payment to City Utilities for 92.35 on 2026-06-03 with the memo utilities, a payment to Northstar Internet for 72.00 on 2026-06-05 with the memo internet, and a payment to OpenBank Rewards Card for 35.00 on 2026-06-14 with the memo min due. Two transfers must be submitted from the Everyday Checking account ending in 2381: a transfer of 125.00 to Maya Patel on 2026-06-04 with the memo project, and a transfer of 450.00 to Rainy Day Savings (Emergency savings) on 2026-06-01 with the memo fund.

  The statement for the OpenBank Rewards Card ending in 7712 for the month 2026-05 must be downloaded, and paperless delivery must be enabled for the Rainy Day Savings account on the statements page. The security settings must be updated so that the alerts for New sign-in from macOS and Upcoming bill are marked as read. The OpenBank Rewards Card and the Everyday Checking debit card must each be locked and then unlocked, ensuring both end in an unlocked state. In the notification preferences, the Large purchase threshold must be set to 150 and the SMS notification for Large purchase must be turned off, with these notification preferences saved.
