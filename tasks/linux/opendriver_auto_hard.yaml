task_id: linux.opendriver.auto_hard
platform: linux
instruction: Sign in to the OpenDriver application as the Rider Riley Rider using the email rider@example.com
  and the password Password123!. The Account section must display expandable and collapsible Wallet, Coupons,
  Notifications, and Saved places areas, with the Wallet confirming the default payment method as Visa
  ending 4242, the Coupons section showing the available COMMUTE15 coupon, and the Saved places section
  listing Home and Work. The Safety page must present safety information with the support ticket entry
  remaining in an unsubmitted state. The ride request must be for a Green tier vehicle to the destination
  Downtown Palo Alto, CA, with the COMMUTE15 promo code applied to activate the discount while retaining
  the default Visa ending 4242 payment method. The ride must progress through driver assignment and pickup
  confirmation to an in-progress state, resulting in a completed receipt that verifies the Green ride
  tier, the applied COMMUTE15 promo code, payment via Visa, and the final fare breakdown. The final state
  must be the detail page for the most recent ride to Downtown Palo Alto, CA, accessed from the History
  tab, displaying the destination, Green ride tier, applied promo code, paid status, and final fare breakdown.
init:
  initializer_id: initializers.linux.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      timeout: 30
      script: |
        set -e
        pkill -f '/home/user/Applications/opendriver' 2>/dev/null || true
        pkill -f 'opendriver' 2>/dev/null || true
        cd /home/user/Applications/opendriver/shared/backend
        npm run seed
    - type: launch
      app_name: /home/user/Applications/opendriver/start-opendriver.sh
    - type: wait
      ms: 2500
evaluation:
  evaluator_id: evaluators.linux.command_check:CommandCheckEvaluator
  params:
    timeout: 30
    expected_exit_code: 0
    stdout_contains: OPENDRIVER_CHECK_PASS
    command: |
      set -e
      cd /home/user/Applications/opendriver
      node - <<'NODE'
      const fs = require('fs');
      const db = JSON.parse(fs.readFileSync('shared/backend/data/opendriver-db.json', 'utf8'));
      const failures = [];
      const rides = (db.rides || [])
        .filter((ride) => ride.riderId === 'usr_rider_primary' && ride.destinationAddress === 'Downtown Palo Alto, CA')
        .sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
      const ride = rides[0];
      if (!ride) {
        failures.push('No rider@example.com ride to Downtown Palo Alto, CA was created.');
      } else {
        if (ride.pickupAddress !== 'University Avenue, Palo Alto, CA') failures.push(`pickupAddress=${ride.pickupAddress}`);
        if (ride.rideTier !== 'green') failures.push(`rideTier=${ride.rideTier}`);
        if (ride.rideTierTitle !== 'Green') failures.push(`rideTierTitle=${ride.rideTierTitle}`);
        if (ride.promoCode !== 'COMMUTE15') failures.push(`promoCode=${ride.promoCode}`);
        if (ride.paymentMethod !== 'pm_rider_visa') failures.push(`paymentMethod=${ride.paymentMethod}`);
        if (ride.paymentStatus !== 'paid') failures.push(`paymentStatus=${ride.paymentStatus}`);
        if (ride.status !== 'completed') failures.push(`status=${ride.status}`);
        if (ride.cancelledAt) failures.push(`cancelledAt=${ride.cancelledAt}`);
        const total = Number(ride.finalFare ?? ride.estimatedFare);
        if (Math.abs(total - 13.97) > 0.01) failures.push(`fare=${total}`);
      }
      if (failures.length) {
        console.log(JSON.stringify({ok: false, failures, ride}, null, 2));
        process.exit(1);
      }
      console.log('OPENDRIVER_CHECK_PASS');
      console.log(JSON.stringify({
        rideId: ride.id,
        status: ride.status,
        rideTier: ride.rideTier,
        promoCode: ride.promoCode,
        paymentMethod: ride.paymentMethod,
        paymentStatus: ride.paymentStatus,
        destinationAddress: ride.destinationAddress,
        finalFare: ride.finalFare
      }, null, 2));
      NODE
