platform: linux
instruction: |-
  Complete the OpenFood qa82 snap_2 merchant and courier final workflow by producing the following end state.

  The order history must contain a submitted order from a pizza or Italian restaurant, identified by the search query “pizza” with the Cuisine filter set to All and the Sort filter set to Recommended, which includes the first, second, and third visible dishes from that restaurant’s menu, each with a quantity of 2, and any visible coupon applied. A subsequent reorder of that newest order must exist with the quantity of the first dish row increased by one.

  A support ticket must be visible in the Tickets area with the subject “qa82”, the Order ID “OF-2011”, and the message “qa82 courier status”. The Wallet section must record the voucher code “SAVE15” as a claimed coupon.

  The Restaurants section must reflect a search query of “dumpling” with the Cuisine filter set to All and the Sort filter set to Recommended. The cart associated with the Dumpling Room No. 20 San Jose CA restaurant must contain Pork Dumplings, Beef Chow Fun, and Mapo Tofu. In the Merchant section, the Dumpling Room No. 20 San Jose CA merchant must be marked as closed, and the availability status of the Pork Dumplings, Beef Chow Fun, and Mapo Tofu rows must be toggled. The Santana Row Banh Mi Market No. 12 San Jose CA merchant must also be marked as closed, with the availability status of its first and second dish rows toggled.

  In the Courier section, the D-331 - Central La Jolla Poke No. 21 San Diego CA card and the D-332 - Old Town Pho House 37 - San Jose CA card must each be advanced to their next step. One delivery card with the status Needs courier must have its route accepted and then be advanced to its next step. The latest order related to qa82 or dumpling must have its details page displaying the selected dishes and the customer service association.

  The final visible page must be the Courier delivery page, and the Santana Row Banh Mi Market No. 12 San Jose CA merchant card must remain in the closed state.
