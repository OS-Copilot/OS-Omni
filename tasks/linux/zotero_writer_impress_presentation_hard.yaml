evaluation:
  evaluator_id: evaluators.linux.command_check:CommandCheckEvaluator
  params:
    timeout: 120
    stdout_contains: "PASS"
    command: |
      set -euo pipefail
      python3 - <<'PY'
      import sqlite3
      import os
      import zipfile

      # Check Zotero
      db_path = os.path.expanduser("~/Zotero/zotero.sqlite")
      if not os.path.exists(db_path):
          raise SystemExit("ZOTERO_DB_NOT_FOUND")

      conn = sqlite3.connect(db_path)
      cur = conn.cursor()

      cur.execute("SELECT collectionName FROM collections WHERE collectionName='Nobel Laureates'")
      if not cur.fetchone():
          raise SystemExit("COLLECTION_NOT_FOUND")

      cur.execute("""
          SELECT DISTINCT idv.value FROM items i
          JOIN itemData id ON i.itemID = id.itemID
          JOIN fields f ON id.fieldID = f.fieldID
          JOIN itemDataValues idv ON id.valueID = idv.valueID
          WHERE f.fieldName = 'title'
          AND idv.value IN ('A Brief History of Time', 'The Structure of Scientific Revolutions', 'Surely You''re Joking, Mr. Feynman!')
      """)
      items = cur.fetchall()
      if len(items) != 3:
          raise SystemExit(f"EXPECTED_3_ITEMS_GOT_{len(items)}")

      cur.execute("SELECT DISTINCT name FROM tags WHERE name IN ('physics', 'popular-science')")
      tags = cur.fetchall()
      if len(tags) != 2:
          raise SystemExit(f"EXPECTED_2_TAGS_GOT_{len(tags)}")

      conn.close()

      # Check BibTeX
      bib_path = os.path.expanduser("~/Documents/nobel.bib")
      if not os.path.exists(bib_path):
          raise SystemExit("BIBTEX_FILE_NOT_FOUND")

      # Check Writer
      odt_path = os.path.expanduser("~/Documents/nobel_list.odt")
      if not os.path.exists(odt_path):
          raise SystemExit("WRITER_FILE_NOT_FOUND")

      with zipfile.ZipFile(odt_path, 'r') as z:
          content = z.read('content.xml').decode('utf-8')
      if "Nobel Laureates Reading List" not in content:
          raise SystemExit("MISSING_HEADING")

      # Check Impress
      odp_path = os.path.expanduser("~/Documents/nobel_presentation.odp")
      if not os.path.exists(odp_path):
          raise SystemExit("IMPRESS_FILE_NOT_FOUND")

      print("PASS")
      PY
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - linux
  - cross_app
  - zotero
  - writer
  - impress
  - bibliography
  - three_app
  - hard
  app_name: zotero + libreoffice_writer + libreoffice_impress
  difficulty: hard
  description: Create a Zotero collection with 3 books, add tags, export as BibTeX,
    create a reading list in Writer, then create a bibliography presentation
    in Impress with the BibTeX file inserted.
