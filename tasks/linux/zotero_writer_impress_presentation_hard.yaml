task_id: linux.cross_app.zotero_writer_impress_presentation_hard
platform: linux
instruction: >
  Open Zotero. Create a new collection named "Nobel Laureates" under My Library.
  Add three Book items to this collection:
  1. "A Brief History of Time" by Stephen Hawking
  2. "The Structure of Scientific Revolutions" by Thomas Kuhn
  3. "Surely You're Joking, Mr. Feynman!" by Richard Feynman
  Add the tag "physics" to all three items. Add the tag "popular-science"
  to items 1 and 3.
  Select the "Nobel Laureates" collection. Go to File → Export Collection.
  In the export dialog, choose "BibTeX" format and export. The file will be
  saved to /home/user/Documents/nobel.bib.
  Then switch to the already-open LibreOffice Writer window. Create a new
  document with the heading "Nobel Laureates Reading List" and include:
  "Collection: Nobel Laureates
  Tags: physics, popular-science
  Books:
  1. A Brief History of Time - Stephen Hawking
  2. The Structure of Scientific Revolutions - Thomas Kuhn
  3. Surely You're Joking, Mr. Feynman! - Richard Feynman"
  Save the Writer document as /home/user/Documents/nobel_list.odt.
  Then switch to the already-open LibreOffice Impress window. Create a new
  presentation. On the first slide, use Insert → Text Box to add a text box
  and type "Nobel Laureates Bibliography" as the title. Then use Insert →
  File to insert the BibTeX file /home/user/Documents/nobel.bib. Save the
  presentation as /home/user/Documents/nobel_presentation.odp.
  Finish after all files exist.
