platform: linux
instruction: 'Create an Operations Readiness Canvas in the app.diagrams.net draw.io editor currently open
  in Chrome, starting from the blank canvas. The final diagram must consist of fourteen rectangle shapes
  arranged in a specific layout. At the top, place a single title rectangle labeled "Operations Readiness
  Canvas" with bold text, sized to be wider than the other boxes. Below the title, arrange four rows of
  three rectangles each. The first row must contain boxes labeled "Mission Confirmed", "Owner Assigned",
  and "Timeline Locked" from left to right. The second row must contain boxes labeled "Intake Checklist",
  "Risk Register", and "Dependency Map" from left to right. The third row must contain boxes labeled "Runbook
  Published", "Staffing Roster", and "Escalation Path" from left to right. The fourth row must contain
  boxes labeled "Monitoring Live", "Comms Ready", and "Review Scheduled" from left to right. Ensure that
  the boxes in each row are roughly horizontally aligned and that the rows are stacked vertically without
  overlapping. Below the fourth row, place a final, wider status rectangle labeled "Status: readiness
  approved" with bold text. All text must be fully visible within its respective box, and no boxes should
  overlap. Do not include any images, icons, connectors, or unrelated text, and do not delete any correctly
  completed boxes. Once the diagram is complete, save it as a file named "operations_readiness_canvas.drawio"
  using the default local download option. Leave the completed Operations Readiness Canvas open in the
  draw.io editor within the maximized Chrome window, without closing the browser, refreshing the page,
  switching tabs, or opening another file.'
