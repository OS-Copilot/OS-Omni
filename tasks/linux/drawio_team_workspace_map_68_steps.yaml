platform: linux
instruction: 'Create a complete office seating diagram in the draw.io editor and save it as a file named
  team_workspace_map.drawio. The diagram must consist of a large outer rectangle positioned in the central
  area of the canvas, labeled "Team Workspace Map", which has a very light gray or no fill and a border
  that is slightly more prominent than standard shapes. Inside this outer frame, arrange nine small rectangles
  in a neat three-by-three grid, with the top row containing "Desk A1", "Desk A2", and "Desk A3" from
  left to right, the middle row containing "Desk B1", "Desk B2", and "Desk B3" from left to right, and
  the bottom row containing "Desk C1", "Desk C2", and "Desk C3" from left to right. All nine desk rectangles
  must be filled with a light blue color. A circle labeled "Focus Room" with a light green fill must be
  placed in the upper right interior of the outer frame, sized so the text is fully visible. A diamond
  shape labeled "Meeting Point" with a light yellow fill must be placed in the middle right area of the
  outer frame, to the right of the desk grid. A cloud or rounded shape labeled "Coffee Area" with a light
  orange fill must be placed in the lower right interior of the outer frame, positioned so it does not
  overlap any other shapes. Below the outer frame, add a text box containing the exact string "Capacity:
  9 desks + 3 shared zones". All text must be fully displayed without being clipped, and all shapes must
  be contained within the outer frame except for the capacity text box. The Chrome window must remain
  open and maximized, displaying the finished seating diagram without any browser refresh, tab switching,
  or closing of the application.'
