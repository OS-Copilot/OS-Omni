instruction: 'Create a complete Incident Response Board diagram in the draw.io editor open in Chrome and
  save it as incident_response_board.drawio. The diagram must feature a main title box at the top, constructed
  from a rounded rectangle, displaying the text "Incident Response Board" in bold with a font size larger
  than that of all other shapes. Beneath the title, arrange four distinct rows of shapes. The first row
  must contain three standard rectangles labeled "Alert Received", "Initial Triage", and "Severity Checked",
  aligned horizontally and filled with a uniform light blue color. The second row, positioned directly
  below the first, must include a diamond labeled "Customer Impact?" on the left, a standard rectangle
  labeled "Incident Lead Named" in the middle, and a standard rectangle labeled "Status Page Drafted"
  on the right, all filled with a uniform light green color. The third row, positioned below the second,
  must include a standard rectangle labeled "Rollback Prepared" on the left, a diamond labeled "Mitigation
  Working?" in the middle, and a standard rectangle labeled "Fix Validated" on the right, all filled with
  a uniform light yellow color. The fourth row, positioned below the third, must consist of three note-style
  shapes or annotation boxes labeled "Comms Sent", "Exec Updated", and "Postmortem Planned", filled with
  a uniform light orange color. Below all four rows, place a wider standard rectangle as a status box
  containing the text "Overall Status: contained" in bold, ensuring the box is wide enough to display
  the text completely without truncation. All shapes must be positioned so that they do not overlap each
  other, and the status box must be located at the very bottom of the layout. The diagram must not contain
  any text such as "Process", "Text", "Label", or "Untitled Diagram". Upon completion, the file must be
  saved with the name incident_response_board.drawio, the browser window must remain maximized, the draw.io
  tab must remain active, and the page must not be refreshed or closed.'
