instruction: |-
  Claim the voucher code WELCOME12 in the Wallet section of the OpenFood application.

  Place an order from Deep Dish Works containing Deep Dish Pizza with a quantity of 2, Italian Beef Sandwich with a quantity of 2, and Chicago Hot Dog with a quantity of 1, applying the WELCOME12 coupon. The Restaurants section search configuration must display results for the query "pizza" with the Cuisine filter set to Pizza and the Sort option set to Recommended.

  Advance the status of the most recent order twice and initiate a reorder from it. In the resulting cart, increase the quantity of any single dish by one, apply the WELCOME12 coupon, and place the order. Advance the status of the newest order twice and initiate another reorder. In this new cart, increase the quantity of three distinct dish rows by one each, apply the WELCOME12 coupon, and place the order. Advance the status of the newest order twice.

  Create a support ticket with the subject "qa70", the Order ID "OF-2001", and the message "qa70 delivery issue".

  In the Merchant section, mark the Dumpling Room No. 20 San Jose CA as closed and set the availability of Pork Dumplings, Beef Chow Fun, and Mapo Tofu to true. Mark the Santana Row Banh Mi Market No. 12 San Jose CA as closed and set the availability of the first and second dish rows in that card to true.

  In the Courier section, advance the status of the D-331 - Central La Jolla Poke No. 21 San Diego CA delivery to the next step and advance the status of the D-332 - Old Town Pho House 37 - San Jose CA delivery to the next step. Accept the route for any delivery card that currently has a status of Needs courier.
