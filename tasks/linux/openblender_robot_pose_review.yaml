task_id: linux.openblender.robot_pose_review
platform: linux
instruction: |-
  Configure the robot arm pose-library animation in the OpenBlender application by loading the project robot_arm_rig_v03_pose_library.blend from the Recent Files list with the Animation workspace active, and save the project to persist all pose-library animations, mechanical-arm keyframes, the new review target, material edits, and output settings.

  The IK_Target_Control object must have its Location set to X 1.55, Y -0.25, and Z 2.28, and its Scale set to X 0.24, Y 0.24, and Z 0.24, with a keyframe inserted at frame 64 to record this initial pose. The timeline must be set to frame 96, and the IK_Target_Control Location must be updated to X 1.30, Y 0.20, and Z 1.95, with a keyframe inserted to save this second pose.

  The Upper_Arm_IK_Link object must have its Rotation Z set to -24, Location X set to 0.20, and Location Z set to 1.05, with a keyframe inserted at frame 96. The Forearm_IK_Link object must have its Rotation Z set to -62, Location X set to 0.88, and Location Z set to 1.82, with a keyframe inserted at frame 96. The Gripper_Pose_Snapshot object must have its Location set to X 1.54, Y 0.18, and Z 1.86, Rotation Z set to 12, and Scale X and Y set to 0.30, with a keyframe inserted at frame 96. For the Gripper_Pose_Snapshot, the material Preview Glass must be assigned, and the material properties must be adjusted so that Roughness is 0.12 and Metallic is 0.10.

  The Robot_Base_Rotation object must have its Rotation Z set to 6, Scale X set to 0.86, and Scale Y set to 0.86, with a keyframe inserted at frame 96. A duplicate of the IK_Target_Control object must be created, and the newly created copy must be renamed to Pose_Target_Review in the Scene Collection. The Pose_Target_Review object must have its Location set to X 1.30, Y 0.20, and Z 1.95, with Scale X, Y, and Z all set to 0.12, and the material Orange Clay must be assigned to this new object.

  The render output settings must be configured by setting the Engine to Workbench, Resolution to 1280 x 720, Samples to 64, and FPS to 24. The output Path must be set to //renders/robot_pose_review.
