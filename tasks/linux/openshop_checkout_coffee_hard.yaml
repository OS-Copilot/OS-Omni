task_id: linux.openshop.checkout_coffee
platform: linux
instruction: >
  In OpenShop, sign in with phone number 13800138000 and password spring2026.
  Use the Desktop file OpenShop_Checkout_Request.txt as the source of truth.
  Add the six requested products to one cart with the requested option/spec and
  quantity 1 for each item. Proceed to checkout using the Office shipping
  address and WeChat Pay. Enter the exact order note Office delivery only; keep
  all six selected products in one shipment after final review. Submit the
  order. After submission, create /home/user/Desktop/OpenShop_Order_Receipt.txt
  with exactly these six non-empty lines in this order: order_status=Awaiting
  Shipment, address=Office, payment=WeChat Pay, item_count=6, order_total=1282,
  note=Office delivery only; keep all six selected products in one shipment
  after final review.
init:
  initializer_id: initializers.linux.openshop:OpenShopInitializer
  params:
    app_command: openshop
    benchmark_mode: linux.openshop.checkout_receipt
    require_benchmark_api: true
    cleanup_paths:
      - /home/user/Desktop/OpenShop_Order_Receipt.txt
    seed_files:
      - path: /home/user/Desktop/OpenShop_Checkout_Request.txt
        content: |
          OpenShop checkout request
          Account phone: 13800138000
          Shipping address: Office
          Payment: WeChat Pay
          Note: Office delivery only; keep all six selected products in one shipment after final review.
          Items:
          - Verdant Pro Noise-Canceling Headphones | Electronics | Price High to Low | Bluetooth 5.4 | quantity 1
          - Mountain Isle Pour-Over Coffee 20 Pack | Grocery | Price Low to High | 20 sachets | quantity 1
          - Lumen Magnetic Phone Stand | Electronics | Price Low to High | Magnetic mount | quantity 1
          - Polar Day Slim Business Backpack | Bags | Price High to Low | 15.6-inch fit | quantity 1
          - Mukawa Folding Camping Table and Chair Set | Home | Price High to Low | Storage bag | quantity 1
          - Garden White Cotton Bedding Set 1.8m | Home | Price Low to High | 200x230cm | quantity 1
evaluation:
  evaluator_id: evaluators.linux.openshop:OpenShopApiEvaluator
  params:
    session:
      logged_in: true
      phone: '13800138000'
    cart:
      item_count: 0
      total: 0
    orders:
      count: 1
      latest:
        status: Awaiting Shipment
        address_label: Office
        payment_id: wechat
        payment_label: WeChat Pay
        note: Office delivery only; keep all six selected products in one shipment after final review.
        total: 1282
        item_count: 6
        items:
        - product_id: p1001
          quantity: 1
          selected_spec: Bluetooth 5.4
        - product_id: p1005
          quantity: 1
          selected_spec: 20 sachets
        - product_id: p1006
          quantity: 1
          selected_spec: Magnetic mount
        - product_id: p1004
          quantity: 1
          selected_spec: 15.6-inch fit
        - product_id: p1002
          quantity: 1
          selected_spec: Storage bag
        - product_id: p1003
          quantity: 1
          selected_spec: 200x230cm
    text_artifacts:
      - path: /home/user/Desktop/OpenShop_Order_Receipt.txt
        equals: |
          order_status=Awaiting Shipment
          address=Office
          payment=WeChat Pay
          item_count=6
          order_total=1282
          note=Office delivery only; keep all six selected products in one shipment after final review.
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - linux
  - gui
  - shopping
  - openshop
  - checkout
  - file_handoff
  - hard
  description: Use a desktop checkout request file to build a six-item OpenShop
    order, submit it to the Office address with WeChat Pay, and write an order
    receipt file.
  oracle_task: tasks/linux/oracle/openshop_checkout_coffee_oracle.yaml
  oracle_model: openshop_oracle
  difficulty: hard
