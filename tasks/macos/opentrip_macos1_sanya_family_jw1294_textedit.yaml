  to Sanya on June 13, 2026, in the Business cabin class, including the 23kg checked bag option, selecting
  Maya Chen · Passport as the traveler, using the contact phone number 13900004302, and the payment method
  Bank Card · Credit or debit card. The return flight booking must be for the first flight card in the
  results from Sanya (SYX) to Shanghai (SHA) on June 16, 2026, sorted by Lowest price, including the 15kg
  checked bag option, using the contact phone number 13900004303, and the payment method WeChat Pay ·
  Scan or authorize payment. The TextEdit document must be a new plain text file containing exactly three
  lines: DATES=JUN13-16, HOTEL=FAMILY CARD, and OUT=JW1294 RET15, saved as Sanya-Jun13.txt to the Desktop
  of the macOS1 guest. The task is complete when the three bookings are confirmed with the specified details
  and the TextEdit application is the foreground window displaying the saved plain text file, without
  signing out of the Lucas Lin account or saving the file to the host machine.'
