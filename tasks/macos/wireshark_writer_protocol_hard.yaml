task_id: macos.cross_app.wireshark_writer_protocol_hard
platform: macos
instruction: >
  Open the seeded Wireshark capture /Users/bench/Downloads/retail_mix.pcapng.
  In the display filter bar at the top, type "udp" and press Enter or click
  the Apply button to apply the filter. Count the number of displayed UDP
  packets shown in the packet list.
  Then clear the filter by clicking the Clear button (X icon) next to the
  filter bar.
  Now type "icmp" in the filter bar and apply it. Count the number of
  displayed ICMP packets.
  Then clear the filter again.
  Now type "tcp.port == 80" in the filter bar and apply it. Count the
  number of displayed packets.
  Then switch to the already-open LibreOffice Writer window. Create a new
  document with the heading "Protocol Analysis Report" and include:
  "UDP Packets: [your count]
  ICMP Packets: [your count]
  TCP Port 80 Packets: [your count]"
  Save the Writer document as /Users/bench/Documents/protocol_report.odt.
  Finish after the document is saved.
init:
  initializer_id: initializers.macos.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: |
        set -e
        killall Wireshark >/dev/null 2>&1 || true
        killall soffice.bin >/dev/null 2>&1 || true
        killall soffice >/dev/null 2>&1 || true
        mkdir -p /Users/bench/Downloads /Users/bench/Documents
        python3 - <<'PY'
from pathlib import Path
from urllib.request import urlopen
url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/wireshark/C9CCC440-B4EE-407E-B53D-B389ED564F8E/retail_mix.pcapng"
out = Path("/Users/bench/Downloads/retail_mix.pcapng")
out.parent.mkdir(parents=True, exist_ok=True)
out.write_bytes(urlopen(url).read())
PY
    - type: wait
      ms: 1200
    - type: run_bash
      script: |
        open -a Wireshark /Users/bench/Downloads/retail_mix.pcapng
    - type: wait
      ms: 10000
    - type: run_bash
      script: |
        /Applications/LibreOffice.app/Contents/MacOS/soffice --writer
    - type: wait
      ms: 5000
evaluation:
  evaluator_id: evaluators.macos.command_check:CommandCheckEvaluator
  params:
    timeout: 120
    stdout_contains: "PASS"
    command: |
      set -euo pipefail
      python3 - <<'PY'
      import os
      import zipfile

      expected_headings = [
          "Protocol Analysis Report",
          "UDP Packets:",
          "ICMP Packets:",
          "TCP Port 80 Packets:"
      ]

      odt_path = os.path.expanduser("~/Documents/protocol_report.odt")
      if not os.path.exists(odt_path):
          raise SystemExit("WRITER_FILE_NOT_FOUND")

      with zipfile.ZipFile(odt_path, 'r') as z:
          content = z.read('content.xml').decode('utf-8')

      for value in expected_headings:
          if value not in content:
              raise SystemExit(f"MISSING_VALUE_{value.replace(' ', '_').replace(':', '')}")

      print("PASS")
      PY
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - macos
  - cross_app
  - wireshark
  - writer
  - network
  - filter
  - protocol
  - hard
  app_name: wireshark + libreoffice_writer
  difficulty: hard
  description: Apply 3 different display filters in Wireshark (udp, icmp, tcp.port==80),
    count packets for each, then create a protocol analysis report in Writer
    with those counts.
