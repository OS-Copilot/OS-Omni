task_id: macos.actual_budget.create_travel_fund_account
platform: macos
instruction: |
  Open Actual Budget and set up a travel spending ledger.

  If no local budget is open yet, create one in the default location. Then:

  1. Create a local account named "Travel Fund" with an opening balance of $2,500.
  2. Add these three spending transactions in Travel Fund:
     - A payment of $640 to "SkyJet" in Flights
     - A payment of $480 to "Harbor Hotel" in Lodging
     - A payment of $75 to "Metro Pass" in Local Transit

  Finish only after all three transactions are saved in the Travel Fund account.
init:
  initializer_id: initializers.macos.actual_budget:ActualBudgetInitializer
  params:
    wait_ms: 2500
evaluation:
  evaluator_id: evaluators.macos.actual_budget:ActualBudgetEvaluator
  params:
    mode: add_transactions
    account_name: Travel Fund
    opening_balance: 2500
    transactions:
    - payee: SkyJet
      category: Flights
      amount: 640
    - payee: Harbor Hotel
      category: Lodging
      amount: 480
    - payee: Metro Pass
      category: Local Transit
      amount: 75
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  difficulty: hard
