task_id: macos.oracle.zotero.reference_library_buildout
platform: macos
instruction: Oracle sanity task for macos.zotero.reference_library_buildout. Wait briefly and finish.
init:
  initializer_id: initializers.macos.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: 'set -e

        killall Safari >/dev/null 2>&1 || true

        pkill -x Zotero >/dev/null 2>&1 || true

        '
    - type: launch
      app_name: Zotero
    - type: wait
      ms: 7000
    - type: action
      action:
        type: tap
        target:
          text: 完成
      optional: true
    - type: action
      action:
        type: tap
        target:
          text: 不要再询问
      optional: true
    - type: action
      action:
        type: tap
        target:
          text: 稍后提醒我
      optional: true
    - type: run_bash
      script: "set -e\nosascript <<'APPLESCRIPT'\ntell application \"Zotero\" to activate\ntell application \"System Events\"\
        \n  tell process \"Zotero\"\n    set position of window 1 to {80, 80}\n    set size of window 1 to {1320, 860}\n \
        \ end tell\nend tell\nAPPLESCRIPT\n"
    - type: wait
      ms: 1000
evaluation:
  evaluator_id: evaluators.macos.zotero:ZoteroLibraryEvaluator
  params:
    required_collections:
    - Reference Shelf
    - AI Papers
    - Project Notes
    required_items:
    - title: Designing Data-Intensive Applications
      item_type: book
      collections:
      - Reference Shelf
    - title: BERT
      item_type: journalArticle
      collections:
      - AI Papers
    - title: Benchmark Plan
      item_type: report
      collections:
      - Project Notes
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  oracle_for: macos.zotero.reference_library_buildout
  human_steps: 20
  tags:
    - oracle
  difficulty: hard
