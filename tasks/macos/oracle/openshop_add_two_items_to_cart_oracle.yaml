task_id: macos.openshop.oracle.add_two_items_to_cart
platform: macos
instruction: In OpenShop, first sign in with phone number 13800138000 and password spring2026. Search for Verdant Pro Noise-Canceling Headphones, open the product, and add exactly one item with the Bluetooth 5.4 option to the cart. Then return to search, find Mountain Isle Pour-Over Coffee 20 Pack, open that product, and add exactly one item with the 20 sachets option to the cart. Open the cart and stop only when both products are listed there together with the benchmark discount still applied.
