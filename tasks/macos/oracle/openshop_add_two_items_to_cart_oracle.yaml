      logged_in: true
      phone: '13800138000'
      user_name: Lucas Lin
    cart:
      item_count: 2
      subtotal: 365
      shipping: 12
      discount: 30
      total: 347
      items:
        - product_id: p1001
          quantity: 1
          selected_spec: Bluetooth 5.4
        - product_id: p1005
          quantity: 1
          selected_spec: 20 sachets
    orders:
      count: 0
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
