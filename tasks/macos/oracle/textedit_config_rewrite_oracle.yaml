task_id: macos.oracle.textedit.config_rewrite
platform: macos
instruction: Oracle sanity task for macos.textedit.config_rewrite. Wait briefly and finish.
init:
  initializer_id: initializers.macos.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: 'set -e

        killall TextEdit >/dev/null 2>&1 || true

        rm -f /Users/bench/Downloads/app.ini

        '
    - type: upload_file
      local_path: ../files/textedit/config_rewrite/start/app.ini
      path: /Users/bench/Downloads/app.ini
    - type: run_bash
      script: 'set -e

        open -a TextEdit /Users/bench/Downloads/app.ini

        '
    - type: wait
      ms: 2500
    - type: run_bash
      script: "set -e\nosascript <<'APPLESCRIPT'\ntell application \"System Events\"\n  tell process \"TextEdit\"\n    set position of window 1 to {90, 90}\n    set size of window 1 to {1300, 860}\n  end tell\nend tell\nAPPLESCRIPT\n"
    - type: wait
      ms: 1000
evaluation:
  evaluator_id: evaluators.macos.textedit:TextEditFileEvaluator
  params:
    actual_path: /Users/bench/Downloads/app.ini
    expected_path: ../files/textedit/config_rewrite/expected/app.ini
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  oracle_for: macos.textedit.config_rewrite
  human_steps: 20
  tags:
    - oracle
  difficulty: hard
