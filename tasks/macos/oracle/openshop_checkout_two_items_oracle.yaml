task_id: macos.openshop.oracle.checkout_two_items
platform: macos
instruction: In OpenShop, first sign in with phone number 13800138000 and password spring2026. Search for Verdant Pro Noise-Canceling Headphones and add exactly one item with the Bluetooth 5.4 option to the cart. Then search for Mountain Isle Pour-Over Coffee 20 Pack and add exactly one item with the 20 sachets option to the cart. Open the cart, proceed to checkout, choose the Office shipping address, choose WeChat Pay, enter the order note 'Leave it at reception before 6 PM.', and place the order.
init:
  initializer_id: initializers.macos.openshop:OpenShopInitializer
  params:
    final_wait_ms: 900
evaluation:
  evaluator_id: evaluators.macos.openshop:OpenShopMacOSApiEvaluator
  params:
    session:
      logged_in: true
      phone: '13800138000'
      user_name: Lucas Lin
    cart:
      item_count: 0
      total: 0
    orders:
      count: 1
      latest:
        status: Awaiting Shipment
        total: 347
        address_label: Office
        address_receiver: Lucas Lin
        address_full: Floor 7, Tower A, 88 Boyun Road, Zhangjiang, Pudong, Shanghai
        payment_id: wechat
        payment_label: WeChat Pay
        payment_desc: Scan to pay
        note: Leave it at reception before 6 PM.
        item_count: 2
        items:
          - product_id: p1001
            quantity: 1
            selected_spec: Bluetooth 5.4
          - product_id: p1005
            quantity: 1
            selected_spec: 20 sachets
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  oracle_for: macos.openshop.checkout_two_items
  human_steps: 20
  tags:
    - oracle
  difficulty: hard
