task_id: macos.oracle.wireshark.protocol_hierarchy_http
platform: macos
instruction: Oracle sanity task for macos.wireshark.protocol_hierarchy_http. Wait
  briefly and finish.
init:
  initializer_id: initializers.macos.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: |
        set -e
        defaults write org.wireshark.Wireshark SUEnableAutomaticChecks -bool false || true
        killall Wireshark >/dev/null 2>&1 || true
        APP_PATH=""
        for candidate in "$HOME/Applications/Wireshark.app" "/Applications/Wireshark.app"; do
          if [ -d "$candidate" ]; then
            APP_PATH="$candidate"
            break
          fi
        done
        if [ -z "$APP_PATH" ]; then
          APP_PATH="$(mdfind 'kMDItemFSName == "Wireshark.app"' | head -n 1 || true)"
        fi
        [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ] || { echo "Wireshark.app missing from ~/Applications, /Applications, and Spotlight" >&2; exit 1; }
    - type: upload_file
      local_path: ../../../platforms/windows/vm/setup/sample.pcapng
      path: /Users/bench/Downloads/sample.pcapng
    - type: run_bash
      script: |
        set -e
        APP_PATH=""
        for candidate in "$HOME/Applications/Wireshark.app" "/Applications/Wireshark.app"; do
          if [ -d "$candidate" ]; then
            APP_PATH="$candidate"
            break
          fi
        done
        if [ -z "$APP_PATH" ]; then
          APP_PATH="$(mdfind 'kMDItemFSName == "Wireshark.app"' | head -n 1 || true)"
        fi
        [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ] || { echo "Wireshark.app missing from ~/Applications, /Applications, and Spotlight" >&2; exit 1; }
        open -a "$APP_PATH" /Users/bench/Downloads/sample.pcapng
    - type: wait
      ms: 5000
    - type: run_bash
      script: |
        set -e
        osascript <<'APPLESCRIPT'
        tell application "System Events"
          tell process "Wireshark"
            try
              if exists window "Software Update" then
                tell window "Software Update"
                  click button "Remind Me Later"
                end tell
                delay 0.5
              end if
            end try
            click menu bar item "Statistics" of menu bar 1
            delay 0.4
            click menu item "Protocol Hierarchy" of menu 1 of menu bar item "Statistics" of menu bar 1
            delay 0.5
            click menu bar item "Statistics" of menu bar 1
            delay 0.4
            click menu item "Conversations" of menu 1 of menu bar item "Statistics" of menu bar 1
            delay 0.8
            try
              set position of window "Wireshark · Conversations · sample.pcapng" to {40, 107}
              set size of window "Wireshark · Conversations · sample.pcapng" to {750, 445}
            end try
            try
              set position of window "Wireshark · Protocol Hierarchy Statistics · sample.pcapng" to {860, 107}
              set size of window "Wireshark · Protocol Hierarchy Statistics · sample.pcapng" to {760, 445}
            end try
            try
              if exists window "Software Update" then
                tell window "Software Update"
                  click button "Remind Me Later"
                end tell
                delay 0.5
              end if
            end try
          end tell
        end tell
        APPLESCRIPT
    - type: wait
      ms: 1500
evaluation:
  evaluator_id: evaluators.macos.wireshark:WiresharkObservationEvaluator
  params:
    refresh_observation: true
    required_window_title_substrings:
    - Wireshark · Protocol Hierarchy Statistics ·
    - Wireshark · Conversations ·
    foreground_window_title_substring: Wireshark · Protocol Hierarchy Statistics ·
    required_texts:
    - TCP · 1
    required_exact_values:
    - Hypertext
    scripted_combobox_any_texts:
    - http
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  oracle_for: macos.wireshark.protocol_hierarchy_http
  human_steps: 20
  tags:
    - oracle
  difficulty: hard
