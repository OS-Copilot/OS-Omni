task_id: macos.oracle.gimp.rotate_export_png
platform: macos
instruction: Oracle sanity task for macos.gimp.rotate_export_png. Wait briefly and finish.
init:
  initializer_id: initializers.macos.gimp:GimpInitializer
  params:
    wait_ms: 18000
    upload_files:
    - local_path: tasks/macos/files/gimp/rotate/start/gimp_rotate_input.png
      path: /Users/bench/Downloads/gimp_rotate_input.png
    open_file: /Users/bench/Downloads/gimp_rotate_input.png
evaluation:
  evaluator_id: evaluators.macos.gimp:GimpFileEvaluator
  params:
    actual_path: /Users/bench/Downloads/gimp_rotate_input.png
    expected_width: 600
    expected_height: 900
    expected_format: PNG
    expected_image_path: ../files/gimp/rotate/expected/gimp_rotate_output.png
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  oracle_for: macos.gimp.rotate_export_png
  human_steps: 10
  tags:
    - oracle
  difficulty: easy
