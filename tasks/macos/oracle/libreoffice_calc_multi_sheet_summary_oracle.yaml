        A2: Alpha
        A3: Beta
        A4: Gamma
      Summary:
        A1: Product
        B1: Q1 Revenue
        C1: Q2 Revenue
        D1: Q3 Revenue
        E1: Total Revenue
        F1: Average Revenue
        A2: Alpha
        A3: Gamma
        A4: Beta
        A5: Grand Total
    per_sheet_expected_numeric_cells:
      Q1:
        B2: 120
        C2: 36000
        B3: 85
        C3: 25500
        B4: 200
        C4: 40000
      Q2:
        B2: 150
        C2: 45000
        B3: 90
        C3: 27000
        B4: 180
        C4: 36000
      Q3:
        B2: 130
        C2: 39000
        B3: 110
        C3: 33000
        B4: 160
        C4: 32000
      Summary:
        B2: 36000
        C2: 45000
        D2: 39000
        E2: 120000
        F2: 40000
        B3: 40000
        C3: 36000
        D3: 32000
        E3: 108000
        F3: 36000
        B4: 25500
        C4: 27000
        D4: 33000
        E4: 85500
        F4: 28500
        E5: 313500
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  oracle_for: macos.libreoffice.calc.multi_sheet_summary
  human_steps: 20
  tags:
    - oracle
  difficulty: hard
