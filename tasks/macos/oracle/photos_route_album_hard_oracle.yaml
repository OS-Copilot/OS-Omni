task_id: macos.photos.oracle.route_album_hard
platform: macos
instruction: Oracle sanity task for macos.photos.route_album_hard. Import the route finals and create the route album.
init:
  initializer_id: initializers.macos.photos:PhotosInitializer
  params:
    mode: import_prompt
    open_files:
      - blue_route_card_final_1740.png
      - blue_route_map_final_303.png
      - blue_route_cover_final_501.png
    final_wait_ms: 1500
evaluation:
  evaluator_id: evaluators.macos.photos:PhotosStateEvaluator
  params:
    required_texts:
      - Final Client Set - Blue Route
    any_text_groups:
      - - Photos
        - 照片
      - - Albums
        - 相簿
    expected_assets:
      - blue_route_card_final_1740.png
      - blue_route_map_final_303.png
      - blue_route_cover_final_501.png
    forbidden_assets:
      - client_receipt_blue_final_774.png
      - client_receipt_green_final_610.png
      - client_receipt_red_final_203.png
      - receipt_blue_draft_774.png
      - client_receipt_green_backup_610.png
      - blue_route_card_hold_1740.png
      - red_route_cover_final_501.png
    exact_asset_set: true
    albums:
      - title: Final Client Set - Blue Route
        expected_assets:
          - blue_route_card_final_1740.png
          - blue_route_map_final_303.png
          - blue_route_cover_final_501.png
        forbidden_assets:
          - client_receipt_blue_final_774.png
          - client_receipt_green_final_610.png
          - client_receipt_red_final_203.png
          - receipt_blue_draft_774.png
          - client_receipt_green_backup_610.png
          - blue_route_card_hold_1740.png
          - red_route_cover_final_501.png
        exact_assets: true
        min_count: 3
metadata:
  app: Photos
  app_name: apple-photos
  difficulty: hard
  tags: [macos, gui, photos, native, hard, oracle]
  human_steps: 48
  oracle_for: macos.photos.route_album_hard
  oracle_model: macos_script_oracle
  oracle_actions:
    - type: run_bash_script
      timeout: 75
      script: |
        osascript <<'APPLESCRIPT' >/dev/null 2>&1 || true
        on clickWalk(e, targetName, depth)
          if depth > 12 then return false
          tell application "System Events"
            set roleName to ""
            set titleName to ""
            set descName to ""
            set valueName to ""
            try
              set roleName to role of e
            end try
            try
              set titleName to title of e
            end try
            try
              set descName to description of e
            end try
            try
              set valueName to value of e as text
            end try
            if (roleName is "AXButton" or roleName is "AXCheckBox") and (titleName is targetName or descName is targetName or valueName is targetName) then
              click e
              return true
            end if
            try
              repeat with k in UI elements of e
                if my clickWalk(k, targetName, depth + 1) then return true
              end repeat
            end try
          end tell
          return false
        end clickWalk

        on clickAlbumMenuItem()
          tell application "System Events"
            tell process "Photos"
              set fileMenu to menu "文件" of menu bar item "文件" of menu bar 1
              repeat with mi in menu items of fileMenu
                try
                  set itemName to name of mi as text
                  if itemName starts with "用所选内容新建相簿" or itemName starts with "New Album with Selection" then
                    click mi
                    return true
                  end if
                end try
              end repeat
            end tell
          end tell
          return false
        end clickAlbumMenuItem

        tell application "Photos" to activate
        tell application "System Events"
          repeat with targetName in {"Import All New Photos", "Import All", "导入所有新照片", "导入全部"}
            tell process "Photos"
              repeat with w in windows
                if my clickWalk(w, targetName as text, 0) then delay 1
              end repeat
            end tell
          end repeat
          tell process "Photos"
            click at {1470, 116}
          end tell
          delay 14
          tell process "Photos"
            set frontmost to true
            key code 0 using command down
          end tell
          delay 1
          my clickAlbumMenuItem()
          delay 3
          tell process "Photos"
            keystroke "Final Client Set - Blue Route"
            key code 36
          end tell
          delay 6
        end tell
        APPLESCRIPT
        sleep 3
    - type: success
      message: Photos route album oracle completed.
limits:
  max_steps: 48
  step_timeout_seconds: 120
