task_id: macos.maps.oracle.walking_route_sf_hard
platform: macos
instruction: Oracle sanity task for macos.maps.walking_route_sf_hard. Wait briefly and finish.
init:
  initializer_id: initializers.macos.maps:MapsInitializer
  params:
    final_wait_ms: 1500
evaluation:
  evaluator_id: evaluators.macos.maps:MapsStateEvaluator
  params:
    required_texts:
      - Walking
      - Palace of Fine Arts
    any_text_groups:
      - - Ferry Building
        - San Francisco Ferry Building
      - - Route
        - Directions
      - - mi
        - km
      - - fastest
        - RouteOverviewCell
metadata:
  app: Maps
  app_name: apple-maps
  difficulty: hard
  tags: [macos, gui, maps, native, hard, oracle]
  human_steps: 45
  oracle_for: macos.maps.walking_route_sf_hard
  oracle_model: macos_script_oracle
  oracle_actions:
    - type: run_bash_script
      timeout: 45
      script: |
        /usr/bin/open "maps://?saddr=37.7955,-122.3937&daddr=37.8021,-122.4484&dirflg=w"
        sleep 5
        osascript -e 'tell application "System Events" to click at {765, 780}' >/dev/null 2>&1 || true
        sleep 1
        /usr/bin/open "maps://?saddr=37.7955,-122.3937&daddr=37.8021,-122.4484&dirflg=w"
        sleep 5
        osascript -e 'tell application "System Events" to click at {765, 780}' >/dev/null 2>&1 || true
        sleep 1
        /usr/bin/open "maps://?saddr=37.7955,-122.3937&daddr=37.8021,-122.4484&dirflg=w"
        sleep 5
        osascript <<'APPLESCRIPT' >/dev/null 2>&1 || true
        tell application "Maps" to activate
        tell application "System Events"
          tell process "Maps"
            try
              set position of window 1 to {80, 80}
              set size of window 1 to {1320, 860}
            end try
            try
              if exists button "Directions" of window 1 then click button "Directions" of window 1
            end try
          end tell
        end tell
        APPLESCRIPT
        sleep 3
    - type: success
      message: Maps walking route oracle completed.
limits:
  max_steps: 100
  step_timeout_seconds: 120
