task_id: macos.maps.oracle.search_ferry_building_easy
platform: macos
instruction: Oracle sanity task for macos.maps.search_ferry_building_easy. Wait briefly and finish.
init:
  initializer_id: initializers.macos.maps:MapsInitializer
  params:
    initial_url: maps://?ll=37.7955,-122.3937&z=16&q=Ferry%20Building%20Marketplace
    final_wait_ms: 1500
evaluation:
  evaluator_id: evaluators.macos.maps:MapsStateEvaluator
  params:
    required_texts:
      - Ferry Building Marketplace
      - Directions
    any_text_groups:
      - - San Francisco CA 94111
        - 37.79550° N, 122.39370° W
      - - Share
        - Add
metadata:
  app: Maps
  app_name: apple-maps
  difficulty: easy
  tags: [macos, gui, maps, native, easy, oracle]
  human_steps: 10
  oracle_for: macos.maps.search_ferry_building_easy
  oracle_model: macos_script_oracle
  oracle_actions:
    - type: run_bash_script
      timeout: 45
      script: |
        /usr/bin/open "maps://?ll=37.7955,-122.3937&z=16&q=Ferry%20Building%20Marketplace"
        sleep 4
        osascript -e 'tell application "System Events" to click at {765, 780}' >/dev/null 2>&1 || true
        sleep 1
        /usr/bin/open "maps://?ll=37.7955,-122.3937&z=16&q=Ferry%20Building%20Marketplace"
        sleep 5
        osascript -e 'tell application "System Events" to click at {765, 780}' >/dev/null 2>&1 || true
        sleep 1
        /usr/bin/open "maps://?ll=37.7955,-122.3937&z=16&q=Ferry%20Building%20Marketplace"
        sleep 5
        osascript <<'APPLESCRIPT' >/dev/null 2>&1 || true
        tell application "Maps" to activate
        tell application "System Events"
          tell process "Maps"
            try
              set position of window 1 to {80, 80}
              set size of window 1 to {1320, 860}
            end try
            try
              click button "Ferry Building Marketplace" of window 1
            end try
          end tell
        end tell
        APPLESCRIPT
        sleep 3
    - type: success
      message: Maps Ferry Building oracle completed.
limits:
  max_steps: 100
  step_timeout_seconds: 120
