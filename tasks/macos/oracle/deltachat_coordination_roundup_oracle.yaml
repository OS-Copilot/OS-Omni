      - chat_name: Alice
        expected_text: Confirmed for 3 PM in Cedar-3.
      - chat_name: Bob
        expected_text: I will send budget-april-v7.xlsx by 5 PM.
      - chat_name: Nora
        expected_text: The coffee restock order is CFX-2048 from Northwind Beans.
      - chat_name: Ops Sprint
        expected_text: "Coordination update: Alice confirmed for 3 PM in Cedar-3, Bob gets budget-april-v7.xlsx by 5 PM, Nora needs CFX-2048 from Northwind Beans."
