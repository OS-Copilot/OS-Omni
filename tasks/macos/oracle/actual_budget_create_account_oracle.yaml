task_id: macos.oracle.actual_budget.create_account
platform: macos
instruction: |-
  Oracle sanity task for macos.actual_budget.create_account. Wait briefly and finish.
init:
  initializer_id: initializers.macos.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: "pkill -x Actual >/dev/null 2>&1 || true\nmkdir -p \"$HOME/Documents/Actual\"\nmkdir -p \"$HOME/Library/Application Support/Actual\"\n"
    - type: wait
      ms: 300
evaluation:
  evaluator_id: evaluators.macos.actual_budget:ActualBudgetEvaluator
  params:
    mode: create_account
    account_name: Checking Account
    opening_balance: 5000
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  oracle_for: macos.actual_budget.create_account
  human_steps: 10
  tags:
    - oracle
  difficulty: easy
