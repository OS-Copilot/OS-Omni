task_id: macos.gimp.rotate_invert_export
platform: macos
instruction: "GIMP is already open with `/Users/bench/Downloads/gimp_overlay_background.png`.\n\nApply the following edits in this exact order:\n\n1. Rotate the image **90 degrees clockwise**.\n2. Rotate the image **90 degrees clockwise** again.\n3. Rotate the image **90 degrees clockwise** a third time.\n4. Rotate the image **90 degrees clockwise** a fourth time.\n5. Rotate the image **90 degrees clockwise** a fifth time.\n6. Rotate the image **90 degrees clockwise** a sixth time.\n7. Rotate the image **90 degrees clockwise** a seventh time.\n8. **Invert** the image colors.\n9. Export the finished composition as a PNG file to:\n   `/Users/bench/Downloads/gimp_overlay_background.png`\n\nIf GIMP asks whether to replace the existing file, choose **Replace**. Use\n**Export As** rather than Save, and stop as soon as the export succeeds.\n"
init:
  initializer_id: initializers.macos.gimp:GimpInitializer
  params:
    wait_ms: 18000
    upload_files:
    - local_path: tasks/macos/files/gimp/overlay/start/gimp_overlay_background.png
      path: /Users/bench/Downloads/gimp_overlay_background.png
    open_file: /Users/bench/Downloads/gimp_overlay_background.png
evaluation:
  evaluator_id: evaluators.macos.gimp:GimpFileEvaluator
  params:
    actual_path: /Users/bench/Downloads/gimp_overlay_background.png
    expected_width: 800
    expected_height: 1200
    expected_format: PNG
    expected_image_path: tasks/macos/files/gimp/overlay/expected/gimp_rotate_invert_output.png
    pixel_tolerance: 1
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  difficulty: hard
