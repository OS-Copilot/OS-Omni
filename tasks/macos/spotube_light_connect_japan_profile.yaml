task_id: macos.spotube.light_connect_japan_profile
platform: macos
instruction: 'Open Spotube and prepare an English light profile for Japan without using login or media search.


  Complete these changes in order:

  1. Set Marketplace Region to **Japan**.

  2. Set the app language to **English**.

  3. Turn **Endless Playback** off.

  4. Set Theme to **Light**.

  5. Turn **Normalize audio** on.

  6. Turn **Connect** on.

  7. Turn **Album color sync** off.

  8. Turn **System title bar** on.

  9. Turn the tray icon on.

  10. Keep **YouTube Audio** as the default audio source.

  11. Leave Spotube open when you finish.

  '
init:
  initializer_id: initializers.macos.spotube:SpotubeInitializer
  params:
    wait_ms: 5000
evaluation:
  evaluator_id: evaluators.macos.spotube:SpotubeEvaluator
  params:
    mode: state_check
    expected_audio_source_plugin_name: YouTube Audio
    expected_locale_contains: '"languageCode":"en"'
    expected_preferences:
      market: JP
      endless_playback: false
      theme_mode: light
      normalize_audio: true
      enable_connect: true
      album_color_sync: false
      system_title_bar: true
      show_system_tray_icon: true
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  difficulty: hard
