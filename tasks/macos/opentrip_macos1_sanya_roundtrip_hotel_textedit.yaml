  booking must be for the Sanya Cloud Terrace Boutique Stay, specifically the Deluxe Twin Room, with a
  check-in date of 2026-06-12 and a check-out date of 2026-06-14 for two guests, sorted by Top rated,
  with the contact phone number set to 13900004012, WeChat Pay selected as the payment method, and the
  note Quiet transfer entered. The return flight booking must be for the first flight card from the results
  of a search for flights from Sanya (SYX) to Shanghai (SHA) on 2026-06-14 in the Business cabin sorted
  by Shortest duration, including a 23kg checked bag, with the traveler identified as Maya Chen (Passport),
  the contact phone number set to 13900004013, and Bank Card selected as the payment method. A new plain
  text document in TextEdit must contain exactly three lines: DATES=JUN12-14, OUT=15KG BUSINESS, and HOTEL=TWIN
  RET23, and must be saved as Sanya-Jun12.txt to the Desktop of the macOS1 guest environment. The task
  is complete when the TextEdit window containing this saved file is the active foreground application
  in the macOS1 guest.'
