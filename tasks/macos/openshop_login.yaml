task_id: macos.openshop.login
platform: macos
instruction: >
  Open OpenShop, sign in with phone number 13800138000 and password
  spring2026, then stop once sign-in is complete.
init:
  initializer_id: initializers.macos.openshop:OpenShopInitializer
  params:
    final_wait_ms: 1800
evaluation:
  evaluator_id: evaluators.macos.openshop:OpenShopMacOSApiEvaluator
  params:
    ui:
      require_foreground: true
      app_names: [OpenShop]
      bundle_ids: [com.killt.openshop]
    session:
      logged_in: true
      phone: '13800138000'
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  difficulty: easy
