task_id: macos.maps.search_ferry_building_easy
platform: macos
instruction: >
  Open Maps, search for "Ferry Building Marketplace San Francisco", open the
  Ferry Building Marketplace place details, and stop with that detail page
  visible.
init:
  initializer_id: initializers.macos.maps:MapsInitializer
  params:
    initial_url: maps://?ll=37.7955,-122.3937&z=16&q=Ferry%20Building%20Marketplace
    final_wait_ms: 3000
evaluation:
  evaluator_id: evaluators.macos.maps:MapsStateEvaluator
  params:
    required_texts:
      - Ferry Building Marketplace
      - Directions
    any_text_groups:
      - - San Francisco CA 94111
        - 37.79550° N, 122.39370° W
      - - Share
        - Add
metadata:
  app: Maps
  app_name: apple-maps
  difficulty: easy
  tags: [macos, gui, maps, native, place-search, easy, single_app, evaluator_backed]
  human_steps: 10
  description: Open the Ferry Building Marketplace place details in Maps.
  hardness: easy-evaluable
  evaluation_standard: foreground Maps state, place title, details affordance, and location/detail text are checked
  oracle_task: tasks/macos/oracle/maps_search_ferry_building_easy_oracle.yaml
limits:
  max_steps: 100
  step_timeout_seconds: 120
