task_id: macos.photos.import_receipts_easy
platform: macos
instruction: >
  In Photos, import the three prepared receipt images from the open import
  window. Stop with the imported items visible in Photos.
init:
  initializer_id: initializers.macos.photos:PhotosInitializer
  params:
    mode: import_prompt
    open_files:
      - client_receipt_blue_final_774.png
      - client_receipt_green_final_610.png
      - client_receipt_red_final_203.png
    final_wait_ms: 2500
evaluation:
  evaluator_id: evaluators.macos.photos:PhotosStateEvaluator
  params:
    any_text_groups:
      - - Photos
        - 照片
      - - Imports
        - 导入项目
    expected_assets:
      - client_receipt_blue_final_774.png
      - client_receipt_green_final_610.png
      - client_receipt_red_final_203.png
    exact_asset_set: true
metadata:
  app: Photos
  app_name: apple-photos
  app_bundle_id: com.apple.Photos
  difficulty: easy
  tags: [macos, gui, photos, native, import, easy, single_app, evaluator_backed]
  human_steps: 8
  description: Import three prepared receipt images into Apple Photos.
  hardness: easy-evaluable
  evaluation_standard: foreground Photos state and exact imported asset set in Photos.sqlite are checked
  oracle_task: tasks/macos/oracle/photos_import_receipts_easy_oracle.yaml
limits:
  max_steps: 100
  step_timeout_seconds: 120
