task_id: macos.blender.set_preview_resolution
platform: macos
instruction: 'Blender has prepared `/Users/bench/Downloads/helloworld_blender_workspace/blender_preview_resolution/product_stage.blend`
  for this run.


  Complete the Blender scene update by setting the output resolution to **1280 x 720**,
  then save the `.blend` file. Stop as soon as the file is saved.

  '
init:
  initializer_id: initializers.macos.blender:BlenderInitializer
  params:
    app_command: blender
    workspace_name: blender_preview_resolution
    scene_name: product_stage.blend
    scene_template: product_stage
    launch_gui: false
evaluation:
  evaluator_id: evaluators.macos.blender:BlenderSceneEvaluator
  params:
    blend_path: /Users/bench/Downloads/helloworld_blender_workspace/blender_preview_resolution/product_stage.blend
    app_command: blender
    render:
      resolution_x: 1280
      resolution_y: 720
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  difficulty: easy
