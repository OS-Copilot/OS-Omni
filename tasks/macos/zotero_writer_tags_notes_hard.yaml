task_id: macos.cross_app.zotero_writer_tags_notes_hard
platform: macos
instruction: >
  Open Zotero. Create a new collection named "Database Systems" under My Library.
  Add three Book items to this collection:
  1. "Designing Data-Intensive Applications" by Martin Kleppmann
  2. "Database System Concepts" by Abraham Silberschatz
  3. "Fundamentals of Database Systems" by Ramez Elmasri
  Add the tag "database" to all three items. To add a tag, select an item,
  then in the right panel click the Tags tab, click Add, and type "database".
  Then add a child note to "Designing Data-Intensive Applications". To add
  a note, right-click the item and select Add Note. Type "Covers distributed
  systems, replication, partitioning, and consistency."
  Select the "Database Systems" collection. Go to File → Export Collection.
  In the export dialog, choose "BibTeX" format and export. The file will
  be saved to /Users/bench/Documents/db_refs.bib.
  Then switch to the already-open LibreOffice Writer window. Create a new
  document with the heading "Database References" and include:
  "Collection: Database Systems
  Tags: database
  Notes: Covers distributed systems, replication, partitioning, and consistency."
  Save the Writer document as /Users/bench/Documents/db_reference_report.odt.
  Finish after both files exist.
init:
  initializer_id: initializers.macos.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: |
        set -e
        killall Zotero >/dev/null 2>&1 || true
        killall soffice.bin >/dev/null 2>&1 || true
        killall soffice >/dev/null 2>&1 || true
        rm -rf ~/Zotero ~/.zotero
        mkdir -p /Users/bench/Documents
    - type: run_bash
      script: |
        open -a Zotero
    - type: wait
      ms: 12000
    - type: action
      action:
        type: tap
        target:
          text: Done
      optional: true
    - type: action
      action:
        type: tap
        target:
          text: Don't Ask Again
      optional: true
    - type: action
      action:
        type: tap
        target:
          text: Remind Me Later
      optional: true
    - type: run_bash
      script: "osascript <<'APPLESCRIPT'\ntell application \"Zotero\" to activate\ntell application \"System Events\"\n  tell process \"Zotero\"\n    set position of window 1 to {80, 80}\n    set size of window 1 to {1320, 860}\n  end tell\nend tell\nAPPLESCRIPT\n"
    - type: wait
      ms: 1000
    - type: run_bash
      script: |
        /Applications/LibreOffice.app/Contents/MacOS/soffice --writer
    - type: wait
      ms: 5000
evaluation:
  evaluator_id: evaluators.macos.command_check:CommandCheckEvaluator
  params:
    timeout: 120
    stdout_contains: "PASS"
    command: |
      set -euo pipefail
      python3 - <<'PY'
      import sqlite3
      import os
      import zipfile

      db_path = os.path.expanduser("~/Zotero/zotero.sqlite")
      if not os.path.exists(db_path):
          raise SystemExit("ZOTERO_DB_NOT_FOUND")

      conn = sqlite3.connect(db_path)
      cur = conn.cursor()

      cur.execute("SELECT collectionName FROM collections WHERE collectionName='Database Systems'")
      if not cur.fetchone():
          raise SystemExit("COLLECTION_NOT_FOUND")

      cur.execute("""
          SELECT DISTINCT idv.value FROM items i
          JOIN itemData id ON i.itemID = id.itemID
          JOIN fields f ON id.fieldID = f.fieldID
          JOIN itemDataValues idv ON id.valueID = idv.valueID
          WHERE f.fieldName = 'title'
          AND idv.value IN ('Designing Data-Intensive Applications', 'Database System Concepts', 'Fundamentals of Database Systems')
      """)
      items = cur.fetchall()
      if len(items) != 3:
          raise SystemExit(f"EXPECTED_3_ITEMS_GOT_{len(items)}")

      cur.execute("SELECT DISTINCT name FROM tags WHERE name = 'database'")
      if not cur.fetchone():
          raise SystemExit("TAG_NOT_FOUND")

      conn.close()

      odt_path = os.path.expanduser("~/Documents/db_reference_report.odt")
      if not os.path.exists(odt_path):
          raise SystemExit("WRITER_FILE_NOT_FOUND")

      with zipfile.ZipFile(odt_path, 'r') as z:
          content = z.read('content.xml').decode('utf-8')

      if "Database References" not in content:
          raise SystemExit("MISSING_HEADING")
      if "database" not in content:
          raise SystemExit("MISSING_TAG_INFO")

      print("PASS")
      PY
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - macos
  - cross_app
  - zotero
  - writer
  - bibliography
  - tags
  - notes
  - hard
  app_name: zotero + libreoffice_writer
  difficulty: hard
  description: Create a Zotero collection with 3 books, add tags and a child note,
    export as BibTeX, then create a reference report in Writer summarizing
    the collection metadata.
