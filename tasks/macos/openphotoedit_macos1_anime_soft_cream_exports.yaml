task_id: macos.openphotoedit.macos1_anime_soft_cream_exports
platform: macos
instruction: 'Create two distinct visual exports for the same anime character in the OpenPhotoEdit application,
  saving them as PNG files in the Desktop/PhotoFixtures folder. The first export, named anime-soft.png,
  must be derived from the source file Anime-Portrait.jpg, identified by the RGB calibration block in
  its thumbnail, and must feature the Portrait filter preset with a Portrait Amount of 13. This image
  requires specific Edit section adjustments: Exposure at -7, Contrast at +12, Saturation at +4, Temperature
  at +3, Sharpen at +8, Structure at +5, and Fade at +3. Additionally, the HSL section for this image
  must have the Blue channel set to +5, the Purple channel to +4, and the Red channel to +3. The second
  export, named anime-cream.png, must be derived from the source file Anime-Portrait-Mirror.jpg, also
  identified by the RGB calibration block in its thumbnail, and must feature the Cream filter preset with
  a Cream Amount of 16. This image requires specific Edit section adjustments: Exposure at -6, Contrast
  at +10, Saturation at -7, Temperature at +7, Fade at +6, Vignette at +9, Grain at +3, and Sharpen at
  +6. The HSL section for this second image must have the Blue channel set to -6, the Purple channel to
  -4, the Yellow channel to +3, and the Magenta channel to +4. Upon completion, the application must remain
  open with the view positioned on the OpenPhotoEdit editor page.'
