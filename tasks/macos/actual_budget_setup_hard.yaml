task_id: macos.actual_budget.setup_hard
platform: macos
instruction: >
  Open Actual Budget. If this is the first time opening, you may see a
  setup wizard - skip it or close it.
  Go to the "Budget" tab in the left sidebar.
  Click "Create a new budget" or "Start Fresh".
  Enter the budget name "Monthly Budget" and click "Create".
  In the budget view, add the following categories by clicking "Add Category":
  1. Housing
  2. Food
  3. Transportation
  4. Utilities
  5. Entertainment
  For each category, set the budgeted amount:
  - Housing: 1500
  - Food: 400
  - Transportation: 200
  - Utilities: 150
  - Entertainment: 100
  After setting all categories, go to the "Accounts" tab.
  Click "Add Account" and create a new account named "Checking Account"
  with an initial balance of 5000.
  Finish after the account is created.
init:
  initializer_id: initializers.macos.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: |
        set -e
        killall Actual >/dev/null 2>&1 || true
    - type: wait
      ms: 1200
    - type: run_bash
      script: |
        open -a Actual
    - type: wait
      ms: 8000
evaluation:
  evaluator_id: evaluators.macos.command_check:CommandCheckEvaluator
  params:
    timeout: 120
    stdout_contains: "PASS"
    command: |
      set -euo pipefail
      python3 - <<'PY'
      import os
      import sqlite3

      # Check if Actual Budget database exists
      db_path = os.path.expanduser("~/Actual/budget.sqlite")
      if not os.path.exists(db_path):
          raise SystemExit("ACTUAL_DB_NOT_FOUND")

      # Check for categories
      conn = sqlite3.connect(db_path)
      cur = conn.cursor()

      # Check for expected categories
      expected_categories = ["Housing", "Food", "Transportation", "Utilities", "Entertainment"]
      for cat in expected_categories:
          cur.execute("SELECT id FROM categories WHERE name=?", (cat,))
          if not cur.fetchone():
              raise SystemExit(f"CATEGORY_NOT_FOUND_{cat}")

      # Check for account
      cur.execute("SELECT id FROM accounts WHERE name='Checking Account'")
      if not cur.fetchone():
          raise SystemExit("ACCOUNT_NOT_FOUND")

      conn.close()

      print("PASS")
      PY
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - macos
  - actual_budget
  - finance
  - budget
  - hard
  app_name: actual_budget
  difficulty: hard
  description: Set up a budget with categories and create an account in Actual Budget.
