task_id: macos.openphotoedit.macos1_fruit_product_film_exports
platform: macos
instruction: |-
  Create two distinct finished images in the already-open OpenPhotoEdit application from the source files located in the Desktop/PhotoFixtures folder, leaving the application open on the editor page when finished without signing out or quitting.

  The first resulting image, exported as a PNG file named fruit-warm.png into the PhotoFixtures folder, must be derived from the source file Fruit-Pair.jpg, which is identified by the RGB calibration blocks in its preview. This image requires specific adjustments: in the Edit category, the Exposure slider must be set to -10, the Brightness slider to -6, the Contrast slider to +18, the Saturation slider to +8, the Temperature slider to -3, and the Sharpen slider to +12. In the Filters category, the Clean preset must be selected with the Clean Amount slider set to 10. In the HSL category, the Green channel must be adjusted to +6, the Orange channel to +8, the Yellow channel to -10, and the Red channel to +3.

  The second resulting image, exported as a PNG file named fruit-film.png into the PhotoFixtures folder, must be derived from the source file Fruit-Pair-Rotated.jpg, also identified by RGB calibration blocks. This image requires specific adjustments: in the Filters category, the Film preset must be selected with the Film Amount slider set to 14. In the Edit category, the Exposure slider must be set to -8, the Contrast slider to +16, the Saturation slider to -12, the Fade slider to +9, the Grain slider to +7, the Vignette slider to +12, the Temperature slider to +4, and the Sharpen slider to +8. In the HSL category, the Orange channel must be adjusted to +5, the Green channel to -6, and the Yellow channel to -8.

  Upon completion, the application must remain open and display the editor page.
