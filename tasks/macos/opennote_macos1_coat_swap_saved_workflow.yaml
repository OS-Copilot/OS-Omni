instruction: Create three new posts in OpenNote, comment on and save a specific existing post, and finish
  on the Saved tab of your profile, using the details from the Coat-Swap-Plan.txt file located on the
  desktop. The first new post must have the title "Riverside Coat Swap" and the body "Bring one clean
  coat. Check in at North Hall at 14:00.", with the category set to "Fashion", the location set to "North
  Hall", the tags set to "coatswap,repair", and the "Use text cover" option selected before publishing.
  The second new post must have the title "Coat Swap Checklist" and the body "Pack a tote, name tag, and
  repair kit for the coat swap.", with the category set to "Fashion", the location set to "North Hall",
  the tags set to "coatswap,repair", and the "Use text cover" option selected before publishing. The third
  new post must have the title "Coat Access Note" and the body "Use north door. Late coats go to repair
  table.", with the category set to "Fashion", the location set to "North Hall", the tags set to "coatswap,repair",
  and the "Use text cover" option selected before publishing. The existing post titled "Secondhand coat
  notes from tiny bedroom" must have a comment submitted with the exact text "Bring a light knit layer."
  and must be saved to your collection. The Lina Park account must remain signed in at all times. Upon
  completion, the "My Profile" page must be active with the "Saved" tab visible, displaying the list of
  saved posts.
