task_id: macos.zotero.install_plugin_hard
platform: macos
instruction: >
  Open Zotero. Go to Tools → Plugins. In the Plugins window, click the gear
  icon (⚙) in the top-right corner and select "Install Add-on From File".
  Navigate to /Users/bench/Downloads/ and select the file
  "quick-copy-formatter.xpi". Click "Install Now" when prompted.
  After installation, restart Zotero when prompted.
  Once Zotero restarts, verify the plugin is installed by going back to
  Tools → Plugins. You should see "Quick Copy Formatter" in the list.
  Finish after verifying the plugin appears in the Plugins list.
init:
  initializer_id: initializers.macos.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: |
        set -e
        killall Zotero >/dev/null 2>&1 || true
        rm -rf ~/Zotero ~/.zotero
        mkdir -p /Users/bench/Downloads
        python3 - <<'PY'
from pathlib import Path
from urllib.request import urlopen
url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/zotero/6ADCC666-81A5-44C7-AFEE-438214254347/quick-copy-formatter.xpi"
out = Path("/Users/bench/Downloads/quick-copy-formatter.xpi")
out.parent.mkdir(parents=True, exist_ok=True)
out.write_bytes(urlopen(url).read())
PY
    - type: wait
      ms: 1200
    - type: run_bash
      script: |
        open -a Zotero
    - type: wait
      ms: 12000
    - type: action
      action:
        type: tap
        target:
          text: Done
      optional: true
    - type: action
      action:
        type: tap
        target:
          text: Don't Ask Again
      optional: true
    - type: action
      action:
        type: tap
        target:
          text: Remind Me Later
      optional: true
    - type: run_bash
      script: "osascript <<'APPLESCRIPT'\ntell application \"Zotero\" to activate\ntell application \"System Events\"\n  tell process \"Zotero\"\n    set position of window 1 to {80, 80}\n    set size of window 1 to {1320, 860}\n  end tell\nend tell\nAPPLESCRIPT\n"
    - type: wait
      ms: 1000
evaluation:
  evaluator_id: evaluators.macos.command_check:CommandCheckEvaluator
  params:
    timeout: 120
    stdout_contains: "PASS"
    command: |
      set -euo pipefail
      python3 - <<'PY'
      import os
      import sqlite3

      # Check if the plugin is installed by looking for it in the Zotero database
      # Zotero stores installed extensions in the database
      db_path = os.path.expanduser("~/Zotero/zotero.sqlite")
      if not os.path.exists(db_path):
          raise SystemExit("ZOTERO_DB_NOT_FOUND")

      # Check if the plugin file exists in the extensions directory
      extensions_dir = os.path.expanduser("~/Library/Application Support/Zotero/Profiles")
      if not os.path.exists(extensions_dir):
          raise SystemExit("ZOTERO_PROFILES_DIR_NOT_FOUND")

      # Look for the plugin in any profile
      import glob
      plugin_found = False
      for profile_dir in glob.glob(os.path.join(extensions_dir, "*.default*")):
          ext_dir = os.path.join(profile_dir, "extensions")
          if os.path.exists(ext_dir):
              for f in os.listdir(ext_dir):
                  if "quick-copy" in f.lower() or "quickcopy" in f.lower():
                      plugin_found = True
                      break

      if not plugin_found:
          raise SystemExit("PLUGIN_NOT_FOUND_IN_EXTENSIONS")

      print("PASS")
      PY
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - macos
  - zotero
  - plugin
  - install
  - hard
  app_name: zotero
  difficulty: hard
  description: Install a Zotero plugin from an XPI file using the Plugins manager.
