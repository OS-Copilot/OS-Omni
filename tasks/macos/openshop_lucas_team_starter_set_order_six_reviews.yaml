instruction: |-
  Place an order in the OpenShop application as Lucas Lin (password spring2026) containing four items, each with a quantity of one: the "Polar Day Slim Business Backpack" in the 16-inch specification, the "Verdant Pro Noise-Canceling Headphones" in the Rose Gold specification, the "Blue Tin Small Batch Trail Mix Pouch" in the 4 Pack specification, and the "Mountain Isle Pour-Over Coffee 20 Pack" in the 10 sachets specification. The checkout for this order must use the "Office" delivery address and "Cash on Delivery" as the payment method, with "Team starter set" entered in the Order Note field.

