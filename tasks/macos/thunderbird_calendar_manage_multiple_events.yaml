task_id: macos.thunderbird.calendar.manage_multiple_events
platform: macos
instruction: |
  Open Thunderbird and switch to the Calendar view. Create three events for
  this week: "Design Review" on Monday at 10:00 AM for 45 minutes with a
  15-minute reminder, "Sprint Planning" on Wednesday at 1:30 PM for 90
  minutes, and "Retrospective" on Friday at 2:30 PM for 1 hour with a
  30-minute reminder. Save all three events so they remain visible in the
  calendar when you finish.
init:
  initializer_id: initializers.macos.thunderbird_profile:ThunderbirdProfileInitializer
  params:
    open_calendar: true
    wait_ms: 7000
evaluation:
  evaluator_id: evaluators.macos.thunderbird_calendar:ThunderbirdCalendarEvaluator
  params:
    required_titles:
    - Design Review
    - Sprint Planning
    - Retrospective
    event_expectations:
      Design Review:
        relative_day: this_week
        weekday: monday
        start_time: '10:00'
        duration_minutes: 45
        alarm_keywords:
        - -pt15m
      Sprint Planning:
        relative_day: this_week
        weekday: wednesday
        start_time: '13:30'
        duration_minutes: 90
      Retrospective:
        relative_day: this_week
        weekday: friday
        start_time: '14:30'
        duration_minutes: 60
        alarm_keywords:
        - -pt30m
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  difficulty: hard
