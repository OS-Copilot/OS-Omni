task_id: macos.thunderbird.email.filter_discount_to_promotions
platform: macos
instruction: 'Open Thunderbird in Mail view. Under Local Folders, create a folder
  named Promotions. Then create a filter that automatically moves any message whose
  subject contains the word "discount" into Promotions.

  '
init:
  initializer_id: initializers.macos.thunderbird_profile:ThunderbirdProfileInitializer
  params:
    launch_mail: true
    wait_ms: 7000
    seed_mailboxes:
    - folder: Inbox
      messages:
      - subject: discount on office supplies this week
        from: Deals Team <deals@example.com>
        body: Seeded benchmark email with discount keyword.
      - subject: member discount for spring flights
        from: Travel Promo <travel@example.com>
        body: Seeded benchmark email with discount keyword.
      - subject: limited-time discount coupon reminder
        from: Store Notice <store@example.com>
        body: Seeded benchmark email with discount keyword.
evaluation:
  evaluator_id: evaluators.macos.thunderbird_email:ThunderbirdEmailEvaluator
  params:
    mode: filter_rule
    folder_must_exist: Promotions
    required_contains:
    - name="Promotions"
    - condition="OR (subject,contains,discount)"
    - action="Move to folder"
    required_rule:
      name: Promotions
      enabled: true
      action: Move to folder
      condition_contains: subject,contains,discount
      action_value_contains: Promotions
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  difficulty: hard
