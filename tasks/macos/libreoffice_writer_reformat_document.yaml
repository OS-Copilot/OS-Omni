task_id: macos.libreoffice.writer.reformat_document
platform: macos
instruction: |
  I have a project plan document open in LibreOffice Writer. The title is already correct, and the budget list is already numbered, but the rest of the document still needs proper formatting. Please set each section name (Overview, Timeline, Budget, Risks) as Heading 2. I also need a page break right before the Risks section. At the very end, add an italic line saying "Document prepared by: Management Team". Save when done.
init:
  initializer_id: initializers.macos.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: |
        killall -9 soffice.bin >/dev/null 2>&1 || true
        killall -9 LibreOffice >/dev/null 2>&1 || true
        pkill -9 -f LibreOffice >/dev/null 2>&1 || true
        rm -f "$HOME/Library/Application Support/LibreOffice/4/.lock" || true
        rm -rf "$HOME/Library/Application Support/LibreOffice/4/user/temp"/* || true
        rm -rf "$HOME/Library/Application Support/LibreOffice/4/user/backup"/* || true
        python3 - <<'PY'
        from pathlib import Path
        import re

        path = Path.home() / "Library/Application Support/LibreOffice/4/user/registrymodifications.xcu"
        path.parent.mkdir(parents=True, exist_ok=True)

        entry = '<item oor:path="/org.openoffice.Office.Common/Save/Document"><prop oor:name="WarnAlienFormat" oor:op="fuse"><value>false</value></prop></item>'
        if path.exists():
            text = path.read_text(encoding="utf-8")
        else:
            text = (
                '<?xml version="1.0" encoding="UTF-8"?>\n'
                '<oor:items xmlns:oor="http://openoffice.org/2001/registry" '
                'xmlns:xs="http://www.w3.org/2001/XMLSchema" '
                'xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">\n'
                '</oor:items>\n'
            )

        pattern = re.compile(
            r'<item oor:path="/org\.openoffice\.Office\.Common/Save/Document">.*?<prop oor:name="WarnAlienFormat" oor:op="fuse"><value>.*?</value></prop></item>',
            re.DOTALL,
        )
        if pattern.search(text):
            text = pattern.sub(entry, text, count=1)
        elif entry not in text:
            text = text.replace('</oor:items>', entry + '\n</oor:items>')

        path.write_text(text, encoding="utf-8")
        PY
        sleep 2
      timeout: 30
    - type: upload_file
      local_path: files/libreoffice/writer_project_plan_template.docx
      path: ~/Downloads/project_plan.docx
    - type: run_bash
      script: |
        open -a "LibreOffice" "$HOME/Downloads/project_plan.docx" >/dev/null 2>&1 &
      timeout: 30
    - type: wait
      ms: 8000
    - type: action
      optional: true
      action:
        type: tap
        target:
          text: Discard All
    - type: wait
      optional: true
      ms: 700
    - type: action
      optional: true
      action:
        type: tap
        target:
          text: 'Yes'
    - type: wait
      optional: true
      ms: 700
    - type: action
      action:
        type: keyboard
        action: escape
    - type: wait
      ms: 1000
evaluation:
  evaluator_id: evaluators.macos.libreoffice_writer_reformat:LibreOfficeWriterReformatEvaluator
  params:
    remote_path: ~/Downloads/project_plan.docx
    expected_title: Project Plan 2025
    expected_sections:
    - Overview
    - Timeline
    - Budget
    - Risks
    expected_budget_items:
    - 'Engineering salaries: 500000'
    - 'Cloud infrastructure: 120000'
    - 'Marketing and launch: 80000'
    expected_footer: 'Document prepared by: Management Team'
    expected_title_size_pt: 28
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  difficulty: hard
