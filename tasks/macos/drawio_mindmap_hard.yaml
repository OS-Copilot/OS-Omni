task_id: macos.drawio.mindmap_hard
platform: macos
instruction: >
  Open draw.io. Create a new diagram.
  From the shape panel, drag a rounded rectangle onto the canvas.
  Double-click and type "Project Planning".
  Drag three more rounded rectangles onto the canvas, arranged around the
  central shape:
  - One above: "Timeline"
  - One to the left: "Resources"
  - One to the right: "Budget"
  Connect "Project Planning" to each of the three outer shapes using
  connector arrows. To create a connector, hover over the edge of the source
  shape until you see a connection point, then drag to the target shape.
  Save the diagram as /Users/bench/Documents/mindmap.drawio.
  Then use File → Export as PNG to export the diagram.
  In the export dialog, uncheck "Selection only" and click Export.
  Save to /Users/bench/Documents/mindmap.png.
  Finish after both files exist.
init:
  initializer_id: initializers.macos.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: |
        set -e
        killall draw.io >/dev/null 2>&1 || true
        mkdir -p /Users/bench/Documents
    - type: wait
      ms: 1200
    - type: run_bash
      script: |
        open -a "draw.io"
    - type: wait
      ms: 8000
evaluation:
  evaluator_id: evaluators.macos.command_check:CommandCheckEvaluator
  params:
    timeout: 120
    stdout_contains: "PASS"
    command: |
      set -euo pipefail
      python3 - <<'PY'
      import os

      # Check if the draw.io file exists
      drawio_path = os.path.expanduser("~/Documents/mindmap.drawio")
      if not os.path.exists(drawio_path):
          raise SystemExit("DRAWIO_FILE_NOT_FOUND")

      # Check if the file contains expected shapes
      with open(drawio_path, 'r') as f:
          content = f.read()

      expected_shapes = ["Project Planning", "Timeline", "Resources", "Budget"]
      for shape in expected_shapes:
          if shape not in content:
              raise SystemExit(f"MISSING_SHAPE_{shape}")

      # Check if the PNG file exists
      png_path = os.path.expanduser("~/Documents/mindmap.png")
      if not os.path.exists(png_path):
          raise SystemExit("PNG_FILE_NOT_FOUND")

      print("PASS")
      PY
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - macos
  - drawio
  - mindmap
  - diagram
  - hard
  app_name: drawio
  difficulty: hard
  description: Create a mind map diagram in draw.io with connected shapes.
