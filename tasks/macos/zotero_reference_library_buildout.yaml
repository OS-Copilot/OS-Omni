task_id: macos.zotero.reference_library_buildout
platform: macos
instruction: 'Open Zotero and work in this exact order. First create a collection named "Reference Shelf" under My Library
  and add a new Book titled "Designing Data-Intensive Applications" to it. Next create "AI Papers" and add a new Journal Article
  titled "BERT" to that collection. Finally create "Project Notes" and add a new Report titled "Benchmark Plan" to that collection.
  After choosing each item type, type its title, then press Enter or click back into the center item list so the title appears
  there. Do not move to the next collection until the current collection already shows its requested title in the center item
  list. Once all three collection names are visible in the left sidebar and the current collection shows its requested title
  in the center item list, finish immediately.

  '
init:
  initializer_id: initializers.macos.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: 'set -e

        killall Safari >/dev/null 2>&1 || true

        pkill -x Zotero >/dev/null 2>&1 || true

        '
    - type: launch
      app_name: Zotero
    - type: wait
      ms: 7000
    - type: action
      action:
        type: tap
        target:
          text: 完成
      optional: true
    - type: action
      action:
        type: tap
        target:
          text: 不要再询问
      optional: true
    - type: action
      action:
        type: tap
        target:
          text: 稍后提醒我
      optional: true
    - type: run_bash
      script: "set -e\nosascript <<'APPLESCRIPT'\ntell application \"Zotero\" to activate\ntell application \"System Events\"\
        \n  tell process \"Zotero\"\n    set position of window 1 to {80, 80}\n    set size of window 1 to {1320, 860}\n \
        \ end tell\nend tell\nAPPLESCRIPT\n"
    - type: wait
      ms: 1000
evaluation:
  evaluator_id: evaluators.macos.zotero:ZoteroLibraryEvaluator
  params:
    required_collections:
    - Reference Shelf
    - AI Papers
    - Project Notes
    required_items:
    - title: Designing Data-Intensive Applications
      item_type: book
      collections:
      - Reference Shelf
    - title: BERT
      item_type: journalArticle
      collections:
      - AI Papers
    - title: Benchmark Plan
      item_type: report
      collections:
      - Project Notes
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  difficulty: hard
