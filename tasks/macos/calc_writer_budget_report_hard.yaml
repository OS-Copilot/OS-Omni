task_id: macos.cross_app.calc_writer_budget_report_hard
platform: macos
instruction: >
  Open LibreOffice Calc. Create a new spreadsheet with the following budget
  data:
  - Row 1: Headers "Category" and "Amount"
  - Row 2: Housing, 1500
  - Row 3: Food, 400
  - Row 4: Transportation, 200
  - Row 5: Utilities, 150
  - Row 6: Entertainment, 100
  In cell A8, type "Total". In cell B8, enter a SUM formula to calculate the
  total of B2:B6. The formula should be =SUM(B2:B6).
  Save the spreadsheet as /Users/bench/Documents/budget.ods.
  Then switch to the already-open LibreOffice Writer window. Create a new
  document. Type the heading "Budget Summary Report" and below it include:
  "Total budget: [the calculated total from cell B8]
  Highest category: [the category name with the highest amount]
  Lowest category: [the category name with the lowest amount]"
  Save the Writer document as /Users/bench/Documents/budget_report.odt.
  Finish after both files exist.
init:
  initializer_id: initializers.macos.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: |
        set -e
        killall soffice.bin >/dev/null 2>&1 || true
        killall soffice >/dev/null 2>&1 || true
        mkdir -p /Users/bench/Documents
    - type: wait
      ms: 1200
    - type: run_bash
      script: |
        /Applications/LibreOffice.app/Contents/MacOS/soffice --calc
    - type: wait
      ms: 5000
    - type: run_bash
      script: |
        /Applications/LibreOffice.app/Contents/MacOS/soffice --writer
    - type: wait
      ms: 5000
evaluation:
  evaluator_id: evaluators.macos.command_check:CommandCheckEvaluator
  params:
    timeout: 120
    stdout_contains: "PASS"
    command: |
      set -euo pipefail
      python3 - <<'PY'
      import os
      import zipfile

      ods_path = os.path.expanduser("~/Documents/budget.ods")
      if not os.path.exists(ods_path):
          raise SystemExit("CALC_FILE_NOT_FOUND")

      with zipfile.ZipFile(ods_path, 'r') as z:
          content = z.read('content.xml').decode('utf-8')

      expected_values = ["Housing", "Food", "Transportation", "Utilities", "Entertainment"]
      for val in expected_values:
          if val not in content:
              raise SystemExit(f"MISSING_VALUE_{val}")

      if "SUM" not in content:
          raise SystemExit("MISSING_SUM_FORMULA")

      odt_path = os.path.expanduser("~/Documents/budget_report.odt")
      if not os.path.exists(odt_path):
          raise SystemExit("WRITER_FILE_NOT_FOUND")

      with zipfile.ZipFile(odt_path, 'r') as z:
          content = z.read('content.xml').decode('utf-8')

      if "Budget Summary Report" not in content:
          raise SystemExit("MISSING_HEADING")
      if "Total budget" not in content:
          raise SystemExit("MISSING_TOTAL")
      if "Highest category" not in content:
          raise SystemExit("MISSING_HIGHEST")
      if "Lowest category" not in content:
          raise SystemExit("MISSING_LOWEST")

      print("PASS")
      PY
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - macos
  - cross_app
  - calc
  - writer
  - spreadsheet
  - formula
  - hard
  app_name: libreoffice_calc + libreoffice_writer
  difficulty: hard
  description: Create a budget spreadsheet in Calc with 5 categories and a SUM formula,
    then generate a summary report in Writer with total, highest, and lowest
    categories.
