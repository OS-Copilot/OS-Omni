task_id: macos.photos.route_album_hard
platform: macos
instruction: >
  In Photos, build the blue-route client album from the prepared images in
  Pictures/photos_bench_inbox. Import only the three blue-route final images:
  blue_route_card_final_1740.png, blue_route_map_final_303.png, and
  blue_route_cover_final_501.png. Do not import any receipt, draft, backup,
  hold, or red-route decoy images. Create an album named Final Client Set -
  Blue Route containing exactly those three blue-route final images.
init:
  initializer_id: initializers.macos.photos:PhotosInitializer
  params:
    mode: open
    final_wait_ms: 2500
evaluation:
  evaluator_id: evaluators.macos.photos:PhotosStateEvaluator
  params:
    required_texts:
      - Final Client Set - Blue Route
    any_text_groups:
      - - Photos
        - 照片
      - - Albums
        - 相簿
    expected_assets:
      - blue_route_card_final_1740.png
      - blue_route_map_final_303.png
      - blue_route_cover_final_501.png
    forbidden_assets:
      - client_receipt_blue_final_774.png
      - client_receipt_green_final_610.png
      - client_receipt_red_final_203.png
      - receipt_blue_draft_774.png
      - client_receipt_green_backup_610.png
      - blue_route_card_hold_1740.png
      - red_route_cover_final_501.png
    exact_asset_set: true
    albums:
      - title: Final Client Set - Blue Route
        expected_assets:
          - blue_route_card_final_1740.png
          - blue_route_map_final_303.png
          - blue_route_cover_final_501.png
        forbidden_assets:
          - client_receipt_blue_final_774.png
          - client_receipt_green_final_610.png
          - client_receipt_red_final_203.png
          - receipt_blue_draft_774.png
          - client_receipt_green_backup_610.png
          - blue_route_card_hold_1740.png
          - red_route_cover_final_501.png
        exact_assets: true
        min_count: 3
metadata:
  app: Photos
  app_name: apple-photos
  app_bundle_id: com.apple.Photos
  difficulty: hard
  tags: [macos, gui, photos, native, albums, hard, single_app, evaluator_backed]
  human_steps: 48
  description: Import a precise three-image route final set from similar decoys and create an exact Photos album.
  hardness: hard-evaluable
  evaluation_standard: exact Photos asset set and album membership through Z_30ASSETS are checked
  oracle_task: tasks/macos/oracle/photos_route_album_hard_oracle.yaml
limits:
  max_steps: 100
  step_timeout_seconds: 120
