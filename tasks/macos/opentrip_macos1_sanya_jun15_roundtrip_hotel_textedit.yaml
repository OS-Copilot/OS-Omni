instruction: 'Complete a round-trip travel booking workflow inside the macOS1 guest environment, beginning
  by signing in with the pre-filled Lucas Lin account on the OpenTrip login form. The outbound flight
  booking must be for a Business class flight from Shanghai to Sanya on June 15, 2026, sorted by lowest
  price, specifically selecting the MetroJet MJ1386 flight with a 15kg checked bag added. This outbound
  booking confirmation must list the traveler as Maya Chen · Passport, use the contact phone number 13900004201,
  and select Bank Card · Credit or debit card as the payment method before submission. The hotel booking
  must be for the Sanya Meridian Suites hotel with a check-in date of June 15, 2026, and a check-out date
  of June 17, 2026, sorted by lowest price, specifically booking a Deluxe Twin Room. This hotel booking
  confirmation must use the contact phone number 13900004202, select WeChat Pay · Scan or authorize payment
  as the payment method, include the note Quiet room please, and be submitted. The return flight booking
  must be for a flight from Sanya (SYX) to Shanghai (SHA) on June 17, 2026, sorted by earliest departure,
  selecting the first flight card in the results with a 23kg checked bag added. This return booking confirmation
  must use the contact phone number 13900004203, select Bank Card · Credit or debit card as the payment
  method, and be submitted. A new plain text document created in TextEdit within the macOS1 guest environment
  must contain exactly three lines: DATES=JUN15-17, OUT=MJ1386 15KG, and HOTEL=TWIN RET23, and must be
  saved as Sanya-Jun15.txt to the Desktop. The task is complete when the Lucas Lin account remains signed
  in, all three bookings are confirmed with the specified details, and the TextEdit application is the
  foreground window displaying the saved file.'
