task_id: macos.openshop.checkout_two_items
platform: macos
instruction: >
  In OpenShop, first sign in with phone number 13800138000 and password
  spring2026. On the home page, set the category to Electronics and the sort to
  Price: High to Low. Search for Verdant Pro Noise-Canceling Headphones, open
  its product page from the search results, and add exactly one item with the
  Bluetooth 5.4 option to the cart. From the cart, use Continue Shopping to go
  back home. Then set the category to Grocery and the sort to Price: Low to
  High. Search for Mountain Isle Pour-Over Coffee 20 Pack, open its product
  page from the search results, and add exactly one item with the 20 sachets
  option to the cart. In the cart, increase the headphones quantity to 2 and
  then return it to 1. Also increase the coffee quantity to 2 and then return
  it to 1. Proceed to checkout, switch the shipping address to Home first and
  then back to Office, switch the payment method to Alipay first and then back
  to WeChat Pay, enter the order note 'Leave it at reception before 6 PM.', and
  place the order. Finish only when the completed order still shows the
  discounted ¥347 total, the Office address for Lucas Lin, and WeChat Pay.
init:
  initializer_id: initializers.macos.openshop:OpenShopInitializer
  params:
    benchmark_mode: macos.openshop.checkout_two_items
    final_wait_ms: 1800
evaluation:
  evaluator_id: evaluators.macos.openshop:OpenShopMacOSApiEvaluator
  params:
    ui:
      require_foreground: true
      app_names: [OpenShop]
      bundle_ids: [com.killt.openshop]
    session:
      logged_in: true
      phone: '13800138000'
      user_name: Lucas Lin
    cart:
      item_count: 0
      total: 0
    orders:
      count: 1
      latest:
        status: Awaiting Shipment
        total: 347
        address_label: Office
        address_receiver: Lucas Lin
        address_full: Floor 7, Tower A, 88 Boyun Road, Zhangjiang, Pudong, Shanghai
        payment_id: wechat
        payment_label: WeChat Pay
        payment_desc: Scan to pay
        note: Leave it at reception before 6 PM.
        item_count: 2
        items:
          - product_id: p1001
            quantity: 1
            selected_spec: Bluetooth 5.4
          - product_id: p1005
            quantity: 1
            selected_spec: 20 sachets
    benchmark:
      mode: macos.openshop.checkout_two_items
      ordered:
        - type: session_login_success
          phone: '13800138000'
        - type: catalog_view
          query: verdant pro noise-canceling headphones
          category: Electronics
          sort: priceDesc
          total: 1
        - type: product_view
          productId: p1001
          title: Verdant Pro Noise-Canceling Headphones
        - type: cart_item_added
          productId: p1001
          selectedSpec: Bluetooth 5.4
        - type: cart_continue_shopping
        - type: catalog_view
          query: mountain isle pour-over coffee 20 pack
          category: Grocery
          sort: priceAsc
          total: 1
        - type: product_view
          productId: p1005
          title: Mountain Isle Pour-Over Coffee 20 Pack
        - type: cart_item_added
          productId: p1005
          selectedSpec: 20 sachets
        - type: cart_review_confirmed
          kind: headphones_present
        - type: cart_review_confirmed
          kind: coffee_present
        - type: cart_review_confirmed
          kind: cart_total
        - type: cart_review_confirmed
          kind: discount_rule
        - type: cart_quantity_updated
          productId: p1001
          quantity: 2
        - type: cart_quantity_updated
          productId: p1001
          quantity: 1
        - type: cart_quantity_updated
          productId: p1005
          quantity: 2
        - type: cart_quantity_updated
          productId: p1005
          quantity: 1
        - type: checkout_address_selected
          addressId: addr-home
        - type: checkout_address_selected
          addressId: addr-office
        - type: checkout_payment_selected
          paymentMethodId: alipay
        - type: checkout_payment_selected
          paymentMethodId: wechat
        - type: checkout_submitted
          addressId: addr-office
          addressLabel: Office
          paymentMethodId: wechat
          paymentLabel: WeChat Pay
          note: Leave it at reception before 6 PM.
          total: 347
          itemCount: 2
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  difficulty: hard
