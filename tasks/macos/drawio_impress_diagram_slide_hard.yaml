task_id: macos.cross_app.drawio_impress_diagram_slide_hard
platform: macos
instruction: >
  Open draw.io. Create a new diagram. From the shape panel on the left side,
  drag a rectangle shape onto the canvas. Double-click the shape to edit its
  text and type "Start".
  Drag another rectangle onto the canvas below the first one. Double-click
  and type "Process".
  Drag a third rectangle onto the canvas below the second one. Double-click
  and type "End".
  To connect the shapes, hover over the bottom edge of "Start" until you see
  a connection point (small blue circle). Click and hold on that point, then
  drag to the top edge of "Process" and release to create an arrow.
  Repeat to connect "Process" to "End" by dragging from Process's bottom
  connection point to End's top connection point.
  Save the diagram as /Users/bench/Documents/workflow.drawio.
  Then use File → Export as PNG to export the diagram. In the export dialog,
  uncheck "Selection only" and click Export. Save to
  /Users/bench/Documents/workflow.png.
  Then switch to the already-open LibreOffice Impress window. Create a new
  presentation. On the first slide, use Insert → Image to insert the exported
  image /Users/bench/Documents/workflow.png. In the insert dialog, navigate to
  /Users/bench/Documents/, select workflow.png, and click Open.
  Save the presentation as /Users/bench/Documents/workflow_presentation.odp.
  Finish after the presentation is saved.
init:
  initializer_id: initializers.macos.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: |
        set -e
        killall draw.io >/dev/null 2>&1 || true
        killall soffice.bin >/dev/null 2>&1 || true
        killall soffice >/dev/null 2>&1 || true
        mkdir -p /Users/bench/Documents
    - type: wait
      ms: 1200
    - type: run_bash
      script: |
        open -a "draw.io"
    - type: wait
      ms: 8000
    - type: run_bash
      script: |
        /Applications/LibreOffice.app/Contents/MacOS/soffice --impress
    - type: wait
      ms: 5000
evaluation:
  evaluator_id: evaluators.macos.command_check:CommandCheckEvaluator
  params:
    timeout: 120
    stdout_contains: "PASS"
    command: |
      set -euo pipefail
      python3 - <<'PY'
      import os

      drawio_path = os.path.expanduser("~/Documents/workflow.drawio")
      if not os.path.exists(drawio_path):
          raise SystemExit("DRAWIO_FILE_NOT_FOUND")

      with open(drawio_path, 'r') as f:
          content = f.read()
      if "Start" not in content:
          raise SystemExit("MISSING_START_SHAPE")
      if "Process" not in content:
          raise SystemExit("MISSING_PROCESS_SHAPE")
      if "End" not in content:
          raise SystemExit("MISSING_END_SHAPE")

      png_path = os.path.expanduser("~/Documents/workflow.png")
      if not os.path.exists(png_path):
          raise SystemExit("PNG_FILE_NOT_FOUND")

      import zipfile
      odp_path = os.path.expanduser("~/Documents/workflow_presentation.odp")
      if not os.path.exists(odp_path):
          raise SystemExit("IMPRESS_FILE_NOT_FOUND")

      with zipfile.ZipFile(odp_path, 'r') as z:
          content = z.read('content.xml').decode('utf-8')

      if "Pictures/" not in content and ".png" not in content:
          raise SystemExit("MISSING_IMAGE_REFERENCE")

      print("PASS")
      PY
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - macos
  - cross_app
  - drawio
  - impress
  - diagram
  - shapes
  - export
  - hard
  app_name: drawio + libreoffice_impress
  difficulty: hard
  description: Create a workflow diagram in draw.io with 3 rectangles and connecting
    arrows via shape panel and connection points, export as PNG via File menu,
    then insert into Impress via Insert → Image dialog.
