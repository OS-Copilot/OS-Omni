task_id: macos.cross_app.zotero_thunderbird_export_attach_hard
platform: macos
instruction: >
  Open Zotero. Create a new collection named "Reading List" under My Library.
  Add three Journal Article items to this collection:
  1. "Attention Is All You Need" by Ashish Vaswani
  2. "BERT" by Jacob Devlin
  3. "Longformer" by Iz Beltagy
  Add the tag "transformer" to all three items. To add a tag, select an item,
  then in the right panel click the Tags tab, click Add, and type "transformer".
  Select the "Reading List" collection. Go to File → Export Collection. In the
  export dialog, choose "BibTeX" format and save the file to
  /Users/bench/Documents/reading_list.bib.
  Then switch to the already-open Thunderbird compose window. The email should
  have subject "Bench Reading List Export" and body "Please find attached the
  exported bibliography." Click the Attach button in the compose toolbar,
  navigate to /Users/bench/Documents/, select reading_list.bib, and click Open.
  Leave the draft open without sending.
  Finish after the attachment is added.
init:
  initializer_id: initializers.macos.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: |
        set -e
        killall Zotero >/dev/null 2>&1 || true
        killall Thunderbird >/dev/null 2>&1 || true
        rm -rf ~/Zotero ~/.zotero
        mkdir -p /Users/bench/Documents
    - type: run_bash
      script: |
        mkdir -p ~/Library/Thunderbird
    - type: run_bash
      script: |
        open -a Zotero
    - type: wait
      ms: 12000
    - type: action
      action:
        type: tap
        target:
          text: Done
      optional: true
    - type: action
      action:
        type: tap
        target:
          text: Don't Ask Again
      optional: true
    - type: action
      action:
        type: tap
        target:
          text: Remind Me Later
      optional: true
    - type: run_bash
      script: "osascript <<'APPLESCRIPT'\ntell application \"Zotero\" to activate\ntell application \"System Events\"\n  tell process \"Zotero\"\n    set position of window 1 to {80, 80}\n    set size of window 1 to {1320, 860}\n  end tell\nend tell\nAPPLESCRIPT\n"
    - type: wait
      ms: 1000
    - type: run_bash
      script: |
        open -a Thunderbird
    - type: wait
      ms: 5000
    - type: run_bash
      script: |
        osascript <<'APPLESCRIPT'
        tell application "Thunderbird" to activate
        tell application "System Events"
          keystroke "n" using {command down}
          delay 2
          keystroke "Bench Reading List Export"
          keystroke tab
          keystroke "assistant@outlook.com"
          keystroke tab
          keystroke "Please find attached the exported bibliography."
        end tell
        APPLESCRIPT
    - type: wait
      ms: 3000
evaluation:
  evaluator_id: evaluators.macos.command_check:CommandCheckEvaluator
  params:
    timeout: 120
    stdout_contains: "PASS"
    command: |
      set -euo pipefail
      python3 - <<'PY'
      import sqlite3
      import os

      db_path = os.path.expanduser("~/Zotero/zotero.sqlite")
      if not os.path.exists(db_path):
          raise SystemExit("ZOTERO_DB_NOT_FOUND")

      conn = sqlite3.connect(db_path)
      cur = conn.cursor()

      cur.execute("SELECT collectionName FROM collections WHERE collectionName='Reading List'")
      if not cur.fetchone():
          raise SystemExit("COLLECTION_NOT_FOUND")

      cur.execute("""
          SELECT i.itemID, idv.value FROM items i
          JOIN itemData id ON i.itemID = id.itemID
          JOIN fields f ON id.fieldID = f.fieldID
          JOIN itemDataValues idv ON id.valueID = idv.valueID
          WHERE f.fieldName = 'title'
          AND idv.value IN ('Attention Is All You Need', 'BERT', 'Longformer')
      """)
      items = cur.fetchall()
      if len(items) < 3:
          raise SystemExit(f"EXPECTED_AT_LEAST_3_ITEMS_GOT_{len(items)}")

      cur.execute("""
          SELECT DISTINCT name FROM tags
          WHERE name = 'transformer'
      """)
      if not cur.fetchone():
          raise SystemExit("TAG_NOT_FOUND")

      conn.close()

      bib_path = os.path.expanduser("~/Documents/reading_list.bib")
      if not os.path.exists(bib_path):
          raise SystemExit("BIBTEX_FILE_NOT_FOUND")

      import subprocess
      thunderbird_dir = os.path.expanduser("~/Library/Thunderbird")
      result = subprocess.run(
          ["grep", "-R", "-a", "-q", "reading_list.bib", thunderbird_dir],
          capture_output=True
      )
      if result.returncode != 0:
          raise SystemExit("ATTACHMENT_NOT_FOUND_IN_THUNDERBIRD")

      print("PASS")
      PY
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - macos
  - cross_app
  - zotero
  - thunderbird
  - bibliography
  - tags
  - hard
  app_name: zotero + thunderbird
  difficulty: hard
  description: Create a Zotero collection with 3 journal articles, add tags via Tags
    panel, export as BibTeX via File menu dialog, then attach to Thunderbird
    email via Attach button and file dialog.
