task_id: macos.libreoffice.calc.multi_sheet_summary
platform: macos
instruction: |
  I opened a quarterly sales workbook in LibreOffice Calc. The file already has sheets Q1, Q2, Q3, and an empty Summary sheet, and Summary is already the active sheet. You do not need to create or rename any sheets. Use these revenue values from the source sheets: Alpha has 36000 in Q1, 45000 in Q2, and 39000 in Q3; Beta has 25500 in Q1, 27000 in Q2, and 33000 in Q3; Gamma has 40000 in Q1, 36000 in Q2, and 32000 in Q3. In Summary, add the headers Product, Q1 Revenue, Q2 Revenue, Q3 Revenue, Total Revenue, and Average Revenue in row 1. Add one row each for Alpha, Beta, and Gamma, calculate Total Revenue and Average Revenue for each product, sort the three product rows by Total Revenue from highest to lowest, then add a Grand Total row in row 5 with the total revenue in E5. Leave Q1, Q2, and Q3 unchanged, and save the workbook when finished.
init:
  initializer_id: initializers.macos.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: |
        killall -9 soffice.bin >/dev/null 2>&1 || true
        killall -9 LibreOffice >/dev/null 2>&1 || true
        pkill -9 -f LibreOffice >/dev/null 2>&1 || true
        rm -f "$HOME/Library/Application Support/LibreOffice/4/.lock" || true
        rm -rf "$HOME/Library/Application Support/LibreOffice/4/user/temp"/* || true
        rm -rf "$HOME/Library/Application Support/LibreOffice/4/user/backup"/* || true
        python3 - <<'PY'
        from pathlib import Path
        import re

        path = Path.home() / "Library/Application Support/LibreOffice/4/user/registrymodifications.xcu"
        path.parent.mkdir(parents=True, exist_ok=True)

        entry = '<item oor:path="/org.openoffice.Office.Common/Save/Document"><prop oor:name="WarnAlienFormat" oor:op="fuse"><value>false</value></prop></item>'
        if path.exists():
            text = path.read_text(encoding="utf-8")
        else:
            text = (
                '<?xml version="1.0" encoding="UTF-8"?>\n'
                '<oor:items xmlns:oor="http://openoffice.org/2001/registry" '
                'xmlns:xs="http://www.w3.org/2001/XMLSchema" '
                'xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">\n'
                '</oor:items>\n'
            )

        pattern = re.compile(
            r'<item oor:path="/org\.openoffice\.Office\.Common/Save/Document">.*?<prop oor:name="WarnAlienFormat" oor:op="fuse"><value>.*?</value></prop></item>',
            re.DOTALL,
        )
        if pattern.search(text):
            text = pattern.sub(entry, text, count=1)
        elif entry not in text:
            text = text.replace('</oor:items>', entry + '\n</oor:items>')

        path.write_text(text, encoding="utf-8")
        PY
        sleep 2
      timeout: 30
    - type: upload_file
      local_path: files/libreoffice/calc_multi_sheet_summary_template.xlsx
      path: ~/Downloads/calc_multi_sheet_summary_template.xlsx
    - type: run_bash
      script: |
        open -a "LibreOffice" "$HOME/Downloads/calc_multi_sheet_summary_template.xlsx" >/dev/null 2>&1 &
      timeout: 30
    - type: wait
      ms: 9000
    - type: action
      optional: true
      action:
        type: tap
        target:
          text: Discard All
    - type: wait
      optional: true
      ms: 700
    - type: action
      optional: true
      action:
        type: tap
        target:
          text: 'Yes'
    - type: wait
      optional: true
      ms: 700
    - type: action
      action:
        type: keyboard
        action: escape
    - type: wait
      ms: 1000
evaluation:
  evaluator_id: evaluators.macos.libreoffice_calc_cells:LibreOfficeCalcCellEvaluator
  params:
    remote_path: ~/Downloads/calc_multi_sheet_summary_template.xlsx
    required_sheet_names:
    - Q1
    - Q2
    - Q3
    - Summary
    per_sheet_expected_text_cells:
      Q1:
        A1: Product
        A2: Alpha
        A3: Beta
        A4: Gamma
      Q2:
        A1: Product
        A2: Alpha
        A3: Beta
        A4: Gamma
      Q3:
        A1: Product
        A2: Alpha
        A3: Beta
        A4: Gamma
      Summary:
        A1: Product
        B1: Q1 Revenue
        C1: Q2 Revenue
        D1: Q3 Revenue
        E1: Total Revenue
        F1: Average Revenue
        A2: Alpha
        A3: Gamma
        A4: Beta
        A5: Grand Total
    per_sheet_expected_numeric_cells:
      Q1:
        B2: 120
        C2: 36000
        B3: 85
        C3: 25500
        B4: 200
        C4: 40000
      Q2:
        B2: 150
        C2: 45000
        B3: 90
        C3: 27000
        B4: 180
        C4: 36000
      Q3:
        B2: 130
        C2: 39000
        B3: 110
        C3: 33000
        B4: 160
        C4: 32000
      Summary:
        B2: 36000
        C2: 45000
        D2: 39000
        E2: 120000
        F2: 40000
        B3: 40000
        C3: 36000
        D3: 32000
        E3: 108000
        F3: 36000
        B4: 25500
        C4: 27000
        D4: 33000
        E4: 85500
        F4: 28500
        E5: 313500
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  difficulty: hard
