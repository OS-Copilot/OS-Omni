task_id: macos.maps.walking_route_sf_hard
platform: macos
instruction: >
  In Maps, plan a walking route from Ferry Building Marketplace in San
  Francisco to Palace of Fine Arts in San Francisco. Start from the normal Maps
  window, search or enter the start and destination yourself, select Walking,
  and stop on the route overview.
init:
  initializer_id: initializers.macos.maps:MapsInitializer
  params:
    final_wait_ms: 3000
evaluation:
  evaluator_id: evaluators.macos.maps:MapsStateEvaluator
  params:
    required_texts:
      - Walking
      - Palace of Fine Arts
    any_text_groups:
      - - Ferry Building
        - San Francisco Ferry Building
      - - Route
        - Directions
      - - mi
        - km
      - - fastest
        - RouteOverviewCell
metadata:
  app: Maps
  app_name: apple-maps
  difficulty: hard
  tags: [macos, gui, maps, native, route-planning, walking, hard, single_app, evaluator_backed]
  human_steps: 45
  description: Plan a walking route between two San Francisco landmarks from a clean Maps window without a prefilled route.
  hardness: hard-evaluable
  evaluation_standard: foreground Maps state, route endpoint text, walking mode, route affordance, and distance or route-overview text are checked
  oracle_task: tasks/macos/oracle/maps_walking_route_sf_hard_oracle.yaml
limits:
  max_steps: 100
  step_timeout_seconds: 120
