task_id: macos.actual_budget.create_account
platform: macos
instruction: |
  Open Actual Budget. Create a local account named "Checking Account" with an opening balance of $5,000. Leave the app showing the created account when you finish.
init:
  initializer_id: initializers.macos.actual_budget:ActualBudgetInitializer
  params:
    wait_ms: 2500
evaluation:
  evaluator_id: evaluators.macos.actual_budget:ActualBudgetEvaluator
  params:
    mode: create_account
    account_name: Checking Account
    opening_balance: 5000
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  difficulty: easy
