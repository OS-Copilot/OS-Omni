task_id: macos.zotero.plugin_config_hard
platform: macos
instruction: >
  Open Zotero. Go to Tools → Plugins. Find "Quick Copy Formatter" in the list
  and click the "Preferences" button next to it.
  In the preferences dialog, change the following settings:
  1. Set "Format" to "IEEE"
  2. Set "Include DOI" to "Yes"
  3. Set "Include URL" to "No"
  Click "Save" or "OK" to apply the changes.
  Then go to Edit → Preferences (or Zotero → Preferences on macOS).
  In the Preferences window, go to the "Cite" tab.
  Verify that the "Quick Copy Formatter" appears in the citation style list.
  Finish after verifying the plugin is configured.
init:
  initializer_id: initializers.macos.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: |
        set -e
        killall Zotero >/dev/null 2>&1 || true
        rm -rf ~/Zotero ~/.zotero
        mkdir -p /Users/bench/Downloads
        # Install the plugin first
        ZOTERO_PROFILE=$(ls -d ~/Library/Application\ Support/Zotero/Profiles/*.default 2>/dev/null | head -1)
        if [ -z "$ZOTERO_PROFILE" ]; then
          # Start Zotero to create profile
          open -a Zotero
          sleep 10
          killall Zotero
          sleep 3
          ZOTERO_PROFILE=$(ls -d ~/Library/Application\ Support/Zotero/Profiles/*.default 2>/dev/null | head -1)
        fi
        mkdir -p "$ZOTERO_PROFILE/extensions"
        cp /Users/bench/Desktop/GUI-benchmark/macos_tasks/seed_data/zotero/quick-copy-formatter.xpi "$ZOTERO_PROFILE/extensions/quick-copy-formatter@bench.local.xpi"
    - type: wait
      ms: 1200
    - type: run_bash
      script: |
        open -a Zotero
    - type: wait
      ms: 12000
    - type: action
      action:
        type: tap
        target:
          text: Done
      optional: true
    - type: action
      action:
        type: tap
        target:
          text: Don't Ask Again
      optional: true
    - type: action
      action:
        type: tap
        target:
          text: Remind Me Later
      optional: true
    - type: run_bash
      script: "osascript <<'APPLESCRIPT'\ntell application \"Zotero\" to activate\ntell application \"System Events\"\n  tell process \"Zotero\"\n    set position of window 1 to {80, 80}\n    set size of window 1 to {1320, 860}\n  end tell\nend tell\nAPPLESCRIPT\n"
    - type: wait
      ms: 1000
evaluation:
  evaluator_id: evaluators.macos.command_check:CommandCheckEvaluator
  params:
    timeout: 120
    stdout_contains: "PASS"
    command: |
      set -euo pipefail
      python3 - <<'PY'
      import os
      import sqlite3

      # Check if the plugin is installed
      db_path = os.path.expanduser("~/Zotero/zotero.sqlite")
      if not os.path.exists(db_path):
          raise SystemExit("ZOTERO_DB_NOT_FOUND")

      # Check if the plugin preferences are set
      # Zotero stores preferences in prefs.js in the profile directory
      import glob
      extensions_dir = os.path.expanduser("~/Library/Application Support/Zotero/Profiles")
      if not os.path.exists(extensions_dir):
          raise SystemExit("ZOTERO_PROFILES_DIR_NOT_FOUND")

      # Look for the plugin in any profile
      plugin_found = False
      for profile_dir in glob.glob(os.path.join(extensions_dir, "*.default*")):
          ext_dir = os.path.join(profile_dir, "extensions")
          if os.path.exists(ext_dir):
              for f in os.listdir(ext_dir):
                  if "quick-copy" in f.lower() or "quickcopy" in f.lower():
                      plugin_found = True
                      break

      if not plugin_found:
          raise SystemExit("PLUGIN_NOT_FOUND_IN_EXTENSIONS")

      # Check if preferences file exists and contains our settings
      prefs_found = False
      for profile_dir in glob.glob(os.path.join(extensions_dir, "*.default*")):
          prefs_file = os.path.join(profile_dir, "prefs.js")
          if os.path.exists(prefs_file):
              with open(prefs_file, 'r') as f:
                  content = f.read()
                  if "quickcopyformatter" in content.lower():
                      prefs_found = True
                      break

      if not prefs_found:
          raise SystemExit("PLUGIN_PREFS_NOT_FOUND")

      print("PASS")
      PY
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - macos
  - zotero
  - plugin
  - preferences
  - hard
  app_name: zotero
  difficulty: hard
  description: Configure Zotero plugin preferences after installation.
