task_id: macos.opennote.macos1_harbor_coffee_saved_workflow
platform: macos
instruction: Produce a completed OpenNote workflow that comments on and saves a specific coffee post,
  publishes three new Food posts with exact titles and bodies, and leaves the application on the Saved
  tab of My Profile. The workflow begins with the desktop file Harbor-Coffee-Plan.txt already present
  and the OpenNote application logged in as Lina Park. The source post, titled "A small note on coastal
  coffee stop and ticket screenshot", must be located within the Food category of the Explore feed using
  the search term "coffee", and it must receive a comment containing exactly the text "Keep ticket offline."
  before being saved to the user's collection. Three new posts must be created, each using the "Use text
  cover" option, the Food category, the location "Pier Cafe", and the tags "harbor,quiet". The first new
  post must have the title "Harbor Coffee Meetup" and the body "Meet at Pier Cafe at 09:30 for a quiet
  tasting table." The second new post must have the title "Coffee Meetup Checklist" and the body "Bring
  a cup, tasting card, and transit ticket screenshot." The third new post must have the title "Coffee
  Meetup Access" and the body "Use pier entrance. Quiet table is beside the window." All three posts must
  be published. The final state of the application must be the "My Profile" section with the "Saved" tab
  selected, displaying the saved list with no post detail or comment forms open.
