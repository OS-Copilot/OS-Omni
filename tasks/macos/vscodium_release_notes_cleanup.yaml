task_id: macos.vscodium.release_notes_cleanup
platform: macos
instruction: "A VSCodium workspace named pilot_notes is already open. The relevant files\nare already available in the Explorer sidebar, and README.md is the active\neditor. The workspace also exposes a top-level settings.json alias that edits\nthe real .vscode/settings.json file for you.\n\nComplete the task with this exact file order:\n1. overwrite README.md with the final markdown below, then save\n2. press Cmd+P, type settings.json, press Enter\n3. overwrite the opened settings.json alias with the final JSON below, then save\n\nDo not use the command palette and do not edit any other files.\n\nReplace README.md with exactly:\n\n```md\n# Pilot Launch Notes\n\n## Overview\nThis workspace tracks the small pilot launch checklist for the support team.\n\n## Launch Checklist\n- [x] Confirm pilot team availability\n- [ ] Draft the onboarding note\n- [ ] Freeze the training deck\n\n## Risks\n- Shared inbox volume may spike during week one.\n- The support rota still needs backup coverage.\n-\
  \ Add backup coverage for Thursday morning.\n\n## Contacts\n- Delivery owner: Nina\n- Support lead: Marco\n```\n\nReplace .vscode/settings.json with exactly:\n\n```json\n{\n  \"editor.wordWrap\": \"on\",\n  \"files.trimTrailingWhitespace\": true,\n  \"editor.minimap.enabled\": true\n}\n```\n"
init:
  initializer_id: initializers.macos.vscodium:VSCodiumInitializer
  params:
    wait_ms: 6000
    open_settings_file: false
    open_workspace: true
    workspace_root: /Users/bench/Documents/pilot_notes
    fixture_root: files/vscodium/release_notes_cleanup/start
    file_aliases:
    - alias: settings.json
      target: .vscode/settings.json
    baseline_settings:
      breadcrumbs.enabled: false
      workbench.editor.showTabs: false
      workbench.list.openMode: singleClick
    starter_files:
    - README.md
    - settings.json
    active_file: README.md
evaluation:
  evaluator_id: evaluators.macos.vscodium:VSCodiumWorkspaceEvaluator
  params:
    workspace_root: /Users/bench/Documents/pilot_notes
    expected_root: files/vscodium/release_notes_cleanup/expected
    compare_paths:
    - README.md
    - .vscode/settings.json
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  difficulty: easy
