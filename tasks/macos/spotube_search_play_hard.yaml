task_id: macos.spotube.search_play_hard
platform: macos
instruction: >
  Open Spotube. If this is the first time opening, you may see a setup
  wizard - skip it or close it.
  Click on the "Search" tab in the left sidebar.
  In the search bar, type "Classical Piano" and press Enter.
  From the search results, click on the first track to start playing it.
  While the track is playing, click on the "Queue" tab to view the
  current playback queue.
  Verify that the track appears in the queue.
  Then go back to the Search tab and search for "Jazz Guitar".
  Click on the first track from the results to add it to the queue.
  Go back to the Queue tab and verify both tracks are in the queue.
  Finish after verifying both tracks are in the queue.
init:
  initializer_id: initializers.macos.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: |
        set -e
        killall Spotube >/dev/null 2>&1 || true
    - type: wait
      ms: 1200
    - type: run_bash
      script: |
        open -a Spotube
    - type: wait
      ms: 8000
evaluation:
  evaluator_id: evaluators.macos.command_check:CommandCheckEvaluator
  params:
    timeout: 120
    stdout_contains: "PASS"
    command: |
      set -euo pipefail
      python3 - <<'PY'
      import os

      # Check if Spotube database exists
      spotube_dir = os.path.expanduser("~/Library/Application Support/Spotube")
      if not os.path.exists(spotube_dir):
          raise SystemExit("SPOTUBE_DIR_NOT_FOUND")

      # Look for any database or cache files
      import glob
      db_files = glob.glob(os.path.join(spotube_dir, "**/*.db"), recursive=True)
      cache_files = glob.glob(os.path.join(spotube_dir, "**/*.json"), recursive=True)

      if not db_files and not cache_files:
          raise SystemExit("NO_DATA_FILES_FOUND")

      # Check if there are any search-related files
      search_found = False
      for f in db_files + cache_files:
          try:
              with open(f, 'r', errors='ignore') as fh:
                  content = fh.read()
                  if "Classical" in content or "Jazz" in content:
                      search_found = True
                      break
          except:
              continue

      if not search_found:
          raise SystemExit("SEARCH_HISTORY_NOT_FOUND")

      print("PASS")
      PY
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - macos
  - spotube
  - music
  - search
  - queue
  - hard
  app_name: spotube
  difficulty: hard
  description: Search for music and build a playback queue in Spotube.
