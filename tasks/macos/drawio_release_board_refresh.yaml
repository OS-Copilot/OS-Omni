task_id: macos.drawio.release_board_refresh
platform: macos
instruction: 'draw.io is already open with `/Users/bench/Downloads/release_board_refresh.drawio`.


  There are 6 rounded rectangles visible in a 2-row by 3-column grid.

  Replace the text inside the rectangles exactly as follows:


  - `Card 1` -> `Inbox`

  - `Card 2` -> `Spec Check`

  - `Card 3` -> `Draft Copy`

  - `Card 4` -> `QA Queue`

  - `Card 5` -> `Launch Note`

  - `Card 6` -> `Wrap-up`


  Do not create or delete any shapes. Only replace the text in the existing

  rounded rectangles, then save the file.

  '
init:
  initializer_id: initializers.macos.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: |
        set -e
        killall "draw.io" >/dev/null 2>&1 || true
        sleep 1
        APP_PATH=""
        for candidate in "$HOME/Applications/draw.io.app" "/Applications/draw.io.app"; do
          if [ -d "$candidate" ]; then
            APP_PATH="$candidate"
            break
          fi
        done
        if [ -z "$APP_PATH" ]; then
          APP_PATH="$(mdfind 'kMDItemFSName == "draw.io.app"' | head -n 1 || true)"
        fi
        [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ] || { echo "draw.io.app missing from ~/Applications, /Applications, and Spotlight" >&2; exit 1; }
        rm -f /Users/bench/Downloads/release_board_refresh.drawio
        rm -f /Users/bench/Downloads/.$release_board_refresh.drawio.dtmp
    - type: upload_file
      local_path: files/drawio/release_board_refresh/start/release_board_refresh.drawio
      path: /Users/bench/Downloads/release_board_refresh.drawio
    - type: run_bash
      script: |
        set -e
        APP_PATH=""
        for candidate in "$HOME/Applications/draw.io.app" "/Applications/draw.io.app"; do
          if [ -d "$candidate" ]; then
            APP_PATH="$candidate"
            break
          fi
        done
        if [ -z "$APP_PATH" ]; then
          APP_PATH="$(mdfind 'kMDItemFSName == "draw.io.app"' | head -n 1 || true)"
        fi
        [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ] || { echo "draw.io.app missing from ~/Applications, /Applications, and Spotlight" >&2; exit 1; }
        open -a "$APP_PATH" /Users/bench/Downloads/release_board_refresh.drawio
    - type: wait
      ms: 5000
    - type: run_bash
      script: "set -e\nosascript <<'APPLESCRIPT'\ntell application \"System Events\"\n  tell process \"draw.io\"\n    set position of window 1 to {40, 80}\n    set size of window 1 to {1800, 1000}\n  end tell\nend tell\nAPPLESCRIPT\n"
    - type: wait
      ms: 1500
evaluation:
  evaluator_id: evaluators.macos.drawio:DrawIODiagramEvaluator
  params:
    actual_path: /Users/bench/Downloads/release_board_refresh.drawio
    expected_path: files/drawio/release_board_refresh/expected/release_board_refresh.drawio
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  difficulty: easy
