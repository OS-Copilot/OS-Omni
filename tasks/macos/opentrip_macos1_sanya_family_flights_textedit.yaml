platform: macos
instruction: 'Book a Sanya family trip in the OpenTrip application using the pre-filled Lucas Lin account,
  which must remain signed in throughout the workflow, and record the trip summary in a TextEdit document.
  The hotel reservation must be for the "Sanya Cloud Terrace Boutique Stay" for four guests with a check-in
  date of 2026-06-14 and a check-out date of 2026-06-16, selected from a list sorted by "Top rated". This
  booking must specify the "Family Suite" room type, the contact phone number 13900004101, the payment
  method "Bank Card · Credit or debit card", and the note "Helpful staff stay". The outbound flight reservation
  must be from Shanghai (SHA) to Sanya (SYX) on 2026-06-14 in the "Business" cabin class, selecting the
  first flight option from the search results and adding a 32kg checked bag. This flight booking must
  list the traveler "Maya Chen · Passport", the contact phone number 13900004102, and the payment method
  "WeChat Pay · Scan or authorize payment". The return flight reservation must be from Sanya (SYX) to
  Shanghai (SHA) on 2026-06-16, selecting the first flight option from results sorted by "Lowest price"
  and adding a 15kg checked bag. This return booking must use the contact phone number 13900004103 and
  the payment method "Bank Card · Credit or debit card". A new plain text document in TextEdit must contain
  exactly three lines: DATES=JUN14-16, HOTEL=FAMILY CARD, and OUT=32KG RET15. This document must be saved
  as Sanya-Jun14.txt to the Desktop of the macOS guest environment, with the TextEdit application remaining
  the active foreground window displaying the saved document at completion.'
