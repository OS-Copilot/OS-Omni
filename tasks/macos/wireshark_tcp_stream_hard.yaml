task_id: macos.wireshark.tcp_stream_hard
platform: macos
instruction: >
  Open the seeded Wireshark capture /Users/bench/Downloads/retail_mix.pcapng.
  In the display filter bar, type "tcp" and press Enter to apply the filter.
  Right-click on the first TCP packet in the list and select "Follow" →
  "TCP Stream" from the context menu.
  In the TCP Stream window, note the stream content. Close the stream window.
  Then go to Statistics → Conversations. In the Conversations window, click
  the "TCP" tab. Note the number of TCP conversations shown.
  Close the Conversations window.
  Finally, go to File → Export Specified Packets. In the export dialog,
  select "Displayed" as the packet range and save as
  /Users/bench/Documents/tcp_capture.pcapng.
  Finish after the export succeeds.
init:
  initializer_id: initializers.macos.setup:DesktopSetupInitializer
  params:
    steps:
    - type: run_bash
      script: |
        set -e
        killall Wireshark >/dev/null 2>&1 || true
        mkdir -p /Users/bench/Downloads /Users/bench/Documents
        python3 - <<'PY'
from pathlib import Path
from urllib.request import urlopen
url = "https://huggingface.co/datasets/xlangai/ubuntu_osworld_file_cache/resolve/main/wireshark/C9CCC440-B4EE-407E-B53D-B389ED564F8E/retail_mix.pcapng"
out = Path("/Users/bench/Downloads/retail_mix.pcapng")
out.parent.mkdir(parents=True, exist_ok=True)
out.write_bytes(urlopen(url).read())
PY
    - type: wait
      ms: 1200
    - type: run_bash
      script: |
        open -a Wireshark /Users/bench/Downloads/retail_mix.pcapng
    - type: wait
      ms: 10000
evaluation:
  evaluator_id: evaluators.macos.command_check:CommandCheckEvaluator
  params:
    timeout: 120
    stdout_contains: "PASS"
    command: |
      set -euo pipefail
      python3 - <<'PY'
      import os

      # Check if the exported capture file exists
      pcap_path = os.path.expanduser("~/Documents/tcp_capture.pcapng")
      if not os.path.exists(pcap_path):
          raise SystemExit("PCAP_FILE_NOT_FOUND")

      # Check file size (should be > 0)
      if os.path.getsize(pcap_path) == 0:
          raise SystemExit("PCAP_FILE_EMPTY")

      print("PASS")
      PY
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - macos
  - wireshark
  - tcp
  - stream
  - export
  - hard
  app_name: wireshark
  difficulty: hard
  description: Follow a TCP stream and export filtered packets in Wireshark.
