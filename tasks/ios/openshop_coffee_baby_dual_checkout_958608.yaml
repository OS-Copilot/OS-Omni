instruction: 'Sign in to the OpenShop app with the account for Lucas Lin and the password “spring2026”,
  then complete two distinct checkout transactions and submit two product reviews. The first order must
  contain four items in this exact sequence: the “Mountain Isle Pour-Over Coffee 20 Pack” with the “40
  sachets $143.55” specification from the Grocery category, the “Verdant Pro Noise-Canceling Headphones”
  with the “White $299” specification found by searching “Verdant Pro” within the Electronics category,
  the “Lumen Fast-Charge LED Desk Lamp” from the Office category, and the “Orbit Smart Phone Stand” with
  the “Black” specification found by searching “Orbit Smart”. The quantity of the “Verdant Pro Noise-Canceling
  Headphones” in this first cart must be increased to two. The checkout for this first order must use
  the “Home” address card, “Alipay” as the payment method, and include “Front desk by 6” in the Order
  Note field. Following the placement of the first order, the latest order card with the status “Just
  placed” must be accessed to submit two reviews: a “5 / 5” rating with the text “Easy office coffee”
  for the “Mountain Isle Pour-Over Coffee 20 Pack”, and a “4 / 5” rating with the text “Clear call sound”
  for the “Verdant Pro Noise-Canceling Headphones”. The second order must contain three items in this
  exact sequence: the “BebeCare BPA-Free Baby Grooming Kit” from the Baby category, the “North Orchard
  Whole Grain Cookie Tin” found by searching “Whole Grain Cookie” within the Grocery category, and the
  “SoftSprout Gentle Pacifier Clip Set” from the Baby category. The quantity of the “BebeCare BPA-Free
  Baby Grooming Kit” in this second cart must be increased to two. The checkout for this second order
  must use the “Office” address card and “WeChat Pay” as the payment method.'
