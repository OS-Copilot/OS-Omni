  in the cart in this exact sequence: the “BloomCare Nourishing Body Lotion” from the Beauty category
  and the “Paperfield Compact Clipboard Set” from the Office category. This second order must be checked
  out using the “Home” address card and “Cash on Delivery” as the payment method, with the text “Leave
  at reception” entered in the Order Note field.'
