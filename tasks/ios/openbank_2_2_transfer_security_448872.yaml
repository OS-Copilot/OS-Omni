instruction: |-
  Create two new recipient records and submit three financial transactions in OpenBank, while updating specific security notification preferences and alert states. The first recipient record must be named Owen Reed with the nickname Internet, bank OpenBank, routing number 021000089, and account number 0000007799. The second recipient record must be named Nora Vale with the nickname Cloud backup, bank OpenBank, routing number 021000089, and account number 0000007842. Both records must be saved.

  Submit a transfer from the Everyday Checking ••••2381 account to Owen Reed for an amount of 3.05 with the memo Internet and the date 2026-06-01. Submit a second transfer from the Everyday Checking ••••2381 account to Rainy Day Savings for an amount of 4.10 with the memo Internet reserve and the date 2026-06-01. Schedule a bill payment to City Utilities from the Everyday Checking ••••2381 account for an amount of 92.35 with the date 2026-06-02 and the memo Utility June.

  Within the Security section, enable the Text notification option in the Payment due form and save the preference. Disable the Push notification option in the Large purchase form and save the preference. Mark the Upcoming bill alert as read and mark the New sign-in from macOS alert as read. Lock the Everyday Checking debit card, which is currently in an Unlocked state.
