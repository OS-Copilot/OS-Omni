task_id: ios.deltachat.create_contact_forward_and_notify
platform: ios
instruction: >
  In Delta Chat, create a new contact with email address benchrecv@example.test
  and name "Bench Courier". Create another new contact with email address
  benchsupervisor@example.test and name "Bench Supervisor". Then open the existing
  conversation with benchsender@example.test and forward the message
  "courier_packet_ready_2047" to Bench Courier. After that, open the conversation
  with Bench Courier and send "Please confirm when you receive the forwarded packet."
  Then open the conversation with Bench Supervisor and send
  "Bench Courier has the packet; I am waiting for confirmation." Finally, open the
  conversation with benchsender@example.test and send
  "I forwarded the packet to Bench Courier and notified Bench Supervisor."
init:
  initializer_id: initializers.ios.greenmail_seed_open_app:GreenMailSeedOpenAppInitializer
  params:
    bundle_id: chat.delta
    api_base_url: "http://127.0.0.1:8081"
    purge_greenmail: true
    seed_after_launch: true
    launch_before_seed_wait_ms: 3000
    seed_messages:
      - sender_email: "benchsender@example.test"
        sender_password: "benchpass"
        recipient_email: "benchchat@example.test"
        subject: "Courier packet"
        body: "courier_packet_ready_2047"
        chat_version: "1.0"
    wait_ms: 5000
evaluation:
  evaluator_id: evaluators.ios.deltachat_multi_step_workflow:DeltaChatMultiStepWorkflowEvaluator
  params:
    forward_params:
      api_base_url: "http://127.0.0.1:8081"
      sender_email: "benchchat@example.test"
      recipient_email: "benchrecv@example.test"
      body: "courier_packet_ready_2047"
      mailbox: "INBOX"
      timeout_seconds: 20
      poll_interval_seconds: 1
    courier_followup_params:
      api_base_url: "http://127.0.0.1:8081"
      sender_email: "benchchat@example.test"
      recipient_email: "benchrecv@example.test"
      body: "Please confirm when you receive the forwarded packet."
      mailbox: "INBOX"
      timeout_seconds: 20
      poll_interval_seconds: 1
    teammate_notify_params:
      api_base_url: "http://127.0.0.1:8081"
      sender_email: "benchchat@example.test"
      recipient_email: "benchsender@example.test"
      body: "I forwarded the packet to Bench Courier and notified Bench Supervisor."
      mailbox: "INBOX"
      timeout_seconds: 20
      poll_interval_seconds: 1
    additional_message_params:
      - api_base_url: "http://127.0.0.1:8081"
        sender_email: "benchchat@example.test"
        recipient_email: "benchsupervisor@example.test"
        body: "Bench Courier has the packet; I am waiting for confirmation."
        mailbox: "INBOX"
        timeout_seconds: 20
        poll_interval_seconds: 1
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [chat, deltachat, greenmail, communication, multi_step, hard, benchmark]
  app: Delta Chat
  app_bundle_id: chat.delta
  description: "Create two contacts, forward a seeded message, then send three follow-up chat messages across the courier, supervisor, and source conversations."
  prerequisites:
    - "Delta Chat is installed on the simulator."
    - "The benchchat@example.test account is already configured in Delta Chat."
    - "GreenMail is running on the host and reachable at http://127.0.0.1:8081."
