instruction: Export four distinct photos from the Open Photo Edit app, saving each as a finished export
  before moving to the next. The first export is the photo showing a close-up of a blue-green electric
  guitar, which must have its Brightness adjustment set to 10, its Cyan channel in the HSL panel set to
  -10, the "Clean" filter preset applied, and its Crop panel Width set to 58 and Height set to 89. The
  second export is the photo of a woman in a white shirt in a grey studio setting, which must have its
  Smooth adjustment in the Portrait panel set to 8, its Orange channel in the HSL panel set to -5 and
  Yellow channel set to -4, the "Portrait" filter preset applied, and its Crop panel Width set to 51 and
  Height set to 90. The third export is the photo of a bearded man in black clothing near a dark window,
  which must have its Brightness adjustment set to 14 and Contrast adjustment set to -8, the "Film" filter
  preset applied, and its Crop panel Width set to 53 and Height set to 90. The fourth export is the photo
  of a short-haired man in a grey shirt near a bright window, which must have its Saturation adjustment
  set to 5, Temperature adjustment set to -4, and Sharpen adjustment set to 6, the "Clean" filter preset
  applied, and its Crop panel Width set to 63 and Height set to 89. All four images must be saved as finished
  exports.
