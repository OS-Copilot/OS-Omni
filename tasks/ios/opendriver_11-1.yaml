task_id: ios.opendriver.11-1
platform: ios
instruction: |-
  Initiate and cancel two rides in the OpenDriver application, then submit refund requests for two specific historical orders and create a support ticket with a reply, leaving the application positioned on the refund status area of the Downtown Palo Alto to Meta MPK 23 order.

  The first ride request must originate from the current location and be destined for Meta MPK 23, the saved destination associated with the Work flag, with Stanford University, Stanford, CA added as a stop along the route. This ride must use the Green option, described as Hybrid or electric, with the payment method set to PayPal rider@example.com. After submitting this request to enter the active ride state, the Safety section’s Share trip interface must be opened and closed, and the ride must be canceled with confirmation to reach the Ride canceled result page, which is then closed.

  The second ride request must originate from the current location and be destined for Downtown Palo Alto, the saved destination associated with the Home flag, using the Green option with the payment method set to Visa ending 4242. Before finalizing this selection, the pricing for the RideXL and Priority pickup options must be viewed, and the Green option must be re-selected. After submitting this request to enter the active ride state, the Safety section’s Share trip interface must be opened and closed, and the Ride PIN information must be opened and closed. The ride must then be canceled with confirmation to reach the Ride canceled result page, which is then closed, ensuring no active rides remain in the system.

  In the ride history, the completed order for the route from Downtown Palo Alto to Meta MPK 23 must be opened and a refund request submitted with the reason exactly as Fare review. The order for the route from Stanford University to Stanford Shopping Center must also be opened and a refund request submitted with the reason exactly as Fare review.

  A new support ticket must be created in the Safety section with the message text Blue umbrella, and a reply with the text Rear seat must be added and sent within this ticket. The final state of the application must be the ride history view with the order for the route from Downtown Palo Alto to Meta MPK 23 open and positioned to display the refund status area for that specific order.
