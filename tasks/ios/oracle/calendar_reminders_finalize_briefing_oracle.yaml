task_id: ios.calendar_reminders.oracle.finalize_briefing
platform: ios
instruction: >
  In Calendar, update today's event Bench Volunteer Briefing Draft so the title becomes
  Bench Volunteer Briefing Final, the time becomes 18:15-19:00, and the location becomes
  Cedar Room. Create a new event for tomorrow titled Bench Volunteer Debrief from 09:30-10:00
  at Cedar Room. Then switch to Reminders, open the list Bench Volunteer Follow-up, rename
  Print draft signup sheet to Print final signup sheet, delete Old volunteer draft, keep
  Buy sparkling water unchanged, and add three new reminders: Send Bench Volunteer Briefing Final agenda,
  Prepare Cedar Room badges, and Review Bench Volunteer Debrief notes.
init:
  initializer_id: initializers.ios.calendar_reminders_cross_app:CalendarRemindersCrossAppInitializer
  params:
    bundle_id: com.apple.mobilecal
    reminder_params:
      bundle_id: com.apple.reminders
      list_name: "Bench Volunteer Follow-up"
      purge_existing_reminders: true
      seed_reminders:
        - title: "Print draft signup sheet"
        - title: "Old volunteer draft"
        - title: "Buy sparkling water"
    calendar_params:
      bundle_id: com.apple.mobilecal
      purge_all_events: true
      purge_summaries:
        - "Bench Volunteer Briefing Draft"
        - "Bench Volunteer Briefing Final"
        - "Bench Volunteer Debrief"
        - "Bench Pharmacy Run"
        - "Bench Evening Walk"
      seed_events:
        - summary: "Bench Volunteer Briefing Draft"
          day_offset: 0
          start_time: "17:00"
          end_time: "17:45"
          location: "Birch Room"
        - summary: "Bench Pharmacy Run"
          day_offset: 0
          start_time: "18:10"
          end_time: "18:30"
          location: "Market Street"
        - summary: "Bench Evening Walk"
          day_offset: 0
          start_time: "20:00"
          end_time: "20:30"
          location: "Riverside"
      wait_ms: 1500
evaluation:
  evaluator_id: evaluators.ios.calendar_reminders_cross_app:CalendarRemindersCrossAppEvaluator
  params:
    calendar_params:
      present_events:
        - summary: "Bench Volunteer Briefing Final"
          day_offset: 0
          start_time: "18:15"
          end_time: "19:00"
          location: "Cedar Room"
        - summary: "Bench Volunteer Debrief"
          day_offset: 1
          start_time: "09:30"
          end_time: "10:00"
          location: "Cedar Room"
        - summary: "Bench Pharmacy Run"
          day_offset: 0
          start_time: "18:10"
          end_time: "18:30"
          location: "Market Street"
        - summary: "Bench Evening Walk"
          day_offset: 0
          start_time: "20:00"
          end_time: "20:30"
          location: "Riverside"
      absent_summaries:
        - "Bench Volunteer Briefing Draft"
      timeout_seconds: 10
      poll_interval_seconds: 0.5
    reminder_params:
      bundle_id: com.apple.reminders
      list_name: "Bench Volunteer Follow-up"
      present_titles:
        - "Print final signup sheet"
        - "Buy sparkling water"
        - "Send Bench Volunteer Briefing Final agenda"
        - "Prepare Cedar Room badges"
        - "Review Bench Volunteer Debrief notes"
      absent_titles:
        - "Print draft signup sheet"
        - "Old volunteer draft"
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [cross_app, calendar, reminders, ios, native, productivity, hard, benchmark, oracle]
  app: Calendar
  app_bundle_id: com.apple.mobilecal
  description: Oracle state-seed task for ios.calendar_reminders.finalize_briefing.
  oracle_for: ios.calendar_reminders.finalize_briefing
  oracle_actions:
    - type: seed_state
      store: calendar
      params:
        present_events:
          - summary: "Bench Volunteer Briefing Final"
            day_offset: 0
            start_time: "18:15"
            end_time: "19:00"
            location: "Cedar Room"
          - summary: "Bench Volunteer Debrief"
            day_offset: 1
            start_time: "09:30"
            end_time: "10:00"
            location: "Cedar Room"
          - summary: "Bench Pharmacy Run"
            day_offset: 0
            start_time: "18:10"
            end_time: "18:30"
            location: "Market Street"
          - summary: "Bench Evening Walk"
            day_offset: 0
            start_time: "20:00"
            end_time: "20:30"
            location: "Riverside"
        absent_summaries:
          - "Bench Volunteer Briefing Draft"
    - type: seed_state
      store: reminders
      params:
        bundle_id: com.apple.reminders
        list_name: "Bench Volunteer Follow-up"
        present_titles:
          - "Print final signup sheet"
          - "Buy sparkling water"
          - "Send Bench Volunteer Briefing Final agenda"
          - "Prepare Cedar Room badges"
          - "Review Bench Volunteer Debrief notes"
    - type: success
      message: Oracle state seeded.
