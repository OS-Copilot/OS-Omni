task_id: ios.fsnotes.oracle.move_rename_and_update_note
platform: ios
instruction: 'In FSNotes, create folders named Release Archive, Meeting Prep, and Carrier Updates. Move the note Sprint Review Draft into Release Archive, rename it to Sprint Review Final, and add this section at the end of the note exactly: ## Follow-up - Send summary - Book retro room Move the note Shipping Notes into Carrier Updates, rename it to Shipping Followup, and add this line at the end of the note exactly: ETA: Request by 4 PM Then create a new note in Meeting Prep named Retro Checklist with these four lines exactly: Owner: Alex Room: Cedar Status: Pending confirmation Bring: Printed agenda Leave the other notes unchanged.

  '
init:
  initializer_id: initializers.ios.fsnotes_seed_open_app:FSNotesSeedOpenAppInitializer
  params:
    bundle_id: co.fluder.mobile.FSNotes-iOS
    seed_spec:
      purge_all_notes: true
      notes:
      - path: Sprint Review Draft.md
        content: 'Notes for the weekly sprint review.


          - Highlight release blockers

          - Confirm QA coverage

          '
      - path: Shipping Notes.md
        content: 'Carrier:

          Tracking pending

          '
      - path: Team Contacts.md
        content: 'PM: Alex

          QA: Sam

          '
    wait_ms: 1200
evaluation:
  evaluator_id: evaluators.ios.fsnotes_state:FSNotesStateEvaluator
  params:
    assert_spec:
      note_count: 4
      folder_count: 3
      present_folders:
      - Release Archive
      - Meeting Prep
      - Carrier Updates
      present_notes:
      - path: Release Archive/Sprint Review Final.md
        content_contains:
        - Notes for the weekly sprint review.
        - '- Highlight release blockers'
        - '- Confirm QA coverage'
        - '## Follow-up'
        - '- Send summary'
        - '- Book retro room'
      - path: Meeting Prep/Retro Checklist.md
        exact_content: 'Owner: Alex

          Room: Cedar

          Status: Pending confirmation

          Bring: Printed agenda

          '
      - path: Carrier Updates/Shipping Followup.md
        content_contains:
        - 'Carrier:'
        - Tracking pending
        - 'ETA: Request by 4 PM'
      - path: Team Contacts.md
        exact_content: 'PM: Alex

          QA: Sam

          '
      absent_notes:
      - path: Sprint Review Draft.md
      - title: Sprint Review Draft
      - path: Shipping Notes.md
      - title: Shipping Notes
    timeout_seconds: 10
    poll_interval_seconds: 0.5
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - ios
  - fsnotes
  - notes
  - folder
  - move
  - rename
  - edit
  - hard
  - benchmark
  - oracle
  app: FSNotes
  app_bundle_id: co.fluder.mobile.FSNotes-iOS
  description: Oracle state-seed task for ios.fsnotes.move_rename_and_update_note.
  prerequisites:
  - FSNotes is installed on the simulator.
  oracle_for: ios.fsnotes.move_rename_and_update_note
  oracle_actions:
  - type: seed_state
    store: fsnotes
    params:
      assert_spec:
        note_count: 4
        folder_count: 3
        present_folders:
        - Release Archive
        - Meeting Prep
        - Carrier Updates
        present_notes:
        - path: Release Archive/Sprint Review Final.md
          content_contains:
          - Notes for the weekly sprint review.
          - '- Highlight release blockers'
          - '- Confirm QA coverage'
          - '## Follow-up'
          - '- Send summary'
          - '- Book retro room'
        - path: Meeting Prep/Retro Checklist.md
          exact_content: 'Owner: Alex

            Room: Cedar

            Status: Pending confirmation

            Bring: Printed agenda

            '
        - path: Carrier Updates/Shipping Followup.md
          content_contains:
          - 'Carrier:'
          - Tracking pending
          - 'ETA: Request by 4 PM'
        - path: Team Contacts.md
          exact_content: 'PM: Alex

            QA: Sam

            '
        absent_notes:
        - path: Sprint Review Draft.md
        - title: Sprint Review Draft
        - path: Shipping Notes.md
        - title: Shipping Notes
  - type: success
    message: Oracle state seeded.
