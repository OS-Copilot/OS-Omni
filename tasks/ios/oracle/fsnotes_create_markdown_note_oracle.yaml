task_id: ios.fsnotes.oracle.create_markdown_note
platform: ios
instruction: 'In FSNotes, create a new Markdown note titled Bench Launch Brief. Write these two lines in the note body exactly: `Owner: iOS Bench Team` and `Status: Ready for review`.'
init:
  initializer_id: initializers.ios.fsnotes_seed_open_app:FSNotesSeedOpenAppInitializer
  params:
    bundle_id: co.fluder.mobile.FSNotes-iOS
    seed_spec:
      purge_all_notes: true
      notes:
      - path: Bench Inbox.md
        content: 'Pending:

          - Review initializer logs

          '
      - path: Travel Checklist.md
        content: '- Cable

          - Adapter

          '
    wait_ms: 1200
evaluation:
  evaluator_id: evaluators.ios.fsnotes_state:FSNotesStateEvaluator
  params:
    assert_spec:
      note_count: 3
      folder_count: 0
      present_notes:
      - title: Bench Launch Brief
        content_contains:
        - 'Owner: iOS Bench Team'
        - 'Status: Ready for review'
      - path: Bench Inbox.md
        exact_content: 'Pending:

          - Review initializer logs

          '
      - path: Travel Checklist.md
        exact_content: '- Cable

          - Adapter

          '
    timeout_seconds: 10
    poll_interval_seconds: 0.5
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags:
  - ios
  - fsnotes
  - notes
  - markdown
  - create
  - simple
  - benchmark
  - oracle
  app: FSNotes
  app_bundle_id: co.fluder.mobile.FSNotes-iOS
  description: Oracle state-seed task for ios.fsnotes.create_markdown_note.
  prerequisites:
  - FSNotes is installed on the simulator.
  oracle_for: ios.fsnotes.create_markdown_note
  oracle_actions:
  - type: seed_state
    store: fsnotes
    params:
      assert_spec:
        note_count: 3
        folder_count: 0
        present_notes:
        - title: Bench Launch Brief
          content_contains:
          - 'Owner: iOS Bench Team'
          - 'Status: Ready for review'
        - path: Bench Inbox.md
          exact_content: 'Pending:

            - Review initializer logs

            '
        - path: Travel Checklist.md
          exact_content: '- Cable

            - Adapter

            '
  - type: success
    message: Oracle state seeded.
