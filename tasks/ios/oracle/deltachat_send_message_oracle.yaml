task_id: ios.deltachat.oracle.send_message
platform: ios
instruction: "Use Delta Chat to send a message to benchsender@example.test that says deltachat_ios_message."
init:
  initializer_id: initializers.ios.greenmail_open_app:GreenMailOpenAppInitializer
  params:
    bundle_id: chat.delta
    api_base_url: "http://127.0.0.1:8081"
    purge_greenmail: true
    wait_ms: 1500
evaluation:
  evaluator_id: evaluators.ios.deltachat_send_message:DeltaChatSendMessageEvaluator
  params:
    api_base_url: "http://127.0.0.1:8081"
    sender_email: "benchchat@example.test"
    recipient_email: "benchsender@example.test"
    body: "deltachat_ios_message"
    mailbox: "INBOX"
    timeout_seconds: 20
    poll_interval_seconds: 1
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [chat, deltachat, greenmail, communication, medium, benchmark, oracle]
  app: Delta Chat
  app_bundle_id: chat.delta
  description: "Oracle state-seed task for ios.deltachat.send_message."
  prerequisites:
    - "Delta Chat is installed on the simulator."
    - "The benchchat@example.test account is already configured in Delta Chat."
    - "GreenMail is running on the host and reachable at http://127.0.0.1:8081."
  oracle_for: ios.deltachat.send_message
  oracle_actions:
    - type: seed_state
      store: greenmail
      params:
        api_base_url: "http://127.0.0.1:8081"
        purge: true
        messages:
          - sender_email: "benchchat@example.test"
            recipient_email: "benchsender@example.test"
            body: "deltachat_ios_message"
            mailbox: "INBOX"
    - type: success
      message: Oracle state seeded.
