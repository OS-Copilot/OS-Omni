task_id: ios.maily.oracle.forward_delete_and_send_followup
platform: ios
instruction: >
  In Maily, open the email with subject "Bench Venue Packet" and forward it to
  benchchat@example.test. Then go back to the inbox and delete the emails with subjects
  "Bench Venue Packet Draft" and "Bench Venue Packet Working Notes". After that, compose a new email to benchrecv@example.test
  with subject "Bench Venue Packet Sent" and body
  "The venue packet has been forwarded to ops and the outdated draft was removed."
  Leave the email "Bench Venue Packet Receipt" unchanged.
init:
  initializer_id: initializers.ios.greenmail_seed_open_app:GreenMailSeedOpenAppInitializer
  params:
    bundle_id: de.enough.maily
    api_base_url: "http://127.0.0.1:8081"
    purge_greenmail: true
    seed_messages:
      - sender_email: "benchrecv@example.test"
        sender_password: "benchpass"
        recipient_email: "benchsender@example.test"
        subject: "Bench Venue Packet"
        body: "venue_packet_ready_2047"
      - sender_email: "benchrecv@example.test"
        sender_password: "benchpass"
        recipient_email: "benchsender@example.test"
        subject: "Bench Venue Packet Draft"
        body: "old_venue_packet_draft_remove_me"
      - sender_email: "benchrecv@example.test"
        sender_password: "benchpass"
        recipient_email: "benchsender@example.test"
        subject: "Bench Venue Packet Working Notes"
        body: "venue_packet_working_notes_remove_me"
      - sender_email: "benchrecv@example.test"
        sender_password: "benchpass"
        recipient_email: "benchsender@example.test"
        subject: "Bench Venue Packet Receipt"
        body: "venue_packet_receipt_keep_me"
    wait_ms: 1200
evaluation:
  evaluator_id: evaluators.ios.maily_multi_step_workflow:MailyMultiStepWorkflowEvaluator
  params:
    delete_params:
      - api_base_url: "http://127.0.0.1:8081"
        recipient_email: "benchsender@example.test"
        mailbox: "INBOX"
        target_subject: "Bench Venue Packet Draft"
        decoy_subjects:
          - "Bench Venue Packet"
          - "Bench Venue Packet Receipt"
        timeout_seconds: 15
        poll_interval_seconds: 1
      - api_base_url: "http://127.0.0.1:8081"
        recipient_email: "benchsender@example.test"
        mailbox: "INBOX"
        target_subject: "Bench Venue Packet Working Notes"
        decoy_subjects:
          - "Bench Venue Packet"
          - "Bench Venue Packet Receipt"
        timeout_seconds: 15
        poll_interval_seconds: 1
    forward_params:
      api_base_url: "http://127.0.0.1:8081"
      sender_email: "benchsender@example.test"
      recipient_email: "benchchat@example.test"
      required_body_fragment: "venue_packet_ready_2047"
      mailbox: "INBOX"
      timeout_seconds: 20
      poll_interval_seconds: 1
    send_params:
      api_base_url: "http://127.0.0.1:8081"
      sender_email: "benchsender@example.test"
      recipient_email: "benchrecv@example.test"
      subject: "Bench Venue Packet Sent"
      body: "The venue packet has been forwarded to ops and the outdated draft was removed."
      mailbox: "INBOX"
      timeout_seconds: 20
      poll_interval_seconds: 1
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [email, maily, greenmail, communication, multi_step, hard, benchmark, oracle]
  app: Maily
  app_bundle_id: de.enough.maily
  description: "Oracle state-seed task for ios.maily.forward_delete_and_send_followup."
  prerequisites:
    - "Maily is installed on the simulator."
    - "The benchsender@example.test account is already configured in Maily."
    - "GreenMail is running on the host and reachable at http://127.0.0.1:8081."
  oracle_for: ios.maily.forward_delete_and_send_followup
  oracle_actions:
    - type: seed_state
      store: greenmail
      params:
        api_base_url: "http://127.0.0.1:8081"
        purge: true
        messages:
          - sender_email: "benchrecv@example.test"
            sender_password: "benchpass"
            recipient_email: "benchsender@example.test"
            subject: "Bench Venue Packet"
            body: "venue_packet_ready_2047"
          - sender_email: "benchrecv@example.test"
            sender_password: "benchpass"
            recipient_email: "benchsender@example.test"
            subject: "Bench Venue Packet Receipt"
            body: "venue_packet_receipt_keep_me"
          - sender_email: "benchsender@example.test"
            recipient_email: "benchchat@example.test"
            mailbox: "INBOX"
            body: "venue_packet_ready_2047"
          - sender_email: "benchsender@example.test"
            recipient_email: "benchrecv@example.test"
            subject: "Bench Venue Packet Sent"
            body: "The venue packet has been forwarded to ops and the outdated draft was removed."
            mailbox: "INBOX"
    - type: success
      message: Oracle state seeded.
