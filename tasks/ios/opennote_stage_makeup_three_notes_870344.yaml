instruction: |-
  Create and publish three new notes in OpenNote, each categorized under Beauty, and then update the profile and interact with an existing note. The first note must be titled `White Red Stage Look` with a body containing the exact lines `White base on face.`, `Red lines lift eyes.`, `Round focus on nose.`, `Keep lips symmetric.`, `Set highlight areas.`, and `Check edges pre show` in that order. Set the Location to `West rehearsal room` and the Tags to `stage makeup red`. For the cover image, select the Photo Library source and choose the thumbnail of the white and red painted clown located on the left side of the first row in the photo grid. Publish this note.

  The second note must be titled `Blue Red Stage Look` with a body containing the exact lines `Lower blue base tone`, `Red marks on cheeks`, `Keep eye edges sharp`, `Shorten lip outline`, `Set in cool light`, and `Compare both roles` in that order. Set the Location to `Main stage backstage` and the Tags to `blue red contours`. For the cover image, select the Photo Library source and choose the thumbnail of the blue and red painted clown located on the right side of the first row in the photo grid. Publish this note.

  The third note must be titled `Two Role Makeup List` with a body containing the exact lines `Pale base for red`, `Bold blus outline`, `Keep red focal spot`, `Test cool warm light`, and `Deliver by run sheet` in that order. Set the Location to `Makeup run zone` and the Tags to `role makeup run`. Enable the "Use text cover" option for this note instead of selecting an image. Publish this final note.

  The profile Role input field must contain the text ` Stage makeup editor` appended to the end of its existing content, with the changes saved. The existing note titled `Friday cushion foundation with one shade too peachy` within the Beauty category must have both its Like and Save buttons activated.
