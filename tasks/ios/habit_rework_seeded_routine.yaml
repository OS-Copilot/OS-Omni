task_id: ios.habit.rework_seeded_routine
platform: ios
instruction: >
  In Habit, make these changes to the seeded habits. Rename Morning Tidy to Studio Reset,
  change its motivation to Reset the tables and wipe the counters before lunch, and change
  its color to blue. Rename Stretch Break to Mobility Reset, change its motivation to
  Two rounds of shoulder and hip stretches, and change its color to purple. Rename Budget Review
  to Receipt Review, change its motivation to File every receipt before Sunday, and change its
  color to orange. Delete Inbox Zero. Add a new habit named Pack Tomorrow Bag with the motivation
  Lay out laptop, badge, and charger and set its color to green. Leave Water Plants unchanged.
init:
  initializer_id: initializers.ios.habit_seed_open_app:HabitSeedOpenAppInitializer
  params:
    bundle_id: co.nazariizomko.Habit
    seed_spec:
      habits:
        - title: "Morning Tidy"
          motivation: "Reset mugs and papers after breakfast."
          color: "orange"
        - title: "Stretch Break"
          motivation: "Do one short stretch between meetings."
          color: "red"
        - title: "Inbox Zero"
          motivation: "Clear every unread email before dinner."
          color: "yellow"
        - title: "Water Plants"
          motivation: "Check the window plants every evening."
          color: "green"
        - title: "Budget Review"
          motivation: "Review card charges on Friday."
          color: "yellow"
    wait_ms: 1200
evaluation:
  evaluator_id: evaluators.ios.habit_state:HabitStateEvaluator
  params:
    bundle_id: co.nazariizomko.Habit
    assert_spec:
      present_habits:
        - title: "Studio Reset"
          motivation: "Reset the tables and wipe the counters before lunch."
          color: "blue"
        - title: "Mobility Reset"
          motivation: "Two rounds of shoulder and hip stretches."
          color: "purple"
        - title: "Water Plants"
          motivation: "Check the window plants every evening."
          color: "green"
        - title: "Receipt Review"
          motivation: "File every receipt before Sunday."
          color: "orange"
        - title: "Pack Tomorrow Bag"
          motivation: "Lay out laptop, badge, and charger."
          color: "green"
      absent_titles:
        - "Morning Tidy"
        - "Stretch Break"
        - "Inbox Zero"
        - "Budget Review"
      exact_titles:
        - "Studio Reset"
        - "Mobility Reset"
        - "Water Plants"
        - "Receipt Review"
        - "Pack Tomorrow Bag"
      habit_count: 5
    timeout_seconds: 10
    poll_interval_seconds: 0.5
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [habit, ios, edit, delete, create, hard, benchmark]
  app: Habit
  app_bundle_id: co.nazariizomko.Habit
  description: "Rework a seeded Habit routine with three multi-field edits, one deletion, and one new habit."
  prerequisites:
    - "Habit is installed on the simulator."
