task_id: ios.reminders.create_single_reminder
platform: ios
instruction: >
  In the Reminders app, go to the "Benchmark Tasks" list and create a new reminder titled
  "Pay studio rent". Leave the existing reminders unchanged.
init:
  initializer_id: initializers.ios.reminder_seed_open_app:ReminderSeedOpenAppInitializer
  params:
    bundle_id: com.apple.reminders
    list_name: "Benchmark Tasks"
    purge_existing_reminders: true
    seed_reminders:
      - title: "Buy apples"
      - title: "Reply to Zoe"
    terminate_after_setup: true
    return_to_lists_home_before_terminate: true
evaluation:
  evaluator_id: evaluators.ios.reminder_list_state:ReminderListStateEvaluator
  params:
    bundle_id: com.apple.reminders
    list_name: "Benchmark Tasks"
    present_titles:
      - "Buy apples"
      - "Reply to Zoe"
      - "Pay studio rent"
    absent_titles: []
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [reminders, create, ios, native, productivity, simple, benchmark]
  app: Reminders
  app_bundle_id: com.apple.reminders
  description: Create one new reminder in a seeded Reminders list.
