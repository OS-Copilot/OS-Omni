task_id: ios.openshop.add_coffee_to_cart
platform: ios
instruction: "In OpenShop, search for coffee, find Mountain Isle Pour-Over Coffee 20 Pack, and add exactly one unit of it to the cart."
init:
  initializer_id: initializers.ios.openshop_seed_open_app:OpenShopSeedOpenAppInitializer
  params:
    bundle_id: com.killt.openshop
    login_session: false
    cart_items: []
    wait_ms: 1200
evaluation:
  evaluator_id: evaluators.ios.openshop_state:OpenShopStateEvaluator
  params:
    bundle_id: com.killt.openshop
    present_cart_items:
      - product_id: p1005
        quantity: 1
    cart_size: 1
    order_count: 0
    absent_cart_product_ids:
      - p1001
      - p1002
      - p1003
      - p1004
      - p1006
    timeout_seconds: 10
    poll_interval_seconds: 0.5
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [shopping, ios, openshop, cart, search, simple, benchmark]
  app: OpenShop
  app_bundle_id: com.killt.openshop
  description: "Search for one specific product in OpenShop and add it to the cart."
  prerequisites:
    - "OpenShop is installed on the simulator."
