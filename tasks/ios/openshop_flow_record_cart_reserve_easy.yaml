task_id: ios.openshop_flow.record_cart_reserve_easy
platform: ios
instruction: >
  In OpenShop, search for coffee, find Mountain Isle Pour-Over Coffee 20 Pack, and
  add exactly one unit of it to the cart. Then open Flow and record a new expense on
  Bench Checking titled Bench Coffee Cart Reserve, amount 66.00, in the Bench Coffee
  category, with the note OpenShop cart: coffee hold for tasting. Leave the existing
  transaction Bench Router Cable unchanged.
init:
  initializer_id: initializers.ios.openshop_flow_cross_app:OpenShopFlowCrossAppInitializer
  params:
    bundle_id: com.killt.openshop
    flow_params:
      bundle_id: mn.flow.flow
      seed_spec:
        accounts:
          - name: "Bench Checking"
            currency: "USD"
            icon: "card"
          - name: "Bench Cash"
            currency: "USD"
            icon: "cash"
          - name: "Bench Savings"
            currency: "USD"
            icon: "savings"
            exclude_from_total_balance: true
        categories:
          - name: "Bench Equipment"
            icon: "shopping"
          - name: "Bench Groceries"
            icon: "groceries"
          - name: "Bench Coffee"
            icon: "coffee"
        opening_balances:
          - account: "Bench Checking"
            amount: 1200.00
            title: "Bench Checking Opening Balance"
            day_offset: -2
          - account: "Bench Cash"
            amount: 150.00
            title: "Bench Cash Opening Balance"
            day_offset: -2
          - account: "Bench Savings"
            amount: 500.00
            title: "Bench Savings Opening Balance"
            day_offset: -2
        transactions:
          - kind: "expense"
            account: "Bench Checking"
            category: "Bench Equipment"
            amount: 35.00
            title: "Bench Router Cable"
            description: "Keep this purchase unchanged"
            day_offset: -1
      wait_ms: 1200
    openshop_params:
      bundle_id: com.killt.openshop
      login_session: false
      cart_items: []
      wait_ms: 1200
evaluation:
  evaluator_id: evaluators.ios.openshop_flow_cross_app:OpenShopFlowCrossAppEvaluator
  params:
    openshop_params:
      bundle_id: com.killt.openshop
      session_logged_in: false
      cart_size: 1
      order_count: 0
      present_cart_items:
        - product_id: p1005
          quantity: 1
      absent_cart_product_ids:
        - p1001
        - p1002
        - p1003
        - p1004
        - p1006
      timeout_seconds: 12
      poll_interval_seconds: 0.5
    flow_params:
      assert_spec:
        present_transactions:
          - type: "expense"
            title: "Bench Router Cable"
            description: "Keep this purchase unchanged"
            amount: -35.00
            account: "Bench Checking"
            category: "Bench Equipment"
          - type: "expense"
            title: "Bench Coffee Cart Reserve"
            description: "OpenShop cart: coffee hold for tasting."
            amount: -66.00
            account: "Bench Checking"
            category: "Bench Coffee"
        transaction_count: 5
        account_balances:
          Bench Checking: 1099.00
          Bench Cash: 150.00
          Bench Savings: 500.00
      timeout_seconds: 12
      poll_interval_seconds: 0.5
limits:
  max_steps: 100
  step_timeout_seconds: 120
metadata:
  tags: [cross_app, openshop, flow, ios, shopping, finance, easy, benchmark]
  app: OpenShop
  app_bundle_id: com.killt.openshop
  description: "Add one coffee item to the OpenShop cart, then record the matching reserve expense in Flow."
