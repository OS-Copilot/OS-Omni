instruction: |-
  In the Maily app, produce ten sent messages in the Inbox that correspond to specific replies, forwards, and new compositions. The first sent message is a reply to the email with the subject “AlphaReply0708” containing the body text “Gate one is open.”. The second is a new email addressed to “benchrecv@example.test” with the subject “Alpha gate opened” and the body “Review has begun”. The third is a forward of the email with the subject “AlphaFwd0708” to “planbox@mail.test” with the file “Sprint Review Draft.md” from the “FSNotes” folder attached. The fourth is a reply to the email with the subject “AlphaRead0708” containing the body text “Crew is ready now”.

  The fifth sent message is a forward of the email with the subject “AlphaBulkA” to “planbox@mail.test” with the body text “Batch A is kept” and the subject line modified by appending “ . batch-1” to the end of the original subject. The sixth is a new email addressed to “benchrecv@example.test” with the subject “Alpha gate midway” and the body “Two checks passed”. The seventh is a reply to the email with the subject “AlphaShare0708” containing the body text “Share is approved.” and attaching the photo thumbnail of a uniformed person holding a gun located in the top middle of the photo grid. The eighth is a forward of the email with the subject “AlphaBulkB” to “planbox@mail.test” with the body text “Batch B is kept.” and the subject line modified by appending “ . batch-b” to the end of the original subject. The ninth is a reply to the email with the subject “AlphaTrash0708” containing the body text “Purge is deferred.”. The tenth is a new email addressed to “planbox@mail.test” with the subject “Alpha record index” and the body “Proofs are filed”. All ten resulting sent messages must be recorded in the exact order specified above.
