instruction: Compose and send a sequence of nine emails in the Mail application, ensuring each is submitted
  before the next is started. The first email must be a forward of the message with the subject “RouteFwd0708”
  to “field3@mail.test” with the file “Shipping Notes.md” from the “FSNotes” folder attached and no body
  text. The second email must be a forward of the message with the subject “RouteBulkA” to “field3@mail.test”
  with “ · follow up” appended to the end of the subject line and “Batch A moved on.” entered in the body.
  The third email must be a reply to the message with the subject “RouteReply0708” with the photo of the
  close-up of a painted clown with a white face, red nose, and green hair attached and “Crew took the
  leg.” entered in the body. The fourth email must be a new message addressed to “rein@mail.test” with
  the subject “Route relay midway” and the body “Three legs cllosed.”. The fifth email must be a forward
  of the message with the subject “RouteBulkB” to “field3@mail.test” with “ · check tomorrow” appended
  to the end of the subject line and “Batch B moved on.” entered in the body. The sixth email must be
  a new message addressed to “rain@mail.test” with the subject “Route depot note” and the body “Depot
  is stocked.”. The seventh email must be a forward of the message with the subject “RouteShare0708” to
  “field3@mail.test” with “ · share-pack” appended to the end of the subject line and “Share pack passed.”
  entered in the body. The eighth email must be a reply to the message with the subject “RouteRead0708”
  with “ · read-log” appended to the end of the subject line and “Log was reviewed.” entered in the body.
  The ninth email must be a forward of the message with the subject “RouteTrash0708” to “field3@mail.test”
  with the photo of the close-up of a blue electric guitar attached and no body text.
