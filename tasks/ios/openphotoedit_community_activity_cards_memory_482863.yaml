instruction: |-
  Create and save four distinct edited photos in the OpenPhotoEdit app, each corresponding to a specific source image and saved with a designated filename.

  The first saved image, named "community activity main cover," must be derived from the photo showing two women each holding an orange bucket. This image requires a Brightness adjustment of 6, a Contrast adjustment of -5, and a crop dimension of Width 66 and Height 88.

  The second saved image, named "community activity collaboration scene card," must be derived from the photo showing multiple people gathered around a large blue bowl. This image requires a Brightness adjustment of 10, a Green channel value of -18 in the HSL category, the application of the “Clean” filter, and a crop dimension of Width 88 and Height 88.

  The third saved image, named "community activity exchange scene card," must be derived from the photo showing multiple people gathered around a white bowl. This image requires a Green channel value of -20 and a Cyan channel value of -8 in the HSL category, the application of the “Cream” filter, and a crop dimension of Width 68 and Height 88.

  The fourth saved image, named "community activity volunteer portrait card," must be derived from the photo showing a woman wearing a headscarf taking a selfie with companions. This image requires a Smooth adjustment of 10 in the Portrait category, a Saturation adjustment of 6 in the Edit category, the application of the “Portrait” filter, and a crop dimension of Width 84 and Height 88.

  Upon completion, all four images must be saved in the app with their respective filenames and adjustments applied.
