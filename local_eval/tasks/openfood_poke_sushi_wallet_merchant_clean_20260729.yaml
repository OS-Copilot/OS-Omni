task_id: android.openfood.poke_sushi_wallet_merchant_clean_20260729
platform: android
instruction: 'Complete this OpenFood workflow using only the visible Android GUI.
  Start from Android Studio snapshot `snap_2026-07-29_17-27-46`, where OpenFood is
  already installed, already authenticated as Lucas Lin, and already has the seeded
  restaurants, menu items, WELCOME12, and LUNCH5 data. Do not Sign Out / 不要退出登录. The
  final state should leave the OpenFood app signed in and on the Merchant page.


  1. 点击 Android 虚拟机桌面上的 OpenFood 图标打开软件。

  2. 点击顶部的 Restaurants 按钮。

  3. 向上滑动 Restaurants 页面并点击 Search 文本框。

  4. 使用键盘输入 `poke`。

  5. 点击 Cuisine 下拉框。

  6. 点击下拉列表里的 Mexican 选项。

  7. 点击 Sort 下拉框。

  8. 点击下拉列表里的 Rating 选项。

  9. 向上滑动结果列表并点击 Central La Jolla Poke No. 21 San Diego CA 卡片里的 View menu 按钮。

  10. 向上滑动餐厅详情页找到 Roasted San Diego California Burrito Wrap，并点击其下方的 Add to cart 按钮。

  11. 向上滑动 Menu 区域找到 Roasted San Diego California Burrito Noodles，并点击其下方的 Add to cart
  按钮。

  12. 向上滑动 Menu 区域找到 Roasted San Diego California Burrito Rice，并点击其下方的 Add to cart
  按钮。

  13. 向上滑动 Menu 区域找到 Roasted San Diego California Burrito Soup，并点击其下方的 Add to cart
  按钮。

  14. 向上滑动到 Cart 区域并点击购物车第一行数量右侧的加号按钮，使数量变为 2。

  15. 点击购物车第二行数量右侧的加号按钮，使数量变为 2。

  16. 点击购物车第三行数量右侧的加号按钮，使数量变为 2。

  17. 点击购物车中的 Coupon 下拉框。

  18. 点击 WELCOME12 - $12 off orders over $30 选项。

  19. 向上滑动 Cart 区域并点击购物车中的 Place order 按钮，创建第一张 Poke 搜索结果订单。

  20. 向上滑动最新订单卡片并点击该卡片里的 Advance status 按钮，将第一张订单推进到 Out for delivery。

  21. 向上滑动最新订单卡片并点击该卡片里的 Advance status 按钮，将第一张订单推进到 Delivered。

  22. 向下滑动到 Orders 页面顶部并点击 Support 按钮。

  23. 点击 New support ticket 表单里的 Subject 文本框。

  24. 使用键盘输入 `Poke menu review`。

  25. 点击 Message 文本框。

  26. 使用键盘输入 `Review poke listing`。

  27. 向上滑动表单并点击 Create ticket 按钮。

  28. 向下滑动到 Support 页面顶部并点击 Wallet 按钮。

  29. 向上滑动 Wallet 页面并点击 Enter voucher code 文本框。

  30. 使用键盘输入 `LUNCH5`。

  31. 向上滑动 Wallet 页面并点击 Claim 按钮。

  32. 向下滑动到 Wallet 页面顶部并点击 Orders 按钮。

  33. 向上滑动最新的 Central La Jolla Poke No. 21 San Diego CA 订单卡片并点击 Reorder 按钮。

  34. 向上滑动到 Cart 区域并点击购物车第一行数量右侧的加号按钮，使数量从 2 变为 3。

  35. 点击购物车第二行数量右侧的加号按钮，使数量从 2 变为 3。

  36. 点击购物车第三行数量右侧的加号按钮，使数量从 2 变为 3。

  37. 点击购物车第四行数量右侧的加号按钮，使数量从 1 变为 2。

  38. 点击购物车中的 Coupon 下拉框。

  39. 点击 LUNCH5 - $5 off orders over $15 选项。

  40. 向上滑动 Cart 区域并点击购物车中的 Place order 按钮，创建第二张 Poke 搜索结果订单。

  41. 向上滑动最新订单卡片并点击该卡片里的 Advance status 按钮，将第二张订单推进到 Out for delivery。

  42. 向上滑动最新订单卡片并点击该卡片里的 Advance status 按钮，将第二张订单推进到 Delivered。

  43. 向上滑动最新的 Central La Jolla Poke No. 21 San Diego CA 订单卡片并点击 Reorder 按钮。

  44. 向上滑动到 Cart 区域并点击购物车第一行数量右侧的加号按钮，使数量从 3 变为 4。

  45. 点击购物车第二行数量右侧的加号按钮，使数量从 3 变为 4。

  46. 点击购物车第三行数量右侧的加号按钮，使数量从 3 变为 4。

  47. 点击购物车第四行数量右侧的加号按钮，使数量从 2 变为 3。

  48. 点击购物车中的 Coupon 下拉框。

  49. 点击 WELCOME12 - $12 off orders over $30 选项。

  50. 向上滑动 Cart 区域并点击购物车中的 Place order 按钮，创建第三张 Poke 搜索结果订单。

  51. 向上滑动最新订单卡片并点击该卡片里的 Advance status 按钮，将第三张订单推进到 Out for delivery。

  52. 向上滑动最新订单卡片并点击该卡片里的 Advance status 按钮，将第三张订单推进到 Delivered。

  53. 向下滑动到 Orders 页面顶部并点击 Restaurants 按钮。

  54. 向上滑动 Restaurants 页面并点击 Search 文本框。

  55. 点击键盘退格键 4 次，删除 `poke`。

  56. 使用键盘输入 `sushi`。

  57. 点击 Cuisine 下拉框。

  58. 点击下拉列表里的 Sushi 选项。

  59. 点击 Sort 下拉框。

  60. 点击下拉列表里的 Fastest 选项。

  61. 向上滑动结果列表并点击 Nigiri Room San Francisco Bay Area CA 30 卡片里的 View menu 按钮。

  62. 向上滑动餐厅详情页并点击 Salmon Avocado Roll 下方的 Add to cart 按钮。

  63. 向上滑动 Menu 区域并点击 Spicy Tuna Roll 下方的 Add to cart 按钮。

  64. 向上滑动 Menu 区域并点击 Nigiri Combo 下方的 Add to cart 按钮。

  65. 向上滑动到 Cart 区域并点击购物车中的 Coupon 下拉框。

  66. 点击 LUNCH5 - $5 off orders over $15 选项。

  67. 向上滑动 Cart 区域并点击购物车中的 Place order 按钮，创建 Nigiri Room 订单。

  68. 向上滑动最新订单卡片并点击该卡片里的 Advance status 按钮，将 Nigiri Room 订单推进到 Out for delivery。

  69. 向上滑动最新订单卡片并点击该卡片里的 Advance status 按钮，将 Nigiri Room 订单推进到 Delivered。

  70. 向下滑动到 Orders 页面顶部并点击 Merchant 按钮。

  71. 向上滑动 Merchant operations 页面并点击 Golden Curry Garden No. 35 San Jose CA 卡片里的 Mark
  closed 按钮。最终停留在 Merchant 页面，保持 Lucas Lin 登录状态，不要 Sign Out / 不要退出登录。'
