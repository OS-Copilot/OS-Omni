    verifier_rules:
    - Initializer must record openfood_baseline.json and fail if openfood-static-state-v1
      exists before the GUI agent starts.
    - Primary final evidence is read-only SQLite/Prisma dev.db when present, otherwise
      read-only WebView localStorage key openfood-static-state-v1 from the OpenFood
      Android static snapshot.
    - Order checks require exact restaurant, exact coupon, exact Delivered status
      through orderStatus/final state, exact item names, exact item quantities, and
      no extra item names.
    - Support ticket checks require exact subject Poke menu review and exact message
      Review poke listing.
    - Steps 1-21 are verified by the first delivered Central La Jolla Poke order with
      four exact burrito items, quantities 2/2/2/1, and WELCOME12.
    - Steps 22-27 are verified by the exact support ticket subject/message.
    - Steps 28-42 are verified by LUNCH5 claim/use evidence and the second delivered
      Central La Jolla Poke order with quantities 3/3/3/2 and LUNCH5.
    - Steps 43-52 are verified by the third delivered Central La Jolla Poke order
      with quantities 4/4/4/3 and WELCOME12.
    - Steps 53-69 are verified by a delivered Nigiri Room order with Salmon Avocado
      Roll, Spicy Tuna Roll, Nigiri Combo, and LUNCH5.
    - Steps 70-71 are verified by Golden Curry Garden No. 35 San Jose CA restaurantOpen=false.
    - 'Reorder is hard-checked through reorderEvents/auditEvents or per-order sourceOrderId/reorderedFromOrderId
      evidence: the second Poke order must derive from the first matching Poke order,
      and the third Poke order must derive from the second matching Poke order.'
    - Intermediate Advance status is hard-checked through orderStatusHistory/auditEvents
      evidence requiring Preparing -> Out for delivery -> Delivered for each target
      order.
    - Search, sort, dropdown, and scroll remain flow actions because OpenFood does
      not expose durable per-click evidence for them.
    - The evaluator is read-only and does not click, type, scroll, submit, restore
      snapshots, run the initializer, or mutate Android/app/server state.
    source_evaluator: evaluators.android.openfood_poke_sushi_wallet_merchant_clean_20260729:OpenFoodSmokehousePizzaMerchantOpsEvaluator
