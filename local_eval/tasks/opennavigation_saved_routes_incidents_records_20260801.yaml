    name snap_2026-08-01_16-48-36 available.
  - OpenNavigation package com.killt.opennavigation is installed and already signed
    in.
  - The snapshot Records baseline has no saved routes and no incident reports for
    CampusShuttle, OfficeLoop, LaneBlocked, or PlatformClosed.
  initializer_message: OpenNavigationRecordsBaselineInitializer does not restore snapshots,
    clear app data, sign in, sign out, or create target route/report records. It launches
    OpenNavigation, opens Records for precondition inspection, and fails if target
    evidence is already present.
  verifier_rules:
    primary_business_evidence:
    - Final foreground app must be com.killt.opennavigation.
    - Final Records UI must show Saved routes and Incident reports.
    - One saved route record must include CampusShuttle, Transit, and Stanford University.
    - One saved route record must include OfficeLoop, Drive, and Meta Headquarters.
    - One incident report record must include Hazard, LaneBlocked, and OfficeLoop.
    - One incident report record must include Transit delay, PlatformClosed, and CampusShuttle.
    - Final Records UI must not show No saved routes or No incident reports.
    instruction_mapping:
    - Steps 1-27 create and save the CampusShuttle Transit route.
    - Steps 28-50 derive and save the OfficeLoop Drive route.
    - Steps 51-62 start OfficeLoop navigation and save the Hazard/LaneBlocked incident
      report.
    - Steps 63-75 start CampusShuttle navigation and save the Transit delay/PlatformClosed
      incident report, then return to Records.
    data_source_priority:
    - Android foreground package and final uiautomator UI dump are authoritative.
    - The initializer baseline UI dump is authoritative for clean-baseline precondition
      checks during full runs.
    forbidden_assumptions:
    - Do not pass from route/report names alone without the associated mode/type and
      endpoint/route evidence.
    - Do not treat intermediate Directions, route cards, keyboards, dropdowns, or
      navigation overlays as final evidence.
  evaluation_standard: The task passes only when the final Records page visibly contains
    both named saved routes and both associated incident reports with the required
    unique notes.
  durable_checks:
  - CampusShuttle route record includes Transit and Stanford University.
  - OfficeLoop route record includes Drive and Meta Headquarters.
  - Hazard report record includes LaneBlocked and OfficeLoop.
  - Transit delay report record includes PlatformClosed and CampusShuttle.
  manual_verifier_note: scripts/evaluate_android_task_only.py skips snapshot reset,
    initializer, and AI GUI actions. It evaluates the current VM final Records UI
    only.
