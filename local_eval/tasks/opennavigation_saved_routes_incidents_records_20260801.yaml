task_id: android.opennavigation.saved_routes_incidents_records_20260801
platform: android
instruction: '请只通过可见的 Android GUI 完成这个 OpenNavigation 工作流。从 Android Studio 快照 `snap_2026-08-01_16-48-36`
  开始，OpenNavigation 已安装并已登录；不要 Sign Out / 不要退出登录。最终停留在左侧栏的 Records 页面，使页面同时显示 CampusShuttle、OfficeLoop、Hazard、LaneBlocked、Transit
  delay 和 PlatformClosed。


  1. 点击 OpenNavigation 应用图标，打开应用到地图首页。

  2. 点击左侧栏的 Saved。

  3. 点击收藏地点列表中的 Stanford University。

  4. 点击顶部搜索框右侧的菱形 Directions 按钮。

  5. 点击起点和目的地之间的 + 添加途经点按钮。

  6. 点击新增的第一个途经点文本栏。

  7. 使用键盘输入 Googleplex。

  8. 点击软键盘左下角的向下箭头收起软键盘。

  9. 点击结果列表中的 Googleplex。

  10. 再次点击 + 添加途经点按钮。

  11. 点击新增的第二个途经点文本栏。

  12. 使用键盘输入 Mountain View。

  13. 点击软键盘左下角的向下箭头收起软键盘。

  14. 点击结果列表中的 Mountain View Transit Center。

  15. 点击交通方式栏中的 Transit。

  16. 点击 Other time。

  17. 点击 Options。

  18. 在 Route preferences 弹窗中勾选 Avoid tolls。

  19. 在 Route preferences 弹窗中勾选 Fewer transfers。

  20. 在 Route preferences 弹窗中勾选 Accessible route。

  21. 点击 Apply preferences。

  22. 点击路线摘要下方标签栏最右侧的 Routes；它位于 Saved 的右边。

  23. 点击该标签下方显示的第一张 Transit 路线卡片。

  24. 点击路线名称文本栏。

  25. 使用键盘输入 CampusShuttle。

  26. 点击软键盘左下角的向下箭头收起软键盘。

  27. 点击 Save route。

  28. 点击左侧栏的 Records。

  29. 在 Saved routes 区域中选择 CampusShuttle 路线卡片。

  30. 点击 Googleplex 途经点右侧的 X 删除按钮。

  31. 点击 Mountain View Transit Center 途经点右侧的 X 删除按钮。

  32. 点击显示 Stanford University 的目的地文本栏。

  33. 长按目的地文本栏中的 Stanford University，然后松开。

  34. 点击浮动文本菜单中的 Select all。

  35. 使用键盘输入 Meta Headquarters。

  36. 点击软键盘左下角的向下箭头收起软键盘。

  37. 点击结果列表中的 Meta Headquarters。

  38. 点击交通方式栏中的 Drive。

  39. 点击 Leave now。

  40. 点击 Options。

  41. 在 Route preferences 弹窗中勾选 Avoid highways。

  42. 点击 Apply preferences。

  43. 点击路线摘要下方标签栏最右侧的 Routes；它位于 Saved 的右边。

  44. 点击该标签下方显示的第二张 Drive 路线卡片。

  45. 点击显示 CampusShuttle 的路线名称文本栏。

  46. 长按路线名称文本栏中的 CampusShuttle，然后松开。

  47. 点击浮动文本菜单中的 Select all。

  48. 使用键盘输入 OfficeLoop。

  49. 点击软键盘左下角的向下箭头收起软键盘。

  50. 点击 Save route。

  51. 点击左侧栏的 Records。

  52. 在 Saved routes 区域中选择 OfficeLoop 路线卡片。

  53. 点击路线摘要下方标签栏最右侧的 Routes；它位于 Saved 的右边。

  54. 点击该标签下方显示的第一张 Drive 路线卡片。

  55. 点击页面标题行右侧的蓝色 Start 按钮。

  56. 点击导航覆盖层中的 Report。

  57. 点击 Report an incident 弹窗中的 Incident type 下拉框。

  58. 点击下拉列表中的 Hazard。

  59. 点击 Report note 文本栏。

  60. 使用键盘输入 LaneBlocked。

  61. 点击软键盘左下角的向下箭头收起软键盘。

  62. 点击 Save report。

  63. 点击左侧栏的 Records。

  64. 在 Saved routes 区域中选择 CampusShuttle 路线卡片。

  65. 点击路线摘要下方标签栏最右侧的 Routes；它位于 Saved 的右边。

  66. 点击该标签下方显示的第一张 Transit 路线卡片。

  67. 点击页面标题行右侧的蓝色 Start 按钮。

  68. 点击导航覆盖层中的 Report。

  69. 点击 Report an incident 弹窗中的 Incident type 下拉框。

  70. 点击下拉列表中的 Transit delay。

  71. 点击 Report note 文本栏。

  72. 使用键盘输入 PlatformClosed。

  73. 点击软键盘左下角的向下箭头收起软键盘。

  74. 点击 Save report。

  75. 点击左侧栏的 Records，使最终页面同时显示 CampusShuttle、OfficeLoop、Hazard、LaneBlocked、Transit
  delay 和 PlatformClosed。'
