task_id: android.openbank.ace_dispute_paperless_security_lena_marco_1787394510087_195225
platform: android
instruction: '1. 点击底部导航栏的“Activity”。

  2. 点击“Search merchant or description”字段。

  3. 在该字段输入“Ace Hardware”。

  4. 点击“Category”筛选控件。

  5. 点击“Home”。

  6. 点击“Status”筛选控件。

  7. 点击“Posted”。

  8. 点击“Search”。

  9. 点击搜索结果中“Ace Hardware”条目右侧的“Details”。

  10. 点击争议表单的“Reason”选择控件。

  11. 点击“Amount is incorrect”。

  12. 点击争议表单的“Details”文本框。

  13. 在该字段输入“Wrong home supply total”。

  14. 点击“Submit dispute”，提交 Ace Hardware 的金额争议。

  15. 点击底部导航栏的“Statements”。

  16. 点击“Rainy Day Savings •••9140”。

  17. 在 Rainy Day Savings 对账单页面向下滑动，直到“Paper delivery”区域可见，以便后续保存无纸化设置。

  18. 点击处于“Paper”状态的“Go paperless”，保存 Rainy Day Savings 的无纸化设置。

  19. 点击底部导航栏的“Security”。

  20. 在 Security 页面向下滑动，直到“Large purchase”表单可见，以便后续保存大额消费提醒渠道。

  21. 点击“Large purchase”表单内处于开启状态的“Push”开关。

  22. 点击该提醒表单底部的“Save”。

  23. 在 Security 页面向下滑动，直到“Low balance”表单可见，以便后续保存低余额短信提醒。

  24. 点击“Low balance”表单内处于关闭状态的“Text”开关。

  25. 点击该提醒表单底部的“Save”。

  26. 在 Security 页面向上滑动，直到“Upcoming bill”提醒行可见，以便后续将该提醒设置为已读。

  27. 点击“Upcoming bill”行的“Mark Read”。

  28. 在 Security 页面向下滑动，直到“Payment due”表单可见，以便后续保存到期付款短信提醒。

  29. 点击“Payment due”表单内处于关闭状态的“Text”开关。

  30. 点击该提醒表单底部的“Save”。

  31. 在 Security 页面向上滑动，直到“Card controls”区域可见，以便后续设置 OpenBank Rewards Card 为锁定状态。

  32. 点击处于“Unlocked”状态的“OpenBank Rewards Card”行内“Lock”，将该卡设置为锁定状态。

  33. 点击底部导航栏的“Transfer”。

  34. 在 Transfers 页面向上滑动，直到“Add recipient”表单可见，以便后续创建 Lena Wu 收款人。

  35. 点击“Name”字段。

  36. 在该字段输入“Lena Wu”。

  37. 点击“Account number”字段。

  38. 在该字段输入“6492083175”。

  39. 点击“Routing number”字段。

  40. 在该字段输入“031000053”。

  41. 点击“Bank”字段。

  42. 在该字段输入“OpenBank”。

  43. 点击“Nickname”字段。

  44. 在该字段输入“Design split”。

  45. 点击“Save recipient”。

  46. 点击“Name”字段。

  47. 在该字段输入“Marco Li”。

  48. 点击“Account number”字段。

  49. 在该字段输入“3078519264”。

  50. 点击“Routing number”字段。

  51. 在该字段输入“124003116”。

  52. 点击“Bank”字段。

  53. 在该字段输入“OpenBank”。

  54. 点击“Nickname”字段。

  55. 在该字段输入“Studio rent”。

  56. 点击“Save recipient”。

  57. 在 Transfers 页面向下滑动，直到“New Transfer”表单可见，以便后续提交 Lena Wu 的 Design split 转账。

  58. 点击“To”选择控件。

  59. 点击“Lena Wu”。

  60. 在“From”下拉中选择“Everyday Checking ••••2381”。

  61. 点击“Memo”字段。

  62. 在该字段输入“Design split”。

  63. 点击“Amount”字段。

  64. 在该字段输入“4.20”。

  65. 点击“Date”控件。

  66. 在日期控件中选择“2026-06-01”。

  67. 点击“Submit transfer”。

  68. 点击“To”选择控件。

  69. 点击“Marco Li”。

  70. 点击“Memo”字段。

  71. 在该字段输入“Studio rent”。

  72. 点击“Amount”字段。

  73. 在该字段输入“1.25”。

  74. 点击“Submit transfer”。

  '
