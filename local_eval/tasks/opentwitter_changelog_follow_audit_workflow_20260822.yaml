  initializer_behavior: Only opens the existing app, reads the v7 localStorage baseline,
    rejects pollution/mismatches, and writes a host-side baseline artifact. It never
    restores a snapshot, clears app data, or performs target actions.
  evaluation_scope:
  - Exact logged-in account and Follow final states for @rachel and @eliseibrahim24,
    each with a matching active=true follow event.
  - Fixed target post IDs/authors, required Like/Repost/Save final states, and matching
    active=true interaction events.
  - Exactly one attributable reply with exact author/text on each fixed target post.
  - Exactly one attributable outbound message for each exact recipient/text pair,
    including two distinct Nora Fields messages.
  - Exactly one new Alex post for each exact post text, one exact reply on the dynamic
    Changelog pass done post, plus its Like and Save states.
  - All notifications read and a notifications_marked_read event; full runs require
    events newer than the initializer baseline sequence.
  unverifiable_process_steps:
  - Explore tab selections, trend-opening paths, individual scroll gestures, Home/Back
    transitions, field focus, and the final visible Nora chat page are not persisted
    and remain human-verification conditions.
  - Followers-list discovery order is not independently asserted; the evaluator checks
    exact durable follow outcomes for the disambiguated handles.
  false_positive_controls:
  - Initializer rejects pre-existing exact nonce texts, target follow states, and
    target interaction states before the agent runs.
  - Evaluator uses exact equality, fixed post/recipient/handle IDs, exact object counts,
    outbound flags, dynamic object IDs, and matching event payloads; no substring
    matching is used.
  - During full-auto evaluation, only events with seq greater than the host-side baseline
    marker are attributable.
  manual_verifier_note: scripts/evaluate_android_task_only.py performs no snapshot
    reset, initializer, AI/GUI agent action, or VM business-state write. Both supplied
