task_id: android.opentwitter.changelog_follow_audit_workflow_20260822
platform: android
instruction: 'OpenTwitter 已登录 Alex Chen 账号。请只通过 Android GUI 完成以下连贯的发布变更跟进流程，不要 Sign
  Out / 不要退出登录。 打开 OpenTwitter，点击底部 Notifications，再点击 Mark all as read。点击底部 Profile，点击
  followers 数字进入 Followers 列表； 向上滑动找到 Rachel Stone（@rachel）并点击其行右侧的 Follow，再继续向上滑动找到列表中第一个
  Elise Ibrahim （@eliseibrahim24，Release coordinator）并点击其行右侧的 Follow。 点击底部 Explore，选择顶部
  Trending，向上滑动趋势列表直到 Release notes 可见并打开；在结果页向上滑动找到 Alex Chen 的 Release Notes 帖子“Release
  archive cleanup: each launch now has a final decision, owner, known issues, and
  follow-up date.”， 点击该帖下方的 Like 和 Repost，再点击 Reply，在 Post your reply 文本框中精确输入“Changelog
  is useful”，点击评论区的 Reply 发布。 点击底部 Home，再点击底部 Explore，选择顶部 For you，向上滑动趋势列表直到 Frontend
  performance 可见并打开；在结果页向上滑动 找到 Jamal Reed 的 Frontend 帖子“A tiny frontend win: delaying
  non-critical chart hydration made the first paint feel instant on older laptops.”，
  点击该帖下方的 Like 和 Save，再点击 Reply，在 Post your reply 文本框中精确输入“First paint improved”，点击评论区的
  Reply 发布。 点击底部 Messages，依次打开 Lina Torres、Maya Patel 和 Nora Fields 的会话，在对应的 Message
  文本框中分别精确发送 “Changelog reviewed.”、“Focus order checked.”和“Launch recap ready.”；每次点击蓝色
  Send，前两次发送后点击聊天页左上角 Back 返回会话列表。 从 Nora Fields 聊天页点击底部 Home，在 What is happening?
  文本框中先发布精确帖子“Changelog pass done”，再发布精确帖子 “New follows added.”。向上滑动 Home 信息流找到刚发布的“Changelog
  pass done”，回复精确文本“Release owner Lina”，并点击该帖下方的 Like 和 Save。 点击底部 Messages，打开 Priya
  Shah 会话并精确发送“Follow audit logged.”，点击蓝色 Send；点击聊天页左上角 Back，打开 Nora Fields 会话并精确发送“Follow
  note shared.”，点击蓝色 Send。完成后停留在 Nora Fields 聊天页，不要退出登录。'
