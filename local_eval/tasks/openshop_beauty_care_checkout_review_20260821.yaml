task_id: android.openshop.beauty_care_checkout_review_20260821
platform: android
instruction: OpenShop 已经登录 Lucas Lin 账号，请不要退出登录。使用 Android GUI 完成一份 Beauty 旅行护理订单：从首页
  Categories 的 Beauty 分类进入商品列表，把 BloomCare Sensitive Skin Eau de Parfum 的 Travel Size
  规格加入购物车；之后返回首页并使用顶部搜索栏依次查找其余商品， 把 Aloe Room Hydrating Shaving Trimmer 的 Sensitive
  规格、Puretone Travel-Size Vitamin Serum 的 Value Set 规格、Daily Dew Soft Matte Moisturizer
  Jar 的 Travel Size 规格、MiraSkin Gentle Hair Treatment Mask 的 Original 规格，以及 Aloe Room
  Cooling Lip Balm Set 的 Value Set 规格各加入购物车 1 件。进入底部购物栏的 Checkout，核对购物车只有上述 6 件商品且规格正确，
  点击 Proceed to Checkout；在 Select Shipping Address 中选择 Home，在 Payment Method 中选择 Alipay，在
  Order Note 文本框输入精确文本“Travel care kit”，然后点击 Place Order。下单后在订单历史中 找到订单 TBH-LUCAS-20260518-001，在其中
  Verdant Pro Noise-Canceling Headphones 商品的 Rating 下拉框选择 4 / 5，在 Review 文本框输入精确文本“Good
  commute audio”，点击 Submit Review。 最终停留在能看到该历史订单耳机评分和评论的订单历史页面；不要 Sign Out / 不要退出登录。
