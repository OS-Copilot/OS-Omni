task_id: android.deltachat.bot_evidence_device_location_684193
platform: android
instruction: '1. 打开 Markor；

  2. 点击页面右下角红色方形 `+` 按钮；

  3. 点击 `Title` 输入框；

  4. 在 `Title` 输入框中输入 `Bot unread summary`；

  5. 点击 `OK`；

  6. 点击空白正文编辑区；

  7. 输入 `Avatar and Sticker records`；

  8. 按键盘 `Return` 键；

  9. 打开 Delta Chat；

  10. 点击 `Search`；

  11. 输入 `android_avatar_unread_04`；

  12. 点击 `Avatar Bot`；

  13. 长按包含 `Unread Avatar expansion 04` 的消息；

  14. 点击 `Copy Text`；

  15. 打开 Markor；

  16. 长按编辑区；

  17. 点击 `Paste`；

  18. 点击 `Save`；

  19. 打开 Delta Chat；

  20. 点击顶部 `Back` 回到搜索页；

  21. 点击 `Clear query`；

  22. 输入 `android_sticker_unread_04`；

  23. 点击 `Sticker Bot`；

  24. 长按包含 `Unread Sticker expansion 04` 的消息；

  25. 点击 `Copy Text`；

  26. 打开 Markor；

  27. 按键盘 `Return` 键；

  28. 长按编辑区；

  29. 点击 `Paste`；

  30. 点击 `Save`；

  31. 打开 Delta Chat；

  32. 点击顶部 `Back` 回到聊天列表；

  33. 点击 `New Chat`；

  34. 点击 `New Group`；

  35. 点击 `Group Name`；

  36. 输入 `Bot Evidence Group`；

  37. 点击 `Description`；

  38. 输入 `Avatar and Sticker evidence`；

  39. 点击 `Continue`；

  40. 点击 `Message` 输入框；

  41. 输入 `Bot evidence group ready`；

  42. 点击 `Send`；

  43. 打开 Markor；

  44. 点击 `More options`；

  45. 点击 `Share`；

  46. 点击 `File`；

  47. 点击系统分享面板中的 `Saved Messages  Delta Chat`；

  48. 点击 Delta Chat 中的 `Send`；

  49. 打开 Markor；

  50. 点击 `More options`；

  51. 点击 `Share`；

  52. 点击 `File`；

  53. 点击系统分享面板中的 `Delta Chat`；

  54. 点击 `Bot Evidence Group`；

  55. 点击 Delta Chat 中的 `Send`；

  56. 点击底部 `Message` 输入框；

  57. 输入 `Device evidence follows`；

  58. 点击 `Send`；

  59. 点击 `Add Attachment`；

  60. 点击 `Gallery`；

  61. 在缩略图中选择灰色维修台上的黑色手机照片；手机玻璃从底部向上多处开裂，左侧有金属精密螺丝刀，右侧有黑色 USB-C 线缆；

  62. 点击附件确认页中的 `Send`；

  63. 点击底部 `Message` 输入框；

  64. 输入 `Location evidence follows`；

  65. 点击 `Send`；

  66. 点击 `Add Attachment`；

  67. 点击 `Gallery`；

  68. 在缩略图中选择傍晚雨中城市街道的照片；湿润路面映出橙色店灯和白色车灯，右侧店铺前停着自行车，远处有车辆经过；

  69. 点击附件确认页中的 `Send`；

  70. 点击底部 `Message` 输入框；

  71. 输入 `Screen and location linked`；

  72. 点击 `Send`，完成设备损坏与发生地点的双证据关联。'
