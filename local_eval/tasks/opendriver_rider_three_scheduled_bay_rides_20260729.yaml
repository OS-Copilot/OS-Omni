task_id: android.opendriver.rider_three_scheduled_bay_rides_20260729
platform: android
instruction: '请只使用安卓虚拟机里可见的 Android GUI 完成 OpenDriver Rider 三次预约叫车工作流。从 Android Studio
  快照 `snap_2026-07-29_17-27-46` 对应的初始状态开始，OpenDriver 已安装，Rider 账号、San Francisco Bay
  城市、Bay Area 地点、RideX/RideXL 车型、SAFE10 优惠码和 OpenDriver credits 付款方式已经由快照提供。当前应用业务日期会使日期选择器中的
  30/31 分别落到 2026-08-30 和 2026-08-31；请按下面要求完成三条预约。不要 Sign Out / 不要退出登录。

  自动执行时，如果需要清空已有输入框内容，请优先点入输入框后使用 Ctrl+A/全选再输入新文本；不要使用 KEYCODE_MOVE_END，不要使用 for/seq
  循环，也不要连续发送大量 KEYCODE_DEL。


  1. 打开安卓虚拟机中的 OpenDriver 应用。

  2. 点按工作区选择栏中的 Rider。

  3. 点按 Name 输入框。

  4. 输入 Lin Rider。

  5. 点按 Email 输入框。

  6. 输入 rider@example.com。

  7. 点按 Password 输入框。

  8. 输入 Pass1234。

  9. 点按 Login。

  10. 点按顶部标签栏中的 Ride。

  11. 点按 Global market 城市下拉区域。

  12. 点按 San Francisco Bay, CA - USD。

  13. 点按 Pickup 输入框。

  14. 删除原有接车地点文本。

  15. 输入 Palo Alto。

  16. 点按匹配项 University Avenue, Palo Alto, CA。

  17. 点按 Destination 输入框。

  18. 输入 SF。

  19. 点按匹配项 San Francisco International Airport。

  20. 点按 Add stop。

  21. 点按新出现的 Stop 1 输入框。

  22. 输入 Park。

  23. 点按匹配项 Mission Dolores Park, San Francisco, CA。

  24. 向上滑动页面，露出 Choose a ride 区域。

  25. 点按 RideXL 车型卡片。

  26. 点按 Payment 下方的付款方式下拉框。

  27. 点按 OpenDriver credits。

  28. 点按 Now。

  29. 在日期选择器中点按 30。

  30. 点按 OK。

  31. 点按 02:45 - 03:00 时间段。

  32. 点按 Promo code 输入框。

  33. 输入 SAFE10。

  34. 点按优惠码右侧的圆形对勾按钮。

  35. 点按 Choose RideXL，完成第一条 2026-08-30 02:45 开始的预约。

  36. 点按顶部标签栏中的 Ride。

  37. 点按 Pickup 输入框。

  38. 删除原有接车地点文本。

  39. 输入 SF。

  40. 点按匹配项 San Francisco International Airport。

  41. 点按 Destination 输入框。

  42. 删除原有目的地文本。

  43. 输入 San Jose。

  44. 点按匹配项 San Jose Diridon Station。

  45. 向上滑动页面，露出 Choose a ride 区域。

  46. 点按 RideX 车型卡片。

  47. 点按当前显示为 02:45 - 03:00 的时间按钮。

  48. 在日期选择器中点按 31。

  49. 点按 OK。

  50. 点按 03:00 - 03:15 时间段。

  51. 点按 Choose RideX，完成第二条 2026-08-31 03:00 开始的预约。

  52. 点按顶部标签栏中的 Ride。

  53. 点按 Pickup 输入框。

  54. 删除原有接车地点文本。

  55. 输入 San Jose。

  56. 点按匹配项 San Jose Diridon Station。

  57. 点按 Destination 输入框。

  58. 删除原有目的地文本。

  59. 输入 Palo Alto。

  60. 点按匹配项 University Avenue, Palo Alto, CA。

  61. 点按已有的 Stop 1 输入框。

  62. 删除原有停靠点文本。

  63. 输入 SF。

  64. 点按匹配项 San Francisco International Airport。

  65. 向上滑动页面，露出 Choose a ride 区域。

  66. 点按 RideXL 车型卡片。

  67. 点按当前显示为 03:00 - 03:15 的时间按钮。

  68. 在日期选择器中点按 31。

  69. 点按 OK。

  70. 点按 03:15 - 03:30 时间段。

  71. 点按 Choose RideXL，完成第三条 2026-08-31 03:15 开始的预约；保持 OpenDriver 已登录，不要退出应用或退出登录。'
init:
  initializer_id: local_eval.driver_baseline:RecoveredDriverInitializer
  params:
    app_package: com.killt.opendriver
    app_activity: com.killt.opendriver.MainActivity
    snapshot_name: snap_2026-07-29_17-27-46
    wait_ms: 2000
    forbidden_backend_needles_all:
    - - University Avenue, Palo Alto, CA
      - San Francisco International Airport
      - Mission Dolores Park, San Francisco, CA
      - RideXL
      - SAFE10
      - 02:45
    - - San Francisco International Airport
      - San Jose Diridon Station
      - RideX
      - 03:00
    - - San Jose Diridon Station
      - University Avenue, Palo Alto, CA
      - San Francisco International Airport
      - RideXL
      - 03:15
    source_initializer: evaluators.cua_review.initializers.android.opendriver:OpenDriverRiderBaselineInitializer
evaluation:
  evaluator_id: local_eval.driver_signedout_evaluator:NativeDriverScheduledEvaluator
  params:
    app_package: com.killt.opendriver
    expected_user:
      workspace: Rider
      email: rider@example.com
    expected_scheduled_count: 3
    expected_scheduled_rides:
    - label: first_ride_ridexl_palo_alto_to_sfo_via_dolores
      date: '2026-08-30'
      window_start: 02:45
      pickup: University Avenue, Palo Alto, CA
      destination: San Francisco International Airport
      stop: Mission Dolores Park, San Francisco, CA
      ride_type: RideXL
      payment: OpenDriver credits
      promo_code: SAFE10
    - label: second_ride_ridex_sfo_to_san_jose
      date: '2026-08-31'
      window_start: 03:00
      pickup: San Francisco International Airport
      destination: San Jose Diridon Station
      ride_type: RideX
    - label: third_ride_ridexl_san_jose_to_palo_alto_via_sfo
      date: '2026-08-31'
      window_start: 03:15
      pickup: San Jose Diridon Station
      destination: University Avenue, Palo Alto, CA
      stop: San Francisco International Airport
      ride_type: RideXL
    expected_final:
      visible_text: []
    min_agent_steps: 65
    source_evaluator: evaluators.android.opendriver_rider_three_scheduled_bay_rides_20260729:OpenDriverRiderScheduledRidesEvaluator
limits:
  max_steps: 180
  step_timeout_seconds: 180
