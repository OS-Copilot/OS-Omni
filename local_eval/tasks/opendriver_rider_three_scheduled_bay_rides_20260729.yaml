  task_number: opendriver-rider-three-scheduled-bay-rides-20260729
  description: Log in to OpenDriver as a Rider and create three distinct Bay Area
    scheduled rides with RideXL/RideX, OpenDriver credits, and SAFE10 evidence.
  prerequisites:
  - Android Studio Quail 1 Android Emulator/AVD AndroidWorldAvd_20260611_1 has snapshot
    display name snap_2026-07-29_17-27-46 available.
  - OpenDriver package com.killt.opendriver is installed in snapshot snap_2026-07-29_17-27-46.
  - The snapshot contains Rider login support for rider@example.com, Bay Area location
    suggestions, RideX/RideXL, SAFE10, and OpenDriver credits.
  - The task begins before the three target scheduled ride objects have been created.
  initializer_message: OpenDriverRiderBaselineInitializer does not restore snapshots,
    clear app data, create rides, or repair task state. For this task it opens OpenDriver
    and fails if backend evidence already contains any target scheduled ride keyword
    group.
  verifier_rules:
    primary_business_evidence:
    - OpenDriver backend GET endpoints must show rider@example.com as a Rider user.
    - OpenDriver /rides/scheduled, /rides/history, or /rides/active must contain three
      distinct ride objects matching the requested route, ride tier, scheduled date/window,
      and required promo/payment evidence.
    - The first ride must include University Avenue pickup, SFO destination, Mission
      Dolores Park stop, RideXL, OpenDriver credits, SAFE10, and 2026-08-30 02:45
      start-time evidence.
    - The second ride must include SFO pickup, San Jose Diridon destination, RideX,
      and 2026-08-31 03:00 start-time evidence.
    - The third ride must include San Jose Diridon pickup, University Avenue destination,
      SFO stop, RideXL, and 2026-08-31 03:15 start-time evidence.
    instruction_mapping:
    - Steps 2-6 correspond to Rider login.
    - Steps 7-16 correspond to the first scheduled RideXL request.
    - Steps 17-22 correspond to the second scheduled RideX request.
    - Steps 23-29 correspond to the third scheduled RideXL request.
    data_source_priority:
    - OpenDriver backend GET endpoints are primary durable evidence.
    - Final Android accessibility text is read for context only; no final page token
      is required because the target is durable scheduled ride state.
    - Trajectory evidence is used only for full automatic-run process fidelity and
      minimum step count.
    forbidden_assumptions:
    - Do not infer date picker or time-slot clicks from seed dropdown text alone.
    - Do not pass on a single active ride or on old history records unless three distinct
      target-matching ride objects are present.
    non_final_intermediate_pages:
    - Login, city dropdown, suggestion lists, date picker, time-slot picker, payment
      dropdown, scroll position, and ride chooser are process pages, not standalone
      final evidence.
  evaluation_standard: The evaluator must find three distinct scheduled ride records
    matching the requested dates, start times, routes, stops, ride tiers, and first-ride
    promo/payment evidence.
  durable_checks:
  - Rider user rider@example.com is present.
  - Three distinct target scheduled ride records are present.
  - First ride route, stop, RideXL, date/start time, OpenDriver credits, and SAFE10
    match.
  - Second ride route, RideX, and date/start time match.
  - Third ride route, stop, RideXL, and date/start time match.
  - Automatic trajectory has at least 65 recorded agent steps.
  weak_or_process_only_steps:
  - Typing Name as Lin Rider is not hard-checked because the audited backend uses
    seeded rider@example.com account identity and may not persist the display name
    entered on the login form.
  - Dropdown opening, suggestion tapping, scrolling, date-picker tapping, and time-slot
    tapping are verified only through durable final scheduled ride fields.
  - Time-slot end labels such as 03:00, 03:15, and 03:30 are GUI button text only;
    the audited OpenDriver backend persists scheduledFor start time but not a separate
    scheduledUntil field.
  manual_verifier_note: scripts/evaluate_android_task_only.py skips reset, snapshot
    restore, initializer, and GUI agent actions. Manual evaluator-only runs verify
    the current OpenDriver VM state and skip trajectory-only checks when no trajectory.jsonl
    is available.
