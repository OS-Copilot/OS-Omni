  description: Use the available OpenDriver Driver workspace to update unique 5930
    vehicle/profile evidence, submit insurance evidence, accept a generated request,
    send required messages, and mark arrived.
  prerequisites:
  - Android Studio Quail 1 Android Emulator/AVD AndroidWorldAvd_20260611_1 has snapshot
    display name snap_2026-07-29_17-27-46 available.
  - OpenDriver package com.killt.opendriver is installed in snapshot snap_2026-07-29_17-27-46.
  - The snapshot contains an available seeded Driver workspace and a mock backend
    reachable at http://127.0.0.1:4320.
  - The task begins before CA-DL-59302, DRV 5930, INS-5930-CA, and the required 5930
    trip messages exist.
  initializer_message: OpenDriverDriverBaselineInitializer does not restore snapshots,
    clear app data, log in, edit profile fields, submit documents, generate rides,
    accept trips, send messages, or advance trip status. It opens OpenDriver and fails
    if target 5930/profile/document/message evidence is already present in read-only
    backend state.
  verifier_rules:
    primary_business_evidence:
    - OpenDriver read-only backend GET endpoints must show a Driver role/profile record.
    - The Driver profile must exactly match CA-DL-59302, Honda, Accord, 2025, DRV
      5930, and Silver.
    - The insurance document must match INS-5930-CA and 2029-03-31 with a submitted/pending/under_review/approved
      status.
    - The same final active driver ride must exist after Mark arrived, with an arrived/arrived_at_pickup/at_pickup
      status.
    - The final active ride must contain all nine required message texts, including
      unique custom messages Blue car near pin, Arriving in 2 min, Please be ready,
      Gate side pickup, Hazard lights on, and At pickup pin.
    instruction_mapping:
    - Steps 2-6 correspond to entering the available Driver workspace; the seeded
      backend may retain its original Driver identity.
    - Steps 7-14 correspond to durable Driver profile fields.
    - Steps 15-19 correspond to the insurance document submission.
    - Steps 20-24 correspond to generating and accepting a driver trip.
    - Steps 25-38 correspond to required quick and custom trip messages.
    - Steps 39-41 correspond to final arrived trip state.
    data_source_priority:
    - OpenDriver backend GET endpoints are primary durable evidence.
    - Final Android accessibility text is auxiliary context only; no exact scroll
      position is required.
    - Trajectory evidence is used only for full automatic-run process fidelity and
      minimum step count.
    forbidden_assumptions:
    - Do not pass on prefilled CA-DL-48291 / Toyota Camry / INS-48291 state.
    - Do not pass on any ride unless the active ride contains the required message
      set and arrived status.
    - Do not treat opening dropdowns, scrolling, or dialogs as standalone completion
      evidence.
    non_final_intermediate_pages:
    - Login, Account form editing, Driver documents dropdown, Work request generation,
      message dialog, close dialog, scrolling, and the Start driving intermediate
      state are process pages.
  evaluation_standard: The evaluator must find unique 5930 profile and insurance evidence
    plus one final active driver ride in arrived state containing all required messages.
  durable_checks:
  - A Driver role/profile record is present.
  - Driver profile fields exactly match the requested license, vehicle, plate, and
    color.
  - Insurance document identifier and expiry match.
  - Active driver ride exists and has an arrived-type status.
  - All required quick and custom messages are present on the active ride.
  - Automatic trajectory has at least 40 recorded agent steps.
  weak_or_process_only_steps:
  - The Name and Email entered on the login screen are not hard-checked because this
    OpenDriver snapshot keeps the seeded Driver identity in backend state.
  - Dropdown opening, field clearing, scrolling, modal closing, and exposing hidden
    controls are process actions; they are verified only through final durable backend
    fields.
  - Generate request now and Accept trip are verified through the final active driver
    ride rather than an intermediate request card.
  - Start driving to pickup is verified through the later arrived status, not as a
    separate transient state.
  manual_verifier_note: scripts/evaluate_android_task_only.py skips reset, snapshot
    restore, initializer, and GUI agent actions. Manual evaluator-only runs verify
    the current OpenDriver VM state and skip trajectory-only checks when no trajectory.jsonl
    is available.
