task_id: android.opendriver.seeded_driver_profile_document_arrival_5930_20260729
platform: android
instruction: '请只使用安卓虚拟机里可见的 Android GUI 完成 OpenDriver Driver 资料审核、文档提交和接单到达工作流。从 Android
  Studio 快照 `snap_2026-07-29_17-27-46` 对应的初始状态开始，OpenDriver 已安装，Driver 账号可用，工作区选择栏、Account、Work、Driver
  documents、快捷消息和模拟请求功能已经由快照提供。不要 Sign Out / 不要退出登录；最后停留在已接行程页面，完成 Mark arrived 后停止。


  自动执行时，如果需要清空已有输入框内容，请优先点入输入框后使用 Ctrl+A/全选再输入新文本；不要使用 KEYCODE_MOVE_END，不要使用 for/seq
  循环，也不要连续发送大量 KEYCODE_DEL。


  1. 打开安卓虚拟机中的 OpenDriver 应用。

  2. 点按工作区选择栏中的 Driver。

  3. 点按 Name 输入框，输入 Jordan Scan。

  4. 点按 Email 输入框，输入 jordan.driver26@example.com。

  5. 点按 Password 输入框，输入 Test12345!。

  6. 点按 Login。

  7. 点按顶部标签栏中的 Account。

  8. 点按 License number 输入框，删除原有驾照号码，输入 CA-DL-59302。

  9. 点按 Vehicle make 输入框，删除原有车辆品牌，输入 Honda。

  10. 点按 Vehicle model 输入框，删除原有车辆型号，输入 Accord。

  11. 点按 Vehicle year 输入框，删除原有车辆年份，输入 2025。

  12. 点按 License plate 输入框，删除原有车牌号码，输入 DRV 5930。

  13. 点按 Vehicle color 输入框，删除原有车辆颜色，输入 Silver。

  14. 点按 Save profile for review。

  15. 向上滑动页面，露出 Driver documents 区域。

  16. 点按 Document type 下拉框，点按 Insurance。

  17. 点按 Document ID 输入框，删除原有证件编号，输入 INS-5930-CA。

  18. 点按 Expires at 输入框，删除原有到期日期，输入 2029-03-31。

  19. 点按 Submit document。

  20. 向下滑动页面，露出顶部标签栏。

  21. 点按顶部标签栏中的 Work。

  22. 点按 Generate request now。

  23. 向上滑动页面，露出请求卡片底部。

  24. 点按 Accept trip。

  25. 点按 Message。

  26. 点按快捷消息 I am on my way.。

  27. 点按快捷消息 Please meet at the pickup pin.。

  28. 点按消息输入框，输入 Blue car near pin，点按 Send。

  29. 点按消息输入框，输入 Arriving in 2 min，点按 Send。

  30. 点按消息输入框，输入 Please be ready，点按 Send。

  31. 点按消息输入框，输入 Gate side pickup，点按 Send。

  32. 点按消息输入框，输入 Hazard lights on，点按 Send。

  33. 点按弹窗中的 Close。

  34. 向上滑动活动行程页面，露出主操作按钮。

  35. 点按 Start driving to pickup。

  36. 点按 Message。

  37. 点按快捷消息 I have arrived.。

  38. 点按消息输入框，输入 At pickup pin，点按 Send。

  39. 点按弹窗中的 Close。

  40. 向上滑动活动行程页面，露出主操作按钮。

  41. 点按 Mark arrived，保持在当前已接行程页面，不要退出应用或退出登录。'
init:
  initializer_id: local_eval.driver_baseline:RecoveredDriverInitializer
  params:
    app_package: com.killt.opendriver
    app_activity: com.killt.opendriver.MainActivity
    snapshot_name: snap_2026-07-29_17-27-46
    wait_ms: 2000
    forbidden_backend_needles_all:
    - - CA-DL-59302
    - - DRV 5930
    - - INS-5930-CA
    - - Blue car near pin
    - - Arriving in 2 min
    - - Please be ready
    - - Gate side pickup
    - - Hazard lights on
    - - At pickup pin
    source_initializer: evaluators.cua_review.initializers.android.opendriver:OpenDriverDriverBaselineInitializer
evaluation:
  evaluator_id: evaluators.android.opendriver_seeded_driver_profile_document_arrival_5930_20260729:OpenDriverDriverTripWorkflowEvaluator
  params:
    app_package: com.killt.opendriver
    expected_user:
      workspace: Driver
    expected_profile:
      license_number: CA-DL-59302
      vehicle_make: Honda
      vehicle_model: Accord
      vehicle_year: '2025'
      license_plate: DRV 5930
      vehicle_color: Silver
    expected_document:
      type: insurance
      identifier: INS-5930-CA
      expires_at: '2029-03-31'
      allowed_statuses:
      - submitted
      - pending
      - under_review
      - approved
    expected_active_trip:
      allowed_statuses:
      - arrived
      - arrived_at_pickup
      - at_pickup
    expected_messages:
    - I am on my way.
    - Please meet at the pickup pin.
    - Blue car near pin
    - Arriving in 2 min
    - Please be ready
    - Gate side pickup
    - Hazard lights on
    - I have arrived.
    - At pickup pin
    expected_final:
      visible_text: []
    min_agent_steps: 40
limits:
  max_steps: 180
  step_timeout_seconds: 180
