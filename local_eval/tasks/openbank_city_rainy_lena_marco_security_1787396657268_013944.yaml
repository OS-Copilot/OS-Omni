task_id: android.openbank.city_rainy_lena_marco_security_1787396657268_013944
platform: android
instruction: '1. 点击底部导航栏的“Pay & transfer”。

  2. 打开“Biller”下拉列表。

  3. 选择“City Utilities”。

  4. 打开“From”下拉列表。

  5. 选择“Everyday Checking ••••2381”。

  6. 点击“Amount”输入框。

  7. 在框内输入“52.45”。

  8. 点击“Date”控件。

  9. 选择“2026-06-02”。

  10. 点击“Memo”输入框。

  11. 在框内输入“52.45”。

  12. 点击“Schedule”。

  13. 点击底部导航栏的“Transfers”。

  14. 在 Transfers 页面向下滑动，直到“New Transfer”表单可见，以便后续提交 Rainy Day Savings 内部转账。

  15. 点击“From”选择控件。

  16. 点击“Everyday Checking ••••2381”。

  17. 点击“To”选择控件。

  18. 点击“Rainy Day Savings”。

  19. 点击“Amount”输入框。

  20. 输入“4.10”。

  21. 点击“Memo”输入框。

  22. 输入“Internet reserve”。

  23. 点击“Date”控件。

  24. 选择“2026-06-01”。

  25. 点击“Submit transfer”。

  26. 点击底部导航栏的“Transfer”。

  27. 在 Transfers 页面向上滑动，直到“Add recipient”表单可见，以便后续创建 Lena Wu 收款人。

  28. 点击“Name”字段。

  29. 在该字段输入“Lena Wu”。

  30. 点击“Account number”字段。

  31. 在该字段输入“5814602937”。

  32. 点击“Routing number”字段。

  33. 在该字段输入“322271627”。

  34. 点击“Bank”字段。

  35. 在该字段输入“OpenBank”。

  36. 点击“Nickname”字段。

  37. 在该字段输入“Design split”。

  38. 点击“Save recipient”。

  39. 点击“Name”字段。

  40. 在该字段输入“Marco Li”。

  41. 点击“Account number”字段。

  42. 在该字段输入“7943058162”。

  43. 点击“Routing number”字段。

  44. 在该字段输入“021200339”。

  45. 点击“Bank”字段。

  46. 在该字段输入“OpenBank”。

  47. 点击“Nickname”字段。

  48. 在该字段输入“Studio rent”。

  49. 点击“Save recipient”。

  50. 在 Transfers 页面向下滑动，直到“New Transfer”表单可见，以便后续提交 Lena Wu 的 Design split 转账。

  51. 点击“To”选择控件。

  52. 点击“Lena Wu”。

  53. 在“From”下拉中选择“Everyday Checking ••••2381”。

  54. 点击“Memo”字段。

  55. 在该字段输入“Design split”。

  56. 点击“Amount”字段。

  57. 在该字段输入“4.20”。

  58. 点击“Date”控件。

  59. 在日期控件中选择“2026-06-01”。

  60. 点击“Submit transfer”。

  61. 点击底部导航栏的“Security”。

  62. 在 Security 页面向下滚动，直到“Payment due”表单可见，以便后续保存到期付款短信提醒。

  63. 点击“Payment due”表单内处于关闭状态的“Text”开关。

  64. 点击该提醒表单底部的“Save”。

  65. 在 Security 页面向上滚动，直到“Upcoming bill”提醒行可见，以便后续将该提醒设置为已读。

  66. 点击“Upcoming bill”行的“Mark Read”。

  67. 在 Security 页面向下滚动，直到“Low balance”表单可见，以便后续保存低余额短信提醒。

  68. 点击“Low balance”表单内处于关闭状态的“Text”开关。

  69. 点击该提醒表单底部的“Save”。

  70. 点击处于“Unlocked”状态的“Everyday Checking debit card”行内“Lock”，将该卡设置为锁定状态。

  71. 点击底部导航栏的“Security”。

  72. 点击“New sign-in from macOS”行的“Mark Read”。'
