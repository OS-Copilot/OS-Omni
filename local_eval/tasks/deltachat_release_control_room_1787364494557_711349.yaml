task_id: android.deltachat.release_control_room_1787364494557_711349
platform: android
instruction: '1. 打开 Delta Chat；

  2. 点击 `New Chat`；

  3. 点击 `New Group`；

  4. 输入 `Release Control Room`；

  5. 点击 `Description`；

  6. 输入 `Launch evidence and owners`；

  7. 点击 `Continue`；

  8. 输入 `Release room is open`；

  9. 点击 `Send`；

  10. 点击顶部 `Back` 回到聊天列表；

  11. 点击 `Search`；

  12. 输入 `android_avatar_unread_04`；

  13. 点击 `Avatar Bot`；

  14. 长按包含 `Unread Avatar expansion 04` 的消息；

  15. 点击 `Copy Text`；

  16. 打开 Markor；

  17. 点击页面右下角红色方形 `+` 按钮；

  18. 在 `Title` 输入框中输入 `Release control pack`；

  19. 点击 `OK`；

  20. 点击空白正文编辑区；

  21. 输入 `# Release Control Pack`，并按键盘 `Return` 键；

  22. 输入 `Incident lead: Core team`，并按键盘 `Return` 键；

  23. 输入 `Owner: Release team`，并按键盘 `Return` 键；

  24. 输入 `Window: Evening launch`，并按键盘 `Return` 键；

  25. 输入 `## Source Signal`，并按键盘 `Return` 键；

  26. 输入 `Avatar alert copied`，并按键盘 `Return` 键；

  27. 长按编辑区末尾；

  28. 点击 `Paste`；

  29. 按键盘 `Return` 键；

  30. 输入 `## Launch Checklist`，并按键盘 `Return` 键；

  31. 输入 `- Verify release window`，并按键盘 `Return` 键；

  32. 输入 `- Confirm alert channel`，并按键盘 `Return` 键；

  33. 输入 `- Assign rollback owner`，并按键盘 `Return` 键；

  34. 输入 `Verify build and rollback`；

  35. 点击 `Save`；

  36. 点击 `More options`；

  37. 点击 `Share`；

  38. 点击 `File`；

  39. 点击系统分享面板中的 `Release Control Room  Delta Chat`；

  40. 点击 Delta Chat 中的 `Send`；

  41. 输入 `Workspace baseline follows`；

  42. 点击 `Send`；

  43. 点击 `Add Attachment`；

  44. 点击 `Gallery`；

  45. 在缩略图中选择日光办公室木质桌面的照片；左侧银色笔记本电脑显示蓝绿统计图，前方是摊开的纸质笔记本和钢笔，右侧有灰色咖啡杯，后方有一盆绿植；

  46. 点击附件确认页中的 `Send`；

  47. 输入 `Planning board follows`；

  48. 点击 `Send`；

  49. 点击 `Add Attachment`；

  50. 点击 `Gallery`；

  51. 在缩略图中选择空置会议室的照片；长桌上分散着笔记本、粉蓝便签和三只水瓶，右侧墙面白板贴满多色便签，左侧大窗户透入日光；

  52. 点击附件确认页中的 `Send`；

  53. 输入 `Delivery risk follows`；

  54. 点击 `Send`；

  55. 点击 `Add Attachment`；

  56. 点击 `Gallery`；

  57. 在缩略图中选择办公室收货桌的照片；桌面右侧叠放四个封好的牛皮纸箱，每个纸箱贴有空白白色标签，左下角有蓝色胶带机和夹板；

  58. 点击附件确认页中的 `Send`；

  59. 输入 `Three baselines accepted`；

  60. 点击 `Send`；

  61. 长按刚发送的 `Three baselines accepted`；

  62. 点击 `Reply`；

  63. 输入 `Proceed with monitored launch`；

  64. 点击 `Send`；

  65. 长按刚发送的会议室计划板照片；

  66. 点击 `Reply`；

  67. 输入 `Board owns launch sequence`；

  68. 点击 `Send`；

  69. 长按刚发送的 Markdown 发布包文件；

  70. 点击 `Reply`；

  71. 输入 `Pack binds the three photos`；

  72. 点击 `Send`；

  73. 输入 `Core team owns the window`；

  74. 点击 `Send`；

  75. 输入 `Pack and photos delivered`；

  76. 点击 `Send`；

  77. 点击 `Add Attachment`；

  78. 点击 `Gallery`；

  79. 在缩略图中选择灰色维修台上的黑色手机照片；手机玻璃从底部向上多处开裂，左侧有金属精密螺丝刀，右侧有黑色 USB-C 线缆；

  80. 点击附件确认页中的 `Send`。'
