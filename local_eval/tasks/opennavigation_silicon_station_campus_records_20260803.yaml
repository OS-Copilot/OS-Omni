    forbidden_assumptions:
    - Do not pass from route/report names alone without the associated mode/type and
      endpoint/route evidence.
    - Do not treat intermediate Directions, route cards, keyboards, dropdowns, preference
      dialogs, Start button visibility, or navigation overlays as final evidence.
  evaluation_standard: The task passes only when the final Records page visibly contains
    all three named saved routes and the associated Road closure incident report with
    the required unique note.
  durable_checks:
  - SiliconRide route record includes Bike and Stanford University.
  - StationDrive route record includes Drive and Meta Headquarters.
  - CampusTransit route record includes Transit and Mountain View Transit Center.
  - Road closure report record includes BridgeClosed and SiliconRide.
  weak_or_unverifiable_steps:
  - Keyboard dismissal, long press, Select all, exact search submission mechanics,
    route preference checkbox toggles, departure-time selection, and selection of
    a specific first/second route card are process actions and are not independently
    verified unless their saved final route/report records expose resulting durable
    text.
  false_positive_controls:
  - 'Uses four task-specific nonce strings: SiliconRide, StationDrive, CampusTransit,
    BridgeClosed.'
