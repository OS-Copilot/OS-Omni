    - Steps 1-20 create and save the SiliconRide Bike route.
    - Steps 21-40 create and save the StationDrive Drive route.
    - Steps 41-62 create and save the CampusTransit Transit route.
    - Steps 63-75 start SiliconRide navigation, save the Road closure/BridgeClosed
      incident report, then return to Records.
    data_source_priority:
