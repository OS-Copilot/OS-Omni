task_id: android.opennavigation.silicon_station_campus_records_20260803
platform: android
instruction: 'Please complete this OpenNavigation workflow using only the visible
  Android GUI. Start from Android Studio snapshot `snap_2026-08-01_16-48-36`; OpenNavigation
  is already installed and signed in. Do not Sign Out / do not log out. Finish on
  the left sidebar Records page so the final page shows the three saved routes SiliconRide,
  StationDrive, CampusTransit, plus one Road closure incident report with note BridgeClosed.


  1. Tap the OpenNavigation app icon to open the map home page.

  2. In the left sidebar, tap Recent.

  3. In the recent places list, tap Googleplex.

  4. Tap the diamond Directions button on the right side of the top search area.

  5. In the route editor, tap the circular + button to add a waypoint.

  6. Tap the newly added waypoint text field.

  7. Use the soft keyboard to enter Stanford.

  8. Tap the down arrow in the lower-left of the soft keyboard to hide the keyboard.

  9. Tap Stanford University in the result list.

  10. In the travel mode bar, select Bike.

  11. Tap the Leave now departure-time button.

  12. Tap the Options route settings button to the right of the departure time.

  13. In the Route preferences dialog, check Avoid tolls.

  14. Tap Apply preferences at the bottom of the dialog.

  15. Tap the rightmost Routes tab under the route summary.

  16. Tap the second Bike route card under the Routes tab.

  17. Tap the route name text field.

  18. Use the soft keyboard to enter SiliconRide.

  19. Tap the down arrow in the lower-left of the soft keyboard to hide the keyboard.

  20. Tap Save route to the right of the route name.

  21. In the left sidebar, tap Records and confirm SiliconRide is visible.

  22. In the left sidebar, tap Recent.

  23. In the recent places list, tap Mountain View Transit Center.

  24. Tap the diamond Directions button on the right side of the top search area.

  25. In the route editor, tap the circular + button to add a waypoint.

  26. Tap the newly added waypoint text field.

  27. Use the soft keyboard to enter Meta.

  28. Tap the down arrow in the lower-left of the soft keyboard to hide the keyboard.

  29. Tap Meta Headquarters in the result list.

  30. In the travel mode bar, select Drive.

  31. Tap the Other time departure-time button.

  32. Tap Options.

  33. In the Route preferences dialog, check Accessible route.

  34. Tap Apply preferences and wait until the page title area shows Start.

  35. Tap the route name text field showing SiliconRide.

  36. Long-press SiliconRide in the route name text field, then release.

  37. Tap Select all in the floating text menu.

  38. Use the soft keyboard to enter StationDrive.

  39. Tap the down arrow in the lower-left of the soft keyboard to hide the keyboard.

  40. Tap the blue Save route button to save StationDrive.

  41. In the left sidebar, tap Records and confirm StationDrive is visible.

  42. In the left sidebar, tap Recent.

  43. In the recent places list, tap Googleplex.

  44. Tap the diamond Directions button on the right side of the top search area.

  45. In the route editor, tap the circular + button to add a waypoint.

  46. Tap the newly added waypoint text field.

  47. Use the soft keyboard to enter Mountain View.

  48. Tap the down arrow in the lower-left of the soft keyboard to hide the keyboard.

  49. Tap Mountain View Transit Center in the result list.

  50. In the travel mode bar, select Transit.

  51. Tap the Options route settings button to the right of the departure time.

  52. In the Route preferences dialog, check Fewer transfers.

  53. In the same dialog, check Avoid highways.

  54. Tap Apply preferences at the bottom of the dialog.

  55. Tap the rightmost Routes tab under the route summary.

  56. Tap the second Transit route card under the Routes tab.

  57. Tap the route name text field showing StationDrive.

  58. Long-press StationDrive in the route name text field, then release.

  59. Tap Select all in the floating text menu.

  60. Use the soft keyboard to enter CampusTransit.

  61. Tap the down arrow in the lower-left of the soft keyboard to hide the keyboard.

  62. Tap the blue Save route button to save CampusTransit.

  63. In the left sidebar, tap Records and confirm all three saved routes are visible.

  64. In the Saved routes area, tap the SiliconRide route card.

  65. Tap the rightmost Routes tab under the route summary.

  66. Tap the first Bike route card under that tab.

  67. Tap the blue Start button on the right side of the page title area.

  68. Tap Report in the navigation overlay.

  69. In the Report an incident dialog, tap the Incident type dropdown.

  70. In the dropdown list, tap Road closure.

  71. Tap the Report note text field.

  72. Use the soft keyboard to enter BridgeClosed.

  73. Tap the down arrow in the lower-left of the soft keyboard to hide the keyboard.

  74. Tap Save report at the bottom of the dialog.

  75. In the left sidebar, tap Records so the final page shows SiliconRide, StationDrive,
  CampusTransit, Road closure, and BridgeClosed.'
