task_id: android.deltachat.delivery_claim_record_1787390185793_240468
platform: android
instruction: '1. 点击页面右下角红色方形 `+` 按钮。

  2. 在 Title 输入框中输入 `Delivery claim record`。

  3. 点击 OK。

  4. 点击空白正文编辑区。

  5. 输入 `# Delivery claim record`，并按键盘 Return 键。

  6. 输入 `Case: Apartment delivery`，并按键盘 Return 键。

  7. 输入 `## Claim scope`，并按键盘 Return 键。

  8. 输入 `Carrier: Liam route`，并按键盘 Return 键。

  9. 输入 `APartment drop was delayed`，并按键盘 Return 键。

  10. 输入 `Replacement stock is limited`，并按键盘 Return 键。

  11. 输入 `## Evidence needed`，并按键盘 Return 键。

  12. 输入 `Reference number from Liam`，并按键盘 Return 键。

  13. 输入 `- Doorway condition`，并按键盘 Return 键。

  14. 输入 `- Package placement photo`，并按键盘 Return 键。

  15. 输入 `Delivery label is visible`，并按键盘 Return 键。

  16. 输入 `Empty shelf evidence`，并按键盘 Return 键。

  17. 输入 `## Resolution`，并按键盘 Return 键。

  18. 输入 `Send record to Liam`，并按键盘 Return 键。

  19. 输入 `Pending carrier response`，并按键盘 Return 键。

  20. 输入 `Await replacement approval`，并按键盘 Return 键。

  21. 输入 `Owner: Liam claims`。

  22. 点击保存按钮。

  23. 切换到 Delta Chat。

  24. 点击新建聊天按钮。

  25. 点击 New group。

  26. 输入 `Claim Review Cell`。

  27. 点击群组描述输入框。

  28. 输入 `Delivery stock evidence`。

  29. 点击 Continue 创建群组。

  30. 输入 `Claim review opened`。

  31. 点击发送按钮。

  32. 点击顶部返回按钮回到聊天列表。

  33. 点击顶部搜索按钮。

  34. 输入 `android_bob_unread_04`。

  35. 点击 Bob Ops 的搜索结果。

  36. 长按包含 `Unread Bob expansion 04` 的消息。

  37. 点击 Copy。

  38. 点击顶部返回按钮回到搜索页。

  39. 点击搜索框清除按钮。

  40. 输入 `Nora QA`。

  41. 点击 `Nora QA` 的搜索结果。

  42. 长按包含 `Image proof from Nora QA` 的消息。

  43. 点击 Forward。

  44. 选择 Claim Review Cell。

  45. 点击发送按钮。

  46. 点击顶部返回按钮回到搜索页。

  47. 点击顶部返回按钮回到聊天列表。

  48. 点击 Saved Messages。

  49. 长按底部消息输入框。

  50. 点击 Paste。

  51. 点击发送按钮。

  52. 点击顶部返回按钮回到聊天列表。

  53. 点击 Claim Review Cell。

  54. 输入 `Two sources captured`。

  55. 点击发送按钮。

  56. 切换到 Markor。

  57. 打开 Delivery claim record.md。

  58. 按键盘 Return 键。

  59. 输入 `## Collected findings`，并按键盘 Return 键。

  60. 输入 `Finding owne: Claims desk`，并按键盘 Return 键。

  61. 输入 `Evidence set is completer`，并按键盘 Return 键。

  62. 输入 `- Parcel was near the mat`，并按键盘 Return 键。

  63. 输入 `Door photo received`，并按键盘 Return 键。

  64. 输入 `Nora image proof received`，并按键盘 Return 键。

  65. 输入 `Replacement review requested`，并按键盘 Return 键。

  66. 输入 `Next step: Carrier decision`，并按键盘 Return 键。

  67. 输入 `Owner: Claims desk`。

  68. 点击保存按钮。

  69. 点击更多选项按钮。

  70. 点击 Share。

  71. 选择以文件形式分享。

  72. 点击系统分享面板中的 Claim Review Cell。

  73. 点击发送按钮。

  74. 输入 `Claim record delivered`。

  75. 点击发送按钮。

  76. 点击附件按钮。

  77. 点击 Gallery。

  78. 在图片网格中选择明亮客厅的照片；米白色沙发前的浅色地毯上放着一个封好的纸箱，左侧有深色茶几和小盆栽，后方可见落地灯、大型绿植与阳台玻璃门。

  79. 点击发送按钮。

  80. 点击顶部返回按钮停留在聊天列表，完成室内放置、图片证明和索赔记录的证据关联。'
