task_id: android.opennote.city_food_469121
platform: android
instruction: '1. 点击 Email 输入框使其获得焦点。

  2. 在 Email 输入框中输入 lina@opennote.local。

  3. 点击 Password 输入框使其获得焦点。

  4. 在 Password 输入框中输入 note2026。

  5. 点击 Login 按钮登录 Lina 的 OpenNote 账户。

  6. 点击底部 Me 标签进入个人主页。

  7. 点击 Edit Profile 按钮展开资料表单。

  8. 点击 Role 行中的现有角色文本。

  9. 选择 Role 行中的全部现有角色文本。

  10. 在 Role 输入框中输入 Food route editor。

  11. 点击 Save Profile 按钮保存新的角色信息。

  12. 点击底部 Explore 标签返回推荐笔记流。

  13. 点击标题为 Secondhand coat notes from tiny bedroom 的笔记卡片。

  14. 在笔记详情页面向上滑动，直到 Like、Save 和评论区同时可见，以便随后点击 Save 并发送评论。

  15. 点击 Like 按钮为该笔记点赞。

  16. 点击 Save 按钮收藏该笔记。

  17. 点击评论输入框使其获得焦点。

  18. 在评论输入框中输入 Layer note saved。

  19. 点击屏幕左下方的收起键盘箭头隐藏软键盘。

  20. 点击 Send 按钮发布评论。

  21. 点击详情右上角的 X 按钮关闭笔记详情。

  22. 点击标题为 I changed one thing about picnic rice box 的笔记卡片。

  23. 在笔记详情页面向上滑动，直到 Like、Save 和评论区同时可见，以便随后点击 Save 并发送评论。

  24. 点击 Like 按钮为该笔记点赞。

  25. 点击 Save 按钮收藏该笔记。

  26. 点击评论输入框使其获得焦点。

  27. 在评论输入框中输入 Rice tip is useful。

  28. 点击屏幕左下方的收起键盘箭头隐藏软键盘。

  29. 点击 Send 按钮发布评论。

  30. 点击详情右上角的 X 按钮关闭笔记详情。

  31. 点击底部中央的 + 按钮打开 New Note 表单。

  32. 在已自动获得焦点的 Title 输入框中输入 Lunch route card。

  33. 点击 Body 文本框使其获得焦点。

  34. 在 Body 文本框中输入 Pack fruit first。

  35. 点击 New Note 表单中的 Category 下拉框以打开分类选项列表。

  36. 在分类列表中点击 Food 选项。

  37. 点击 Location 输入框使其获得焦点。

  38. 在 Location 输入框中输入 Maple Market。

  39. 点击 Tags 输入框使其获得焦点。

  40. 在 Tags 输入框中输入 lunch route。

  41. 点击屏幕左下方的收起键盘箭头隐藏软键盘。

  42. 点击 Use text cover 复选框启用文字封面。

  43. 点击文字封面提示输入框使其获得焦点。

  44. 在文字封面提示输入框中输入 Lunch map cover。

  45. 在 New Note 表单页面向上滑动，直到 Publish 按钮完整可见，以便随后点击 Publish 提交并发布当前笔记。

  46. 点击 Publish 按钮提交并发布当前笔记。

  47. 点击底部中央的 + 按钮打开 New Note 表单。

  48. 在已自动获得焦点的 Title 输入框中输入 Lemon stop notes。

  49. 点击 Body 文本框使其获得焦点。

  50. 在 Body 文本框中输入 Order small slice。

  51. 点击 New Note 表单中的 Category 下拉框以打开分类选项列表。

  52. 在分类列表中点击 Food 选项。

  53. 点击 Location 输入框使其获得焦点。

  54. 在 Location 输入框中输入 Union Station。

  55. 点击 Tags 输入框使其获得焦点。

  56. 在 Tags 输入框中输入 lemon stop。

  57. 点击屏幕左下方的收起键盘箭头隐藏软键盘。

  58. 点击 Use text cover 复选框启用文字封面。

  59. 点击文字封面提示输入框使其获得焦点。

  60. 在文字封面提示输入框中输入 Lemon stop cover。

  61. 在 New Note 表单页面向上滑动，直到 Publish 按钮完整可见，以便随后点击 Publish 提交并发布当前笔记。

  62. 点击 Publish 按钮提交并发布当前笔记。

  63. 点击底部中央的 + 按钮打开 New Note 表单。

  64. 在已自动获得焦点的 Title 输入框中输入 Picnic prep list。

  65. 点击 Body 文本框使其获得焦点。

  66. 在 Body 文本框中输入 Keep drinks cold。

  67. 点击 New Note 表单中的 Category 下拉框以打开分类选项列表。

  68. 在分类列表中点击 Home 选项。

  69. 点击 Location 输入框使其获得焦点。

  70. 在 Location 输入框中输入 Willow Park。

  71. 点击 Tags 输入框使其获得焦点。

  72. 在 Tags 输入框中输入 picnic prep。

  73. 点击屏幕左下方的收起键盘箭头隐藏软键盘。

  74. 点击 Use text cover 复选框启用文字封面。

  75. 点击文字封面提示输入框使其获得焦点。

  76. 在文字封面提示输入框中输入 Picnic list cover。

  77. 在 New Note 表单页面向上滑动，直到 Publish 按钮完整可见，以便随后点击 Publish 提交并发布当前笔记。

  78. 点击 Publish 按钮提交并发布当前笔记。

