    expected_order_ids:
    - TB1781113752081
    - TBH-LUCAS-20260518-001
    - TBH-LUCAS-20260429-002
    - TBH-LUCAS-20260410-003
    - TBH-LUCAS-20260321-004
    forbidden_order_note: Family weekend
    forbidden_product_ids:
    - p2221
    - p2223
    - p2225
    - p2224
    - p2227
    - p2220
    source_initializer: evaluators.cua_review.initializers.android.openshop:OpenShopCheckoutSnapshotBaselineInitializer
evaluation:
  evaluator_id: evaluators.android.openshop_family_weekend_checkout_20260821:OpenShopAttributableCheckoutEvaluator
  params:
    app_package: com.killt.openshop
    local_state_key: openshop.localState.v3
    account_phone: '13800138000'
    expected_order_count: 6
    expected_baseline_order_ids:
    - TB1781113752081
    - TBH-LUCAS-20260518-001
    - TBH-LUCAS-20260429-002
    - TBH-LUCAS-20260410-003
    - TBH-LUCAS-20260321-004
    new_order:
      address_id: addr-home
      payment_method_id: wechat
      note: Family weekend
      status: Awaiting Shipment
      items:
      - product_id: p2221
        quantity: 2
        selected_spec: 6-12 Months
      - product_id: p2223
        quantity: 2
        selected_spec: Toddler
      - product_id: p2225
        quantity: 2
        selected_spec: Family Set
      - product_id: p2224
        quantity: 1
        selected_spec: Age 5+
      - product_id: p2227
        quantity: 1
        selected_spec: Age 8+
      - product_id: p2220
        quantity: 1
        selected_spec: Newborn
    timeout_seconds: 12
    poll_interval_seconds: 0.5
limits:
  max_steps: 100
  step_timeout_seconds: 120
