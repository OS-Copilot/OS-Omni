task_id: android.openshop.family_weekend_checkout_20260821
platform: android
instruction: OpenShop 已经登录 Lucas Lin 账号。请使用 Android GUI 完成一份家庭周末用品订单，不要退出登录。 打开 OpenShop
  后，从首页 Categories 点击 Baby，进入商品列表并打开 BebeCare BPA-Free Baby Grooming Kit，选择 6-12 Months
  规格并加入购物车。加入每件商品后，向下滑动回到商品详情顶部，点击页面 顶部的 Back to Home 按钮返回首页；不要使用 Android 系统返回键退出应用。返回首页后，使用顶部搜索栏
  和右侧 Search 按钮，严格按顺序使用以下短搜索词查找并打开商品，将指定规格各加入购物车 1 件：输入 “Silicone Bib”查找 Naptime Co
  Travel Silicone Bib，选择 Toddler；输入“Board Game”查找 BrightPlay Learning Board Game，选择
  Family Set；输入“Soft Rain Jacket”查找 WonderBox Soft Rain Jacket， 选择 Age 5+；输入“Colored
  Pencil Tin”查找 Happy Desk Washable Colored Pencil Tin，选择 Age 8+； 输入“Feeding Plate
  Set”查找 Naptime Co Soft Feeding Plate Set，选择 Newborn。需要时通过向上或向下 滑动查看搜索结果、商品列表、Options、商品详情顶部及页面底部按钮。不要重复加入已经显示
  Added to Cart 的商品。 点击底部购物栏中的 Checkout，在购物车中把 BebeCare BPA-Free Baby Grooming Kit、Naptime
  Co Travel Silicone Bib、BrightPlay Learning Board Game 的数量各点击一次加号，使这三种商品各为 2 件； 另外三种商品各保持
  1 件。确认购物车中只有上述 6 种商品且规格、数量正确，然后点击 Proceed to Checkout。在 Select Shipping Address
  中选择 Home，在 Payment Method 中选择 WeChat Pay， 在 Order Note 文本框输入精确文本“Family weekend”，最后点击
  Place Order。下单后停留在订单结果或 订单历史页面，不要 Sign Out / 不要退出登录。
