  description: Create one exact six-product family-weekend order with three quantity
    increases, Home delivery, WeChat Pay, and an exact note.
  prerequisites:
  - Before initialization, Android Studio Quail 1 AVD AndroidWorldAvd_20260611_1 is
    at snapshot snap_2026-08-03_16-11-57.
  - The snapshot contains OpenShop com.killt.openshop and the logged-in Lucas Lin
    account 13800138000.
  - The snapshot baseline has an empty cart and exactly the five declared baseline
    order IDs.
  - The snapshot contains neither the exact note Family weekend nor any of product
    IDs p2221, p2223, p2225, p2224, p2227, p2220 in Lucas's baseline orders.
  initializer_behavior: Opens OpenShop without clearing app data and performs read-only
    localStorage baseline checks. It never restores a snapshot or performs any target
    shopping action.
  evaluation_scope:
  - Exact logged-in account and empty final cart.
  - All five baseline order IDs preserved, total order count exactly six, and exactly
    one non-baseline latest order.
  - The new order has a TB-prefixed ID, a persisted createdAt value, Home address,
    WeChat Pay, exact note Family weekend, and Awaiting Shipment status.
  - The new order contains exactly six unique product IDs with the required specifications
    and quantities; no substring matching is used.
  unverifiable_process_steps:
  - Individual category/search navigation, scrolling gestures, Back to Home transitions,
    Search-button presses, and the three individual plus-button click events are not
    independently provable from final state.
  - 'The evaluator instead verifies the durable result of those actions: exact product
    IDs, selected specifications, and final quantities.'
  - The requested final visible page is a human-verification condition because OpenShop
    localStorage does not persist the currently displayed route.
  false_positive_controls:
  - The initializer rejects the wrong account, non-empty cart, any order-fingerprint
    change, an existing exact target note, or target products already present in baseline
    orders.
  - The evaluator requires all baseline IDs plus exactly one new latest order and
    an exact total order count, preventing an unrelated old order or partial checkout
    from passing.
  - Address, payment, note, status, all six product IDs, quantities, and full selected-spec
    strings must match exactly.
  manual_verifier_note: scripts/evaluate_android_task_only.py does not restore/reset
    the VM, run the initializer, invoke an AI agent, or perform GUI/business-state
    writes. Full-auto and eval-only commands must both bind snapshot name snap_2026-08-03_16-11-57.
