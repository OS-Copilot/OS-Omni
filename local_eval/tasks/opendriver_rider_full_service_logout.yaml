task_id: android.opendriver.rider_full_service_logout
platform: android
instruction: '点击opendriver打开应用

  点击 Rider 角色。

  2. 点击 Name 输入框。

  3. 输入 Avery。

  4. 点击键盘下一项。

  5. 输入 rider@example.com。

  6. 点击键盘下一项。

  7. 输入 password123。

  8. 点击键盘确认键。

  9. 点击 Login。

  10. 点击 Ride 标签。

  11. 点击 Use current location。

  12. 点击 Destination 输入框。

  13. 点击目的地匹配项 University Avenue, Palo Alto, CA。

  14. 点击 Edit pickup pin。

  15. 点击 Edit destination pin。

  16. 点击 Save destination。

  17. 点击 Now。

  18. 点击 Active 标签。

  19. 点击 Save invoice PDF。

  20. 点击 Rate this trip。

  21. 点击 Book another ride。

  22. 点击 Ride 标签。

  23. 点击 Destination 输入框。

  24. 点击目的地匹配项 University Avenue, Palo Alto, CA。

  25. 点击 Swap pickup and destination。

  26. 点击 Add stop。

  27. 点击 History 标签。

  28. 点击 Ride history。

  29. 点击第一条 University Avenue, Palo Alto, CA 行程记录。

  30. 点击 Scheduled rides。

  31. 点击 scheduled 行程卡片。

  32. 点击 completed 行程卡片。

  33. 点击 Active 标签。

  34. 点击 Save invoice PDF。

  35. 点击 History 标签。

  36. 点击收据区域 Receipt。

  37. 点击 Safety 标签。

  38. 点击 Share trip。

  39. 点击 Emergency help。

  40. 点击 Ride PIN。

  41. 点击 Category 下拉框。

  42. 点击 safety concern。

  43. 点击消息输入框。

  44. 输入 Need ride help。

  45. 点击键盘确认键。

  46. 点击 Create support ticket。

  47. 点击 Reply to ticket。

  48. 点击 Safety 标签。

  49. 点击 Payments - Open 工单区域。

  50. 点击 rider issue - Open 工单区域。

  51. 点击 Account 标签。

  52. 点击顶部 Account 按钮。

  53. 点击 Edit profile。

  54. 点击 Wallet。

  55. 点击 Coupons。

  56. 点击 Notifications。

  57. 点击 Saved places。

  58. 点击 Ride 标签。

  59. 向上滑动行程页面。

  60. 点击 No payment。

  61. 点击 Now。

  62. 点击顶部 Refresh。

  63. 点击 History 标签。

  64. 点击顶部 Refresh。

  65. 点击 Account 标签。

  66. 点击 Logout。'
